# Native Rust architecture policy.  The minimal preset is intentional: this
# repository already has a measured complexity/Clippy policy, while this gate
# owns the native architecture profile.  Raising the preset would turn existing
# panic and sync-I/O census debt into an unmeasured release blocker.
preset = "minimal"
fail_on = "error"

[analyzer]
# arch-lint's syn analyzer walks `<root>/**/*.rs`; the workspace is a Cargo
# multi-crate project, so the root must include both the binary/client sources
# and every crate under `crates/`. Keeping this at `.` is also explicit about
# the path passed by the hook (`arch-lint check ... .`).
root = "."
exclude = [
    # `.gitignore` declares `target/`, `target-isolated/` AND `target-*/`: every
    # worktree builds into its own isolated target dir (AGENTS.md). Matching only
    # `target/` here left cargo output inside the gate's declared root `.`, so the
    # finding total moved with build state -- 4,638 / 4,642 / 4,650 were measured
    # on three occasions with no source change between them. A gate whose
    # denominator depends on whether someone has built cannot be a baseline for
    # anything. Keep this list in step with `.gitignore`.
    "**/target/**",
    "**/target-*/**",
    "**/generated/**",
    "**/vendor/**",
    "**/third_party/**",
    "**/fixtures/**",
]
respect_gitignore = true

# AL001 is already a measured CCCC/KISS concern for this repository: enabling
# it here would turn the existing production panic census into an unmeasured
# release blocker.  Keep arch-lint focused on dependency direction until that
# debt is deliberately reduced and the rule can be enabled with evidence.
[rules.no-unwrap-expect]
enabled = false
