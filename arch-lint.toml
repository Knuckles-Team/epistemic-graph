# Native Rust static-analysis policy for arch-lint 0.5.0.
#
# The CLI does not use `preset` to select rules. Keep the complete supported
# rule set explicit here and pass the enabled identifiers explicitly from the
# checked-in wrapper. This file is not a dependency-direction policy;
# arch-lint 0.5.0 has no Rust dependency-direction rule.
fail_on = "error"

[analyzer]
root = "."
exclude = [
    # Build products are not source. Both spellings are used by isolated
    # worktrees and must remain excluded so the denominator is build-state
    # independent. Tracked generated code, vendors, and fixtures remain in
    # the source universe: broad source exclusions would make the gate partial.
    "**/target/**",
    "**/target-*/**",
]
respect_gitignore = true

# AL001 is not silently selected by a preset. Panic policy is owned by the
# existing CCCC/KISS/Clippy gates; this explicit false is part of the contract.
[rules.no-unwrap-expect]
enabled = false
severity = "error"

[rules.no-sync-io]
enabled = true
severity = "error"

[rules.no-error-swallowing]
enabled = true
severity = "warning"

[rules.handler-complexity]
enabled = true
severity = "warning"

[rules.require-thiserror]
enabled = true
severity = "warning"

[rules.require-tracing]
enabled = true
severity = "warning"

[rules.tracing-env-init]
enabled = true
severity = "warning"

[rules.no-silent-result-drop]
enabled = true
severity = "warning"
