default_language_version:
  python: python3
# `git push` must run the FULL gate, not a subset.
#
# Two independent holes made the heavy hooks dead code: (a) only the
# `pre-commit` git hook was ever installed, so `git push` ran NOTHING, and
# (b) the heavy hooks are staged pre-push/manual, so `pre-commit run
# --all-files` (commit stage) skipped them too. Net effect: cargo-test-full,
# cargo-clippy-all-features, replay-determinism, wheel-smoke and pytest --
# the mirrors of CI's slowest, most failure-prone jobs -- never ran locally
# at all, and CI was the first place anything found out.
#
# `default_install_hook_types` makes `pre-commit install` wire the pre-push
# hook as well; `default_stages` makes every hook that does not name its own
# stages run at BOTH stages, so a push runs the commit-stage gates PLUS the
# heavy ones. Pushing is now the slow, complete gate on purpose.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]  # P0.3: was [pre-commit, pre-push] -- every genuinely-heavy hook below now carries its own explicit stages:
exclude: 'dotnet|node_modules|target'
ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: 'monthly'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: '.*\.db$'
  - id: check-ast
    exclude: ^(tests/|test/|scripts/|script/)
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
    exclude: .gitignore
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 6fec9b7edb08fd9989088709d864a7826dc74e80 # v0.15.12
  hooks:
  - id: ruff-check
    args: ["--fix", "--ignore=E402,B008,E501"]
    exclude: ^(tests/|test/|scripts/|script/)
  - id: ruff-format
    exclude: ^(tests/|test/|scripts/|script/)
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
  hooks:
  - id: mypy
    additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260518, types-requests==2.33.0.20260518, types-setuptools==83.0.0.20260706]
    args: ["--ignore-missing-imports"]
    exclude: ^(scripts/|script/|tests/|test/)
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", "node_modules,dotnet,.venv,venv,node_modules,.git,build,dist,target"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
    args: ["-L", "ans,linar,nam,tread,ot,ser,inh,copyin,unparseable,implementors,implementor,nd,datas,alls,re-declaring,re-declares,fals,paeth", "--ignore-words=.codespellignore"]
    exclude: ^(tests/|test/|scripts/|script/|.*lock.*|Cargo.lock|\.specify/)
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101,B404,B603"]
    exclude: ^(tests/|test/|scripts/|script/|__tests__/)
- repo: local
  hooks:
  - id: dependency-readiness
    name: Dependency readiness — every declared intra-fleet constraint is installable
    # Prefer the local repository-manager checkout, fall back to PyPI (CI).
    # PyPI still holds 2.0.1, which predates this module entirely, so a plain
    # `--with repository-manager` can never satisfy the import and the gate
    # fails everywhere it is declared. --no-project keeps the tool out of this
    # repo's own env (eg is Python 3.11; the tool needs >=3.12) and
    # --prerelease=allow is required because agent-utilities depends on
    # fastmcp>=4.0.0b1.
    entry: bash -c 'P=../agents/repository-manager; [ -d "$P" ] || P=repository-manager; uv run --no-project --python 3.12 --prerelease=allow --with "$P" python -m repository_manager.dependency_readiness .'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: uv-lock
    name: uv-lock (verify, never mutate)
    entry: bash -c 'uv lock --check'
    language: system
    files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
    pass_filenames: false
    stages: [pre-push, manual]
- repo: local
  hooks:
  - id: lane-guard
    name: Lane guard — canonical checkout read-only + stray CARGO_TARGET_DIR (D-CP-3/D-CP-4 reach)
    # Reuses agent-utilities' OWN check_lane_guard.py unmodified from the sibling
    # checkout (the SAME idiom check-stubs/check-sprawl below already use) --
    # the script resolves its target repo from cwd, which pre-commit always
    # sets to THIS repo's root, so it guards epistemic-graph, not agent-utilities.
    # See docs/architecture/lane-concurrency.md (agent-utilities) and
    # reports/deferred/lane-concurrency-protocol.md (D-CP-3, D-CP-4).
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_lane_guard.py"'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-stubs
    name: Check for Active Stubs and TODOs
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_stubs.py" "$@"' --
    language: system
    types: [python]
  - id: check-sprawl
    name: Guardrail — anti-sprawl
    entry: bash -c 'repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${AGENT_UTILITIES_ROOT:-"$(dirname "$repo")/agent-utilities"}; python3 "$root/scripts/check_sprawl.py" "$@"' --
    language: system
    args: ["."]
    pass_filenames: false
    always_run: true
  - id: check-bumpversion
    name: validate bumpversion config
    entry: |-
      bash -c 'if [ -f ".bumpversion.cfg" ]; then bump2version patch --dry-run --allow-dirty; fi'
    language: system
    pass_filenames: false
    always_run: true
  - id: complexity-staged
    name: Complexity (cccc) - no NEW function over cyclomatic 10 / cognitive 15, none regressed
    entry: python3 scripts/check_complexity_staged.py
    language: system
    pass_filenames: false
    always_run: true
  # BUG-CX-136 scanner profile.  These hooks resolve already-installed tools
  # only; provisioning belongs to the CI scanner-quality job below, never to a
  # developer hook.  The wrappers own staged/index semantics and fail closed
  # on a missing, drifted, or malformed tool/report.
  - id: dupehound-changed-functions
    name: Dupehound — changed functions only (no new structural clones)
    entry: python3 scripts/check_dupehound.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit]
  - id: kiss-changed-rust
    name: KISS — changed Rust source (one path per invocation)
    entry: bash scripts/check_kiss_staged.sh
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit]
  - id: jscpd-differential
    name: jscpd — differential clone gate (new pairs only)
    entry: python3 scripts/check_duplication.py enforce
    language: system
    pass_filenames: false
    require_serial: true
    stages: [pre-push, manual]
  - id: jscpd-census
    name: jscpd — tracked-tree census (advisory; no baseline)
    entry: python3 scripts/check_duplication.py census
    language: system
    pass_filenames: false
    require_serial: true
    stages: [pre-push, manual]
# ─────────────────────────────────────────────────────────────────────────
# Rust CI parity — mirrors .github/workflows/rust-ci.yml `lint-and-test` PLUS a
# representative wheel build from release-build.yml, so `pre-commit run` catches
# locally everything CI checks (no more push-then-discover). The FAST gates (fmt,
# clippy, lower-crate + slim-server tests) run on the default `pre-commit` stage.
# The HEAVY gates (the ~9-min facade-full test matrix and the maturin wheel smoke
# ~release LTO) are staged `pre-push` + `manual` so they don't tax every commit
# but still run in the parity check via:
#   pre-commit run --all-files --hook-stage pre-push   # or: --hook-stage manual
# ─────────────────────────────────────────────────────────────────────────
- repo: local
  hooks:
  - id: documentation-contract
    name: Documentation contract (Cargo, ledger, MkDocs)
    entry: python3 scripts/check_documentation_contract.py
    language: system
    pass_filenames: false
    always_run: true
  # Whole-tree scanner profile.  Findings are intentionally advisory census
  # numbers (there is no checked-in baseline); missing tools, version drift,
  # parse errors, and scanner/config failures remain hard environment errors.
  # The explicit git ls-files universe keeps ignored/untracked build output out
  # while ensuring a census does not accidentally scan only a convenient dir.
  - id: cccc-census
    name: CCCC — tracked source census (advisory; no baseline)
    entry: |-
      bash -c '
      set -euo pipefail
      expected="$(PYTHONPATH=scripts python3 -c "from scanner_contract import load_contract; print(load_contract().cccc_version)")" || { echo "cccc census: invalid scanner contract" >&2; exit 2; }
      cccc_bin="${CCCC_BIN:-cccc}"
      command -v "$cccc_bin" >/dev/null 2>&1 || { echo "cccc census: CCCC is not installed; install the pinned tool before running hooks" >&2; exit 2; }
      got="$("$cccc_bin" --version 2>/dev/null)" || { echo "cccc census: cccc --version failed" >&2; exit 2; }
      [ "$got" = "cccc $expected" ] || { echo "cccc census: expected cccc $expected, got $got" >&2; exit 2; }
      report="$(mktemp "${TMPDIR:-/tmp}/eg-cccc-census.XXXXXX.json")"
      trap "rm -f \"$report\"" EXIT
      mapfile -d "" files < <(python3 scripts/list_scanner_sources.py cccc)
      [ "${#files[@]}" -gt 0 ] || { echo "cccc census: no tracked CCCC-supported source files" >&2; exit 2; }
      languages="$(PYTHONPATH=scripts python3 -c "from scanner_contract import cccc_languages_arg; print(cccc_languages_arg())")" || { echo "cccc census: invalid language registry" >&2; exit 2; }
      "$cccc_bin" --no-config --min 0 --lang "$languages" "${files[@]}" > "$report"
      python3 scripts/validate_cccc_census.py "$report"
      '
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push, manual]
  - id: kiss-census
    name: KISS — tracked Rust census (advisory; no baseline)
    entry: |-
      bash -c '
      set -euo pipefail
      expected="$(PYTHONPATH=scripts python3 -c "from scanner_contract import load_contract; print(load_contract().kiss_version)")" || { echo "kiss census: invalid scanner contract" >&2; exit 2; }
      kiss_bin="${KISS_BIN:-kiss}"
      command -v "$kiss_bin" >/dev/null 2>&1 || { echo "kiss census: KISS is not installed; install the pinned tool before running hooks" >&2; exit 2; }
      got="$("$kiss_bin" --version 2>/dev/null)" || { echo "kiss census: kiss --version failed" >&2; exit 2; }
      [ "$got" = "kiss $expected" ] || { echo "kiss census: expected kiss $expected, got $got" >&2; exit 2; }
      [ -f .kiss/kiss.toml ] || { echo "kiss census: missing .kiss/kiss.toml" >&2; exit 2; }
      [ ! -e .kissconfig ] || { echo "kiss census: .kissconfig is forbidden because it disables measured rules" >&2; exit 2; }
      mapfile -d "" files < <(python3 scripts/list_scanner_sources.py kiss)
      [ "${#files[@]}" -gt 0 ] || { echo "kiss census: no tracked Rust source files" >&2; exit 2; }
      total=0
      for path in "${files[@]}"; do
        set +e
        output="$("$kiss_bin" check --config .kiss/kiss.toml --lang rust "$path" 2>&1)"
        status=$?
        set -e
        if grep -q "Unknown config key" <<< "$output"; then printf "%s\\n" "$output" >&2; echo "kiss census: KISS rejected a config key" >&2; exit 2; fi
        if [ "$status" -gt 1 ]; then printf "%s\\n" "$output" >&2; echo "kiss census: KISS failed on $path with exit $status" >&2; exit 2; fi
        count="$(grep -c "^VIOLATION:" <<< "$output" || true)"
        if { [ "$status" -eq 0 ] && [ "$count" -ne 0 ]; } || { [ "$status" -eq 1 ] && [ "$count" -eq 0 ]; }; then printf "%s\\n" "$output" >&2; echo "kiss census: exit status and report disagree for $path" >&2; exit 2; fi
        total=$((total + count))
      done
      printf "kiss census: %s tracked Rust file(s), %s violation(s); findings are advisory\\n" "${#files[@]}" "$total"
      exit 0
      '
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push, manual]
  - id: import-linter-architecture
    name: Python architecture — import-linter
    entry: |-
      bash -c '
      set -euo pipefail
      command -v lint-imports >/dev/null 2>&1 || { echo "import-linter: lint-imports is not installed; install the pinned tool before running hooks" >&2; exit 2; }
      expected="$(PYTHONPATH=scripts python3 -c "from scanner_contract import load_contract; print(load_contract().import_linter_version)")" || { echo "import-linter: invalid scanner contract" >&2; exit 2; }
      got="$(python3 -c "from importlib.metadata import version; print(version(\"import-linter\"))")" || { echo "import-linter: package metadata is unavailable" >&2; exit 2; }
      [ "$got" = "$expected" ] || { echo "import-linter: expected $expected, got $got" >&2; exit 2; }
      lint-imports --version >/dev/null 2>&1 || { echo "import-linter: lint-imports --version failed" >&2; exit 2; }
      exec lint-imports --config .importlinter --no-cache
      '
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit, pre-push, manual]
  - id: dependency-cruiser-architecture
    name: JavaScript architecture — dependency-cruiser
    entry: |-
      bash -c '
      set -euo pipefail
      command -v depcruise >/dev/null 2>&1 || { echo "dependency-cruiser: depcruise is not installed; install the pinned tool before running hooks" >&2; exit 2; }
      expected="$(PYTHONPATH=scripts python3 -c "from scanner_contract import load_contract; print(load_contract().dependency_cruiser_version)")" || { echo "dependency-cruiser: invalid scanner contract" >&2; exit 2; }
      got="$(depcruise --version 2>&1)" || { echo "dependency-cruiser: depcruise --version failed" >&2; exit 2; }
      [ "$got" = "$expected" ] || { echo "dependency-cruiser: expected $expected, got $got" >&2; exit 2; }
      exec depcruise --validate --config clients/js/.dependency-cruiser.cjs clients/js/index.mjs
      '
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit, pre-push, manual]
  - id: rust-arch-lint
    name: Rust architecture — arch-lint
    entry: python3 scripts/check_rust_arch_lint.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit, pre-push, manual]
  - id: canonical-property-schema
    name: Canonical structural property schema
    entry: python3 scripts/check_canonical_property_schema.py
    language: system
    pass_filenames: false
    always_run: true
  - id: epistemic-operations-protocol
    name: Epistemic Operations manifest ⇄ Rust DTO parity
    entry: python3 scripts/check_epistemic_operations_protocol.py
    language: system
    pass_filenames: false
    always_run: true
  # RF-ADR-006: component, crate, type, trait, function, module and table names
  # carry no V<n>/_v<n> suffix. Pure stdlib, no cargo, no wheel; always_run so a
  # `--files`-scoped commit cannot skip it (the whole point is a tree-wide sweep).
  - id: no-version-suffixes
    name: RF-ADR-006 — no version-suffixed component names
    entry: python3 tests/test_no_version_suffixes.py
    language: system
    pass_filenames: false
    always_run: true
  # w5-ci-gates-local (D-W5CG-1): rust-ci.yml `lint-and-test`'s first four
  # architecture-gate steps ran ONLY in CI before this — pure-stdlib, no cargo,
  # no wheel build, each <0.3s measured cold on this worktree. Same shape as
  # documentation-contract/canonical-property-schema/epistemic-operations-protocol
  # above (already local); this closes the rest of that job's cheap-script surface.
  - id: p2-modality-architecture
    name: P2 modality architecture gate
    entry: python3 scripts/check_p2_modality_architecture.py
    language: system
    pass_filenames: false
    always_run: true
  - id: p2-analytics-reasoning-architecture
    name: P2 analytics and reasoning architecture gate
    entry: python3 scripts/check_p2_analytics_reasoning_architecture.py
    language: system
    pass_filenames: false
    always_run: true
  - id: lazy-lifecycle-architecture
    name: Bounded lazy lifecycle architecture gate
    entry: python3 scripts/check_lazy_lifecycle_architecture.py
    language: system
    pass_filenames: false
    always_run: true
  # Currently RED on main pending w3-eg-ci-green landing (D-EGCG-1: ROS2 CDC does
  # not fail closed under active row ownership, fix built+verified in that lane's
  # worktree, not yet merged). Wiring it here is deliberate, not a mistake: this
  # is the exact CI-only check the operator flagged (CI failed on it, pre-commit
  # never saw it). Enabling it now means local `git commit` reproduces the real
  # CI verdict instead of hiding it — same precedent already accepted for this
  # repo's whole hook suite in D-CIP-11 ("this is the correct closing of the gap,
  # not a new defect"). It will self-clear the moment w3-eg-ci-green lands.
  - id: universal-read-rls-architecture
    name: Universal served-read RLS and carrier-ownership architecture gate
    entry: python3 scripts/check_universal_read_rls.py
    language: system
    pass_filenames: false
    always_run: true
  - id: exact-release-campaigns-architecture
    name: Exact protocol/multimodal/KnowledgeBatch/reasoning campaign architecture gate
    entry: python3 scripts/check_exact_release_campaigns.py
    language: system
    pass_filenames: false
    always_run: true
  # CX wD10 WD10-R-EGGATES (BUG-CX-112): these four were wired to neither
  # pre-commit nor CI. Two (persisted-mutation-contract, current-only-
  # architecture) had also gone stale following the 2026-08-25 durable_apply
  # hoist (3810eb00) -- neither followed eg_core::durable_apply, so both
  # measured a partial universe and reported ~50 methods "missing" that are
  # actually present, permanently red and teaching everyone to ignore them.
  # Fixed to follow the hoist, fixed several further false-negatives the fix
  # then exposed (dispatch/sparql_http decomposition the checks' literal-text
  # anchors hadn't kept up with), verified each genuinely catches a planted
  # violation, and reprofiled persisted-mutation-contract from ~4.7s to
  # ~0.5-0.8s (an O(candidates x file-size) helper was re-searching all of
  # dispatch.rs per candidate). Pure stdlib, no cargo/build, safe for the
  # commit stage. `check_mounted_kernel.py` and `check_exact_fault_restart_
  # harness.py`'s sibling `certify_exact_fault_restart.py` release-gate path
  # are deliberately NOT wired here -- see scripts/check_mounted_kernel.py's
  # own module docstring for the former (deploy-time artifact, not a commit-
  # time property; wiring it to pre-commit would red every commit on a
  # checkout that hasn't run build_numeric_kernel.py, and this repo's own CI
  # never builds the editable-mount kernel either) and the lane report for
  # what wiring either would require.
  - id: persisted-mutation-contract
    name: Persisted mutation/projection contract (current-only durability) gate
    entry: python3 scripts/check_persisted_mutation_contract.py
    language: system
    pass_filenames: false
    always_run: true
  - id: current-only-architecture
    name: Current-only mutation/projection persistence architecture gate
    entry: python3 scripts/check_current_only_architecture.py
    language: system
    pass_filenames: false
    always_run: true
  - id: exact-fault-restart-harness-architecture
    name: Exact-binary fault/restart certification harness architecture gate
    entry: python3 scripts/check_exact_fault_restart_harness.py
    language: system
    pass_filenames: false
    always_run: true
  # GRAPH-POLICY-LEASE-CONTRACT.md §3 hardening (`MintAuthorization`,
  # crates/eg-core/src/isolation.rs): keeps `mint_policy_decision_lease` to its one
  # traced production call site (src/server/dispatch.rs) so a second caller can
  # never silently appear without an audit. Pure stdlib text scan, no cargo/build,
  # safe for the commit stage; catch/no-false-positive proof against a planted
  # second call site is in the W6-MINT lane report.
  - id: mint-lease-call-sites
    name: mint_policy_decision_lease has one production call site
    entry: python3 scripts/check_mint_lease_call_sites.py
    language: system
    pass_filenames: false
    always_run: true
  - id: scale-documentation
    name: Bounded, source-anchored scaling documentation register
    entry: python3 scripts/check_scale_documentation.py
    language: system
    pass_filenames: false
    always_run: true
  # ── WIRING gates ──────────────────────────────────────────────────────────
  # Every gate above this block measures code SHAPE: complexity, size,
  # duplication, layering, lint. Each of the four below measures whether a
  # thing that EXISTS is CONNECTED, which no shape measure can see. An
  # undeclared module is short, simple, unduplicated and correctly layered; a
  # method with no dispatch arm is a clean enum variant; an unregistered table
  # is a tidy constant; an unresolved pin is a validated field. Each of the
  # four defects these were built from passed every scanner in this file.
  #
  # All four are pure stdlib text/AST scans over the compiler-declared module
  # tree -- no cargo, no build, no network.
  # STAGING NOTE (owner-stamped, 2026-09-11). `orphan-modules` and
  # `pinned-reference-resolution` are RED BY DESIGN on the current tree: they
  # report real, named, tracked debt (2 orphan roots / 163 KB; 4 unresolved
  # reference edges + 2 unpinned references). They are NOT allowlisted,
  # suppressed or weakened, and they still FAIL — they run at pre-push and in
  # every explicit gate sweep.
  #
  # They are held off `pre-commit` for one reason: a permanently-failing
  # pre-commit hook forces every commit to use --no-verify, which silently
  # disables the OTHER 60 gates too. That is not hypothetical — it is exactly
  # how a broken dupehound gate and four files of EOF debt reached main in this
  # program. Blocking one class of debt at the cost of disabling all enforcement
  # is a net loss.
  #
  # RETURN THEM TO `pre-commit` the moment their findings reach zero. Whoever
  # closes the last orphan or the last unresolved edge owns that edit.
  - id: orphan-modules
    name: Every tracked Rust file is compiled by some cargo target
    entry: python3 scripts/check_orphan_modules.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
  - id: contract-method-reachability
    name: Every contract method reaches a dispatch arm, and its digests round-trip
    entry: python3 scripts/check_contract_method_reachability.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit, pre-push, manual]
  - id: durable-table-registration
    name: Every durable table is in the owner registry, manifest and census
    entry: python3 scripts/check_durable_table_registration.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit, pre-push, manual]
  # STAGING NOTE (owner-stamped, 2026-09-11). `orphan-modules` and
  # `pinned-reference-resolution` are RED BY DESIGN on the current tree: they
  # report real, named, tracked debt (2 orphan roots / 163 KB; 4 unresolved
  # reference edges + 2 unpinned references). They are NOT allowlisted,
  # suppressed or weakened, and they still FAIL — they run at pre-push and in
  # every explicit gate sweep.
  #
  # They are held off `pre-commit` for one reason: a permanently-failing
  # pre-commit hook forces every commit to use --no-verify, which silently
  # disables the OTHER 60 gates too. That is not hypothetical — it is exactly
  # how a broken dupehound gate and four files of EOF debt reached main in this
  # program. Blocking one class of debt at the cost of disabling all enforcement
  # is a net loss.
  #
  # RETURN THEM TO `pre-commit` the moment their findings reach zero. Whoever
  # closes the last orphan or the last unresolved edge owns that edit.
  - id: pinned-reference-resolution
    name: Every pinned cross-record reference has a production resolver
    entry: python3 scripts/check_pinned_reference_resolution.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
  # Anti-drift check for the ci-gate-replica hook (pre-push/manual, below) —
  # pure YAML parse, no cargo/build, <1s, so it runs on EVERY commit rather
  # than waiting for a push to discover a workflow grew a job
  # ci_gate_replica.py doesn't know how to classify. Covers EVERY workflow
  # file under .github/workflows/ (release.yml AND repro-diagnose.yml — a
  # new workflow file with no WORKFLOW_REGISTRY entry fails this too, not
  # just a new job in a known one), and also fails if .cargo/config.toml adds an
  # external-binary build dependency (rustc-wrapper/linker/runner) that no
  # workflow file ever installs — the exact shape of the sccache/mold break
  # (commit 652f91c): cargo hard-errors when a configured rustc-wrapper is
  # missing rather than soft-falling-back, and the local build host having
  # sccache/mold installed hid it from every command-equivalence check.
  - id: ci-gate-replica-consistency
    name: CI gate replica — anti-drift check (all workflow jobs classified + build-tool deps installable)
    entry: python3 scripts/ci_gate_replica.py --consistency-check
    language: system
    pass_filenames: false
    always_run: true
  # Authoritative "is it safe to skip the heavy ci-gate-replica hook for
  # this diff" check — see scripts/ci_gate_replica.py's BUILD_AFFECTING_FILE_PATTERNS
  # and --skip-safe. Not itself a gate (informational only, always exits 0)
  # so a human/agent choosing SKIP=ci-gate-replica has one authoritative
  # answer instead of an ad-hoc grep over changed files. The incident this
  # replaces: a push judged safe to SKIP=ci-gate-replica on "zero .rs/
  # Cargo.toml/Cargo.lock changes", missing that .cargo/config.toml is
  # build-affecting too.
  - id: ci-gate-replica-skip-advisory
    name: CI gate replica — skip-safety advisory (informational; never fails the commit)
    entry: bash -c 'python3 scripts/ci_gate_replica.py --skip-safe HEAD || true'
    language: system
    pass_filenames: false
    always_run: true
  # ci-gate-replica: the individual hooks above were hand-derived mirrors of
  # release.yml's `gates` job, one at a time, over several lanes — real but
  # not provably complete, and drift-prone (the eg-numeric kernel build +
  # numpy-parity gate steps were never wired into ANY local hook until this
  # one; that gap is exactly what shipped 2.14.0-2.23.0 with no numeric
  # kernel, invisible to every gate above). This hook instead PARSES EVERY
  # workflow file under .github/workflows/ at run time
  # (scripts/ci_gate_replica.py) and executes every step of every job it has
  # classified as executable (release.yml's `gates` and `lint-and-
  # architecture`, matrix-expanded per leg) verbatim — a step added there is
  # run here with NO change to this file. release.yml carries no
  # `continue-on-error` step anymore (the former second file, advisory.yml,
  # was retired 2026-08-28 — wD9-CIGATE — and folded in here; see
  # ci_gate_replica.py's WORKFLOW_REGISTRY comments for the couple of jobs
  # still disclosed as open, unmeasured gaps rather than silently
  # accepted), so every executable step failing here fails this hook. Its
  # own --consistency-check fails loudly if any workflow file grows a job
  # this script doesn't know how to classify, or gains an unregistered
  # workflow file entirely, or if .cargo/config.toml comes to depend on a
  # binary no workflow installs (see the meta-tests in
  # tests/test_ci_gate_replica_consistency_check.py). release.yml's `build`/
  # `docker-image`/`publish-*`/`feature-matrix`/`benchmarks`/`pages` jobs
  # are NOT executable locally (5-platform native matrix; tag-gated
  # registry/PyPI publish; cost/trigger-scoped cargo matrices; a
  # reusable-workflow call with no local steps) and are reported
  # "NOT VALIDATED LOCALLY" with a reason in the run's summary rather than
  # omitted — run `scripts/ci_gate_replica.sh --dry-run` to see the full
  # plan without executing anything.
  #
  # The workflow-derived gate is the single producer for the heavy selections
  # below. It records signed, source/configuration-bound results before any
  # consumer hook runs; a missing or non-identical record always executes the
  # consumer command normally. Keeping this producer ahead of the consumers is
  # what makes the cache an execution plan rather than a best-effort hint.
  - id: ci-gate-replica
    name: CI gate replica — parses every workflow file, runs executable jobs, reports NOT VALIDATED LOCALLY for the rest (HEAVY — pre-push/manual)
    entry: bash -c 'bash scripts/ci_gate_replica.sh'
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push, manual]
  # RF-RULING-003: the engine contract replaced the `protocol-parity` pytest gate
  # and its `tests/protocol_unbound_baseline.txt` ratchet. `gen_contract --check`
  # regenerates every committed artifact (`contract/methods.json`,
  # `contract/schemas/*.json`, `contract/receipt.json`,
  # `docs/capabilities.generated.md`, `epistemic_graph/generated/*.py`) in memory and
  # byte-diffs the tree, so "is this method bound in the Python client" is answered by
  # the descriptor's `consumer_profiles` rather than by a regex over two files and a
  # baseline nobody re-reviews. It runs on the SAME pre-push/manual stage the old
  # standalone hook did, and release.yml runs the identical command so
  # `ci-gate-replica` stays a verbatim replica. `--locked` on BOTH commands is load
  # bearing, not decoration: an unlocked `cargo run` REWRITES Cargo.lock on disk and a
  # later `--locked` step then validates cargo's own repair -- exactly how this lane's
  # missing schemars/serde_json/sha2/hex entries survived two green gates.
  - id: engine-contract-check
    name: Engine contract (registry ⇄ Method enum ⇄ generated client) — gen_contract --check
    entry: bash -c 'cargo run -q --locked -p eg-capabilities --features contract --bin gen_contract -- --check && cargo test -q --locked -p eg-capabilities --features contract'
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push, manual]
  # rust-ci gate 1 — scoped, pinned, check-only format guard. Never invoke
  # `cargo fmt --all` from a developer or merge track: an auto-applying
  # workspace formatter rewrites unrelated files in another lane's worktree.
  # `check_rustfmt_scope.py` receives only changed Rust paths and invokes the
  # exact channel from rust-toolchain.toml. A Cargo/rustfmt/toolchain manifest
  # change widens the read-only check to all tracked Rust files.
  - id: rustfmt-scope
    name: rustfmt (pinned, changed files, check-only)
    entry: python3 scripts/check_rustfmt_scope.py
    language: system
    files: '(^|/)(Cargo\.toml|rust-toolchain\.toml|rustfmt\.toml)$|\.rs$|^\.pre-commit-config\.yaml$|^\.mergequeue\.yaml$|^scripts/check_rustfmt_scope\.py$'
    pass_filenames: true
    stages: [pre-push, manual]
  # rust-ci gates 2-4 — clippy. The EVERYDAY leg lints the SHIPPED build (`full`,
  # which == `default`) + the two slim variants, each -D warnings. The exhaustive
  # `--all-features` leg is split to a pre-push/manual hook below: `--all-features`
  # additionally pulls the OPT-IN layers that are NOT in any shipped wheel — `cluster`
  # (openraft/`raft`/`harness`) and `full-extras` (real CUDA `cudarc` + ROS2 `rustdds`
  # + CycloneDDS's C cmake build) — so recompiling them on EVERY commit is the single
  # biggest local cost while catching lints only in code the main artifact never links.
  # `full` is a strict subset of `--all-features`, so this everyday leg can only be a
  # subset of the lints CI/pre-push still enforce (rust-ci.yml gate 1 is unchanged).
  - id: cargo-clippy
    name: cargo clippy -D warnings (shipped `full` build — the slimmest profile, incl. Raspberry Pi)
    # The preceding ci-gate-replica produces the broader advisory all-features
    # selection. The consumer accepts it only through the versioned, explicit
    # subset proof; absent or failed evidence runs this command normally.
    entry: bash -c 'if [ -f "Cargo.toml" ]; then python3 scripts/push_gate_evidence.py consume --selection cargo-clippy-full --kind cargo -- cargo clippy --no-default-features --features full --all-targets -- -D warnings; fi'
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push, manual]
  # Exhaustive clippy across EVERY feature incl. the opt-in `cluster` (raft/harness) and
  # `full-extras` (GPU/ROS2) layers — the heaviest compile in the repo (openraft, cudarc,
  # rustdds, the CycloneDDS C build; 55 crates that exist ONLY under these two features,
  # none of them in the shipped `default`/`full` build — asserted by `cargo tree`).
  # Mirrors rust-ci.yml gate 1 byte-for-byte, but was ALWAYS_RUN unconditionally on every
  # push regardless of whether the change went anywhere near `cluster`/`full-extras` —
  # measured as the single largest contributor to eg's local pre-push gate time. Now
  # scoped by scripts/check_cluster_extras_affected_lint.py: it derives, from the real
  # `cargo metadata` dependency graph (not a hand-maintained path list), which workspace
  # crates are actually reachable from `cluster`/`full-extras`, maps the push's changed
  # files to their owning crate, and runs the heavy command above ONLY when a touched
  # crate is in that reachable set (or Cargo.toml/Cargo.lock itself changed — the
  # dependency graph moved, too risky to reason about statically). Fails closed to the
  # heavy leg on ANY doubt — including a CLI-invoked `pre-commit run --hook-stage
  # pre-push`/`manual` (no from/to ref pair; only a REAL `git push` gets one), so
  # ci_parity.sh's exhaustive local check is unaffected by this narrowing.
  # COVERAGE IS UNCHANGED, not removed: rust-ci.yml's `lint-and-test` job runs this exact
  # command unconditionally on every push/PR to main regardless of this hook's decision,
  # and `pre-commit run --all-files --hook-stage manual`/`pre-push` (scripts/ci_parity.sh)
  # always runs the full leg locally too. This hook only removes the COST of paying for
  # the heavy compile on pushes that provably cannot reach the code it lints.
  - id: cargo-clippy-all-features
    name: cargo clippy --workspace --all-features (HEAVY, scoped to affected crates — pre-push/manual)
    entry: python3 scripts/check_cluster_extras_affected_lint.py
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push, manual]
  # rust-ci gates 5 + 7 — the FAST test legs (lower crates all-features, then the
  # slim-server feature-gating guard row). Replaces the old weak `cargo test
  # --quiet`. Gate 6 (facade full) is heavy → its own pre-push/manual hook below.
  # perf/gate-dedup (2026-08-15): the standalone `cargo-test` (lower crates)
  # hook that used to live here ran `cargo nextest run -p eg-types -p eg-core -p
  # eg-compute --all-features --no-fail-fast` on every push — the same crate/
  # feature/test scope as release.yml's `gates` job "Test (lower crates, all
  # features)" step (`cargo test -p eg-types -p eg-core -p eg-compute
  # --all-features --no-fail-fast`), which `ci-gate-replica` (above) executes
  # verbatim. nextest vs plain `cargo test` is a harness swap, not a different
  # test selection (D-PERF-1's own rationale: "nothing downstream parses its
  # output"), so this was the same tests running twice per push. Verified via
  # `scripts/ci_gate_replica.py --dry-run`. Removed from the automatic pre-push
  # stage. To run it standalone:
  #   cargo nextest run -p eg-types -p eg-core -p eg-compute --all-features --no-fail-fast
  # rust-ci gate 6 — facade full test matrix (~9 min). Too slow for every commit:
  # staged pre-push + manual so it runs on push and in the parity check.
  #
  # RATCHET RETIRED (2026-08-14): this hook used to run scripts/cargo_test_ratchet.py,
  # a differential gate over scripts/facade_full_test_baseline.txt, because `main`
  # was legitimately red — the facade-full row carried 55 long-standing failures
  # that were invisible for as long as the suite ABORTED on a stack overflow
  # before reporting them (baselined 2026-08-08). But `.github/workflows/release.yml`'s
  # own "Test (facade full)" step (the ONLY release-blocking test-suite gate,
  # by that file's own two-workflow design doc: release.yml is release-critical
  # and deliberately absolute, advisory.yml is where `continue-on-error` debt
  # lives) never ran the ratchet — it ran this same raw `cargo test` command,
  # so it failed on every one of those 55 baselined "known" failures while this
  # hook passed over them: a green local pre-push did not imply a green CI run,
  # which is why publishing had been dark since 2.23.0.
  # Re-validating the baseline (2026-08-14, CI-faithful unconstrained matrix run
  # on a dedicated build host) found 54 of the 55 entries now PASS — the durability-contract and
  # ACL/RDF-update-guard fixture gaps the header described were fixed by later
  # commits (the B-8/B-9 durability-contract rebase, the coalescer stats fix)
  # without anyone re-running `--update-baseline`, i.e. the baseline itself had
  # gone stale and was silently hiding that the debt was already gone. The
  # single remaining entry, `server::mqtt_wire::tests::eg281_listener_connect_
  # subscribe_publish_deliver_roundtrip`, was GOC-70 (scheduling-dependent, not
  # a product defect: reproduced 0/5 in true single-test isolation on an idle
  # host) and was fixed structurally (a listener-wide publish-notify wakeup
  # replacing the blind 200ms poll as the primary delivery path — see
  # src/server/mqtt_wire/mod.rs `accept_loop`/`handle_connection`) rather than
  # re-baselined.
  # With the baseline now empty, the ratchet has nothing left to ratchet over,
  # so this hook runs the SAME command as release.yml's "Test (facade full)"
  # step, byte-for-byte, instead of the ratchet wrapper: a green local pre-push
  # now IS a green CI run for this step, by construction, not by convention.
  # REMOVED (CX-RAT-06/17, no-ratchets policy): scripts/cargo_test_ratchet.py
  # and scripts/facade_full_test_baseline.txt were kept (unwired) after the
  # 2026-08-14 retirement above "in case a future red-main episode needs the
  # same differential-gating shape again" — but a ratchet mechanism kept
  # around unwired is still a mechanism someone can rewire, and this
  # workspace's standing rule is no baseline/ratchet gates, full stop
  # (findings are debt to burn down, never frozen). Verified dead at removal:
  # the baseline was empty (comments only, no entries), and grep across
  # .pre-commit-config.yaml, .github/workflows/, and this repo found no hook,
  # workflow step, Makefile, or justfile target invoking
  # scripts/cargo_test_ratchet.py — not even the `cargo-test-full` hook this
  # comment block used to describe, itself removed in the 2026-08-15
  # perf/gate-dedup pass below. If a future red-main episode needs the same
  # differential-gating shape, re-derive it fresh against the then-current
  # failure set rather than reviving a frozen baseline file.
  # perf/gate-dedup (2026-08-15): the `cargo-test-full` hook that lived here ran
  # the EXACT command above (`cargo test -p epistemic-graph --features full
  # --no-fail-fast`) on every push — byte-for-byte release.yml's `gates` job
  # "Test (facade full)" step, which `ci-gate-replica` (above) executes
  # verbatim. This was the confirmed root cause of a 70+-minute eg push running
  # this ~9-min (warm) / much longer (cold) command TWICE. Verified via
  # `scripts/ci_gate_replica.py --dry-run`. Removed from the automatic pre-push
  # stage. To run it standalone:
  #   cargo test -p epistemic-graph --features full --no-fail-fast
  # GOC-70: epistemic-graph 2.25.0 shipped with all six gates verified green on
  # a 64-core dev host, and CI (2 cores) failed anyway --
  # `dispatch_coalesces_concurrent_writes_to_one_graph` asserted a scheduling-
  # dependent property (every one of 400 concurrent writes landed through one
  # specific counter path) that only holds with real many-core overlap. CI
  # runners are the REFERENCE environment, not a degraded one -- our build
  # hosts are the outlier and hide this whole defect class. This hook
  # restricts CPU affinity to 2 cores (`taskset`) and re-runs the lib suite
  # PLUS the concurrency-sensitive integration-test binaries (pgwire/mysql/
  # mssql roundtrip, advanced_crossmodal_roundtrip, etc. — see
  # scripts/constrained_parallelism_gate.sh's header for why the latter are
  # NOT behind an opt-in flag: that opt-in is exactly why the
  # EPISTEMIC_GRAPH_ENCRYPTION_KEY ambient-env defect in
  # advanced_crossmodal_roundtrip.rs reached CI instead of failing here), the
  # same mechanism that broke 2.25.0 in CI. The blocking release-workflow step
  # is executed once by `ci-gate-replica` on pre-push; this direct hook remains
  # manual-only for focused invocation so the full pre-push plan cannot run the
  # same gate twice. Coordinate with `rm_gates(stage=heavy)` (feat/rm-gates,
  # in-flight) -- this belongs in that tier, not as a second enforcement
  # mechanism.
  - id: constrained-parallelism
    name: cargo test --lib + integration binaries under 2-core CPU affinity (GOC-70, HEAVY — manual-only)
    entry: bash -c 'if [ -f "Cargo.toml" ]; then bash scripts/constrained_parallelism_gate.sh; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  # DE7 (durable-execution-native.md, lane w6-de7-replay-determinism): replay-
  # determinism proofs for the fenced-lease job-lifecycle state machine
  # (`crates/eg-jobs/tests/replay_determinism.rs`, a proptest crash-and-reopen
  # script) and the statechart event-transition machine
  # (`crates/eg-statechart/tests/replay_determinism.rs`, an exhaustive
  # cut-point grid). Neither `eg-jobs` nor `eg-statechart` is otherwise named by
  # ANY existing test gate here (see this lane's report — a pre-existing,
  # broader gap this hook does not attempt to close). Pre-push + manual: each
  # crate's own crash simulation drops and reopens a real `redb::Database`
  # (cold compile + real file I/O), too slow for every commit but well under a
  # minute — CI is the always-on backstop.
  # perf/gate-dedup (2026-08-15): the standalone `replay-determinism` hook that
  # used to live here ran `cargo nextest run -p eg-jobs -p eg-statechart --test
  # replay_determinism --no-fail-fast` on every push — the same crate/test
  # scope as release.yml's `gates` job "Test (replay-determinism —
  # eg-jobs/eg-statechart crash-replay proofs, DE7)" step (`cargo test -p
  # eg-jobs -p eg-statechart --test replay_determinism --no-fail-fast`), which
  # `ci-gate-replica` (above) executes verbatim. Same nextest-vs-cargo-test
  # harness swap as the `cargo-test` hook above, not a different test
  # selection. Verified via `scripts/ci_gate_replica.py --dry-run`. Removed
  # from the automatic pre-push stage. To run it standalone:
  #   cargo nextest run -p eg-jobs -p eg-statechart --test replay_determinism --no-fail-fast
  # W0.12 — Rust dependency CVE gate: fail-closed `cargo deny check advisories`
  # against `deny.toml`, mirroring the Python side's fail-closed OSV gate
  # (`dependency-audit` hook / `scripts/audit_dependencies.py` +
  # `.security-audit-allow.txt`). The wrapper cross-validates deny.toml's
  # `[advisories].ignore` list against the justified, <=90-day-expiring
  # `.cargo-audit-allow.txt` ledger before running the real check, and fails
  # closed (with install instructions) if cargo-deny itself isn't installed —
  # never a silent pass. The blocking release `scanner-quality` job provisions
  # the exact contract-pinned binary and invokes this same wrapper. The local
  # hook also runs when its version authority or verifier changes, not only
  # when the dependency surface changes.
  - id: cargo-deny-advisories
    name: cargo deny check advisories (Rust dependency CVE gate)
    entry: scripts/check_cargo_advisories.sh
    language: system
    files: ^(Cargo\.lock|Cargo\.toml|crates/.*/Cargo\.toml|deny\.toml|\.cargo-audit-allow\.txt|pyproject\.toml|scripts/scanner_contract\.py|scripts/check_cargo_advisories\.sh)$
    pass_filenames: false
  # crates.io-only dependency edict (AGENTS.md, "crates.io-only Rust dependency
  # edict"): fails if any Cargo.toml adds a `git = ` source or an
  # out-of-workspace `path = ` dependency, or Cargo.lock resolves anything from
  # a `git+` source. Pure stdlib tomllib text-parse (no cargo invocation, no
  # target dir) so it is fast and side-effect-free on every commit. The only
  # sanctioned exception is an immutable `rev = ` pin for an unreleased
  # security fix, commented with the advisory ID + the crates.io version that
  # will replace it (see the object_store worked example in AGENTS.md) — this
  # gate does not special-case that state; lifting the pin is what turns it
  # green again.
  - id: check-crates-io-only
    name: crates.io-only Rust dependency edict
    entry: python3 scripts/check_crates_io_only.py
    language: system
    files: ^(Cargo\.lock|Cargo\.toml|crates/.*/Cargo\.toml)$
    pass_filenames: false
  # release-build.yml parity — build the ONE main wheel (CONCEPT:EG-359: `full`, the
  # default MATURIN_FEATURES) through the real maturin bin-binding wheel path:
  #   * --locked        → catches Cargo.lock drift, the class of blocker that broke
  #                       the release wheel build (version bump w/o lock sync).
  #   * --no-default-features --features full,ast-extended
  #                     → exactly the main published feature set (no `[tool.maturin]`
  #                       feature-union), matching the release `wheels` job.
  # DEBUG build (no --release): the release fat-LTO link of this binary is ~25 min,
  # far too slow for a hook; the failures this guards against (lock drift, feature
  # compile errors, maturin config) all reproduce in a debug build, which is the
  # lightest faithful check. CI still does the full --release manylinux build.
  # HEAVY-ish → pre-push + manual.
  #
  # w6-precommit-ci-parity (D-W6PC-2): this hook used to STOP after the build —
  # it never ran the fold + normalize + audit + completeness chain
  # release-build.yml's "Normalize and audit primary wheel" / "Require a
  # complete primary wheel" steps run (normalize_wheel_sbom.py →
  # normalize_wheel_build_paths.py → check_wheel_privacy.py →
  # check_wheel_completeness.py). That gap is exactly how a wheel privacy
  # audit failure (5 `privileged-home-prefix` leaks) shipped past every local
  # gate straight into CI: nothing local ever ran check_wheel_privacy.py at
  # all. scripts/wheel_privacy_gate.sh now runs the full sequence (mirroring
  # w4-engine-down run_gates.sh reproduction of release-build.yml's exact
  # steps), folding a matching
  # eg-numeric kernel wheel in first so check_wheel_completeness.py's
  # numeric-kernel-present invariant is checkable too, not just privacy.
  - id: wheel-smoke
    name: wheel smoke + privacy/completeness audit — maturin build + fold + normalize + audit (HEAVY — pre-push/manual)
    entry: bash -c 'if [ -f "pyproject.toml" ] && grep -q "tool.maturin" pyproject.toml; then bash scripts/wheel_privacy_gate.sh; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
- repo: local
  hooks:
  - id: pytest
    name: pytest (integration — spawns live engine; pre-push/CI only)
    # BUG-045: `uv run --all-extras` must install this checkout's own `epistemic-graph`
    # package (maturin `bindings = "bin"`, PEP 517) before pytest can even import it —
    # and maturin's PEP 517 build defaults to `--release`, so that install alone paid
    # for a `cargo rustc --profile release --features full --features ast-extended
    # -C lto=thin -C codegen-units=1` build (measured 40m49s), which is what actually
    # timed out this gate (the historical PUSH_EXIT=124), NOT the test run itself. Its
    # output was never even used: conftest.py's `start_epistemic_graph_server` builds
    # and runs its OWN separate (already-fast, debug) binary for the tests to talk to.
    # `MATURIN_PEP517_ARGS="--profile dev"` (a real, maturin-native env var — see
    # `maturin.get_maturin_pep517_args`) makes THIS install use the ordinary
    # unoptimized `dev` cargo profile instead — no LTO, no codegen-units=1 — cutting
    # that install to ordinary debug-build time. This scopes to this hook's own `uv
    # run` only; release-build.yml calls `maturin build --release` directly and is
    # unaffected. (`build_backend.py`'s native-artifact cache now fingerprints this
    # var too, so a dev-profile install is never served for a request that didn't ask
    # for one.) Pair with `EPISTEMIC_GRAPH_TEST_BINARY` (conftest.py) to also skip its
    # cargo build+run when a matching binary is already on disk -- which this
    # entry now DOES, because not doing it made the gate unpassable from a cold
    # cargo target. `conftest.py::start_epistemic_graph_server` falls back to
    # `cargo build --features full` INSIDE a fixture, and fixture setup runs
    # inside pytest-timeout's per-test 60s window: a cold full-featured build
    # takes minutes, so EVERY test in the suite ERRORed at setup with
    # `Failed: Timeout (>60.0s)` and the gate read as a wholesale test failure
    # (measured 2026-08-21 on a full pre-push run: ~500 ERRORs, not one of them
    # about the code under review). A warm target hid it, which is why it
    # survived this long. Building here, BEFORE pytest starts, puts that build
    # outside every test's timeout; conftest then just execs the binary. A
    # build failure still fails the gate loudly and says so -- it simply no
    # longer masquerades as the whole suite timing out.
    # The suite is gated DIFFERENTIALLY against tests/integration_failure_baseline.txt
    # rather than on absolute green -- see scripts/check_integration_baseline.py
    # for why, and for the three ways it still fails (a new failure, a baselined
    # test that starts passing, an entry past its review-by date). Absolute green
    # here would block every push on 17 failures that predate any branch under
    # test and were only invisible because this gate could not run at all.
    entry: bash -c 'export MATURIN_PEP517_ARGS="--profile dev"; test_target="tests"; for d in tests/unit test/unit tests test; do if [ -d "$d" ]; then test_target="$d"; break; fi; done; if [ -z "$EPISTEMIC_GRAPH_TEST_BINARY" ]; then cargo build --features full --bin epistemic-graph-server || { echo "REFUSED - cannot build epistemic-graph-server for the integration suite" >&2; exit 1; }; for d in "$CARGO_TARGET_DIR" target-isolated target; do if [ -n "$d" ] && [ -x "$d/debug/epistemic-graph-server" ]; then EPISTEMIC_GRAPH_TEST_BINARY="$(cd "$d/debug" && pwd)/epistemic-graph-server"; break; fi; done; if [ -z "$EPISTEMIC_GRAPH_TEST_BINARY" ]; then echo "REFUSED - built epistemic-graph-server but cannot find it under CARGO_TARGET_DIR/target-isolated/target" >&2; exit 1; fi; export EPISTEMIC_GRAPH_TEST_BINARY; fi; if [ -f uv.lock ]; then uv run --all-extras python scripts/check_integration_baseline.py -- "$test_target" -q --tb=short -m "not slow" --timeout=60; else python scripts/check_integration_baseline.py -- "$test_target" -q --tb=short -m "not slow" --timeout=60; fi'
    language: system
    types: [python]
    pass_filenames: false
    always_run: true
    # These integration tests build+spawn the full ~2.2GB engine (conftest cargo
    # build/run + UDS socket) — too heavy for every commit, and the conftest needs
    # cargo on PATH which `uv run` strips. Runs at pre-push/CI where the engine is
    # provisioned.
    stages: [pre-push, manual]
- repo: local
  hooks:
  - id: security-sanitizer
    name: Security and Garbage Sanitizer
    entry: python scripts/security_sanitizer.py
    language: python
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: guardrail-tracked-privacy
    name: Guardrail — tracked public artifacts contain no host-specific data or local identities
    entry: python3 scripts/check_tracked_privacy.py
    language: system
    # NOT scoped, despite being expensive: a privacy leak (hostname, local
    # path, identity) can land in ANY tracked file type (docs, config,
    # fixtures, Rust source), not just one directory, so no `files:` regex
    # narrower than "everything tracked" can be proven not to miss one.
    # Ported from agent-utilities' identically-named/identically-behaved
    # gate (`scripts/check_tracked_privacy.py`'s own module docstring notes
    # the one intentional adaptation: this repo's own top-level source
    # trees, not agent-utilities'). This repo publishes to a public GitHub
    # org, same as agent-utilities.
    pass_filenames: false
    always_run: true

  - id: check-root-hygiene
    name: Repository root hygiene (manifest-declared entries only)
    entry: python3 scripts/check_root_hygiene.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-gitignore-convergence
    name: .gitignore carries the fleet-shared REQUIRED set
    entry: python3 scripts/check_gitignore_convergence.py
    language: system
    pass_filenames: false
    always_run: true
