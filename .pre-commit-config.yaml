default_language_version:
  python: python3
exclude: 'dotnet|node_modules|target'
ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: 'monthly'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: '.*\.db$'
  - id: check-ast
    exclude: ^(tests/|test/|scripts/|script/)
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
    exclude: .gitignore
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.12
  hooks:
  - id: ruff-check
    args: ["--fix", "--ignore=E402,B008,E501"]
    exclude: ^(tests/|test/|scripts/|script/)
  - id: ruff-format
    exclude: ^(tests/|test/|scripts/|script/)
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.20.2
  hooks:
  - id: mypy
    additional_dependencies: [pydantic, types-PyYAML, types-requests, types-setuptools]
    args: ["--ignore-missing-imports"]
- repo: https://github.com/jendrikseipp/vulture
  rev: v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", "node_modules,dotnet,.venv,venv,node_modules,.git,build,dist,target"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.2
  hooks:
  - id: codespell
    args: ["-L", "ans,linar,nam,tread,ot,ser,inh", "--ignore-words=.codespellignore"]
    exclude: ^(tests/|test/|scripts/|script/|.*lock.*|Cargo.lock|\.specify/)
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101,B404,B603"]
    exclude: ^(tests/|test/|scripts/|script/|__tests__/)
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.8
  hooks:
  - id: uv-lock
- repo: local
  hooks:
  - id: check-stubs
    name: Check for Active Stubs and TODOs
    entry: python3 /home/apps/workspace/agent-packages/agent-utilities/scripts/check_stubs.py
    language: system
    types: [python]
  - id: check-sprawl
    name: Guardrail — anti-sprawl
    entry: python3 /home/apps/workspace/agent-packages/agent-utilities/scripts/check_sprawl.py
    language: system
    args: ["."]
    pass_filenames: false
    always_run: true
  - id: check-bumpversion
    name: validate bumpversion config
    entry: |-
      bash -c 'if [ -f ".bumpversion.cfg" ]; then bump2version patch --dry-run --allow-dirty; fi'
    language: system
    pass_filenames: false
    always_run: true
# ─────────────────────────────────────────────────────────────────────────
# Rust CI parity — mirrors .github/workflows/rust-ci.yml `lint-and-test` PLUS a
# representative wheel build from release-build.yml, so `pre-commit run` catches
# locally everything CI checks (no more push-then-discover). The FAST gates (fmt,
# clippy, lower-crate + slim-server tests) run on the default `pre-commit` stage.
# The HEAVY gates (the ~9-min facade-full test matrix and the maturin wheel smoke
# ~release LTO) are staged `pre-push` + `manual` so they don't tax every commit
# but still run in the parity check via:
#   pre-commit run --all-files --hook-stage pre-push   # or: --hook-stage manual
# ─────────────────────────────────────────────────────────────────────────
- repo: local
  hooks:
  # rust-ci gate 1 — workspace format check.
  - id: cargo-fmt
    name: cargo fmt --all --check (rust-ci parity)
    entry: bash -c 'if [ -f "Cargo.toml" ]; then cargo fmt --all --check; fi'
    language: system
    pass_filenames: false
    always_run: true
  # rust-ci gates 2-4 — clippy every crate all-features + the two slim variants,
  # each with -D warnings (a lint is a hard error, exactly as CI).
  - id: cargo-clippy
    name: cargo clippy -D warnings (workspace all-features + 2 slim variants)
    entry: bash -c 'if [ -f "Cargo.toml" ]; then set -e; cargo clippy --workspace --all-features --all-targets -- -D warnings; cargo clippy --no-default-features --features graph,algorithms -- -D warnings; cargo clippy --no-default-features --features server --all-targets -- -D warnings; fi'
    language: system
    pass_filenames: false
    always_run: true
  # rust-ci gates 5 + 7 — the FAST test legs (lower crates all-features, then the
  # slim-server feature-gating guard row). Replaces the old weak `cargo test
  # --quiet`. Gate 6 (facade full) is heavy → its own pre-push/manual hook below.
  - id: cargo-test
    name: cargo test (lower crates all-features + slim server)
    entry: bash -c 'if [ -f "Cargo.toml" ]; then set -e; cargo test -p eg-types -p eg-core -p eg-compute --all-features; cargo test -p epistemic-graph --no-default-features --features server; fi'
    language: system
    pass_filenames: false
    always_run: true
  # rust-ci gate 6 — facade full test matrix (~9 min). Too slow for every commit:
  # staged pre-push + manual so it runs on push and in the parity check.
  - id: cargo-test-full
    name: cargo test -p epistemic-graph --features full (HEAVY — pre-push/manual)
    entry: bash -c 'if [ -f "Cargo.toml" ]; then cargo test -p epistemic-graph --features full; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
  # release-build.yml parity — build ONE representative wheel (the `node` tier, the
  # default MATURIN_FEATURES) through the real maturin bin-binding wheel path:
  #   * --locked        → catches Cargo.lock drift, the class of blocker that broke
  #                       the release wheel build (version bump w/o lock sync).
  #   * --no-default-features --features node,ast-extended
  #                     → only the tier bundle is selected (no `[tool.maturin]`
  #                       feature-union), so a tier-specific compile error that the
  #                       rust-ci feature-matrix does NOT cover (pi/node tiers are
  #                       absent there) is caught here.
  # DEBUG build (no --release): the release fat-LTO link of this binary is ~25 min,
  # far too slow for a hook; the failures this guards against (lock drift, tier
  # compile errors, maturin config) all reproduce in a debug build, which is the
  # lightest faithful check. CI still does the full --release manylinux build.
  # HEAVY-ish → pre-push + manual.
  - id: wheel-smoke
    name: wheel smoke — maturin build node tier, --locked (HEAVY — pre-push/manual)
    entry: bash -c 'if [ -f "pyproject.toml" ] && grep -q "tool.maturin" pyproject.toml; then maturin build --locked --no-default-features --features node,ast-extended --out "${TMPDIR:-/tmp}/eg-wheel-smoke"; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
- repo: local
  hooks:
  - id: pytest
    name: pytest
    entry: bash -c 'test_target="tests"; for d in tests/unit test/unit tests test; do if [ -d "$d" ]; then test_target="$d"; break; fi; done; if [ -f uv.lock ]; then uv run --all-extras pytest "$test_target" -q --tb=short -m "not slow" --timeout=60; else pytest "$test_target" -q --tb=short -m "not slow" --timeout=60; fi'
    language: system
    types: [python]
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: security-sanitizer
    name: Security and Garbage Sanitizer
    entry: python scripts/security_sanitizer.py
    language: python
    pass_filenames: false
    always_run: true
