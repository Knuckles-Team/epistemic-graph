name: Build folded release wheel
description: >-
  One complete release-wheel pass: build the epistemic-graph server wheel, fold
  the eg-numeric and eg-pyengine kernels into it, normalize and privacy-audit
  it, and require the result to be complete. The primary and reproduction
  passes in release.yml both run this, so the two cannot drift apart. Reads
  EG_WHEEL_TARGET, EG_WHEEL_MANYLINUX, EG_WHEEL_MATURIN_ARGS, EG_WHEEL_JOBS_ARG and
  MATURIN_FEATURES from the calling job's environment.
inputs:
  pass:
    description: Output suffix for this pass (`primary` or `reproduction`).
    required: true
runs:
  using: composite
  steps:
    # All three builds of a pass share one target directory, so the kernels
    # reuse the dependency crates the server wheel already compiled. Start
    # each pass clean so reproduction cannot reuse primary compiled objects.
    - name: Select the release target directory
      id: build-environment
      shell: bash
      run: |
        target="${RUNNER_TEMP:?}/epistemic-graph-release-target"
        rm -rf -- "$target"
        mkdir -p "$target"
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/epistemic-graph-release-target" >> "$GITHUB_ENV"
        if [ "${EG_WHEEL_TARGET:-}" = aarch64-unknown-linux-gnu ]; then
          echo "container=quay.io/pypa/manylinux_2_28_aarch64@sha256:acc4e63610fef1da3d687322793665205415c2b22c0d2e403f1a44eb834d63fc" >> "$GITHUB_OUTPUT"
          echo "maturin-version=1.15.0" >> "$GITHUB_OUTPUT"
        fi
        case "${EG_WHEEL_TARGET:-}" in
          *-apple-darwin)
            echo "maturin-version=1.15.0" >> "$GITHUB_OUTPUT"
            echo "server-packaging-args=--strip=false" >> "$GITHUB_OUTPUT"
            ;;
        esac

    # Cargo can schedule all enabled tools together. The profile still strips
    # binaries; only Maturin's redundant final-crate strip override is omitted,
    # so packaging reuses the same-pass compiled output. Never seed another pass.
    - name: Prebuild all shipped macOS executable targets
      if: ${{ endsWith(env.EG_WHEEL_TARGET, '-apple-darwin') }}
      shell: bash
      run: >-
        cargo build --release --locked --bins
        --target "$EG_WHEEL_TARGET"
        --features "$MATURIN_FEATURES"
        ${{ env.EG_WHEEL_JOBS_ARG }}

    - name: Build server wheel
      uses: ./.github/actions/release-maturin
      with:
        args: >-
          --release
          ${{ env.EG_WHEEL_JOBS_ARG }}
          --out dist-${{ inputs.pass }}
          --features ${{ env.MATURIN_FEATURES }}
          ${{ env.EG_WHEEL_MATURIN_ARGS }}
          ${{ steps.build-environment.outputs.server-packaging-args }}
        container: ${{ steps.build-environment.outputs.container }}
        maturin-version: ${{ steps.build-environment.outputs.maturin-version }}

    # ── Fold the eg-numeric Surface-A kernel INTO this same wheel (CONCEPT:EG-346).
    #    Build the pyo3 cdylib kernel (`crates/eg-numeric --features python`) for the
    #    SAME target, then inject its compiled extension (`.so`/`.pyd`) into the
    #    server wheel as `epistemic_graph.numeric`. Result: ONE published `epistemic-graph`
    #    wheel that ships BOTH the server binary AND the numeric kernel — no separate
    #    `eg-numeric` package on PyPI. The kernel is a distinct maturin target (a pyo3
    #    cdylib), so the engine binary's no-pyo3 / Pi contract is untouched.
    - name: Build eg-numeric kernel (same target)
      uses: ./.github/actions/release-maturin
      with:
        args: >-
          --release
          ${{ env.EG_WHEEL_JOBS_ARG }}
          --out numdist-${{ inputs.pass }}
          -m crates/eg-numeric/Cargo.toml
          --features python
        container: ${{ steps.build-environment.outputs.container }}
        maturin-version: ${{ steps.build-environment.outputs.maturin-version }}

    - name: Fold numeric kernel into the epistemic-graph wheel
      shell: bash
      run: |
        python scripts/inject_numeric_kernel.py "$(ls dist-${{ inputs.pass }}/epistemic_graph-*.whl)" "$(ls numdist-${{ inputs.pass }}/*.whl)"

    # ── Fold the eg-pyengine in-process engine binding INTO this same wheel
    #    (BUG-PE-002: `import epistemic_graph.engine` failed in the live shipped
    #    image because nothing built and folded this extension). Same shape as
    #    the numeric kernel fold above; the two injections are order-independent
    #    (each only rewrites the target wheel's RECORD, never the other's
    #    extension member), so one normalize/audit/completeness pass covers both.
    - name: Build eg-pyengine kernel (same target)
      uses: ./.github/actions/release-maturin
      with:
        args: >-
          --release
          ${{ env.EG_WHEEL_JOBS_ARG }}
          --out enginedist-${{ inputs.pass }}
          -m crates/eg-pyengine/Cargo.toml
          --features python,security
        container: ${{ steps.build-environment.outputs.container }}
        maturin-version: ${{ steps.build-environment.outputs.maturin-version }}

    - name: Fold pyengine kernel into the epistemic-graph wheel
      shell: bash
      run: |
        python scripts/inject_pyengine.py "$(ls dist-${{ inputs.pass }}/epistemic_graph-*.whl)" "$(ls enginedist-${{ inputs.pass }}/*.whl)"

    - name: Normalize and audit wheel
      shell: bash
      run: |
        python scripts/normalize_wheel_sbom.py dist-${{ inputs.pass }}/*.whl
        python scripts/normalize_wheel_build_paths.py dist-${{ inputs.pass }}/*.whl
        python scripts/check_wheel_privacy.py dist-${{ inputs.pass }}/*.whl

    # Assert the artifact is COMPLETE after every step that rewrites it (inject,
    # sbom, build-path normalization). Published 2.14.0-2.23.0 wheels shipped with
    # NO numeric kernel because nothing here ever inspected the payload — the graft
    # is silent when it fails. Running the gate on the build leg localizes such a
    # regression to the platform that produced it; `publish-pypi` re-runs it on the
    # downloaded artifacts as the actual publish boundary.
    - name: Require a complete wheel (numeric + engine kernels + executable binary + RECORD)
      shell: bash
      run: python scripts/check_wheel_completeness.py --require-engine-kernel dist-${{ inputs.pass }}/*.whl
