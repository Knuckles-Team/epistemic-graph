name: Release

# ─────────────────────────────────────────────────────────────────────────
# THE TWO-WORKFLOW MODEL (read this before adding a check to either file)
#
# This repo ships exactly two GitHub Actions workflows:
#
#   release.yml (THIS FILE) — the ONLY workflow that can block a release.
#     Jobs are wired strictly `needs:` so a failure names its stage at a
#     glance: gates -> build -> docker-image -> publish-pypi/publish-image.
#     "Release-critical" is deliberately narrow: secret-history scanning,
#     the test suite, and wheel build + reproducibility + release-contract +
#     wheel-privacy checks. NOTHING else may block publishing — if you are
#     tempted to add a step here, it almost certainly belongs in
#     advisory.yml instead.
#
#   advisory.yml — everything else. The architecture/documentation-contract
#     gates, lint (clippy/rustfmt), the feature-build matrix, and the perf
#     benchmark + recall-regression gate. Every step there runs with
#     `continue-on-error: true` so debt is visible (red step, annotation,
#     job summary) but never blocks a release.
#
# This repo did NOT have agent-utilities' `workflow_run` problem (this file
# already triggered directly on `push`/`tags`), so this redesign is a pure
# fold-and-reclassify of rust-ci.yml + the old release-build.yml into the
# two-workflow shape, plus one genuinely new addition: secret-history
# scanning (previously not wired into ANY CI here at all).
#
# eg's wheel-digest-mismatch reproducibility bug is being fixed by a
# different, separate track of work. Nothing in this redesign touches wheel
# build/determinism LOGIC — the `build` job below is the former release-build
# `wheels` job, byte-for-byte, just re-triggered by `needs: gates` instead of
# being a top-level job on the same triggers.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Resource-constrained release builders must never fan native compilation out.
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  # The ONE main build (CONCEPT:EG-371): `full` = all MAIN features that build without an
  # external GPU/robotics toolchain, plus `ast-extended` for the complete code-parsing
  # grammar tier. `cluster` (raft HA) and `full-extras` (GPU/ROS2) are opt-in build layers,
  # NOT published wheels.
  MATURIN_FEATURES: "full,ast-extended"

jobs:
  # ── STAGE 1: release-critical checks only. Nothing else may live here. ──
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ---- Secret-history scan. NEW: this was previously not wired into
      # any CI in this repo at all (no equivalent of agent-utilities'
      # D-CIP-13 gate existed here). See scripts/security/check_secret_history.py
      # and secret_history_baseline.txt (the baseline was seeded once, by
      # hand, against a 300-commit sample of real history during this
      # redesign, so the gate ships already-clean rather than immediately
      # red).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Secret-history scan
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              BASE="HEAD~1"
            else
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          echo "Scanning ${BASE}..HEAD for credential-shaped content"
          python3 scripts/security/check_secret_history.py --base "$BASE"

      # ---- THE test suite: byte-for-byte the cargo test steps from the
      # former rust-ci.yml `lint-and-test` job (fmt/clippy/architecture gates
      # moved to advisory.yml — see that file), plus protocol-parity and
      # numeric-parity, which are also genuinely test suites (pytest-based
      # parity tests over the wire protocol and the compiled numeric
      # kernel), combined into one job so a correctness regression fails
      # fast, before the 5-platform wheel matrix in `build` ever runs.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test (lower crates, all features)
        run: cargo test -p eg-types -p eg-core -p eg-compute --all-features --no-fail-fast
      - name: Test (facade full)
        run: cargo test -p epistemic-graph --features full --no-fail-fast
      # The blob RSS-bound tests read WHOLE-PROCESS RSS, so they are #[ignore]d out
      # of the parallel run above (a concurrent sibling's 256MB blob inflates the
      # shared RSS past the cap). Run them here in isolation — serial + ignored — so
      # the memory-regression coverage stays in CI without the parallel pollution.
      - name: Test (memory-regression — RSS bounds, isolated)
        run: cargo test -p epistemic-graph --features full --no-fail-fast bounded_memory -- --ignored --test-threads=1
      - name: Test (slim server — gated-out methods return the not-built error)
        run: cargo test -p epistemic-graph --no-default-features --features server --no-fail-fast
      # DE7 (durable-execution-native.md): replay-determinism crash-and-reopen
      # proofs for eg-jobs/eg-statechart.
      - name: Test (replay-determinism — eg-jobs/eg-statechart crash-replay proofs, DE7)
        run: cargo test -p eg-jobs -p eg-statechart --test replay_determinism --no-fail-fast
      # The fuzz + concurrency-chaos proptest suite (long random valid pipelines,
      # snapshot-isolation under contention) — a correctness test, kept here
      # (release-critical) rather than moving with the rest of the former
      # `benchmarks` job (which is a perf/recall gate and belongs in
      # advisory.yml).
      - name: Query-pipeline fuzz + chaos (eg-plan)
        run: cargo test -p eg-plan --features "query,owl,text,timeseries,federation" --test fuzz_pipelines --no-fail-fast

      - name: Install pytest
        run: pip install pytest
      - name: Epistemic Operations manifest ⇄ Rust DTO parity
        run: python3 scripts/check_epistemic_operations_protocol.py
      - name: Protocol parity (Python client ⇄ Rust Method enum)
        run: python -m pytest tests/test_protocol_parity.py --noconftest -q

      # numeric-parity: builds + installs the eg-numeric Surface-A pyo3 wheel
      # and proves EVERY kernel op matches its numpy reference. Python 3.12
      # is inside pyo3-0.22's native support window.
      - name: Install maturin + parity deps
        run: pip install 'maturin>=1,<2' numpy pytest
      - name: Configure identity-neutral Rust source paths
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV"
      - name: Build eg-numeric Surface-A wheel (feature python)
        run: maturin build --release -m crates/eg-numeric/Cargo.toml --features python --out target/wheels
      - name: Normalize build-local SBOM references
        run: python scripts/normalize_wheel_sbom.py target/wheels/*.whl
      - name: Normalize retained native build paths
        run: python scripts/normalize_wheel_build_paths.py target/wheels/*.whl
      - name: Audit numeric wheel for retained build identity
        run: python scripts/check_wheel_privacy.py target/wheels/*.whl
      - name: Install the wheel
        run: pip install --no-index --find-links target/wheels eg-numeric
      - name: numpy-parity gate (compiled kernel vs numpy)
        run: python -m pytest crates/eg-numeric/tests/test_kernel_parity.py --noconftest -q

  # ── STAGE 2: the ONE main wheel (CONCEPT:EG-371), built for every
  # supported native target — release-critical item: wheel build +
  # reproducibility + release-contract + wheel-privacy checks. Needs: gates.
  # UNCHANGED from the former release-build.yml `wheels` job (this is where
  # a separate track is fixing the wheel-digest-reproducibility bug — do not
  # change this job's build/determinism logic here).
  build:
    name: wheel ${{ matrix.name }}
    needs: gates
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Each leg performs two independent full+numeric native builds. Keep the
      # platform legs serial as well so release certification has one compiler
      # workload at a time.
      max-parallel: 1
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            maturin_args: ""
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            maturin_args: ""
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            maturin_args: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Read tracked Rust toolchain pin
        id: rust-toolchain
        shell: bash
        run: >-
          python -c "import os,re,tomllib;
          channel=tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'];
          assert re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+', channel);
          open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write(f'channel={channel}\n')"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Bind build time to the source revision
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          case "$SOURCE_DATE_EPOCH" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # Release binaries must not retain checkout, build-user, Cargo, or toolchain
      # roots. The helper preserves existing flags using Cargo's encoded form and
      # reports counts only (never the concrete prefixes). `--target` is required
      # here (unlike the single-target `gates` job above): this job cross-builds
      # multiple targets, and the C/C++ prefix-map flag is feature-detected
      # per target compiler -- the manylinux aarch64 cross-gcc rejects
      # -ffile-prefix-map (GCC 8+ only) and falls back to -fdebug-prefix-map,
      # written to a CFLAGS_<target> variable scoped to this leg alone so it
      # can never reach a different leg's toolchain.
      - name: Configure identity-neutral Rust source paths
        shell: bash
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "${{ matrix.target }}"

      # Two independent native builds prove the complete folded wheel is byte-for-byte
      # reproducible. Each pass starts from empty Cargo state at the same neutral path
      # and writes to a separate wheel output root; the numeric kernel is compiled,
      # injected, normalized, and privacy-audited before the digests are compared.
      # Steps remain deliberately serial.
      - name: Build primary wheel (${{ matrix.name }})
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist-primary
            --features ${{ env.MATURIN_FEATURES }}
            ${{ matrix.maturin_args }}
          # zig gives reproducible glibc-pinned linux cross-builds.
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      # ── Fold the eg-numeric Surface-A kernel INTO this same wheel (CONCEPT:EG-346).
      #    Build the pyo3 cdylib kernel (`crates/eg-numeric --features python`) for the
      #    SAME target, then inject its compiled extension (`.so`/`.pyd`) into the
      #    server wheel as `epistemic_graph.numeric`. Result: ONE published `epistemic-graph`
      #    wheel that ships BOTH the server binary AND the numeric kernel — no separate
      #    `eg-numeric` package on PyPI. The kernel is a distinct maturin target (a pyo3
      #    cdylib), so the engine binary's no-pyo3 / Pi contract is untouched.
      - name: Build primary eg-numeric kernel (same target)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out numdist-primary
            -m crates/eg-numeric/Cargo.toml
            --features python
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      - name: Fold primary numeric kernel into the epistemic-graph wheel
        shell: bash
        run: |
          python scripts/inject_numeric_kernel.py "$(ls dist-primary/epistemic_graph-*.whl)" "$(ls numdist-primary/*.whl)"

      - name: Normalize and audit primary wheel
        shell: bash
        run: |
          python scripts/normalize_wheel_sbom.py dist-primary/*.whl
          python scripts/normalize_wheel_build_paths.py dist-primary/*.whl
          python scripts/check_wheel_privacy.py dist-primary/*.whl

      # Assert the artifact is COMPLETE after every step that rewrites it (inject,
      # sbom, build-path normalization). Published 2.14.0-2.23.0 wheels shipped with
      # NO numeric kernel because nothing here ever inspected the payload — the graft
      # is silent when it fails. Running the gate on the build leg localizes such a
      # regression to the platform that produced it; `publish-pypi` re-runs it on the
      # downloaded artifacts as the actual publish boundary.
      - name: Require a complete primary wheel (kernel + executable binary + RECORD)
        shell: bash
        run: python scripts/check_wheel_completeness.py dist-primary/*.whl

      - name: Remove primary native build state
        shell: bash
        run: >-
          python -c "import os,shutil; from pathlib import Path;
          root=Path(os.environ['RUNNER_TEMP']).resolve();
          target=(root/'epistemic-graph-release-target').resolve();
          assert target.parent==root and target.name=='epistemic-graph-release-target';
          print('removing' if target.exists() else 'already absent:', target);
          shutil.rmtree(target) if target.exists() else None"

      - name: Build reproduction wheel (${{ matrix.name }})
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist-reproduction
            --features ${{ env.MATURIN_FEATURES }}
            ${{ matrix.maturin_args }}
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      - name: Build reproduction eg-numeric kernel (same target)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out numdist-reproduction
            -m crates/eg-numeric/Cargo.toml
            --features python
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      - name: Fold reproduction numeric kernel into the epistemic-graph wheel
        shell: bash
        run: |
          python scripts/inject_numeric_kernel.py "$(ls dist-reproduction/epistemic_graph-*.whl)" "$(ls numdist-reproduction/*.whl)"

      - name: Normalize and audit reproduction wheel
        shell: bash
        run: |
          python scripts/normalize_wheel_sbom.py dist-reproduction/*.whl
          python scripts/normalize_wheel_build_paths.py dist-reproduction/*.whl
          python scripts/check_wheel_privacy.py dist-reproduction/*.whl

      - name: Require a complete reproduction wheel
        shell: bash
        run: python scripts/check_wheel_completeness.py dist-reproduction/*.whl

      - name: Require byte-identical folded wheels
        shell: bash
        run: >-
          python -c "from hashlib import sha256; from pathlib import Path;
          primary=sorted(Path('dist-primary').glob('epistemic_graph-*.whl'));
          reproduction=sorted(Path('dist-reproduction').glob('epistemic_graph-*.whl'));
          assert len(primary)==len(reproduction)==1, 'release wheel cardinality mismatch';
          assert primary[0].name==reproduction[0].name, 'release wheel filename mismatch';
          assert sha256(primary[0].read_bytes()).digest()==sha256(reproduction[0].read_bytes()).digest(), 'release wheel digest mismatch';
          print('release_wheel_reproducibility=passed')"

      - name: Stage sole publish candidate
        shell: bash
        run: |
          mkdir dist
          cp dist-primary/epistemic_graph-*.whl dist/

      # Smoke test: install the wheel, run the server `--help`, AND prove the folded-in
      # kernel imports AND computes (`epistemic_graph.numeric`). Skipped for the
      # cross-only leg (linux-aarch64 on an x86 host) where the binary can't execute on
      # the runner. Two independent regressions this asserts (both were real):
      #   1) the server console binary must stay EXECUTABLE — the numeric inject repacks
      #      the wheel zip and MUST preserve the 0755 mode on
      #      `*.data/scripts/epistemic-graph-server`; dropping the exec bit made pip
      #      install a non-runnable binary that died with "Permission denied".
      #   2) the folded-in kernel must import AND compute from the INSTALLED wheel.
      - name: Smoke test (server --help + import epistemic_graph.numeric + compute)
        if: ${{ matrix.name != 'linux-aarch64' && matrix.experimental != true }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install the BARE wheel — NO `[numeric]` extra. numpy (the kernel's zero-copy
          # interop boundary) is an unconditional base Requires-Dist (CONCEPT:EG-346); the
          # `[numeric]` extra is only a no-op compatibility alias for old
          # `epistemic-graph[numeric]` pins (pyproject.toml `[project.optional-dependencies]`).
          # Installing with the extra here would silently mask a regression that re-gated
          # numpy behind it — the exact 2.14.0-2.23.0 shape `check_wheel_completeness.py`
          # exists to catch — because the extra would still pull numpy in even though the
          # bare install no longer would. Smoke must prove the bare-install contract, not a
          # weaker one.
          pip install "$(ls dist/epistemic_graph-*.whl)"
          # (1) The binary must be executable (inject must preserve 0755) — fails loud
          #     with "Permission denied" otherwise.
          epistemic-graph-server --help
          # (2) Import + compute the kernel FROM THE INSTALLED WHEEL. Run from a neutral
          #     dir ($RUNNER_TEMP) — the repo checkout root holds the `epistemic_graph/`
          #     SOURCE package (no compiled `.so`), and cwd is on sys.path for `python -c`,
          #     so importing at the repo root would shadow the wheel and always fail.
          cd "${RUNNER_TEMP:-/tmp}"
          python -c "import numpy as np, epistemic_graph.numeric as n; a=np.array([1.,2.,3.,4.]); assert n.sum(a)==10.0 and n.mean(a)==2.5, (n.sum(a), n.mean(a)); print('numeric kernel OK:', n.__file__, '| sum=', n.sum(a), 'mean=', n.mean(a), 'std=', n.std(a))"

      - name: Upload wheel artifact
        if: ${{ matrix.experimental != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  # NOTE (CONCEPT:EG-371): the old pi/pi-max tier wheels (`wheels-pi`) and the
  # size-optimized "contains-all" tier wheels (`wheels-full-tiny`) are GONE. Those legs
  # existed only because the deployment tiers produced DIFFERENT binaries that all shared
  # the SAME wheel filename (`epistemic_graph-<ver>-py3-none-<platform>`), so only one
  # could ever publish. The tiers are collapsed into ONE main build (the `build` job
  # above), which is what publishes — no more per-tier legs, no more filename collision.

  # NOTE: the eg-numeric kernel is NO LONGER a separately-published package. Its
  # Surface-A pyo3 `.so` is FOLDED INTO the `epistemic-graph` main wheel in the
  # `build` job above, so a BARE `pip install epistemic-graph` (no extra tag)
  # provides `epistemic_graph.numeric` from ONE published package (CONCEPT:EG-346).
  # `epistemic-graph[numeric]` still resolves for old pins, but is a no-op alias —
  # it is not what makes the kernel present.

  # ── Multi-arch Docker DB image (BUILD + in-image `--help` smoke; no push).
  #    Installs the wheel BUILT IN THIS SAME RUN — no PyPI round-trip — so it
  #    depends only on `build`. Tag-gated: only builds on a `v*` tag.
  docker-image:
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Derive package version from tag
        run: echo "EG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Download wheel (amd64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-x86_64
          path: docker/wheels
      - name: Download wheel (arm64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-aarch64
          path: docker/wheels
      - name: Build multi-arch image (install CI-built wheel; no PyPI)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            EG_VERSION=${{ env.EG_VERSION }}
          tags: epistemic-graph:ci

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH — GATED to a `v*` tag only; skipped entirely on a normal branch
  # push or PR. Needs: build, so publishing is unreachable if `gates` or
  # `build` failed.
  # ─────────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish wheels to PyPI (release only)
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-aarch64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-windows-x86_64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-macos-aarch64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-macos-x86_64
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # ── THE PUBLISH BOUNDARY GATE. Every wheel about to be uploaded must carry the
      #    folded numeric kernel, an EXECUTABLE server binary, the full python surface,
      #    and a self-consistent RECORD. This runs on the DOWNLOADED artifacts, so it
      #    catches an incomplete wheel no matter which upstream step regressed.
      - name: Require every distribution to be complete before upload
        run: |
          python -m pip install --upgrade pip
          echo "Distributions staged for upload:"
          ls -1 dist/
          python scripts/check_wheel_completeness.py dist/*.whl

      - name: Publish to PyPI (token)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          echo "Distributions to upload:"
          ls -1 dist/
          twine upload --skip-existing --verbose dist/*

      # HONEST VERIFICATION — CI must go RED if the release did NOT actually land on
      # PyPI. `--skip-existing` (and any token-scope / name mismatch) can make the
      # upload step pass without publishing the tag version; this step asserts the
      # exact tag version is now queryable on PyPI, retrying for CDN propagation lag.
      - name: Verify epistemic-graph ${{ github.ref_name }} is published on PyPI
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Asserting epistemic-graph==${VER} is live on PyPI…"
          url="https://pypi.org/pypi/epistemic-graph/${VER}/json"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: epistemic-graph ${VER} is published (PyPI returned 200)."
              python -m pip download --no-deps --only-binary :all: \
                "epistemic-graph==${VER}" -d pypi-verify
              python scripts/check_wheel_completeness.py pypi-verify/*.whl
              echo "OK: the wheel PyPI serves for ${VER} is complete."
              exit 0
            fi
            echo "Attempt ${i}: PyPI returned HTTP ${code} for ${VER} — retrying in 20s (CDN lag)…"
            sleep 20
          done
          echo "::error::epistemic-graph ${VER} did NOT publish to PyPI (never returned 200)."
          echo "::error::The upload was a no-op (already-existing/mis-versioned dist) OR the PYPI_API_TOKEN"
          echo "::error::lacks maintainer rights on the 'epistemic-graph' project. Grant the token access"
          echo "::error::to that PyPI project, or fix the built version, then re-run this release."
          exit 1

  publish-image:
    name: Push multi-arch image (release only)
    needs: [docker-image]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Derive package version from tag
        run: echo "EG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Download main wheel (amd64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-x86_64
          path: docker/wheels
      - name: Download main wheel (arm64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-aarch64
          path: docker/wheels
      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EG_VERSION=${{ env.EG_VERSION }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/epistemic-graph:latest
            ${{ secrets.DOCKER_USERNAME }}/epistemic-graph:${{ github.ref_name }}
