name: Release

# ─────────────────────────────────────────────────────────────────────────
# Tag pipeline: build, check and publish ONLY (spec EG-CONTRACT-R053.7).
# Every test, gate, feature build and benchmark lives in ci.yml and runs on
# pull requests and main. `guard` refuses to proceed unless ci.yml already
# concluded `success` for this exact commit on main, so a tag publishes only
# a commit main CI has passed.
#
#   guard -> build (matrix leg)  -> uploads its own wheel to PyPI
#         -> build-x86           -> publish-x86 uploads the Linux x86_64 wheel
#         -> build-sdist         -> uploads the source distribution
#         -> build-server        -> uploads the epistemic-graph-server wheel (x86_64, aarch64)
#         -> server-image        -> per-arch image from that wheel, one multi-arch manifest
#   every uploader -> verify-pypi (checks every expected file reached PyPI)
#
# The public wheel compiles ONLY the two PyO3 extension modules (spec
# EG-CONTRACT-R053.8). Each platform publishes the moment its own completeness
# and smoke checks pass, so a slow or failed platform never blocks the others.
# `twine upload --skip-existing` makes every upload idempotent. The same pipeline
# builds and publishes the `epistemic-graph-server` wheel and its container image.
# The rolling `engine-main` prerelease asset is published by ci.yml on every main push.
#
# A manual dispatch can build the server package of an already tagged version:
# `source_ref` (a tag such as v2.27.1) selects the exact source, `packages` selects
# `all` or `server`. The guard still requires ci.yml success on that ref's commit.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_untested:
        description: >-
          EMERGENCY ONLY. Publish although ci.yml has no successful run for this
          commit. The override is logged in the run summary.
        type: boolean
        default: false
      source_ref:
        description: >-
          Server package only: tag whose source is built and published (for example
          v2.27.1). Empty builds the dispatched ref. Publishes to PyPI and the registry
          when set. The guard checks ci.yml on the commit this tag points to.
        type: string
        default: ''
      packages:
        description: Which packages to build and publish, all or server.
        type: choice
        options: [all, server]
        default: all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Registry and git fetches retry dropped connections (curl [55] SSL_read
  # resets from crates.io failed a feature-build leg) instead of cargo's 3.
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: "1"
  # Hosted runners have 4 vCPU / 16 GB. About 80% of a cold facade build is
  # codegen and linking, which one job serialised (a 4.5 h single-job gate).
  # Four jobs with no debuginfo keeps memory bounded; the cross-built wheel
  # matrix (`build`) overrides this back down.
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # A tag publishes only a commit main CI already passed.
  guard:
    name: Require a passing ci.yml run for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - name: Verify ci.yml concluded success for the tagged commit
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}
          PACKAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.packages || 'all' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_untested }}
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_REF}" ]; then
            if [ "${PACKAGES}" != server ]; then
              echo "::error::source_ref is only valid with packages=server" >&2
              exit 1
            fi
            case "${SOURCE_REF}" in v[0-9]*) ;; *) echo "::error::source_ref must be a v<version> tag" >&2; exit 1 ;; esac
            SHA="$(gh api "repos/${REPO}/commits/refs/tags/${SOURCE_REF}" --jq '.sha')"
            echo "source_ref ${SOURCE_REF} resolves to ${SHA}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          count="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&event=push&branch=main" --jq '.total_count')"
          echo "successful main ci.yml runs for ${SHA}: ${count}"
          if [ "${count}" -ge 1 ]; then
            echo "### Guard passed" >> "$GITHUB_STEP_SUMMARY"
            echo "ci.yml concluded success on main for \`${SHA}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${FORCE}" = "true" ]; then
            echo "::warning::force_untested: publishing ${SHA} without a successful ci.yml run on main"
            echo "### Guard OVERRIDDEN (force_untested)" >> "$GITHUB_STEP_SUMMARY"
            echo "No successful main ci.yml run for \`${SHA}\`; dispatched by ${GITHUB_ACTOR}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::REFUSING to publish: ci.yml has no successful main run for ${SHA}. Wait for main CI, or dispatch with force_untested for an emergency."
          exit 1

  # ── Release wheel matrix: the expensive cross-platform reproducible build.
  # The product tests and installed-wheel smoke already ran in ci.yml.
  build:
    timeout-minutes: 360
    name: wheel ${{ matrix.name }}
    needs: guard
    # Hosted platform legs; x86 is isolated in the immutable reusable job below.
    if: >-
      github.repository == 'Knuckles-Team/epistemic-graph'
      && inputs.packages != 'server'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    # Read by .github/actions/folded-wheel, which cannot see the matrix.
    env:
      EG_WHEEL_TARGET: ${{ matrix.target }}
      EG_WHEEL_MATURIN_ARGS: ${{ matrix.maturin_args }}
      # Release rustc processes (thin LTO, codegen-units = 1) are memory-heavy:
      # at 4 jobs the 16 GB hosted Linux runners were killed mid-build ("runner
      # has received a shutdown signal"). Every leg caps parallel jobs.
      EG_WHEEL_JOBS_ARG: ${{ matrix.jobs && format('--jobs {0}', matrix.jobs) || '' }}
      EG_WHEEL_MANYLINUX: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
    strategy:
      fail-fast: false
      # Every leg runs on its own GitHub-HOSTED runner VM, so the legs share no
      # compiler, disk or memory: serializing them bought nothing and cost the
      # whole matrix. Measured on run 32563780499 (2026-08-22) with the old
      # `max-parallel: 1`: linux-x86_64 ran 11:08->14:01, linux-aarch64 only
      # STARTED at 14:01, and the three remaining legs sat queued from 11:08 --
      # a ~17h projected matrix for ~3h of critical path. Legs run concurrently.
      matrix:
        include:
          # Native ARM runner: the qemu-emulated cross build on an x86 host ran
          # past two hours and lost its runner mid-build.
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
            # The two-job server compile was SIGKILLed on the 16 GiB runner.
            # Keep full features/LTO; bound Cargo concurrency to one job.
            jobs: 1
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            maturin_args: ""
            jobs: 4
          # macOS is best-effort: a runner-image or toolchain regression on a
          # platform nothing in this fleet deploys to must not withhold the
          # Linux and Windows wheels, which ARE the supported install targets.
          # `continue-on-error` keeps the leg reported but non-blocking.
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            maturin_args: ""
            jobs: 2
            optional: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'

      - name: Read tracked Rust toolchain pin
        id: rust-toolchain
        shell: bash
        run: >-
          python -c "import os,re,tomllib;
          channel=tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'];
          assert re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+', channel);
          open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write(f'channel={channel}\n')"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Bind build time to the source revision
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          case "$SOURCE_DATE_EPOCH" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # Release binaries must not retain checkout, build-user, Cargo, or toolchain
      # roots. The helper preserves existing flags using Cargo's encoded form and
      # reports counts only (never the concrete prefixes). `--target` is required
      # here (unlike the single-target `gates` job above): this job cross-builds
      # multiple targets, and the C/C++ prefix-map flag is feature-detected
      # per target compiler -- the manylinux aarch64 cross-gcc rejects
      # -ffile-prefix-map (GCC 8+ only) and falls back to -fdebug-prefix-map,
      # written to a CFLAGS_<target> variable scoped to this leg alone so it
      # can never reach a different leg's toolchain.
      - name: Configure identity-neutral Rust source paths
        shell: bash
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "${{ matrix.target }}"

      - name: Select the verified native Mach-O linker
        if: ${{ endsWith(matrix.target, '-apple-darwin') }}
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-toolchain.outputs.channel }}
        run: |
          case "$EG_WHEEL_TARGET" in
            aarch64-apple-darwin) export MACOSX_DEPLOYMENT_TARGET=11.0 ;;
          esac
          source scripts/configure_macos_linker.sh "$EG_WHEEL_TARGET"
          python - <<'PYENV'
          import os
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key in ("SDKROOT", "MACOSX_DEPLOYMENT_TARGET", "RUSTUP_TOOLCHAIN", "CARGO_ENCODED_RUSTFLAGS"):
                  output.write(f"{key}={os.environ[key]}\n")
          PYENV

      # Each pass builds the eg-pyengine wheel (engine module + Python package)
      # and the eg-numeric module, folds the latter in, then normalizes,
      # privacy-audits and checks the result (.github/actions/folded-wheel).
      # The per-platform compile cache is restored here, saved by ci.yml on main. Tag releases publish the primary
      # pass; a manual (workflow_dispatch) run adds a second pass from empty
      # Cargo state at the same neutral path and requires byte-identical wheels.
      - name: Build primary wheel (${{ matrix.name }})
        uses: ./.github/actions/folded-wheel
        with:
          pass: primary

      - name: Remove primary native build state
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: >-
          python -c "import os,shutil; from pathlib import Path;
          root=Path(os.environ['RUNNER_TEMP']).resolve();
          target=(root/'epistemic-graph-release-target').resolve();
          assert target.parent==root and target.name=='epistemic-graph-release-target';
          print('removing' if target.exists() else 'already absent:', target);
          shutil.rmtree(target) if target.exists() else None"

      - name: Build reproduction wheel (${{ matrix.name }})
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/folded-wheel
        with:
          pass: reproduction

      # Diagnostic replacement for the former bare inline `python -c` (three
      # `assert`s, no output on failure -- exactly what made the
      # windows-x86_64-only reproducibility failure undiagnosable from the CI
      # log). The three protected assertion messages are UNCHANGED
      # ('release wheel cardinality mismatch' / 'release wheel filename
      # mismatch' / 'release wheel digest mismatch') and the gate still exits
      # non-zero on any mismatch -- this only adds a full member-level
      # CONTENT-vs-CONTAINER-ONLY report on stdout. See
      # scripts/compare_wheel_reproducibility.py.
      - name: Require byte-identical folded wheels
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: python scripts/compare_wheel_reproducibility.py dist-primary dist-reproduction

      - name: Stage sole publish candidate
        shell: bash
        run: |
          mkdir dist
          cp dist-primary/epistemic_graph-*.whl dist/

      # Smoke test: install the wheel and assert it carries NO executables (the
      # server ships in epistemic-graph-server), then prove the extension modules
      # `epistemic_graph.numeric` (computing) and `epistemic_graph.engine`
      # (BUG-PE-002) import from the INSTALLED wheel.
      - name: Smoke test (no executables + import epistemic_graph.{numeric,engine})
        shell: bash
        run: bash scripts/release_wheel_smoke.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

      # Publish this platform now: folded-wheel already required a complete wheel
      # and the smoke test above passed. No other platform is awaited.
      - name: Publish ${{ matrix.name }} to PyPI
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/actions/publish-distribution
        with:
          pattern: dist/*.whl
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}

  # NOTE (CONCEPT:EG-371): the old pi/pi-max tier wheels (`wheels-pi`) and the
  # size-optimized "contains-all" tier wheels (`wheels-full-tiny`) are GONE. Those legs
  # existed only because the deployment tiers produced DIFFERENT binaries that all shared
  # the SAME wheel filename (`epistemic_graph-<ver>-py3-none-<platform>`), so only one
  # could ever publish. The tiers are collapsed into ONE main build (the `build` job
  # above), which is what publishes — no more per-tier legs, no more filename collision.

  # NOTE: the eg-numeric kernel is NO LONGER a separately-published package. Its
  # Surface-A pyo3 `.so` is FOLDED INTO the `epistemic-graph` main wheel in the
  # `build` job above, so a BARE `pip install epistemic-graph` (no extra tag)
  # provides `epistemic_graph.numeric` from ONE published package (CONCEPT:EG-346).
  # `epistemic-graph[numeric]` still resolves for old pins, but is a no-op alias —
  # it is not what makes the kernel present.

  # The engine container image is built by `server-image` below.

  build-x86:
    name: wheel linux-x86_64
    needs: guard
    if: >-
      github.repository == 'Knuckles-Team/epistemic-graph'
      && inputs.packages != 'server'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: Knuckles-Team/epistemic-graph/.github/workflows/eg-release-x86.yml@bc4448160e8d16deb8210ce8aeb058b2da293d93

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH — gated to a `v*` tag and the required release wheel matrix.
  # `guard` proves ci.yml already passed on this commit; every build waits on it.
  build-sdist:
    name: Build and validate source distribution
    needs: guard
    if: github.repository == 'Knuckles-Team/epistemic-graph' && inputs.packages != 'server'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Build source archive without native compilation
        run: |
          python -m pip install 'maturin==1.14.1'
          maturin sdist --out dist-sdist
          python scripts/check_sdist_completeness.py dist-sdist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-distribution
          path: dist-sdist/*.tar.gz
          if-no-files-found: error
      - name: Publish the source distribution to PyPI
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: ./.github/actions/publish-distribution
        with:
          pattern: dist-sdist/*.tar.gz
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}

  # The Linux x86_64 wheel is built by the immutable reusable workflow above (it
  # cannot hold the PyPI token), so it is published by this job the moment that
  # workflow finishes. It depends on no other platform.
  publish-x86:
    timeout-minutes: 360
    name: Publish linux-x86_64 wheel to PyPI
    needs: build-x86
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Require a complete wheel before upload
        run: python scripts/check_wheel_completeness.py --require-engine-kernel dist/*.whl
      - name: Publish linux-x86_64 to PyPI
        uses: ./.github/actions/publish-distribution
        with:
          pattern: dist/*.whl
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}

  # ── epistemic-graph-server: the native executable wheel, one per Linux architecture,
  # built natively (no emulation) from the source at the tagged commit. Each leg
  # uploads its wheel to PyPI right after its own smoke test. A manual dispatch with
  # `source_ref` builds and publishes the server package of an already tagged version
  # from that tag's source; the packaging directory comes from the dispatched ref.
  build-server:
    name: server wheel linux-${{ matrix.arch }}
    needs: guard
    if: >-
      github.repository == 'Knuckles-Team/epistemic-graph'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: aarch64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      # The packaging directory always comes from the dispatched ref, so a tag cut
      # before it existed can still be packaged. Its version is pinned to the source.
      - name: Overlay the packaging directory and pin its version to the source
        id: version
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}
        run: |
          set -euo pipefail
          mkdir -p source/packaging
          rm -rf source/packaging/epistemic-graph-server
          cp -r packaging/epistemic-graph-server source/packaging/epistemic-graph-server
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, tomllib
          from pathlib import Path

          version = tomllib.loads(Path("source/Cargo.toml").read_text())["package"]["version"]
          expected = os.environ["SOURCE_REF"] or (
              os.environ["GITHUB_REF_NAME"] if os.environ["GITHUB_REF_TYPE"] == "tag" else ""
          )
          if expected and expected != f"v{version}":
              raise SystemExit(f"source {expected} != Cargo.toml version v{version}")
          package = Path("source/packaging/epistemic-graph-server")
          for path, pattern in (
              (package / "pyproject.toml", r'(?m)^version = "[^"]*"'),
              (package / "epistemic_graph_server/__init__.py", r'(?m)^__version__ = "[^"]*"'),
          ):
              key = "__version__" if path.suffix == ".py" else "version"
              text, count = re.subn(pattern, f'{key} = "{version}"', path.read_text(), count=1)
              if count != 1:
                  raise SystemExit(f"no version in {path}")
              path.write_text(text)
          print(f"version={version}")
          PY
      # The fat-LTO single-codegen-unit link of the server binary outgrows the 16 GB
      # hosted runner (rustc SIGKILLed by the OOM killer on aarch64, v2.27.1). Swap
      # lets the same `release-server` profile build on every architecture.
      - name: Add swap for the fat-LTO server link
        run: |
          set -euo pipefail
          df -h /
          free -h
          avail_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          size_gb=24
          if [ "$avail_gb" -lt $((size_gb + 15)) ]; then size_gb=$((avail_gb - 15)); fi
          test "$size_gb" -ge 8 || { echo "not enough free disk for swap: ${avail_gb}G" >&2; exit 1; }
          sudo fallocate -l "${size_gb}G" /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h
      - name: Build the server wheel (release-server profile)
        uses: ./.github/actions/build-server-wheel
        with:
          source-dir: source
      - name: Smoke test the built wheel
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install source/dist-server/*.whl
          "$RUNNER_TEMP/smoke/bin/epistemic-graph-server" --help >/dev/null
          "$RUNNER_TEMP/smoke/bin/python" -c "from epistemic_graph_server import binary_path; print(binary_path())"
          ls -l "$RUNNER_TEMP/smoke/bin/epistemic-graph-server" source/dist-server/*.whl
          scripts="$(unzip -Z1 source/dist-server/*.whl | grep -c '\.data/scripts/' || true)"
          test "$scripts" = 1 || { echo "expected exactly one script, found $scripts" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-wheel-${{ matrix.arch }}
          path: source/dist-server/*.whl
          if-no-files-found: error
      # Publish this architecture now; `--skip-existing` makes a re-run idempotent.
      - name: Publish the server wheel to PyPI
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.source_ref != '')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade twine
          python -m twine upload --skip-existing source/dist-server/*.whl

  # Per-architecture image from that architecture's server wheel, pushed by digest.
  server-image:
    name: server image linux-${{ matrix.arch }}
    needs: [guard, build-server]
    if: >-
      github.repository == 'Knuckles-Team/epistemic-graph'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.source_ref != ''))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest, platform: linux/amd64}
          - {arch: aarch64, runner: ubuntu-24.04-arm, platform: linux/arm64}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-wheel-${{ matrix.arch }}
          path: docker/wheels
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push the image by digest
        id: push
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/epistemic-graph-server
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import re,sys;print(re.search(r'-([0-9][^-]*)-py3', sys.argv[1]).group(1))" "$(basename docker/wheels/*.whl)")"
          docker buildx build --file docker/Dockerfile --target runtime \
            --platform "$PLATFORM" --build-arg "EGS_VERSION=${version}" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" .
          digest="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['containerimage.digest'])" "$RUNNER_TEMP/meta.json")"
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${digest}" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error

  # One tag list for linux/amd64 + linux/arm64 under the epistemic-graph-server image name.
  server-manifest:
    name: server image manifest
    needs: server-image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-wheel-*
          merge-multiple: true
          path: wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push the multi-architecture manifest
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/epistemic-graph-server
        run: |
          set -euo pipefail
          version="$(python3 -c "import re,sys;print(re.search(r'-([0-9][^-]*)-py3', sys.argv[1]).group(1))" "$(basename "$(ls wheels/*.whl | head -n1)")")"
          docker buildx imagetools create -t "${IMAGE}:${version}" -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat digests/x86_64)" "${IMAGE}@$(cat digests/aarch64)"
          docker buildx imagetools inspect "${IMAGE}:${version}"

  # Verification only: every upload above is independent and already done. This
  # job proves each expected file reached PyPI with the exact built bytes, and
  # fails (without undoing any upload) when a platform is missing.
  verify-pypi:
    timeout-minutes: 360
    name: Verify every distribution reached PyPI
    needs: [build, publish-x86, build-sdist, build-server]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-distribution
          path: dist
      # The supported install targets: a release missing one fails loudly.
      - name: Require the Linux and Windows wheels
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64 win_amd64; do
            ls dist/*"$tag"*.whl >/dev/null 2>&1 || missing+=("$tag")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "MISSING: no wheel for ${missing[*]}" >&2
            ls -1 dist/ >&2
            exit 1
          fi
          echo "required wheels present:"; ls -1 dist/*.whl
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Checkout immutable publication contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/pipelines
          ref: main
          path: .pipeline-contract
          persist-credentials: false
      - name: Record the publication contract commit
        run: echo "PIPELINES_CONTRACT_COMMIT=$(git -C .pipeline-contract rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Freeze exact staged publication identity
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py preflight \
            --directory dist --package epistemic-graph --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication.json"
      - name: Verify every published filename and digest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py postverify \
            --directory dist --package epistemic-graph --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication.json"
      # The server package: its wheels are named server-wheel-<arch>, apart from the engine's.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-wheel-*
          merge-multiple: true
          path: dist-server
      - name: Require both Linux server wheels
        run: |
          set -euo pipefail
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64; do
            ls dist-server/*"$tag"*.whl >/dev/null || { echo "MISSING: server wheel $tag" >&2; exit 1; }
          done
      - name: Verify every published server filename and digest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py preflight \
            --directory dist-server --package epistemic-graph-server --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication-server.json"
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py postverify \
            --directory dist-server --package epistemic-graph-server --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication-server.json"
