name: Release

# ─────────────────────────────────────────────────────────────────────────
# ONE WORKFLOW, EVERY GATE BLOCKING (read this before adding a check here)
#
# This repo ships exactly ONE GitHub Actions workflow. It used to be split
# into release.yml (blocking) + advisory.yml (everything else, every step
# `continue-on-error: true`, "debt is visible but never blocks a release").
# That split was retired 2026-08-28 (wD9-CIGATE): a `push: branches: [main]`
# on this file already publishes to PyPI (`publish-pypi` <- `numeric-
# runtime-gate` <- `build` <- `gates`), so anything left in advisory.yml
# wasn't merely non-blocking, it was OUTSIDE the publish chain entirely --
# lint/architecture debt could ship to PyPI on a green push. That is a
# ratchet by this project's definition (a container whose purpose is to
# hold findings that are allowed to stay red), so it is gone. Every check
# that was real signal is now a job in this file with no
# `continue-on-error`; a job still short of that bar stays HERE too (not in
# a second file) with an explicit comment saying so — see
# `lint-and-architecture` below for the one still-open example
# (`cargo fmt`) and `feature-matrix`/`benchmarks` for two jobs whose
# `continue-on-error` is a disclosed, not-yet-measured gap rather than a
# permanent policy. Cost-heavy jobs are scoped by TRIGGER (`if:` on tag
# push / `workflow_dispatch`), never by `continue-on-error` — see those two
# jobs' `if:` conditions.
#
# Stages, in `needs:` order: gates -> lint-and-architecture -> build ->
# {docker-image, publish-pypi} (each also needs: feature-matrix + benchmarks,
# added 2026-08-28/wD9-CIGATE after those two were found to share
# docker-image/publish-pypi's own tag/dispatch trigger without being wired
# into their `needs:` -- meaning a failing feature-build combo or perf/
# recall regression could not stop a publish that ran in PARALLEL with it)
# -> publish-image (transitively protected via `needs: [docker-image]`).
# `pages` alone carries no `needs:` and is not needed BY anything, so it
# structurally cannot block the publish chain -- see its own comment for why
# that is fine (a deploy concern, not a gate).
#
# eg's wheel-digest-mismatch reproducibility bug is being fixed by a
# different, separate track of work. Nothing in this redesign touches wheel
# build/determinism LOGIC — the `build` job below is the former release-build
# `wheels` job, byte-for-byte, just re-triggered by `needs: gates` instead of
# being a top-level job on the same triggers.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: "1"
  # Resource-constrained release builders must never fan native compilation out.
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  # The ONE main build (CONCEPT:EG-371): `full` = all MAIN features that build without an
  # external GPU/robotics toolchain, plus `ast-extended` for the complete code-parsing
  # grammar tier. `cluster` (raft HA) and `full-extras` (GPU/ROS2) are opt-in build layers,
  # NOT published wheels.
  MATURIN_FEATURES: "full,ast-extended"

jobs:
  # ── STAGE 1: release-critical checks only. Nothing else may live here. ──
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ---- Secret-history scan. NEW: this was previously not wired into
      # any CI in this repo at all (no equivalent of agent-utilities'
      # D-CIP-13 gate existed here). See scripts/security/check_secret_history.py
      # and secret_history_baseline.txt (the baseline was seeded once, by
      # hand, against a 300-commit sample of real history during this
      # redesign, so the gate ships already-clean rather than immediately
      # red).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Secret-history scan
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              BASE="HEAD~1"
            else
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          echo "Scanning ${BASE}..HEAD for credential-shaped content"
          python3 scripts/security/check_secret_history.py --base "$BASE"

      # ---- THE test suite: byte-for-byte the cargo test steps from the
      # former rust-ci.yml `lint-and-test` job (fmt/clippy/architecture gates
      # moved to advisory.yml — see that file), plus protocol-parity and
      # numeric-parity, which are also genuinely test suites (pytest-based
      # parity tests over the wire protocol and the compiled numeric
      # kernel), combined into one job so a correctness regression fails
      # fast, before the 5-platform wheel matrix in `build` ever runs.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test (lower crates, all features)
        run: cargo test -p eg-types -p eg-core -p eg-compute --all-features --no-fail-fast
      - name: Test (facade full)
        run: cargo test -p epistemic-graph --features full --no-fail-fast
      # The blob RSS-bound tests read WHOLE-PROCESS RSS, so they are #[ignore]d out
      # of the parallel run above (a concurrent sibling's 256MB blob inflates the
      # shared RSS past the cap). Run them here in isolation — serial + ignored — so
      # the memory-regression coverage stays in CI without the parallel pollution.
      - name: Test (memory-regression — RSS bounds, isolated)
        run: cargo test -p epistemic-graph --features full --no-fail-fast bounded_memory -- --ignored --test-threads=1
      - name: Test (slim server — gated-out methods return the not-built error)
        run: cargo test -p epistemic-graph --no-default-features --features server --no-fail-fast
      # DE7 (durable-execution-native.md): replay-determinism crash-and-reopen
      # proofs for eg-jobs/eg-statechart.
      - name: Test (replay-determinism — eg-jobs/eg-statechart crash-replay proofs, DE7)
        run: cargo test -p eg-jobs -p eg-statechart --test replay_determinism --no-fail-fast
      # The fuzz + concurrency-chaos proptest suite (long random valid pipelines,
      # snapshot-isolation under contention) — a correctness test, kept here
      # (release-critical) rather than moving with the rest of the former
      # `benchmarks` job (which is a perf/recall gate and belongs in
      # advisory.yml).
      - name: Query-pipeline fuzz + chaos (eg-plan)
        run: cargo test -p eg-plan --features "query,owl,text,timeseries,federation" --test fuzz_pipelines --no-fail-fast

      - name: Install pytest
        run: pip install pytest
      - name: Epistemic Operations manifest ⇄ Rust DTO parity
        run: python3 scripts/check_epistemic_operations_protocol.py
      - name: Protocol parity (Python client ⇄ Rust Method enum)
        run: python -m pytest tests/test_protocol_parity.py --noconftest -q

      # numeric-parity + NE-249: the developer-only reference gate proves EVERY
      # kernel op matches its NumPy reference, AND that the kernel still imports
      # and computes with NumPy import-blocked. NumPy is installed only in this
      # isolated gates job; it must never enter the published wheel metadata or
      # release smoke path.
      #
      # There is exactly ONE published package, `epistemic-graph` (CONCEPT:EG-346,
      # see the injector under scripts/) — the numeric kernel ships INSIDE its
      # wheel as a native `epistemic_graph.numeric` extension. There is NO
      # separately published/installed `eg-numeric` package. This job used to
      # `pip install --no-index --find-links target/wheels eg-numeric`, which
      # installed the intermediate build artifact as a standalone top-level
      # `numeric` package — even though the artifact is a `python -m build`-style
      # dev target, not a release shape. Because `crates/eg-numeric`'s version is
      # permanently `0.1.0`, that install could report success while changing
      # nothing: pip found a stale same-version copy "already satisfied" and
      # silently skipped a fresh build. That is exactly what happened on
      # 2026-08-21 (see ci_gate_replica.py's LOCAL_ENV_OVERRIDES comment): the
      # NE-249 boundary contract ran 16 of 17 cases against a six-week-old
      # `numeric.abi3.so`, reporting failures against operations that exist.
      #
      # So this gate now builds BOTH the numeric kernel wheel and a real
      # `epistemic-graph` server wheel, folds the former into the latter (the
      # exact same fold the real release path performs per-platform below —
      # see "Fold primary/reproduction numeric kernel into the epistemic-graph
      # wheel") — and installs THAT into a clean throwaway venv. The parity and
      # boundary-contract tests then exercise `epistemic_graph.numeric` from the
      # natively-injected wheel, never a standalone `eg-numeric` install.
      - name: Install maturin + parity deps
        run: pip install 'maturin>=1,<2' numpy pytest
      - name: Configure identity-neutral Rust source paths
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV"
      - name: Build gates numeric kernel wheel (feature python)
        run: maturin build --release -m crates/eg-numeric/Cargo.toml --features python --out numdist-gates
      - name: Normalize build-local SBOM references (numeric kernel wheel)
        run: python scripts/normalize_wheel_sbom.py numdist-gates/*.whl
      - name: Normalize retained native build paths (numeric kernel wheel)
        run: python scripts/normalize_wheel_build_paths.py numdist-gates/*.whl
      - name: Audit numeric kernel wheel for retained build identity
        run: python scripts/check_wheel_privacy.py numdist-gates/*.whl
      # ── Fold the eg-pyengine in-process engine binding INTO this same gates wheel,
      #    the identical pattern as the numeric kernel just above (CONCEPT:BUG-PE-002).
      #    A separate maturin target (`crates/eg-pyengine --features python`), a
      #    separate pyo3 cdylib, folded in by `scripts/inject_pyengine.py`.
      - name: Build gates pyengine kernel wheel (feature python)
        run: maturin build --release -m crates/eg-pyengine/Cargo.toml --features python --out enginedist-gates
      - name: Normalize build-local SBOM references (pyengine kernel wheel)
        run: python scripts/normalize_wheel_sbom.py enginedist-gates/*.whl
      - name: Normalize retained native build paths (pyengine kernel wheel)
        run: python scripts/normalize_wheel_build_paths.py enginedist-gates/*.whl
      - name: Audit pyengine kernel wheel for retained build identity
        run: python scripts/check_wheel_privacy.py enginedist-gates/*.whl
      # Deliberately NOT `--release --features "$MATURIN_FEATURES"`. This wheel is a
      # FOLD TARGET: everything asserted about it downstream — that the numeric
      # kernel injects, that RECORD stays valid, that the console script keeps its
      # 0755 bit, that no build identity is retained, that
      # `epistemic_graph.numeric` imports and computes from the INSTALLED wheel —
      # is a property of wheel PACKAGING, not of which engine features were
      # compiled in or at what optimisation level. The `build` job below still
      # produces the real `full,ast-extended` release artifacts for every target.
      #
      # Measured 2026-08-21: `--release --features full,ast-extended` takes ~40
      # minutes (DataFusion, Polars, Wasmtime, 15 tree-sitter grammars, LTO), and
      # inside `ci_gate_replica.py` — whose per-step ceiling is 3600s — it TIMED
      # OUT, cascading into five dependent steps that then reported their own
      # failures. A slim server build produces a byte-identically-shaped wheel for
      # these purposes in ~2.5 minutes, and was verified end to end: all four wheel
      # audits pass and the NE-249 boundary contract is 17/17 against it.
      - name: Build gates epistemic-graph server wheel (fold target)
        run: maturin build --no-default-features --features server --out dist-gates
      - name: Fold the numeric kernel into the gates epistemic-graph wheel (EG-346)
        run: |
          python scripts/inject_numeric_kernel.py "$(ls dist-gates/epistemic_graph-*.whl)" "$(ls numdist-gates/*.whl)"
      - name: Fold the pyengine kernel into the gates epistemic-graph wheel (BUG-PE-002)
        run: |
          python scripts/inject_pyengine.py "$(ls dist-gates/epistemic_graph-*.whl)" "$(ls enginedist-gates/*.whl)"
      - name: Normalize and audit the folded gates wheel
        run: |
          python scripts/normalize_wheel_sbom.py dist-gates/*.whl
          python scripts/normalize_wheel_build_paths.py dist-gates/*.whl
          python scripts/check_wheel_privacy.py dist-gates/*.whl
      - name: Require a complete gates wheel (numeric + engine kernels + executable binary + RECORD)
        run: python scripts/check_wheel_completeness.py --require-engine-kernel dist-gates/*.whl
      - name: Install the folded epistemic-graph wheel into a clean throwaway venv
        run: |
          python -m venv .gates-wheel-venv
          .gates-wheel-venv/bin/pip install --upgrade pip
          .gates-wheel-venv/bin/pip install numpy pytest "$(ls dist-gates/epistemic_graph-*.whl)"
      # Run from a scratch directory, NOT the repo root. `python -m pytest` puts
      # CWD first on sys.path, so from the root `import epistemic_graph.numeric`
      # resolves the SOURCE TREE's `epistemic_graph/numeric.abi3.so` — a
      # gitignored build artifact — instead of the wheel just installed into the
      # venv. That silently inverts the entire point of these two steps, which
      # exist to test the INSTALLED artifact.
      #
      # CI passes today only because a fresh checkout has no such artifact. That
      # is luck, not isolation: measured 2026-08-22, a local run resolved an
      # August 18 kernel missing `linspace`/`fill_diagonal` and reported 12 of 17
      # NE-249 cases failing against operations that are present in the wheel
      # under test. Anchoring to $REPO and running from elsewhere makes the
      # shadowing impossible rather than improbable.
      - name: numpy-parity gate (compiled kernel vs numpy)
        run: |
          REPO="$PWD"
          cd "$(mktemp -d)"
          PYTHONNOUSERSITE=1 "$REPO/.gates-wheel-venv/bin/python" -m pytest \
            "$REPO/crates/eg-numeric/tests/test_kernel_parity.py" --noconftest -q
      # NE-249: the boundary contract, which nothing ran until now. This file
      # holds the single most load-bearing property of the NumPy retirement --
      # `test_import_and_native_calls_succeed_with_numpy_import_blocked` spawns
      # a fresh interpreter with `import numpy` denied and proves the kernel
      # still imports and computes -- plus the bounds checks and the restored
      # construction surface. Running only `test_kernel_parity.py` from this
      # directory meant the retirement was verified by a test that never
      # executed, while `numpy` stayed installed in this job for the parity
      # gate above and would have masked a regression completely.
      - name: numpy-free boundary contract (NE-249)
        run: |
          REPO="$PWD"
          cd "$(mktemp -d)"
          PYTHONNOUSERSITE=1 "$REPO/.gates-wheel-venv/bin/python" -m pytest \
            "$REPO/crates/eg-numeric/tests/test_builtin_boundary.py" --noconftest -q
      # BUG-PE-002: `import epistemic_graph.engine` must succeed from the INSTALLED
      # wheel, exactly the same shadowing-avoidance discipline as the numeric smoke
      # check above (a bare `python -c` at the repo root would resolve the SOURCE
      # tree instead of the venv's installed wheel).
      - name: engine kernel smoke test (import epistemic_graph.engine)
        run: |
          REPO="$PWD"
          cd "$(mktemp -d)"
          PYTHONNOUSERSITE=1 "$REPO/.gates-wheel-venv/bin/python" -c \
            "import epistemic_graph.engine as e; print('engine kernel OK:', e.__file__, '| __engine__=', getattr(e, '__engine__', None))"

  # ── STAGE 1b: architecture/documentation-contract gates + lint. Folded in
  # from the former advisory.yml `lint-and-architecture` job (wD9-CIGATE,
  # 2026-08-28): every step below was measured green against this commit
  # (8 architecture/doc gates + all 3 clippy profiles) and made blocking --
  # no `continue-on-error` anywhere in this job. See this file's top header
  # for why the two-workflow/continue-on-error model was retired.
  #
  # NOT YET INCLUDED: `cargo fmt --all --check`. Measured 2026-08-28 red on
  # 3 files (crates/eg-rdf/src/obda.rs, src/server/mutation.rs,
  # src/server/redis_wire/mod.rs), each mid-edit in a live CX complexity-
  # reduction lane -- formatting them here would fight their uncommitted
  # work, and this program's own sequencing rule is "measure first, fix the
  # red, then restructure" (never flip an unmeasured/known-red check to
  # blocking). Add this step, still with no `continue-on-error`, once those
  # three lanes land -- tracked as open debt, not silenced.
  lint-and-architecture:
    name: Lint + architecture gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: P2 modality architecture gate
        run: python3 scripts/check_p2_modality_architecture.py
      - name: P2 analytics and reasoning architecture gate
        run: python3 scripts/check_p2_analytics_reasoning_architecture.py
      - name: Bounded lazy lifecycle architecture gate
        run: python3 scripts/check_lazy_lifecycle_architecture.py
      - name: Universal served-read RLS and carrier-ownership architecture gate
        run: python3 scripts/check_universal_read_rls.py
      - name: Exact protocol, multimodal, KnowledgeBatch, and reasoning campaign architecture gate
        run: python3 scripts/check_exact_release_campaigns.py
      - name: Documentation feature, ledger, and MkDocs contract
        run: python3 scripts/check_documentation_contract.py
      - name: Status page freshness gate (docs/status.md vs capabilities/concept-reservations)
        run: python3 scripts/check_status_page.py
      - name: Canonical structural property schema
        run: python3 scripts/check_canonical_property_schema.py
      # ── Native build dependency for the `--all-features` clippy below.
      #
      # This is the ONLY job in this workflow that compiles the workspace with
      # `--all-features`, which is the only way `eg-stream/cdc-kafka` (and so
      # `rdkafka` -> `rdkafka-sys/sasl` -> `sasl2-sys`) is ever turned on --
      # `full`, the published wheel feature set, deliberately excludes it, so
      # none of the five `build` legs need this.
      #
      # `sasl2-sys` 0.1.22+2.1.28 links the SYSTEM Cyrus SASL: its build.rs
      # `find_sasl()` path hard-panics with "Unable to find libsasl2 on your
      # system" (build.rs:343, exit 101) when the development package is
      # absent. `ubuntu-latest` does not ship it; every eg dev/build host does
      # (`ii libsasl2-dev 2.1.28+dfsg1-9ubuntu3`), which is exactly why this
      # failed ONLY on the runner and passed in every local pre-push run --
      # it killed this job on EVERY push to `main` from 2026-08-18 through
      # 33200059527 (2026-08-28), so `publish-pypi` never once ran and
      # epistemic-graph has been stuck at 2.23.0 on PyPI.
      #
      # Vendoring instead (`sasl2-sys/vendored`) was measured and rejected on
      # 2026-08-28: the bundled Cyrus SASL 2.1.28 `lib/md5.c` does not compile
      # under a C23-default compiler (GCC >= 14; our hosts run GCC 15.2), and
      # the only fix is a process-level `CFLAGS=-std=gnu17` that a Cargo
      # manifest cannot express. See `crates/eg-stream/Cargo.toml`'s
      # `cdc-kafka` feature comment and the WD10-P-EGCI lane report.
      #
      # ⚠ If you add another job that builds this workspace with
      # `--all-features`, it needs this step too.
      #
      # SECOND missing package, found by running this very step on CI
      # (run 33204989595, 2026-08-28): with libsasl2-dev in place the build
      # got 2m30s further and then died compiling librdkafka itself --
      #   librdkafka/src/rdkafka_conf.c:60: fatal error: curl/curl.h:
      #   No such file or directory
      # -- even though rdkafka-sys passes `-DWITH_CURL=0` (our `cdc-kafka`
      # feature does not ask for rdkafka's `curl`). That is an upstream
      # librdkafka 2.12.1 defect, not a misconfiguration: `config.h` is
      # generated with `#cmakedefine01 WITH_OAUTHBEARER_OIDC`, which ALWAYS
      # emits `#define WITH_OAUTHBEARER_OIDC 0|1`, and `rdkafka_conf.c:59` is
      # the single site in the whole tree that tests it with `#ifdef` instead
      # of `#if` (rdkafka.c, rdkafka_sasl_oauthbearer.c, rdunittest.c and the
      # other four sites in rdkafka_conf.c itself all use `#if` correctly).
      # So the curl HEADER is unconditionally required by any cmake build of
      # librdkafka 2.12.1, while every actual curl CALL stays behind `#if` and
      # nothing links against libcurl. Headers only -- hence the -dev package
      # and no linker change. Same invisibility mechanism as libsasl2: our
      # build hosts have `libcurl4-openssl-dev` installed.
      #
      # NOT installed here, deliberately: `libssl-dev` (rdkafka's `ssl` ->
      # openssl-sys) and zlib/zstd. `ubuntu-latest` ships libssl-dev (cmake
      # reported "Found OpenSSL ... 3.0.13" in the same run) and librdkafka is
      # configured with `-DWITH_ZLIB=0 -DWITH_ZSTD=0`, so nothing is red.
      # openssl-sys is nevertheless the SAME class of incidental dependency --
      # if the runner image ever drops libssl-dev this job fails identically.
      - name: Install librdkafka/Cyrus-SASL build headers (system-linked C deps)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsasl2-dev libcurl4-openssl-dev
          pkg-config --exists libsasl2 && echo "libsasl2 present: $(pkg-config --modversion libsasl2)"
          test -f /usr/include/x86_64-linux-gnu/curl/curl.h || test -f /usr/include/curl/curl.h
          echo "curl/curl.h present"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Lint each gated build so warnings can't accumulate. `-D warnings` makes
      # clippy fail the step (and now the job/workflow) on any lint. Numeric
      # matrix modules carry scoped `#![allow(clippy::needless_range_loop)]`
      # where explicit indices are clearer.
      - name: Clippy (every crate, all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Clippy (slim lib)
        run: cargo clippy --no-default-features --features graph,algorithms -- -D warnings
      - name: Clippy (slim server — proves no compute leaks into the lean build)
        run: cargo clippy --no-default-features --features server --all-targets -- -D warnings

  # ── STAGE 2: the ONE main wheel (CONCEPT:EG-371), built for every
  # supported native target — release-critical item: wheel build +
  # reproducibility + release-contract + wheel-privacy checks. Needs: gates.
  # UNCHANGED from the former release-build.yml `wheels` job (this is where
  # a separate track is fixing the wheel-digest-reproducibility bug — do not
  # change this job's build/determinism logic here).
  build:
    name: wheel ${{ matrix.name }}
    needs: [gates, lint-and-architecture]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    # An OPTIONAL leg must not hold the whole run open. Measured on run
    # 32697532796: macos-x86_64 is `continue-on-error: true`, yet the run sat at
    # 8h06m because a non-blocking leg still keeps the matrix (and therefore the
    # `publish-pypi` gate that `needs: build`) alive until it finishes or the
    # 6h GitHub default expires. `matrix.timeout_minutes` caps the best-effort
    # legs tightly while leaving the supported legs a generous bound -- the
    # measured full `--release --features full,ast-extended` build is ~40 min
    # per pass and each leg runs two passes plus fold/normalize/compare.
    timeout-minutes: ${{ matrix.timeout_minutes || 240 }}
    strategy:
      fail-fast: false
      # Every leg runs on its own GitHub-HOSTED runner VM, so the legs share no
      # compiler, disk or memory: serializing them bought nothing and cost the
      # whole matrix. Measured on run 32563780499 (2026-08-22) with the old
      # `max-parallel: 1`: linux-x86_64 ran 11:08->14:01, linux-aarch64 only
      # STARTED at 14:01, and the three remaining legs sat queued from 11:08 --
      # a ~17h projected matrix for ~3h of critical path. Legs run concurrently.
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            maturin_args: ""
          # macOS is best-effort: a runner-image or toolchain regression on a
          # platform nothing in this fleet deploys to must not withhold the
          # Linux and Windows wheels, which ARE the supported install targets.
          # `continue-on-error` keeps the leg reported but non-blocking.
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            maturin_args: ""
            timeout_minutes: 90
            optional: true
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            maturin_args: ""
            timeout_minutes: 90
            optional: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Read tracked Rust toolchain pin
        id: rust-toolchain
        shell: bash
        run: >-
          python -c "import os,re,tomllib;
          channel=tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'];
          assert re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+', channel);
          open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write(f'channel={channel}\n')"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Bind build time to the source revision
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          case "$SOURCE_DATE_EPOCH" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # Release binaries must not retain checkout, build-user, Cargo, or toolchain
      # roots. The helper preserves existing flags using Cargo's encoded form and
      # reports counts only (never the concrete prefixes). `--target` is required
      # here (unlike the single-target `gates` job above): this job cross-builds
      # multiple targets, and the C/C++ prefix-map flag is feature-detected
      # per target compiler -- the manylinux aarch64 cross-gcc rejects
      # -ffile-prefix-map (GCC 8+ only) and falls back to -fdebug-prefix-map,
      # written to a CFLAGS_<target> variable scoped to this leg alone so it
      # can never reach a different leg's toolchain.
      - name: Configure identity-neutral Rust source paths
        shell: bash
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "${{ matrix.target }}"

      # Two independent native builds prove the complete folded wheel is byte-for-byte
      # reproducible. Each pass starts from empty Cargo state at the same neutral path
      # and writes to a separate wheel output root; the numeric kernel is compiled,
      # injected, normalized, and privacy-audited before the digests are compared.
      # Steps remain deliberately serial.
      - name: Build primary wheel (${{ matrix.name }})
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist-primary
            --features ${{ env.MATURIN_FEATURES }}
            ${{ matrix.maturin_args }}
          # zig gives reproducible glibc-pinned linux cross-builds.
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      # ── Fold the eg-numeric Surface-A kernel INTO this same wheel (CONCEPT:EG-346).
      #    Build the pyo3 cdylib kernel (`crates/eg-numeric --features python`) for the
      #    SAME target, then inject its compiled extension (`.so`/`.pyd`) into the
      #    server wheel as `epistemic_graph.numeric`. Result: ONE published `epistemic-graph`
      #    wheel that ships BOTH the server binary AND the numeric kernel — no separate
      #    `eg-numeric` package on PyPI. The kernel is a distinct maturin target (a pyo3
      #    cdylib), so the engine binary's no-pyo3 / Pi contract is untouched.
      - name: Build primary eg-numeric kernel (same target)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out numdist-primary
            -m crates/eg-numeric/Cargo.toml
            --features python
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      - name: Fold primary numeric kernel into the epistemic-graph wheel
        shell: bash
        run: |
          python scripts/inject_numeric_kernel.py "$(ls dist-primary/epistemic_graph-*.whl)" "$(ls numdist-primary/*.whl)"

      # ── Fold the eg-pyengine in-process engine binding INTO this same wheel
      #    (BUG-PE-002: `import epistemic_graph.engine` fails in the live shipped
      #    image because nothing built and folded this extension). Identical shape
      #    to the numeric kernel fold immediately above — a distinct maturin pyo3
      #    cdylib target (`crates/eg-pyengine --features python`), injected by
      #    `scripts/inject_pyengine.py`. The two injections compose freely and are
      #    order-independent (each only reads/rewrites the target wheel's RECORD,
      #    never the other's extension member) — folded here right after numeric so
      #    one normalize/audit/completeness pass below covers both grafts.
      - name: Build primary eg-pyengine kernel (same target)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out enginedist-primary
            -m crates/eg-pyengine/Cargo.toml
            --features python
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      - name: Fold primary pyengine kernel into the epistemic-graph wheel
        shell: bash
        run: |
          python scripts/inject_pyengine.py "$(ls dist-primary/epistemic_graph-*.whl)" "$(ls enginedist-primary/*.whl)"

      - name: Normalize and audit primary wheel
        shell: bash
        run: |
          python scripts/normalize_wheel_sbom.py dist-primary/*.whl
          python scripts/normalize_wheel_build_paths.py dist-primary/*.whl
          python scripts/check_wheel_privacy.py dist-primary/*.whl

      # Assert the artifact is COMPLETE after every step that rewrites it (inject,
      # sbom, build-path normalization). Published 2.14.0-2.23.0 wheels shipped with
      # NO numeric kernel because nothing here ever inspected the payload — the graft
      # is silent when it fails. Running the gate on the build leg localizes such a
      # regression to the platform that produced it; `publish-pypi` re-runs it on the
      # downloaded artifacts as the actual publish boundary.
      - name: Require a complete primary wheel (numeric + engine kernels + executable binary + RECORD)
        shell: bash
        run: python scripts/check_wheel_completeness.py --require-engine-kernel dist-primary/*.whl

      - name: Remove primary native build state
        shell: bash
        run: >-
          python -c "import os,shutil; from pathlib import Path;
          root=Path(os.environ['RUNNER_TEMP']).resolve();
          target=(root/'epistemic-graph-release-target').resolve();
          assert target.parent==root and target.name=='epistemic-graph-release-target';
          print('removing' if target.exists() else 'already absent:', target);
          shutil.rmtree(target) if target.exists() else None"

      - name: Build reproduction wheel (${{ matrix.name }})
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        continue-on-error: ${{ matrix.experimental == true }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist-reproduction
            --features ${{ env.MATURIN_FEATURES }}
            ${{ matrix.maturin_args }}
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      - name: Build reproduction eg-numeric kernel (same target)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out numdist-reproduction
            -m crates/eg-numeric/Cargo.toml
            --features python
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      - name: Fold reproduction numeric kernel into the epistemic-graph wheel
        shell: bash
        run: |
          python scripts/inject_numeric_kernel.py "$(ls dist-reproduction/epistemic_graph-*.whl)" "$(ls numdist-reproduction/*.whl)"

      - name: Build reproduction eg-pyengine kernel (same target)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/epistemic-graph-release-target
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out enginedist-reproduction
            -m crates/eg-pyengine/Cargo.toml
            --features python
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'false'

      - name: Fold reproduction pyengine kernel into the epistemic-graph wheel
        shell: bash
        run: |
          python scripts/inject_pyengine.py "$(ls dist-reproduction/epistemic_graph-*.whl)" "$(ls enginedist-reproduction/*.whl)"

      - name: Normalize and audit reproduction wheel
        shell: bash
        run: |
          python scripts/normalize_wheel_sbom.py dist-reproduction/*.whl
          python scripts/normalize_wheel_build_paths.py dist-reproduction/*.whl
          python scripts/check_wheel_privacy.py dist-reproduction/*.whl

      - name: Require a complete reproduction wheel
        shell: bash
        run: python scripts/check_wheel_completeness.py --require-engine-kernel dist-reproduction/*.whl

      # Diagnostic replacement for the former bare inline `python -c` (three
      # `assert`s, no output on failure -- exactly what made the
      # windows-x86_64-only reproducibility failure undiagnosable from the CI
      # log). The three protected assertion messages are UNCHANGED
      # ('release wheel cardinality mismatch' / 'release wheel filename
      # mismatch' / 'release wheel digest mismatch') and the gate still exits
      # non-zero on any mismatch -- this only adds a full member-level
      # CONTENT-vs-CONTAINER-ONLY report on stdout. See
      # scripts/compare_wheel_reproducibility.py.
      - name: Require byte-identical folded wheels
        shell: bash
        run: python scripts/compare_wheel_reproducibility.py dist-primary dist-reproduction

      - name: Stage sole publish candidate
        shell: bash
        run: |
          mkdir dist
          cp dist-primary/epistemic_graph-*.whl dist/

      # Smoke test: install the wheel, run the server `--help`, AND prove the folded-in
      # kernels import (`epistemic_graph.numeric`, computing; `epistemic_graph.engine`,
      # BUG-PE-002). Skipped for the cross-only leg (linux-aarch64 on an x86 host) where
      # the binary can't execute on the runner. Three independent regressions this
      # asserts (the first two were real, shipped regressions; the third is BUG-PE-002 —
      # `import epistemic_graph.engine` failing in the live shipped image because
      # nothing built and folded this extension before this lane):
      #   1) the server console binary must stay EXECUTABLE — the numeric inject repacks
      #      the wheel zip and MUST preserve the 0755 mode on
      #      `*.data/scripts/epistemic-graph-server`; dropping the exec bit made pip
      #      install a non-runnable binary that died with "Permission denied".
      #   2) the numeric kernel must import AND compute from the INSTALLED wheel.
      #   3) the engine kernel must import from the INSTALLED wheel.
      - name: Smoke test (server --help + import epistemic_graph.{numeric,engine})
        if: ${{ matrix.name != 'linux-aarch64' && matrix.experimental != true }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install the BARE wheel — NO compatibility extra. The native kernel retired its
          # interpreter-side NumPy dependency; `check_wheel_completeness.py` rejects both
          # base and extra-gated NumPy metadata. Keep this smoke test independent from the
          # developer-only parity environment below.
          pip install "$(ls dist/epistemic_graph-*.whl)"
          # (1) The binary must be executable (inject must preserve 0755) — fails loud
          #     with "Permission denied" otherwise.
          epistemic-graph-server --help
          # (2) Import + compute the kernel FROM THE INSTALLED WHEEL. Run from a neutral
          #     dir ($RUNNER_TEMP) — the repo checkout root holds the `epistemic_graph/`
          #     SOURCE package (no compiled `.so`), and cwd is on sys.path for `python -c`,
          #     so importing at the repo root would shadow the wheel and always fail.
          cd "${RUNNER_TEMP:-/tmp}"
          python - <<'PY'
          import importlib.metadata as metadata
          import re

          requirements = metadata.requires("epistemic-graph") or []
          assert not any(
              re.split(r"[\\[<>=!~;]", requirement, maxsplit=1)[0].lower() == "numpy"
              for requirement in requirements
          ), requirements
          PY
          python -c "import epistemic_graph.numeric as n; values=[1.,2.,3.,4.]; assert n.sum(values)==10.0 and n.mean(values)==2.5, (n.sum(values), n.mean(values)); print('numeric kernel OK:', n.__file__, '| sum=', n.sum(values), 'mean=', n.mean(values), 'std=', n.std(values))"
          python -c "import epistemic_graph.engine as e; print('engine kernel OK:', e.__file__, '| __engine__=', getattr(e, '__engine__', None))"

      - name: Upload wheel artifact
        if: ${{ matrix.experimental != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  # NOTE (CONCEPT:EG-371): the old pi/pi-max tier wheels (`wheels-pi`) and the
  # size-optimized "contains-all" tier wheels (`wheels-full-tiny`) are GONE. Those legs
  # existed only because the deployment tiers produced DIFFERENT binaries that all shared
  # the SAME wheel filename (`epistemic_graph-<ver>-py3-none-<platform>`), so only one
  # could ever publish. The tiers are collapsed into ONE main build (the `build` job
  # above), which is what publishes — no more per-tier legs, no more filename collision.

  # NOTE: the eg-numeric kernel is NO LONGER a separately-published package. Its
  # Surface-A pyo3 `.so` is FOLDED INTO the `epistemic-graph` main wheel in the
  # `build` job above, so a BARE `pip install epistemic-graph` (no extra tag)
  # provides `epistemic_graph.numeric` from ONE published package (CONCEPT:EG-346).
  # `epistemic-graph[numeric]` still resolves for old pins, but is a no-op alias —
  # it is not what makes the kernel present.

  # ── Multi-arch Docker DB image (BUILD + in-image `--help` smoke; no push).
  #    Installs the wheel BUILT IN THIS SAME RUN — no PyPI round-trip.
  #    Tag-gated: only builds on a `v*` tag. Also `needs:` feature-matrix and
  #    benchmarks (wD9-CIGATE, 2026-08-28) -- same caveat as publish-pypi's
  #    own comment below: this `needs:` edge is necessary but, on its own,
  #    NOT YET sufficient, because both jobs still carry
  #    `continue-on-error: true` (unmeasured this session) and GitHub
  #    reports a `continue-on-error: true` job as succeeded to its
  #    dependents regardless of its own step outcomes. See publish-pypi's
  #    comment for the full explanation and the `build.matrix.optional`
  #    precedent this relies on.
  docker-image:
    needs: [build, feature-matrix, benchmarks]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Derive package version from tag
        run: echo "EG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Download wheel (amd64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-x86_64
          path: docker/wheels
      - name: Download wheel (arm64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-aarch64
          path: docker/wheels
      - name: Build multi-arch image (install CI-built wheel; no PyPI)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            EG_VERSION=${{ env.EG_VERSION }}
          tags: epistemic-graph:ci

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH — GATED to a `v*` tag only; skipped entirely on a normal branch
  # push or PR. Needs: build, feature-matrix, benchmarks, so publishing is
  # unreachable if `gates`, `lint-and-architecture` (transitively, via
  # `build`), or `build` failed -- `if:` below has no always()/failure()/
  # cancelled(), so GitHub's implicit success()-of-all-needs applies to the
  # full `needs:` list with no further change needed FOR THOSE THREE.
  #
  # `feature-matrix`/`benchmarks` are also `needs:` here (added 2026-08-28,
  # wD9-CIGATE) -- necessary, but on their own NOT YET sufficient. Both run
  # on this exact tag trigger already (see their own `if:`) but previously
  # were not wired into this `needs:` at all, so a failing feature-build
  # combo or perf/recall regression could not stop a publish that ran in
  # PARALLEL with it. This `needs:` edge alone does not close that gap:
  # both jobs still carry `continue-on-error: true` (2026-08-28 measurement
  # never reached them -- 13 cargo builds plus a bench run, deferred; see
  # the wD9-CIGATE report), and a job with `continue-on-error: true` is
  # reported SUCCEEDED to anything that `needs:` it regardless of whether
  # its own steps failed -- exactly the mechanism the `build` job's own
  # `matrix.optional` leg above relies on to keep an optional macOS failure
  # from blocking this same `needs: build` chain. So today this `needs:`
  # edge is a correct, necessary prerequisite that does nothing on its own;
  # it only starts BLOCKING once `continue-on-error` is removed from
  # feature-matrix/benchmarks, which requires actually measuring them
  # green first (the sequencing rule this whole redesign follows: never
  # flip an unmeasured/known-red check to blocking). Until then, the
  # publish path still ships on a red feature-matrix/benchmarks leg --
  # narrowed from "any push" to "a tag push", but not yet closed.
  # ─────────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish wheels to PyPI (release only)
    needs: [build, feature-matrix, benchmarks]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # Collect every wheel the matrix produced. A pattern download means an
      # optional platform that did not build is simply absent rather than a
      # hard failure, while the required set is asserted explicitly below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      # The supported install targets. Publishing without one of these would
      # silently ship a release that cannot be installed on a platform we claim
      # to support, so it fails loudly instead.
      - name: Require the Linux and Windows wheels
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64 win_amd64; do
            ls dist/*"$tag"*.whl >/dev/null 2>&1 || missing+=("$tag")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "REFUSING to publish: no wheel for ${missing[*]}" >&2
            ls -1 dist/ >&2
            exit 1
          fi
          echo "required wheels present:"; ls -1 dist/*.whl
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # ── THE PUBLISH BOUNDARY GATE. Every wheel about to be uploaded must carry the
      #    folded numeric AND engine kernels (BUG-PE-002 — the `build` job above now
      #    always folds both), an EXECUTABLE server binary, the full python surface,
      #    and a self-consistent RECORD. This runs on the DOWNLOADED artifacts, so it
      #    catches an incomplete wheel no matter which upstream step regressed.
      - name: Require every distribution to be complete before upload
        run: |
          python -m pip install --upgrade pip
          echo "Distributions staged for upload:"
          ls -1 dist/
          python scripts/check_wheel_completeness.py --require-engine-kernel dist/*.whl

      - name: Publish to PyPI (token)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          echo "Distributions to upload:"
          ls -1 dist/
          twine upload --skip-existing --verbose dist/*

      # HONEST VERIFICATION — CI must go RED if the release did NOT actually land on
      # PyPI. `--skip-existing` (and any token-scope / name mismatch) can make the
      # upload step pass without publishing the tag version; this step asserts the
      # exact tag version is now queryable on PyPI, retrying for CDN propagation lag.
      - name: Verify epistemic-graph ${{ github.ref_name }} is published on PyPI
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Asserting epistemic-graph==${VER} is live on PyPI…"
          url="https://pypi.org/pypi/epistemic-graph/${VER}/json"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: epistemic-graph ${VER} is published (PyPI returned 200)."
              python -m pip download --no-deps --only-binary :all: \
                "epistemic-graph==${VER}" -d pypi-verify
              python scripts/check_wheel_completeness.py --require-engine-kernel pypi-verify/*.whl
              echo "OK: the wheel PyPI serves for ${VER} is complete."
              exit 0
            fi
            echo "Attempt ${i}: PyPI returned HTTP ${code} for ${VER} — retrying in 20s (CDN lag)…"
            sleep 20
          done
          echo "::error::epistemic-graph ${VER} did NOT publish to PyPI (never returned 200)."
          echo "::error::The upload was a no-op (already-existing/mis-versioned dist) OR the PYPI_API_TOKEN"
          echo "::error::lacks maintainer rights on the 'epistemic-graph' project. Grant the token access"
          echo "::error::to that PyPI project, or fix the built version, then re-run this release."
          exit 1

  publish-image:
    name: Push multi-arch image (release only)
    needs: [docker-image]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Derive package version from tag
        run: echo "EG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Download main wheel (amd64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-x86_64
          path: docker/wheels
      - name: Download main wheel (arm64)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-linux-aarch64
          path: docker/wheels
      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EG_VERSION=${{ env.EG_VERSION }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/epistemic-graph:latest
            ${{ secrets.DOCKER_USERNAME }}/epistemic-graph:${{ github.ref_name }}

  # ── STAGE 1c (non-gating, folded from former advisory.yml): build-only
  # feature-combination matrix, guarding feature-gate bitrot across combos
  # that are never published (the real shipped combo is `build` above).
  # wD9-CIGATE (2026-08-28): NOT measured this session -- 13 legs x a cargo
  # build each is expensive and the dev host was saturated (load 131/24
  # cores) during this pass. `continue-on-error: true` is therefore left IN
  # PLACE here, deliberately, as a disclosed gap rather than an unverified
  # blocking flip -- see this repo's wD9-CIGATE report for the exact combos
  # and the follow-up needed before removing it. Trigger scope IS tightened
  # here independent of that: this cost-heavy matrix no longer runs on every
  # push/PR, only on a real release tag or an explicit dispatch, per the
  # "gate by trigger, not by continue-on-error" rule -- once the continue-
  # on-error above is removed, this job will actually block those two
  # trigger paths, which is the whole point.
  feature-matrix:
    name: feature-build ${{ matrix.target.name }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: 'crate-eg-types',   flags: '-p eg-types --all-features' }
          - { name: 'crate-eg-core',    flags: '-p eg-core --all-features' }
          - { name: 'crate-eg-compute', flags: '-p eg-compute --all-features' }
          - { name: 'slim-lib',         flags: '--no-default-features --features graph,algorithms' }
          - { name: 'default',          flags: '' }
          - { name: 'minimal-server',   flags: '--features server' }
          - { name: 'compute',          flags: '--features compute' }
          - { name: 'full',             flags: '--no-default-features --features full' }
          - { name: 'cluster',          flags: '--no-default-features --features cluster' }
          - { name: 'full-extras',      flags: '--no-default-features --features full-extras' }
          # NE-216: a feature-unification gap between eg-types/geo (turned on
          # unconditionally by eg-capabilities, a leaf crate with no eg-plan dep, for its
          # own exhaustive Method-policy match) and eg-plan's OWN geo feature (which used
          # to gate the eg-types/geo request too) meant this exact combo compiled the
          # `Pred::Spatial*` wire variants into eg-plan without compiling the exhaustive
          # `where_clause` match arm that has to cover them -- E0004. These three combos
          # pin the profile that broke plus its immediate neighbors (no server/security,
          # and the same profile with `geo` explicitly on) so a future regression of that
          # class fails fast here instead of only surfacing when someone happens to build
          # this exact non-default combo.
          - { name: 'query-only',              flags: '--no-default-features --features query' }
          - { name: 'server-redb-query-security', flags: '--no-default-features --features "server,redb,query,security"' }
          - { name: 'server-redb-query-security-geo', flags: '--no-default-features --features "server,redb,query,security,geo"' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target.name }}
      - name: Build ${{ matrix.target.name }}
        run: cargo build ${{ matrix.target.flags }}

  # ── STAGE 1c (non-gating, folded from former advisory.yml): perf p50
  # ceilings / recall floor regression net. wD9-CIGATE (2026-08-28): NOT
  # measured this session (cargo bench is expensive and the dev host was
  # saturated) -- `continue-on-error: true` left in place as a disclosed
  # gap, same rationale as feature-matrix above. Trigger scope tightened the
  # same way: tag or dispatch only, not every push/PR.
  benchmarks:
    name: Perf/recall regression gate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: benchmarks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Run the benches (bounded iters — a short spot-check, not a wall-clock chase). The
      # bench writes the measured recall to $EG_BENCH_RECALL_OUT and ASSERTS the floor, so
      # a recall regression fails here directly.
      - name: Run hybrid-query benches (latency + recall@k)
        run: cargo bench -p eg-plan --features "query,owl,text,timeseries" --bench hybrid_queries
      # Gate on the committed thresholds (recall floor + generous per-bench p50 ceilings).
      - name: Perf/recall regression gate
        run: python3 scripts/bench_gate.py

  # ── Deploy concern, not a gate (folded from the former standalone
  # advisory.yml `pages` job, itself folded from pages.yml). No
  # `pip install -e .`, just `mkdocs build` from `docs/`. A job that calls a
  # reusable workflow (`uses:`) accepts only
  # name/uses/with/secrets/needs/if/permissions/strategy/concurrency — no
  # `runs-on`/`steps`/`continue-on-error` (agent-utilities' release.yml hit
  # this exact parser trap on its own `publish-docker` job; adding
  # `continue-on-error` here would invalidate the WHOLE workflow file the
  # same way). It carries no `needs:`, so it structurally cannot block
  # `build`/`publish-pypi`/`publish-image` regardless.
  pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@main
    permissions:
      contents: write
      pages: write
      id-token: write
