name: Release

# ─────────────────────────────────────────────────────────────────────────
# Product tests, runtime-contract checks, dependency/secret security, release
# wheel builds, wheel smoke checks, and publication are blocking. Documentation
# freshness, lint, scanner/census analysis, optional feature builds, and
# benchmarks remain visible but advisory; they do not delay publication.
#
# Blocking path: {gates, gates-plan-fuzz, gates-wheel, gates-facade, gates-whisper, gates-variants, gates-crates, gates-pyo3, python-suite,
# security, lint-and-architecture, tts-piper-inference, language-clients}
# -> {build, build-x86} -> publish-pypi. The engine container image is no longer
# built here: it ships from the epistemic-graph-server repository.
# Quality and documentation checks run independently. GitHub Pages deploys
# in pages.yml so the release concurrency queue cannot delay documentation.
#
# The wheel build/determinism logic remains unchanged: `build` produces the
# release artifacts, then `publish-pypi` repeats completeness checks on the
# downloaded wheels at the upload boundary.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Registry and git fetches retry dropped connections (curl [55] SSL_read
  # resets from crates.io failed a feature-build leg) instead of cargo's 3.
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: "1"
  # Hosted runners have 4 vCPU / 16 GB. About 80% of a cold facade build is
  # codegen and linking, which one job serialised (a 4.5 h single-job gate).
  # Four jobs with no debuginfo keeps memory bounded; the cross-built wheel
  # matrix (`build`) overrides this back down.
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The ONE main build (CONCEPT:EG-371): `full` = all MAIN features that build without an
  # external GPU/robotics toolchain, plus `ast-extended` for the complete code-parsing
  # grammar tier. `cluster` (raft HA) and `full-extras` (GPU/ROS2) are opt-in build layers,
  # NOT published wheels.
  MATURIN_FEATURES: "full,ast-extended"

jobs:
  # Documentation-only PRs avoid unrelated builds; main, tags and manual
  # runs retain exhaustive validation. Unknown files/history run everything.
  changes:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_change_scope.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  # ── Dependency and source-history security checks. ─────────────────────
  security:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: Security checks
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'

      - name: Secret-history scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              base="HEAD~1"
            else
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          echo "Scanning ${base}..HEAD for credential-shaped content"
          python3 scripts/security/check_secret_history.py --base "$base"

      - if: needs.changes.outputs.code != 'false'
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - name: Install pinned cargo-deny
        if: needs.changes.outputs.code != 'false'
        run: |
          set -euo pipefail
          version="$(PYTHONPATH=scripts python -c 'from scanner_contract import load_contract; print(load_contract().cargo_deny_version)')"
          root="$RUNNER_TEMP/epistemic-graph-cargo-deny"
          cargo install --locked --version "$version" --root "$root" cargo-deny
          echo "$root/bin" >> "$GITHUB_PATH"
          test "$("$root/bin/cargo-deny" --version)" = "cargo-deny $version"
      - name: Rust dependency advisory gate
        if: needs.changes.outputs.code != 'false'
        run: bash scripts/check_cargo_advisories.sh

      - name: Universal served-read RLS and carrier-ownership contract
        run: python3 scripts/check_universal_read_rls.py

  # ── STAGE 1: release-critical checks only. Nothing else may live here. ──
  gates:
    # Full engine compilation/test execution exceeds the short PR budget.
    # Run 38392685303 exhausted even 45m; retain this cap pending build profiling.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 60 }}
    name: gates
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: &eg-native-validation-runner ubuntu-latest
    # Build and cleanup must choose the same backend if the daemon restarts.
    # Backend settings alone do not wrap any other Cargo command.
    env: &eg-validation-compiler-cache-backend
      # Requests reset idle time; a long active compile does not. Keep this
      # finite, but above these jobs' maximum 60-minute execution window.
      SCCACHE_IDLE_TIMEOUT: '7200'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - &eg-gates-checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # actions/setup-python downloads a prebuilt CPython that requires AVX2;
      # on the homelab self-hosted runners (no AVX2) it fails fast with
      # "CPU ISA level is lower than required" (exit 127). uv manages its own
      # Python builds and has no such requirement, so self-hosted-capable jobs
      # install Python through it instead. `activate-environment` runs
      # `uv venv` and prepends it to GITHUB_PATH so `python`/`python3` still
      # resolve for every later step exactly as they did under setup-python.
      - &eg-gates-python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          python-version: '3.12'
          activate-environment: true

      # The checked generated capability client is imported by Rust-backed
      # capability tests. Keep this runtime closure aligned with uv.lock so the
      # generated Python surface is exercised in hosted CI as well. ruff is the
      # version .config/pre-commit.yaml pins: the strict-model generator test
      # runs `ruff check` + `ruff format --check` over the generated package.
      # Target the same interpreter with uv-managed and setup-python installs.
      - &eg-gates-pydeps
        name: Install locked capability-test Python dependencies
        run: uv pip install --python "$(command -v python)" msgpack==1.2.1 pydantic==2.13.5 pydantic-core==2.46.5 annotated-types==0.8.0 typing-extensions==4.16.0 typing-inspection==0.4.4 ruff==0.15.12

      # Product tests and protocol contracts run on every push and pull request.
      - &eg-gates-toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - &eg-gates-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target-isolated"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Save completed compiler outputs even if the later test link times out.
      # Install before enabling the wrapper; leave other Cargo steps unchanged.
      - &eg-validation-compiler-cache
        name: Install validation compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.16.0'
      - name: Test (lower crates, all features)
        env: &eg-validation-compiler-cache-env
          RUSTC_WRAPPER: sccache
        run: python3 scripts/cargo_test_rescue.py cargo test -p eg-types -p eg-core -p eg-compute --all-features --no-fail-fast
      # The checked ledger is the canonical all-Method projection. The ordinary
      # feature-selected registry is intentionally smaller, so this named profile
      # is the only meaningful exact generated-artifact comparison. This step is
      - name: Test (canonical capability policy and generated ledger)
        env: *eg-validation-compiler-cache-env
        run: python3 scripts/cargo_test_rescue.py cargo test --locked -p eg-capabilities --features contract --no-fail-fast
      # The facade's sqlite `.db` round-trip test diffs against a real sqlite3 CLI and
      # FAILS without one. Provision the pinned, sha256-verified CLI rather than
      # relying on whatever sqlite3 the runner image happens to ship.
      - &eg-gates-sqlite
        name: Provision pinned sqlite3 CLI (differential sqlite tests)
        run: |
          set -euo pipefail
          sqlite3_bin="$(scripts/fetch_sqlite3.sh "$RUNNER_TEMP/eg-sqlite3")"
          echo "EG_SQLITE3=$sqlite3_bin" >> "$GITHUB_ENV"
      - name: Test (SQLite format differential conformance)
        env: *eg-validation-compiler-cache-env
        run: python3 scripts/cargo_test_rescue.py cargo test --locked -p eg-sqlite-format --test differential --no-fail-fast
      # DE7 (durable-execution-native.md): replay-determinism crash-and-reopen
      # proofs for eg-jobs/eg-statechart.
      - name: Test (replay-determinism — eg-jobs/eg-statechart crash-replay proofs, DE7)
        env: *eg-validation-compiler-cache-env
        run: python3 scripts/cargo_test_rescue.py cargo test -p eg-jobs -p eg-statechart --test replay_determinism --no-fail-fast
      - &eg-locked-pytest
        name: Install locked pytest for generated-client checks
        run: uv pip install --python "$(command -v python3)" pytest==9.1.1 iniconfig==2.3.0 packaging==26.2 pluggy==1.6.0 pygments==2.20.0
      - name: Epistemic Operations manifest ⇄ Rust DTO parity
        run: python3 scripts/check_epistemic_operations_protocol.py
      - name: Engine contract parity (registry ⇄ Method enum ⇄ generated client)
        run: cargo run -q --locked -p eg-capabilities --features contract --bin gen_contract -- --check
      - name: Generated Python client contract
        run: python3 tests/test_generated_client_contract.py

      - name: Report lower-crate compiler cache reuse
        if: always()
        run: &eg-validation-compiler-cache-stats |
          echo 'Cache statistics cover the current daemon only; a restart resets its counters.'
          sccache --show-stats

  # Independent required fuzz acceptance avoids serial lower-crate compilation.
  gates-plan-fuzz:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 60 }}
    name: gates (plan fuzz and chaos)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: *eg-native-validation-runner
    env: *eg-validation-compiler-cache-backend
    steps:
      - *eg-gates-checkout
      - *eg-gates-python
      - *eg-gates-pydeps
      - *eg-gates-toolchain
      - *eg-gates-cache
      - *eg-gates-sqlite
      - *eg-validation-compiler-cache
      # Preserve the original correctness suite, features and assertions.
      - name: Query-pipeline fuzz + chaos (eg-plan)
        env: *eg-validation-compiler-cache-env
        run: python3 scripts/cargo_test_rescue.py cargo test -p eg-plan --features "query,owl,text,timeseries,federation" --test fuzz_pipelines --no-fail-fast

      - name: Report plan-fuzz compiler cache reuse
        if: always()
        run: *eg-validation-compiler-cache-stats

  # Independent required acceptance; retain the original native-job cap.
  gates-wheel:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 60 }}
    name: gates (installed wheel)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - *eg-gates-checkout
      - *eg-gates-python
      - *eg-gates-pydeps
      - *eg-gates-toolchain
      - *eg-gates-cache

      # Preserve the locked test environment inherited before the job split.
      - *eg-locked-pytest

      - name: Initialize external wheel virtualenv path
        run: echo "EG_GATES_WHEEL_VENV=${RUNNER_TEMP:?}/.gates-wheel-venv" >> "$GITHUB_ENV"

      # numeric-parity + NE-249: the developer-only reference gate proves EVERY
      # kernel op matches its NumPy reference, AND that the kernel still imports
      # and computes with NumPy import-blocked. NumPy is installed only in this
      # isolated gates job; it must never enter the published wheel metadata or
      # release smoke path.
      #
      # There is exactly ONE published package, `epistemic-graph` (CONCEPT:EG-346,
      # see the injector under scripts/) — the numeric kernel ships INSIDE its
      # wheel as a native `epistemic_graph.numeric` extension. There is NO
      # separately published/installed `eg-numeric` package. This job used to
      # `pip install --no-index --find-links target/wheels eg-numeric`, which
      # installed the intermediate build artifact as a standalone top-level
      # `numeric` package — even though the artifact is a `python -m build`-style
      # dev target, not a release shape. Because `crates/eg-numeric`'s version is
      # permanently `0.1.0`, that install could report success while changing
      # nothing: pip found a stale same-version copy "already satisfied" and
      # silently skipped a fresh build. That is exactly what happened on
      # 2026-08-21: the
      # NE-249 boundary contract ran 16 of 17 cases against a six-week-old
      # `numeric.abi3.so`, reporting failures against operations that exist.
      #
      # So this gate now builds BOTH the numeric kernel wheel and a real
      # `epistemic-graph` server wheel, folds the former into the latter (the
      # exact same fold the real release path performs per-platform below —
      # see "Fold primary/reproduction numeric kernel into the epistemic-graph
      # wheel") — and installs THAT into a clean throwaway venv. The parity and
      # boundary-contract tests then exercise `epistemic_graph.numeric` from the
      # natively-injected wheel, never a standalone `eg-numeric` install.
      - name: Install maturin + parity deps
        run: pip install 'maturin>=1,<2' numpy pytest
      - name: Configure identity-neutral Rust source paths
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV"
      - name: Build gates numeric kernel wheel (feature python)
        run: maturin build --release -m crates/eg-numeric/Cargo.toml --features python --out numdist-gates
      - name: Normalize build-local SBOM references (numeric kernel wheel)
        run: python scripts/normalize_wheel_sbom.py numdist-gates/*.whl
      - name: Normalize retained native build paths (numeric kernel wheel)
        run: python scripts/normalize_wheel_build_paths.py numdist-gates/*.whl
      - name: Audit numeric kernel wheel for retained build identity
        run: python scripts/check_wheel_privacy.py numdist-gates/*.whl
      # ── Fold the eg-pyengine in-process engine binding INTO this same gates wheel,
      #    the identical pattern as the numeric kernel just above (CONCEPT:BUG-PE-002).
      #    A separate maturin target (`crates/eg-pyengine --features python,security`), a
      #    separate pyo3 cdylib, folded in by `scripts/inject_pyengine.py`.
      - name: Build gates pyengine kernel wheel (features python,security)
        run: maturin build --release -m crates/eg-pyengine/Cargo.toml --features python,security --out enginedist-gates
      - name: Normalize build-local SBOM references (pyengine kernel wheel)
        run: python scripts/normalize_wheel_sbom.py enginedist-gates/*.whl
      - name: Normalize retained native build paths (pyengine kernel wheel)
        run: python scripts/normalize_wheel_build_paths.py enginedist-gates/*.whl
      - name: Audit pyengine kernel wheel for retained build identity
        run: python scripts/check_wheel_privacy.py enginedist-gates/*.whl
      # Deliberately NOT `--release --features "$MATURIN_FEATURES"`. This wheel is a
      # FOLD TARGET: everything asserted about it downstream — that the numeric
      # kernel injects, that RECORD stays valid, that the console script keeps its
      # 0755 bit, that no build identity is retained, that
      # `epistemic_graph.numeric` imports and computes from the INSTALLED wheel —
      # is a property of wheel PACKAGING, not of which engine features were
      # compiled in or at what optimisation level. The `build` job below still
      # produces the real `full,ast-extended` release artifacts for every target.
      #
      # Measured 2026-08-21: `--release --features full,ast-extended` takes ~40
      # minutes (DataFusion, Polars, Wasmtime, 15 tree-sitter grammars, LTO), and
      # under a 3600s per-step ceiling it TIMED OUT, cascading into five dependent steps that then reported their own
      # failures. A slim server build produces a byte-identically-shaped wheel for
      # these purposes in ~2.5 minutes, and was verified end to end: all four wheel
      # audits pass and the NE-249 boundary contract is 17/17 against it.
      - name: Build gates epistemic-graph server wheel (fold target)
        run: maturin build --no-default-features --features server --out dist-gates
      - name: Fold the numeric kernel into the gates epistemic-graph wheel (EG-346)
        run: |
          python scripts/inject_numeric_kernel.py "$(ls dist-gates/epistemic_graph-*.whl)" "$(ls numdist-gates/*.whl)"
      - name: Fold the pyengine kernel into the gates epistemic-graph wheel (BUG-PE-002)
        run: |
          python scripts/inject_pyengine.py "$(ls dist-gates/epistemic_graph-*.whl)" "$(ls enginedist-gates/*.whl)"
      - name: Strip console executables from the gates wheel (executable-free wheel)
        run: python scripts/strip_wheel_executables.py dist-gates/*.whl
      - name: Normalize and audit the folded gates wheel
        run: |
          python scripts/normalize_wheel_sbom.py dist-gates/*.whl
          python scripts/normalize_wheel_build_paths.py dist-gates/*.whl
          python scripts/check_wheel_privacy.py dist-gates/*.whl
      - name: Require a complete gates wheel (numeric + engine kernels + no executables + RECORD)
        run: python scripts/check_wheel_completeness.py --require-engine-kernel dist-gates/*.whl
      - name: Install the folded epistemic-graph wheel into a clean throwaway venv
        run: |
          python -m venv "$EG_GATES_WHEEL_VENV"
          "$EG_GATES_WHEEL_VENV/bin/pip" install --upgrade pip
          "$EG_GATES_WHEEL_VENV/bin/pip" install numpy pytest "$(ls dist-gates/epistemic_graph-*.whl)"
      # Run from a scratch directory, NOT the repo root. `python -m pytest` puts
      # CWD first on sys.path, so from the root `import epistemic_graph.numeric`
      # resolves the SOURCE TREE's `epistemic_graph/numeric.abi3.so` — a
      # gitignored build artifact — instead of the wheel just installed into the
      # venv. That silently inverts the entire point of these two steps, which
      # exist to test the INSTALLED artifact.
      #
      # CI passes today only because a fresh checkout has no such artifact. That
      # is luck, not isolation: measured 2026-08-22, a local run resolved an
      # August 18 kernel missing `linspace`/`fill_diagonal` and reported 12 of 17
      # NE-249 cases failing against operations that are present in the wheel
      # under test. Anchoring to $REPO and running from elsewhere makes the
      # shadowing impossible rather than improbable.
      - name: numpy-parity gate (compiled kernel vs numpy)
        run: |
          REPO="$PWD"
          cd "$(mktemp -d)"
          PYTHONNOUSERSITE=1 "$EG_GATES_WHEEL_VENV/bin/python" -m pytest \
            "$REPO/crates/eg-numeric/tests/test_kernel_parity.py" --noconftest -q
      # NE-249: the boundary contract, which nothing ran until now. This file
      # holds the single most load-bearing property of the NumPy retirement --
      # `test_import_and_native_calls_succeed_with_numpy_import_blocked` spawns
      # a fresh interpreter with `import numpy` denied and proves the kernel
      # still imports and computes -- plus the bounds checks and the restored
      # construction surface. Running only `test_kernel_parity.py` from this
      # directory meant the retirement was verified by a test that never
      # executed, while `numpy` stayed installed in this job for the parity
      # gate above and would have masked a regression completely.
      - name: numpy-free boundary contract (NE-249)
        run: |
          REPO="$PWD"
          cd "$(mktemp -d)"
          PYTHONNOUSERSITE=1 "$EG_GATES_WHEEL_VENV/bin/python" -m pytest \
            "$REPO/crates/eg-numeric/tests/test_builtin_boundary.py" --noconftest -q
      # BUG-PE-002: `import epistemic_graph.engine` must succeed from the INSTALLED
      # wheel, exactly the same shadowing-avoidance discipline as the numeric smoke
      # check above (a bare `python -c` at the repo root would resolve the SOURCE
      # tree instead of the venv's installed wheel).
      - name: engine kernel smoke test (import epistemic_graph.engine)
        run: |
          REPO="$PWD"
          cd "$(mktemp -d)"
          PYTHONNOUSERSITE=1 "$EG_GATES_WHEEL_VENV/bin/python" -c \
            "import epistemic_graph.engine as e; print('engine kernel OK:', e.__file__, '| __engine__=', getattr(e, '__engine__', None))"
      # EG-CONTRACT-R002.3: the Decide/pack-import client surface that the
      # EG-CONTRACT-R002.1/.2 served tests exercise must itself resolve from this
      # installed wheel, not the source tree -- same shadowing-avoidance
      # discipline as the numeric/engine smoke steps above (mktemp cwd, the
      # gates venv's interpreter).
      - name: installed-wheel no-source-tree-import check (EG-CONTRACT-R002.3)
        run: |
          REPO="$PWD"
          cd "$(mktemp -d)"
          EG_INSTALLED_WHEEL_GATE=1 PYTHONNOUSERSITE=1 "$EG_GATES_WHEEL_VENV/bin/python" -m pytest \
            "$REPO/tests/test_installed_wheel_decision_client_boundary.py" --noconftest -q


  # ── STAGE 1 (continued): the release-critical cargo selections are split
  # across three parallel jobs (gates, gates-facade, gates-variants) instead of
  # running back to back in one. Each selection compiles its own feature set, so
  # serial execution shared no build work; it only summed the wall time (run
  # 35740545815: lower crates 32.9 min + facade full 84.5 min before the first
  # failure, with nine selections still to go). Every step is carried over
  # verbatim; `build` needs all three.
  gates-facade:
    # Full engine compilation/test execution exceeds the short PR budget.
    # Run 38392685303 exhausted even 45m; retain this cap pending build profiling.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 60 }}
    name: gates (facade full)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env: *eg-validation-compiler-cache-backend
    steps:
      - *eg-gates-checkout

      - *eg-gates-python

      - *eg-gates-pydeps

      - *eg-gates-toolchain
      # A cold target took 41m13s before tests in run 38486393509.
      # Preserve trusted-main workspace outputs; Cargo still checks current inputs.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target-isolated"
          key: facade-workspace-v1
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # sqlite3 CLI for the facade `.db` round-trip test (see `gates`).
      - *eg-gates-sqlite
      - *eg-validation-compiler-cache
      # A restored target cache must not supply a prior run's timing evidence.
      - name: Clear previous facade build timings
        run: rm -rf target-isolated/cargo-timings
      - name: Test (facade full)
        env: *eg-validation-compiler-cache-env
        run: python3 scripts/cargo_test_rescue.py cargo test -p epistemic-graph --features full --no-fail-fast --timings
      - name: Upload facade build timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: facade-build-timings-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target-isolated/cargo-timings/
          if-no-files-found: warn
          retention-days: 1
      - name: Report facade compiler cache reuse
        if: always()
        run: *eg-validation-compiler-cache-stats
      # The blob RSS-bound tests read WHOLE-PROCESS RSS, so they are #[ignore]d out
      # of the parallel run above (a concurrent sibling's 256MB blob inflates the
      # shared RSS past the cap). Run them here in isolation — serial + ignored — so
      # the memory-regression coverage stays in CI without the parallel pollution.
      - name: Test (memory-regression — RSS bounds, isolated)
        run: python3 scripts/cargo_test_rescue.py cargo test -p epistemic-graph --features full --no-fail-fast bounded_memory -- --ignored --test-threads=1

  # Independent required acceptance; retain the original native-job cap.
  gates-whisper:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 60 }}
    name: gates (Whisper real model)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - *eg-gates-checkout
      - *eg-gates-python
      - *eg-gates-pydeps
      - *eg-gates-toolchain
      - *eg-gates-cache

      # These real-model tests fail loudly when their fixture is absent. Fetch the
      # pinned, sha256-verified model and WAV, export both paths, then exercise the
      # provider rather than counting an unconfigured test as a pass.
      - &eg-gates-whisper
        name: Provision pinned Whisper real-model fixture
        run: scripts/fetch_whisper_test_fixture.sh "$RUNNER_TEMP/eg-whisper-test" >> "$GITHUB_ENV"
      - name: Test (Whisper real-model transcription and cancellation)
        run: python3 scripts/cargo_test_rescue.py cargo test --locked -p eg-asr-whisper --test real_transcription --no-fail-fast

  # Slim-server and raft-cluster variants run after merge (main, tags), not on
  # pull requests: each is a separate cold compile of the whole engine, slim's
  # code paths are already compiled and linted per PR by `Clippy slim-server`,
  # and `cluster` is not part of the published wheel (MATURIN_FEATURES). Both
  # variants must succeed before either release wheel build can start.
  gates-variants:
    timeout-minutes: 360
    name: gates (slim server + raft cluster)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    steps:
      - *eg-gates-checkout

      # Unconditionally ubuntu-latest (never self-hosted), so this keeps
      # actions/setup-python rather than the *eg-gates-python uv alias.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'

      - &eg-gates-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'

      - *eg-gates-pydeps

      - *eg-gates-toolchain
      - *eg-gates-cache

      - name: Test (slim server — gated-out methods return the not-built error)
        run: python3 scripts/cargo_test_rescue.py cargo test -p epistemic-graph --no-default-features --features server --no-fail-fast
      # The Raft cluster layer is an opt-in build layer outside `full` (see
      # MATURIN_FEATURES above), so no step above compiles its code or runs its
      # tests: `cluster` (raft HA), `harness` (the in-process multi-node cluster
      # fixtures), and `calvin` (deterministic cross-shard ordering). Without
      # these steps a red raft suite, or an integration test that only fails to
      # compile under this feature set, reaches a release unnoticed.
      - name: Test (raft cluster — consensus, placement, and multi-group unit tests)
        run: "python3 scripts/cargo_test_rescue.py cargo test --locked -p epistemic-graph --features cluster,harness,calvin --lib --no-fail-fast -- raft::"
      - name: Test (raft cluster — ack-lost commit retry reconciliation)
        run: python3 scripts/cargo_test_rescue.py cargo test --locked -p epistemic-graph --features cluster,harness,calvin --test txn_reconcile_ack_lost_retry --no-fail-fast

  # ── EH-311: every workspace crate's own tests. `cargo test -p epistemic-graph`
  # runs only the facade's targets, so before this job 109 of the workspace's 178
  # test targets (all of eg-query, eg-rdf, eg-shacl, eg-storage, eg-transaction,
  # eg-plan's oracles, the quantum crates, ...) were run by no release step.
  # Excluded here only where another step runs
  # the same package with the same features: the facade, eg-types/eg-core/
  # eg-compute (gates), eg-tts-piper (needs onnxruntime, its own job). The two
  # pyo3 crates get every feature except `python` (pyo3 extension-module cannot
  # link a test binary).
  gates-crates:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: gates (workspace crates)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env: *eg-validation-compiler-cache-backend
    steps:
      - *eg-gates-checkout

      - *eg-gates-python

      - *eg-gates-pydeps

      # `--all-features` enables eg-stream/cdc-kafka, which links system
      # Cyrus-SASL and librdkafka headers on Ubuntu runners.
      - &eg-gates-sasl
        name: Install librdkafka/Cyrus-SASL build headers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsasl2-dev libcurl4-openssl-dev
      - *eg-gates-toolchain
      - *eg-gates-cache
      - *eg-validation-compiler-cache

      - *eg-gates-sqlite
      - *eg-gates-whisper
      # Crash-stage tests spawn children that briefly inherit sibling tests'
      # read-only redb locks. Isolate this crate's full suite, not just the
      # crash-test module: no sleeps, lock-error retries, or skipped assertions.
      - name: Test (storage crate, isolated crash-process lifecycle)
        env: *eg-validation-compiler-cache-env
        run: python3 scripts/cargo_test_rescue.py cargo test --locked -p eg-storage --all-features --no-fail-fast -- --test-threads=1

      # Operator decision (2026-10-09): on a pull request this broad
      # workspace sweep narrows to only the crates the diff could plausibly
      # break, so a PR gate turns around in minutes; `push` to main and a
      # release tag keep running the unchanged full command below.
      - name: Resolve the published base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "PRE_COMMIT_FROM_REF=$BASE" >> "$GITHUB_ENV"
      - name: Resolve pull-request test scope (workspace crates)
        if: github.event_name == 'pull_request'
        id: pr-test-scope
        run: |
          set -euo pipefail
          uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' \
            pipelines-hook pr-test-scope --lang rust --base-ref "$PRE_COMMIT_FROM_REF" \
            --workspace-root . > "$RUNNER_TEMP/pr-test-scope.txt"
          cat "$RUNNER_TEMP/pr-test-scope.txt"
          {
            echo "scope<<PR_TEST_SCOPE_EOF"
            cat "$RUNNER_TEMP/pr-test-scope.txt"
            echo "PR_TEST_SCOPE_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Test (every other workspace crate, all features; push to main / release tag)
        env: *eg-validation-compiler-cache-env
        if: github.event_name != 'pull_request'
        run: python3 scripts/cargo_test_rescue.py cargo test --locked --workspace --exclude epistemic-graph --exclude eg-types --exclude eg-core --exclude eg-compute --exclude eg-storage --exclude eg-tts-piper --exclude eg-numeric --exclude eg-pyengine --all-features --no-fail-fast
      - name: Test (every other workspace crate -- pull request fast subset)
        if: github.event_name == 'pull_request'
        env:
          RUSTC_WRAPPER: sccache
          SCOPE: ${{ steps.pr-test-scope.outputs.scope }}
        run: |
          set -euo pipefail
          # These crates have their own dedicated steps/jobs with different
          # feature flags; a changed-crate hit on one of them is already
          # covered there, so it is dropped from this generic --all-features
          # sweep rather than double-run (or, for eg-numeric/eg-pyengine,
          # run with an incompatible feature set).
          excluded="epistemic-graph eg-types eg-core eg-compute eg-storage eg-tts-piper eg-numeric eg-pyengine"
          if [ "$SCOPE" = "NONE" ]; then
            echo "pr-test-scope: no changed Rust file outside the specially-tested crates; skipping"
            exit 0
          fi
          if [ "$SCOPE" = "FULL" ]; then
            echo "pr-test-scope: unmapped Rust change (or an unreadable diff); running the full crate set"
            python3 scripts/cargo_test_rescue.py cargo test --locked --workspace --exclude epistemic-graph --exclude eg-types --exclude eg-core --exclude eg-compute --exclude eg-storage --exclude eg-tts-piper --exclude eg-numeric --exclude eg-pyengine --all-features --no-fail-fast
            exit 0
          fi
          args=()
          while IFS= read -r crate; do
            [ -z "$crate" ] && continue
            skip=false
            for ex in $excluded; do
              [ "$crate" = "$ex" ] && skip=true && break
            done
            [ "$skip" = true ] && continue
            args+=(-p "$crate")
          done <<< "$SCOPE"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "pr-test-scope: changed crates are all covered by other steps/jobs; skipping"
            exit 0
          fi
          echo "pr-test-scope: running only the changed crates this diff affects:"
          printf '%s\n' "${args[@]}"
          python3 scripts/cargo_test_rescue.py cargo test --locked "${args[@]}" --all-features --no-fail-fast

      - name: Report workspace-crate compiler cache reuse
        if: always()
        run: *eg-validation-compiler-cache-stats

  # Keep pyo3 validation independent of storage and the workspace sweep.
  # Main warms the same profile; pull requests retain read-only caches.
  gates-pyo3:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 60 }}
    name: gates (pyo3 crates)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env: *eg-validation-compiler-cache-backend
    steps:
      - *eg-gates-checkout
      - *eg-gates-python
      - *eg-gates-pydeps
      - *eg-gates-sasl
      - *eg-gates-toolchain
      - *eg-gates-cache
      - *eg-validation-compiler-cache
      - *eg-gates-sqlite
      - *eg-gates-whisper
      - name: Test (pyo3 crates, every feature except python)
        env: *eg-validation-compiler-cache-env
        run: python3 scripts/cargo_test_rescue.py cargo test --locked -p eg-numeric -p eg-pyengine --features eg-numeric/analytics,eg-numeric/contract,eg-numeric/complex,eg-numeric/decision,eg-numeric/motif,eg-pyengine/security,eg-pyengine/ml-pipeline,eg-pyengine/reasoning,eg-pyengine/query,eg-pyengine/cypher,eg-pyengine/tsdb,eg-pyengine/streaming,eg-pyengine/wasm-udf,eg-pyengine/rdf,eg-pyengine/blob,eg-pyengine/jobs,eg-pyengine/statechart,eg-pyengine/finance --no-fail-fast

      - name: Report pyo3 compiler cache reuse
        if: always()
        run: *eg-validation-compiler-cache-stats

  # ── EH-468: the root Python suite (`tests/*.py`, 2,800+ cases) previously had
  # NO release step at all. `gates` above only runs `crates/eg-numeric/tests/*`
  # (a developer-only NumPy-parity/boundary gate) and `scanner-quality` only runs
  # `tests/test_dupehound_census.py` (a scanner-adapter unit test run with
  # `--noconftest`, deliberately bypassing this suite's real fixtures) — so every
  # client/contract/connector-pack regression in the rest of `tests/` reached
  # `main` unexecuted (found at train-3 landing). This job builds the numeric
  # kernel, the pyengine extension, and the `full`-featured engine binary
  # ONCE, then runs the whole `tests/` suite under pytest-xdist with a
  # bounded worker count and a
  # per-test timeout, exactly the shape validated end to end by the train-3
  # integrator's manual full-suite run (2,792 passed / 52 failed / 22 skipped
  # in ~98 minutes on a 4-core host) before this job existed.
  #
  # Environment prerequisites that manual run needed and a bare checkout does
  # not otherwise provide — each satisfied HERE, not by skipping the tests that
  # need them:
  #   * distribution metadata — `epistemic_graph/client_capabilities.py` calls
  #     `importlib.metadata.version("epistemic-graph")`, which
  #     `PackageNotFoundError`s against an uninstalled source checkout. Rather
  #     than a real (and, for this `bindings = "bin"` project, ~minutes-long)
  #     wheel/editable build, `maturin pep517 write-dist-info` alone produces
  #     the real dist-info from `pyproject.toml`/`Cargo.toml` with NO cargo
  #     invocation and no compile — verified empirically (`maturin --version`
  #     1.13.3): it shells out to `cargo --version` only to confirm a Rust
  #     toolchain exists, then writes `METADATA`/`WHEEL`/`entry_points.txt`
  #     straight from project metadata.
  #   * a real `.git` — `tests/test_kiss_hook_context.py` and
  #     `tests/test_push_gate_evidence*.py` read this checkout's own
  #     `GIT_DIR`/`GIT_COMMON_DIR`. `actions/checkout` already gives every job
  #     a real one, so this needs no extra step here — it only bit the
  #     integrator's OWN ad hoc rsync'd (`.git`-less) copy of the tree, a tool
  #     outside this repository, not a gap in the workflow itself.
  #   * `.security/` tracked at the path the suite expects —
  #     `tests/test_repository_fuzz.py` pointed at a stale pre-root-hygiene
  #     path (`.security/repository_fuzz.py`); the fixture actually lives at
  #     `.config/security/repository_fuzz.py` since root-hygiene's `c65a2566a`.
  #     Fixed in the test itself (not skipped) in the same change that adds
  #     this job.
  #
  # `tests/parity/` additionally needs the in-process `epistemic_graph.engine`
  # pyo3 extension (`crates/eg-pyengine --features python,security`) built into the
  # tree — see that test module's own docstring ("NOT expected to pass in this
  # session"). `scripts/build_pyengine_kernel.py` is the mounted/editable-path
  # build step for it (the exact companion `build_numeric_kernel.py` already
  # is for the numeric kernel), reusing the identical `maturin build --release
  # -m crates/eg-pyengine/Cargo.toml --features python,security` invocation the `gates`
  # job's "Build gates pyengine kernel wheel" step runs for the WHEEL path.
  # Prepare native inputs independently; the required python-suite job joins both.
  python-kernels:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: Python native kernels
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Validation-only profile, also warmed on main. Published wheels use defaults.
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
    steps:
      - &eg-python-checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - *eg-gates-toolchain
      - *eg-gates-cache
      - name: Install maturin
        run: python -m pip install --disable-pip-version-check 'maturin>=1,<2'
      - name: Build the numeric kernel into the working tree (mounted/editable path)
        run: python3 scripts/build_numeric_kernel.py
      - name: Build the pyengine extension into the working tree (mounted/editable path)
        run: python3 scripts/build_pyengine_kernel.py
      - name: Package exact-revision native kernels
        run: bash scripts/python_suite_artifact.sh pack kernels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-kernels-${{ github.sha }}
          path: ${{ runner.temp }}/python-kernels/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  python-server:
    # The full-featured server build alone exceeds the short PR budget:
    # run 38519919307 compiled it in 9m34s, then the 10m cap killed the job
    # and cancelled the whole Python suite leg. Align with the full engine jobs.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 60 }}
    name: Python full server preparation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env: *eg-validation-compiler-cache-backend
    steps:
      - *eg-python-checkout
      - *eg-gates-toolchain
      # A seeded main cache still missed 16 workspace compilations and exceeded
      # ten minutes in PR555 attempt 2. Retain workspace outputs on trusted main;
      # Cargo validates restored inputs, and the full-engine budget covers misses.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target-isolated"
          key: python-server-workspace-v1
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Also cache individual compiler outputs without bypassing Cargo. Install
      # before setting the wrapper: a missing global wrapper broke CI previously.
      - *eg-validation-compiler-cache
      - name: Build the full-featured engine binary once
        env: *eg-validation-compiler-cache-env
        run: cargo build --locked --features full --bin epistemic-graph-server
      - name: Report server compiler cache reuse
        if: always()
        run: *eg-validation-compiler-cache-stats
      - name: Package exact-revision server binary
        run: bash scripts/python_suite_artifact.sh pack server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-server-${{ github.sha }}
          path: ${{ runner.temp }}/python-server/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  python-suite:
    # The full root pytest suite leaves no headroom under the short PR budget
    # (9m29s suite leg on run 38500023697); align with the full engine jobs.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 60 }}
    name: Python suite (tests/)
    needs: [changes, python-kernels, python-server]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require successful native preparation
        env:
          KERNELS_RESULT: ${{ needs.python-kernels.result }}
          SERVER_RESULT: ${{ needs.python-server.result }}
        run: test "$KERNELS_RESULT" = success && test "$SERVER_RESULT" = success
      - *eg-python-checkout

      # Unconditionally ubuntu-latest (never self-hosted), so this keeps
      # actions/setup-python rather than the *eg-gates-python uv alias.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'

      - *eg-gates-uv

      - *eg-gates-pydeps

      - name: Install native scorer tracing prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          strace --help | grep -F -- '--kill-on-exit'

      - name: Install pytest, its plugins, PyYAML, and maturin (metadata only — see below)
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist pytest-timeout pytest-asyncio pyyaml 'maturin>=1,<2'

      - *eg-gates-toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-kernels-${{ github.sha }}
          path: ${{ runner.temp }}/python-kernels/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-server-${{ github.sha }}
          path: ${{ runner.temp }}/python-server/
      - name: Verify and restore exact-revision native inputs
        run: |
          bash scripts/python_suite_artifact.sh unpack kernels
          bash scripts/python_suite_artifact.sh unpack server

      # The build script only WARNS when it cannot load what it built (it also
      # serves cross-builds). Here the interpreter that runs pytest must load it.
      - name: Prove the pytest interpreter imports the pyengine extension
        run: python3 -c "import epistemic_graph.engine as e; assert e.__engine__ == 'eg-pyengine', e.__engine__; print(e.__file__)"

      - name: Generate installed-distribution metadata (maturin write-dist-info — no compile)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eg-dist-info"
          maturin pep517 write-dist-info --metadata-directory "$RUNNER_TEMP/eg-dist-info" --interpreter "$(command -v python3)"
          echo "EG_DIST_INFO_DIR=$RUNNER_TEMP/eg-dist-info" >> "$GITHUB_ENV"

      - name: Test (root Python suite — pytest-xdist, per-test timeout, the pre-built engine binary)
        run: |
          W=$(( $(nproc) - 2 )); [ "$W" -gt 6 ] && W=6; [ "$W" -lt 1 ] && W=1
          BT="/tmp/eg-pytest-$$"
          rm -rf "$BT"
          echo "pytest-xdist workers: $W (nproc $(nproc)); basetemp $BT"
          EPISTEMIC_GRAPH_TEST_BINARY="$PWD/target-isolated/debug/epistemic-graph-server" \
            PYTHONPATH="$EG_DIST_INFO_DIR${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -m pytest tests/ -p no:cacheprovider -n "$W" --timeout=900 --basetemp="$BT" -q -rfEs
          rc=$?
          chmod -R u+w "$BT" 2>/dev/null
          rm -rf "$BT"
          exit $rc

  # ── eg-tts-piper synthesis against a REAL onnxruntime.
  #
  # `--all-features` builds eg-tts-piper with `ort-load-dynamic`, so `ort` dlopens
  # onnxruntime from ORT_DYLIB_PATH. These tests used to print SKIP and return when
  # it was unset; libtest hides stderr for passing tests, so 10 of 13 "passed" in
  # 0.00s without loading a model. They now FAIL without a runtime, so this job must
  # provide one: scripts/fetch_onnxruntime.sh downloads the pinned official release
  # (sha256-checked) and exits non-zero on any fetch or checksum failure. There is
  # deliberately no fallback. A missing runtime fails this job.
  #
  # Native build dependencies, by exact apt package name. espeak-rs-sys builds
  # espeak-ng with CMake and generates its bindings with bindgen, which loads
  # libclang. Measured on an Ubuntu 26.04 build host, where this job's steps were run
  # verbatim in a clean tree with a fresh target dir:
  #   * build-essential, cmake, clang, pkg-config, curl, ca-certificates: already
  #     on that host, and on the ubuntu-24.04 image (CMake 3.31, clang 16/17/18,
  #     g++ 13, pkg-config 1.8, curl 8.5). Installed explicitly anyway so the job does
  #     not depend on the image's tool list.
  #   * libclang-dev: NOT on that host (bindgen found libclang-21.so.1 from
  #     libclang1-21, which `clang` pulls in), and libclang is not listed on the
  #     runner image. Installed so bindgen's libclang lookup does not depend on
  #     which clang packages the image happens to ship.
  tts-piper-inference:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: eg-tts-piper real-inference tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install espeak-ng / bindgen native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev pkg-config curl ca-certificates
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target-isolated"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test eg-tts-piper against the pinned onnxruntime (fails, never skips, without it)
        run: |
          set -euo pipefail
          # A failed fetch or checksum fails this assignment, and `set -e` stops here.
          ORT_DYLIB_PATH="$(scripts/fetch_onnxruntime.sh "$RUNNER_TEMP/eg-onnxruntime")"
          export ORT_DYLIB_PATH
          test -f "$ORT_DYLIB_PATH"
          echo "ORT_DYLIB_PATH=$ORT_DYLIB_PATH"
          python3 scripts/cargo_test_rescue.py cargo test --locked -p eg-tts-piper --all-features --no-fail-fast

  # ── Go and JavaScript clients (EH-372). Both sign the engine's own canonical
  # method body through the embedded WebAssembly build of crates/eg-method-codec.
  # The job rebuilds that module and requires both committed copies to match it
  # byte-for-byte, then replays every contract method-body vector (body digest and
  # envelope MAC) through each client's signer, plus the clients' own unit tests.
  language-clients:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: Go and JavaScript clients
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # `shell: bash` runs every step as `bash -eo pipefail`, so no step can hide a
    # failing command behind a later one in a pipe.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - name: Install the pinned toolchain's wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Rebuild the embedded method-body codec and require the committed copies
        run: python3 scripts/build_method_codec_wasm.py --check
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum
      - name: Go client tests (method-body vectors + unit tests)
        working-directory: clients/go
        run: go test -count=1 ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked JavaScript client dependencies
        working-directory: clients/js
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript client tests (method-body vectors + unit tests)
        working-directory: clients/js
        run: npm test

  # ── Runtime contracts. These checks guard authorization, lifecycle,
  # modality, reasoning, release-campaign, and persisted-schema behavior.
  # They remain blocking alongside the executable test suites.
  lint-and-architecture:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: Lint, format and architecture (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # spec-status reconstructs generated status from commit trailers.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Install manifest Rust toolchain and rustfmt
        run: rustup toolchain install --profile minimal --component rustfmt && rustup show active-toolchain
      - name: Install uv, pre-commit and the hooks' one third-party import
        run: python -m pip install --disable-pip-version-check uv==0.8.17 pre-commit==4.6.2 pyyaml==6.0.3
      # lane-guard, check-stubs and the check-sprawl fleet scan are owned by
      # agent-utilities and read it from a sibling checkout
      # (scripts/sibling_gate.py). They are lint policy, so they track its main.
      - name: Check out agent-utilities gate scripts
        run: |
          git clone --depth 1 https://github.com/Knuckles-Team/agent-utilities "$RUNNER_TEMP/agent-utilities"
          echo "AGENT_UTILITIES_ROOT=$RUNNER_TEMP/agent-utilities" >> "$GITHUB_ENV"
      # The same hooks a contributor runs locally (`scripts/bootstrap.sh` installs
      # them), so local and CI share one definition. lane-guard governs local
      # worktree lanes and has nothing to check on a runner; cargo-deny runs in
      # the `security` job with its pinned install.
      - name: pre-commit (commit stage, PR diff or full publication)
        env:
          SKIP: lane-guard,cargo-deny-advisories
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            pre-commit run --config .config/pre-commit.yaml --from-ref "$BASE" --to-ref "$HEAD" --show-diff-on-failure
          else
            pre-commit run --config .config/pre-commit.yaml --all-files --show-diff-on-failure
          fi
      - name: rustfmt
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/check_rustfmt_scope.py --base "$BASE"
          else
            cargo fmt --all --check
          fi
      - name: CI change-scope regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest --noconftest -o addopts='' tests/test_ci_change_scope.py

  # ── Spec-status lifecycle gates (SPEC-STATUS-LIFECYCLE.md): the generated
  # specs/*/status.json schema, requirement decomposition, and (PRs only) the
  # Spec: trailer on the incoming commit range. Deliberately independent of
  # the release path: no other job's needs: names it, and it is not a
  # required check.
  spec-gates:
    timeout-minutes: 5
    name: Spec status lifecycle gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: spec-status
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-status
      - name: spec-decomposition
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-decomposition
      - name: spec-trailers
        if: github.event_name == 'pull_request'
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-trailers --base-ref "origin/${{ github.base_ref }}"

  # ── Clippy is blocking on every profile: the toolchain is pinned, so a new
  # finding comes from the change under review, not from an upgrade.
  # EH-191/EH-225: `-D warnings` across every release profile. `--all-features`
  # compiles away every `cfg(not(feature = ...))` branch, so it cannot lint the
  # published build (`full,ast-extended` = MATURIN_FEATURES, which has no raft) or
  # the slim `server` build; each profile is its own leg.
  quality-advisory:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: Clippy ${{ matrix.profile.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - { name: 'workspace-all-features', flags: '--workspace --all-features' }
          - { name: 'published-full', flags: '--no-default-features --features full,ast-extended' }
          - { name: 'slim-server', flags: '--no-default-features --features server' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # The `--all-features` profile enables eg-stream/cdc-kafka, which links
      # system Cyrus-SASL and librdkafka headers on Ubuntu runners.
      - *eg-gates-sasl
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target-isolated"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: clippy-${{ matrix.profile.name }}

      - name: Clippy (${{ matrix.profile.name }})
        # --keep-going: one crate's lint errors must not stop the others being linted.
        run: cargo clippy --locked --keep-going ${{ matrix.profile.flags }} --all-targets -- -D warnings

  # ── Repository-wide scanner and complexity analysis is advisory. Keep its
  # reports visible, while product tests and cargo-deny remain release gates.
  # Provisioning stays isolated from the local manual mirror.
  # Every scanner step runs even when an earlier one failed (`!cancelled()`), so
  # one red scanner never hides the verdicts of the rest -- on 57a12eb06 a red
  # jscpd step left CCCC, KISS, import-linter, depcruise and arch-lint unrun.
  # The job still fails at the end if any step failed.
  scanner-quality:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: Scanner + architecture quality (advisory)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Install scanner adapter test dependency
        if: ${{ !cancelled() }}
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Dupehound adapter contract tests
        if: ${{ !cancelled() }}
        # --noconftest: the adapter tests own their fixtures; the suite conftest
        # imports the full client (msgpack), which this job does not install.
        run: python -m pytest -q --noconftest tests/test_dupehound_census.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked thin-client dependencies
        if: ${{ !cancelled() }}
        working-directory: clients/js
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          # KISS runs cargo metadata for package roots concurrently. Install the
          # repository's pinned channel before the census so its child cargo
          # processes cannot race rustup's first-use toolchain installation.
          toolchain: '1.96.0'
          components: clippy, rustfmt

      # Pull-request base SHA is authoritative for the differential clone
      # gate. On a push, github.event.before is the previous commit. A
      # zero/empty base falls back to the immediate parent, then the root;
      # an unavailable object is an environment failure, never a baseline.
      - name: Resolve scanner base commit
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          case "$base" in
            ""|0000000000000000000000000000000000000000) base="" ;;
          esac
          if [ -z "$base" ]; then
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if [ -n "${PR_BASE_REF:-}" ]; then
              git fetch --no-tags --depth=1 origin "refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
            fi
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          resolved="$(git rev-parse --verify "${base}^{commit}")"
          git cat-file -e "${resolved}^{commit}"
          printf 'CX_DUP_BASE_REF=%s\n' "$resolved" >> "$GITHUB_ENV"

      # Scanner installation is disclosed as non-hermetic; its findings are
      # advisory and are not a release security boundary.
      # The four native scanners are built from source by `cargo install`
      # (15.7 min measured on run 35740545815, under CARGO_BUILD_JOBS=1). The
      # Cache identity covers the installer and fork probe. Restored tools are
      # checked before reuse; only a complete validated toolchain is saved.
      - name: Restore pinned scanner toolchain
        id: scanner-cache
        # restore + an explicit save (below) rather than actions/cache: its
        # post-job save only runs when the whole job succeeds, and an advisory
        # census failure would otherwise force a ~10 min rebuild every run.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/epistemic-graph-scanners
          key: eg-scanners-v2-${{ runner.os }}-${{ hashFiles('scripts/install_scanners.sh', 'scripts/kiss_fork.py') }}

      - name: Validate restored scanner toolchain
        id: scanner-restored
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/install_scanners.sh --verify "$RUNNER_TEMP/epistemic-graph-scanners"; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Provision pinned scanner toolchain
        id: scanner-provision
        if: ${{ !cancelled() && steps.scanner-restored.outputs.valid != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_scanners.sh "$RUNNER_TEMP/epistemic-graph-scanners"

      - name: Validate complete scanner cache
        id: scanner-validated
        if: ${{ !cancelled() && (steps.scanner-restored.outputs.valid == 'true' || steps.scanner-provision.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_scanners.sh --verify "$RUNNER_TEMP/epistemic-graph-scanners"

      - name: Save pinned scanner toolchain
        if: ${{ !cancelled() && steps.scanner-validated.outcome == 'success' && steps.scanner-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/epistemic-graph-scanners
          key: ${{ steps.scanner-cache.outputs.cache-primary-key }}

      - name: Put pinned scanner toolchain on PATH
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          scanner_root="$RUNNER_TEMP/epistemic-graph-scanners"
          python -m pip install --disable-pip-version-check --no-input --upgrade "import-linter==2.13"
          for bin_dir in "$scanner_root/cccc/bin" "$scanner_root/kiss/bin" "$scanner_root/dupehound/bin" "$scanner_root/arch-lint/bin" "$scanner_root/npm/node_modules/.bin"; do
            echo "$bin_dir" >> "$GITHUB_PATH"
          done

      - name: Verify scanner versions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cccc --version)" = "cccc 1.6.0"
          test "$(kiss --version)" = "kiss 0.4.12"
          python3 scripts/kiss_fork.py "$(command -v kiss)"
          test "$(dupehound --version)" = "dupehound 0.1.2"
          test "$(jscpd --version)" = "cpd 5.0.16"
          test "$(depcruise --version)" = "18.2.0"
          test "$(python -c 'from importlib.metadata import version; print(version("import-linter"))')" = "2.13"
          case "$(arch-lint --version 2>&1)" in
            0.5.0|"arch-lint 0.5.0") ;;
            *) echo "unexpected arch-lint version output" >&2; exit 2 ;;
          esac

      - name: jscpd differential analysis (new pairs)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_duplication.py enforce --base-ref "$CX_DUP_BASE_REF"
      - name: jscpd tracked-tree census (advisory)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_duplication.py census

      - name: Dupehound tracked-tree census (advisory)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 scripts/check_dupehound_census.py \
            --repository agent-packages/epistemic-graph \
            --commit HEAD \
            --profile dupehound-full-tree-v1:epistemic-graph \
            --raw-output "$RUNNER_TEMP/epistemic-graph-dupehound.raw.json" \
            --stderr-output "$RUNNER_TEMP/epistemic-graph-dupehound.stderr.txt" \
            --normalized-output "$RUNNER_TEMP/epistemic-graph-dupehound.scanner-evidence.json" \
            --manifest-output "$RUNNER_TEMP/epistemic-graph-dupehound.manifest.json"
      - name: Upload Dupehound census evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epistemic-graph-dupehound-census-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/epistemic-graph-dupehound.raw.json
            ${{ runner.temp }}/epistemic-graph-dupehound.stderr.txt
            ${{ runner.temp }}/epistemic-graph-dupehound.scanner-evidence.json
            ${{ runner.temp }}/epistemic-graph-dupehound.manifest.json

      - name: CCCC tracked-tree census (advisory)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/epistemic-graph-cccc-census.json"
          manifest="$RUNNER_TEMP/epistemic-graph-cccc-sources.nul"
          manifest_stderr="$RUNNER_TEMP/epistemic-graph-cccc-source-manifest-stderr.txt"
          stderr="$RUNNER_TEMP/epistemic-graph-cccc-stderr.txt"
          terms="$RUNNER_TEMP/epistemic-graph-cccc-terms.txt"
          if ! python3 scripts/list_scanner_sources.py cccc > "$manifest" 2> "$manifest_stderr"; then
            cat "$manifest_stderr" >&2
            echo "CCCC census: source manifest generation failed" >&2
            exit 2
          fi
          mapfile -d "" files < "$manifest" || { echo "CCCC census: malformed source manifest" >&2; exit 2; }
          [ "${#files[@]}" -gt 0 ] || { echo "CCCC census: no tracked source files" >&2; exit 2; }
          languages="$(PYTHONPATH=scripts python3 -c "from scanner_contract import cccc_languages_arg; print(cccc_languages_arg())")" || { echo "CCCC census: invalid language registry" >&2; exit 2; }
          set +e
          cccc --no-config --min 0 --lang "$languages" "${files[@]}" > "$report" 2> "$stderr"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "$stderr" >&2
            exit "$status"
          fi
          python3 scripts/validate_cccc_census.py "$report" --source-manifest "$manifest"
          python3 scripts/report_complexity_terms.py "$report" --require-zero | tee "$terms"
      - name: Upload CCCC census evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epistemic-graph-cccc-census-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/epistemic-graph-cccc-census.json
            ${{ runner.temp }}/epistemic-graph-cccc-sources.nul
            ${{ runner.temp }}/epistemic-graph-cccc-source-manifest-stderr.txt
            ${{ runner.temp }}/epistemic-graph-cccc-stderr.txt
            ${{ runner.temp }}/epistemic-graph-cccc-terms.txt

      # The union of one whole-tree run and one run per package root (was one
      # KISS process per tracked file: 136.7 min on run 35740545815). The
      # wrapper keeps every fail-closed check -- pinned version, .config/kiss.toml
      # present, .kissconfig forbidden, rejected config keys, exit status
      # agreeing with the report -- and reports a superset of the per-file,
      # whole-tree and per-package findings; see scripts/check_kiss_census.py.
      - name: KISS tracked-tree census (advisory)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_kiss_census.py

      - name: Python import architecture (import-linter)
        if: ${{ !cancelled() }}
        run: lint-imports --config .config/importlinter.ini --no-cache
      - name: JavaScript dependency architecture (dependency-cruiser)
        if: ${{ !cancelled() }}
        working-directory: clients/js
        run: depcruise --validate --config .dependency-cruiser.cjs index.mjs
      - name: Rust architecture (arch-lint)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_rust_arch_lint.py
      - name: arch-lint policy against the installed scanner
        if: ${{ !cancelled() }}
        env:
          EG_REQUIRE_SCANNERS: "1"
        run: python -m pytest -q -p no:cacheprovider --noconftest tests/test_arch_lint_policy.py

  # ── Release wheel matrix. Run the expensive cross-platform reproducible
  # build for tags and explicit dispatches; ordinary pushes already run the
  # product tests and installed-wheel smoke in `gates`.
  build:
    timeout-minutes: 360
    name: wheel ${{ matrix.name }}
    needs: [gates, gates-plan-fuzz, gates-wheel, gates-facade, gates-whisper, gates-variants, gates-crates, gates-pyo3, python-suite, security, lint-and-architecture, tts-piper-inference, language-clients]
    # Hosted platform legs; x86 is isolated in the immutable reusable job below.
    if: >-
      github.repository == 'Knuckles-Team/epistemic-graph'
      && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional || false }}
    # Read by .github/actions/folded-wheel, which cannot see the matrix.
    env:
      EG_WHEEL_TARGET: ${{ matrix.target }}
      EG_WHEEL_MATURIN_ARGS: ${{ matrix.maturin_args }}
      # Release rustc processes (thin LTO, codegen-units = 1) are memory-heavy:
      # at 4 jobs the 16 GB hosted Linux runners were killed mid-build ("runner
      # has received a shutdown signal"). Every leg caps parallel jobs.
      EG_WHEEL_JOBS_ARG: ${{ matrix.jobs && format('--jobs {0}', matrix.jobs) || '' }}
      EG_WHEEL_MANYLINUX: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
    strategy:
      fail-fast: false
      # Every leg runs on its own GitHub-HOSTED runner VM, so the legs share no
      # compiler, disk or memory: serializing them bought nothing and cost the
      # whole matrix. Measured on run 32563780499 (2026-08-22) with the old
      # `max-parallel: 1`: linux-x86_64 ran 11:08->14:01, linux-aarch64 only
      # STARTED at 14:01, and the three remaining legs sat queued from 11:08 --
      # a ~17h projected matrix for ~3h of critical path. Legs run concurrently.
      matrix:
        include:
          # Native ARM runner: the qemu-emulated cross build on an x86 host ran
          # past two hours and lost its runner mid-build.
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
            # The two-job server compile was SIGKILLed on the 16 GiB runner.
            # Keep full features/LTO; bound Cargo concurrency to one job.
            jobs: 1
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            maturin_args: ""
            jobs: 4
          # macOS is best-effort: a runner-image or toolchain regression on a
          # platform nothing in this fleet deploys to must not withhold the
          # Linux and Windows wheels, which ARE the supported install targets.
          # `continue-on-error` keeps the leg reported but non-blocking.
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            maturin_args: ""
            jobs: 2
            optional: true
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            maturin_args: ""
            jobs: 2
            optional: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'

      - name: Read tracked Rust toolchain pin
        id: rust-toolchain
        shell: bash
        run: >-
          python -c "import os,re,tomllib;
          channel=tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'];
          assert re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+', channel);
          open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write(f'channel={channel}\n')"

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Bind build time to the source revision
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          case "$SOURCE_DATE_EPOCH" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"

      # Release binaries must not retain checkout, build-user, Cargo, or toolchain
      # roots. The helper preserves existing flags using Cargo's encoded form and
      # reports counts only (never the concrete prefixes). `--target` is required
      # here (unlike the single-target `gates` job above): this job cross-builds
      # multiple targets, and the C/C++ prefix-map flag is feature-detected
      # per target compiler -- the manylinux aarch64 cross-gcc rejects
      # -ffile-prefix-map (GCC 8+ only) and falls back to -fdebug-prefix-map,
      # written to a CFLAGS_<target> variable scoped to this leg alone so it
      # can never reach a different leg's toolchain.
      - name: Configure identity-neutral Rust source paths
        shell: bash
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "${{ matrix.target }}"

      - name: Select the verified native Mach-O linker
        if: ${{ endsWith(matrix.target, '-apple-darwin') }}
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-toolchain.outputs.channel }}
        run: |
          case "$EG_WHEEL_TARGET" in
            aarch64-apple-darwin) export MACOSX_DEPLOYMENT_TARGET=11.0 ;;
            x86_64-apple-darwin) export MACOSX_DEPLOYMENT_TARGET=10.12 ;;
          esac
          source scripts/configure_macos_linker.sh "$EG_WHEEL_TARGET"
          python - <<'PYENV'
          import os
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key in ("SDKROOT", "MACOSX_DEPLOYMENT_TARGET", "RUSTUP_TOOLCHAIN", "CARGO_ENCODED_RUSTFLAGS"):
                  output.write(f"{key}={os.environ[key]}\n")
          PYENV

      # Each pass builds the server wheel plus the eg-numeric and eg-pyengine
      # kernels, folds them in, then normalizes, privacy-audits and checks the
      # result (.github/actions/folded-wheel). Tag releases publish the primary
      # pass; a manual (workflow_dispatch) run adds a second pass from empty
      # Cargo state at the same neutral path and requires byte-identical wheels.
      - name: Build primary wheel (${{ matrix.name }})
        uses: ./.github/actions/folded-wheel
        with:
          pass: primary

      - name: Remove primary native build state
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: >-
          python -c "import os,shutil; from pathlib import Path;
          root=Path(os.environ['RUNNER_TEMP']).resolve();
          target=(root/'epistemic-graph-release-target').resolve();
          assert target.parent==root and target.name=='epistemic-graph-release-target';
          print('removing' if target.exists() else 'already absent:', target);
          shutil.rmtree(target) if target.exists() else None"

      - name: Build reproduction wheel (${{ matrix.name }})
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/folded-wheel
        with:
          pass: reproduction

      # Diagnostic replacement for the former bare inline `python -c` (three
      # `assert`s, no output on failure -- exactly what made the
      # windows-x86_64-only reproducibility failure undiagnosable from the CI
      # log). The three protected assertion messages are UNCHANGED
      # ('release wheel cardinality mismatch' / 'release wheel filename
      # mismatch' / 'release wheel digest mismatch') and the gate still exits
      # non-zero on any mismatch -- this only adds a full member-level
      # CONTENT-vs-CONTAINER-ONLY report on stdout. See
      # scripts/compare_wheel_reproducibility.py.
      - name: Require byte-identical folded wheels
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: python scripts/compare_wheel_reproducibility.py dist-primary dist-reproduction

      - name: Stage sole publish candidate
        shell: bash
        run: |
          mkdir dist
          cp dist-primary/epistemic_graph-*.whl dist/

      # Smoke test: install the wheel and assert it carries NO executables (the
      # server ships in epistemic-graph-server), then prove the extension modules
      # `epistemic_graph.numeric` (computing) and `epistemic_graph.engine`
      # (BUG-PE-002) import from the INSTALLED wheel.
      - name: Smoke test (no executables + import epistemic_graph.{numeric,engine})
        shell: bash
        run: bash scripts/release_wheel_smoke.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

      - name: Retain Mac prebuild measurements
        if: ${{ always() && endsWith(matrix.target, '-apple-darwin') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-build-metrics-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eg-macos-build-metrics
          if-no-files-found: warn
          retention-days: 7

  # NOTE (CONCEPT:EG-371): the old pi/pi-max tier wheels (`wheels-pi`) and the
  # size-optimized "contains-all" tier wheels (`wheels-full-tiny`) are GONE. Those legs
  # existed only because the deployment tiers produced DIFFERENT binaries that all shared
  # the SAME wheel filename (`epistemic_graph-<ver>-py3-none-<platform>`), so only one
  # could ever publish. The tiers are collapsed into ONE main build (the `build` job
  # above), which is what publishes — no more per-tier legs, no more filename collision.

  # NOTE: the eg-numeric kernel is NO LONGER a separately-published package. Its
  # Surface-A pyo3 `.so` is FOLDED INTO the `epistemic-graph` main wheel in the
  # `build` job above, so a BARE `pip install epistemic-graph` (no extra tag)
  # provides `epistemic_graph.numeric` from ONE published package (CONCEPT:EG-346).
  # `epistemic-graph[numeric]` still resolves for old pins, but is a no-op alias —
  # it is not what makes the kernel present.

  # The engine container image is built and published by the
  # epistemic-graph-server repository (docker/Dockerfile here is superseded).

  build-x86:
    name: wheel linux-x86_64
    needs: [gates, gates-plan-fuzz, gates-wheel, gates-facade, gates-whisper, gates-variants, gates-crates, gates-pyo3, python-suite, security, lint-and-architecture, tts-piper-inference, language-clients]
    if: >-
      github.repository == 'Knuckles-Team/epistemic-graph'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: Knuckles-Team/epistemic-graph/.github/workflows/eg-release-x86.yml@bc4448160e8d16deb8210ce8aeb058b2da293d93

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH — gated to a `v*` tag and the required release wheel matrix.
  # `build` needs the product tests, runtime-contract checks, security, and
  # real-inference tests. Optional feature builds and benchmarks are not
  # prerequisites and cannot hold up publication.
  build-sdist:
    name: Build and validate source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - name: Build source archive without native compilation
        run: |
          python -m pip install 'maturin==1.14.1'
          maturin sdist --out dist-sdist
          python scripts/check_sdist_completeness.py dist-sdist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-distribution
          path: dist-sdist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    timeout-minutes: 360
    name: Publish distributions to PyPI (release only)
    needs: [build, build-x86, build-sdist]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # Collect every wheel the matrix produced. A pattern download means an
      # optional platform that did not build is simply absent rather than a
      # hard failure, while the required set is asserted explicitly below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-distribution
          path: dist
      # The supported install targets. Publishing without one of these would
      # silently ship a release that cannot be installed on a platform we claim
      # to support, so it fails loudly instead.
      - name: Require the Linux and Windows wheels
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tag in manylinux_2_28_x86_64 manylinux_2_28_aarch64 win_amd64; do
            ls dist/*"$tag"*.whl >/dev/null 2>&1 || missing+=("$tag")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "REFUSING to publish: no wheel for ${missing[*]}" >&2
            ls -1 dist/ >&2
            exit 1
          fi
          echo "required wheels present:"; ls -1 dist/*.whl
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      # ── THE PUBLISH BOUNDARY GATE. Every wheel about to be uploaded must carry the
      #    folded numeric AND engine kernels (BUG-PE-002 — the `build` job above now
      #    always folds both), an EXECUTABLE server binary, the full python surface,
      #    and a self-consistent RECORD. This runs on the DOWNLOADED artifacts, so it
      #    catches an incomplete wheel no matter which upstream step regressed.
      - name: Require every distribution to be complete before upload
        run: |
          python -m pip install --upgrade pip
          echo "Distributions staged for upload:"
          ls -1 dist/
          python scripts/check_wheel_completeness.py --require-engine-kernel dist/*.whl
          python scripts/check_sdist_completeness.py dist/*.tar.gz

      - name: Checkout immutable publication contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/pipelines
          ref: 4f80a968dbf09b1f4d35bbff11b77f9e2fcd3ef6
          path: .pipeline-contract
          persist-credentials: false
      - name: Freeze exact staged publication identity
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PIPELINES_CONTRACT_COMMIT: 4f80a968dbf09b1f4d35bbff11b77f9e2fcd3ef6
        run: |
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py preflight \
            --directory dist --package epistemic-graph --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication.json"
      - name: Publish only missing exact files to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          SOURCE_COMMIT: ${{ github.sha }}
          PIPELINES_CONTRACT_COMMIT: 4f80a968dbf09b1f4d35bbff11b77f9e2fcd3ef6
        run: |
          python -m pip install --upgrade twine
          python scripts/verify_release_tag.py
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py missing \
            --directory dist --package epistemic-graph --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication.json" > "$RUNNER_TEMP/publication-missing.json"
          python - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          missing = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication-missing.json').read_text())
          if missing:
              subprocess.run([sys.executable, '-m', 'twine', 'upload', *[str(pathlib.Path('dist') / name) for name in missing]], check=True)
          else:
              print('Every staged filename already exists with identical bytes.')
          PYTHON
      - name: Verify every published filename and digest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PIPELINES_CONTRACT_COMMIT: 4f80a968dbf09b1f4d35bbff11b77f9e2fcd3ef6
        run: |
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py postverify \
            --directory dist --package epistemic-graph --version "${GITHUB_REF_NAME#v}" \
            --manifest "$RUNNER_TEMP/publication.json"

  # ── Optional feature-combination build analysis. Failures stay visible in
  # Actions but cannot delay a release.
  feature-matrix:
    timeout-minutes: 360
    name: feature-build ${{ matrix.target.name }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: 'crate-eg-types',   flags: '-p eg-types --all-features' }
          - { name: 'crate-eg-core',    flags: '-p eg-core --all-features' }
          - { name: 'crate-eg-compute', flags: '-p eg-compute --all-features' }
          - { name: 'slim-lib',         flags: '--no-default-features --features graph,algorithms' }
          - { name: 'default',          flags: '' }
          - { name: 'minimal-server',   flags: '--no-default-features --features server' }
          - { name: 'compute',          flags: '--no-default-features --features compute' }
          - { name: 'full',             flags: '--no-default-features --features full' }
          - { name: 'cluster',          flags: '--no-default-features --features cluster' }
          - { name: 'full-extras',      flags: '--no-default-features --features full-extras' }
          # NE-216: a feature-unification gap between eg-types/geo (turned on
          # unconditionally by eg-capabilities, a leaf crate with no eg-plan dep, for its
          # own exhaustive Method-policy match) and eg-plan's OWN geo feature (which used
          # to gate the eg-types/geo request too) meant this exact combo compiled the
          # `Pred::Spatial*` wire variants into eg-plan without compiling the exhaustive
          # `where_clause` match arm that has to cover them -- E0004. These three combos
          # pin the profile that broke plus its immediate neighbors (no server/security,
          # and the same profile with `geo` explicitly on) so a future regression of that
          # class fails fast here instead of only surfacing when someone happens to build
          # this exact non-default combo.
          - { name: 'query-only',              flags: '--no-default-features --features query' }
          - { name: 'server-redb-query-security', flags: '--no-default-features --features "server,redb,query,security"' }
          - { name: 'server-redb-query-security-geo', flags: '--no-default-features --features "server,redb,query,security,geo"' }
          # EH-346: the policy-evolution held-blob check has a fail-closed
          # `not(feature = "blob")` twin; build the server without the blob store so
          # that twin cannot rot unnoticed.
          - { name: 'server-redb-no-blob', flags: '--no-default-features --features "graph,algorithms,metrics,server,redb"' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target-isolated"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target.name }}
      - name: Build ${{ matrix.target.name }}
        run: cargo build ${{ matrix.target.flags }}

  # ── Optional perf/recall feedback. Failures stay visible in Actions but
  # cannot delay a release.
  benchmarks:
    timeout-minutes: 360
    name: Perf/recall regression gate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: benchmarks
          workspaces: ". -> target-isolated"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      # Run the benches (bounded iters — a short spot-check, not a wall-clock chase). The
      # bench writes the measured recall to $EG_BENCH_RECALL_OUT and ASSERTS the floor, so
      # a recall regression fails here directly.
      - name: Run hybrid-query benches (latency + recall@k)
        run: cargo bench -p eg-plan --features "query,owl,text,timeseries" --bench hybrid_queries
      # Gate on the committed thresholds (recall floor + generous per-bench p50 ceilings).
      - name: Perf/recall regression gate
        run: python3 scripts/bench_gate.py

  # ── Rolling engine wheel for consumer CI (spec public-engine-contract-and-release). The wheel
  # exceeds the PyPI size limit, so each main push publishes its Linux x86
  # wheel to the `engine-main` GitHub prerelease. Consumers install it with
  # `gh release download engine-main -p '*.whl'`. Release notes name the
  # source commit. Tag releases keep their own trusted build path above.
  engine-main-wheel:
    timeout-minutes: 360
    name: engine-main wheel (linux-x86_64)
    needs: [gates, gates-plan-fuzz, gates-wheel, gates-facade, gates-whisper, gates-variants, gates-crates, gates-pyo3, python-suite, security, lint-and-architecture]
    if: >-
      github.repository == 'Knuckles-Team/epistemic-graph'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: engine-main-wheel
      cancel-in-progress: true
    env:
      EG_WHEEL_TARGET: x86_64-unknown-linux-gnu
      EG_WHEEL_MATURIN_ARGS: ""
      EG_WHEEL_JOBS_ARG: "--jobs 2"
      EG_WHEEL_MANYLINUX: "2_28"
    steps:
      - *eg-gates-checkout
      # Unconditionally ubuntu-latest (never self-hosted), so this keeps
      # actions/setup-python rather than the *eg-gates-python uv alias.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      # rustup installs the channel pinned by rust-toolchain.toml.
      - name: Install the tracked Rust toolchain
        shell: bash
        run: rustup toolchain install --profile minimal && rustup show active-toolchain
      - name: Bind build time and neutral source paths
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "$EG_WHEEL_TARGET"

      - name: Build primary wheel (linux-x86_64)
        uses: ./.github/actions/folded-wheel
        with:
          pass: primary

      - name: Stage wheel
        shell: bash
        run: |
          mkdir dist
          cp dist-primary/epistemic_graph-*.whl dist/
          (cd dist && sha256sum epistemic_graph-*.whl > SHA256SUMS)

      - name: Smoke test (no executables + import epistemic_graph.{numeric,engine})
        shell: bash
        run: bash scripts/release_wheel_smoke.sh

      - name: Publish to the rolling engine-main prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          notes="Rolling Linux x86_64 wheel built from main at ${SOURCE_SHA}. Not a versioned release."
          gh release delete engine-main --cleanup-tag --yes || true
          gh release create engine-main dist/epistemic_graph-*.whl dist/SHA256SUMS \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "engine-main (${SOURCE_SHA:0:12})" --notes "$notes"
