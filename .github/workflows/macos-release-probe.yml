name: Native macOS release probe
'on':
  pull_request:
    paths:
      - '.github/workflows/macos-release-probe.yml'
      - 'scripts/configure_macos_linker.sh'
      - 'scripts/probe_macos_release.py'
      - 'scripts/prebuild_macos_bins.sh'
      - '.github/actions/folded-wheel/action.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: '1.96.0'
      EG_WHEEL_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.96.0'
      - name: Install the exact packaging probe tool
        run: python -m pip install 'maturin==1.15.0'
      - name: Configure path remaps
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "$EG_WHEEL_TARGET"
      - name: Probe native Mach-O linking and five-binary packaging
        shell: bash
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          source scripts/configure_macos_linker.sh "$EG_WHEEL_TARGET"
          python scripts/probe_macos_release.py
