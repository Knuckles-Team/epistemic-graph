name: Rust CI

# Engine quality gate: lint + test + a feature-matrix build across the workspace
# so the slim (lib-only) and full builds can never silently bit-rot — a
# `use crate::finance` leaking into a default-built module, or a lower crate
# reaching up the DAG, breaks a row here. Kept separate from the maturin publish
# pipeline so it runs on every push and PR, not just release.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'epistemic_graph/**'
      - 'protocols/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check_epistemic_operations_protocol.py'
      - 'scripts/check_wheel_privacy.py'
      - 'scripts/configure_rust_path_remap.py'
      - 'scripts/normalize_wheel_build_paths.py'
      - 'scripts/normalize_wheel_sbom.py'
      - 'scripts/check_p2_modality_architecture.py'
      - 'scripts/check_p2_analytics_reasoning_architecture.py'
      - 'scripts/check_lazy_lifecycle_architecture.py'
      - 'scripts/check_universal_read_rls.py'
      - 'scripts/certify_exact_*.py'
      - 'scripts/check_exact_release_campaigns.py'
      - 'scripts/check_documentation_contract.py'
      - 'scripts/check_canonical_property_schema.py'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'epistemic_graph/**'
      - 'protocols/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check_epistemic_operations_protocol.py'
      - 'scripts/check_wheel_privacy.py'
      - 'scripts/configure_rust_path_remap.py'
      - 'scripts/normalize_wheel_build_paths.py'
      - 'scripts/normalize_wheel_sbom.py'
      - 'scripts/check_p2_modality_architecture.py'
      - 'scripts/check_p2_analytics_reasoning_architecture.py'
      - 'scripts/check_lazy_lifecycle_architecture.py'
      - 'scripts/check_universal_read_rls.py'
      - 'scripts/certify_exact_*.py'
      - 'scripts/check_exact_release_campaigns.py'
      - 'scripts/check_documentation_contract.py'
      - 'scripts/check_canonical_property_schema.py'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: P2 modality architecture gate
        run: python3 scripts/check_p2_modality_architecture.py
      - name: P2 analytics and reasoning architecture gate
        run: python3 scripts/check_p2_analytics_reasoning_architecture.py
      - name: Bounded lazy lifecycle architecture gate
        run: python3 scripts/check_lazy_lifecycle_architecture.py
      - name: Universal served-read RLS and carrier-ownership architecture gate
        run: python3 scripts/check_universal_read_rls.py
      - name: Exact protocol, multimodal, KnowledgeBatch, and reasoning campaign architecture gate
        run: python3 scripts/check_exact_release_campaigns.py
      - name: Documentation feature, ledger, and MkDocs contract
        run: python3 scripts/check_documentation_contract.py
      - name: Canonical structural property schema
        run: python3 scripts/check_canonical_property_schema.py
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check (workspace)
        run: cargo fmt --all --check

      # Lint each gated build so warnings can't accumulate. `-D warnings` makes
      # clippy fail the job on any lint. Numeric matrix modules carry scoped
      # `#![allow(clippy::needless_range_loop)]` where explicit indices are clearer.
      - name: Clippy (every crate, all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Clippy (slim lib)
        run: cargo clippy --no-default-features --features graph,algorithms -- -D warnings
      - name: Clippy (slim server — proves no compute leaks into the lean build)
        run: cargo clippy --no-default-features --features server --all-targets -- -D warnings

      # Tests: the lower crates with their own features, then the facade full,
      # then the slim-server row (where the feature-gating guard test lives).
      - name: Test (lower crates, all features)
        run: cargo test -p eg-types -p eg-core -p eg-compute --all-features
      - name: Test (facade full)
        run: cargo test -p epistemic-graph --features full
      # The blob RSS-bound tests read WHOLE-PROCESS RSS, so they are #[ignore]d out
      # of the parallel run above (a concurrent sibling's 256MB blob inflates the
      # shared RSS past the cap). Run them here in isolation — serial + ignored — so
      # the memory-regression coverage stays in CI without the parallel pollution.
      - name: Test (memory-regression — RSS bounds, isolated)
        run: cargo test -p epistemic-graph --features full bounded_memory -- --ignored --test-threads=1
      - name: Test (slim server — gated-out methods return the not-built error)
        run: cargo test -p epistemic-graph --no-default-features --features server
      # DE7 (durable-execution-native.md): replay-determinism crash-and-reopen
      # proofs for eg-jobs/eg-statechart — see crates/eg-jobs/tests/
      # replay_determinism.rs and crates/eg-statechart/tests/
      # replay_determinism.rs. Neither crate's own test suite is exercised by
      # any other step in this job (a pre-existing, broader gap tracked
      # separately, not closed by this step).
      - name: Test (replay-determinism — eg-jobs/eg-statechart crash-replay proofs, DE7)
        run: cargo test -p eg-jobs -p eg-statechart --test replay_determinism

  protocol-parity:
    # The Python client mirrors the Rust `Method` enum by sending variant names
    # as strings over MessagePack (no PyO3/codegen). This gate asserts the two
    # stay in lockstep — see tests/test_protocol_parity.py. Pure stdlib text
    # parse, so no wheel build or package install is needed (`--noconftest`
    # skips the package-importing conftest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Epistemic Operations manifest ⇄ Rust DTO parity
        run: python3 scripts/check_epistemic_operations_protocol.py
      - name: Protocol parity (Python client ⇄ Rust Method enum)
        run: python -m pytest tests/test_protocol_parity.py --noconftest -q

  numeric-parity:
    # CONCEPT:EG-346 — the numpy-parity gate for the compiled eg-numeric kernel.
    # Builds the Surface-A pyo3 wheel (`epistemic_graph.numeric` / `numeric`) with
    # maturin, installs it, then asserts EVERY kernel op == its numpy reference
    # (np.allclose) across the op-surface incl. edge cases (nan/inf, singular
    # matrix, empty). FAILS if the Rust kernel diverges from numpy — the standing
    # guarantee that lets agent-utilities run its `xp` shim kernel-LIVE (KG-2.315)
    # instead of on the numpy fallback. Python 3.12 is inside pyo3-0.22's native
    # support window, so no PYO3_USE_ABI3_FORWARD_COMPATIBILITY shim is needed here
    # (that flag is only required on interpreters newer than pyo3's max, e.g. 3.14).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: numeric-parity
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install maturin + parity deps
        run: pip install 'maturin>=1,<2' numpy pytest
      - name: Configure identity-neutral Rust source paths
        run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV"
      - name: Build eg-numeric Surface-A wheel (feature python)
        run: maturin build --release -m crates/eg-numeric/Cargo.toml --features python --out target/wheels
      - name: Normalize build-local SBOM references
        run: python scripts/normalize_wheel_sbom.py target/wheels/*.whl
      - name: Normalize retained native build paths
        run: python scripts/normalize_wheel_build_paths.py target/wheels/*.whl
      - name: Audit numeric wheel for retained build identity
        run: python scripts/check_wheel_privacy.py target/wheels/*.whl
      - name: Install the wheel
        run: pip install --no-index --find-links target/wheels eg-numeric
      - name: numpy-parity gate (compiled kernel vs numpy)
        run: python -m pytest crates/eg-numeric/tests/test_kernel_parity.py --noconftest -q

  feature-matrix:
    # Build-only across the feature combinations we ship, to guard feature-gate
    # bitrot — including the per-crate builds that prove the DAG boundaries hold
    # (a lower crate that reached upward would fail its standalone build).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: 'crate-eg-types',   flags: '-p eg-types --all-features' }
          - { name: 'crate-eg-core',    flags: '-p eg-core --all-features' }
          - { name: 'crate-eg-compute', flags: '-p eg-compute --all-features' }
          - { name: 'slim-lib',         flags: '--no-default-features --features graph,algorithms' }
          # CONCEPT:EG-371 — tiers collapsed: `default` IS the main full-featured build,
          # so `default` and `full` build the same thing (kept as two rows for clarity).
          - { name: 'default',          flags: '' }
          - { name: 'minimal-server',   flags: '--features server' }
          - { name: 'compute',          flags: '--features compute' }
          - { name: 'full',             flags: '--no-default-features --features full' }
          # The two OPT-IN build layers on top of the main build must also stay green.
          - { name: 'cluster',          flags: '--no-default-features --features cluster' }
          - { name: 'full-extras',      flags: '--no-default-features --features full-extras' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target.name }}
      - name: Build ${{ matrix.target.name }}
        run: cargo build ${{ matrix.target.flags }}

  benchmarks:
    # CONCEPT:EG-KG.query.hybrid-latency-benches / recall-oracle-bench / synthetic-bench-dataset / perf-recall-ci-gate — the perf/recall regression gate. Runs the eg-plan
    # hybrid_queries criterion bench (latency of the representative hybrid pipelines +
    # recall@k of the vector leg vs a brute-force oracle over a fixed synthetic dataset),
    # then gates on a committed threshold set. The RECALL floor is the tight, deterministic
    # check (the bench itself also asserts it); the per-bench p50 ceilings are generous —
    # a catastrophic-regression net, kept non-flaky on shared CI runners. It also runs the
    # query-pipeline FUZZ + concurrency-chaos tests (CONCEPT:EG-KG.query.pipeline-fuzz + EG-KG.query.concurrency-chaos-fuzz) so a fuzz regression is
    # caught in the same job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: benchmarks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The fuzz + concurrency-chaos proptest suite (long random valid pipelines,
      # snapshot-isolation under contention). Kept in this job so the query-robustness
      # gate lives beside the perf gate.
      - name: Query-pipeline fuzz + chaos (eg-plan)
        run: cargo test -p eg-plan --features "query,owl,text,timeseries,federation" --test fuzz_pipelines
      # Run the benches (bounded iters — a short spot-check, not a wall-clock chase). The
      # bench writes the measured recall to $EG_BENCH_RECALL_OUT and ASSERTS the floor, so
      # a recall regression fails here directly.
      - name: Run hybrid-query benches (latency + recall@k)
        run: cargo bench -p eg-plan --features "query,owl,text,timeseries" --bench hybrid_queries
      # Gate on the committed thresholds (recall floor + generous per-bench p50 ceilings).
      - name: Perf/recall regression gate
        run: python3 scripts/bench_gate.py
