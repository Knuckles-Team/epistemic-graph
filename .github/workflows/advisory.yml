name: Advisory

# ─────────────────────────────────────────────────────────────────────────
# Half of the two-workflow model — see release.yml's header comment for the
# full explanation. In short: this workflow REPORTS, it never BLOCKS.
#
# Every step below runs with `continue-on-error: true` so a red step here
# never fails the job/workflow, but is still clearly visible as a red step
# in the Actions UI and in the job summary written at the end.
#
# This file carries everything from the former rust-ci.yml that is NOT the
# cargo test suite: the 7 architecture/documentation-contract gate scripts,
# `cargo fmt`/`cargo clippy` (3 variants), the 10-way feature-build matrix,
# and the perf/recall benchmark gate (`benchmarks`) — plus `pages` (the
# former standalone pages.yml, genuinely independent of the release: it does
# not install the Python package, only builds mkdocs from `docs/`, so unlike
# agent-utilities' Pages job it was never coupled to the packaging deadlock;
# it moves here purely to keep this repo at exactly two workflow files).
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'epistemic_graph/**'
      - 'protocols/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - '.github/workflows/advisory.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'epistemic_graph/**'
      - 'protocols/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/advisory.yml'
  workflow_dispatch:

concurrency:
  group: advisory-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ── formerly rust-ci.yml's `lint-and-test` job, minus the cargo test
  # steps (those are release-critical now — see release.yml's `gates`).
  lint-and-architecture:
    name: Lint + architecture gates (report only, never blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: P2 modality architecture gate
        continue-on-error: true
        run: python3 scripts/check_p2_modality_architecture.py
      - name: P2 analytics and reasoning architecture gate
        continue-on-error: true
        run: python3 scripts/check_p2_analytics_reasoning_architecture.py
      - name: Bounded lazy lifecycle architecture gate
        continue-on-error: true
        run: python3 scripts/check_lazy_lifecycle_architecture.py
      - name: Universal served-read RLS and carrier-ownership architecture gate
        continue-on-error: true
        run: python3 scripts/check_universal_read_rls.py
      - name: Exact protocol, multimodal, KnowledgeBatch, and reasoning campaign architecture gate
        continue-on-error: true
        run: python3 scripts/check_exact_release_campaigns.py
      - name: Documentation feature, ledger, and MkDocs contract
        continue-on-error: true
        run: python3 scripts/check_documentation_contract.py
      - name: Canonical structural property schema
        continue-on-error: true
        run: python3 scripts/check_canonical_property_schema.py
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check (workspace)
        continue-on-error: true
        run: cargo fmt --all --check

      # Lint each gated build so warnings can't accumulate. `-D warnings` makes
      # clippy fail the step (never the job) on any lint. Numeric matrix modules
      # carry scoped `#![allow(clippy::needless_range_loop)]` where explicit
      # indices are clearer.
      - name: Clippy (every crate, all features)
        continue-on-error: true
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Clippy (slim lib)
        continue-on-error: true
        run: cargo clippy --no-default-features --features graph,algorithms -- -D warnings
      - name: Clippy (slim server — proves no compute leaks into the lean build)
        continue-on-error: true
        run: cargo clippy --no-default-features --features server --all-targets -- -D warnings

      - name: Advisory summary
        if: always()
        run: |
          echo "## Lint + architecture gates ran in report-only mode" >> "$GITHUB_STEP_SUMMARY"
          echo "Every step above uses \`continue-on-error: true\`. A red step here" >> "$GITHUB_STEP_SUMMARY"
          echo "is real debt and never blocks a release -- release-blocking checks" >> "$GITHUB_STEP_SUMMARY"
          echo "(secret-history scan, the cargo/pytest test suite, wheel build +" >> "$GITHUB_STEP_SUMMARY"
          echo "reproducibility + release-contract + privacy) live only in" >> "$GITHUB_STEP_SUMMARY"
          echo "\`release.yml\`. Scroll up for which step(s) failed." >> "$GITHUB_STEP_SUMMARY"

  # ── formerly rust-ci.yml's `feature-matrix` job — build-only across the
  # feature combinations shipped, guarding feature-gate bitrot. Not "the"
  # wheel build (that is release.yml's `build` job, which builds the exact
  # shipped `full,ast-extended` config for real and IS release-critical);
  # this matrix validates OTHER feature combos (slim-lib, minimal-server,
  # cluster, full-extras, ...) that are never published, so it stays
  # advisory.
  feature-matrix:
    name: feature-build ${{ matrix.target.name }} (report only, never blocks)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: 'crate-eg-types',   flags: '-p eg-types --all-features' }
          - { name: 'crate-eg-core',    flags: '-p eg-core --all-features' }
          - { name: 'crate-eg-compute', flags: '-p eg-compute --all-features' }
          - { name: 'slim-lib',         flags: '--no-default-features --features graph,algorithms' }
          - { name: 'default',          flags: '' }
          - { name: 'minimal-server',   flags: '--features server' }
          - { name: 'compute',          flags: '--features compute' }
          - { name: 'full',             flags: '--no-default-features --features full' }
          - { name: 'cluster',          flags: '--no-default-features --features cluster' }
          - { name: 'full-extras',      flags: '--no-default-features --features full-extras' }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target.name }}
      - name: Build ${{ matrix.target.name }}
        run: cargo build ${{ matrix.target.flags }}

  # ── formerly rust-ci.yml's `benchmarks` job. The perf p50 ceilings / recall
  # floor are a regression NET, not a correctness suite, and benchmarks are
  # inherently noisier on shared CI runners than a deterministic test — a
  # textbook advisory candidate. NOTE: this job's fuzz_pipelines cargo test
  # moved to release.yml's `gates` job (it is a correctness test, not a
  # benchmark) — see that file's "Query-pipeline fuzz + chaos" step.
  benchmarks:
    name: Perf/recall regression gate (report only, never blocks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: benchmarks
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Run the benches (bounded iters — a short spot-check, not a wall-clock chase). The
      # bench writes the measured recall to $EG_BENCH_RECALL_OUT and ASSERTS the floor, so
      # a recall regression fails here directly.
      - name: Run hybrid-query benches (latency + recall@k)
        run: cargo bench -p eg-plan --features "query,owl,text,timeseries" --bench hybrid_queries
      # Gate on the committed thresholds (recall floor + generous per-bench p50 ceilings).
      - name: Perf/recall regression gate
        run: python3 scripts/bench_gate.py

  # ── formerly the standalone pages.yml. Genuinely independent of the
  # release (no `pip install -e .`, just `mkdocs build` from `docs/`) — it
  # moves here only to keep this repo at exactly two workflow files, not
  # because it was ever coupled to the release like agent-utilities' was.
  #
  # A job that calls a reusable workflow (`uses:`) accepts only
  # name/uses/with/secrets/needs/if/permissions/strategy/concurrency — no
  # `runs-on`/`steps`/`continue-on-error` (agent-utilities' release.yml hit
  # this exact parser trap on its own `publish-docker` job; adding
  # `continue-on-error` here would invalidate the WHOLE workflow file the
  # same way). That is not a gap: this job failing already cannot block
  # release.yml (they are separate workflow files with no `needs:` between
  # them) — a red `pages` job here already satisfies "fails visibly in its
  # own run, never blocks a release" with no extra field needed.
  pages:
    name: Deploy GitHub Pages (report only, never blocks)
    if: github.event_name == 'push'
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@main
    permissions:
      contents: write
      pages: write
      id-token: write
