# Only this immutable reusable workflow may be admitted to the runner group.
name: Build canonical tag Linux x86 wheel
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  authorize:
    name: Authorize canonical version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'Knuckles-Team/epistemic-graph' && github.repository_id == '1248541673' && github.repository_owner_id
      == '119072828' && github.event_name == 'push' && github.event.deleted == false && github.ref == 'refs/tags/v2.27.0'
      && github.ref_type == 'tag' && github.workflow_ref == 'Knuckles-Team/epistemic-graph/.github/workflows/release.yml@refs/tags/v2.27.0'
    outputs:
      source: ${{ steps.authorize.outputs.source }}
    steps:
    - id: authorize
      name: Verify operator and canonical remote tag
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_CONTEXT: '{"repository": "${{ github.repository }}", "repository_id": "${{ github.repository_id }}", "repository_owner_id":
          "${{ github.repository_owner_id }}", "event_name": "${{ github.event_name }}", "ref": "${{ github.ref }}", "ref_type":
          "${{ github.ref_type }}", "workflow_ref": "${{ github.workflow_ref }}", "actor": "${{ github.actor }}", "actor_id":
          "${{ github.actor_id }}", "triggering_actor": "${{ github.triggering_actor }}", "sha": "${{ github.sha }}"}'
      run: |
        python3 - <<'PYTHON'
        import re

        REPO = 'Knuckles-Team/epistemic-graph'
        REPO_ID = '1248541673'
        OWNER_ID = '119072828'
        ACTOR = 'Knucklessg1'
        ACTOR_ID = '8661571'
        REF = 'refs/tags/v2.27.0'
        CALLER = REPO + '/.github/workflows/release.yml@' + REF


        def authorize(context, peeled_tag_sha):
            expected = {'repository': REPO, 'repository_id': REPO_ID, 'repository_owner_id': OWNER_ID,
                        'event_name': 'push', 'ref': REF, 'ref_type': 'tag',
                        'workflow_ref': CALLER, 'actor': ACTOR, 'actor_id': ACTOR_ID,
                        'triggering_actor': ACTOR}
            if any(str(context.get(k, '')) != v for k, v in expected.items()):
                raise ValueError('unauthorized repository, event, actor, ref or caller')
            if context.get('deleted') is not False:
                raise ValueError('tag deletion or incomplete event')
            source = context.get('sha', '')
            if not re.fullmatch('[0-9a-f]{40}', source):
                raise ValueError('invalid source commit')
            if source != peeled_tag_sha:
                raise ValueError('tag/source changed or disagree')
            if str(context.get('sender_id', '')) != ACTOR_ID:
                raise ValueError('push sender differs from approved operator')
            return source


        def remote_tag_commit(token):
            import json
            import urllib.request
            base = 'https://api.github.com/repos/Knuckles-Team/epistemic-graph'
            def fetch(path):
                request = urllib.request.Request(base + path, headers={
                    'Authorization': 'Bearer ' + token,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                })
                with urllib.request.urlopen(request, timeout=20) as response:
                    return json.load(response)
            obj = fetch('/git/ref/tags/v2.27.0')['object']
            for _ in range(8):
                sha = obj.get('sha', '')
                if not re.fullmatch('[0-9a-f]{40}', sha):
                    raise ValueError('invalid canonical tag object')
                if obj.get('type') == 'commit':
                    return sha
                if obj.get('type') != 'tag':
                    raise ValueError('unexpected canonical tag object type')
                obj = fetch('/git/tags/' + sha)['object']
            raise ValueError('canonical tag nesting exceeds limit')


        def main():
            import json
            import os
            from pathlib import Path
            context = json.loads(os.environ['RELEASE_CONTEXT'])
            event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
            context.update(deleted=event.get('deleted'), sender_id=event.get('sender', {}).get('id'))
            # Validate event/actor before network I/O, then independently peel canonical tag.
            authorize(context, context['sha'])
            source = authorize(context, remote_tag_commit(os.environ['GH_TOKEN']))
            with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                output.write('source=' + source + '\n')
            print('Approved canonical tag source: ' + source)


        if __name__ == '__main__':
            main()
        PYTHON
  wheel:
    name: wheel linux-x86_64 (trusted tag)
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.source == github.sha && github.repository == 'Knuckles-Team/epistemic-graph'
      && github.repository_id == '1248541673' && github.repository_owner_id == '119072828' && github.event_name == 'push'
      && github.event.deleted == false && github.ref == 'refs/tags/v2.27.0' && github.ref_type == 'tag' && github.workflow_ref
      == 'Knuckles-Team/epistemic-graph/.github/workflows/release.yml@refs/tags/v2.27.0' && github.actor_id == '8661571' &&
      github.triggering_actor == 'Knucklessg1'
    runs-on:
      group: eg-release-recovery
      labels:
      - self-hosted
      - linux
      - x64
      - homelab
    timeout-minutes: 360
    env: &id001
      CARGO_TERM_COLOR: always
      CARGO_NET_RETRY: '10'
      RUST_BACKTRACE: 1
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      MATURIN_FEATURES: full,ast-extended
      EG_WHEEL_TARGET: x86_64-unknown-linux-gnu
      EG_WHEEL_MATURIN_ARGS: ''
      EG_WHEEL_JOBS_ARG: --jobs 2
      EG_WHEEL_MANYLINUX: '2_28'
    steps: &id002
    - name: Recheck canonical tag before self-hosted checkout
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |-
        python3 - <<'PYTHON'
        import os, subprocess
        ref = 'refs/tags/v2.27.0'
        lines = subprocess.check_output(['git', 'ls-remote', '--exit-code', 'https://github.com/Knuckles-Team/epistemic-graph.git', ref, ref + '^{}'], text=True).splitlines()
        refs = {name: sha for sha, name in (line.split() for line in lines)}
        assert len(refs) == len(lines) and set(refs) <= {ref, ref + '^{}'} and ref in refs
        assert refs.get(ref + '^{}', refs[ref]) == os.environ['GITHUB_SHA'], 'Canonical tag moved after authorization'
        PYTHON
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
        repository: Knuckles-Team/epistemic-graph
        ref: ${{ github.sha }}
    - name: Verify exact event source before repository scripts
      shell: bash
      run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Select verified baked release dependencies
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |-
        set -euo pipefail
        eg-piper-image-smoke
        test "$(cat .python-version)" = 3.12
        /opt/python/3.12.14/bin/python3 -m venv "$RUNNER_TEMP/release-python"
        echo "$RUNNER_TEMP/release-python/bin" >> "$GITHUB_PATH"
        channel=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml','rb'))['toolchain']['channel'])")
        case "$channel" in 1.96.0) ;; *) echo 'Tracked Rust pin is not in the reviewed release profile' >&2; exit 1;; esac
        rustup run "$channel" rustc --version
        echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
      if: runner.environment != 'self-hosted'
    - name: Read tracked Rust toolchain pin
      id: rust-toolchain
      shell: bash
      run: python scripts/release_build_metadata.py rust-pin
    - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        targets: x86_64-unknown-linux-gnu
      if: runner.environment != 'self-hosted'
    - name: Bind build time to the source revision
      shell: bash
      run: python scripts/release_build_metadata.py source-time
    - name: Configure identity-neutral Rust source paths
      shell: bash
      run: python scripts/configure_rust_path_remap.py --github-env "$GITHUB_ENV" --target "x86_64-unknown-linux-gnu"
    - name: Build primary wheel (linux-x86_64)
      uses: ./.github/actions/folded-wheel
      with:
        pass: primary
    - name: Remove primary native build state
      if: ${{ github.event_name == 'workflow_dispatch' }}
      shell: bash
      run: python -c "import os,shutil; from pathlib import Path; root=Path(os.environ['RUNNER_TEMP']).resolve(); target=(root/'epistemic-graph-release-target').resolve();
        assert target.parent==root and target.name=='epistemic-graph-release-target'; print('removing' if target.exists()
        else 'already absent:', target); shutil.rmtree(target) if target.exists() else None"
    - name: Build reproduction wheel (linux-x86_64)
      if: ${{ github.event_name == 'workflow_dispatch' }}
      uses: ./.github/actions/folded-wheel
      with:
        pass: reproduction
    - name: Verify reproduction when requested and stage sole candidate
      shell: bash
      run: python scripts/release_build_metadata.py stage --reproduction "${{ github.event_name == 'workflow_dispatch' }}"
    - name: Smoke test (server --help + import epistemic_graph.{numeric,engine})
      shell: bash
      run: bash scripts/release_wheel_smoke.sh
    - name: Upload wheel artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: wheel-linux-x86_64
        path: dist/*.whl
        if-no-files-found: error
    - name: Return container-created files to the runner user (self-hosted)
      if: ${{ always() && runner.environment == 'self-hosted' }}
      shell: bash
      run: docker run --rm -v "$RUNNER_TEMP:/scratch" -v "$GITHUB_WORKSPACE:/work" quay.io/pypa/manylinux_2_28_x86_64 chown
        -R "$(id -u):$(id -g)" /scratch /work
  wheel-hosted:
    name: wheel linux-x86_64 (hosted diagnostic)
    if: github.repository == 'Knuckles-Team/epistemic-graph' && (github.event_name == 'workflow_dispatch' || (github.event_name
      == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v2.27.0'))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env: *id001
    steps: *id002
