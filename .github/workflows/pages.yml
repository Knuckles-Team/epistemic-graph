name: Pages

# Pages deploys on version tags (v*): a tag push refreshes documentation and the
# spec-delivery dashboard. The github-pages environment admits v* tags.
# Keep this outside Release: its workflow-level concurrency queues all jobs,
# including otherwise independent reusable-workflow calls, behind engine CI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Serialize only Pages deployments; finish the active deploy and retain the
# latest pending revision.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pages:
    name: Deploy GitHub Pages
    # Deploy on version tags or manual dispatch; the github-pages environment
    # admits v* tags.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@main
    with:
      content_source: docs
      shared_theme_enabled: true
      spec_dashboard_enabled: true
    permissions:
      contents: write
      pages: write
      id-token: write
