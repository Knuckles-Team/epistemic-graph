name: Recover 2.27.0 publication

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after independent review and verified PyPI quota approval
        type: boolean
        default: false
      verified_quota_mib:
        description: Operator-verified PyPI project file limit (zero keeps uploads blocked)
        type: number
        default: 0
      quota_evidence:
        description: PyPI support issue 12510 approval comment URL, verified by operator
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: epistemic-graph-2.27.0-publication
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository_id == '1248541673'
      && github.repository_owner_id == '119072828'
      && github.repository == 'Knuckles-Team/epistemic-graph'
      && github.ref == 'refs/heads/main'
      && github.actor_id == '8661571'
      && github.actor == github.triggering_actor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 7f5179650d87e6f763b129cfeea6dfb4f8b0273b
      PIPELINES_CONTRACT_COMMIT: 4f80a968dbf09b1f4d35bbff11b77f9e2fcd3ef6
    steps:
      - name: Checkout reviewed continuation code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify source-run evidence and download exact three artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_publication_recovery.py prepare
      - name: Checkout frozen wheel source for existing completeness proof
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7f5179650d87e6f763b129cfeea6dfb4f8b0273b
          path: .frozen-source
          persist-credentials: false
      - name: Set up the release-pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .frozen-source/.python-version
      - name: Install pinned publication tooling
        run: python -m pip install 'twine==7.0.0'
      - name: Require complete folded wheels
        run: python .frozen-source/scripts/check_wheel_completeness.py --require-engine-kernel dist/*.whl
      - name: Checkout immutable central publication checks
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Knuckles-Team/pipelines
          ref: 4f80a968dbf09b1f4d35bbff11b77f9e2fcd3ef6
          path: .frozen-source/.pipeline-contract
          persist-credentials: false
      - name: Freeze exact PyPI identity and reject collisions
        working-directory: .frozen-source
        run: >-
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py preflight
          --directory ../dist --package epistemic-graph --version 2.27.0
          --manifest "$RUNNER_TEMP/publication.json"
      - name: Require operator-verified quota approval before upload
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          QUOTA_MIB: ${{ inputs.verified_quota_mib }}
          QUOTA_EVIDENCE: ${{ inputs.quota_evidence }}
        run: >-
          python scripts/release_publication_recovery.py quota
          --quota-mib "$QUOTA_MIB" --quota-evidence "$QUOTA_EVIDENCE"
      - name: Recheck frozen tag and bytes immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_publication_recovery.py recheck
      - name: Upload only missing matching files
        working-directory: .frozen-source
        if: inputs.publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: '1'
        run: |
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py missing \
            --directory ../dist --package epistemic-graph --version 2.27.0 \
            --manifest "$RUNNER_TEMP/publication.json" > "$RUNNER_TEMP/missing.json"
          python - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          names = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'missing.json').read_text())
          if names:
              subprocess.run([sys.executable, '-m', 'twine', 'upload', *[str(pathlib.Path('../dist') / name) for name in names]], check=True)
          PYTHON
      - name: Verify all published filenames and digests
        working-directory: .frozen-source
        if: inputs.publish
        run: >-
          python -I .pipeline-contract/.github/actions/wheel-readiness/publication.py postverify
          --directory ../dist --package epistemic-graph --version 2.27.0
          --manifest "$RUNNER_TEMP/publication.json"
      - name: Retain continuation provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-recovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence.json
            quota-approval.json
            scripts/release_publication_recovery.json
            ${{ runner.temp }}/publication.json
          if-no-files-found: error
