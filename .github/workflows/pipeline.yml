name: Build|Upload|Release Python Package

on:
  push:
    branches:
      - 'main'

jobs:
  # epistemic-graph ships as a maturin wheel (the epistemic-graph-server binary +
  # pure-Python client). It is consumed via pip (by agent-utilities / the gateway
  # image), not run as its own container, so there is no publish-docker job.
  publish-pypi:
    uses: Knuckles-Team/pipelines/.github/workflows/maturin_pipeline.yml@main
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
