name: Release Build (wheels + multi-arch image)

# Cross-platform native build matrix for epistemic-graph (CONCEPT:OS-5.64).
#
# BUILDS native `epistemic-graph-server` wheels for every supported
# platform×arch, plus a multi-arch Docker DB image — and smoke-tests each leg
# (`epistemic-graph-server --help`). Runs on every push/PR and on tags.
#
# The multi-arch Docker DB image INSTALLS THE `node`-tier WHEEL BUILT IN THIS SAME RUN
# (the `wheel-linux-*` artifacts, selected per-arch by the Dockerfile) via `uv` — no
# cargo compile in the image AND no PyPI round-trip. It therefore depends only on the
# `wheels` job, NOT on `publish-pypi`, so a broken/late PyPI publish can no longer break
# the image build. It is still tag-gated: `docker-image` (build + in-image `--help`
# smoke) and `publish-image` (push) both run on a `v*` tag only.
#
# PUBLISHING IS GATED. The PyPI upload, the image build, and the DockerHub/registry
# push only run on a tag (release) AND carry an explicit `if:` guard, so a normal
# branch push (including this one) BUILDS + SMOKE-TESTS the wheels but never
# publishes and never builds the image. Push a `v*` tag to trigger the full release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Default wheel tier (the `node` auto-bundled engine). The pi-lean recipe is the
  # separate `wheels-pi` leg below.
  MATURIN_FEATURES: "node,ast-extended"

jobs:
  # ── Native wheels: linux x86_64 + aarch64, macOS x86_64 + arm64, windows x86_64
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Native + cross wheels via maturin-action (uses zig/cross for linux-aarch64,
      # so no manual cross-linker setup is needed in CI).
      - name: Build wheel (${{ matrix.name }})
        uses: PyO3/maturin-action@v1
        continue-on-error: ${{ matrix.experimental == true }}
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist
            --no-default-features
            --features ${{ env.MATURIN_FEATURES }}
            ${{ matrix.maturin_args }}
          # zig gives reproducible glibc-pinned linux cross-builds.
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'true'

      # Smoke test: install the wheel and run the server `--help`. Skipped for the
      # cross-only legs (linux-aarch64 on x86 host, windows-arm64) where the binary
      # can't execute on the runner.
      - name: Smoke test (epistemic-graph-server --help)
        if: ${{ matrix.name != 'linux-aarch64' && matrix.experimental != true }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          epistemic-graph-server --help

      - name: Upload wheel artifact
        if: ${{ matrix.experimental != true }}
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  # ── Leaner Raspberry-Pi tier wheels (no DataFusion / openraft — the Pi contract).
  #    Two legs: the ultra-lean `pi` and the pure-Rust maximal `pi-max` (pi + tsdb +
  #    blob + security; still NO DataFusion / Tantivy / openraft / C-toolchain dep).
  wheels-pi:
    name: wheel linux-aarch64-${{ matrix.tier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [pi, pi-max]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Pi-tier wheel (${{ matrix.tier }})
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          manylinux: '2_28'
          # --profile release-tiny = size-optimized (opt-level z, fat LTO, strip);
          # maturin forwards it to cargo. --no-default-features so only the tier
          # bundle is selected (the [tool.maturin] default must NOT union on top).
          args: >-
            --out dist
            --profile release-tiny
            --no-default-features
            --features ${{ matrix.tier }},ast-extended
          sccache: 'true'
      - name: Upload Pi wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-aarch64-${{ matrix.tier }}
          path: dist/*.whl

  # ── "Contains-all smallest" wheels: the `full` tier built with the size-optimized
  #    release-tiny profile, linux x86_64 + aarch64. A single binary with every
  #    single-node feature (query/cypher/graphql/redb/ann/tsdb/blob/text/sparql/rdf/
  #    owl/streaming/wasm-udf/security/federation/result-cache/cold-tier/cost), built
  #    smallest. Cross-built in CI so the target host never compiles the C deps.
  wheels-full-tiny:
    name: wheel ${{ matrix.name }}-full-tiny
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build contains-all (full) size-optimized wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: >-
            --out dist
            --profile release-tiny
            --no-default-features
            --features full,ast-extended
          sccache: 'true'
      - name: Upload full-tiny wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}-full-tiny
          path: dist/*.whl

  # ── sdist (source distribution) for pip fallback builds
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── eg-numeric Surface-A kernel wheels (CONCEPT:EG-346 wheel / EG-351 publish leg).
  #    The slim, BLAS/LAPACK-free numeric kernel (`crates/eg-numeric`, pyo3 feature
  #    `python` → the `epistemic_graph.numeric` extension) shipped as its OWN wheel so
  #    downstreams (agent-utilities' `numeric.xp` shim) can HARD-DEPEND on the kernel and
  #    fully drop numpy — the one blocker to the numpy-drop. Built for linux x86_64 +
  #    aarch64 and uploaded as `wheel-numeric-*` so the tag-gated `publish-pypi` leg ships
  #    it to PyPI ALONGSIDE `epistemic-graph`. This is a SEPARATE maturin target from the
  #    main `bindings="bin"` server wheel (it is a pyo3 cdylib), so the Pi/no-pyo3 contract
  #    on the engine is untouched. PUBLISHING stays tag-gated (see publish-pypi's `if:`).
  wheels-numeric:
    name: wheel eg-numeric ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The aarch64 leg cross-builds a pyo3 EXTENSION (harder than the bin-only engine
    # wheel) and is best-effort: if it fails, publish-pypi still ships the x86_64 wheel
    # + the always-working sdist-numeric (arm installs build eg-numeric from source).
    # So a flaky aarch64 pyo3 cross-build never blocks the release.
    continue-on-error: ${{ matrix.name == 'linux-aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # zig gives reproducible glibc-pinned linux cross-builds (linux-aarch64 on an x86
      # host). The pyo3 `python` feature is the ONLY feature this wheel needs.
      - name: Build eg-numeric wheel (${{ matrix.name }})
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          args: >-
            --release
            --out dist
            -m crates/eg-numeric/Cargo.toml
            --features python
          sccache: 'true'
      - name: Upload eg-numeric wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-numeric-${{ matrix.name }}
          path: dist/*.whl

  # ── eg-numeric sdist (pip fallback for platforms without a prebuilt wheel).
  sdist-numeric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/eg-numeric/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-numeric
          path: dist/*.tar.gz

  # ── Multi-arch Docker DB image (BUILD + in-image `--help` smoke; no push).
  #    The image INSTALLS THE `node`-tier WHEEL BUILT IN THIS SAME RUN (downloaded
  #    from the `wheel-linux-*` artifacts into docker/wheels/, selected per-arch by the
  #    Dockerfile) — NO PyPI round-trip — so it depends only on `wheels`, NOT on
  #    publish-pypi. The Dockerfile's in-build `epistemic-graph-server --help` is the
  #    smoke (runs per-arch under QEMU).
  docker-image:
    # Runs AFTER publish-pypi so the image installs the JUST-PUBLISHED wheel FROM PyPI
    # (CI dependency order: wheels → publish-pypi → docker-image → publish-image).
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    # GATE: tag push only (keeps CI cost down; the wheels themselves build on every push).
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Derive package version from tag
        run: echo "EG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # BUILD multi-arch (amd64+arm64) installing the JUST-PUBLISHED wheel FROM PyPI —
      # this job needs publish-pypi, so `epistemic-graph==$EG_VERSION` is already live on
      # the index; the Dockerfile's `uv pip install "$EG_INSTALL_SPEC"` pulls it (no local
      # wheel in the context ⇒ the PyPI path). load=false = build + in-image `--help` smoke
      # only; the push step below pushes.
      - name: Build multi-arch image (install published wheel from PyPI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            EG_VERSION=${{ env.EG_VERSION }}
            EG_INSTALL_SPEC=epistemic-graph==${{ env.EG_VERSION }}
          tags: epistemic-graph:ci

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH JOBS — GATED. These only run on a `v*` tag (a release). On a normal
  # branch push or PR they are SKIPPED entirely by the `if:` guard, so nothing is
  # published by this push.
  # ─────────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish wheels to PyPI (release only)
    # eg-numeric (wheels-numeric + sdist-numeric) publishes ALONGSIDE epistemic-graph so a
    # `v*` tag ships both distributions in one release (CONCEPT:EG-351).
    needs: [wheels, wheels-pi, wheels-full-tiny, sdist, wheels-numeric, sdist-numeric]
    runs-on: ubuntu-latest
    # GATE: tag push only. A branch push / PR does NOT publish.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      # The `wheel-*` glob also picks up the `wheel-numeric-*` artifacts, so both the
      # epistemic-graph and eg-numeric wheels land in dist/ for the single publish.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist-numeric
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Token-based upload — the SAME mechanism the rest of the fleet publishes with
      # (agents/*, agent-webui) via the org `PYPI_API_TOKEN`. ONE robust upload of
      # EVERYTHING in dist/ (epistemic-graph AND eg-numeric, every wheel + sdist),
      # matching agent-webui's `twine upload dist/*`. A single `dist/*` avoids the
      # previous failure mode where a per-name glob (`dist/epistemic_graph-*`) combined
      # with `--skip-existing` could silently no-op if a dist was mis-named/mis-versioned
      # and the step would still pass green having published nothing.
      - name: Publish to PyPI (token)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          echo "Distributions to upload:"
          ls -1 dist/
          twine upload --skip-existing --verbose dist/*

      # HONEST VERIFICATION — CI must go RED if the release did NOT actually land on
      # PyPI. `--skip-existing` (and any token-scope / name mismatch) can make the
      # upload step pass without publishing the tag version; this step asserts the
      # exact tag version is now queryable on PyPI, retrying for CDN propagation lag.
      # VER is derived from the tag (`vX.Y.Z` -> `X.Y.Z`); it MUST equal the built
      # wheel/sdist version (Cargo.toml, sourced via pyproject `dynamic = ["version"]`).
      # If epistemic-graph is owned by a different PyPI account than PYPI_API_TOKEN,
      # the upload is skipped/denied and THIS step fails loudly (correct) — the token
      # must be granted maintainer access to the `epistemic-graph` project.
      - name: Verify epistemic-graph ${{ github.ref_name }} is published on PyPI
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Asserting epistemic-graph==${VER} is live on PyPI…"
          url="https://pypi.org/pypi/epistemic-graph/${VER}/json"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: epistemic-graph ${VER} is published (PyPI returned 200)."
              exit 0
            fi
            echo "Attempt ${i}: PyPI returned HTTP ${code} for ${VER} — retrying in 20s (CDN lag)…"
            sleep 20
          done
          echo "::error::epistemic-graph ${VER} did NOT publish to PyPI (never returned 200)."
          echo "::error::The upload was a no-op (already-existing/mis-versioned dist) OR the PYPI_API_TOKEN"
          echo "::error::lacks maintainer rights on the 'epistemic-graph' project. Grant the token access"
          echo "::error::to that PyPI project, or fix the built version, then re-run this release."
          exit 1

  publish-image:
    name: Push multi-arch image (release only)
    # Needs docker-image (the build+smoke gate). Like docker-image, the pushed image
    # installs the wheel built in THIS run (from docker/wheels/), NOT a PyPI package.
    needs: [docker-image]
    runs-on: ubuntu-latest
    # GATE: tag push only. A branch push / PR does NOT push the image.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Derive package version from tag
        run: echo "EG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # Pull the same node-tier wheels into the context so the pushed image is built
      # from the CI artifact (no PyPI round-trip), matching docker-image.
      - name: Download node-tier wheel (amd64)
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: docker/wheels
      - name: Download node-tier wheel (arm64)
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-aarch64
          path: docker/wheels
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EG_VERSION=${{ env.EG_VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/epistemic-graph:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/epistemic-graph:${{ github.ref_name }}
