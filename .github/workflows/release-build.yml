name: Release Build (wheels + multi-arch image)

# Cross-platform native build matrix for epistemic-graph (CONCEPT:OS-5.64 / EG-359).
#
# BUILDS ONE native `epistemic-graph-server` wheel per platform×arch — the SINGLE
# main full-featured build (CONCEPT:EG-359: `default` == `full`) — plus a multi-arch
# Docker DB image, and smoke-tests each leg (`epistemic-graph-server --help`). Runs on
# every push/PR and on tags. There are no longer any pi/pi-max/node/full-tiny tier legs:
# the tiers were collapsed into one main build, which also removes the old wheel-filename
# collision (every tier shared `epistemic_graph-<ver>-py3-none-<platform>`, so only one
# could publish). ONE tier ⇒ ONE wheel ⇒ it publishes cleanly.
#
# The multi-arch Docker DB image INSTALLS THE MAIN WHEEL BUILT IN THIS SAME RUN
# (the `wheel-linux-*` artifacts, selected per-arch by the Dockerfile) via `uv` — no
# cargo compile in the image AND no PyPI round-trip. It therefore depends only on the
# `wheels` job, NOT on `publish-pypi`, so a broken/late PyPI publish can no longer break
# the image build. It is still tag-gated: `docker-image` (build + in-image `--help`
# smoke) and `publish-image` (push) both run on a `v*` tag only.
#
# PUBLISHING IS GATED. The PyPI upload, the image build, and the DockerHub/registry
# push only run on a tag (release) AND carry an explicit `if:` guard, so a normal
# branch push (including this one) BUILDS + SMOKE-TESTS the wheels but never
# publishes and never builds the image. Push a `v*` tag to trigger the full release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The ONE main build (CONCEPT:EG-359): `full` = all MAIN features that build without an
  # external GPU/robotics toolchain, plus `ast-extended` for the complete code-parsing
  # grammar tier. `cluster` (raft HA) and `full-extras` (GPU/ROS2) are opt-in build layers,
  # NOT published wheels.
  MATURIN_FEATURES: "full,ast-extended"

jobs:
  # ── The ONE main wheel (CONCEPT:EG-359): linux x86_64 + aarch64, the full-featured
  #    `default`/`full` build. ONE tier ⇒ ONE wheel per platform (no more per-tier legs).
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            maturin_args: ""   # manylinux is set via the action's `manylinux:` input below — do NOT also pass --manylinux here (maturin rejects two platform tags)
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Native + cross wheels via maturin-action (uses zig/cross for linux-aarch64,
      # so no manual cross-linker setup is needed in CI).
      - name: Build wheel (${{ matrix.name }})
        uses: PyO3/maturin-action@v1
        continue-on-error: ${{ matrix.experimental == true }}
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist
            --no-default-features
            --features ${{ env.MATURIN_FEATURES }}
            ${{ matrix.maturin_args }}
          # zig gives reproducible glibc-pinned linux cross-builds.
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'true'

      # ── Fold the eg-numeric Surface-A kernel INTO this same wheel (CONCEPT:EG-346).
      #    Build the pyo3 cdylib kernel (`crates/eg-numeric --features python`) for the
      #    SAME target, then inject its compiled `.so` into the server wheel as
      #    `epistemic_graph/numeric.abi3.so`. Result: ONE published `epistemic-graph`
      #    wheel that ships BOTH the server binary AND the numeric kernel — no separate
      #    `eg-numeric` package on PyPI. The kernel is a distinct maturin target (a pyo3
      #    cdylib), so the engine binary's no-pyo3 / Pi contract is untouched.
      - name: Build eg-numeric kernel (same target)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out numdist
            -m crates/eg-numeric/Cargo.toml
            --features python
          manylinux: ${{ startsWith(matrix.target, 'x86_64-unknown-linux') && '2_28' || (startsWith(matrix.target, 'aarch64-unknown-linux') && '2_28' || 'auto') }}
          sccache: 'true'

      - name: Fold numeric kernel into the epistemic-graph wheel
        shell: bash
        run: |
          python scripts/inject_numeric_kernel.py "$(ls dist/epistemic_graph-*.whl)" "$(ls numdist/*.whl)"

      # Smoke test: install the wheel, run the server `--help`, AND prove the folded-in
      # kernel imports AND computes (`epistemic_graph.numeric`). Skipped for the
      # cross-only leg (linux-aarch64 on an x86 host) where the binary can't execute on
      # the runner. Two independent regressions this asserts (both were real):
      #   1) the server console binary must stay EXECUTABLE — the numeric inject repacks
      #      the wheel zip and MUST preserve the 0755 mode on
      #      `*.data/scripts/epistemic-graph-server`; dropping the exec bit made pip
      #      install a non-runnable binary that died with "Permission denied".
      #   2) the folded-in kernel must import AND compute from the INSTALLED wheel.
      - name: Smoke test (server --help + import epistemic_graph.numeric + compute)
        if: ${{ matrix.name != 'linux-aarch64' && matrix.experimental != true }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install the folded wheel WITH the `numeric` extra so numpy is present for the
          # kernel's zero-copy interop — lets the smoke assert a REAL compute, not just an
          # import. (pip supports the `<wheel>[extra]` spec.)
          pip install "$(ls dist/epistemic_graph-*.whl)[numeric]"
          # (1) The binary must be executable (inject must preserve 0755) — fails loud
          #     with "Permission denied" otherwise.
          epistemic-graph-server --help
          # (2) Import + compute the kernel FROM THE INSTALLED WHEEL. Run from a neutral
          #     dir ($RUNNER_TEMP) — the repo checkout root holds the `epistemic_graph/`
          #     SOURCE package (no compiled `.so`), and cwd is on sys.path for `python -c`,
          #     so importing at the repo root would shadow the wheel and always fail.
          cd "${RUNNER_TEMP:-/tmp}"
          python -c "import numpy as np, epistemic_graph.numeric as n; a=np.array([1.,2.,3.,4.]); assert n.sum(a)==10.0 and n.mean(a)==2.5, (n.sum(a), n.mean(a)); print('numeric kernel OK:', n.__file__, '| sum=', n.sum(a), 'mean=', n.mean(a), 'std=', n.std(a))"

      - name: Upload wheel artifact
        if: ${{ matrix.experimental != true }}
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  # NOTE (CONCEPT:EG-359): the old pi/pi-max tier wheels (`wheels-pi`) and the
  # size-optimized "contains-all" tier wheels (`wheels-full-tiny`) are GONE. Those legs
  # existed only because the deployment tiers produced DIFFERENT binaries that all shared
  # the SAME wheel filename (`epistemic_graph-<ver>-py3-none-<platform>`), so only one
  # could ever publish. The tiers are collapsed into ONE main build (the `wheels` job
  # above), which is what publishes — no more per-tier legs, no more filename collision.

  # ── sdist (source distribution) for pip fallback builds
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # NOTE: the eg-numeric kernel is NO LONGER a separately-published package. Its
  # Surface-A pyo3 `.so` is FOLDED INTO the `epistemic-graph` main wheel in the
  # `wheels` job above (see "Fold the eg-numeric Surface-A kernel INTO this same
  # wheel"), so `pip install epistemic-graph[numeric]` provides
  # `epistemic_graph.numeric` from ONE published package. The old `wheels-numeric` +
  # `sdist-numeric` publish legs (and their re-upload of a fixed `eg-numeric==0.1.0`
  # that aborted the whole `twine upload` batch) are removed. The EG-346 numeric-parity
  # CI gate still builds/imports the kernel from the crate in `rust-ci.yml` — that
  # doesn't publish.

  # ── Multi-arch Docker DB image (BUILD + in-image `--help` smoke; no push).
  #    The image INSTALLS THE MAIN WHEEL BUILT IN THIS SAME RUN (downloaded
  #    from the `wheel-linux-*` artifacts into docker/wheels/, selected per-arch by the
  #    Dockerfile) — NO PyPI round-trip — so it depends only on `wheels`, NOT on
  #    publish-pypi. The Dockerfile's in-build `epistemic-graph-server --help` is the
  #    smoke (runs per-arch under QEMU).
  docker-image:
    # Runs AFTER publish-pypi so the image installs the JUST-PUBLISHED wheel FROM PyPI
    # (CI dependency order: wheels → publish-pypi → docker-image → publish-image).
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    # GATE: tag push only (keeps CI cost down; the wheels themselves build on every push).
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Derive package version from tag
        run: echo "EG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # BUILD multi-arch (amd64+arm64) installing the JUST-PUBLISHED wheel FROM PyPI —
      # this job needs publish-pypi, so `epistemic-graph==$EG_VERSION` is already live on
      # the index; the Dockerfile's `uv pip install "$EG_INSTALL_SPEC"` pulls it (no local
      # wheel in the context ⇒ the PyPI path). load=false = build + in-image `--help` smoke
      # only; the push step below pushes.
      - name: Build multi-arch image (install published wheel from PyPI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            EG_VERSION=${{ env.EG_VERSION }}
            EG_INSTALL_SPEC=epistemic-graph==${{ env.EG_VERSION }}
          tags: epistemic-graph:ci

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH JOBS — GATED. These only run on a `v*` tag (a release). On a normal
  # branch push or PR they are SKIPPED entirely by the `if:` guard, so nothing is
  # published by this push.
  # ─────────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish wheels to PyPI (release only)
    # ONE published package (CONCEPT:EG-359): the single main `epistemic-graph` wheel per
    # platform (x86_64 + aarch64, carrying the folded-in numeric kernel) + the sdist. Now
    # that the pi/pi-max/node/full-tiny tier legs are gone, there is exactly ONE wheel per
    # platform — the old wheel-filename collision (every tier shared
    # `epistemic_graph-<ver>-py3-none-<platform>`, so only one could publish) is moot. The
    # old `eg-numeric` publish legs are also gone — their re-upload of an existing
    # `eg-numeric==0.1.0` used to abort the whole `twine upload dist/*` batch.
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # GATE: tag push only. A branch push / PR does NOT publish.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
    steps:
      # Download the main wheels (x86_64 + aarch64) — they carry the folded numeric
      # kernel. With the tiers collapsed there is exactly ONE wheel per platform, so
      # there is no longer any filename-shadowing risk between tier wheels.
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-aarch64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Token-based upload — the SAME mechanism the rest of the fleet publishes with
      # (agents/*, agent-webui) via the org `PYPI_API_TOKEN`. ONE robust upload of
      # EVERYTHING in dist/ (every epistemic-graph wheel + sdist), matching
      # agent-webui's `twine upload dist/*`. A single `dist/*` avoids the previous
      # failure mode where a per-name glob (`dist/epistemic_graph-*`) combined with
      # `--skip-existing` could silently no-op if a dist was mis-named/mis-versioned
      # and the step would still pass green having published nothing.
      - name: Publish to PyPI (token)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          echo "Distributions to upload:"
          ls -1 dist/
          twine upload --skip-existing --verbose dist/*

      # HONEST VERIFICATION — CI must go RED if the release did NOT actually land on
      # PyPI. `--skip-existing` (and any token-scope / name mismatch) can make the
      # upload step pass without publishing the tag version; this step asserts the
      # exact tag version is now queryable on PyPI, retrying for CDN propagation lag.
      # VER is derived from the tag (`vX.Y.Z` -> `X.Y.Z`); it MUST equal the built
      # wheel/sdist version (Cargo.toml, sourced via pyproject `dynamic = ["version"]`).
      # If epistemic-graph is owned by a different PyPI account than PYPI_API_TOKEN,
      # the upload is skipped/denied and THIS step fails loudly (correct) — the token
      # must be granted maintainer access to the `epistemic-graph` project.
      - name: Verify epistemic-graph ${{ github.ref_name }} is published on PyPI
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "Asserting epistemic-graph==${VER} is live on PyPI…"
          url="https://pypi.org/pypi/epistemic-graph/${VER}/json"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: epistemic-graph ${VER} is published (PyPI returned 200)."
              exit 0
            fi
            echo "Attempt ${i}: PyPI returned HTTP ${code} for ${VER} — retrying in 20s (CDN lag)…"
            sleep 20
          done
          echo "::error::epistemic-graph ${VER} did NOT publish to PyPI (never returned 200)."
          echo "::error::The upload was a no-op (already-existing/mis-versioned dist) OR the PYPI_API_TOKEN"
          echo "::error::lacks maintainer rights on the 'epistemic-graph' project. Grant the token access"
          echo "::error::to that PyPI project, or fix the built version, then re-run this release."
          exit 1

  publish-image:
    name: Push multi-arch image (release only)
    # Needs docker-image (the build+smoke gate). Like docker-image, the pushed image
    # installs the wheel built in THIS run (from docker/wheels/), NOT a PyPI package.
    needs: [docker-image]
    runs-on: ubuntu-latest
    # GATE: tag push only. A branch push / PR does NOT push the image.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Derive package version from tag
        run: echo "EG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # Pull the same main wheels into the context so the pushed image is built
      # from the CI artifact (no PyPI round-trip), matching docker-image.
      - name: Download main wheel (amd64)
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: docker/wheels
      - name: Download main wheel (arm64)
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-aarch64
          path: docker/wheels
      # Org-standard registry auth — the SAME secrets the reusable
      # pipelines/.github/workflows/container_pipeline.yml (and images/*) use across
      # the fleet: DOCKER_REGISTRY / DOCKER_USERNAME / DOCKER_PASSWORD. (Do NOT use
      # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN — those are unset in this org.)
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EG_VERSION=${{ env.EG_VERSION }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/epistemic-graph:latest
            ${{ secrets.DOCKER_USERNAME }}/epistemic-graph:${{ github.ref_name }}
