[bumpversion]
current_version = 2.27.5
commit = True
tag = True

[bumpversion:file:Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:Cargo.lock]
search = name = "epistemic-graph"
	version = "{current_version}"
replace = name = "epistemic-graph"
	version = "{new_version}"

[bumpversion:file(eg-pyengine):Cargo.lock]
search = name = "eg-pyengine"
	version = "{current_version}"
replace = name = "eg-pyengine"
	version = "{new_version}"

# The public wheel is built from the eg-pyengine crate, so its version is the release
# version (maturin reads the dynamic wheel version from that manifest).
[bumpversion:file:crates/eg-pyengine/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = version-{current_version}-blue
replace = version-{new_version}-blue

[bumpversion:file:docker/Dockerfile]
search = ARG EGS_VERSION={current_version}
replace = ARG EGS_VERSION={new_version}

[bumpversion:file:pyproject.toml]
search = "epistemic-graph-server=={current_version}"
replace = "epistemic-graph-server=={new_version}"

[bumpversion:file:packaging/epistemic-graph-server/pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:packaging/epistemic-graph-server/epistemic_graph_server/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
