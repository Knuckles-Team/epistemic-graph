reason = """The RF-ADR-008 constructor shape, on the two record types whose fields the
2.27.x contract wave grew enough to cross dupehound's similarity floor:
draft.validate() -> revision==0 refusal -> update-before-create refusal ->
definition_digest(&draft) -> struct literal copying every draft field across.
Every one of the four layers (agent_component, agent_graph, agent_template,
agent_library) has its own `create`, deliberately: the draft types
(AgentComponentDraft vs AgentLibraryEntryDraft) share no field, the error text
names the record ("agent component"/"agent library"), and the struct literal
enumerates each layer's OWN fields (agent_component's now includes
declared_capabilities/required_capabilities/declared_required_capabilities,
which agent_library has no equivalent of). A shared helper would need a noun
parameter, a draft trait spanning two unrelated field sets, and a generic
struct-literal builder for records that intentionally do not share a schema --
