[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "epistemic-graph"
version = "1.0.0"
description = "Rust-based epistemic graph engine for agent-utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[[project.authors]]
name = "Audel Rouhi"
email = "knucklessg1@gmail.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.1.0",
]
owl = [
    "pyoxigraph>=0.3.22",
]
quant = [
    "numpy>=1.22.0",
]
finance = []
ast = []
datascience = []
reasoning = []
server = []
full = []
all = [
    "epistemic-graph[test,owl,quant,finance,ast,datascience,reasoning,server,full]",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B" ]
ignore = [ "E402", "E501", "B008" ]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.vulture]
exclude = [".venv", "venv", "build", "dist", "target"]
min_confidence = 95

[tool.maturin]
python-source = "."
bindings = "bin"
strip = true
# DEFAULT WHEEL = the `node` tier bundle (CONCEPT:KG-2.223 — the auto-bundled
# engine). The shipped binary is a MAX-FUNCTIONALITY single-process tiny DB:
# durable redb-authoritative store + cypher + SQL (query/DataFusion) + ann + tsdb +
# blob + the full compute domains (finance/datascience/reasoning/ast). It also adds
# `ast-extended` so the `ParseFiles`/`ParseFile` ops compile the full grammar tier
# (python/js/ts/go/rust/java/c/cpp/c#/ruby/php/bash/scala/lua) — making the engine
# the ONE code-parsing implementation (agent-utilities delegates and ships no Python
# tree-sitter wheels). NOTE: the previous default `["server", "ast-extended"]`
# OMITTED redb/cypher/ann/etc., so the shipped binary was NOT a usable tiny DB —
# `node` fixes that. `node` stays SINGLE-NODE (no raft/pgwire); those are the
# `cluster` tier and are built explicitly (see the Pi recipe note below).
features = ["node", "ast-extended"]

# ── Building a leaner Pi-3 tier wheel ──
# The `node` default carries SQL/DataFusion + tsdb + blob + the compute domains —
# great for a workstation/server, heavier than a Raspberry-Pi-3 wants. For the Pi
# tier, build a lean wheel from the `pi` bundle (graph + algorithms + redb + cypher
# + ann — durable, native RDF/SPARQL once Lane-W lands, NO DataFusion / Tantivy /
# openraft, the Pi contract):
#
#     maturin build --release --no-default-features --features pi,ast-extended
#
# (Drop `ast-extended` for the very leanest build with no tree-sitter grammars.)
# `--no-default-features` is required so maturin does NOT union `node` on top of
# `pi` via the `[tool.maturin] features` default above — the pi recipe must be the
# ONLY feature set selected, or the resulting wheel would re-link DataFusion and
# break the Pi contract.
#
# ── Size-optimized "contains-all smallest" + pi-max wheels ──
# maturin forwards `--profile` to cargo, so build the size-optimized binary (the
# `[profile.release-tiny]` in Cargo.toml: opt-level z + fat LTO + strip, panic=unwind)
# with `--profile release-tiny`. The Pi never compiles — CI cross-builds these wheels
# (`.github/workflows/release-build.yml`: `wheels-full-tiny`, `wheels-pi` matrix).
#
#   # contains-all smallest (every single-node feature, smallest binary)
#   maturin build --profile release-tiny --no-default-features --features full,ast-extended
#   # Pi-3 maximal: pure-Rust, NO DataFusion / Tantivy / C (pi + tsdb + blob + security)
#   maturin build --profile release-tiny --no-default-features --features pi-max,ast-extended
