[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "epistemic-graph"
# Version is DYNAMIC — sourced from Cargo.toml `[package].version` by maturin so the
# built wheel/sdist ALWAYS matches the release tag (which bumps Cargo.toml). A static
# value here silently WON over Cargo.toml and shipped mis-versioned dists: e.g. a
# v2.6.0 tag built `epistemic_graph-2.2.0` (already on PyPI) which `twine
# --skip-existing` swallowed as a no-op — a green publish that published nothing.
dynamic = ["version"]
description = "Rust-native durable multimodal and epistemic database with governed analytics and program optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.2.1",
    # RF-RULING-003: `epistemic_graph/generated/*` (imported at module scope by
    # `client.py`, which `__init__.py` imports) declares its request models with
    # pydantic v2. It is a HARD runtime dependency of the wheel, not an extra --
    # `import epistemic_graph` fails without it. v2 is what agent-utilities already
    # standardises on, so a consumer resolves one model layer, not two.
    "pydantic>=2,<3",
    # numeric is a NATIVE core primitive, NOT an extra (CONCEPT:EG-346): the compiled
    # pure-Rust faer/ndarray kernel ships as always-bundled package data
    # (`epistemic_graph/numeric.abi3.so`). It has no Python package dependency; the
    # wheel gate and release smoke test prove the bundled native module is callable
    # without resolving an interpreter-side numeric implementation.
    # FULL-BY-DEFAULT (CONCEPT:EG-346, 2026-07-25): the UNIFIED binary is the default install
    # — `pip install epistemic-graph` (NO extra tag) ships the complete engine. OWL/SPARQL
    # (pyoxigraph) and the LMCache HTTP driver (httpx) join numeric in the base so `[full]` is
    # no longer needed to get the whole engine. A slimmer serving consumer still chooses what
    # to import; nothing here forces a heavy ML/torch/native-AVX wheel onto the base.
    "pyoxigraph>=0.3.22",
    "httpx>=0.24.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@example.invalid"

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.1.0",
    # BUG-045: tests/test_build_backend.py execs build_backend.py directly (outside
    # PEP 517 build isolation), which `import maturin`s at module scope -- the
    # `[build-system].requires` pin above only guarantees maturin during an
    # isolated build, not a normal `pytest` run. tests/test_release_full_wheel_
    # contract.py separately `import yaml`s. Neither was reachable from the `test`
    # extra, so a plain `pip install -e .[test]` / `uv sync --extra test` failed
    # collection on both files with ModuleNotFoundError before a single test ran.
    "maturin>=1.0,<2.0",
    "pyyaml>=6.0.3",
]
owl = [
    "pyoxigraph>=0.3.22",
]
finance = []
quant = []
ast = []
datascience = []
reasoning = []
server = []
# `full` is now a NO-OP ALIAS (2026-07-25): the unified binary is full-by-DEFAULT, so its
# Python deps (pyoxigraph for owl and httpx for lmcache) live in the base
# `dependencies`. `pip install epistemic-graph` (no tag) is now the complete engine;
# `[full]` is retained only so existing installs/refs keep resolving.
full = []
# CONCEPT:EG-337 — the Python LMCache/vLLM remote-backend driver for the EG-187
# KV-cache endpoint (`epistemic_graph.kvcache`). The driver itself imports with
# STDLIB ONLY (urllib), so this extra only pulls the optional httpx acceleration
# (pooled keep-alive on the inference hot path). `pip install epistemic-graph[lmcache]`.
lmcache = [
    "httpx>=0.24.0",
]
# CONCEPT:EG-346 — numeric is NATIVE; this extra is retained as a NO-OP alias so existing
# `epistemic-graph[numeric]`/`[full]` installs and the `all` aggregate keep resolving. The
# compiled faer/ndarray kernel remains always-bundled as package data
# `epistemic_graph/numeric.abi3.so` (pure-Rust, BLAS/LAPACK-free) and does not add a
# Python numeric dependency.
numeric = []
# W4.8 (CONCEPT:EG-317) — TEST-ONLY reference-implementation readers for the lake/
# lake-rest read-parity suite (`tests/test_lake_iceberg_delta_parity.py`): real
# pyiceberg/deltalake open the engine's own materialized Delta + Iceberg artifacts and
# assert they read back correctly. Not a runtime dependency of the engine or the
# Python client. The project extra remains a compatibility marker, while the
# reference readers live in `tests/lake-parity-requirements.txt` and are installed
# only in an isolated validation environment: uv resolves every workspace member's
# extras together, and PyIceberg's Rich ceiling conflicts with the production Rich
# floor even when no workspace package requests this extra. Use
# `python tests/run_lake_parity.py` for the strict, exact-artifact gate; keeping
# this extra empty prevents the workspace resolver from reintroducing that
# conflict into production/test environments.
lake-parity = []
# The bare install already provides every runtime capability.  Keep `all` as a
# compatibility alias rather than quietly adding test frameworks or the external
# lake reference readers to production environments. `test` and `lake-parity`
# remain explicit validation extras; lake parity is installed in its documented
# isolated environment because PyIceberg's current `rich<15` ceiling conflicts
# with the workspace's Rich 15 production floor.
all = []

# Expose the engine's operator skills to the same provider federation used by
# agent-utilities and every agents/* package.  This is metadata only: consumers
# discover the entry point when agent-utilities is installed, without imposing it
# as an epistemic-graph runtime dependency.
[project.entry-points."agent_utilities.skill_providers"]
epistemic-graph = "epistemic_graph.skills"

# GOC-33 (`OWNER-VOICE-ASR`): registers this package's native whisper-rs-backed
# ASR provider (`epistemic_graph/asr_provider.py`) under the pluggable
# transcription-backend seam `agent-packages/agents/audio-transcriber` owns
# (`audio_transcriber/asr_providers.py`'s `TranscriptionProvider` Protocol).
# Discovery is by entry point ONLY, guarded try/except on the consumer side —
# this package never imports `audio_transcriber`, so listing this metadata
# imposes no runtime dependency here.
[project.entry-points."audio_transcriber.asr_providers"]
epistemic-graph = "epistemic_graph.asr_provider:build_provider"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B", "RUF100" ]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.vulture]
exclude = [".venv", "venv", "build", "dist", "target"]
min_confidence = 95

# BUG-CX-136 — one reviewed contract for the repository-local quality
# sensors.  The hooks resolve already-installed binaries only; they never
# invoke a package manager.  Keeping the versions here makes a tool upgrade a
# deliberate change to the same file as the thresholds and format universe.
[tool.epistemic_graph.scanners]
cccc_version = "1.6.0"
kiss_version = "0.4.10"
dupehound_version = "0.1.2"
dupehound_threshold = 0.85
dupehound_min_tokens = 40
jscpd_version = "5.0.16"
jscpd_min_tokens = 50
jscpd_min_lines = 5
jscpd_mode = "mild"
dependency_cruiser_version = "18.2.0"
import_linter_version = "2.13"
arch_lint_version = "0.5.0"
cargo_deny_version = "0.20.2"

# jscpd is intentionally the wide-net sensor.  It sees Rust/Python/JS/TS
# blocks as well as the config/template formats dupehound cannot parse.
jscpd_formats = { rust = ["rs"], python = ["py", "pyi"], javascript = ["js", "cjs", "mjs"], typescript = ["ts", "tsx", "cts", "mts"], bash = ["sh", "bash"], css = ["css"], html = ["html", "htm"], json = ["json"], yaml = ["yaml", "yml"], toml = ["toml"], sql = ["sql"], markdown = ["md"] }
jscpd_filenames = { docker = ["Dockerfile", "Containerfile"], makefile = ["Makefile", "GNUmakefile"] }
# Exclusions are junk, vendored code, and GENERATED OUTPUT. A generated file is
# not duplication debt: it has no author to refactor and no second copy to
# delete -- its repetition is a property of the generator's template, and the
# fix for a real duplication in it is a fix in the source of truth. `contract/`
# is the engine contract `gen_contract` writes from the
# `crates/eg-capabilities/src/domains/*` descriptor rows (RF-RULING-003), and
# `contract/methods.json` alone accounted for 1,056 of the scanner's clone
# pairs -- 408 structurally identical registry records -- which is the
# generator working, not debt. The descriptor rows themselves stay in the
# scanner's universe, so a genuine duplication in the SOURCE is still caught.
jscpd_exclusions = [
    "contract/**",
    "epistemic_graph/contract/**",
    # D7/D8 API reference: `scripts/gen_api_docs.py` renders these FROM
    # `contract/` (per-method request/result tables, one OpenAPI document), so
    # they repeat exactly as the contract does -- generated output under the
    # rule above; `check_api_contract_docs.py` byte-verifies them.
    "docs/api/**",
    "docs/openapi.json",
    # Upstream Swagger UI, vendored byte-for-byte (docs/assets/swagger-ui/NOTICE.md).
    "docs/assets/swagger-ui/**",
    "**/.git/**",
    "**/.venv/**",
    "**/venv/**",
    "**/node_modules/**",
    "**/target/**",
    "**/target-*/**",
    "**/build/**",
    "**/dist/**",
    "**/.cache/**",
    "**/cache/**",
    "**/.import_linter_cache/**",
    "**/generated/**",
    "**/vendor/**",
    "**/third_party/**",
    "**/fixtures/**",
    "**/fixture/**",
    "**/__snapshots__/**",
    "**/__pycache__/**",
    "**/*.lock",
    "**/Cargo.lock",
    "**/package-lock.json",
]

[tool.maturin]
python-source = "."
bindings = "bin"
strip = true
# Never carry interpreter caches from a reused checkout into a wheel or sdist.
# These are source-level Maturin globs, so the checkout itself remains untouched.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
# The shipped engine-contract receipt (RF-RULING-003): the digest agent-utilities pins.
# `python-source` already copies the package tree, but this makes the data file an
# explicit, reviewable part of the wheel contract rather than an implicit glob.
include = ["epistemic_graph/contract/receipt.json"]
# THE ONE PUBLISHED WHEEL = the main full-featured build (CONCEPT:EG-371 — tiers
# collapsed). `full` = every MAIN feature that builds without an external GPU/robotics
# toolchain: durable redb-authoritative store + cypher + SQL (query/DataFusion) + graphql
# + ann + tsdb + blob + the full compute domains (finance/datascience/reasoning/ast) +
# the security stack + the whole hand-rolled wire family (pgwire/mysql/mssql/sqlite/bolt/
# redis/amqp/mqtt/stomp) + native visualization (viz/viz-columnstore/viz-static-export/
# viz-interactive/viz-graph-tiles — the ColumnStore + LOD kernels + static PNG/SVG/PDF
# export + loopback interactive/graph-tile HTTP listeners; the listeners themselves stay
# off at runtime unless an operator passes their own `--*-addr` flag). It also adds
# `ast-extended` so the `ParseFiles`/`ParseFile` ops
# compile the full grammar tier (python/js/ts/go/rust/java/c/cpp/c#/ruby/php/bash/scala/
# lua) — making the engine the ONE code-parsing implementation (agent-utilities delegates
# and ships no Python tree-sitter wheels). This is `default`, so `cargo build` and this
# wheel are the SAME build. It targets Raspberry Pi 4+ (NOT Pi 3). There is no longer a
# pi/pi-max/node tier distinction, so there is exactly ONE wheel filename per platform —
# the old collision (every tier shared the same filename) is gone.
features = ["full", "ast-extended"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/epistemic-graph"
distribution = "epistemic-graph"
pages_url = "https://knuckles-team.github.io/epistemic-graph/"
mcp_server = false

# ── Opt-in build LAYERS (not published as separate wheels) ──
# The two heavier layers stack ON TOP of the main build and are built explicitly:
#
#   # HA / multi-node (adds openraft replication + distributed compute):
#   maturin build --release --no-default-features --features cluster,ast-extended
#
#   # GPU / robotics (adds the real CUDA + ROS2 bridge/DDS backends):
#   maturin build --release --no-default-features --features full-extras,ast-extended
#
# `--no-default-features` keeps the selected layer as the exact feature set (the
# `[tool.maturin] features` default above is not unioned on top). Both layers are a
# strict superset of `full`, so they remain full-featured single-node DBs plus their
# extra capability. Neither is published to PyPI — PyPI ships the one main wheel + sdist.
#
# `--profile release-tiny` (opt-level z + fat LTO + strip) still works for a smaller
# binary if wanted; the release CI builds the standard `--release` main wheel.
