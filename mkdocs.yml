site_name: "epistemic-graph"
site_description: "Rust-native durable multimodal and epistemic database with governed mutation batches, distributed analytics, reasoning, and native program optimization."
site_url: "https://knuckles-team.github.io/epistemic-graph/"
repo_name: "Knuckles-Team/epistemic-graph"
repo_url: "https://github.com/Knuckles-Team/epistemic-graph"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/graph-outline
  favicon: https://raw.githubusercontent.com/squidfunk/mkdocs-material/master/material/templates/assets/images/favicon.png
  features:
    # Presentation mirrors agent-utilities' mkdocs (sections + top, no tabs) so
    # navigating both sites feels consistent.
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Knuckles-Team/epistemic-graph
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/epistemic-graph/

nav:
  # Nav is intentionally shallow: each deep subtree (architecture/, interfaces/) collapses
  # to its own curated index.md landing page, plus whatever specific pages
  # scripts/check_documentation_contract.py's AUTHORITATIVE_PAGES requires to stay directly
  # in nav. Everything else stays in docs_dir, reachable from the landing pages and search.
  - Home: index.md
  - Status: status.md
  - Get Started:
      - Technical Overview: overview.md
      - Engine Modes: engine_modes.md
      - "North Star: Seamless": north_star.md
  - Capabilities:
      - Capabilities & Parity Matrix: capabilities.md
      - Generated Capability Policy Ledger: capabilities.generated.md
  - Interfaces:
      - Interfaces Overview: interfaces/index.md
  - Architecture:
      - Architecture Overview: architecture/index.md
      - Verified Request Authority: architecture/request_authority.md
      - Authoritative MutationBatch: architecture/mutation_batch.md
      - Governed ChangeEnvelope: architecture/change_envelope.md
      - Canonical Structural Properties: architecture/canonical-property-schema.md
      - Governed Modality Serving: architecture/modality_serving.md
      - Native Program Optimization: architecture/native-program-optimization.md
      - Distributed Analytics & Incremental Reasoning: architecture/distributed-analytics-reasoning.md
      - Analytics Program (one kernel, two surfaces): architecture/analytics_program.md
      - Numeric Kernel (EG-321): architecture/numeric_kernel.md
      - Hot-path Complexity Ledger: architecture/hot-path-complexity.md
  - Operate & Deploy:
      - Standalone Deployment (just the engine): standalone_deployment.md
      - Deployment (database): deployment.md
      - Deployment Topology (components): deployment_topology.md
      - Service Mode: service_mode.md
      - DBeaver / psql Quickstart: dbeaver_quickstart.md
      - Cost Model & Capacity: cost_model.md
      - Operations Runbook: operations/runbook.md
      - Exact Fault/Restart Certification: operations/exact-fault-restart-certification.md
      - Exact Release Campaigns: operations/exact-release-campaigns.md
      - Binary Promotion (deploy): deploy/binary_promotion.md
      - Transition Runbook (deploy): deploy/transition-runbook.md
      - Transport Boundary (ADR): transport_boundary_adr.md
      - Rust Compute Guide: rust_compute_guide.md
  - Reference:
      - Concept Registry: concepts.md
      - Unified Planner & UQL: uql.md
      - Environment Variable Reference: deployment.md
      - Roadmap: roadmap.md
      - Transport Benchmarks: benchmarks.md
      - Soak / Chaos Benchmarks: benchmarks-soak.md
      - Exact-binary Certification: performance_certification.md
  - For AI Agents: https://github.com/Knuckles-Team/epistemic-graph/blob/main/AGENTS.md
