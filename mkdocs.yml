site_name: "epistemic-graph"
site_description: "Rust-native knowledge-graph compute engine — graph algorithms, quantitative finance, data science, and OWL reasoning served over a MessagePack/UDS daemon for the agent-utilities ecosystem."
site_url: "https://knuckles-team.github.io/epistemic-graph/"
repo_name: "Knuckles-Team/epistemic-graph"
repo_url: "https://github.com/Knuckles-Team/epistemic-graph"
edit_uri: "edit/main/docs/"
copyright: "Copyright &copy; Knuckles-Team — MIT licensed"

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/graph-outline
  favicon: https://raw.githubusercontent.com/squidfunk/mkdocs-material/master/material/templates/assets/images/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Knuckles-Team/epistemic-graph
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/epistemic-graph/

nav:
  - Home: index.md
  - Engine:
      - Technical Overview: overview.md
      - Capabilities & Parity Matrix: capabilities.md
      - Universal-DB Parity Roadmap: roadmap.md
      - Master-of-all Engine: architecture/engine.md
      - UQL & Unified Planner: uql.md
      - Tiers & Binaries: architecture/tiers.md
      - Engine Modes: engine-modes.md
      - Service Mode: service_mode.md
  - Interfaces:
      - SQL & pgwire: interfaces/sql.md
      - SPARQL & RDF: interfaces/sparql.md
      - Cypher: interfaces/cypher.md
      - GraphQL: interfaces/graphql.md
      - Vector / ANN: interfaces/vector.md
      - Time-series: interfaces/timeseries.md
      - Key-value & Blob: interfaces/kv-blob.md
      - Ontology Lifecycle: interfaces/ontology.md
  - Deploy & Operate:
      - Deployment (database): deployment.md
      - Cost Model & Capacity: cost-model.md
      - Binary Promotion (deploy): deploy/binary-promotion.md
      - Rust Compute Guide: RUST_COMPUTE_GUIDE.md
  - Architecture:
      - Engine Scaling Program (M1/M2/M3): architecture/scaling-program.md
      - Reserved Read-Admission Lane (EG-044): architecture/reserved-read-lane.md
      - Transport Boundary (ADR): transport_boundary_adr.md
      - Per-Graph Write Coalescer: architecture/write-coalescer.md
      - Multi-Raft Cluster Status (M2): architecture/m2-raft-status.md
      - Catalog-driven Resharding (M3): architecture/m3-resharding.md
      - Cluster Deployment: architecture/cluster-deployment.md
      - Index Manager: architecture/index-manager.md
      - Correctness Harness: architecture/correctness-harness.md
  - Performance:
      - Transport Benchmarks: benchmarks.md
  - Reference:
      - Concept Registry: concepts.md
