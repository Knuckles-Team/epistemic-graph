# ── Opt-in build layers ON TOP of the ONE main build (CONCEPT:EG-371) ──
# The former `pi` / `pi-max` / `node` deployment tiers are GONE — they existed only to
# STRIP heavy deps (DataFusion, etc.) for a tiny Pi-3 binary, at the cost of every tier
# sharing the SAME wheel filename (only one could publish to PyPI). The main build
# (`default` == `full`) now carries every MAIN feature; these two bundles are the ONLY
# things layered ON TOP, selected explicitly at build time and NEVER published as their
# own wheel:
#
#   * `cluster`     — the main build PLUS in-engine Raft replication (CONCEPT:KG-2.188)
#                     + distributed graph compute (CONCEPT:KG-2.227, `compute-dist` — the
#                     cross-shard Pregel engine over the multi-Raft groups) + non-blocking
#                     cross-shard commit (`nonblocking`). This is HA / multi-node: it pulls
#                     openraft, which the single-node main build deliberately does NOT.
#   * `full-extras` — the main build PLUS the real CUDA (`gpu-cuda`) + ROS2 bridge/DDS
#                     (`ros2-bridge`/`ros2-dds`/`ros2-rmw`) backends. `gpu-cuda`/
#                     `ros2-bridge`/`ros2-dds` build clean everywhere via dynamic-loading
#                     or pure-Rust; `ros2-rmw` builds clean everywhere too (the CycloneDDS
#                     C sources are vendored + built via `cmake`, no network at build
#                     time) but needs a GPU / robotics / C toolchain to actually RUN.
#                     (`full-extras` is defined next to `gpu-cuda`/`ros2-dds`/`ros2-rmw`
#                     above.)
#
# INVARIANTS (asserted by `cargo tree`): the main/default build links NO openraft
# (cluster-only) and NO cudarc/dust_dds/cyclonedds (full-extras-only). It DOES link
# DataFusion now (query is a main feature) — the old "no-DataFusion Pi contract" is
# retired; the build targets Raspberry Pi 4+, not Pi 3.
cluster = ["full", "raft", "compute-dist", "nonblocking", "matview"]

# ── Unified single binary — the opt-in in-process pyo3-engine (unified-binary
# program, workstream W-A; see docs/architecture/unified-inprocess-engine.md) ──
#
# Embeds `eg-core`'s `GraphCore`/`GraphRegistry` directly in the SAME process as a
# Python extension module `epistemic_graph.engine`, so a self-contained deployment
# (one `graph-os`, no horizontal fan-out) can reach the engine with NO socket
# serialize/round-trip. This is the OTHER of the "two deployment shapes, one
# performance discipline" (AGENTS.md): the out-of-process Tokio/UDS server above
# remains the default, horizontal-scale-safe path; this feature is the opt-in
# self-contained path, never linked unless explicitly requested.
#
# `dep:eg-pyengine` pulls in the crate; `eg-pyengine/python` turns on ITS OWN
# Python-extension-gated `python` feature (mirroring eg-numeric's
# Surface-A/Surface-B split), so enabling this facade feature is what actually
# compiles the native binding, not just the inert rlib half. NOT in
# `default`/`full`/`cluster` — the scale-out build's no-pyo3-engine gate
# (`scripts/check_no_pyo3.sh`) only allows this to compile when a caller
# explicitly opts in here.
pyo3-engine = ["dep:eg-pyengine", "eg-pyengine/python"]

# ── Quantum as a governed epistemic-graph capability (D-QN-1, lane
# w0-eg-quantum-contracts, Q0 contracts) ──
#
# Mirrors the `pyo3-engine` posture directly above: an opt-in layer, NOT folded into
# `default`/`full`/`cluster`/`full-extras`, so a build that never asks for it pays
# nothing — no binary size, no new dependency, no runtime cost. Effectively all of
# this runs on ordinary CPU/GPU (simulators); real QPUs are one optional backend
# behind the same trait, never a requirement (see PROGRAM.md's quantum section,
# "Does any of this run on classical hardware? Yes — effectively all of it.").
#
# `quantum` is the BASE contracts feature: it links `eg-quantum-core` (the IR, the
# `QuantumBackend` trait, the planner, the exactness-typed result) and NOTHING else —
# turning this on alone gets a caller a compilable surface to build against, not an
# executable backend. `quantum-quest`/`quantum-gpu`/`quantum-hardware` are the three
# REMAINING backend-family layers PROGRAM.md's quantum section names (Q3 QuEST-ffi,
# Q4 pure-Rust GPU, Q10 hardware providers); each `implies quantum` and is currently
# EMPTY beyond that (no backend code exists yet in this workspace for THOSE three) —
# they exist now as the stable feature NAMES those future lanes wire `dep:` edges
# onto, so enabling one today is a no-op beyond `quantum` itself, and a future lane
# adding the real backend crate does not need to invent a new feature name or touch
# any call site that already gates on these.
#
# `quantum-sim` (D-QN-1, lane Q1 vendoring, register `lane-quantum-native.md`) is the
# FOURTH backend-family layer, delivered here: pure-Rust, in-process CPU backends
# with NO third-party SDK/FFI at all -- `eg-quantum-gates` (dense unitary matrices,
# content ported with attribution from QuantRS2/Apache-2.0, see its own NOTICE) and
# `eg-quantum-sim` (the `StateVectorSimulator`/`StabilizerSimulator` `QuantumBackend`
# impls: a dense-amplitude evolution loop and a clean-room Aaronson-Gottesman CHP
# tableau). Planner rule R1 (a Clifford circuit always selects `stabilizer`, never
# statevector -- the exponential-vs-polynomial routing decision PROGRAM.md's quantum
# section calls the single highest-value rule in the whole program) has a REAL
# backend pair to route between for the first time once this feature is on.
quantum = ["dep:eg-quantum-core"]
quantum-quest = ["quantum"]
quantum-gpu = ["quantum"]
quantum-hardware = ["quantum"]
quantum-sim = ["quantum", "dep:eg-quantum-gates", "dep:eg-quantum-sim"]

