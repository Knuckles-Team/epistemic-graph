# ── Unified single binary — the opt-in in-process pyo3-engine (unified-binary
# program, workstream W-A; see docs/architecture/unified-inprocess-engine.md) ──
#
# Embeds `medulla-core`'s `GraphCore`/`GraphRegistry` directly in the SAME process as a
# Python extension module `medulla.engine`, so a self-contained deployment
# (one `graph-os`, no horizontal fan-out) can reach the engine with NO socket
# serialize/round-trip. This is the OTHER of the "two deployment shapes, one
# performance discipline" (AGENTS.md): the out-of-process Tokio/UDS server above
# remains the default, horizontal-scale-safe path; this feature is the opt-in
# self-contained path, never linked unless explicitly requested.
#
# `dep:medulla-pyengine` pulls in the crate; `medulla-pyengine/python` turns on ITS OWN
# Python-extension-gated `python` feature (mirroring medulla-numeric's
# Surface-A/Surface-B split), so enabling this facade feature is what actually
# compiles the native binding, not just the inert rlib half. NOT in
# `default`/`full`/`cluster` — the scale-out build's no-pyo3-engine gate
# (`scripts/check_no_pyo3.sh`) only allows this to compile when a caller
# explicitly opts in here.
#
# `medulla-pyengine/security` is folded in here (unlike the 15 Wave-1 DOMAIN
# features `crates/medulla-pyengine/Cargo.toml` pre-adds, MEDULLA-PYENGINE-PLAN.md §4.5)
# because per-agent RLS is Wave 0's own proven-end-to-end contract
# (`crates/medulla-pyengine/src/authority.rs`), not a domain a later lane owns, and
# it is cheap: it only forwards to `medulla-core/security`, which `full` (hence
# `default`) already links today, so it adds no NEW dependency to a build that
# also has `full`/`default` on. The 15 domain features are DELIBERATELY left
# off this line for now — each pulls a real, sometimes heavy, dependency
# (DataFusion/Arrow via `medulla-query`'s `sql` feature, `wasmtime` via `medulla-wasm`,
# `oxrdf`/`oxttl` via `medulla-rdf`, ...) that Wave 0's stub domain files
# (`crates/medulla-pyengine/src/<domain>.rs`) do not yet call at all — turning them
# on here today would only inflate `pyo3-engine`'s build without exercising
# anything. Each Wave-1 domain lane adds its OWN `medulla-pyengine/<domain>` name
# to this line as a single-line append once its domain methods actually call
# that dependency (`MEDULLA-PYENGINE-PLAN.md` §4.5's own stated default —
# "all domains implemented so far are on" — deferred to be decided AS they
# are implemented, not before, since none is implemented yet at Wave 0).
pyo3-engine = ["dep:medulla-pyengine", "medulla-pyengine/python", "medulla-pyengine/security"]

# ── Quantum as a governed medulla-engine capability (D-QN-1, lane
# w0-medulla-quantum-contracts, Q0 contracts) ──
#
# Mirrors the `pyo3-engine` posture directly above: an opt-in layer, NOT folded into
# `default`/`full`/`cluster`/`full-extras`, so a build that never asks for it pays
# nothing — no binary size, no new dependency, no runtime cost. Effectively all of
# this runs on ordinary CPU/GPU (simulators); real QPUs are one optional backend
# behind the same trait, never a requirement (see PROGRAM.md's quantum section,
# "Does any of this run on classical hardware? Yes — effectively all of it.").
#
# `quantum` is the BASE contracts feature: it links `medulla-quantum-core` (the IR, the
# `QuantumBackend` trait, the planner, the exactness-typed result) and NOTHING else —
# turning this on alone gets a caller a compilable surface to build against, not an
# executable backend. `quantum-quest`/`quantum-gpu` are the two REMAINING
# backend-family layers PROGRAM.md's quantum section names that are still unstarted
# (Q3 QuEST-ffi, Q4 pure-Rust GPU); each `implies quantum` and is currently EMPTY
# beyond that (no backend code exists yet in this workspace for either) — they exist
# now as the stable feature NAMES those future lanes wire `dep:` edges onto, so
# enabling one today is a no-op beyond `quantum` itself, and a future lane adding the
# real backend crate does not need to invent a new feature name or touch any call
# site that already gates on these.
#
# `quantum-sim` (D-QN-1, lane Q1 vendoring, register `lane-quantum-native.md`) is the
# FOURTH backend-family layer, delivered here: pure-Rust, in-process CPU backends
# with NO third-party SDK/FFI at all -- `medulla-quantum-gates` (dense unitary matrices,
# content ported with attribution from QuantRS2/Apache-2.0, see its own NOTICE) and
# `medulla-quantum-sim` (the `StateVectorSimulator`/`StabilizerSimulator` `QuantumBackend`
# impls: a dense-amplitude evolution loop and a clean-room Aaronson-Gottesman CHP
# tableau). Planner rule R1 (a Clifford circuit always selects `stabilizer`, never
# statevector -- the exponential-vs-polynomial routing decision PROGRAM.md's quantum
# section calls the single highest-value rule in the whole program) has a REAL
# backend pair to route between for the first time once this feature is on.
#
# `quantum-hardware` (register `D-QN-1`, lane Q10, `w6-quantum-q10-providers`,
# `plans/au-medulla-program/program/quantum-external-providers.md` ss1.3) is the FIFTH
# backend-family layer: optional, feature-gated adapters to real third-party
# hardware/cloud providers (IBM Quantum Open Plan, Amazon Braket, Azure Quantum),
# all implementing the SAME `QuantumBackend` trait, all `BackendFamily::Hardware`,
# all NEVER exact (see `medulla-quantum-hardware`'s crate docs for why the whole family is
# conservatively non-exact even for a provider's cloud-simulator SKU), all
# budget-tracked with refuse-before-submit quota enforcement (a hard, shared, easily-
# exhausted resource -- IBM's Open Plan is ~10 QPU-minutes per 28-day window), and
# all credential-sourced from named environment variables ONLY (OpenBao-populated at
# deploy time, matching this repo's existing `S3_SECRET_KEY_ENV`/`KVCACHE_TOKEN_ENV`
# convention -- never a ConfigMap, never committed, never a plaintext default). Like
# `quantum-sim`, `medulla-quantum-sim` remains the DEFAULT backend regardless of whether
# this feature is on; these adapters exist for validation, noise studies, and
# workloads exceeding local capacity, never as the front door (an explicitly
# rejected alternative was routing through a third-party Qiskit MCP server, which
# would bypass planner rule R1's exponential-vs-polynomial routing decision).
quantum = ["dep:medulla-quantum-core"]
quantum-quest = ["quantum"]
quantum-gpu = ["quantum"]
quantum-hardware = [
    "quantum",
    "dep:medulla-quantum-hardware",
    "medulla-quantum-hardware/ibm",
    "medulla-quantum-hardware/braket",
    "medulla-quantum-hardware/azure",
]
quantum-sim = ["quantum", "dep:medulla-quantum-gates", "dep:medulla-quantum-sim"]
# Lanes Q5/Q6 (`quantum-external-providers.md` addendum) -- quantum as a DURABLE
# `medulla-jobs` job, never a synchronous `Op`: `medulla-quantum-jobs` submits a
# `QuantumProgram` built from a candidate RowSet through the REAL
# `medulla_jobs::JobStore` (no parallel job abstraction -- see that crate's own docs for
# why this reuses, not forks, the durable-execution plane this workspace already
# has), runs it via the SAME planner rules R0-R5 against `quantum-sim`'s backends,
# and bridges the result (expectations/distributions/bitstrings) into `medulla-numeric`
# arrays. Mirrors `quantum-sim`'s posture exactly: NOT in `default`/`full`/`cluster`,
# zero new crates.io dependencies (every edge below is an existing workspace
# member). `quantum-jobs-federation` additionally wires the crate's `federation-
# bridge` feature (a named `ForeignSource` reading a completed quantum job's
# results through the EXISTING `crates/medulla-plan/src/federation.rs` seam, staging-
# discipline step 2 -- see the addendum) -- implies the facade's own `federation`
# so the same DataFusion+TLS-bearing `medulla-plan` build the server already links is
# reused, not duplicated.
quantum-jobs = ["quantum-sim", "dep:medulla-quantum-jobs"]
quantum-jobs-federation = ["quantum-jobs", "federation", "medulla-quantum-jobs/federation-bridge"]

# `crates/medulla-quantum-workloads` (Q7 epistemic hooks + Q11 domain workloads, register
# `D-QN-6`, plans/au-medulla-program/program/quantum-external-providers.md §1.4) is
# DELIBERATELY a workspace member ONLY -- no `dep:medulla-quantum-workloads` feature
# exists here and the root `medulla-engine` package does not depend on it. That is
# the addendum's staged-rollout step 1 ("a tool pulls a subgraph, runs the
# algorithm, writes results back as proposals. Works today.") taken literally: zero
# change to this package or to `src/server/`, so `cargo build`/`cargo test` at the
# workspace root are unaffected by its existence and the sibling
# `w6-quantum-q5q6-jobplane` lane's durable job-plane work has a clean, unclaimed
# surface to later host it behind (`Op::SubmitQuantum`/`Op::JoinQuantumResults`).
# Build/test it targeted: `cargo test -p medulla-quantum-workloads`.
# Q8 (`plans/au-medulla-program/program/quantum-native.md` 2026-08-07 status block +
# `quantum-external-providers.md` §1.5) -- the agent-facing control-plane surface:
# `Method::Quantum { op }` (`quantum_rank`/`optimize_with_qaoa`/`quantum_expectation`)
# + `src/server/handlers/quantum.rs`'s dispatch, wired into `medulla-capabilities`'
# machine-checked policy ledger (R5 override audit, Q9) + the `:ToolCall`/`RunTrace`
# provenance model on the agent-utilities side. Pulls `quantum-sim` (a REAL backend
# to route to -- an agent op with no executable backend is still just contracts, not
# "reachable") + `server` (Tokio dispatch + ServerState; `medulla-capabilities` itself is
# folded into `server`) + the matching `medulla-types/quantum` and `medulla-capabilities/quantum`
# wire/policy features (kept in LOCKSTEP -- see both crates' own docs on why
# `medulla-types/quantum` can never be forced on unconditionally by `medulla-capabilities`,
# exactly like `jobs`/`statechart`). This is the ONE feature that makes the quantum
# surface reachable from graph-os/agent-utilities at all -- `quantum`/`quantum-sim`
# alone remain Rust-internal, no wire protocol Method, no KG concept mapping.
quantum-agent-api = [
    "quantum-sim", "server", "medulla-types/quantum", "medulla-capabilities/quantum",
]

