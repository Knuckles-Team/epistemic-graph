[workspace]
members = ["crates/eg-types", "crates/eg-ann", "crates/eg-core", "crates/eg-compute", "crates/eg-query", "crates/eg-plan", "crates/eg-tsdb", "crates/eg-text", "crates/eg-rdf"]

[package]
name = "epistemic-graph"
version = "0.34.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "High-performance Rust graph compute engine for AI agents"
license = "MIT"

[lib]
name = "epistemic_graph"
crate-type = ["rlib"]

[[bin]]
name = "epistemic-graph-server"
path = "src/main.rs"
required-features = ["server"]

# Longer fault-injection soak for the correctness harness (CONCEPT:KG-2.212). Only
# builds under `--features harness` (which pulls `raft`); a default/server/full build
# does not compile it. `cargo test --features raft harness::` runs the bounded
# deterministic gauntlet; this bin runs the unbounded seeded soak.
[[bin]]
name = "nemesis"
path = "src/bin/nemesis.rs"
required-features = ["harness"]

# SQLite-style embedded usage (CONCEPT:KG-2.216). Needs the in-process library API.
[[example]]
name = "embedded"
path = "examples/embedded.rs"
required-features = ["embedded"]

[features]
default = ["graph", "algorithms", "metrics"]

graph = []
algorithms = []
# Prometheus observability: request/latency/in-flight counters, per-graph
# gauges and a /metrics HTTP listener (--metrics-addr). ON by default; opt out
# with --no-default-features for a leaner lib-only build.
metrics = ["dep:prometheus", "eg-types/metrics"]
finance = ["eg-compute/finance", "eg-types/finance"]
ast = ["eg-compute/ast"]
# Extended-language grammar tier (CONCEPT:KG-2.106), folded into `full`.
ast-extended = ["eg-compute/ast-extended"]
datascience = ["eg-compute/datascience", "eg-types/datascience"]
reasoning = ["eg-compute/reasoning"]
# Native eg-ann IVF-PQ + OPQ + SQ8-refine vector index (CONCEPT:KG-2.207) as the
# SemanticStore backend, replacing the rebuild-on-load hnsw_rs index. Pure-Rust,
# CPU integer-table serving (no GPU/native-ML/faiss in the tree) so it is Pi-lean
# and folded into the durable serving tiers (pi/node/cluster/full). A persisted
# index reopens WITHOUT rebuilding from raw vectors.
ann = ["eg-core/ann"]
# Persist the ANN codes into the redb durable tier too (needs `redb`).
ann-redb = ["ann", "redb", "eg-core/ann-redb"]
server = ["dep:tokio", "dep:clap", "dep:tracing-subscriber", "dep:async-trait"]
# Durable redb store (CONCEPT:KG-2.177 / KG-2.195). Pulls the redb crate + the
# PURE durable-row machinery (`redb_store` — table layout, Method→rows apply,
# checkpoint/load, group-commit) which is server-INDEPENDENT (no Tokio). The
# server's write-through/authoritative `PersistenceBackend` impl (`redb_backend`)
# is layered ON TOP and is itself gated on `server` (it talks to `ServerState`
# + the Tokio dispatch). So `redb` alone (no `server`) compiles a usable durable
# store — exactly what the EMBEDDED API drives on the Pi/edge with no Tokio.
redb = ["dep:redb"]
# Streamed content-addressed BLOB substrate (CONCEPT:KG-2.206): the bytes tier
# under multimodal `:Media`/`:Blob`. Pulls `redb` (the native CAS lives in
# `blob.redb`) + `server` (the streaming protocol rides the Tokio transport). The
# native redb-CAS links NO object-store SDK — that is a SEPARATE `blob-s3` feature
# below, so a `blob`/`pi`/default build stays lean (the Pi contract). Folded into
# node/cluster/full so the standard build carries the media substrate; kept OUT of
# bare default + server-only.
blob = ["server", "redb", "eg-types/blob"]
# S3/MinIO object-store chunk backend behind the SAME `ChunkStore` trait
# (CONCEPT:KG-2.206). SEPARATE from `blob` and NOT folded into any tier bundle, so
# only an explicit `--features blob-s3` build links the `object_store` SDK — the
# Pi/default/full build links no AWS/object-store crate (asserted by cargo tree).
blob-s3 = ["blob", "dep:object_store"]
# Read-only SQL query surface (CONCEPT:KG-2.178). Pulls eg-query + DataFusion/Arrow
# — heavy, so it is OFF by default and folded only into full/all (never the slim
# Raspberry-Pi build). A default build links no DataFusion.
query = ["dep:eg-query", "eg-query/sql", "dep:eg-plan", "eg-plan/query", "eg-types/query", "eg-tsdb?/arrow-seg"]
# Embedded BM25 full-text search + the lexical `RankText` op + the RRF `FuseRrf`
# hybrid (CONCEPT:KG-2.215). Pulls eg-text's Tantivy index (the Rust Lucene —
# zstd-sys etc.) via eg-plan's `text`, which IMPLIES `query`. HEAVY (≈140 transitive
# crates incl. zstd-sys's C build), so it is OFF by default and folded ONLY into
# node/cluster/full — NEVER the slim Raspberry-Pi build. A default/pi build links NO
# Tantivy (asserted by `cargo tree -e normal | grep -i tantivy` ⇒ none). It pulls
# eg-plan (the planner that hosts the op) just as `query` does.
text = ["dep:eg-plan", "eg-plan/text", "eg-types/text", "query"]
# Dep-free Cypher query surface (CONCEPT:KG-2.179): `MATCH … RETURN …` compiled to
# the engine's own primitives (label index / VF2 / BFS) — NO DataFusion, so it is a
# HARD requirement of the lean Pi tier. A `cypher`-only build links no DataFusion
# (the Pi proof).
cypher = ["dep:eg-query", "eg-query/cypher"]
# Native time-series store + TS primitives (CONCEPT:KG-2.210/211). Pulls eg-tsdb's
# redb chunk store + the native ASOF/gap-fill/time_bucket/OHLC/decay primitives —
# NO DataFusion (the Pi contract holds: a `tsdb`-only build links no DataFusion).
# Requires `redb` (the durable series store sits beside graph.redb) + `server` (the
# series handler routes through dispatch). Folded into node/cluster/full; OUT of the
# bare default. When `query` is ALSO on, eg-tsdb's `arrow-seg` lights up the
# DataFusion `time_bucket = GROUP BY (ts/w)*w` leg (see the `query` feature below).
tsdb = ["server", "redb", "dep:eg-tsdb", "eg-tsdb/redb-store"]
# Streaming / CDC / continuous queries / subscriptions / triggers (CONCEPT:KG-2.229/
# 230, Lane L). Reactivity layered over the existing per-graph durable change record
# (the ledger): every durable mutation the dispatch shell records also emits an
# ordered, cursor-addressable change into a per-graph in-memory feed, from which the
# CDC read / incremental continuous-query / watch+trigger surfaces are driven over the
# SAME one-Response-per-Request transport (cursor / long-poll — no side-channel). The
# core is a bounded VecDeque ring + a tokio Notify: PURE-RUST, NO heavy dep, so it is
# Pi-lean and folded into pi/node/cluster/full. Needs `server` (the handler routes
# through dispatch); `eg-types/streaming` carries the Method variants + wire DTOs.
streaming = ["server", "eg-types/streaming"]
# In-engine Raft replication (CONCEPT:KG-2.188): runs the engine as a multi-node
# HA cluster replicating its AUTHORITATIVE state via openraft. CLUSTER-TIER ONLY —
# OFF by default and NOT in `full`/`all`, so a default / `pi` / `full` build links
# NO openraft. The Pi contract is sacred: no DataFusion AND no openraft in the tree.
# It pulls `redb` because Raft replicates the redb-AUTHORITATIVE store (M2): a
# committed log entry applies through the same PersistenceBackend/GraphCore path.
# Activates only when built `--features raft` AND configured at runtime
# (EPISTEMIC_GRAPH_RAFT_NODE_ID + EPISTEMIC_GRAPH_RAFT_PEERS); off → single-node.
raft = ["server", "redb", "dep:openraft"]
# Correctness + load harness (CONCEPT:KG-2.212 / KG-2.222) — the standing proof-engine
# that gates every distributed/durability claim (multi-raft, M2 durability, distributed
# txns, PITR/replication, the cross-shard 2PC atomicity + recovery proof). TEST/DEV-ONLY:
# it pulls `raft` (the cluster it exercises) and compiles BOTH gauntlets — T1's nemesis
# fault-injector + load-gen + linearizability checker + the `nemesis` soak bin
# (`src/raft/harness/*`) AND Lane N's cross-shard 2PC gauntlet (`src/raft/xshard_harness.rs`).
# It is NEVER folded into any deployment tier (pi/node/cluster/full), so a production
# `cargo build`/`--features pi`/`--features full` build links NOTHING from it (verified by
# `cargo tree` in the gate). The partition hook it needs in the raft network is
# `#[cfg(any(test, feature = "harness"))]`, so a non-harness build has byte-for-byte the
# production network path.
harness = ["raft"]
# Postgres wire-protocol shim (CONCEPT:KG-2.189). A facade-only listener that lets
# psql / BI tools / ORMs run SQL against a graph, reusing the eg-query DataFusion
# path (so it IMPLIES `query`) over the Tokio server (`server`). Heavy (pgwire +
# postgres-types) — OFF by default and kept OUT of `full` so `full` stays a lean
# embeddable build; it ships only in the `cluster` tier. The listener only starts
# when ALSO configured via EPISTEMIC_GRAPH_PGWIRE_ADDR.
pgwire = ["dep:pgwire", "dep:futures", "query", "server"]
# Embedded in-process library API (CONCEPT:KG-2.216). An `EmbeddedEngine` handle
# that owns a `GraphRegistry` + the redb durable store DIRECTLY — NO Tokio server,
# NO socket, NO HMAC (in-process, the caller IS trusted). SQLite/DuckDB-style: open
# a persist dir, call core ops as plain methods. It drives the SAME GraphCore +
# redb-authoritative durable rows the socket dispatch does (via `wal::apply` +
# `redb_store`), so there is ONE core, two transports. Pulls only `redb` (the
# durable tier) — deliberately NOT `server`, so `--features "embedded redb"` builds
# with no Tokio server runtime (the Pi/edge "100M agents, a local engine each"
# story). Gated query/tsdb surfaces light up when those features are ALSO on.
embedded = ["redb"]
# Native RDF surface (CONCEPT:KG-2.217, Lane W): maps an RDF dataset onto the
# property-graph + serializes it back (Turtle/N-Triples via oxrdf/oxttl in the
# eg-rdf crate). PURE-RUST — links NO C/native dep (proven by cargo tree) — so it is
# safe to fold into the serving tiers but kept OUT of bare default/`pi` (the Pi
# build stays lean; RDF is not a Pi requirement). Needs `server` (the handler routes
# through dispatch) + `eg-types/rdf` (the Method variants).
rdf = ["server", "dep:eg-rdf", "eg-rdf/rdf", "eg-types/rdf"]
# Native SPARQL 1.1 surface (CONCEPT:KG-2.218): compiles spargebra's algebra to
# GraphView scans (eg-rdf). IMPLIES `rdf`; pure-Rust (spargebra), no native dep.
sparql = ["rdf", "eg-rdf/sparql", "eg-types/sparql"]
# Native OWL 2 reasoner (CONCEPT:KG-2.219): EL⁺ completion + RL property rules,
# classification / consistency / incremental materialization + justifications. The
# `OwlReason` Method surface. PURE-RUST — it parses OWL from the SAME oxttl as `rdf`,
# links NO C/native crate (no horned-owl/whelk-rs) — so it folds into pi/node/full
# beside rdf/sparql with NO Pi-contract breach (no DataFusion). IMPLIES `sparql`.
owl = ["sparql", "eg-rdf/owl", "eg-types/owl"]
# The OWL/SPARQL cross-modal plan SOURCE ops `Op::Reason` / `Op::SparqlBgp`
# (CONCEPT:KG-2.220) inside a UnifiedQuery plan. The unified-plan executor needs
# DataFusion, so this IMPLIES `query` (it is NOT Pi-safe) — kept OUT of `pi`, folded
# into node/full where `query` already lives. Pulls eg-plan's `owl` (the op exec).
owl-plan = ["owl", "query", "eg-plan/owl", "eg-types/owl-plan"]
# Opt-in lossless redb `quads` table for multi-valued-literal predicates the
# property blob can't hold (CONCEPT:KG-2.217). Rides the engine `redb` tier.
rdf-redb = ["rdf", "redb", "eg-rdf/rdf-redb"]
compute = ["finance", "ast", "ast-extended", "datascience", "reasoning"]
# `full`/`all` deliberately stay SINGLE-NODE: raft is NOT folded in, so a `full`
# build links no openraft (matching the tier intent — replication is cluster-only).
# `redb` IS folded in (CONCEPT:KG-2.195 — THE FLIP) so the standard full/all build
# is authoritative-by-default (a durable source of truth) just like pi/node/cluster.
full = ["compute", "server", "query", "cypher", "redb", "ann", "tsdb", "blob", "text", "sparql", "rdf-redb", "owl", "owl-plan", "streaming"]
all = ["full"]

# ── Pi ↔ Cluster deployment tier bundles ──
# Convenience feature sets spanning the deployment spectrum. `pi` is the lean
# durable in-memory build with NO DataFusion (Raspberry-Pi contract) — but it
# DOES carry the dep-free `cypher` query surface (CONCEPT:KG-2.179): Cypher is a
# hard requirement of the Pi tier and links no DataFusion. `node` layers SQL +
# compute on top; `cluster` is `node` + in-engine Raft replication
# (CONCEPT:KG-2.188). A sibling track (M8) also extends `cluster` with `pgwire`;
# an integration step unions them — keep the raft part here.
#
# Lane-W (CONCEPT:KG-2.217/218) lands PURE-RUST `rdf` + `sparql`
# (oxrdf/oxttl/spargebra — no native deps) and a `text` (Tantivy, C dep) surface.
# Those lanes are now merged to this base, so the tier wiring is FINALIZED here:
#   * `pi`  carries `rdf` + `sparql` (pure-Rust, Pi-safe — ships native RDF/SPARQL on
#     the Pi-3 tier). NOT `text` (Tantivy's C dep must stay out of `pi`). The Pi
#     contract still holds: `--features pi` links NO DataFusion / openraft / Tantivy.
#   * `node`/`full` carry `rdf` + `sparql` + `text` (via `rdf-redb`/`sparql`/`text`).
pi = ["server", "graph", "algorithms", "redb", "cypher", "ann", "rdf", "sparql", "owl", "streaming"]
node = ["pi", "query", "reasoning", "finance", "datascience", "ast", "tsdb", "blob", "text", "sparql", "rdf-redb", "owl-plan"]
# `cluster` = `node` + in-engine Raft replication (CONCEPT:KG-2.188, M7b) + the
# Postgres wire shim (CONCEPT:KG-2.189, M8). The two sibling tracks each extended
# `cluster`; this integration unions both halves so the cluster tier links raft
# AND pgwire (and transitively datafusion via `query`).
cluster = ["node", "raft", "pgwire"]

[dependencies]
eg-types = { path = "crates/eg-types" }
eg-core = { path = "crates/eg-core" }
# Compute domains (always linked for `algorithms`, used by the graph-op handlers);
# the heavy finance/datascience/ast/reasoning code + deps are gated behind the
# facade features that pass through to eg-compute's matching features.
eg-compute = { path = "crates/eg-compute" }
# Optional SQL query surface (feature `query`); pulls DataFusion only when enabled.
eg-query = { path = "crates/eg-query", optional = true }
# Optional unified cross-modal planner (feature `query`, CONCEPT:KG-2.208/209). Its
# DataFusion FILTER leg is gated by eg-plan's own `query`; pulled only with the
# facade `query`, so a default/Pi build links neither it nor DataFusion.
eg-plan = { path = "crates/eg-plan", optional = true }
# Optional native time-series store + primitives (feature `tsdb`, CONCEPT:KG-2.210/
# 211); pulls redb only (native primitives), and DataFusion only when `query` is ALSO
# on (its `arrow-seg` feature, enabled transitively by the facade `query` feature).
eg-tsdb = { path = "crates/eg-tsdb", optional = true }
# Optional native RDF/SPARQL surface (features `rdf`/`sparql`, CONCEPT:KG-2.217/218).
# Pulls oxrdf/oxttl/spargebra — ALL pure-Rust — only when enabled, so a default/pi
# build links none of them (asserted by cargo tree). Its `rdf-redb` quad table rides
# the facade `redb` feature.
eg-rdf = { path = "crates/eg-rdf", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
petgraph = { version = "0.6.4", features = ["serde-1"] }
rayon = "1.10"
parking_lot = "0.12"
dashmap = "6.1"
ahash = "0.8"
uuid = { version = "1.8", features = ["v4"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"

# Optional Server. Explicit minimal feature set (not "full"): the binary uses an
# explicitly-built multi-thread runtime + UDS/TCP listeners + sync primitives +
# timers + `signal` (SIGTERM/SIGINT graceful shutdown) + `macros` (the
# `tokio::select!` the graceful accept loop awaits on). Tests pull
# dev-dependencies' "full" tokio, so #[tokio::test]/duplex still work. Trims
# compile time + binary surface.
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "macros",
], optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
# `dyn PersistenceBackend` needs object-safe async methods (CONCEPT:KG-2.177);
# matches the existing async persist.rs style without a runtime bridge.
async-trait = { version = "0.1", optional = true }
# Durable embedded KV for the redb write-through tier (feature `redb`).
redb = { version = "4.1", optional = true }
# S3/MinIO object-store chunk backend (feature `blob-s3`, CONCEPT:KG-2.206). The
# ONLY dep that pulls an object-store/AWS SDK, gated behind `blob-s3` (NOT `blob`),
# so a default/pi/full build links no object_store/aws crate — verified by the
# `cargo tree -e normal | grep -iE 'aws|s3|object_store'` Pi-contract gate.
object_store = { version = "0.11", optional = true, features = ["aws"] }
# In-engine Raft consensus (feature `raft`, CONCEPT:KG-2.188). Pinned to the latest
# 0.9.x stable; `serde` is required because the app data (a durable `Method` for a
# graph) + the log entries cross the wire MessagePack-encoded. CLUSTER-TIER ONLY:
# optional + only referenced under #[cfg(feature = "raft")], so a default/pi/full
# build links no openraft (verified by `cargo tree`).
openraft = { version = "0.9", features = ["serde"], optional = true }
# Postgres wire-protocol shim (feature `pgwire`, CONCEPT:KG-2.189). `server-api`
# is the server-side handler set; `_ring` selects the ring crypto backend for the
# SCRAM/TLS machinery (we pass tls=None, but the feature must pick a backend to
# build). default-features off keeps the client API + extra type codecs out.
pgwire = { version = "0.40", optional = true, default-features = false, features = [
    "server-api",
    "_ring",
] }
# Stream/sink combinators for the pgwire DataRow result stream (feature `pgwire`).
futures = { version = "0.3", optional = true }

# Optional Prometheus observability (feature `metrics`, on by default).
# default-features = false drops the protobuf encoder — text exposition only.
prometheus = { version = "0.14", optional = true, default-features = false }
hmac = "0.12"
hex = "0.4"
rmp-serde = "1.3"
lazy_static = "1.4"
sha2 = "0.10"
rand = "0.8"
hnsw_rs = "0.3"
# Advisory file locking for the single-writer persist-dir guard (Phase B1):
# exactly one engine may own a persist dir, closing the split-brain/orphan class
# at the engine level (complements the Python-side spawn guard).
fs4 = "0.8"
serde_bytes = "0.11.19"


[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing-subscriber = "0.3"
# Real Postgres client for the pgwire wire round-trip integration test
# (CONCEPT:KG-2.189). Only compiled for tests; never linked into the engine.
tokio-postgres = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
