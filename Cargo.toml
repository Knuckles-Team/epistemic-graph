[package]
name = "epistemic-graph"
version = "0.11.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Rust based epistemic graph engine for agent-utilities"
license = "MIT"

[lib]
name = "epistemic_graph"

[[bin]]
name = "epistemic-graph-server"
path = "src/main.rs"

[dependencies]
petgraph = "0.6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
rdkafka = "0.36"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
