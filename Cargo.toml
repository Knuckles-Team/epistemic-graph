[workspace]
members = ["crates/eg-types", "crates/eg-mutation-store", "crates/eg-ann", "crates/eg-geo", "crates/eg-tensor", "crates/eg-stream", "crates/eg-core", "crates/eg-compute", "crates/eg-query", "crates/eg-plan", "crates/eg-tsdb", "crates/eg-text", "crates/eg-rdf", "crates/eg-shacl", "crates/eg-shex", "crates/eg-wasm", "crates/eg-graphql", "crates/eg-kvcache", "crates/eg-lake", "crates/eg-numeric", "crates/eg-epistemic", "crates/eg-modality", "crates/eg-image", "crates/eg-audio", "crates/eg-video", "crates/eg-document", "crates/eg-alignment", "crates/eg-capabilities", "crates/eg-jobs", "crates/eg-program", "crates/eg-statechart", "crates/eg-sqlite-format", "crates/eg-pyengine", "crates/eg-quantum-core", "crates/eg-quantum-gates", "crates/eg-quantum-sim", "crates/eg-viz-core"]
# D-QN-1 / lane w0-eg-quantum-contracts (Q0) -- eg-quantum-core: the quantum-as-a-
# governed-epistemic-graph-capability CONTRACTS crate (QuantumProgram IR,
# QuantumBackend trait + capability flags, estimate()/planner rule engine R0-R5, and
# the exactness-typed QuantumResult). A workspace member so `cargo build/test
# --workspace -p eg-quantum-core` works standalone; the root package links it ONLY
# behind the optional, default-off `quantum` feature below (see that feature's own
# comment) -- a default `cargo build` here links NONE of it. Ships no simulator, no
# vendored SDK (QuantRS2/QuEST), no CUDA/MPI -- see its own crate-level doc for the
# numeric-stack decision (bridges to eg-numeric, does not carry its own).
# D-VZ-1 (lane V0, `plans/au-eg-program/deferred/lane-viz-native.md`) -- eg-viz-core:
# native visualization contracts (ViewSpec chart IR, ViewResult exact-vs-approximated
# metadata, the mark capability matrix, and the primitives/bytes LOD tier-selection
# rules). Reimplements the ARCHITECTURE of open-source-libraries/xy in-tree (Rust LOD
# core + columnar store + binary view protocol + GPU client); does NOT depend on the
# xy PyPI package. A leaf crate ALONG the DAG with no workspace-internal dependency of
# its own (see the crate's own Cargo.toml/lib.rs docs -- V0 blocks V1-V8 and the
# program charter's lane table records V0 as depending on nothing). The facade wires
# it in behind the `viz`/`viz-interactive`/`viz-gpu-export` features below, ALL OFF by
# default (unlike `jobs`, NOT folded into `full`) -- the same "no dependency, no
# runtime cost when unused" posture as the sibling quantum contract's `quantum`/
# `quantum-quest`/`quantum-gpu`/`quantum-hardware` features, because V0 ships
# contracts only: no ColumnStore, no LOD kernel, no renderer exist yet to serve.
# CONCEPT:INT-P2-1 -- eg-jobs: the durable analytics-job plane (async submit/status/
# progress/cancel/resume over a redb-backed `AnalyticsJob` state machine, committing
# results as provenance'd epistemic claims via `eg-core::GraphCore` +  the SAME
# typed-node convention `eg-epistemic` reads). A leaf crate ALONG the DAG (deps =
# eg-types + eg-core), added as a workspace member ONLY -- mirroring the eg-document/
# eg-alignment/eg-image/eg-audio/eg-video precedent above. The root package exposes
# it behind the composable `jobs` feature and includes that feature in the one main
# `full`/default build (CONCEPT:EG-371), wiring `Method::AnalyticsJob` and the bounded
# distributed worker runtime.
# CONCEPT:EG-P0-1 -- eg-capabilities: the machine-checked MethodPolicy capability-ledger
# crate (exhaustive, no-wildcard `policy()` over eg-types::protocol::Method, generated
# docs/capabilities.generated.md, a consistency test cross-checking access.rs/wal.rs/
# audit.rs/cdc.rs). A leaf crate (deps = eg-types ONLY, all its optional features on --
# see eg-capabilities/Cargo.toml). Build/test it targeted:
# `cargo build -p eg-capabilities` / `cargo test -p eg-capabilities` /
# `cargo clippy -p eg-capabilities -- -D warnings`.
# CONCEPT:EG-P0-2 -- as of the mutation-gateway workstream, eg-capabilities IS also an
# optional dependency of the root `epistemic-graph` package (see `[dependencies]` +
# the `server` feature below): `src/server/mutation.rs`'s `MutationPlan` calls
# `eg_capabilities::policy(&method)` as its ONE source of per-method authz/durability/
# audit/CDC/idempotency truth, so the server binary linking it is the point.
# eg-types' optional features that eg-capabilities forces on are pure serde/enum-variant
# gates, confirmed to add no heavy transitive dependency. The one main build includes
# `server`, and therefore this ledger.
# EG-185/186: eg-kvcache is the tiered + shared KV-cache leaf crate, a sibling of
# eg-ann/eg-tensor. Its path dependency and server endpoint are included through the
# main build's `kvcache-server` feature.
# CONCEPT:EG-317: eg-lake is the LTAP lakehouse-interop leaf crate — Parquet
# materialization + Delta/Iceberg logs + LSN as-of snapshots + Iceberg-REST catalog)
# behind the composable `lake`/`lake-rest` features. `lake` is not another deployment
# tier: as of W4.8 it is folded into the one main `full` build (the Polars-native-Parquet
# + pure-Rust apache-avro codec measured well inside the Pi-4 release-binary budget — see
# the `lake =` feature comment below for the measured delta), so a default `cargo build`
# now serves the Iceberg-REST catalog when `--iceberg-addr` is configured, exactly like
# every other opt-in-at-runtime, compiled-in-by-default listener (`--metrics-addr`/
# `--obs-addr`/`--s3-addr`).
# CONCEPT:E4 — eg-modality: the ModalityContract trait + conformance harness. A tiny
# leaf crate BELOW eg-plan/eg-core in the DAG (deps = eg-types ONLY — see its own
# Cargo.toml/lib.rs docs for why). The contract/TCK is adopted across the modality
# fleet; the universal governed artifact protocol and served state machine now live
# here as well. Tensor/geo remain value-level contract implementations, while
# document/media are production served modalities through the facade's
# `modality-serving` feature.
# CONCEPT:E4 / EG-P1-3 — document/image/audio/video are governed served modality
# leaves. Native runtimes extract bounded UTF-8 structure + private lexical postings,
# decode PNG pixels + pHash, decode PCM/WAV + waveform/spectral windows, and parse
# ISOBMFF tracks/sample tables + raw RGB frames. Every leaf persists SHA-256 content
# identity and normalized source-free features, maintains native posting indexes, and
# executes exact typed predicates through the universal artifact/evidence protocol.
# eg-alignment is the shared alignment graph:
#   * eg-alignment -- the shared alignment graph (CONCEPT:EG-P1-3): a typed
#     structure connecting document spans <-> image regions <-> audio intervals <->
#     video frames/shots <-> extracted entities <-> claims <-> source blobs (nodes
#     wrap `eg_modality::EvidenceLocus` plus bare entity/claim/blob ids; edges are a
#     typed `AlignmentRelation`), plus an `EvidenceResolver` seam that resolves an
#     `EvidenceLocus` to its located artifact. Depends on `eg-modality` ONLY in its
#     default build (no heavy artifact-crate dependency); its integration test pulls
#     eg-document/eg-image/eg-audio/eg-video as DEV-dependencies only (does not
#     affect what a consumer of the published `eg-alignment` library links).
# Runtime modules remain feature boundaries at the leaf and are enabled by the main
# `modality-serving` facade feature.

[package]
name = "epistemic-graph"
version = "2.24.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Rust-native durable multimodal and epistemic database for governed AI systems"
license = "MIT"

[lib]
name = "epistemic_graph"
crate-type = ["rlib"]

[[bin]]
name = "epistemic-graph-server"
path = "src/main.rs"
required-features = ["server"]

# Longer fault-injection soak for the correctness harness (CONCEPT:KG-2.212). Only
# builds under `--features harness` (which pulls `raft`); a default/server/full build
# does not compile it. `cargo test --features raft harness::` runs the bounded
# deterministic gauntlet; this bin runs the unbounded seeded soak.
[[bin]]
name = "nemesis"
path = "src/bin/nemesis.rs"
required-features = ["harness"]

# Offline K-shard migration tool (CONCEPT:EG-030, M3). Rewrites an existing durable
# store into a NEW shard count K using EG-026 routing. Needs the redb backend.
[[bin]]
name = "migrate-shards"
path = "src/bin/migrate_shards.rs"
required-features = ["redb", "server"]

# Restore a durable persist-dir from an EG-090 backup bundle (CONCEPT:EG-090). Verbatim
# import via the EG-030 engine; supports re-shard-on-restore. Needs the redb backend.
[[bin]]
name = "restore"
path = "src/bin/restore.rs"
required-features = ["redb", "server"]

# Fixture-scale Delta/Iceberg write-format export tool (W4.8, CONCEPT:EG-317). Drives
# the REAL `eg-lake` production write path (`LakeTable::materialize`/`delta_log`/
# `iceberg`/`iceberg_manifests` — the identical calls `src/server/lake::LakeManager`
# makes) directly against a plain local directory (bypassing the server/blob-CAS/
# network entirely), so the Python test suite's read-parity tests
# (`tests/test_lake_iceberg_delta_parity.py`) can point a REAL, unmodified pyiceberg/
# deltalake reader at genuinely engine-written files with no HTTP/catalog plumbing
# in between. Needs only the `lake` feature (no `server`/`blob`/`tsdb` — it writes
# straight to disk with `std::fs`).
[[bin]]
name = "lake-fixture-export"
path = "src/bin/lake_fixture_export.rs"
required-features = ["lake"]

# SQLite-style embedded usage (CONCEPT:KG-2.216). Needs the in-process library API.
[[example]]
name = "embedded"
path = "examples/embedded.rs"
required-features = ["embedded"]

[features]
# ── ONE main build (CONCEPT:EG-371) ──
# The DEFAULT build IS the full-featured build. There is no longer a pi/pi-max/node
# tier distinction: `cargo build` (and the single published wheel) links ALL MAIN
# features that build without an external toolchain/GPU — compute, the Tokio server,
# SQL (query/DataFusion), Cypher, GraphQL, redb-authoritative durability, ANN vectors,
# RDF/SPARQL/OWL reasoning, the security stack, and the whole hand-rolled wire family
# (pgwire/mysql/mssql/sqlite/bolt/redis/amqp/mqtt/stomp). It targets Raspberry Pi 4+
# (NOT Pi 3). Two OPT-IN layers stack ON TOP and are NOT published as separate wheels:
#   * `cluster`     — openraft HA replication + distributed compute (multi-node).
#   * `full-extras` — the real CUDA + ROS2/DDS backends (need a GPU/robotics toolchain
#                     to RUN; build clean everywhere via dynamic-loading).
# INVARIANTS: NO Python extension bindings in the server build (`bindings="bin"`, gated
# by the no-extension source/binary CI check), NO openraft in the main build
# (`cluster`-only), and NO cudarc/Dust-DDS/CycloneDDS in the main build
# (`full-extras`-only) — asserted by `cargo tree`.
default = ["graph", "algorithms", "metrics", "full"]

graph = []
algorithms = []
# Prometheus observability: request/latency/in-flight counters, per-graph
# gauges and a /metrics HTTP listener (--metrics-addr). ON by default; opt out
# with --no-default-features for a leaner lib-only build.
metrics = ["dep:prometheus", "eg-types/metrics"]
# OpenTelemetry OTLP span export (CONCEPT:EG-091). Layers a `tracing-opentelemetry`
# batch OTLP exporter ON TOP of the existing `tracing` subscriber, additively: it
# installs ONLY when built with this feature AND `EPISTEMIC_GRAPH_OTLP_ENDPOINT` is
# set, exporting the spans the engine already emits — no new spans, no behavior
# change when off/unset. All four dependencies remain isolated behind
# `#[cfg(feature = "otel")]`; the default `full` artifact enables the feature while
# an explicitly slim, no-default-feature build can omit it. Implies `server` because
# subscriber initialization lives in the served process.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "server",
]
finance = ["eg-compute/finance", "eg-types/finance"]
ast = ["eg-compute/ast"]
# Extended-language grammar tier (CONCEPT:KG-2.106), folded into `full`.
ast-extended = ["eg-compute/ast-extended"]
datascience = ["eg-compute/datascience", "eg-types/datascience"]
# Data-mining domain (CONCEPT:EG-KG.mining.frequent-itemset-mining): association-rule
# mining (Apriori/FP-Growth/Eclat) + the `graph_mine` surface. Pure-Rust, no heavy
# dep, folded into `full`. Gates eg-compute/mining + eg-types/mining + the
# handlers/mining.rs dispatch arm.
mining = ["eg-compute/mining", "eg-types/mining"]
# Graph-learning / neuro-symbolic domain (CONCEPT:EG-KG.graphlearn.link-predictor): a
# pure-Rust KAN link-predictor over the resident graph + the `graph_learn` surface,
# whose learned per-feature edge functions are queryable `:EdgeFunction` KG nodes.
# Pure-Rust (no torch — heavy training is delegated to data-science-mcp), folded into
# `full` via `compute`. Gates eg-compute/graphlearn + eg-types/graphlearn + the
# handlers/graphlearn.rs dispatch arm. Implies datascience (shared Adam kernels).
graphlearn = ["datascience", "eg-compute/graphlearn", "eg-types/graphlearn"]
# ML pipeline (CONCEPT:EG-KG.mining.ml-pipeline): the composable train→eval→serve→
# predict surface over a versioned `:Model` artifact, generalizing the KAN one-off. It
# COMPOSES existing eg-compute primitives — classify (mining), regression estimators
# (datascience), the KAN link-predictor (graphlearn), structural embeddings + metrics —
# so it pulls all three domains + eg-types/ml-pipeline. Gates the handlers/pipeline.rs
# dispatch arm. Pure-Rust, folded into `full` via `compute`.
ml-pipeline = ["mining", "datascience", "graphlearn", "eg-types/ml-pipeline"]
reasoning = ["eg-compute/reasoning"]
# Engine-native epistemic layer (CONCEPT:EG-KG.epistemic.epistemic-substrate, E6+E2): the
# eg-epistemic leaf crate (claims/evidence/belief-state + confidence propagation) over
# the EXISTING NodeData/EdgeData fields (no new persistence). Pulls eg-epistemic (pure
# Rust: eg-types + eg-core + eg-compute/reasoning — no heavy dep) + eg-types/epistemic
# (the pure-serde `as_claim` wire gate, E6) + eg-plan/epistemic (E2: the
# `Op::{EvidenceFor,Contradicts,SupportedBy,BeliefAsOf,SourceReliability,ConfidenceOp,
# ExplainBelief}` UQL/plan surface + its `BELIEF AS OF`/`VALID AS OF`/… keywords — IMPLIES
# `query` because those ops live inside the `query`-gated `Op` enum, beside `owl`/
# `probabilistic`/`tensor`). Gates the ADDITIVE mining→epistemic-object write-back (E6): with
# `mining` ALSO on, `MineAssociate`/`MineCluster`/`MineAnomaly`/`MineSequence`/`MineForecast`/
# `MineSubgraph` accept `as_claim=true` and materialize a `:Claim` (+ `:Evidence`) per
# finding, SUPPORTS-linked so `eg_epistemic` can propagate belief over them. Additive: with
# `as_claim` unset the write-back is byte-identical, and a build without `query` simply lacks
# the E2 plan ops (the E6 mining write-back is unaffected either way). The default
# `full` artifact enables this feature.
epistemic = [
    "query",
    "dep:eg-epistemic",
    "eg-types/epistemic",
    "dep:eg-plan",
    "eg-plan/epistemic",
    # X1 (CONCEPT:E4): `dep:eg-modality` makes `eg_modality::EvidenceLocus` nameable in
    # `explain_provenance`'s `evidence_locus_wire` mapper (see that dep's own comment —
    # `eg-plan/epistemic` above already links `eg-modality` transitively; this adds no
    # new weight, only visibility).
    "dep:eg-modality",
]
# L51 — policy-aware proof redaction + selective disclosure wired onto the
# `Method::ExplainBelief` facade surface (`disclosure_level`): turns on
# `eg-epistemic`'s own `epistemic-redaction` feature (which pulls `eg-core/security`
# for the SAME `IsolationLayer`/`RowVisibility` every other RLS-aware read path
# already links) and requires `epistemic` + `security` so the handler's
# `caller`/`rls` context is always present alongside it. WS-1b: included in the one
# main `full` build — LIGHT (no new dep, no
# expensive recompute, reuses the always-linked RLS check). The formerly
# opt-in TMS/causal siblings are also in the one main build as of P2 closure.
# `--all-features` still enables it (redundantly, once `full` already does).
epistemic-redaction = ["epistemic", "security", "eg-epistemic/epistemic-redaction"]
# L53 + L46 — the bitemporal/paraconsistent-TMS query family
# (`why`/`why_not`/`what_changed`/`what_evidence_would_change_this`/`is_believed`/the
# `epistemic_status` acceptance capstone) wired onto the facade as
# `Method::EpistemicStatus`/`Method::WhatChanged`, AND EPI-P3-2's server-side
# durable incremental projection that consumes committed base-fact
# `RemoveNode`/`RemoveEdge`/`CompareAndSetNodeFields` from the write path
# (`mutation::commit_finalize`'s post-commit hook) into
# eg-epistemic's `TruthMaintenance` index (`ChangeEvent`/`on_change`). Turns on
# `eg-epistemic`'s own `epistemic-tms` feature; implies `epistemic` (the wire `Method`
# variants + facade `eg-epistemic` dep, which also satisfies the write-path hook's bare
# `eg-epistemic` need). HEAVY (paraconsistent Dung argumentation grounded/preferred/
# stable extension search is NP-hard in the worst case). It is included in the
# one main `full` build; expensive searches remain request-bounded and the
# incremental projection worker avoids full-graph steady-state recomputation.
epistemic-tms = ["epistemic", "eg-epistemic/epistemic-tms"]
# X-1 (CONCEPT:EG-X1) — the multimodal-evidence citation resolver wired onto the
# facade as `Method::ExplainEvidence`: given a claim/evidence node id, walk the
# SAME support/contradiction/attack `BeliefGraph` topology `ExplainBelief` walks
# and return every transitively-cited node's complete governed `EvidenceLocus`
# (page region, audio/video interval, row version, code range, trace span, …).
# Turns on `eg-epistemic`'s own
# `evidence-graph` feature (no new dependency — it reuses the SAME optional
# `eg-modality` dep `epistemic` already links for `EvidenceLocusWire`); implies
# `epistemic` (the wire `Method` variant + facade `eg-epistemic` dep). WS-1b: included
# in the one main `full` build — LIGHT,
# same posture as `epistemic-redaction` above. `--all-features` still enables it
# (redundantly, once `full` already does).
evidence-graph = ["epistemic", "eg-epistemic/evidence-graph"]
# EPI-P3-3 — calibrated causal reasoning + provenance-aware retrieval ranking
# wired onto the facade as `Method::CausalEstimate` (do-calculus intervention
# over a request-carried linear-Gaussian structural causal model) and
# `Method::RankByProvenance` (rank request-carried retrieval candidates by
# evidence quality/provenance, not similarity alone). Turns on `eg-epistemic`'s
# own `epistemic-causal` feature (pure Rust, no new dependency — see that
# crate's `Cargo.toml`); implies `epistemic` (the wire `Method` variants +
# facade `eg-epistemic` dep). HEAVY (genuine Pearl do-calculus intervention/
# counterfactual computation). It is included in the one main `full` build.
epistemic-causal = ["epistemic", "eg-epistemic/epistemic-causal"]
# CONCEPT:EG-321 — the Analytics-Program numeric kernel (eg-numeric: nalgebra + ndarray,
# BLAS/LAPACK-free). Links the PURE Rust kernel (rlib) for Surface B in-database
# analytics — the Python-extension FFI layer is behind eg-numeric's OWN `python`
# feature (OFF here), so the engine's `numeric` feature pulls nalgebra/ndarray but NO Python
# FFI (the Plan-01 no-Python-extension-in-engine contract + its `scripts/`
# CI gate stay green). It is included in the one main `full` build and therefore in
# both source-built layers. Surface A is compiled from eg-numeric with `--features
# python` and injected into the SAME published epistemic-graph wheel; it is not a
# separate published package.
# CONCEPT:EG-329 — the main build also includes the SQL query surface, so turn on its
# `numeric` feature so the eg-numeric-backed Surface-B SQL UDFs/UDAFs
# (`cosine_sim`/`l2_normalize`/`zscore`/`covariance`) register on the
# DataFusion context. The weak `eg-query?/numeric` edge keeps the feature composable
# for targeted crate checks; it does not define another supported product build.
numeric = ["dep:eg-numeric", "eg-query?/numeric"]
# Native eg-ann IVF-PQ + OPQ + SQ8-refine vector index (CONCEPT:KG-2.207) as the
# SemanticStore compression backend alongside the in-tree native HNSW index. Pure-Rust,
# CPU integer-table serving (no GPU/native-ML/faiss in the tree). It is included in
# the one main build; a persisted index reopens WITHOUT rebuilding from raw vectors.
ann = ["eg-core/ann", "dep:eg-ann"]
# Persist the ANN codes into the redb durable tier too (needs `redb`).
ann-redb = ["ann", "redb", "eg-core/ann-redb"]
# CONCEPT:EG-P0-2 -- `dep:eg-capabilities` folded in here (not a standalone feature):
# the mutation gateway (`src/server/mutation.rs`) is server-only, so the binary
# linking the MethodPolicy ledger is exactly the `server` build, matching every other
# server-only dependency in this list.
server = ["dep:tokio", "dep:clap", "dep:tracing-subscriber", "dep:async-trait", "dep:eg-capabilities"]
# Pure-Rust TLS/mTLS for the native MessagePack TCP service. The one main build
# includes it so remote-engine deployments can terminate TLS in the binary.
server-tls = ["server", "dep:rustls", "dep:tokio-rustls"]
# Durable redb store (CONCEPT:KG-2.177 / KG-2.195). Pulls the redb crate + the
# PURE durable-row machinery (`redb_store` — table layout, Method→rows apply,
# checkpoint/load, group-commit) which is server-INDEPENDENT (no Tokio). The
# server's write-through/authoritative `PersistenceBackend` impl (`redb_backend`)
# is layered ON TOP and is itself gated on `server` (it talks to `ServerState`
# + the Tokio dispatch). So `redb` alone (no `server`) compiles a usable durable
# store — exactly what the EMBEDDED API drives on an edge host with no Tokio.
redb = ["dep:redb", "dep:eg-mutation-store"]
# Streamed content-addressed BLOB substrate (CONCEPT:KG-2.206): the bytes tier
# under multimodal `:Media`/`:Blob`. Pulls `redb` (the native CAS lives in
# `blob.redb`) + `server` (the streaming protocol rides the Tokio transport). The
# native redb-CAS links NO object-store SDK — that remains isolated behind the
# explicit `blob-s3` source feature below. `blob` is included in the one main build.
blob = ["server", "redb", "eg-types/blob"]
# Generic namespaced Key→Value surface (CONCEPT:EG-022): the `Method::Kv*` ops over a
# redb-backed `(namespace, key) -> bytes` store, so the engine is a drop-in KV store.
# Pulls `server` (the handler routes through the Tokio dispatch) + `redb` (the durable
# `kv.redb` substrate; no persist dir ⇒ in-memory scratch). It adds no dependency
# beyond redb and is included in the one main build. A targeted feature build without
# it drops the Kv* arm.
kv = ["server", "redb", "eg-types/kv"]
# S3/MinIO object-store chunk backend behind the SAME `ChunkStore` trait
# (CONCEPT:KG-2.206). It is separate from `blob` and absent from the main, `cluster`,
# and `full-extras` bundles, so only an explicit source build selecting `blob-s3`
# links the `object_store` SDK (asserted by cargo tree).
blob-s3 = ["blob", "dep:object_store"]
# L21 / W4.7 (CONCEPT:EG-P1-3 follow-up, DONE) — a REAL `eg_alignment::EvidenceResolver`
# backed by the engine's own blob CAS: `src/server/blob/cas_resolver.rs`'s
# `CasEvidenceResolver` looks a locus's opaque subject up in a `GraphView` snapshot's
# stored `blob_ref` property, then reads the actual bytes back off the SAME
# content-addressed `ChunkStore` the `blob` feature already wires (`stream_blob_get`) —
# a `CharacterRange` or `CodeSymbol` resolves to a real UTF-8 excerpt; every other
# address kind yields a `ResolvedArtifact::Blob` naming the real CAS digest, never a
# fabricated excerpt. `eg-alignment` cannot reach the blob CAS itself by design (a leaf
# crate BELOW the server, deps = eg-modality ONLY — see its own crate docs on why it
# ships no resolver implementation of its own), so the resolver lives HERE instead: the
# one place that already links both `eg-alignment` (for the `EvidenceResolver` trait)
# and the blob CAS (`blob`, for `ChunkStore`). Pulls `blob` + `dep:eg-alignment` +
# `dep:eg-modality` (the `EvidenceLocus` type, already nameable under `epistemic` — this
# makes it nameable standalone too, with no new dependency CLASS). Included in
# the one main `full` serving build. `cas_resolver`'s own tests prove a cross-modal
# `AlignmentGraph` join (doc span <-> image region <-> claim) resolving end-to-end
# through fixture CAS content — the alignment graph itself never links `blob`; only
# this resolver does.
alignment = ["blob", "dep:eg-alignment", "dep:eg-modality"]
# CONCEPT:INT-P2-1 — the durable analytics-job plane: `Method::AnalyticsJob` (async
# submit/status/cancel/resume over a redb-backed `AnalyticsJob` state machine) +
# `src/server/handlers/jobs.rs`. Pulls `server` (Tokio dispatch) + `mining` (the
# reference job kind reuses `eg_compute::mining::association`) + `epistemic` (the
# result-commit path writes the SAME `:Claim`/`:Evidence` convention `eg-epistemic`
# reads) + `dep:eg-jobs` (the durable store + state machine) + the matching
# `eg-types/jobs` and `eg-capabilities/jobs` wire/policy features (kept in LOCKSTEP —
# see both crates' own docs on why `eg-types/jobs` can never be forced on
# unconditionally by `eg-capabilities`). Included in the one main `full` build.
jobs = [
    "server", "mining", "epistemic",
