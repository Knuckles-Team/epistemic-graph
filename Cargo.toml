# CDC read / incremental continuous-query / watch+trigger surfaces are driven over the
# SAME one-Response-per-Request transport (cursor / long-poll — no side-channel). The
# core is a bounded VecDeque ring + a tokio Notify: PURE-RUST, NO heavy dep, so it is
# Pi-lean and folded into pi/node/cluster/full. Needs `server` (the handler routes
# through dispatch); `eg-types/streaming` carries the Method variants + wire DTOs.
streaming = ["server", "eg-types/streaming"]
# Version-keyed query-RESULT cache (CONCEPT:KG-2.233): caches the serialized bytes
# of a read query (Sql/Cypher/Sparql/UnifiedQuery) on `GraphCore`, keyed by
# `(query-hash, version())`. A repeated identical query on an UNCHANGED graph hits;
# any write bumps the version → miss → recompute (staleness impossible). Pure-Rust
# bounded LRU + hash (NO new dep, NO DataFusion/openraft/object_store), so it is
# Pi-safe and folded into pi/node/cluster/full. The CDC feed (feature `streaming`)
# drives cross-replica invalidation when both are present.
result-cache = ["eg-core/result-cache"]
# Plan-backed materialized views (CONCEPT:EG-KG.storage.plan-backed-matview): a NAMED,
# DURABLE `wire::Plan` over one graph whose RESULT rides the version-keyed, RLS-aware
# result cache. Defining it executes the plan once (via the eg-plan runtime) and caches
# the bytes; a committed write bumps the graph version — and the CDC hub marks the view
# stale (`src/server/matview/`) — so the next Get recomputes, never serving stale rows.
# GENERALIZES the algo-only distributed-compute matview: its Method variants route
# through the `compute-dist` dispatch line, so `matview` IMPLIES `compute-dist`; it needs
# `query` (the Plan AST + runtime), `result-cache` (the result store) and `streaming`
# (the CDC invalidation hook). NOT in `full` (it pulls `compute-dist`/raft, out of the
# node tier) — lives with `cluster`; the reconcile folds it into the tier lines.
matview = [
    "compute-dist",
    "query",
    "result-cache",
    "streaming",
    "eg-types/matview",
]
