[workspace]
members = ["crates/eg-types", "crates/eg-ann", "crates/eg-geo", "crates/eg-tensor", "crates/eg-stream", "crates/eg-core", "crates/eg-compute", "crates/eg-query", "crates/eg-plan", "crates/eg-tsdb", "crates/eg-text", "crates/eg-rdf", "crates/eg-shacl", "crates/eg-shex", "crates/eg-wasm", "crates/eg-graphql", "crates/eg-kvcache", "crates/eg-lake", "crates/eg-numeric"]
# EG-185/186: fold eg-kvcache into node/full (the tiered + shared KV-cache leaf crate,
# a sibling of eg-ann/eg-tensor). Added as a workspace member only; the tier aggregate
# feature lists (node/full) and the path-dep + server-endpoint wiring are folded in by
# the orchestrator / a follow-up, NOT edited here (avoids a tier-line merge conflict).
# CONCEPT:EG-317: fold eg-lake (the LTAP lakehouse-interop leaf crate — Parquet
# materialization + Delta/Iceberg logs + LSN as-of snapshots + Iceberg-REST catalog)
# into node/full behind a `lake` feature. Added as a workspace member ONLY; the tier
# aggregate feature lists (node/full) and the server-endpoint wiring (the async
# materialization tier onto the WAL) are folded in by the orchestrator / a follow-up,
# NOT edited here (avoids a tier-line merge conflict). eg-lake is OUT of pi — its
# heavy arrow/parquet deps live behind `lake`.

[package]
name = "epistemic-graph"
version = "2.2.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "High-performance Rust graph compute engine for AI agents"
license = "MIT"

[lib]
name = "epistemic_graph"
crate-type = ["rlib"]

[[bin]]
name = "epistemic-graph-server"
path = "src/main.rs"
required-features = ["server"]

# Longer fault-injection soak for the correctness harness (CONCEPT:KG-2.212). Only
# builds under `--features harness` (which pulls `raft`); a default/server/full build
# does not compile it. `cargo test --features raft harness::` runs the bounded
# deterministic gauntlet; this bin runs the unbounded seeded soak.
[[bin]]
name = "nemesis"
path = "src/bin/nemesis.rs"
required-features = ["harness"]

# Offline K-shard migration tool (CONCEPT:EG-030, M3). Rewrites an existing durable
# store into a NEW shard count K using EG-026 routing. Needs the redb backend.
[[bin]]
name = "migrate-shards"
path = "src/bin/migrate_shards.rs"
required-features = ["redb", "server"]

# Restore a durable persist-dir from an EG-090 backup bundle (CONCEPT:EG-090). Verbatim
# import via the EG-030 engine; supports re-shard-on-restore. Needs the redb backend.
[[bin]]
name = "restore"
path = "src/bin/restore.rs"
required-features = ["redb", "server"]

# SQLite-style embedded usage (CONCEPT:KG-2.216). Needs the in-process library API.
[[example]]
name = "embedded"
path = "examples/embedded.rs"
required-features = ["embedded"]

[features]
default = ["graph", "algorithms", "metrics"]

graph = []
algorithms = []
# Prometheus observability: request/latency/in-flight counters, per-graph
# gauges and a /metrics HTTP listener (--metrics-addr). ON by default; opt out
# with --no-default-features for a leaner lib-only build.
metrics = ["dep:prometheus", "eg-types/metrics"]
# OpenTelemetry OTLP span export (CONCEPT:EG-091). Layers a `tracing-opentelemetry`
# batch OTLP exporter ON TOP of the existing `tracing` subscriber, additively: it
# installs ONLY when built with this feature AND `EPISTEMIC_GRAPH_OTLP_ENDPOINT` is
# set, exporting the spans the engine already emits — no new spans, no behavior
# change when off/unset. All four deps are OPTIONAL + referenced only under
# `#[cfg(feature = "otel")]`, so a default/pi/full build links NONE of them
# (asserted by `cargo tree`). Implies `server` (the subscriber init lives there +
# tracing-subscriber is server-gated). Pulls tonic/prost/network, so it is kept OUT
# of `pi` — and deliberately NOT folded into `node`/`full` here: the orchestrator
# folds `otel` into node/full at merge time (avoids a tier-line merge conflict with
# concurrent waves).
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "server",
]
finance = ["eg-compute/finance", "eg-types/finance"]
ast = ["eg-compute/ast"]
# Extended-language grammar tier (CONCEPT:KG-2.106), folded into `full`.
ast-extended = ["eg-compute/ast-extended"]
datascience = ["eg-compute/datascience", "eg-types/datascience"]
reasoning = ["eg-compute/reasoning"]
# CONCEPT:EG-321 — the Analytics-Program numeric kernel (eg-numeric: faer + ndarray,
# BLAS/LAPACK-free). Links the PURE Rust kernel (rlib) for Surface B in-database
# analytics — the Python-extension FFI layer is behind eg-numeric's OWN `python`
# feature (OFF here), so a `numeric` engine build pulls faer/ndarray but NO Python
# FFI (the Plan-01 no-Python-extension-in-engine contract + its `scripts/`
# CI gate stay green). Folded into `full` only;
# kept OUT of `pi`/`pi-max`/`node` and the size-optimized `release-tiny` profile so
# faer/ndarray never bloat the lean Raspberry-Pi tier (verified: `cargo tree --features
# pi` links no eg-numeric/faer/ndarray). Surface A (the Python wheel) is a SEPARATE
# maturin build of eg-numeric with `--features python`; see crates/eg-numeric.
numeric = ["dep:eg-numeric"]
# Native eg-ann IVF-PQ + OPQ + SQ8-refine vector index (CONCEPT:KG-2.207) as the
# SemanticStore backend, replacing the rebuild-on-load hnsw_rs index. Pure-Rust,
# CPU integer-table serving (no GPU/native-ML/faiss in the tree) so it is Pi-lean
# and folded into the durable serving tiers (pi/node/cluster/full). A persisted
# index reopens WITHOUT rebuilding from raw vectors.
ann = ["eg-core/ann"]
# Persist the ANN codes into the redb durable tier too (needs `redb`).
ann-redb = ["ann", "redb", "eg-core/ann-redb"]
server = ["dep:tokio", "dep:clap", "dep:tracing-subscriber", "dep:async-trait"]
# Durable redb store (CONCEPT:KG-2.177 / KG-2.195). Pulls the redb crate + the
# PURE durable-row machinery (`redb_store` — table layout, Method→rows apply,
# checkpoint/load, group-commit) which is server-INDEPENDENT (no Tokio). The
# server's write-through/authoritative `PersistenceBackend` impl (`redb_backend`)
# is layered ON TOP and is itself gated on `server` (it talks to `ServerState`
# + the Tokio dispatch). So `redb` alone (no `server`) compiles a usable durable
# store — exactly what the EMBEDDED API drives on the Pi/edge with no Tokio.
redb = ["dep:redb"]
# Streamed content-addressed BLOB substrate (CONCEPT:KG-2.206): the bytes tier
# under multimodal `:Media`/`:Blob`. Pulls `redb` (the native CAS lives in
# `blob.redb`) + `server` (the streaming protocol rides the Tokio transport). The
# native redb-CAS links NO object-store SDK — that is a SEPARATE `blob-s3` feature
# below, so a `blob`/`pi`/default build stays lean (the Pi contract). Folded into
# node/cluster/full so the standard build carries the media substrate; kept OUT of
# bare default + server-only.
blob = ["server", "redb", "eg-types/blob"]
# Generic namespaced Key→Value surface (CONCEPT:EG-022): the `Method::Kv*` ops over a
# redb-backed `(namespace, key) -> bytes` store, so the engine is a drop-in KV store.
# Pulls `server` (the handler routes through the Tokio dispatch) + `redb` (the durable
# `kv.redb` tier; no persist dir ⇒ in-memory scratch). PURE-RUST, Pi-lean (no new dep
# beyond redb, which the durable tiers already carry), so it folds into node/full;
# kept OUT of bare default + server-only. A build without it drops the Kv* arm.
kv = ["server", "redb", "eg-types/kv"]
# S3/MinIO object-store chunk backend behind the SAME `ChunkStore` trait
# (CONCEPT:KG-2.206). SEPARATE from `blob` and NOT folded into any tier bundle, so
# only an explicit `--features blob-s3` build links the `object_store` SDK — the
# Pi/default/full build links no AWS/object-store crate (asserted by cargo tree).
blob-s3 = ["blob", "dep:object_store"]
# Read-only SQL query surface (CONCEPT:KG-2.178). Pulls eg-query + DataFusion/Arrow
# — heavy, so it is OFF by default and folded only into full/all (never the slim
# Raspberry-Pi build). A default build links no DataFusion.
query = ["dep:eg-query", "eg-query/sql", "dep:eg-plan", "eg-plan/query", "eg-types/query", "eg-tsdb?/arrow-seg"]
# Embedded BM25 full-text search + the lexical `RankText` op + the RRF `FuseRrf`
# hybrid (CONCEPT:KG-2.215). Pulls eg-text's Tantivy index (the Rust Lucene —
# zstd-sys etc.) via eg-plan's `text`, which IMPLIES `query`. HEAVY (≈140 transitive
# crates incl. zstd-sys's C build), so it is OFF by default and folded ONLY into
# node/cluster/full — NEVER the slim Raspberry-Pi build. A default/pi build links NO
# Tantivy (asserted by `cargo tree -e normal | grep -i tantivy` ⇒ none). It pulls
# eg-plan (the planner that hosts the op) just as `query` does.
text = ["dep:eg-plan", "eg-plan/text", "eg-types/text", "query"]
# Query federation / foreign sources (CONCEPT:KG-2.232, Lane P): the `Op::ForeignScan`
# SOURCE op + the `RegisterForeignSource` Method. A federated UnifiedQuery reads an
# EXTERNAL source (a REMOTE epistemic-graph engine over the same transport, OR a generic
# HTTP/JSON API) as a RowSet and composes it with the local graph/vector/SQL ops in ONE
# plan. Pulls eg-plan's `federation` (the `ForeignSource` trait + the rustls HTTP client
# `ureq` + hmac/sha2/hex), which IMPLIES `query`. HEAVY-ish (a rustls/ring TLS stack),
# so it is OFF by default and folded into node/cluster/full — NEVER `pi`. A default/pi
# build links NO ureq/rustls/ring (asserted by `cargo tree`); the Pi contract holds.
federation = ["dep:eg-plan", "eg-plan/federation", "eg-types/federation", "query", "server"]
# External relational-SQL federation (CONCEPT:KG-2.239): the THIRD `ForeignSource` kind
# — `ForeignSourceSpec::Sql` — so a federated UnifiedQuery JOINS an external Postgres/MySQL
# table with the LOCAL graph/vector in ONE plan (the "engine federates external SQL" half
# sql-mcp alone cannot give). Pulls eg-plan's `federation-sql` (a `sqlx` client on the
# PURE-RUST `runtime-tokio-rustls` backend — NEVER openssl), which IMPLIES `federation`.
# HEAVY (a SQL driver + a TLS stack), so it is OFF by default and folded into
# node/cluster/full — NEVER `pi`. A default/pi build links NO sqlx/postgres/mysql/openssl
# (asserted by `cargo tree`); the Pi contract holds.
federation-sql = ["dep:eg-plan", "eg-plan/federation-sql", "federation"]
# Spatial / geospatial modality (CONCEPT:EG-083): the `Op::SpatialScan { layer, bbox }`
# SOURCE op + the `Pred::SpatialWithin`/`SpatialDWithin` FILTER predicates, so a spatial
# filter composes with Traverse/Rank/Filter in ONE UnifiedQuery plan. Pulls eg-plan's
# `geo` (the executor + the pure-Rust eg-geo leaf crate: geometry + WKT + planar
# predicates + a packed Hilbert R-tree — only serde, NO GEOS/PROJ/C dep), which IMPLIES
# `query` (the ops live inside the `query`-gated `Op`/`Pred` enums). PURE-RUST so it is
# Pi-SAFE by construction, but spatial is NOT a Pi requirement, so it is OFF by default
# and folded into node/full — kept OUT of `pi` (which stays the lean minimal tier). A
# default/pi build links NO eg-geo (asserted by `cargo tree`).
geo = ["query", "dep:eg-plan", "eg-plan/geo", "eg-types/geo"]
# Array / tensor modality (CONCEPT:EG-085): the `Op::TensorScan { layer }` SOURCE op +
# the `Op::TensorOp { kind }` TRANSFORM op (slice/reduce/elementwise), so an array
# modality composes with Traverse/Rank/Filter in ONE UnifiedQuery plan. Pulls eg-plan's
# `tensor` (the executor + the pure-Rust eg-tensor leaf crate: dense N-D array + ops +
# byte-blob codec — only serde, NO BLAS/LAPACK/C dep), which IMPLIES `query` (the ops
# live inside the `query`-gated `Op` enum). PURE-RUST so it is Pi-SAFE by construction,
# but tensors are NOT a Pi requirement, so it is OFF by default and folded into node/
# full — kept OUT of `pi` (which stays the lean minimal tier). A default/pi build links
# NO eg-tensor (asserted by `cargo tree`).
tensor = ["query", "dep:eg-plan", "eg-plan/tensor", "eg-types/tensor"]
# Event-stream + complex-event-processing (CEP) modality (CONCEPT:EG-088): the
# `Op::Cep { pattern }` TRANSFORM op — interpret a RowSet as a time-ordered event stream
# and run a bounded NFA (Sequence/Within/Absence over sliding/tumbling windows) — so a
# CEP match composes with Traverse/Rank/Filter in ONE UnifiedQuery plan. Pulls eg-plan's
# `stream` (the executor + the pure-Rust eg-stream leaf crate: bounded NFA CEP engine +
# per-event attribute predicates — serde + serde_json only, NO tokio/async/C dep), which
# IMPLIES `query` (the op lives inside the `query`-gated `Op` enum). PURE-RUST so it is
# Pi-SAFE by construction, but streaming CEP is NOT a Pi requirement, so it is OFF by
# default and folded into node/full — kept OUT of `pi` (which stays the lean minimal
# tier). A default/pi build links NO eg-stream (asserted by `cargo tree`). EG-067
# `Op::Window` is the windowing primitive; the live standing-query loop fed by the EG-064
# CDC bus is a documented follow-up.
stream = ["query", "dep:eg-plan", "eg-plan/stream", "eg-types/stream", "dep:eg-stream", "eg-stream/stream"]
# Natural-language query surface (CONCEPT:EG-078/EG-080): the NL→query planning SEAM
# (`eg_plan::NlPlanner` + the LLM-optional `Option<&dyn NlPlanner>` entry point) and the
# concrete standalone `UreqNlPlanner`, plus the facade wiring — the `Method::NlQuery`
# handler + the `/nl` HTTP route. NL is turned into a UQL query STRING by a pluggable
# planner, then run through the IDENTICAL deterministic `UnifiedQueryText` pipeline, so
# the engine core stays pure-Rust + LLM-optional. Pulls eg-plan's `nl-query` (the SAME
# pure-Rust rustls `ureq` client the federation sources use — NO new HTTP dep, NO
# openssl), which IMPLIES `query`. Needs `server` (the handler + route live in the
# facade). HEAVY-ish (the rustls stack), so it is OFF by default and folded into
# node/full — NEVER `pi` (the Pi contract: a `pi` build links no ureq/rustls/ring).
# EG-078/080: fold nl-query into node/full.
nl-query = ["query", "dep:eg-plan", "eg-plan/nl-query", "server"]
# Dep-free Cypher query surface (CONCEPT:KG-2.179): `MATCH … RETURN …` compiled to
# the engine's own primitives (label index / VF2 / BFS) — NO DataFusion, so it is a
# HARD requirement of the lean Pi tier. A `cypher`-only build links no DataFusion
# (the Pi proof).
cypher = ["dep:eg-query", "eg-query/cypher"]
# Native GraphQL READ surface (CONCEPT:KG-2.235): a GraphQL query compiled to scans +
# BFS over the GraphView via the eg-graphql crate (schema-from-graph + a hand-written
# parser + resolver). PURE-RUST — NO async-graphql (evaluated: ~80+ transitive crates +
# a proc-macro schema-derive, too heavy for Pi) — so the Pi contract holds. But GraphQL
# is NOT a Pi requirement, so it is kept OUT of pi/default and folded into node/cluster/
# full. `eg-types/graphql` carries the `Method::GraphQl` variant. Needs `server` (the
# handler routes through dispatch).
graphql = ["dep:eg-graphql", "eg-types/graphql", "server"]
# Native time-series store + TS primitives (CONCEPT:KG-2.210/211). Pulls eg-tsdb's
# redb chunk store + the native ASOF/gap-fill/time_bucket/OHLC/decay primitives —
# NO DataFusion (the Pi contract holds: a `tsdb`-only build links no DataFusion).
# Requires `redb` (the durable series store sits beside graph.redb) + `server` (the
# series handler routes through dispatch). Folded into node/cluster/full; OUT of the
# bare default. When `query` is ALSO on, eg-tsdb's `arrow-seg` lights up the
# DataFusion `time_bucket = GROUP BY (ts/w)*w` leg (see the `query` feature below).
tsdb = ["server", "redb", "dep:eg-tsdb", "eg-tsdb/redb-store", "dep:eg-plan", "eg-plan/timeseries"]
# Observability log ingestion front door + Parquet-on-blob-CAS segments
# (CONCEPT:EG-160/161) — the first slice of Phase T ("surpass OpenObserve"). A
# hand-rolled HTTP listener (the SAME dep-free idiom as `metrics`/`sparql-http` — NO
# axum/hyper, so the Pi contract holds) accepting OTLP/HTTP, Elasticsearch
# `_bulk`/`_doc` and JSON-lines log records, landing them in an eg-tsdb series (time
# range + retention) + a per-stream eg-text Tantivy index (full-text), and rolling
# Parquet columnar segments into the blob CAS (S3 when `blob-s3` is on). IMPLIES
# `tsdb` (series) + `text` (Tantivy full-text — which itself implies `query`) +
# `blob` (the CAS). Pulls the `parquet` crate (+ `arrow`/`bytes` — arrow is already
# in the tree via `query`) for the Arrow→Parquet segment encode. HEAVY (tsdb+Tantivy+
# DataFusion+parquet), so it is OFF by default and — per the Pi contract — kept OUT of
# `pi` (tsdb+Tantivy are already out of pi). DEFINED here but deliberately NOT folded
# into `node`/`full`: the orchestrator folds `obs` into the deployment tiers at merge
# time (avoids a tier-line merge conflict with the concurrent WireProtocol/GIS waves).
obs = [
    "server",
    "tsdb",
    "text",
    "blob",
    "dep:eg-text",
    "eg-text/tantivy",
    "dep:arrow",
    "dep:parquet",
    "dep:bytes",
]
# CONCEPT:EG-172 — PromQL + the Prometheus HTTP query API (`/api/v1/query[_range]`,
# `/labels`) served on the obs listener over the durable eg-tsdb series. Pure-Rust
# parser + evaluator (`eg-tsdb/promql`) + the facade glue in `src/server/promql`; NO
# new heavy dep (the Pi contract holds). Implies `obs` (needs the listener + the
# durable SeriesStore + tsdb). DEFINED here but deliberately NOT auto-included by
# `obs`, and NOT folded into node/full/cluster/pi — the orchestrator folds it at
# merge time to avoid a tier-line conflict with the concurrent wave-18 work.
# EG-172: fold promql into obs/node/full
promql = ["obs", "eg-tsdb/promql"]
# CONCEPT:EG-163 — distributed traces: OTLP-JSON span ingest + a Jaeger/OpenObserve
# trace-search / assembly / service-dependency-graph HTTP API served on the obs
# listener, over the pure-Rust `eg-tsdb/traces` span store + the facade glue in
# `src/server/traces`. Completes the observability trilogy (logs + metrics + traces).
# NO new heavy dep (the Pi contract holds). Implies `obs` (needs the listener +
# ObsState). DEFINED here but deliberately NOT auto-included by `obs`, and NOT folded
# into node/full/cluster/pi — the orchestrator folds it at merge time to avoid a
# tier-line conflict with the concurrent wave-18 work.
# EG-163: fold traces into obs/node/full
traces = ["obs", "eg-tsdb/traces"]
# CONCEPT:EG-316 — the OBSERVABILITY EGRESS half + a Prometheus push receiver. Two
# additive, feature-gated capabilities that close the obs loop the engine already
# INGESTS (logs EG-160, metrics/PromQL EG-172, traces EG-163):
#   1. OTLP EXPORT — push the engine's OWN Prometheus metrics + its stored spans to an
#      external OpenTelemetry collector over OTLP/HTTP JSON (the same OTLP shape the
#      EG-160/163 ingest side parses), via the pure-Rust `ureq` client.
#   2. Prometheus `remote_write` RECEIVER — accept snappy-compressed protobuf
#      `WriteRequest` POSTs (`/api/v1/write`) on the obs listener and land the samples
#      in the durable eg-tsdb SeriesStore, so an external Prometheus can PUSH to us.
# Implies `obs` (the listener + ObsState + SeriesStore), `metrics` (the engine's own
# Prometheus registry to export) and `traces` (the span store to export). Pulls
# `prost` (protobuf codec for the remote-write WriteRequest) + `snap` (snappy block
# decompression) — BOTH pure-Rust, NO C/tonic/network-codegen — plus the already-linked
# `ureq`. DELIBERATELY kept OUT of `pi` (no prost/protobuf in a pi build) and NOT folded
# into node/full/cluster here — the orchestrator folds it at merge time to avoid a
# tier-line conflict with the concurrent wave.
# EG-316: fold otel-export into node/full
otel-export = ["obs", "metrics", "traces", "dep:prost", "dep:snap", "dep:ureq"]
# Streaming / CDC / continuous queries / subscriptions / triggers (CONCEPT:KG-2.229/
# 230, Lane L). Reactivity layered over the existing per-graph durable change record
# (the ledger): every durable mutation the dispatch shell records also emits an
# ordered, cursor-addressable change into a per-graph in-memory feed, from which the
# CDC read / incremental continuous-query / watch+trigger surfaces are driven over the
# SAME one-Response-per-Request transport (cursor / long-poll — no side-channel). The
# core is a bounded VecDeque ring + a tokio Notify: PURE-RUST, NO heavy dep, so it is
# Pi-lean and folded into pi/node/cluster/full. Needs `server` (the handler routes
# through dispatch); `eg-types/streaming` carries the Method variants + wire DTOs.
streaming = ["server", "eg-types/streaming"]
# Version-keyed query-RESULT cache (CONCEPT:KG-2.233): caches the serialized bytes
# of a read query (Sql/Cypher/Sparql/UnifiedQuery) on `GraphCore`, keyed by
# `(query-hash, version())`. A repeated identical query on an UNCHANGED graph hits;
# any write bumps the version → miss → recompute (staleness impossible). Pure-Rust
# bounded LRU + hash (NO new dep, NO DataFusion/openraft/object_store), so it is
# Pi-safe and folded into pi/node/cluster/full. The CDC feed (feature `streaming`)
# drives cross-replica invalidation when both are present.
result-cache = ["eg-core/result-cache"]
# Cold object-store tier seam (CONCEPT:KG-2.233): a `ColdTier` trait (RAM→redb→
# object-store) + an in-memory/redb default impl so a cold graph offloads its whole
# serialized state and rehydrates on access (extends hibernation, CONCEPT:KG-2.224).
# The trait + default are pure-Rust (Pi-safe), folded into pi/node/cluster/full. An
# S3-backed impl lives behind the SEPARATE `cold-tier-s3` feature so the lean build
# links NO object-store SDK.
cold-tier = ["eg-core/cold-tier"]
# S3/object-store ColdTier impl — reuses the blob `ChunkStore` S3 seam. SEPARATE,
# NOT in any tier bundle, so only an explicit build links the object_store SDK.
cold-tier-s3 = ["cold-tier", "blob-s3"]
# Per-tenant memory budget + autoscale signals (CONCEPT:KG-2.234, Lane V —
# cost/efficiency). Tracks an approximate resident-RAM estimate per tenant/graph and
# enforces a configurable budget: a tenant over budget has its COLDEST graphs evicted
# (durability-gated LRU, reusing the KG-2.191 path) and hibernated (KG-2.224) until it
# is back under cap, with a global memory ceiling + fair per-tenant caps so one hot
# tenant cannot starve others. Surfaces the autoscaler-facing signals an external
# autoscaler (agent-utilities OS-5.27) consumes via a `ResourceStats` Method + the
# Prometheus metrics endpoint. PURE-RUST (no DataFusion/openraft/object_store — the
# enforcer is a periodic sweep over the registry + the existing evict/hibernate ops),
# so it folds into pi/node/cluster/full and the Pi contract holds. Needs `server` (the
# budget enforcer + ResourceStats handler live on ServerState + the dispatch path);
# `eg-types/cost` carries the `ResourceStats` Method + the snapshot wire DTOs.
cost = ["server", "eg-types/cost"]
# In-engine Raft replication (CONCEPT:KG-2.188): runs the engine as a multi-node
# HA cluster replicating its AUTHORITATIVE state via openraft. CLUSTER-TIER ONLY —
# OFF by default and NOT in `full`/`all`, so a default / `pi` / `full` build links
# NO openraft. The Pi contract is sacred: no DataFusion AND no openraft in the tree.
# It pulls `redb` because Raft replicates the redb-AUTHORITATIVE store (M2): a
# committed log entry applies through the same PersistenceBackend/GraphCore path.
# Activates only when built `--features raft` AND configured at runtime
# (EPISTEMIC_GRAPH_RAFT_NODE_ID + EPISTEMIC_GRAPH_RAFT_PEERS); off → single-node.
raft = ["server", "redb", "dep:openraft", "dep:futures"]
# Distributed graph compute (CONCEPT:KG-2.227): a Pregel/GAS vertex-centric engine
# that runs PageRank / connected-components / BFS ACROSS graphs spanning multiple
# Raft groups/shards (gather-apply-scatter supersteps, cross-shard messages via the
# existing group RPC), plus incremental/streaming recompute on a delta and named,
# incrementally-maintained MATERIALIZED VIEWS. It needs the multi-Raft groups, so it
# pulls `raft` (cluster-tier) — and is therefore OUT of `pi`/`default`/`full`/`node`,
# folded only into `cluster`. The single-shard fast path is unchanged (always-on
# `algorithms`); this adds the cross-shard superstep coordinator on top.
compute-dist = ["raft", "eg-types/compute-dist"]
# Non-blocking cross-shard commit (CONCEPT:EG-082) — Paxos-Commit-lite. ADDITIVE: the
# default cross-shard path stays classic 2PC (`src/raft/cross_shard_txn.rs`), which
# holds its sole durable COMMIT decision in the coordinator's private redb and so
# inherits 2PC's ONE blocking window (a coordinator crash between decision and apply
# leaves participants in-doubt until IT recovers). This feature adds a SECOND commit
# path whose COMMIT/ABORT decision is instead replicated through a Raft group's log
