# replicated state machine — no dependency on the (possibly-crashed) coordinator's
# private store. Prepare (durable, commit-before-vote), presumed-abort recovery, and
# commit-before-ack are all preserved unchanged. It pulls `raft` and is deliberately
# kept OUT of every deployment tier (pi/node/full/cluster/all) — the orchestrator folds
# it where wanted; a tier build links NOTHING from it. The proof gauntlet compiles it
# under `test`/`harness` too (the new code is `cfg(any(feature="nonblocking", test,
# feature="harness"))`), so `cargo test --features harness` exercises it WITHOUT adding
# it to `harness`'s (or any tier's) feature list.
