medulla-kvcache = { path = "crates/medulla-kvcache", optional = true }
# WASM-sandboxed UDF runtime (feature `wasm-udf`, included in the main build,
# CONCEPT:KG-2.228). Pulls wasmtime + cranelift. The sandboxed `UdfRegistry` lives on
# ServerState.
medulla-wasm = { path = "crates/medulla-wasm", optional = true }
# SPARQL SERVICE federation client (feature `sparql-service`, CONCEPT:MEDULLA-052). The SAME
# pure-Rust rustls HTTP client `federation` already links via medulla-plan — pinned to the
# same 3.x, so activating it here adds a direct edge but no new crate to the tree. The
# main build includes both federation features. Also the JWKS-fetch transport for
# `oidc` (`src/server/oidc.rs::JwtValidator::refresh`).
ureq = { version = "3.4.2", optional = true }
# Keycloak JWT validation, feature `oidc` (`src/server/oidc.rs`): verifies an OIDC
# bearer against the realm JWKS — issuer/audience/expiry, RSA-signature-only (never
# `none`/HMAC). Shared by the KV-cache HTTP surface's bearer guard (`kvcache-server`)
# and the primary `eg2.` protocol's identity binding (`security`). Uses the maintained
# aws-lc-rs JWT backend. Transport TLS remains supplied by the existing `ureq`/rustls
# path.
jsonwebtoken = { version = "11.1", optional = true, default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
petgraph = { version = "0.8.3", features = ["serde-1"] }
rayon = "1.12"
parking_lot = "0.12"
dashmap = "6.2"
ahash = "0.8"
uuid = { version = "1.28", features = ["v4"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"

# Optional Server. Explicit minimal feature set (not "full"): the binary uses an
# explicitly-built multi-thread runtime + UDS/TCP listeners + sync primitives +
# timers + `signal` (SIGTERM/SIGINT graceful shutdown) + `macros` (the
# `tokio::select!` the graceful accept loop awaits on). Tests pull
# dev-dependencies' "full" tokio, so #[tokio::test]/duplex still work. Trims
# compile time + binary surface.
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "macros",
], optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
], optional = true }
tokio-rustls = { version = "0.26", optional = true }
clap = { version = "4.6", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
# `dyn PersistenceBackend` needs object-safe async methods (CONCEPT:KG-2.177);
# matches the existing async persist.rs style without a runtime bridge.
async-trait = { version = "0.1", optional = true }
# Durable embedded KV for the redb write-through substrate (feature `redb`).
redb = { workspace = true, optional = true }
# RF-RULING-004: `medulla-storage` is the SOLE physical authority that opens any
# durable file this binary owns (every `OwnerLayout` its stores declare), and
# `medulla-transaction` is the SOLE mutation authority over them. The root binary is
# the composition root: it mints the one `ScopeGrantVerifier`, holds the one
# `MutationOwnerAuthority` per store, and hands domain crates only the
# capabilities those two kernels issue. Both ride the `redb` feature because
# that is the feature the durable substrate itself rides.
medulla-storage = { path = "crates/medulla-storage", optional = true }
medulla-transaction = { path = "crates/medulla-transaction", optional = true }
# Encryption-at-rest AEAD for the redb durable value blobs (feature `security`,
# included in the main build, CONCEPT:KG-2.231). RustCrypto ChaCha20-Poly1305 is
# pure Rust and links no ring, OpenSSL, or C crate. Cluster builds also use the
# security feature for authenticated Raft transport.
chacha20poly1305 = { version = "0.10", optional = true }
# SQLite `.db` FILE import/export (feature `sqlite-file`, CONCEPT:MEDULLA-331/MEDULLA-332).
# Pure-Rust page-format reader + bulk-load writer — no C dependency.
medulla-sqlite-format = { path = "crates/medulla-sqlite-format", optional = true }
# S3/MinIO object-store chunk backend (feature `blob-s3`, CONCEPT:KG-2.206). The
# ONLY dep that pulls an object-store/AWS SDK, gated behind `blob-s3` (NOT `blob`),
# so the main, cluster, and full-extras bundles link no object_store/AWS crate. Select
# this explicit source feature only when the S3/MinIO backend is required.
# Pinned to the crates.io 0.14.1 release, which raises quick-xml to 0.41.0
# (RUSTSEC-2026-0194/0195) — the fix an earlier `git` pin to the upstream Apache
# revision existed to obtain before 0.14.1 was published. Per the crates.io-only
# dependency edict (AGENTS.md), do not move this back to a `git = `/`rev = ` source.
object_store = { version = "0.14.2", optional = true, features = ["aws"] }
# rosbridge-WebSocket client for the CONCEPT:MEDULLA-325 ROS2 bridge. No-TLS pure-Rust build
# (ws:// to a local rosbridge_server); `connect`+`handshake` only — links NO native-tls/
# openssl. This dependency is selected only by the `full-extras` source-build layer.
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "handshake"] }
# Native pure-Rust DDS/RTPS stack for the CONCEPT:MEDULLA-347 native ROS2 wire (feature
# `ros2-dds`). Dust DDS is 100% Rust — it links NO
# CycloneDDS/rmw/`ros` C toolchain, so unlike a `cyclonedds-rs` leg it builds in CI
# everywhere. It is selected only by the `full-extras` source-build layer.
dust_dds = { version = "0.15", optional = true }
# CycloneDDS-C-backed `rmw` stack for the S5 ROS2-rmw leg (feature `ros2-rmw`,
# CONCEPT:MEDULLA-347 follow-on). `cyclonedds` (a safe Rust wrapper, mzet97/cyclonedds-rust)
# pulls `cyclonedds-rust-sys` (FFI) → `cyclonedds-src` (the CycloneDDS C sources VENDORED
# inside the crate tarball). `cyclonedds-rust-sys`'s build.rs configures+builds the
# vendored source with `cmake` (static lib, BUILD_SHARED_LIBS=OFF, security/SSL/IDLC/
# examples all OFF) and links prebuilt bindgen output shipped in the crate — NO libclang/
# bindgen invocation and NO network fetch at build time (unlike the older `cyclonedds-
# sys`/`cyclonedds-rs` crates, which `git clone` CycloneDDS from GitHub in build.rs and
# do NOT reliably CI-build offline). `default-features = false` + `features = ["std"]`
# only — the crate's own `default`/`async` features would additionally pull `tokio`,
# which this leg does not need (its `DdsTransport` methods are `async fn` wrappers over
# synchronous DDS calls, exactly like the `ros2-dds` Dust DDS leg). OPTIONAL + referenced
# only under `#[cfg(feature = "ros2-rmw")]` in the `full-extras` source-build layer.
# Needs a C toolchain (cc/cmake) to build and a CycloneDDS-compatible ROS2 rmw at
# runtime to interoperate with a live `ros2` daemon.
cyclonedds = { version = "1.8.0", optional = true, default-features = false, features = ["std"] }
# In-engine Raft consensus (feature `raft`, CONCEPT:KG-2.188 / KG-2.272). Bumped to
# openraft 0.10 (the v2 split-storage API + NATIVE `trigger().transfer_leader()` for
# graceful leader handoff — the M2 remainder). `serde` is required because the app
# data (a durable `Method` for a graph) + the log entries cross the wire
# MessagePack-encoded. Selected only by the `cluster` source-build layer. NOTE: 0.10
# ships only as a pre-release (0.10.0-alpha.26) upstream; it
# is the line that carries `transfer_leader`, so we pin the alpha exactly.
openraft = { version = "=0.10.0-alpha.26", features = ["serde"], optional = true }
# Postgres wire-protocol shim (feature `pgwire`, CONCEPT:KG-2.189). `server-api`
# is the server-side handler set; `_ring` selects the ring crypto backend for the
# SCRAM/TLS machinery (we pass tls=None, but the feature must pick a backend to
# build). default-features off keeps the client API + extra type codecs out.
pgwire = { version = "0.40", optional = true, default-features = false, features = [
    "server-api",
    "_ring",
] }
# Race-safe TLS material opens for pgwire. `rustix` supplies typed
# O_NOFOLLOW|O_NONBLOCK flags on Unix; `windows-sys` supplies the typed reparse
# attribute/flag constants used by the corresponding Windows handle open.
rustix = { version = "1.1.5", optional = true, features = ["fs"] }
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Storage_FileSystem"] }
# Stream/sink combinators for the pgwire DataRow result stream (feature `pgwire`).
futures = { version = "0.3", optional = true }
# SHA-1 digest for the hand-rolled MySQL `mysql_native_password` auth exchange
# (feature `mysql-wire`, included in the main build, CONCEPT:MEDULLA-076). Pure Rust; the
# mysql_native_password specification mandates SHA-1 specifically.
sha1 = { version = "0.10", optional = true }
# The identity store (feature `security`): argon2id password and one-time
# code hashing at the request boundary. RustCrypto, pure Rust, no default
# features (no OS RNG coupling -- salts come from the engine's `rand`). SHA-1
# above is reused for RFC 6238 TOTP, whose default HMAC is HMAC-SHA1.
argon2 = { version = "0.5", optional = true, default-features = false, features = ["alloc", "password-hash"] }

# Optional Prometheus observability (feature `metrics`, on by default).
# default-features = false drops the protobuf encoder — text exposition only.
prometheus = { version = "0.14", optional = true, default-features = false }
# OpenTelemetry OTLP span export (feature `otel`, included in the main build,
# CONCEPT:MEDULLA-091). The batch span processor runs on the tokio runtime
# (`opentelemetry_sdk` `rt-tokio`); `grpc-tonic` is the OTLP transport.
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33.1", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", optional = true, features = ["grpc-tonic"] }
tracing-opentelemetry = { version = "0.34", optional = true }
# CONCEPT:MEDULLA-316 — protobuf codec for the Prometheus `remote_write` WriteRequest, and
# snappy block decompression for its wire framing. BOTH are pure-Rust (NO C, NO
# tonic/grpc, NO build.rs codegen — the WriteRequest schema is hand-declared with the
# `prost::Message` derive). Both are selected through `otel-export`, which is included
# in the main build.
prost = { version = "0.14", optional = true }
snap = { version = "1.1", optional = true }
hmac = "0.12"
hex = "0.4"
rmp-serde = "1.3"
lazy_static = "1.5"
sha2 = "0.10"
rand = "0.8"
# Advisory file locking for the single-writer persist-dir guard (Phase B1):
# exactly one engine may own a persist dir, closing the split-brain/orphan class
# at the engine level (complements the Python-side spawn guard).
fs4 = "1.1"
serde_bytes = "0.11.19"


[dev-dependencies]
tokio = { version = "1.53", features = ["full", "test-util"] }
tempfile = "3"
clap = { version = "4.6", features = ["derive", "env"] }
tracing-subscriber = "0.3"
# Real Postgres client for the pgwire wire round-trip integration test
# (CONCEPT:KG-2.189). Only compiled for tests; never linked into the engine.
tokio-postgres = "0.7"
# Compile the `.wat` WASM UDF fixtures to wasm in the server-dispatch UDF test
# (CONCEPT:KG-2.228). Only compiled for tests with `--features wasm-udf`.
wat = "1"
# Integration tests in `tests/` construct a full `ServerState` literal directly, so
# they must be able to name the crates behind the feature-gated fields the lib's own
# (`crate::`-pathed) test literals use: `parking_lot::Mutex` for the `compute-dist`
# matview store and `medulla_wasm::UdfRegistry` for the `wasm-udf` registry. Already linked
# by the relevant facade features — declaring them here only makes the names resolvable
# from an integration test (e.g. `tests/pgwire_roundtrip.rs` under `--features cluster`).
parking_lot = "0.12"
medulla-wasm = { path = "crates/medulla-wasm", features = ["wasm-udf"] }
# `src/server/mutation_batch/tests.rs` calls `medulla_query::TableStore::open_temp`,
# which medulla-query gates on `cfg(any(test, feature = "dev-scope-grant"))`.
# `cfg(test)` does NOT cross a crate boundary -- it is set only while compiling
# medulla-query's OWN tests -- so a consumer needs the feature. No root feature
# forwards it, which meant `cargo test -p medulla-engine --all-features` could
# not compile the root test suite at all: it built only under
# `cargo test --workspace --all-features`, where the workspace-wide flag happens
# to turn the feature on in medulla-query directly. That is an invisible dependency
# on how the suite is invoked, and it fails as a confusing "no associated
# function `open_temp`" rather than as a missing feature.
#
# Declared as a DEV-dependency (same precedent as `medulla-wasm` above) so the
# feature is on for test/bench builds and stays off in the engine -- which is
# what medulla-query's gate is protecting: `open_temp` supplies its own dev scope
# grant, and a production build must not be able to link one.
medulla-query = { path = "crates/medulla-query", features = ["dev-scope-grant"] }
# Cross-crate repository-enrichment snapshot fixture for parser and Raft tests.
# The feature is test-only; release builds retain the ordinary medulla-compute dependency.
medulla-compute = { path = "crates/medulla-compute", features = ["test-support"] }
# `medulla_types::test_support` (the shared SQL source batch fixture) for the lib's
# own tests; `cfg(test)` does not cross the crate boundary, same reason as above.
medulla-types = { path = "crates/medulla-types", features = ["test-support"] }
medulla-kernel = { path = "crates/medulla-kernel", features = ["test-support"] }
# Criterion harness for the write-coalescer contention bench (CONCEPT:MEDULLA-012)
# and the massive-scale core harness (CONCEPT:MEDULLA-096). DEV-only — never linked
# into the engine binary; zero release-build impact.
criterion = "0.8"
# Write-coalescer `__commons__` contention reproduction (CONCEPT:MEDULLA-012): N
# concurrent producers fan single-op writes into ONE graph, swept across the batch
# window so the lock-acquisition / throughput contention curve is visible. The
# coalescer is Tokio-based and lives behind the `server` feature, so this bench is
# gated to it (a default `cargo check --benches` skips it). Flamegraph-ready via
# `cargo flamegraph --features server --bench write_coalescer_bench`.
[[bench]]
name = "write_coalescer_bench"
path = "benches/write_coalescer_bench.rs"
harness = false
required-features = ["server"]

# Redb durable group-commit micro-linger reproduction (CONCEPT:MEDULLA-024): N concurrent
# authoritative writers fanned into ONE redb backend, swept across the linger knob so
# the ops-per-fsync (batch-size) win over the commit-on-drain baseline is visible.
# Needs the redb backend + tokio server runtime, so it is gated to `--features full`
# (a default `cargo check --benches` skips it). DEV-only; never linked into the binary.
[[bench]]
name = "redb_group_commit_bench"
path = "benches/redb_group_commit_bench.rs"
harness = false
required-features = ["full"]

# Per-write redb latency decomposed by commit phase (EH-290): strictly sequential
# awaited `record_durable` writes through the real shard-writer -> commit_ops ->
# transaction-kernel -> redb path, swept across graph sizes, beside raw-redb
# Immediate/None one-row floors on the same disk. Prints p50/p95/p99 end to end and
# per `commit_phase` tracing span. `--features full` only; DEV-only.
[[bench]]
name = "redb_write_latency_bench"
path = "benches/redb_write_latency_bench.rs"
harness = false
required-features = ["full"]

# Schema-drift classification hot-path receipt (MEDULLA-TYPED-PACKS-R712): the
# five-way classifier of `medulla_types::graph_schema::drift` over a 1,000-field
# approved contract, rotated over deterministic drift shapes; prints p50/p99
# and the process RSS growth (budget: p50 < 0.5 ms, p99 < 3 ms, memory < 16
# MiB). Touches only the unconditional `medulla-types` `graph_schema` surface, so
# it builds under any feature set; run with
# `cargo bench --features full --bench schema_drift_classify`. DEV-only;
# never linked into the engine binary.
[[bench]]
name = "schema_drift_classify"
path = "benches/schema_drift_classify.rs"
harness = false

# Massive-scale core micro-benchmark harness (CONCEPT:MEDULLA-096): in-process node/edge
# write throughput, in-process query latency (single-hop + label lookup), and IVF-PQ
# kNN search latency. Feature-LIGHT — builds under DEFAULT features (no server/redb),
# so a plain `cargo bench --no-run` compiles it while the two benches above skip. Uses
# a dep-free deterministic PRNG so no `rand` dev-dep is pulled. DEV-only; never linked
# into the engine binary.
[[bench]]
name = "eg096_massive_scale_bench"
path = "benches/eg096_massive_scale_bench.rs"
harness = false
required-features = ["ann", "broker"]

# ── Cold-open vs warm-read of the redb durable tier (Phase-2 T-E1) ──────────────
# Times a fresh `RedbBackend` reopen + first point-read vs a subsequent warm read, so
# the cold/warm p50 delta (the reopen amortization cost) is measurable. Needs the redb
# backend + tokio server runtime, so `required-features = ["full"]`.
[[bench]]
name = "cold_warm_reopen"
path = "benches/cold_warm_reopen.rs"
harness = false
required-features = ["full"]

# Provenance-anchoring write-path overhead (provenance anchoring, CONCEPT:MEDULLA-KG.sharding.row-level-security):
# N concurrent authoritative writers fanned into ONE redb backend, with vs.
# without a concurrent (deliberately aggressive) anchor-sweep loop contending
# for the SAME writer thread, so the anchoring job's write-throughput overhead
# is a measured wall-clock delta rather than an assumption. Needs the `security`
# feature (redb backend + the provenance-anchor primitives); a default
# `cargo check --benches` skips it. DEV-only; never linked into the binary.
[[bench]]
name = "provenance_anchor_bench"
path = "benches/provenance_anchor_bench.rs"
harness = false
required-features = ["security"]

# In-process (the shape medulla-pyengine embeds) vs out-of-process (UDS wire) latency
# for the SAME AddNode/GetNodeProperties op (unified-binary program, workstream
# W-A; see
# docs/architecture/unified-inprocess-engine.md). Both arms call the IDENTICAL
# `medulla::graph::GraphCore` mutation — the in-process arm calls it
# directly (what `medulla-pyengine` does), the out-of-process arm additionally pays
# real length-prefixed MessagePack framing over a real Unix domain socket
# (what the served transport does), isolating the transport tax the "two
# deployment shapes, one performance discipline" edict is about. Needs the
# redb-independent server runtime bits (tokio) only — `required-features =
# ["server"]`; a default `cargo check --benches` skips it. DEV-only; never
# linked into the binary.
[[bench]]
name = "pyo3_inprocess_vs_uds_bench"
path = "benches/pyo3_inprocess_vs_uds_bench.rs"
harness = false
required-features = ["server"]

# MEDULLA-ORCH-VOCAB-R801.6 hot-path receipt: the engine's per-write path for the
# versioned harness components — pre-commit admission (strict decode,
# evidence checks, immutability + head-relative supersession checks, the
# bitemporal stamp and the supersession link) plus the RAM projection — over
# a growing 1,000-version chain; prints p50/p99 against the spec budget (p99
# under 5 ms) and exits nonzero on a regression. Needs the server module the
# admission lives in; a default `cargo check --benches` skips it. DEV-only;
# never linked into the engine binary.
[[bench]]
name = "harness_components"
path = "benches/harness_components.rs"
harness = false
required-features = ["server"]

[[bench]]
name = "harness_lessons"
path = "benches/harness_lessons.rs"
harness = false
required-features = ["server"]

[profile.release]
opt-level = 3
# thin (not fat) LTO. EVIDENCED: the aarch64 wheel cross-build (zig/qemu under
# maturin-action) fat-LTO-ing the full DataFusion/Tantivy tree exhausts the CI runner —
# publish-pypi `linux (aarch64)` FAILED on a fat-LTO commit (910633b) and PASSED on the
# otherwise-identical thin-LTO commit (9682237). thin LTO keeps ~all the runtime perf at
# a fraction of the link-time memory, so the cross-built `--release` wheels build in CI.
# (Distinct from the Release Build node-leg failure, which was a duplicate --manylinux
# arg — fixed in release-build.yml.)
lto = "thin"
codegen-units = 1
# unwind (not abort): the engine is a long-running multi-tenant server — a panic in one
# request/handler must unwind, NOT abort the whole process and kill every tenant's graph.
panic = "unwind"
strip = true

# The Go/JavaScript clients' embedded eg2. method-body codec
# (`crates/medulla-method-codec`, built for wasm32-unknown-unknown by
# `scripts/build_method_codec_wasm.py`). The module is committed into both
# clients and re-derived byte-for-byte in CI, so every setting is chosen for
# the smallest reproducible module: optimize for size ("z"), fat LTO, one
# codegen unit, no debug info, stripped, and abort-on-panic (the module has no
# host to unwind into).
[profile.method-codec]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"

# Size-optimized release profile for the "contains-all smallest" pre-packaged build
# (the Pi never compiles — wheels are cross-built in CI, so the C-dep/long compile is
# a build-host concern only). Inherits `release` but trades runtime speed for a
# smaller stripped binary: opt-level "z" (optimize for size), fat LTO + a single
# codegen unit (max cross-crate inlining/dead-code elimination), strip symbols.
# `panic = "unwind"` is DELIBERATE and OVERRIDES the `release` `abort`: this is a
# DATABASE — unwind keeps a panic recoverable at the dispatch boundary instead of
# aborting the whole process and masking a recoverable error. Normal `release` builds
# are unaffected (this is a separate named profile).
# Size profile for the standalone `medulla-server` package (built natively on
# x86_64 and aarch64 from packaging/medulla-server, so fat LTO has no cross-build
# memory limit). panic = "unwind": the multi-tenant server must not abort every tenant on one panic.
[profile.release-server]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Test-suite acceleration (D-PERF-1): no [profile.test]/[profile.dev] tuning
# existed before this, so `cargo test`/`cargo nextest run` paid full debug-info
# codegen for every one of the 65 workspace crates x 25 integration binaries —
# measured at ~2.3GB per heavy test binary. `debug = 0` (line-number-only via
# split-debuginfo would still emit a .dSYM-equivalent; we don't need symbols at
# all for routine green/red runs) removes nearly all of that weight; a real
# panic backtrace still resolves function names via the existing symbol table,
# it just loses inlined variable-level DWARF -- acceptable for CI/local gates,
# and any engineer debugging a specific failure can rebuild that one binary
# with `CARGO_PROFILE_TEST_DEBUG=1` (or `line-tables-only`) for a symbol-rich
# rebuild without touching this default. `opt-level = 1` cuts codegen (and,
# more importantly, LINK) time relative to opt-level 0 by keeping generated
# object code smaller -- 0 sometimes generates MORE code (no inlining of
# trivial wrappers) which paradoxically slows the link step on a workspace
# this wide. `incremental = true` is cargo's own default for dev/test but is
# named explicitly here so local iterative `cargo test -p <crate>` reruns stay
# fast; nextest's process-per-test model does not defeat incremental caching
# (it reuses the one already-linked binary, it just forks a process per test).
[profile.test]
opt-level = 1
debug = 0
incremental = true
codegen-units = 256

# Mirrors [profile.test] for `cargo check`/`cargo build --dev`/`cargo clippy`
# (clippy compiles under the dev profile) so the clippy gates get the same
# faster-link win as the test gates. `debug = "line-tables-only"` (not `0`,
# unlike [profile.test]) is deliberate: this profile also serves interactive
# `cargo run`/`cargo build` during development, so it keeps enough DWARF for a
# panic backtrace / gdb `bt` to resolve file:line, just not full variable-level
# inspection -- most of the size win, without making a live debugging session
# on a plain `cargo build` blind.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true
codegen-units = 256

# Private portable zstd RustSec remediation candidate; do not publish this path block.
[patch.crates-io]
apache-avro = { path = "vendor/zstd-parent-patches/apache-avro-0.21.0" }
arrow-ipc = { path = "vendor/zstd-parent-patches/arrow-ipc-58.4.0" }
iceberg = { path = "vendor/zstd-parent-patches/iceberg-0.10.1" }
parquet = { path = "vendor/zstd-parent-patches/parquet-58.4.0" }
