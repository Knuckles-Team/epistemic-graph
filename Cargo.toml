# Non-blocking cross-shard commit (CONCEPT:EG-082) — Paxos-Commit-lite. ADDITIVE: the
# default cross-shard path stays classic 2PC (`src/raft/cross_shard_txn.rs`), which
# holds its sole durable COMMIT decision in the coordinator's private redb and so
# inherits 2PC's ONE blocking window (a coordinator crash between decision and apply
# leaves participants in-doubt until IT recovers). This feature adds a SECOND commit
# path whose COMMIT/ABORT decision is instead replicated through a Raft group's log
# (an `AddNode` into a `__xshard_decisions__` decision graph committed via that group's
# `client_write`), so ANY surviving replica/participant can LEARN the outcome from the
# replicated state machine — no dependency on the (possibly-crashed) coordinator's
# private store. Prepare (durable, commit-before-vote), presumed-abort recovery, and
# commit-before-ack are all preserved unchanged. It pulls `raft` and is included in the
# source-built `cluster` layer. The proof gauntlet compiles it
# under `test`/`harness` too (the new code is `cfg(any(feature="nonblocking", test,
# feature="harness"))`), so `cargo test --features harness` also exercises it.
nonblocking = ["raft"]
# FULL Calvin deterministic-ordering cross-shard commit (CONCEPT:EG-324). ADDITIVE: a
# THIRD commit path alongside 2PC and Paxos-Commit-lite. Instead of an OCC prepare +
# vote round, a global `CalvinSequencer` stamps each cross-shard txn with a monotone
# total-order position, that ORDER is replicated through the Raft decision group (the
# Calvin "input log"), and participants EXECUTE it deterministically with no vote and no
# abort — so agreement on the order IS agreement on the outcome and a crashed coordinator
# is resolved by any node replaying the replicated sequence. Reuses the EG-082 replicated
# decision-graph machinery (hence `implies nonblocking`); the new code is
# `cfg(any(feature="calvin", test, feature="harness"))`, so `cargo test --features
# harness` exercises it. Pure-Rust, NO new dep. It is an explicit source feature outside
# all product bundles; the main and `cluster` paths are unchanged unless it is selected.
calvin = ["nonblocking"]
