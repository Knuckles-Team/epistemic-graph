[workspace]
members = ["crates/eg-types", "crates/eg-core", "crates/eg-compute", "crates/eg-query", "crates/eg-plan"]

[package]
name = "epistemic-graph"
version = "0.33.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "High-performance Rust graph compute engine for AI agents"
license = "MIT"

[lib]
name = "epistemic_graph"
crate-type = ["rlib"]

[[bin]]
name = "epistemic-graph-server"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["graph", "algorithms", "metrics"]

graph = []
algorithms = []
# Prometheus observability: request/latency/in-flight counters, per-graph
# gauges and a /metrics HTTP listener (--metrics-addr). ON by default; opt out
# with --no-default-features for a leaner lib-only build.
metrics = ["dep:prometheus", "eg-types/metrics"]
finance = ["eg-compute/finance", "eg-types/finance"]
ast = ["eg-compute/ast"]
# Extended-language grammar tier (CONCEPT:KG-2.106), folded into `full`.
ast-extended = ["eg-compute/ast-extended"]
datascience = ["eg-compute/datascience", "eg-types/datascience"]
reasoning = ["eg-compute/reasoning"]
server = ["dep:tokio", "dep:clap", "dep:tracing-subscriber", "dep:async-trait"]
# Durable redb write-through persistence tier (CONCEPT:KG-2.177). OFF by default —
# snapshot+WAL stays the shipped behavior; redb is opt-in via this feature AND
# EPISTEMIC_GRAPH_PERSIST_BACKEND=redb at runtime.
redb = ["server", "dep:redb"]
# Read-only SQL query surface (CONCEPT:KG-2.178). Pulls eg-query + DataFusion/Arrow
# — heavy, so it is OFF by default and folded only into full/all (never the slim
# Raspberry-Pi build). A default build links no DataFusion.
query = ["dep:eg-query", "eg-query/sql", "dep:eg-plan", "eg-plan/query", "eg-types/query"]
# Dep-free Cypher query surface (CONCEPT:KG-2.179): `MATCH … RETURN …` compiled to
# the engine's own primitives (label index / VF2 / BFS) — NO DataFusion, so it is a
# HARD requirement of the lean Pi tier. A `cypher`-only build links no DataFusion
# (the Pi proof).
cypher = ["dep:eg-query", "eg-query/cypher"]
# In-engine Raft replication (CONCEPT:KG-2.188): runs the engine as a multi-node
# HA cluster replicating its AUTHORITATIVE state via openraft. CLUSTER-TIER ONLY —
# OFF by default and NOT in `full`/`all`, so a default / `pi` / `full` build links
# NO openraft. The Pi contract is sacred: no DataFusion AND no openraft in the tree.
# It pulls `redb` because Raft replicates the redb-AUTHORITATIVE store (M2): a
# committed log entry applies through the same PersistenceBackend/GraphCore path.
# Activates only when built `--features raft` AND configured at runtime
# (EPISTEMIC_GRAPH_RAFT_NODE_ID + EPISTEMIC_GRAPH_RAFT_PEERS); off → single-node.
raft = ["server", "redb", "dep:openraft"]
# Postgres wire-protocol shim (CONCEPT:KG-2.189). A facade-only listener that lets
# psql / BI tools / ORMs run SQL against a graph, reusing the eg-query DataFusion
# path (so it IMPLIES `query`) over the Tokio server (`server`). Heavy (pgwire +
# postgres-types) — OFF by default and kept OUT of `full` so `full` stays a lean
# embeddable build; it ships only in the `cluster` tier. The listener only starts
# when ALSO configured via EPISTEMIC_GRAPH_PGWIRE_ADDR.
pgwire = ["dep:pgwire", "dep:futures", "query", "server"]
compute = ["finance", "ast", "ast-extended", "datascience", "reasoning"]
# `full`/`all` deliberately stay SINGLE-NODE: raft is NOT folded in, so a `full`
# build links no openraft (matching the tier intent — replication is cluster-only).
# `redb` IS folded in (CONCEPT:KG-2.195 — THE FLIP) so the standard full/all build
# is authoritative-by-default (a durable source of truth) just like pi/node/cluster.
full = ["compute", "server", "query", "cypher", "redb"]
all = ["full"]

# ── Pi ↔ Cluster deployment tier bundles ──
# Convenience feature sets spanning the deployment spectrum. `pi` is the lean
# durable in-memory build with NO DataFusion (Raspberry-Pi contract) — but it
# DOES carry the dep-free `cypher` query surface (CONCEPT:KG-2.179): Cypher is a
# hard requirement of the Pi tier and links no DataFusion. `node` layers SQL +
# compute on top; `cluster` is `node` + in-engine Raft replication
# (CONCEPT:KG-2.188). A sibling track (M8) also extends `cluster` with `pgwire`;
# an integration step unions them — keep the raft part here.
pi = ["server", "graph", "algorithms", "redb", "cypher"]
node = ["pi", "query", "reasoning", "finance", "datascience", "ast"]
# `cluster` = `node` + in-engine Raft replication (CONCEPT:KG-2.188, M7b) + the
# Postgres wire shim (CONCEPT:KG-2.189, M8). The two sibling tracks each extended
# `cluster`; this integration unions both halves so the cluster tier links raft
# AND pgwire (and transitively datafusion via `query`).
cluster = ["node", "raft", "pgwire"]

[dependencies]
eg-types = { path = "crates/eg-types" }
eg-core = { path = "crates/eg-core" }
# Compute domains (always linked for `algorithms`, used by the graph-op handlers);
# the heavy finance/datascience/ast/reasoning code + deps are gated behind the
# facade features that pass through to eg-compute's matching features.
eg-compute = { path = "crates/eg-compute" }
# Optional SQL query surface (feature `query`); pulls DataFusion only when enabled.
eg-query = { path = "crates/eg-query", optional = true }
# Optional unified cross-modal planner (feature `query`, CONCEPT:KG-2.208/209). Its
# DataFusion FILTER leg is gated by eg-plan's own `query`; pulled only with the
# facade `query`, so a default/Pi build links neither it nor DataFusion.
eg-plan = { path = "crates/eg-plan", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
petgraph = { version = "0.6.4", features = ["serde-1"] }
rayon = "1.10"
parking_lot = "0.12"
dashmap = "6.1"
ahash = "0.8"
uuid = { version = "1.8", features = ["v4"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"

# Optional Server. Explicit minimal feature set (not "full"): the binary uses an
# explicitly-built multi-thread runtime + UDS/TCP listeners + sync primitives +
# timers, and nothing from process/signal/fs. Tests pull dev-dependencies' "full"
# tokio, so #[tokio::test]/duplex still work. Trims compile time + binary surface.
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
], optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
# `dyn PersistenceBackend` needs object-safe async methods (CONCEPT:KG-2.177);
# matches the existing async persist.rs style without a runtime bridge.
async-trait = { version = "0.1", optional = true }
# Durable embedded KV for the redb write-through tier (feature `redb`).
redb = { version = "4.1", optional = true }
# In-engine Raft consensus (feature `raft`, CONCEPT:KG-2.188). Pinned to the latest
# 0.9.x stable; `serde` is required because the app data (a durable `Method` for a
# graph) + the log entries cross the wire MessagePack-encoded. CLUSTER-TIER ONLY:
# optional + only referenced under #[cfg(feature = "raft")], so a default/pi/full
# build links no openraft (verified by `cargo tree`).
openraft = { version = "0.9", features = ["serde"], optional = true }
# Postgres wire-protocol shim (feature `pgwire`, CONCEPT:KG-2.189). `server-api`
# is the server-side handler set; `_ring` selects the ring crypto backend for the
# SCRAM/TLS machinery (we pass tls=None, but the feature must pick a backend to
# build). default-features off keeps the client API + extra type codecs out.
pgwire = { version = "0.40", optional = true, default-features = false, features = [
    "server-api",
    "_ring",
] }
# Stream/sink combinators for the pgwire DataRow result stream (feature `pgwire`).
futures = { version = "0.3", optional = true }

# Optional Prometheus observability (feature `metrics`, on by default).
# default-features = false drops the protobuf encoder — text exposition only.
prometheus = { version = "0.14", optional = true, default-features = false }
hmac = "0.12"
hex = "0.4"
rmp-serde = "1.3"
lazy_static = "1.4"
sha2 = "0.10"
rand = "0.8"
hnsw_rs = "0.3"
# Advisory file locking for the single-writer persist-dir guard (Phase B1):
# exactly one engine may own a persist dir, closing the split-brain/orphan class
# at the engine level (complements the Python-side spawn guard).
fs4 = "0.8"
serde_bytes = "0.11.19"


[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing-subscriber = "0.3"
# Real Postgres client for the pgwire wire round-trip integration test
# (CONCEPT:KG-2.189). Only compiled for tests; never linked into the engine.
tokio-postgres = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
