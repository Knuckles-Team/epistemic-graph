# STRIP heavy deps (DataFusion, etc.) for a tiny Pi-3 binary, at the cost of every tier
# sharing the SAME wheel filename (only one could publish to PyPI). The main build
# (`default` == `full`) now carries every MAIN feature; these two bundles are the ONLY
# things layered ON TOP, selected explicitly at build time and NEVER published as their
# own wheel:
#
