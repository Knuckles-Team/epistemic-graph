# wiring convention documented at those features' definitions), now closed.
# The retired `pi`/`pi-max`/`node` deployment tiers (EG-371, just above) no longer
# exist to fold it into separately — `full` (== `default`) is the one main build. `contract`
# (eg-tensor/eg-geo's own opt-in `ModalityContract` retrofit feature, `eg-epistemic`'s
# own `contract` submodule gate) stays OUT of every product build here, confirmed: it is a
# capability-discovery/testing seam selected per-crate directly (`cargo test -p
# eg-epistemic --features contract`), never part of the served product surface — `cargo
# tree --features full | grep -i contract` links no `contract`-gated code.
#
# WS-1b (2026-07-12): `epistemic-redaction` (policy-aware proof redaction / selective
