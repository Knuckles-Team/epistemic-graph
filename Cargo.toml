geosparql = ["sparql", "geo", "eg-rdf/geosparql"]
# W3C SPARQL 1.1 Protocol HTTP endpoint (CONCEPT:EG-017): a minimal hand-rolled
# HTTP/1.1 listener (the SAME dep-free idiom as the Prometheus `--metrics-addr`
# exposition — NO axum/hyper/warp) so existing Stardog/Jena/rdflib SPARQL clients can
# query + update the engine unchanged via `--sparql-addr`. IMPLIES `sparql` (+ `server`
# for the Tokio listener). Pure-Rust; no new native dep. Folded into node/full.
sparql-http = ["sparql", "server"]
# SPARQL SERVICE federation (CONCEPT:EG-052): the `/sparql` endpoint's SELECT path binds a
# `ureq`-backed `RemoteSparql` client so a `SERVICE <ep> { … }` clause evaluates against a
# remote endpoint (SILENT semantics, SSRF allowlist `EPISTEMIC_GRAPH_SPARQL_SERVICE_ALLOW`,
# default fail-closed). REUSES the SAME `ureq`/rustls stack `federation` already links (NO
# new crate enters the tree), so it IMPLIES both `sparql-http` and `federation`. HEAVY-ish
# (rustls/ring) → kept OUT of `pi`; folded into node/full.
sparql-service = ["sparql-http", "federation", "dep:ureq"]
# Super-cluster federated search (CONCEPT:EG-243): a `/federated` POST surface that fans a
# read query across a registry of peer engine instances AND the local store, then unions /
# de-dups + RRF-re-ranks the partials (a slow/dead peer degrades to `partial: true` +
# `failed_peers` instead of failing). REUSES the SAME pure-Rust `ureq`/rustls stack the
# other federation surfaces link (NO new HTTP crate enters the tree); SSRF-vetted with the
# SAME allowlist/internal-range guard as EG-052. HEAVY-ish (rustls/ring) → kept OUT of
# `pi`; folded into node/full by the orchestrator (NOT edited into the tier lists here).
federation-search = ["server", "dep:ureq"]
# ROS2 bridge over the rosbridge-WebSocket JSON protocol (CONCEPT:EG-325). Bridges engine
# CDC events ↔ ROS2 topics by talking the standard `rosbridge_suite` JSON-over-WebSocket
# protocol (advertise/subscribe/publish/unsubscribe) to a `rosbridge_server` — so NO
# CycloneDDS/rmw/DDS C stack, NO `ros` toolchain, just a pure-Rust `tokio-tungstenite`
# client. HEAVY-ish (a WebSocket stack) + robotics is NOT a Pi requirement → kept OUT of
# `pi`/`default`/`node`; the orchestrator folds it into an extras bundle. A default/pi
# build links NO tokio-tungstenite (asserted by `cargo tree`).
ros2-bridge = ["server", "streaming", "dep:tokio-tungstenite", "dep:futures"]
# Native DDS/RTPS ROS2 wire (CONCEPT:EG-347) — the native leg of the ROS2 transport seam
# (`src/server/dds.rs`, the `DdsTransport` trait). Where `ros2-bridge` (EG-325) tunnels
# ROS2 topics through a `rosbridge_server` over WebSocket JSON, this leg speaks REAL
# DDS/RTPS on the wire so the engine's CDC↔ROS2 topic path can publish/subscribe to a
# ROS2 graph DIRECTLY — behind the SAME `DdsTransport` interface, so the path targets
# EITHER transport. It uses the PURE-RUST `rustdds` crate (a native Rust DDS + RTPS impl:
# mio/pnet/speedy/cdr-encoding — NO CycloneDDS/rmw/`ros` C toolchain), so, unlike a
# `cyclonedds-rs`/`rmw` leg, it ACTUALLY builds in CI everywhere (no C dep). But robotics
# is NOT a Pi requirement and DDS pulls a large transitive tree, so it is kept OUT of
# `pi`/`default`/`node`/`full` — folded ONLY into the opt-in `full-extras` bundle. A
# default/pi/node/full build links NO rustdds (asserted by `cargo tree`). The
# CycloneDDS-C-backed `rmw` leg stays a documented, toolchain-gated future option.
ros2-dds = ["server", "streaming", "dep:rustdds", "dep:futures"]
# GPU-accelerated distance/tensor (CONCEPT:EG-326 seam / EG-327 CUDA). `gpu` opts the
# eg-ann distance + eg-tensor elementwise kernels into the `DistanceBackend`/`TensorBackend`
# dispatch seam (the pure-Rust CPU backend stays the compiled-in fallback). `gpu-cuda` adds
# the REAL cudarc-backed CUDA backends — `dynamic-loading`, so the leg BUILDS with no CUDA
# toolkit (libcuda/libnvrtc are dlopen'd at runtime) and runs on a GPU host, else falls back
# to CPU. HEAVY + not a Pi requirement → kept OUT of pi/default/node/full; the orchestrator
# folds them into an extras bundle. A default/pi build links NO cudarc (Pi contract, asserted
# by `cargo tree --features pi`).
gpu = ["ann", "eg-core/ann-gpu", "tensor", "eg-plan/tensor-gpu"]
gpu-cuda = ["gpu", "eg-core/ann-gpu-cuda", "eg-plan/tensor-gpu-cuda"]
# Opt-in umbrella (CONCEPT:EG-371) = the ONE main build (`full`) PLUS the heavy extras that
# require an external toolchain/GPU to actually RUN (but build clean everywhere via
# dynamic-loading): the real CUDA backends + the rosbridge ROS2 bridge + native DDS/RTPS.
# This is a build LAYER on top of the main build for a GPU/robotics deployment — NOT folded
# into `default`/`full` and NOT published as its own wheel. The default/main build links NO
# cudarc/rustdds (asserted by `cargo tree`).
full-extras = ["full", "gpu-cuda", "ros2-bridge", "ros2-dds"]
# Native OWL 2 reasoner (CONCEPT:KG-2.219): EL⁺ completion + RL property rules,
# classification / consistency / incremental materialization + justifications. The
# `OwlReason` Method surface. PURE-RUST — it parses OWL from the SAME oxttl as `rdf`,
# links NO C/native crate (no horned-owl/whelk-rs) — so it folds into pi/node/full
# beside rdf/sparql with NO Pi-contract breach (no DataFusion). IMPLIES `sparql`.
owl = ["sparql", "eg-rdf/owl", "eg-types/owl"]
# OWL-DL tableau reasoner (CONCEPT:EG-059) — the complete-but-worst-case-harder DL
# path (full cardinality/negation/nominals/reasoning-by-cases) that the tractable `owl`
# EL⁺/RL path cannot decide. Pure Rust, no new dep. IMPLIES `owl`. Pi contract: OUT of
# `pi` (a Pi node runs only the tractable fast path); folded into node/full.
owl-dl = ["owl", "eg-rdf/owl-dl"]
# The OWL/SPARQL cross-modal plan SOURCE ops `Op::Reason` / `Op::SparqlBgp`
# (CONCEPT:KG-2.220) inside a UnifiedQuery plan. The unified-plan executor needs
# DataFusion, so this IMPLIES `query` (it is NOT Pi-safe) — kept OUT of `pi`, folded
# into node/full where `query` already lives. Pulls eg-plan's `owl` (the op exec).
owl-plan = ["owl", "query", "eg-plan/owl", "eg-types/owl-plan"]
# OBDA / R2RML virtual graphs (CONCEPT:EG-KG.query.r2rml-virtual-graph / EG-KG.query.obda-query-rewrite,
# Track J): expose the engine's OWN SQL user-tables (`eg_query::TableStore`, behind
# `query`) as a virtual RDF graph via an R2RML-style mapping (`eg_rdf::obda`, behind
# `sparql`) — a `Method::SparqlVirtual` query rewrites to a projection-pushed scan of
# the table and evaluates SPARQL over a TRANSIENT view, never materializing the whole
# dataset. IMPLIES `sparql` + `query` (mirrors `owl-plan`'s split rationale — the bare
# OBDA library in eg-rdf is Pi-safe; wiring it to user tables needs DataFusion). Pure
# Rust; no new external dep. Folds into node/full beside sparql/query.
obda = ["sparql", "query", "eg-types/obda"]
# Opt-in lossless redb `quads` table for multi-valued-literal predicates the
# property blob can't hold (CONCEPT:KG-2.217). Rides the engine `redb` tier.
rdf-redb = ["rdf", "redb", "eg-rdf/rdf-redb", "eg-plan?/rdf-redb"]
# SHACL Core validation (CONCEPT:EG-132) — the pure-Rust eg-shacl engine over the
# RDF term/graph model. IMPLIES `rdf` (it validates RDF data against an RDF shapes
# graph); the `Method::ShaclValidate` handler is gated on this feature. Pure Rust —
# links NO C/native dep (regex rides eg-rdf's sparql stack) — so it folds into
# node/full alongside rdf/sparql. Kept OUT of `pi`.
shacl = ["rdf", "dep:eg-shacl"]
# ShEx (Shape Expressions) Core validation (CONCEPT:EG-133) — the pure-Rust eg-shex
# engine, the complement to `shacl`. IMPLIES `rdf` (it validates focus nodes of an RDF
# data graph against a ShExJ schema); the `Method::ShexValidate` handler is gated on this
# feature. Pure Rust — links NO C/native dep (regex rides eg-rdf's sparql stack,
# serde_json is workspace-wide) — so it CAN fold into node/full alongside rdf/sparql/shacl.
# DELIBERATELY NOT folded into `node`/`full` here: the orchestrator folds `shex` into the
# tier lines at merge time (avoids a tier-line merge conflict with concurrent waves). Kept
# OUT of `pi`.
shex = ["rdf", "dep:eg-shex"]
compute = ["finance", "ast", "ast-extended", "datascience", "mining", "graphlearn", "reasoning"]
# `full`/`all`/`default` = THE ONE MAIN BUILD (CONCEPT:EG-371). It deliberately stays
# SINGLE-NODE: raft is NOT folded in, so a `full` build links no openraft (replication
# is the opt-in `cluster` layer). Consequently `compute-dist` (which NEEDS raft for
# cross-shard supersteps) is NOT in `full` either — it ships only in `cluster`. Every
# other MAIN feature that builds without an external GPU/robotics toolchain IS folded in
# here: the whole hand-rolled wire family (pgwire — CONCEPT:EG-352 — PLUS the pure-Rust
# mysql/mssql/sqlite/bolt/redis/amqp/mqtt/stomp listeners, formerly cluster-only), the
# observability egress (`otel-export`), the compressed KV-cache warm tier
# (`kvcache-compression`) and the redb-persisted ANN codes (`ann-redb`). `redb` IS folded
# in (CONCEPT:KG-2.195 — THE FLIP) so the standard build is authoritative-by-default.
# What stays OUT of the main build (explicit opt-in only): openraft/`raft` (the `cluster`
# layer), `gpu-cuda`/`ros2-bridge`/`ros2-dds` (the `full-extras` layer), the object-store
# SDK legs (`blob-s3`/`cold-tier-s3`), and `calvin` (opt-in per-call, needs raft).
# Engine-level security (CONCEPT:KG-2.231, Lane O): per-agent Row-Level Security
# (the read/plan-path view filter), encryption-at-rest for the redb durable value
# blobs, and a hash-chained tamper-evident audit log over the ledger. PURE-RUST end
# to end: RLS + audit chain link only `sha2`/`hmac` (already deps, RustCrypto) — NO
# C; encryption pulls `chacha20poly1305` (RustCrypto AEAD, pure-Rust, NO ring/openssl).
# Encryption-at-rest also rides the redb tier, so it implies `redb`. Folded into
# node/cluster/full; kept OUT of bare default + the lean `pi` tier (encryption is not
# a Pi requirement and the Pi build stays minimal — the RLS/audit core is itself
# pure-Rust and Pi-safe, but is shipped only where `security` is selected).
security = ["redb", "dep:chacha20poly1305", "eg-types/security", "eg-core/security"]
full = ["compute", "server", "query", "cypher", "graphql", "eg-graphql/crossmodal-tsdb", "redb", "ann", "ann-redb", "tsdb", "blob", "kv", "text", "sparql", "sparql-http", "sparql-hash", "rdf-xml", "json-ld", "sparql-star", "sparql-service", "rdf-redb", "shacl", "owl", "owl-dl", "owl-plan", "obda", "streaming", "wasm-udf", "security", "federation", "federation-sql", "pgwire", "mysql-wire", "mssql-wire", "sqlite-wire", "bolt-wire", "redis-wire", "broker", "amqp-wire", "mqtt-wire", "stomp-wire", "geo", "tensor", "stream", "result-cache", "cold-tier", "cost", "cost-opt", "otel", "otel-export", "shex", "obs", "geosparql", "nl-query", "promql", "traces", "s3-api", "federation-search", "kvcache-server", "kvcache-compression", "numeric", "sqlite-file"]
all = ["full"]

# ── Opt-in build layers ON TOP of the ONE main build (CONCEPT:EG-371) ──
# The former `pi` / `pi-max` / `node` deployment tiers are GONE — they existed only to
# STRIP heavy deps (DataFusion, etc.) for a tiny Pi-3 binary, at the cost of every tier
# sharing the SAME wheel filename (only one could publish to PyPI). The main build
# (`default` == `full`) now carries every MAIN feature; these two bundles are the ONLY
# things layered ON TOP, selected explicitly at build time and NEVER published as their
# own wheel:
#
#   * `cluster`     — the main build PLUS in-engine Raft replication (CONCEPT:KG-2.188)
#                     + distributed graph compute (CONCEPT:KG-2.227, `compute-dist` — the
#                     cross-shard Pregel engine over the multi-Raft groups) + non-blocking
#                     cross-shard commit (`nonblocking`). This is HA / multi-node: it pulls
#                     openraft, which the single-node main build deliberately does NOT.
#   * `full-extras` — the main build PLUS the real CUDA (`gpu-cuda`) + ROS2 bridge/DDS
#                     (`ros2-bridge`/`ros2-dds`) backends. They build clean everywhere via
#                     dynamic-loading but need a GPU / robotics toolchain to actually RUN.
#                     (`full-extras` is defined next to `gpu-cuda`/`ros2-dds` above.)
#
# INVARIANTS (asserted by `cargo tree`): the main/default build links NO openraft
# (cluster-only) and NO cudarc/rustdds (full-extras-only). It DOES link DataFusion now
# (query is a main feature) — the old "no-DataFusion Pi contract" is retired; the build
# targets Raspberry Pi 4+, not Pi 3.
cluster = ["full", "raft", "compute-dist", "nonblocking", "matview"]

[dependencies]
eg-types = { path = "crates/eg-types" }
eg-core = { path = "crates/eg-core" }
# Compute domains (always linked for `algorithms`, used by the graph-op handlers);
# the heavy finance/datascience/ast/reasoning code + deps are gated behind the
# facade features that pass through to eg-compute's matching features.
eg-compute = { path = "crates/eg-compute" }
# Engine-native epistemic layer (feature `epistemic`, CONCEPT:EG-KG.epistemic.epistemic-substrate,
# E6). Pure-Rust leaf (eg-types + eg-core + eg-compute/reasoning) — claims/evidence/
# belief-state + confidence propagation over the EXISTING NodeData/EdgeData fields.
# Referenced only under `#[cfg(feature = "epistemic")]` (the mining→claim write-back +
# its tests), so a build without `epistemic` links no eg-epistemic.
eg-epistemic = { path = "crates/eg-epistemic", optional = true }
# CONCEPT:EG-321 — Analytics-Program numeric kernel (feature `numeric`, in `full`,
# out of `pi`). Links only the PURE rlib (faer + ndarray, NO Python-extension FFI —
# that layer is behind eg-numeric's OWN `python` feature, off here) for Surface B
# in-database analytics. Referenced only under `#[cfg(feature = "numeric")]`, so a
# default/pi build links no eg-numeric/faer/ndarray (asserted by `cargo tree --features pi`).
eg-numeric = { path = "crates/eg-numeric", optional = true }
# Optional SQL query surface (feature `query`); pulls DataFusion only when enabled.
eg-query = { path = "crates/eg-query", optional = true }
# Optional unified cross-modal planner (feature `query`, CONCEPT:KG-2.208/209). Its
# DataFusion FILTER leg is gated by eg-plan's own `query`; pulled only with the
# facade `query`, so a default/Pi build links neither it nor DataFusion.
eg-plan = { path = "crates/eg-plan", optional = true }
# The `ModalityContract` trait + the `EvidenceSpan` shape (CONCEPT:E4/X1). Referenced
# only under `#[cfg(feature = "epistemic")]` (`src/server/handlers/query.rs`'s
# `evidence_span_wire`, mapping `eg_plan::KnowledgeRow::evidence_refs` onto the wire
# `EvidenceSpanWire`), so a build without `epistemic` links none of it. `eg-plan`
# already links it unconditionally (deps = eg-types only, per its own crate docs), so
# this adds no NEW transitive dependency to the tree — only makes the type nameable
# here too.
eg-modality = { path = "crates/eg-modality", optional = true }
# Optional live CEP standing-query engine (feature `stream`, CONCEPT:EG-088/EG-299). The
# BATCH `Op::Cep` executor already pulls eg-stream transitively via `eg-plan/stream`; this
# DIRECT edge (with eg-stream's own `stream` feature, the ONLY thing that pulls tokio in
# that leaf crate) makes `eg_stream::live::CepEngine` nameable so the server can own a live
# standing-query surface (`src/server/cep.rs`) fed by the CDC hub. Pulled ONLY under
# `stream`; a default/pi build links no eg-stream (and never its tokio bits).
eg-stream = { path = "crates/eg-stream", optional = true }
# Optional native time-series store + primitives (feature `tsdb`, CONCEPT:KG-2.210/
# 211); pulls redb only (native primitives), and DataFusion only when `query` is ALSO
# on (its `arrow-seg` feature, enabled transitively by the facade `query` feature).
eg-tsdb = { path = "crates/eg-tsdb", optional = true }
# Optional embedded BM25 full-text index (feature `obs`, CONCEPT:EG-160). Reused
# DIRECTLY for the per-stream log text index. Pulled (with its `tantivy` backend) only
# under `obs`; a default/pi build links neither eg-text-directly nor Tantivy. NOTE:
# eg-text is ALSO pulled transitively via eg-plan's `text` (the facade `text` feature),
# so this direct edge adds no NEW crate — it only makes `eg_text::TextIndex` nameable.
eg-text = { path = "crates/eg-text", optional = true }
# Arrow + Parquet columnar segment encode for observability logs (feature `obs`,
# CONCEPT:EG-161). `arrow` 53 is ALREADY in the tree via `query`/DataFusion (no new
# crate); `parquet` IS a new dependency (DataFusion here is built default-features=off,
# so parquet was absent) — pinned to arrow 53's matching line, default-features off so
# only the `arrow` integration is linked (NO compression codecs / C deps). Both are
# OPTIONAL + referenced only under `#[cfg(feature = "obs")]`, so a default/pi/full build
# (obs off) links NO parquet (asserted by `cargo tree --features pi | grep -c parquet` = 0).
arrow = { version = "53", optional = true }
parquet = { version = "53", optional = true, default-features = false, features = ["arrow"] }
# Zero-copy byte buffer for the Parquet reader's `ChunkReader` (feature `obs`). Already
# in the tree (tokio); optional + obs-gated so a default/pi build is unaffected.
bytes = { version = "1", optional = true }
# Optional native RDF/SPARQL surface (features `rdf`/`sparql`, CONCEPT:KG-2.217/218).
# Pulls oxrdf/oxttl/spargebra — ALL pure-Rust — only when enabled, so a default/pi
# build links none of them (asserted by cargo tree). Its `rdf-redb` quad table rides
# the facade `redb` feature.
eg-rdf = { path = "crates/eg-rdf", optional = true }
# Optional pure-Rust SHACL Core validator (feature `shacl`, CONCEPT:EG-132). Sits above
# eg-rdf (reuses its oxrdf term/graph model); pulled only when `shacl` is on.
eg-shacl = { path = "crates/eg-shacl", optional = true }
# Optional pure-Rust ShEx Core validator (feature `shex`, CONCEPT:EG-133). The complement
# to eg-shacl; sits above eg-rdf (reuses its oxrdf term/graph model); pulled only when
# `shex` is on.
eg-shex = { path = "crates/eg-shex", optional = true }
# Optional native GraphQL read surface (feature `graphql`, CONCEPT:KG-2.235). Pure-Rust
# (schema-from-graph + hand-written parser/resolver, NO async-graphql), pulled only when
# enabled so a default/pi build links none of it.
eg-graphql = { path = "crates/eg-graphql", optional = true }
# EG-187: the tiered + shared content-addressed KV-cache leaf crate (EG-185/186). Pulled
# ONLY behind `kvcache-server` (the KV-cache agent left it un-wired as a workspace member
# only), so a default/pi build links none of it (no eg-kvcache/ureq in pi). Pure-Rust; its
# shared backend is exposed over HTTP by `src/server/kvcache_http/` for vLLM/LMCache.
eg-kvcache = { path = "crates/eg-kvcache", optional = true }
# Optional WASM-sandboxed UDF runtime (feature `wasm-udf`, CONCEPT:KG-2.228). Pulls
# wasmtime + cranelift only when enabled, so a default/pi build links neither
# (asserted by cargo tree). The sandboxed `UdfRegistry` lives on ServerState.
eg-wasm = { path = "crates/eg-wasm", optional = true }
# SPARQL SERVICE federation client (feature `sparql-service`, CONCEPT:EG-052). The SAME
# pure-Rust rustls HTTP client `federation` already links via eg-plan — pinned to the
# same 2.x, so activating it here adds a direct edge but NO new crate to the tree (a
# `--features pi` build still links no ureq). Gated so default/Pi builds link none of it.
ureq = { version = "2.10", optional = true }
# Keycloak JWT validation for the KV-cache HTTP surface (kvcache-server only, never
