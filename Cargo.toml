# fits a Pi WITHOUT a C toolchain and WITHOUT DataFusion. It is `pi` (server + graph +
# algorithms + redb + cypher + ann + rdf + sparql + owl + streaming + result-cache +
# cold-tier + cost) PLUS the remaining pure-Rust, no-DataFusion features: `tsdb`
# (native time-series, redb-backed, NO DataFusion), `blob` (native redb CAS, NO
# object_store SDK), and `security` (RLS + audit chain + ChaCha20-Poly1305
# encryption-at-rest, all RustCrypto pure-Rust — NO ring/openssl/C). It deliberately
# EXCLUDES `query`/`graphql` (DataFusion), `text` (Tantivy/zstd-sys C dep), `pgwire`,
# `raft`/`openraft`, `wasm-udf` (wasmtime/cranelift), `federation` (rustls/ring),
# `blob-s3`/`cold-tier-s3`/`compute-dist`. The Pi contract holds: a `--features pi-max`
# build links NO datafusion / tantivy / openraft / pgwire / ring / openssl / zstd-sys /
# C-toolchain dep (asserted by `cargo tree`). It sits between `pi` and `full`.
pi-max = ["pi", "tsdb", "blob", "security"]

[dependencies]
eg-types = { path = "crates/eg-types" }
eg-core = { path = "crates/eg-core" }
# Compute domains (always linked for `algorithms`, used by the graph-op handlers);
# the heavy finance/datascience/ast/reasoning code + deps are gated behind the
# facade features that pass through to eg-compute's matching features.
eg-compute = { path = "crates/eg-compute" }
# CONCEPT:EG-321 — Analytics-Program numeric kernel (feature `numeric`, in `full`,
# out of `pi`). Links only the PURE rlib (faer + ndarray, NO Python-extension FFI —
# that layer is behind eg-numeric's OWN `python` feature, off here) for Surface B
# in-database analytics. Referenced only under `#[cfg(feature = "numeric")]`, so a
# default/pi build links no eg-numeric/faer/ndarray (asserted by `cargo tree --features pi`).
eg-numeric = { path = "crates/eg-numeric", optional = true }
# Optional SQL query surface (feature `query`); pulls DataFusion only when enabled.
eg-query = { path = "crates/eg-query", optional = true }
# Optional unified cross-modal planner (feature `query`, CONCEPT:KG-2.208/209). Its
# DataFusion FILTER leg is gated by eg-plan's own `query`; pulled only with the
# facade `query`, so a default/Pi build links neither it nor DataFusion.
eg-plan = { path = "crates/eg-plan", optional = true }
# Optional live CEP standing-query engine (feature `stream`, CONCEPT:EG-088/EG-299). The
# BATCH `Op::Cep` executor already pulls eg-stream transitively via `eg-plan/stream`; this
# DIRECT edge (with eg-stream's own `stream` feature, the ONLY thing that pulls tokio in
# that leaf crate) makes `eg_stream::live::CepEngine` nameable so the server can own a live
# standing-query surface (`src/server/cep.rs`) fed by the CDC hub. Pulled ONLY under
# `stream`; a default/pi build links no eg-stream (and never its tokio bits).
eg-stream = { path = "crates/eg-stream", optional = true }
# Optional native time-series store + primitives (feature `tsdb`, CONCEPT:KG-2.210/
# 211); pulls redb only (native primitives), and DataFusion only when `query` is ALSO
# on (its `arrow-seg` feature, enabled transitively by the facade `query` feature).
eg-tsdb = { path = "crates/eg-tsdb", optional = true }
# Optional embedded BM25 full-text index (feature `obs`, CONCEPT:EG-160). Reused
# DIRECTLY for the per-stream log text index. Pulled (with its `tantivy` backend) only
# under `obs`; a default/pi build links neither eg-text-directly nor Tantivy. NOTE:
# eg-text is ALSO pulled transitively via eg-plan's `text` (the facade `text` feature),
# so this direct edge adds no NEW crate — it only makes `eg_text::TextIndex` nameable.
eg-text = { path = "crates/eg-text", optional = true }
# Arrow + Parquet columnar segment encode for observability logs (feature `obs`,
# CONCEPT:EG-161). `arrow` 53 is ALREADY in the tree via `query`/DataFusion (no new
# crate); `parquet` IS a new dependency (DataFusion here is built default-features=off,
# so parquet was absent) — pinned to arrow 53's matching line, default-features off so
# only the `arrow` integration is linked (NO compression codecs / C deps). Both are
# OPTIONAL + referenced only under `#[cfg(feature = "obs")]`, so a default/pi/full build
# (obs off) links NO parquet (asserted by `cargo tree --features pi | grep -c parquet` = 0).
arrow = { version = "53", optional = true }
parquet = { version = "53", optional = true, default-features = false, features = ["arrow"] }
# Zero-copy byte buffer for the Parquet reader's `ChunkReader` (feature `obs`). Already
# in the tree (tokio); optional + obs-gated so a default/pi build is unaffected.
bytes = { version = "1", optional = true }
# Optional native RDF/SPARQL surface (features `rdf`/`sparql`, CONCEPT:KG-2.217/218).
# Pulls oxrdf/oxttl/spargebra — ALL pure-Rust — only when enabled, so a default/pi
# build links none of them (asserted by cargo tree). Its `rdf-redb` quad table rides
# the facade `redb` feature.
eg-rdf = { path = "crates/eg-rdf", optional = true }
# Optional pure-Rust SHACL Core validator (feature `shacl`, CONCEPT:EG-132). Sits above
# eg-rdf (reuses its oxrdf term/graph model); pulled only when `shacl` is on.
eg-shacl = { path = "crates/eg-shacl", optional = true }
# Optional pure-Rust ShEx Core validator (feature `shex`, CONCEPT:EG-133). The complement
# to eg-shacl; sits above eg-rdf (reuses its oxrdf term/graph model); pulled only when
# `shex` is on.
eg-shex = { path = "crates/eg-shex", optional = true }
# Optional native GraphQL read surface (feature `graphql`, CONCEPT:KG-2.235). Pure-Rust
# (schema-from-graph + hand-written parser/resolver, NO async-graphql), pulled only when
# enabled so a default/pi build links none of it.
eg-graphql = { path = "crates/eg-graphql", optional = true }
# EG-187: the tiered + shared content-addressed KV-cache leaf crate (EG-185/186). Pulled
# ONLY behind `kvcache-server` (the KV-cache agent left it un-wired as a workspace member
# only), so a default/pi build links none of it (no eg-kvcache/ureq in pi). Pure-Rust; its
# shared backend is exposed over HTTP by `src/server/kvcache_http/` for vLLM/LMCache.
eg-kvcache = { path = "crates/eg-kvcache", optional = true }
# Optional WASM-sandboxed UDF runtime (feature `wasm-udf`, CONCEPT:KG-2.228). Pulls
# wasmtime + cranelift only when enabled, so a default/pi build links neither
# (asserted by cargo tree). The sandboxed `UdfRegistry` lives on ServerState.
eg-wasm = { path = "crates/eg-wasm", optional = true }
# SPARQL SERVICE federation client (feature `sparql-service`, CONCEPT:EG-052). The SAME
# pure-Rust rustls HTTP client `federation` already links via eg-plan — pinned to the
# same 2.x, so activating it here adds a direct edge but NO new crate to the tree (a
# `--features pi` build still links no ureq). Gated so default/Pi builds link none of it.
ureq = { version = "2.10", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
petgraph = { version = "0.6.4", features = ["serde-1"] }
rayon = "1.10"
parking_lot = "0.12"
dashmap = "6.1"
ahash = "0.8"
uuid = { version = "1.8", features = ["v4"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"

# Optional Server. Explicit minimal feature set (not "full"): the binary uses an
# explicitly-built multi-thread runtime + UDS/TCP listeners + sync primitives +
# timers + `signal` (SIGTERM/SIGINT graceful shutdown) + `macros` (the
# `tokio::select!` the graceful accept loop awaits on). Tests pull
# dev-dependencies' "full" tokio, so #[tokio::test]/duplex still work. Trims
# compile time + binary surface.
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "macros",
], optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }
# `dyn PersistenceBackend` needs object-safe async methods (CONCEPT:KG-2.177);
# matches the existing async persist.rs style without a runtime bridge.
async-trait = { version = "0.1", optional = true }
# Durable embedded KV for the redb write-through tier (feature `redb`).
redb = { version = "4.1", optional = true }
# Encryption-at-rest AEAD for the redb durable value blobs (feature `security`,
# CONCEPT:KG-2.231). RustCrypto ChaCha20-Poly1305 — PURE-RUST, links NO ring/openssl
# or any C crate (the Pi contract holds for the crypto path); optional + only
# referenced under #[cfg(feature = "security")].
chacha20poly1305 = { version = "0.10", optional = true }
# S3/MinIO object-store chunk backend (feature `blob-s3`, CONCEPT:KG-2.206). The
# ONLY dep that pulls an object-store/AWS SDK, gated behind `blob-s3` (NOT `blob`),
# so a default/pi/full build links no object_store/aws crate — verified by the
# `cargo tree -e normal | grep -iE 'aws|s3|object_store'` Pi-contract gate.
object_store = { version = "0.11", optional = true, features = ["aws"] }
# In-engine Raft consensus (feature `raft`, CONCEPT:KG-2.188 / KG-2.272). Bumped to
# openraft 0.10 (the v2 split-storage API + NATIVE `trigger().transfer_leader()` for
# graceful leader handoff — the M2 remainder). `serde` is required because the app
# data (a durable `Method` for a graph) + the log entries cross the wire
# MessagePack-encoded. CLUSTER-TIER ONLY: optional + only referenced under
# #[cfg(feature = "raft")], so a default/pi/full build links no openraft (verified by
# `cargo tree`). NOTE: 0.10 ships only as a pre-release (0.10.0-alpha.26) upstream; it
# is the line that carries `transfer_leader`, so we pin the alpha exactly.
openraft = { version = "=0.10.0-alpha.26", features = ["serde"], optional = true }
# Postgres wire-protocol shim (feature `pgwire`, CONCEPT:KG-2.189). `server-api`
# is the server-side handler set; `_ring` selects the ring crypto backend for the
# SCRAM/TLS machinery (we pass tls=None, but the feature must pick a backend to
# build). default-features off keeps the client API + extra type codecs out.
pgwire = { version = "0.40", optional = true, default-features = false, features = [
    "server-api",
    "_ring",
] }
# Stream/sink combinators for the pgwire DataRow result stream (feature `pgwire`).
futures = { version = "0.3", optional = true }
# SHA-1 digest for the hand-rolled MySQL `mysql_native_password` auth exchange
# (feature `mysql-wire`, CONCEPT:EG-076). OPTIONAL + referenced ONLY under
# #[cfg(feature = "mysql-wire")], so a default/pi/node/full build links no sha1 via
# this crate (the mysql wire ships only when the orchestrator folds the feature into a
# tier). Pure-Rust; the mysql_native_password spec mandates SHA-1 specifically.
sha1 = { version = "0.10", optional = true }

# Optional Prometheus observability (feature `metrics`, on by default).
# default-features = false drops the protobuf encoder — text exposition only.
prometheus = { version = "0.14", optional = true, default-features = false }
# Optional OpenTelemetry OTLP span export (feature `otel`, CONCEPT:EG-091). All
# four are OPTIONAL + referenced ONLY under #[cfg(feature = "otel")], so a
# default/pi/full build links none of them (nor tonic/prost/network) — asserted
# by `cargo tree`. The batch span processor runs on the tokio runtime
# (`opentelemetry_sdk` `rt-tokio`); `grpc-tonic` is the OTLP transport.
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", optional = true, features = ["grpc-tonic"] }
tracing-opentelemetry = { version = "0.32", optional = true }
# CONCEPT:EG-316 — protobuf codec for the Prometheus `remote_write` WriteRequest, and
# snappy block decompression for its wire framing. BOTH are pure-Rust (NO C, NO
# tonic/grpc, NO build.rs codegen — the WriteRequest schema is hand-declared with the
# `prost::Message` derive), OPTIONAL + referenced ONLY under #[cfg(feature =
# "otel-export")], so a default/pi/full build links NEITHER (asserted by `cargo tree`;
# the Pi contract holds — a `--features pi` build has no prost/protobuf).
prost = { version = "0.13", optional = true }
snap = { version = "1.1", optional = true }
hmac = "0.12"
hex = "0.4"
rmp-serde = "1.3"
lazy_static = "1.4"
sha2 = "0.10"
rand = "0.8"
hnsw_rs = "0.3"
# Advisory file locking for the single-writer persist-dir guard (Phase B1):
# exactly one engine may own a persist dir, closing the split-brain/orphan class
# at the engine level (complements the Python-side spawn guard).
fs4 = "0.8"
serde_bytes = "0.11.19"


[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing-subscriber = "0.3"
# Real Postgres client for the pgwire wire round-trip integration test
# (CONCEPT:KG-2.189). Only compiled for tests; never linked into the engine.
tokio-postgres = "0.7"
# Compile the `.wat` WASM UDF fixtures to wasm in the server-dispatch UDF test
# (CONCEPT:KG-2.228). Only compiled for tests with `--features wasm-udf`.
wat = "1"
# Integration tests in `tests/` construct a full `ServerState` literal directly, so
# they must be able to name the crates behind the feature-gated fields the lib's own
# (`crate::`-pathed) test literals use: `parking_lot::Mutex` for the `compute-dist`
# matview store and `eg_wasm::UdfRegistry` for the `wasm-udf` registry. Already linked
# by the lib under node/cluster — declaring them here only makes the names resolvable
# from an integration test (e.g. `tests/pgwire_roundtrip.rs` under `--features cluster`).
parking_lot = "0.12"
eg-wasm = { path = "crates/eg-wasm", features = ["wasm-udf"] }
# Criterion harness for the write-coalescer contention bench (CONCEPT:EG-012)
# and the massive-scale core harness (CONCEPT:EG-096). DEV-only — never linked
# into the engine binary; zero release-build impact.
criterion = "0.5"
# Native IVF-PQ index (eg-ann), pulled DIRECTLY only so the EG-096 ANN kNN
# latency bench can name it in-process. It is ALREADY in the tree transitively
# (eg-core/ann); this dev-only edge adds no new crate to any release build.
eg-ann = { path = "crates/eg-ann" }

# Write-coalescer `__commons__` contention reproduction (CONCEPT:EG-012): N
# concurrent producers fan single-op writes into ONE graph, swept across the batch
# window so the lock-acquisition / throughput contention curve is visible. The
# coalescer is Tokio-based and lives behind the `server` feature, so this bench is
# gated to it (a default `cargo check --benches` skips it). Flamegraph-ready via
# `cargo flamegraph --features server --bench write_coalescer_bench`.
[[bench]]
name = "write_coalescer_bench"
path = "benches/write_coalescer_bench.rs"
harness = false
required-features = ["server"]

# Redb durable group-commit micro-linger reproduction (CONCEPT:EG-024): N concurrent
# authoritative writers fanned into ONE redb backend, swept across the linger knob so
# the ops-per-fsync (batch-size) win over the commit-on-drain baseline is visible.
# Needs the redb backend + tokio server runtime, so it is gated to `--features full`
# (a default `cargo check --benches` skips it). DEV-only; never linked into the binary.
[[bench]]
name = "redb_group_commit_bench"
path = "benches/redb_group_commit_bench.rs"
harness = false
required-features = ["full"]

# Massive-scale core micro-benchmark harness (CONCEPT:EG-096): in-process node/edge
# write throughput, in-process query latency (single-hop + label lookup), and IVF-PQ
# kNN search latency. Feature-LIGHT — builds under DEFAULT features (no server/redb),
# so a plain `cargo bench --no-run` compiles it while the two benches above skip. Uses
# a dep-free deterministic PRNG so no `rand` dev-dep is pulled. DEV-only; never linked
# into the engine binary.
[[bench]]
name = "eg096_massive_scale_bench"
path = "benches/eg096_massive_scale_bench.rs"
harness = false

[profile.release]
opt-level = 3
# thin (not fat) LTO. EVIDENCED: the aarch64 wheel cross-build (zig/qemu under
# maturin-action) fat-LTO-ing the full DataFusion/Tantivy tree exhausts the CI runner —
# publish-pypi `linux (aarch64)` FAILED on a fat-LTO commit (910633b) and PASSED on the
# otherwise-identical thin-LTO commit (9682237). thin LTO keeps ~all the runtime perf at
# a fraction of the link-time memory, so the cross-built `--release` wheels build in CI.
# (Distinct from the Release Build node-leg failure, which was a duplicate --manylinux
# arg — fixed in release-build.yml.)
lto = "thin"
codegen-units = 1
# unwind (not abort): the engine is a long-running multi-tenant server — a panic in one
# request/handler must unwind, NOT abort the whole process and kill every tenant's graph.
panic = "unwind"
strip = true

# Size-optimized release profile for the "contains-all smallest" pre-packaged build
# (the Pi never compiles — wheels are cross-built in CI, so the C-dep/long compile is
# a build-host concern only). Inherits `release` but trades runtime speed for a
# smaller stripped binary: opt-level "z" (optimize for size), fat LTO + a single
# codegen unit (max cross-crate inlining/dead-code elimination), strip symbols.
# `panic = "unwind"` is DELIBERATE and OVERRIDES the `release` `abort`: this is a
# DATABASE — unwind keeps a panic recoverable at the dispatch boundary instead of
# aborting the whole process and masking a recoverable error. Normal `release` builds
# are unaffected (this is a separate named profile).
[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
