# (`kvcache-compression`) and the redb-persisted ANN codes (`ann-redb`). `redb` IS folded
# in (CONCEPT:KG-2.195 — THE FLIP) so the standard build is authoritative-by-default.
# What stays OUT of the main build (explicit opt-in only): openraft/`raft` (the `cluster`
# layer), `gpu-cuda`/`ros2-bridge`/`ros2-dds` (the `full-extras` layer), the object-store
# SDK legs (`blob-s3`/`cold-tier-s3`), and `calvin` (opt-in per-call, needs raft).
# Engine-level security (CONCEPT:KG-2.231, Lane O): per-agent Row-Level Security
# (the read/plan-path view filter), encryption-at-rest for the redb durable value
# blobs, and a hash-chained tamper-evident audit log over the ledger. PURE-RUST end
# to end: RLS + audit chain link only `sha2`/`hmac` (already deps, RustCrypto) — NO
# C; encryption pulls `chacha20poly1305` (RustCrypto AEAD, pure-Rust, NO ring/openssl).
# Encryption-at-rest also rides the redb substrate, so it implies `redb`. Also pulls
# `oidc` — the primary `eg2.` protocol's OIDC identity binding is a security-feature
# capability (verified-identity envelope claims, not just HMAC channel integrity).
# Security is mandatory in the one main `full` build and remains present in both
# source-built layers.
security = ["redb", "oidc", "dep:chacha20poly1305", "eg-types/security", "eg-core/security"]
# Shared OIDC/JWKS bearer-token verification core (`src/server/oidc.rs`):
# RSA-signature-against-JWKS, issuer/audience/expiry, Keycloak-compatible. A small,
# dependency-bounded feature so the RSA/JWT crates are linked exactly once and reused
# by every surface that needs OIDC identity verification — `security`'s primary
# `eg2.` protocol identity binding and `kvcache-server`'s KV-cache HTTP bearer auth —
# rather than each surface vendoring its own copy.
oidc = ["dep:jsonwebtoken", "dep:ureq"]
full = ["compute", "server", "server-tls", "query", "knowledge-batch", "cypher", "cypher-plan", "graphql", "eg-graphql/crossmodal-tsdb", "redb", "ann", "ann-redb", "tsdb", "blob", "kv", "text", "sparql", "sparql-http", "sparql-hash", "rdf-xml", "json-ld", "sparql-star", "sparql-service", "shacl", "owl", "owl-dl", "owl-plan", "obda", "streaming", "wasm-udf", "security", "oidc", "federation", "federation-sql", "pgwire", "mysql-wire", "mssql-wire", "sqlite-wire", "bolt-wire", "redis-wire", "broker", "amqp-wire", "mqtt-wire", "stomp-wire", "geo", "tensor", "stream", "result-cache", "cold-tier", "cost", "cost-opt", "otel", "otel-export", "shex", "obs", "geosparql", "nl-query", "promql", "traces", "s3-api", "federation-search", "kvcache-server", "kvcache-compression", "numeric", "sqlite-file", "epistemic", "epistemic-redaction", "evidence-graph", "epistemic-tms", "epistemic-causal", "alignment", "jobs", "program-optimization", "statechart", "modality-serving", "embedded", "matview", "lake", "lake-rest"]
all = ["full"]
