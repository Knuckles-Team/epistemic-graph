# the bytes; a committed write bumps the graph version — and the CDC hub marks the view
# stale (`src/server/matview/`) — so the next Get recomputes, never serving stale rows.
# It generalizes the algo-only distributed-compute matview, but that kinship is only a
# DISPATCH-ROUTING accident: `manager.rs`/`lifecycle.rs`/`incremental.rs` reference ZERO
# raft/compute-dist symbols. So `matview` needs only `query` (the Plan AST + runtime +
# the DBSP `incremental` circuit), `result-cache` (the result store) and `streaming` (the
# CDC delta source) — ALL THREE already in the single-node `full` build. It no longer
# implies `compute-dist`/`raft`, so PLAN-BACKED incremental matviews are native to the
# single-node main build; only the UNRELATED algo-only Pregel matview stays cluster-gated.
matview = [
    "query",
    "result-cache",
    "streaming",
    "eg-types/matview",
]
