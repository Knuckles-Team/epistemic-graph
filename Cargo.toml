[package]
name = "epistemic-graph"
version = "0.27.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "High-performance Rust graph compute engine for AI agents"
license = "MIT"

[lib]
name = "epistemic_graph"
crate-type = ["rlib"]

[[bin]]
name = "epistemic-graph-server"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["graph", "algorithms", "metrics"]

graph = []
algorithms = []
# Prometheus observability: request/latency/in-flight counters, per-graph
# gauges and a /metrics HTTP listener (--metrics-addr). ON by default; opt out
# with --no-default-features for a leaner lib-only build.
metrics = ["dep:prometheus", "dep:strum"]
finance = []
ast = ["dep:tree-sitter", "dep:tree-sitter-python", "dep:tree-sitter-rust", "dep:tree-sitter-typescript", "dep:tree-sitter-javascript", "dep:tree-sitter-go", "dep:tree-sitter-java", "dep:tree-sitter-c", "dep:tree-sitter-cpp", "dep:tree-sitter-c-sharp"]
datascience = []
reasoning = []
server = ["dep:tokio", "dep:clap", "dep:tracing-subscriber"]
compute = ["finance", "ast", "datascience", "reasoning"]
full = ["compute", "server"]
all = ["full"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
petgraph = { version = "0.6.4", features = ["serde-1"] }
rayon = "1.10"
parking_lot = "0.12"
dashmap = "6.1"
ahash = "0.8"
bincode = "1.3"
uuid = { version = "1.8", features = ["v4"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
nalgebra = { version = "0.32", features = ["serde"] }
rand_chacha = "0.3"
rand_distr = "0.4"

# Optional Server
tokio = { version = "1.38", features = ["full"], optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

# Optional Prometheus observability (feature `metrics`, on by default).
# default-features = false drops the protobuf encoder — text exposition only.
prometheus = { version = "0.14", optional = true, default-features = false }
strum = { version = "0.27", features = ["derive"], optional = true }
hmac = "0.12"
hex = "0.4"
rmp-serde = "1.3"
lazy_static = "1.4"
sha2 = "0.10"
rand = "0.8"
hnsw_rs = "0.3"
# Advisory file locking for the single-writer persist-dir guard (Phase B1):
# exactly one engine may own a persist dir, closing the split-brain/orphan class
# at the engine level (complements the Python-side spawn guard).
fs4 = "0.8"

# Optional AST
tree-sitter = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
# Pinned to an ABI-14 grammar: 0.23.5 was regenerated with tree-sitter ABI 15,
# which the 0.23 core runtime rejects ("Incompatible language version 15").
tree-sitter-c-sharp = { version = "=0.23.1", optional = true }
serde_bytes = "0.11.19"


[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
