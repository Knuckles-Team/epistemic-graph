[package]
name = "eg-mutation-store"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Shared redb subordinate-domain ledger for canonical MutationBatch commits"
license = "MIT"

[lib]
name = "eg_mutation_store"

[dependencies]
eg-types = { path = "../eg-types" }
redb = "4.1"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
