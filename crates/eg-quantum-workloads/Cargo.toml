[package]
name = "eg-quantum-workloads"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Q7 (epistemic hooks) + Q11 (domain workloads), plans/au-eg-program/program/quantum-native.md and its quantum-external-providers.md addendum: QAOA Max-Cut over a subgraph pulled from epistemic-graph via UQL, run on eg-quantum-sim, and written back as a TYPED PROPOSAL — never a hard constraint — through the SAME :Claim/:Evidence/SUPPORTS convention eg-jobs (crates/eg-jobs/src/claim.rs) already established, so eg-epistemic's TMS/confidence/Ebbinghaus machinery governs belief instead of a raw confidence value written onto an edge."
license = "MIT"

[lib]
name = "eg_quantum_workloads"

# A leaf crate ALONG the DAG, mirroring eg-jobs' own dependency shape (CONCEPT:INT-P2-1):
# eg-types (wire Method shapes) + eg-core (GraphCore, the SAME write primitive
# eg-jobs's `commit_result_claim` uses) + eg-plan with `query` (UQL parse + execute,
# to pull the candidate node set) + the three Q0/Q1 quantum crates already on `main`
# (eg-quantum-core's IR/trait/exactness-typed result, eg-quantum-gates' matrix
# catalog, eg-quantum-sim's StateVectorSimulator) + eg-numeric's `complex` feature
# (the SAME Complex64 surface eg-quantum-sim itself uses, needed here only to read
# `evolve()`'s returned amplitudes for the classical expectation-value evaluation
# inside the QAOA parameter search — no new numeric stack).
#
# This crate is a WORKSPACE MEMBER ONLY (see the one-line addition to the root
# Cargo.toml's `[workspace] members`) — it is NOT wired into the root `epistemic-graph`
# package's `[dependencies]`/features. That is the deliberate "zero core change" Q7
# staging step the addendum's §1.2 charter names ("a tool pulls a subgraph, runs the
# algorithm, writes results back as proposals. Works today.") — `src/server/` is
# untouched, so the sibling `w6-quantum-q5q6-jobplane` lane's `Op::SubmitQuantum`/
# `Op::JoinQuantumResults` durable job-plane work has a clean surface to later host
# this tool's `run_qaoa_maxcut`/`plan_maxcut_proposal` logic behind, without this
# lane having raced ahead into that job plane itself.
[dependencies]
eg-types = { path = "../eg-types" }
eg-core = { path = "../eg-core" }
eg-plan = { path = "../eg-plan", features = ["query"] }
eg-quantum-core = { path = "../eg-quantum-core" }
eg-quantum-gates = { path = "../eg-quantum-gates" }
eg-quantum-sim = { path = "../eg-quantum-sim" }
eg-numeric = { path = "../eg-numeric", features = ["complex"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "1.0"

[dev-dependencies]
# Only for tests/end_to_end.rs's step 6 -- proving the committed :Claim is
# queryable/reasonable alongside classical graph data via the SAME BeliefGraph/
# propagate_confidence surface every other claim in this engine uses. Not a runtime
# dependency of this crate's write path itself (see propose.rs's own doc: this crate
# writes the SAME convention eg-epistemic reads, exactly as eg-jobs::claim does,
# without depending on eg-epistemic at build time either -- it is a dev-only proof).
eg-epistemic = { path = "../eg-epistemic" }

[features]
default = []
