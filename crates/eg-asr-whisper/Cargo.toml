[package]
name = "eg-asr-whisper"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Native Rust ASR provider (GOC-33, OWNER-VOICE-ASR) implementing eg-audio's frozen asr.* contract over whisper-rs/whisper.cpp."
license = "MIT"

# HEAVY LEAF (GOC-33): this crate — and only this crate — links whisper-rs (which
# vendors and compiles whisper.cpp/ggml C++ from source via `cmake`). It is a
# workspace member so `cargo build/test -p eg-asr-whisper` works standalone, but the
# facade links it ONLY behind the optional, default-off `asr-whisper` feature (see
# the root Cargo.toml). A default/`full` facade build links none of it — see this
# crate's `src/lib.rs` doc for the CPU-portability build contract (why GGML_NATIVE
# must stay OFF) and `docs/provenance/eg-asr-whisper.md` for the license/provenance
# record of what was assimilated from `open-source-libraries/meetily`.
[lib]
name = "eg_asr_whisper"

[dependencies]
eg-audio = { path = "../eg-audio", features = ["asr"] }
whisper-rs = { version = "0.16", default-features = false }
sha2 = "0.10"

[features]
default = []
# Optional GPU execution providers, mirroring whisper-rs's own feature names
# (meetily precedent: open-source-libraries/meetily/frontend/src-tauri/Cargo.toml).
# ALL off by default — CPU is the only qualified baseline in this change (GOC-33
# lane doc "ORT execution providers are capability manifests, not assumptions").
# Turning one of these on changes what the VENDORED whisper.cpp build links; it does
# NOT make GPU use automatic — the provider still probes hardware at runtime and
# falls back to CPU when the requested accelerator is unavailable.
# NOTE on `--all-features`: a Cargo feature cannot be target-gated, so anything
# listed here WILL be enabled by `cargo --all-features` on every target. The
# Apple-only providers (`metal`, `coreml`) are therefore NOT exposed: whisper-rs-sys
# emits `cargo:rustc-link-lib=static=whisper.coreml` whenever its `coreml` feature is
# on, and that library cannot exist on Linux, so exposing it broke every
# `--all-features` build of the whole workspace. There is no Apple hardware in this
# fleet, so the features could never have been valid here. To use one, enable
# `whisper-rs/metal` or `whisper-rs/coreml` directly on an Apple target.
# (Intentionally none.) See the note above: `cargo --all-features` enables every
# feature listed here on every target, and each of these makes the vendored
# whisper.cpp build link an accelerator runtime that is not present on this fleet --
# `cuda` alone emits `-l cudart -l cuda` and reads CUDA_PATH. None of them was
# hardware-qualified (the lane's own note: "GPU features wired but
# hardware-unqualified", CPU is the only qualified baseline), so per this repo's rule
# against speculative configurability they are not shipped. Adding one back is a
# deliberate change that must come WITH hardware qualification -- enable the
# corresponding `whisper-rs/<provider>` feature from the facade at that point.

[dev-dependencies]
