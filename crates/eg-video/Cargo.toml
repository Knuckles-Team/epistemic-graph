[package]
name = "eg-video"
version = "0.1.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Pure-Rust video modality for the epistemic-graph engine — a metadata/shot-level VideoData stored value (real duration from a hand-rolled MP4/ISOBMFF 'moov/mvhd' box parse, a content-addressed blob ref, an optional extractor-supplied shot/scene index) with a ModalityContract impl producing a real EvidenceSpan::VideoShot. NO heavy video/ffmpeg codec crate in the default build (the Pi contract)."
license = "MIT"

[lib]
name = "eg_video"

# Pure-Rust, Pi-lean leaf crate — a sibling of eg-tensor/eg-geo/eg-image/eg-audio. The
# ONLY unconditional dependency is serde (so `VideoData` persists as a typed property
# in the redb per-graph store). Deliberately NO `ffmpeg`/`symphonia`/video-codec crate:
# this crate parses ONLY the MP4/ISOBMFF top-level box structure down to `moov/mvhd`
# for real duration (see src/header.rs) and never decodes frames; a real (H.264/VP9/…)
# frame codec is an explicitly out-of-scope, documented TODO (see the reserved `codec`
# feature below, which pulls no dependency in v1).
[dependencies]
serde = { version = "1.0", features = ["derive"] }
# ModalityContract PILOT retrofit (CONCEPT:E4 follow-up), mirroring eg-tensor/eg-geo.
# Optional, only under `contract` (default OFF) — a default/pi/node/full build links
# none of it and `VideoData` carries no new required trait. See `src/contract.rs`.
eg-modality = { path = "../eg-modality", optional = true }

[features]
default = []
# ModalityContract retrofit (CONCEPT:E4 follow-up): `impl ModalityContract for
# VideoData` + the `modality_conformance_tests!` battery. OFF by default, deliberately
# NOT folded into any tier aggregate (pi/node/full) — it is a capability-discovery/
# testing seam, not a serving feature. `cargo test -p eg-video --features contract`
# runs the suite.
contract = ["dep:eg-modality"]
# RESERVED seam for a real frame codec (H.264/VP9/AV1 decode to a frame buffer). NOT
# implemented in v1 — this crate stays metadata/shot-level only (see crate docs).
# Turning this on TODAY adds no dependency and changes no behavior; a future real
# decoder would gate its heavy dep behind this SAME feature name so the default build
# never links it (the Pi contract).
codec = []
# OPT-IN runtime seam (CONCEPT:EG-P1-3): `src/runtime.rs`'s container/track/
# keyframe/shot/scene/caption/temporal-embedding TRAITS + typed artifacts. Default
# OFF, no new dependency AT ALL (a trait-definition layer, not an implementation —
# a real container demuxer/shot-detector/captioner/embedding model plugs in by
# implementing the trait in its own crate/service). Turning this on today adds
# zero dependency and changes no behavior of `VideoData` itself.
runtime = []

[dev-dependencies]
serde_json = "1.0"
