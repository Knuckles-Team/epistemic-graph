# Surface-A wheel build for the eg-numeric kernel. Builds the pyo3 extension
# `epistemic_graph.numeric` (feature `python`). This is a SEPARATE maturin target
# from the main epistemic-graph wheel (which is `bindings="bin"` — the server
# binary, no pyo3). In the shipped product the CI wheel build folds this module
# into the `epistemic_graph` package; here it builds standalone for parity tests.
#
#   maturin build --release -m crates/eg-numeric/Cargo.toml --features python
#
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "eg-numeric"
version = "0.1.0"
requires-python = ">=3.10"
description = "epistemic-graph numeric kernel — Surface A (pyo3) Python extension epistemic_graph.numeric"

[tool.maturin]
# The #[pymodule] is `numeric`; ship it inside the `epistemic_graph` package.
module-name = "epistemic_graph.numeric"
features = ["python"]
