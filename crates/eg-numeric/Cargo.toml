[package]
name = "eg-numeric"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Slim, BLAS/LAPACK-free numeric kernel (ndarray + nalgebra) for the epistemic-graph analytics program — one kernel, two surfaces (pyo3 Surface A + engine Surface B). CONCEPT:EG-321."
license = "MIT"

[lib]
name = "eg_numeric"
# cdylib → the pyo3 Surface-A Python extension wheel; rlib → the engine links the
# pure kernel for Surface B (in-database analytics) WITHOUT pulling pyo3.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# pyo3 Surface-A Python bindings. OFF by default so the engine can link the rlib
# (nalgebra + ndarray core) for Surface B WITHOUT pulling pyo3 — this preserves the
# Plan-01 "no PyO3 in the engine" contract (scripts/check_no_pyo3.sh only scans
# src/, epistemic_graph/, and the top-level Cargo.toml/pyproject.toml, never
# crates/; and this crate keeps pyo3 out of any engine-linked build). Only the
# wheel build (maturin) turns this on. The boundary accepts/returns Python built-ins;
# it deliberately has no NumPy runtime dependency.
python = ["dep:pyo3", "analytics"]
# Analytics stats ops (CONCEPT:EG-357/EG-358): spearmanr / ks_2samp / normal
# ppf+pdf. Pulls `statrs` for the distribution CDFs (Student-t, Normal). Kept OUT
# of `default` so an engine `pi`/`node`/`full` build that links the eg-numeric rlib
# for Surface B does NOT pull statrs unless it opts in — the Pi-contract holds
# (`cargo tree --features pi` links no statrs). `python` implies it so the Surface-A
# wheel carries the scipy-parity stats ops.
analytics = ["dep:statrs"]
# ModalityContract retrofit (CONCEPT:E4): `impl ModalityContract for
# cluster::KMeansResult` + the `modality_conformance_tests!` battery. OFF by
# default, deliberately NOT folded into any tier aggregate (pi/node/full) — it is
# a capability-discovery/testing seam, not a serving feature. Also turns on
# ndarray's OWN `serde` cargo feature (via the `<dep>/<feature>` Cargo syntax,
# valid even though `ndarray` is a mandatory, non-optional dependency) so
# `KMeansResult`'s `Array2<f64>` field can derive `Serialize`/`Deserialize` ONLY
# under this feature — a default (non-contract) build never needs
# `Array2<f64>: Serialize` at all. `cargo test -p eg-numeric --features contract`
# runs the suite.
contract = ["dep:eg-modality", "ndarray/serde"]
# Complex64 array surface (D-QN-3 handoff from lane w0-eg-quantum-contracts / the
# quantum numeric-stack decision): a thin `Complex64` re-export + generic dense-block
# tensor-index application (`apply_block2`/`apply_block4`) that Q1's `eg-quantum-sim`
# statevector backend uses to apply 1-/2-qubit unitaries. OFF by default, deliberately
# NOT folded into `default`/`pi`/`node`/`full` — a build that never asks for `quantum`/
# `quantum-sim` on the root `epistemic-graph` package pulls none of this. Adds ONE new
# direct dependency EDGE (`num-complex`) but ZERO new crates to the resolved lockfile:
# `nalgebra` (already a mandatory dependency above) already resolves `num-complex
# 0.4.6` transitively (nalgebra needs `ComplexField` for its own generic linear
# algebra) — see the workspace Cargo.lock. This is the numeric-stack decision recorded
# in `crates/eg-quantum-core/src/lib.rs` and `crates/eg-quantum-sim/src/lib.rs`: the
# quantum numeric path bridges to eg-numeric instead of importing QuantRS2's SciRS2
# stack as a second/third numeric foundation.
complex = ["dep:num-complex"]

[dependencies]
# arrays / reductions / element-wise / broadcasting — mature ndarray primitives.
ndarray = "0.17"
# Percentile/quantile are implemented in this crate so the Python boundary and
# kernel share the same ndarray implementation without a second stats stack.
# LAPACK-class linalg: svd / eigh / solve / qr / cholesky / pinv / lstsq —
# PURE RUST, NO system BLAS/LAPACK. Developer parity is validated separately.
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
# random (default_rng / normal / randint / RandomState equivalents).
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
# Ubiquitous elsewhere in the workspace; a normal (always-on) dep here too, so
# `KMeansResult`'s non-ndarray fields (`labels`/`inertia`/`n_iter`) can derive
# serde unconditionally and only the ndarray-backed `centroids` field needs the
# `contract`-gated `ndarray/serde` feature above.
serde = { version = "1.0", features = ["derive"] }

# Surface-A only (feature `python`): built-in Python sequence conversion + GIL release.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
# Analytics only (feature `analytics`): distribution CDFs/quantiles for the
# scipy-parity stats ops (Student-t p-value, Normal ppf/pdf). Pure Rust, no BLAS.
statrs = { version = "0.18", default-features = false, optional = true }
# ModalityContract retrofit (CONCEPT:E4). Optional, only under `contract` (default
# OFF) — a default/pi/node/full build links none of it and `KMeansResult` carries
# no new required trait. See `src/contract.rs`.
eg-modality = { path = "../eg-modality", optional = true }
# Complex64 surface only (feature `complex`, default OFF). Same version nalgebra
# already resolves transitively (0.4.6, workspace Cargo.lock) — promoting it to a
# direct dependency here adds zero new packages to the lockfile. `default-features =
# false` keeps out num-complex's own optional `rand`/`serde` integration features,
# none of which this crate's `complex` module needs.
num-complex = { version = "0.4", default-features = false, optional = true }
