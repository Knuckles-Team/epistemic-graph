[package]
name = "eg-image"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Pure-Rust governed PNG decode, spatial indexing, perceptual hashing, and image evidence for epistemic-graph."
license = "MIT"

[lib]
name = "eg_image"

# Pure-Rust leaf. serde persists normalized source-free facts, SHA-256 binds source
# identity, and the runtime uses the Rust flate2 backend for bounded PNG decode.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
# ModalityContract implementation (CONCEPT:E4), mirroring eg-tensor/eg-geo. Optional,
# only under `contract` (default OFF) — a default/pi/node/full build links none of it
# and `ImageData` carries no new required trait. See `src/contract.rs`.
eg-modality = { path = "../eg-modality", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }

[features]
default = []
# `impl ModalityContract for ImageData` + the conformance battery. OFF by default;
# `serving` promotes it to the governed runtime and is enabled by the facade's
# production epistemic surface.
contract = ["dep:eg-modality"]
serving = ["contract"]
# Memory-bounded native PNG decode, color conversion, perceptual hash, and governed
# secondary-index/query behavior. The pure-Rust inflater adds no native toolchain.
runtime = ["serving", "dep:flate2"]

[dev-dependencies]
serde_json = "1.0"
