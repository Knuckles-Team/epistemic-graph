[package]
name = "eg-tensor"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Pure-Rust dense N-D array / tensor modality for the epistemic-graph engine (CONCEPT:EG-085) — a dtype/shape/row-major-buffer Tensor with slice / reduce / elementwise / reshape ops and a compact little-endian byte-blob codec for content-addressed storage in the blob CAS. NO BLAS/C deps (the Pi contract)."
license = "MIT"

[lib]
name = "eg_tensor"

# Pure-Rust, Pi-lean by design — a leaf crate like eg-ann / eg-geo. The ONLY
# dependency is serde (so a `Tensor` persists as a typed value in the redb per-graph
# store, per CONCEPT:EG-085). NO BLAS/LAPACK/C deps and NO ndarray: the N-D array
# model, the slice/reduce/elementwise/reshape ops, and the compact byte-blob codec are
# all hand-written, so the crate stays truly minimal and folds cleanly into the
# `tensor` serving tiers (node/full), kept OUT of `pi`.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
# CONCEPT:EG-098 — the fusion module's time-alignment half (multi-rate resample onto a
# common grid + EG-067 tumbling windows) lives in eg-tsdb. Pulled with default-features
# (NO redb/Arrow), so it stays pure-Rust/Pi-lean; eg-tensor supplies the tensor-frame
# half. eg-tsdb does NOT depend on eg-tensor, so there is no cycle.
eg-tsdb = { path = "../eg-tsdb", default-features = false }
# GPU-accelerated tensor ops (CONCEPT:EG-327). OPTIONAL, only under `gpu-cuda`.
# `dynamic-loading` → builds with NO CUDA toolkit; a default/pi build links none of it.
cudarc = { version = "0.17", optional = true, default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12060"] }
# ModalityContract PILOT retrofit (CONCEPT:E4). Optional, only under `contract`
# (default OFF) — a default/pi/node/full build links none of it and `Tensor` carries
# no new required trait. See `src/contract.rs`.
eg-modality = { path = "../eg-modality", optional = true }

[features]
default = []
# Tensor-op GPU DISPATCH SEAM (CONCEPT:EG-326): compiles the `TensorBackend` trait +
# backend selection; the pure-Rust CPU backend is always the compiled-in fallback. No
# accelerator dep on its own.
gpu = []
# REAL CUDA tensor-op backend (CONCEPT:EG-327): pulls `cudarc` (dynamic-loading) and runs
# the elementwise kernel on a GPU when present, else CPU fallback at runtime. Implies `gpu`.
gpu-cuda = ["gpu", "dep:cudarc"]
# ModalityContract PILOT retrofit (CONCEPT:E4): `impl ModalityContract for Tensor` +
# the `modality_conformance_tests!` battery. OFF by default, deliberately NOT folded
# into any tier aggregate (pi/node/full) — it is a capability-discovery/testing seam,
# not a serving feature. `cargo test -p eg-tensor --features contract` runs the suite.
contract = ["dep:eg-modality"]

[dev-dependencies]
# The serde round-trip test proves a `Tensor` survives the typed-property codec (the
# non-blob persistence form). The compact byte-blob round-trip needs no dep at all.
serde_json = "1.0"
