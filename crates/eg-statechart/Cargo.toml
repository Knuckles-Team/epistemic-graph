[package]
name = "eg-statechart"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Native finite-state-machine / statechart engine (CONCEPT:INT-P2-2): a formal M=(S, Σ, δ, s₀, F) with extended state (context), guards + actions, a pure deterministic transition function, definition-time completeness/reachability checks, and a durable redb-backed machine-instance store — the disciplined sibling of eg-jobs' AnalyticsJob state primitive"
license = "MIT"

[lib]
name = "eg_statechart"

# A leaf crate ALONG the DAG (mirrors eg-jobs' placement): the in-memory typed
# definition model + the pure transition function need nothing above `eg-types`
# (whose `msgpack::decode_bounded` we reuse for the SAME bounded-decode robustness
# eg-jobs' store relies on). The durable store additionally routes every instance
# mutation through `eg-mutation-store` — the exact universal MutationBatch /
# durable-commit gateway `eg-jobs` uses — so instance transitions carry atomic
# status/version/fence/idempotency/outbox evidence and are Raft-orderable and
# crash-consistent across nodes. Durability is the store's reason to exist, so
# `redb` is UNCONDITIONAL here exactly as it is in `eg-jobs` — there is no "durable
# machine-instance plane without a durable store" configuration worth shipping.
[dependencies]
eg-types = { path = "../eg-types" }
eg-mutation-store = { path = "../eg-mutation-store" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
redb = "4.1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
# Already a dev-dependency of eg-jobs/eg-plan (workspace-wide, not a NEW crates.io
# dependency) -- reused here for DE7's replay-determinism property test, the same
# way eg-jobs' own sibling test does.
proptest = "1"

[features]
default = []
