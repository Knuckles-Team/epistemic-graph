# eg-graphql — native GraphQL READ surface over the property-graph (CONCEPT:KG-2.235).
#
# Sits in the DAG ABOVE eg-core (parallel to eg-rdf/eg-query): it derives a GraphQL
# schema FROM the live graph (node `type` labels → GraphQL object types, typed edges →
# fields) and compiles a GraphQL query to scans + BFS over the SAME `GraphView` the
# Cypher/unified executor reads. So a GraphQL query is "more scans over the one
# substrate" — proven to return the SAME nodes/fields as the equivalent Cypher query.
#
# Pi discipline: the WHOLE surface is a hand-written parser + resolver — PURE RUST, NO
# async-graphql (evaluated: ~80+ transitive crates + a proc-macro schema-derive, too
# heavy for the Pi tier). The facade gates it behind `graphql`, folded into node/
# cluster/full but OUT of `pi`/`default`, so a Pi build links nothing here.
[package]
name = "eg-graphql"
version = "0.1.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Native GraphQL read surface for the epistemic-graph engine: schema-from-graph + a resolver that compiles a GraphQL query to GraphView scans/traversals (pure-Rust, no async-graphql)"
license = "MIT"

[lib]
name = "eg_graphql"

[features]
# The whole crate is gated by the facade `graphql` feature; the READ/WRITE/subscription
# surface has no inner optionality (it always builds dep-free over eg-core). A default
# build of the crate IS that surface — the facade simply doesn't depend on it unless
# `graphql` is on, which is what keeps it out of the Pi tree.
#
# EG-295: fold federation into graphql/node/full — the Apollo Federation v2 subgraph
# support (CONCEPT:EG-295) is behind the `federation` sub-feature, default-ON here so it
# rides into the facade's `graphql`/`node`/`full` tiers automatically (the facade pulls
# `eg-graphql` with its default features; no tier-aggregate-list edit needed). Build a
# federation-free GraphQL surface with `--no-default-features`.
#
# EG-296: fold GraphQL enterprise hardening into graphql/node/full the SAME way — the
# depth/complexity/APQ/introspection controls (CONCEPT:EG-296) live behind the `hardening`
# sub-feature, default-ON so they ride into the facade's `graphql`/`node`/`full` tiers with
# NO tier-aggregate-list edit (the facade pulls `eg-graphql` with default features; `pi`
# excludes `graphql` entirely, so `sha2` never enters the Pi tree). `hardening` pulls
# `sha2` for the APQ sha256 digest. Build a hardening-free surface with `--no-default-features`.
default = ["federation", "hardening", "crossmodal"]
federation = []
hardening = ["dep:sha2"]
# EG-379/380/381 — the GraphQL CROSS-MODAL transaction seam. Default-ON so it rides into
# the facade's `graphql`/`node`/`full` tiers via the facade's default-features pull
# (federation/hardening precedent). Pulls `eg-plan/query` (uql parse + `execute` +
# `PlanCtx` — the SAME `UnifiedPlan::execute` `run_unified` wraps; `query` is where the
# unified executor lives) and `eg-rdf/sparql` (the CONSTRUCT eval + `INSERT DATA`
# lowering). All of these are already in the facade's graphql tiers (node/cluster/full).
# Build a cross-modal-free surface with
# `--no-default-features`. RECONCILE (EG-383): the facade should enable
# `crossmodal-tsdb` from its tsdb-bearing graphql tier so `addMeasurement` lights up in a
# `full` build, and wire the GraphQL HTTP carrier's `commitTransaction` to the facade's
# durable `commit_cross_modal_txn` (see crossmodal.rs module docs).
crossmodal = ["dep:eg-plan", "eg-plan/query", "dep:eg-rdf", "eg-rdf/sparql"]
# EG-381 — the tsdb leg of the cross-modal seam: `addMeasurement` staging + the in-txn
# `eg_plan::StagedSeries` read-your-own-writes overlay (CONCEPT:EG-374 parity). Pulls
# `eg-plan/timeseries` (→ eg-tsdb). Default-OFF (parity with the facade's `tsdb`-gated
# measurement staging); enabled by the facade's tsdb tier at reconcile.
crossmodal-tsdb = ["crossmodal", "eg-plan/timeseries"]

[dependencies]
eg-core = { path = "../eg-core" }
# EG-379: the unified-query plan front-end + executor (uql parse, `Plan`/`Op`, `execute`,
# `PlanCtx`, `StagedSeries`) — the SAME machinery `run_unified` wraps. Optional + gated by
# `crossmodal` (which enables `eg-plan/query`, where the unified executor lives);
# `crossmodal-tsdb` adds `eg-plan/timeseries` for the in-txn `StagedSeries` overlay.
eg-plan = { path = "../eg-plan", optional = true }
# EG-379: SPARQL CONSTRUCT evaluation (`run_outcome`) + `INSERT DATA` lowering
# (`insert_data_triples`) + the RDF term model (`oxrdf`, `mapping::literal_to_cell`).
# Optional + gated by `crossmodal` (pulls `eg-rdf/sparql`).
eg-rdf = { path = "../eg-rdf", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
# Variable-hop / single-hop edge traversal over GraphView's StableDiGraph. Already
# linked transitively via eg-core; pin the same minor. NOT a new heavy dep.
petgraph = { version = "0.6.4", features = ["serde-1"] }
# EG-296: sha256 digest for Automatic Persisted Queries (APQ). RustCrypto `sha2` is
# already a workspace dep elsewhere; optional + gated by `hardening`, so it links only
# into the GraphQL-bearing tiers (never Pi, which excludes `graphql`).
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
# The equivalence test runs the SAME query through the engine's real Cypher executor
# (eg-query/cypher — dep-free, no DataFusion) and asserts GraphQL == Cypher.
eg-query = { path = "../eg-query", features = ["cypher"] }
