[package]
name = "eg-core"
version = "0.27.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Graph core (storage, registry, isolation, semantic search) for the epistemic-graph engine"
license = "MIT"

[lib]
name = "eg_core"

[features]
default = []
# Use the native eg-ann IVF-PQ+OPQ+SQ8-refine index (CONCEPT:KG-2.207) as the
# SemanticStore ANN backend instead of the rebuild-on-load hnsw_rs index. The
# persisted index reopens WITHOUT rebuilding from raw vectors. OFF by default;
# the facade folds it into the durable tiers. Pure-Rust, no GPU/native-ML deps.
ann = ["dep:eg-ann"]
# Additionally persist the ANN codes into the engine's redb durable tier
# (CONCEPT:KG-2.195) rather than only the mmap files.
ann-redb = ["ann", "eg-ann/redb"]
# Engine-level security (CONCEPT:KG-2.231): per-agent Row-Level Security view filter
# in the read/plan path (`isolation::IsolationLayer::filter_view`). Pure-Rust — no
# dep (the visibility convention is a node-property check). Gated so a non-security
# build links nothing extra.
security = []

[dependencies]
eg-types = { path = "../eg-types" }
eg-ann = { path = "../eg-ann", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
petgraph = { version = "0.6.4", features = ["serde-1"] }
parking_lot = "0.12"
dashmap = "6.1"
hnsw_rs = "0.3"
hex = "0.4"
aho-corasick = "1.1"
