[package]
name = "eg-core"
version = "0.27.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Graph core (storage, registry, isolation, semantic search) for the epistemic-graph engine"
license = "MIT"

[lib]
name = "eg_core"

[dependencies]
eg-types = { path = "../eg-types" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
petgraph = { version = "0.6.4", features = ["serde-1"] }
parking_lot = "0.12"
dashmap = "6.1"
hnsw_rs = "0.3"
hex = "0.4"
