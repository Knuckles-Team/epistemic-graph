[package]
name = "eg-core"
version = "0.27.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Graph core (storage, registry, isolation, semantic search) for the epistemic-graph engine"
license = "MIT"

[lib]
name = "eg_core"

[features]
default = []
# Message-broker exchanges/routing (CONCEPT:EG-275) on top of the KG-2.303 work
# queue: the `broker` module (Exchange/Binding/topic-route) + `GraphCore::
# broker_enqueue`. PURE-RUST — no new dep (only serde/serde_json/rmp already linked)
# — so it is Pi-safe; the facade folds it into the durable serving tiers. Gates
# `eg-types/broker` so the broker `Method` variants appear in lock step.
broker = ["eg-types/broker"]
# Use the native eg-ann IVF-PQ+OPQ+SQ8-refine index (CONCEPT:KG-2.207) as the
# SemanticStore ANN backend instead of the rebuild-on-load hnsw_rs index. The
# persisted index reopens WITHOUT rebuilding from raw vectors. OFF by default;
# the facade folds it into the durable tiers. Pure-Rust, no GPU/native-ML deps.
# `tracing` carries the CONCEPT:EG-013 warm/build-throughput spans (no-op without a
# subscriber, so zero cost in the default build). `rayon` (CONCEPT:EG-014) drives
# the all-core parallel brute-force fallback — the path EVERY semantic_search hits
# until the ANN index warms (and after every restart).
ann = ["dep:eg-ann", "dep:tracing", "dep:rayon"]
# Additionally persist the ANN codes into the engine's redb durable tier
# (CONCEPT:KG-2.195) rather than only the mmap files.
ann-redb = ["ann", "eg-ann/redb"]
# Engine-level security (CONCEPT:KG-2.231): per-agent Row-Level Security view filter
# in the read/plan path (`isolation::IsolationLayer::filter_view`) + RBAC-at-scale
# (CONCEPT:EG-092) + durable RBAC/identity persistence (CONCEPT:EG-303). The RLS/RBAC
# evaluators are pure-Rust; EG-303 links `redb` (same 4.1 as the durable tiers) to
# persist the RbacPolicy + registered AgentIdentities across restarts. Gated so a
# non-security build links neither. redb is Pi-safe; `pi` does NOT enable security.
security = ["dep:redb"]
# Version-keyed query-RESULT cache (CONCEPT:KG-2.233) on `GraphCore`. Pure-Rust
# bounded LRU + 128-bit query hash — no new dep — so the facade folds it into the
# lean Pi tier as well as node/cluster/full.
result-cache = []
# Durable JSONPath index persistence (CONCEPT:EG-308): the redb-backed
# `RedbPathIndexStore` impl of the dep-free `PathIndexPersistence` seam, so the
# demand-driven EG-084 JSONPath index (`path → value → ids` / `path → ids`) is
# written through to `{persist_dir}/path_index.redb` and rehydrated at boot,
# skipping the full node rescan on the first JSON filter after a cold start. Links
# `redb` (the SAME 4.1 the durable tiers + EG-303 link); OFF by default so a bare /
# Pi eg-core build stays fully in-memory (the seam + in-memory default are dep-free).
path-persist = ["dep:redb"]
# Cold object-store tier seam (CONCEPT:KG-2.233): a `ColdTier` trait (RAM→redb→
# object-store) + an in-memory default impl, for offloading a cold graph's whole
# serialized state and rehydrating on access. The trait + default are dep-free
# (Pi-safe); the facade layers a redb/S3 impl on top. Folded into pi/node/cluster/
# full alongside `result-cache`.
cold-tier = []

[dependencies]
eg-types = { path = "../eg-types" }
eg-ann = { path = "../eg-ann", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
petgraph = { version = "0.6.4", features = ["serde-1"] }
parking_lot = "0.12"
dashmap = "6.1"
hnsw_rs = "0.3"
hex = "0.4"
aho-corasick = "1.1"
# CONCEPT:EG-013 — semantic ANN build/warm tracing spans (only under `ann`).
tracing = { version = "0.1", optional = true }
# CONCEPT:EG-014 — all-core parallel brute-force fallback (only under `ann`).
rayon = { version = "1.10", optional = true }
# CONCEPT:EG-303 — durable RBAC/identity persistence: the `security` feature persists
# the RbacPolicy + registered AgentIdentities to a redb table so roles/grants/
# identities survive a restart. Same redb 4.1 the durable tiers link; only pulled in
# under `security` (Pi builds do not enable eg-core/security).
redb = { version = "4.1", optional = true }
