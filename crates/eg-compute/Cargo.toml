[package]
name = "eg-compute"
version = "0.27.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Compute domains (graph algorithms, finance, datascience, reasoning, AST) for the epistemic-graph engine"
license = "MIT"

[lib]
name = "eg_compute"

[features]
# `algorithms`, `ast`, and `parser` are always compiled (algorithms is used by
# the always-on graph-op handlers); the heavy domains are gated so a slim build
# links neither their code nor their deps. Mirrors the facade feature names 1:1.
# finance/datascience also turn on the matching eg-types feature so the wire
# DTOs they re-export (`eg_types::wire::{Order, FittedModel, ...}`) exist.
finance = ["dep:nalgebra", "eg-types/finance"]
datascience = ["dep:rand_chacha", "eg-types/datascience"]
# Data-mining domain (CONCEPT:EG-KG.mining.frequent-itemset-mining): pure-Rust,
# dependency-light frequent-itemset + association-rule mining. No heavy dep — only
# turns on the matching eg-types feature so the `MineAssociate` wire variant exists.
mining = ["eg-types/mining", "dep:eg-geo"]
# Graph-learning / neuro-symbolic domain (CONCEPT:EG-KG.graphlearn.link-predictor):
# a pure-Rust KAN (Kolmogorov-Arnold) link-predictor over the resident graph whose
# learned per-feature edge functions ARE queryable KG artifacts. Reuses the
# analytic-gradient Adam kernels from `datascience::training`, so it implies
# `datascience`; also turns on the matching eg-types feature so the `GraphLearn*`
# wire variants exist. No heavy dep (no torch) — folded into `full` via `compute`.
graphlearn = ["datascience", "eg-types/graphlearn"]
reasoning = []
# General bounded 0-1 integer programming with verifiable certificates (Decide
# layer package A3): a deterministic node-budgeted branch-and-bound, Lagrangian
# leaf-bound certificates and an independent verifier (`Method::Solve`). The
# wire DTOs (validated models with integer rows and a lexicographic objective)
# live in `eg-types::solve`; this gates the search and the certificate verifier.
solve = []
# RF-ADR-010 A2: `is_a` derivation, evidence classification and the task ->
# capability closure the assembly layer reasons with. It builds and solves a
# model, so it implies `solve`.
decide = ["solve"]
# The statistical half of the Decide layer: heads, calibration and the
# off-policy estimators, which are eg-numeric kernels.
decide-stats = ["decide", "dep:eg-numeric"]
# GPU transitive-closure DISPATCH SEAM (CONCEPT:EG-KG.compute.reasoning-closure-gpu):
# compiles the `ClosureBackend` trait + backend selection in `reasoning_closure`. The
# pure-Rust CPU hash-join is ALWAYS the compiled-in fallback; this marker just opts a
# build into the seam (and is implied by `gpu-cuda`). No accelerator dep on its own —
# Pi-lean, kept OUT of pi/full by the facade. Implies `reasoning` (the module it extends).
gpu = ["reasoning"]
# REAL CUDA transitive-join backend: pulls `cudarc` (dynamic-loading, so it builds with
# NO CUDA toolkit) and runs the two-pass CSR-join kernel on a GPU when a device is
# present, else falls back to the CPU backend at runtime. Implies `gpu`. OUT of
# pi/default/full — an extras-only feature, mirroring `eg-ann`'s `gpu-cuda`.
gpu-cuda = ["gpu", "dep:cudarc"]
# ModalityContract retrofit (CONCEPT:E4): `impl ModalityContract for MergeProposal`
# AND `impl ModalityContract for ast::symbol::Symbol` (the X1 real `evidence_address()` ->
# `EvidenceAddress::CodeSymbol` resolver) + the `modality_conformance_tests!` battery for
# each. OFF by default, deliberately NOT folded into any tier aggregate — it is a
# capability-discovery/testing seam, not a serving feature. `MergeProposal`/
# `resolve_candidates` live in the always-on `algorithms` module and `Symbol` lives in
# the always-on `ast` module, so `contract` needs no other feature implied.
# `cargo test -p eg-compute --features contract` runs the suite.
contract = ["dep:eg-modality"]
ast = [
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-sequel",
]
# CONCEPT:KG-2.106 — the extended-language tier. Feature-gated because each grammar
# adds compile time + binary size; the `ast` core stays lean and `full` opts in.
ast-extended = [
    "ast",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-php",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-objc",
    "dep:tree-sitter-zig",
    "dep:tree-sitter-groovy",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-verilog",
    "dep:tree-sitter-julia",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-powershell",
    "dep:tree-sitter-fortran",
    "dep:tree-sitter-pascal",
    # HTML/CSS/JSON register and parse but the generic walker extracts no
    # symbols from them (no function/class concept) — see the ABI-pin
    # comment block below.
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
    "dep:tree-sitter-json",
]

[dependencies]
eg-types = { path = "../eg-types" }
eg-core = { path = "../eg-core" }
# Reuse eg-geo's generic symmetric distance-matrix traversal for t-SNE's
# squared-vector metric. Optional with the mining domain so slim builds keep
# the GIS leaf out of their dependency graph.
eg-geo = { path = "../eg-geo", default-features = false, optional = true }
# The exact numeric kernels the statistical decision surface is built on
# (calibration, conformal prediction, off-policy estimators). Optional so a
# build without `decide-stats` links none of it.
eg-numeric = { path = "../eg-numeric", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
petgraph = { version = "0.6.4", features = ["serde-1"] }
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# Lightweight tracing spans for AST parse/index throughput (CONCEPT:EG-011). The
# `tracing` facade compiles to a no-op unless a subscriber is installed, so this
# adds no runtime cost to a default build.
tracing = "0.1"
# ModalityContract retrofit (CONCEPT:E4). Optional, only under `contract` (default
# OFF) — a default build links none of it and `MergeProposal` carries no new
# required trait. See `src/contract.rs`.
eg-modality = { path = "../eg-modality", optional = true }

# Optional, domain-gated heavy deps.
nalgebra = { version = "0.35", features = ["serde"], optional = true }
rand_chacha = { version = "0.3", optional = true }
# REAL CUDA transitive-join backend (CONCEPT:EG-KG.compute.reasoning-closure-gpu), only
# under `gpu-cuda`. `dynamic-loading` dlopens libcuda at runtime, so a `gpu-cuda` build
# needs no CUDA toolkit and runs (CPU fallback) on a GPU-less host. Pinned to eg-ann's
# exact cudarc config so one process shares a single driver/context.
cudarc = { version = "0.17", optional = true, default-features = false, features = ["driver", "nvrtc", "dynamic-loading", "cuda-12060"] }
tree-sitter = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
# Pinned to an ABI-14 grammar: 0.23.5 was regenerated with tree-sitter ABI 15,
# which the 0.23 core runtime rejects ("Incompatible language version 15").
tree-sitter-c-sharp = { version = "=0.23.1", optional = true }
# SQL DDL grammar (CONCEPT:KG-2.212) — derekstride's tree-sitter-sql, published as
# `tree-sitter-sequel`. Parses CREATE TABLE/VIEW + FOREIGN KEY into the database
# ontology (tables/columns/views/FKs), part of the `ast` core tier.
tree-sitter-sequel = { version = "0.3", optional = true }
# Extended-language tier (CONCEPT:KG-2.106), gated by `ast-extended`.
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.23", optional = true }
tree-sitter-bash = { version = "0.23", optional = true }
tree-sitter-scala = { version = "0.23", optional = true }
tree-sitter-lua = { version = "0.2", optional = true }
# CONCEPT:EH-281 grammar expansion — every pin below was checked against this
# crate's tree-sitter 0.23 core (ABI 14, `MIN_COMPATIBLE_LANGUAGE_VERSION..=
# LANGUAGE_VERSION` = 13..=14) the same way `tree-sitter-c-sharp` above was:
# download the crate, read `src/parser.c`'s `LANGUAGE_VERSION`, and pin the
# newest release that is still 14, because a newer release generated at ABI 15
# fails `Parser::set_language` at runtime ("Incompatible language version 15"),
# not at compile time — cargo happily builds an ABI you can't actually parse
# with. No CUDA crate is pinned: crates.io's only maintained one (0.21.2) is
# ABI 15 with no older ABI-14 release, and CUDA source is a C++ superset
# anyway, so `tree_sitter.rs` routes `.cu`/`.cuh` through `tree-sitter-cpp`
# instead (see the CUDA row in `CORE_LANGUAGES`). No Terraform/HCL crate is
# pinned: `tree-sitter-hcl` has published exactly ONE release ever, 1.1.0,
# and it is ABI 15 (re-verified 2026-09-22); no fork or alternate maintained
# crate (`tree-sitter-terraform`, `tree-sitter-tf`, ...) exists on crates.io.
# No DreamMaker crate is pinned either: `tree-sitter-dm` (feudeytf, MIT,
# `crates.io` description "DreamMaker grammar" — the earlier "no maintained
# grammar at all" finding was a name-only miss, checked against the WRONG
# package name `tree-sitter-dreammaker`) exists and IS actively maintained
# (4 releases, latest 2026-09-06), but all 4 published versions (0.25.0
# through 0.25.4) are ABI 15 — re-verified 2026-09-22, `src/parser.c`'s
# `LANGUAGE_VERSION` = 15 on every one. No ABI-14 release exists for either
# language, so neither can load against this crate's pinned tree-sitter 0.23
# core; bumping the core to pick up ABI 15 is out of scope here (it would
# invalidate every other ABI-14 pin in this list).
tree-sitter-kotlin-ng = { version = "=1.0.1", optional = true }
tree-sitter-objc = { version = "=3.0.2", optional = true }
tree-sitter-zig = { version = "=1.1.2", optional = true }
tree-sitter-groovy = { version = "=0.1.2", optional = true }
# 0.7.x+ moved to ABI 15; 0.6.0 is the newest ABI-14 release.
tree-sitter-swift = { version = "=0.6.0", optional = true }
# Verilog/SystemVerilog (CONCEPT:EH-281). ABI 14 (`src/parser.c`'s
# `LANGUAGE_VERSION` = 14) — verified the same way as every other pin above.
tree-sitter-verilog = { version = "=1.0.3", optional = true }
# Julia. Newest release (0.23.1) is already ABI 14, MIT.
tree-sitter-julia = { version = "=0.23.1", optional = true }
# Elixir. Every release ever published (up to 0.3.5) is ABI 14, Apache-2.0.
tree-sitter-elixir = { version = "=0.3.5", optional = true }
# PowerShell. 0.26.x+ moved to ABI 15; 0.25.9 is the newest ABI-14 release, MIT.
tree-sitter-powershell = { version = "=0.25.9", optional = true }
# Fortran. 0.6.0 moved to ABI 15; 0.5.1 is the newest ABI-14 release, MIT.
tree-sitter-fortran = { version = "=0.5.1", optional = true }
# Pascal/Delphi. Newest release (0.10.2) is already ABI 14, MIT.
tree-sitter-pascal = { version = "=0.10.2", optional = true }
# HTML/CSS/JSON (CONCEPT:EH-281 follow-up): registered for real parsing —
# content_digest/parser_capability_digest and future dedicated structural
# extraction — even though the generic declaration walker extracts zero
# symbols from any of them today (see `grammars_extended`'s module doc).
# CSS 0.25.0+ and JSON's pre-0.24.3 line moved to/started above ABI 15; the
# versions below are each the newest ABI-14 release, all MIT.
tree-sitter-html = { version = "=0.23.2", optional = true }
tree-sitter-css = { version = "=0.23.2", optional = true }
tree-sitter-json = { version = "=0.24.8", optional = true }

# Criterion harness for the AST parse-throughput baseline bench (CONCEPT:EG-012).
# DEV-only — never linked into the engine binary.
[dev-dependencies]
criterion = "0.5"
# Deterministic RNG for the reasoning-closure differential/parity tests (the runtime
# `rand_chacha` dep is optional under `datascience`; tests need it unconditionally).
rand_chacha = "0.3"

# Offline `IndexRepository` driver harness: calls `parser::resolve::index_repository`,
# which lives behind the `ast` grammars, so the example is gated to it (a default
# `cargo check --examples`, or a check under another feature such as `solve`, skips it).
# Run: `cargo run -p eg-compute --features ast --example index_repository_json`.
[[example]]
name = "index_repository_json"
path = "examples/index_repository_json.rs"
required-features = ["ast"]

# AST parse-throughput baseline (CONCEPT:EG-012). `parse_files` lives behind the
# `ast` grammars, so the bench is gated to it (a default `cargo check --benches`
# skips it). Run: `cargo bench -p eg-compute --features ast --bench parse_bench`.
[[bench]]
name = "parse_bench"
path = "benches/parse_bench.rs"
harness = false
required-features = ["ast"]

# Approximate gds.knn (NN-descent) quality + speed bench (CONCEPT:EG-KG.compute.node-similarity,
# W4.3/E11): seeded NN-descent vs the exact O(V^2) sweep. Always-on graph_algos, so no
# required-features.
[[bench]]
name = "approx_knn"
path = "benches/approx_knn.rs"
harness = false

# Assembly-scale solver bench (Decide A3): 64 candidates x 32 capabilities with
# exactly-one, implication, budget and cardinality rows, solved and verified.
# Run: `cargo bench -p eg-compute --features solve --bench solve_cover`.
[[bench]]
name = "solve_cover"
path = "benches/solve_cover.rs"
harness = false
required-features = ["solve"]

# Test-only opt-in cfg (not a feature, so `--all-features` never turns it on). See the
# crate's device/CPU-feature parity tests for when to pass `--cfg eg_gpu_device_tests`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(eg_gpu_device_tests)"] }
