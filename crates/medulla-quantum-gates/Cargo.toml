[package]
name = "medulla-quantum-gates"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Dense unitary matrix definitions for medulla-quantum-core's GateKind vocabulary (register D-QN-1, lane Q1 vendoring). The mathematical content of these matrices is ported from open-source-libraries/quantrs (QuantRS2, Apache-2.0) core/src/gate/functions.rs; see NOTICE for attribution. Pure math, no vendor OOP scaffolding (no GateOp trait objects, no QubitId struct, no Any downcasting) -- medulla-quantum-core's own GateKind + qubit indices already cover that role."
license = "Apache-2.0"

[lib]
name = "medulla_quantum_gates"

[dependencies]
medulla-quantum-core = { path = "../medulla-quantum-core" }
medulla-numeric = { path = "../medulla-numeric", features = ["complex"] }
thiserror = "2.0"

[features]
default = []
