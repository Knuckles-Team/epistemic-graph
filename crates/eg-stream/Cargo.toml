[package]
name = "eg-stream"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Pure-Rust event-stream + complex-event-processing (CEP) modality for the epistemic-graph engine (CONCEPT:EG-088) — a bounded NFA CEP engine over a time-ordered event stream with Sequence / Within / Absence operators + per-event attribute predicates, run over sliding / tumbling windows. Sync + runtime-free (NO tokio) so the engine is trivially unit-testable; the live standing-query loop fed by the EG-064 CDC bus is a documented follow-up. EG-067 `Op::Window` is the windowing primitive."
license = "MIT"

[lib]
name = "eg_stream"

# Pi-lean by design — a leaf crate like eg-ann / eg-geo / eg-tensor. The BATCH engine's
# only deps are serde (the `CepPattern` / `Event` / `Match` are serializable so a pattern
# persists / rides the wire) and serde_json (the concept row fixes an event's `attrs` to a
# `serde_json::Map`, and per-event predicates compare `serde_json::Value`s — the same value
# model eg-plan already decodes node blobs into). `tokio` is pulled ONLY by the `stream`
# feature (the LIVE standing-query engine); a default / Pi build links none of it, so the
# batch NFA stays synchronous + runtime-free and folds cleanly into node/full, OUT of `pi`.

[features]
# Default = the pure-Rust, runtime-free BATCH CEP engine only (serde + serde_json). This
# is what eg-plan pulls for the batch `Op::Cep` executor, and it links NO tokio.
default = []
# The LIVE / standing-query half (CONCEPT:EG-088): `live::CepEngine` + `CepSubscription`,
# the push loop fed by the EG-064 CDC bus. The ONLY thing that pulls `tokio` (broadcast
# channels + the spawned bus-drain task). Activated by the top-level engine's `stream`
# feature (`eg-plan/stream → eg-stream/stream`), so `node`/`full` get the live engine while
# a default / Pi build (which never turns `stream` on) links no tokio.
stream = ["dep:tokio"]
# ModalityContract retrofit (CONCEPT:E4): `impl ModalityContract for Event` + the
# `modality_conformance_tests!` battery. OFF by default, deliberately NOT folded into
# any tier aggregate (pi/node/full) — it is a capability-discovery/testing seam, not
# a serving feature. `cargo test -p eg-stream --features contract` runs the suite.
contract = ["dep:eg-modality"]
# CA-11 — CDC-to-Kafka sink (DEC-CA-03). Default OFF, reserved by CA-17's stub
# commit (root `Cargo.toml`'s `cdc-kafka = ["streaming", "dep:eg-stream",
# "eg-stream/cdc-kafka"]` -- the `dep:eg-stream`/`eg-stream/cdc-kafka` edge is
# THIS lane's one addition to that line, called out in the CA-11 report).
# Pulls `rdkafka` -- the only C dependency this otherwise pure-Rust leaf crate
# ever takes. `cmake-build` vendors + compiles librdkafka's C source locally
# (no system `librdkafka-dev` package required, just a C toolchain + cmake);
# `ssl`+`sasl` link Cyrus SASL so DEC-CA-03's SASL/SCRAM producer-config
# surface actually works at runtime once armed -- the broker itself stays
# PLAINTEXT until CA-51, this only makes the CONFIG OPTION real rather than a
# no-op string.
#
# ⚠ BUILD-HOST REQUIREMENT -- `libsasl2-dev` (wD10 / WD10-P-EGCI, 2026-08-28)
#
# The paragraph above used to end "...just a C toolchain + cmake, both already
# on every eg build host". That claim was true of OUR hosts and FALSE of the
# GitHub `ubuntu-latest` runner, and it is precisely what made the divergence
# invisible for weeks. It is CORRECTED here:
#
#   * `cmake-build` really does vendor librdkafka -- no system librdkafka.
#   * `sasl` does NOT vendor anything. rdkafka's `sasl` -> rdkafka-sys's
#     `gssapi` -> the `sasl2-sys` crate, whose build.rs takes its NON-vendored
#     `find_sasl()` path by default and hard-panics
#     ("Unable to find libsasl2 on your system",
#     sasl2-sys-0.1.22+2.1.28/build.rs:343) when no system Cyrus SASL
#     development package is present.
#
# So ANY build that turns `cdc-kafka` on needs `libsasl2-dev` (Debian/Ubuntu)
# / `cyrus-sasl-devel` (RHEL) installed. Our dev + build hosts have it
# (`ii libsasl2-dev 2.1.28+dfsg1-9ubuntu3`); the GitHub runner does not, so
# EVERY `Release` run on `main` since this feature landed died in
# `lint-and-architecture`'s `cargo clippy --workspace --all-features
# --all-targets` -- the ONE CI job that turns this feature on. (`full` does
# NOT include `cdc-kafka`, so the five wheel legs never compile it.)
# `.github/workflows/release.yml` now installs the package in that job; if you
# add another job that builds `--all-features` over this workspace, it needs
# the same step.
#
# Why not just vendor Cyrus SASL too (`sasl2-sys/vendored`), which would make
# this hermetic and delete the requirement? MEASURED and rejected, 2026-08-28:
# sasl2-sys 0.1.22+2.1.28 is the newest published version, and the Cyrus SASL
# 2.1.28 sources it bundles use K&R `PROTO_LIST(())` declarations in
# `lib/md5.c` that a C23-default compiler rejects outright
# ("error: too many arguments to function 'MD5_memcpy'; expected 0, have 3").
# Our hosts are Ubuntu 26.04 / GCC 15.2 (`__STDC_VERSION__ 202311L`), so the
# vendored build FAILS here and only succeeds with `CFLAGS=-std=gnu17` in the
# process environment -- which cannot be expressed in a Cargo manifest at all
# (sasl2-sys reads `CFLAGS` from the env), only as a repo-global setting that
# would then be imposed on every other C build in the workspace. Vendoring
# would therefore trade a CI-only divergence for an every-host one. See the
# WD10-P-EGCI lane report for the full transcript.
cdc-kafka = ["dep:rdkafka"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CA-11's Kafka producer (feature `cdc-kafka` only). See the feature's doc
# above for why `cmake-build` + `ssl` + `sasl`.
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "ssl", "sasl"], optional = true }
# Async runtime for the LIVE standing-query engine ONLY (feature `stream`): broadcast
# channels for per-subscription match fan-out + backpressure, and the source bus-drain
# task. Optional + referenced only under #[cfg(feature = "stream")], so a default / Pi
# build links none of it. `sync` = channels, `rt` + `macros` = spawn + `#[tokio::test]`.
tokio = { version = "1.38", features = ["sync", "rt", "macros"], optional = true }
# ModalityContract retrofit (CONCEPT:E4). Optional, only under `contract` (default
# OFF) — a default/node/full build links none of it and `Event` carries no new
# required trait. See `src/contract.rs`.
eg-modality = { path = "../eg-modality", optional = true }
