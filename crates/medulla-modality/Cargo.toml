[package]
name = "medulla-modality"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "ModalityContract trait + conformance harness (CONCEPT:E4) — the shared seam every medulla-* modality crate (tensor/geo/tsdb/rdf/…) can converge on: a DAG-safe RowSet projection, a transaction-staging shape, an optional CDC topic, and default-empty provenance/evidence/policy/analytics hooks. A tiny leaf crate, deliberately BELOW medulla-plan/medulla-core in the DAG (deps = medulla-types only) so no modality crate has to move to depend on it."
license = "MIT"

[lib]
name = "medulla_modality"

# A leaf crate like medulla-ann/medulla-geo/medulla-tensor, but ONE step further down: it depends on
# medulla-types ONLY (no medulla-core, no medulla-plan). This is deliberate — medulla-plan already defines
# the REAL cross-modal RowSet/exec currency and sits ABOVE medulla-core; if medulla-modality
# depended on medulla-plan (to reuse its `RowSet`), every modality crate implementing this
# trait would transitively pull medulla-plan/medulla-core, INVERTING the DAG
# (medulla-types -> medulla-core -> medulla-compute -> medulla-engine, modalities sit at/near the
# bottom). So `RowSetShape` here is a small, DAG-safe `{id, score}` dup of
# `medulla_plan::rowset::Row` (see `src/rowset.rs` for the full rationale) — never a
# re-export of the real type.
[dependencies]
medulla-types = { path = "../medulla-types" }
serde = { version = "1.0", features = ["derive"] }
# Only used to encode/decode a `StagedWrite` payload for the conformance round-trip
# test (`decode_staged`/`encode_staged`). Already linked workspace-wide (medulla-types
# itself depends on it), so this adds no new dependency to the tree.
serde_json = "1.0"
sha2 = "0.10"

# MEDULLA-P1-1 fleet aggregator (`tests/fleet_tck.rs`): pull the pilot modality crates in
# (each with its own `contract` feature on) so their TCK reports can be collected into
# ONE cross-crate parity table within a single test process — the `registered_
# modalities()` registry is process-scoped, so a whole-fleet view needs every modality
# registered in the SAME process, which only something ABOVE the modality crates (like
# this test harness) can arrange.
#
# This is a DEV-DEPENDENCY CYCLE: medulla-tensor/medulla-geo depend on medulla-modality (optionally,
# under their `contract` feature), and here medulla-modality dev-depends back on them. Cargo
# EXPLICITLY permits cycles through dev-dependencies (they are compiled only for
# medulla-modality's own tests, are not part of the normal build graph, and never propagate
# to the ~17 crates that depend on medulla-modality). `cargo build -p medulla-modality` and every
# downstream crate are entirely unaffected; only `cargo test -p medulla-modality` pays the
# cost of building the two pilots. See `tests/fleet_tck.rs` for the mechanism writeup.
[dev-dependencies]
medulla-tensor = { path = "../medulla-tensor", features = ["contract"] }
medulla-geo = { path = "../medulla-geo", features = ["contract"] }
medulla-document = { path = "../medulla-document", features = ["contract", "serving"] }
medulla-image = { path = "../medulla-image", features = ["contract", "serving", "runtime"] }
medulla-audio = { path = "../medulla-audio", features = ["contract", "serving", "runtime"] }
medulla-video = { path = "../medulla-video", features = ["contract", "serving", "runtime"] }
