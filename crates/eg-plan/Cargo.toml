[package]
name = "eg-plan"
version = "0.33.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Unified cross-modal query planner (CONCEPT:KG-2.208/209) — a RowSet closed algebra sequencing the existing SQL (DataFusion), graph (petgraph BFS) and vector (SemanticStore) legs into ONE plan, with a cost-based filter-vs-vector reorder"
license = "MIT"

[lib]
name = "eg_plan"

[features]
# `query` pulls the DataFusion-backed FILTER leg (via eg-query/sql). A default
# build links NO DataFusion: the algebra, the cost model, the graph/vector legs
# and the plan IR all compile dep-free (the Pi contract). The DataFusion `Filter`
# leg — and the `UnifiedPlan::execute` that needs it — are gated behind this
# feature, exactly as the facade gates `query`.
default = []
query = ["dep:eg-query", "eg-query/sql"]
# The cross-modal cost-based optimizer (CONCEPT:EG-KG.query.xmodal-cost-optimizer). The engine
# itself compiles under `query` (beside the executor) and is active by default with the
# runtime kill-switch `EPISTEMIC_GRAPH_COST_OPT=0` → identity; this feature is the FACADE tier
# selector (implies `query`) that the `full`/`node` profiles turn on. A `pi`/default build
# links no DataFusion and never reaches `plan_optimize`, so it is unaffected.
cost-opt = ["query"]
# Lexical BM25 `RankText` op + the RRF `FuseRrf` hybrid (CONCEPT:KG-2.215). Pulls
# eg-text's Tantivy index (the `tantivy` backend) and turns on the `text` wire
# variants in eg-types. It IMPLIES `query` because the new ops live inside the
# `query`-gated `Op` enum and the text executor branch sits beside the DataFusion
# FILTER leg. A default/Pi build sets neither feature → no eg-text/Tantivy linked.
text = ["query", "dep:eg-text", "eg-text/tantivy", "eg-types/text"]
# OWL/SPARQL SOURCE ops (CONCEPT:KG-2.220): `Reason` (OWL-inferred class members) +
# `SparqlBgp` (SPARQL-selected ids) as RowSet sources, so ONE UnifiedQuery plan can do
# OWL/SPARQL candidate-set → graph Traverse / vector Rank / SQL Filter / Limit. Pulls
# eg-rdf's pure-Rust `owl` (EL⁺ reasoner) + `sparql` evaluator. IMPLIES `query` (the
# ops live inside the `query`-gated `Op` enum, beside the DataFusion FILTER leg). A
# default/Pi build sets neither feature → no eg-rdf reasoner/evaluator linked here.
owl = ["query", "dep:eg-rdf", "eg-rdf/owl", "eg-rdf/sparql", "eg-types/owl-plan"]
# The WASM `Udf` TRANSFORM op (CONCEPT:KG-2.228): run a registered, sandboxed
# WebAssembly UDF over the current RowSet inside a UnifiedQuery plan. Pulls eg-wasm's
# wasmtime runtime + turns on the `wasm-udf` wire variant in eg-types. IMPLIES `query`
# (the op lives in the `query`-gated `Op` enum). A default/Pi build links no wasmtime.
wasm-udf = ["query", "dep:eg-wasm", "eg-wasm/wasm-udf", "eg-types/wasm-udf"]
# Query federation / foreign sources (CONCEPT:KG-2.232, Lane P): the `ForeignScan`
# SOURCE op + the `ForeignSource` trait with TWO kinds — a REMOTE epistemic-graph
# engine (reached over the SAME length-prefixed-MessagePack + HMAC transport via a
# blocking TCP client; pulls hmac/sha2/hex) and a GENERIC HTTP/JSON source (pulls
# `ureq` — a PURE-RUST rustls HTTP client, NOT openssl). IMPLIES `query` (the op lives
# inside the `query`-gated `Op` enum, beside the DataFusion FILTER leg). HEAVY-ish (a
# TLS stack), so it is OFF by default and the facade folds it into node/cluster/full
# but NEVER `pi` — the Pi contract: a `pi` build links no rustls/ring/ureq.
federation = [
    "query",
    "eg-types/federation",
    "dep:ureq",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
]
# Time-series WINDOW execution (CONCEPT:EG-067) + native TSDB SOURCE scan (CONCEPT:EG-363):
# wire eg-tsdb's native windowed-aggregate primitives (`time_bucket`/`aggregate`) behind
# `Op::Window`/`Op::SensorFuse`, and its durable `SeriesStore` behind `Op::TsScan` — the
# tsdb-in-plan SOURCE that seeds a RowSet from stored series (Gap 3). Pulls eg-tsdb's query
# primitives (eg-core/eg-compute only, NO DataFusion) PLUS its `redb-store` backend, so
# `Op::TsScan` can READ the `SeriesStore` (the store type lives behind eg-tsdb's own
# `redb-store` feature). redb is pure-Rust (no C dep, no pyo3). IMPLIES `query` (the ops
# live inside the `query`-gated `Op` enum, beside the AsOf time leg). OFF by default and
# folded by the facade into node/cluster/full but NEVER `pi` — the Pi contract: a `pi` build
# links no eg-tsdb/redb. Without it `Op::Window` stays the RowSet-preserving marker it lowers
# from and `Op::TsScan` does not exist (the plan still runs).
timeseries = ["query", "dep:eg-tsdb", "eg-tsdb/redb-store", "eg-types/timeseries"]
# EXTERNAL relational-SQL federation (CONCEPT:KG-2.239): the third `ForeignSource` kind
# — `ForeignSourceSpec::Sql` — connecting to an external Postgres/MySQL via a DSN and
# running a SQL query, mapping rows → RowSet. Pulls `sqlx` with the
# `runtime-tokio` + `tls-rustls-ring-native-roots` backend (PURE-RUST rustls —
# NEVER openssl) + a small
# current-thread tokio runtime to drive the async driver from the sync `fetch()` (on the
# blocking pool). IMPLIES `federation`. HEAVY (a SQL driver + a TLS stack), so it is OFF
# by default and the facade folds it into node/cluster/full but NEVER `pi` — the Pi
# contract: a `pi` build links no sqlx/postgres/mysql/openssl.
federation-sql = [
    "federation",
    "dep:sqlx",
    "dep:tokio",
    "dep:futures-util",
    "dep:sqlparser",
]
# Spatial / geospatial modality (CONCEPT:EG-083): the `Op::SpatialScan` SOURCE op (an
# eg-geo packed-Hilbert-R-tree bbox scan over a layer's geometries) + the spatial
# `Pred::SpatialWithin`/`SpatialDWithin` FILTER predicates (evaluated per-row by eg-geo's
# planar `within`/`distance`). Pulls the pure-Rust eg-geo leaf crate (only serde — NO
# GEOS/PROJ/C dep) and turns on the `geo` wire variants in eg-types. IMPLIES `query`
# (the ops live inside the `query`-gated `Op`/`Pred` enums, beside the DataFusion FILTER
# leg). OFF by default; the facade folds it into node/full but NEVER `pi`. A default/Pi
# build (neither feature) links no eg-geo and drops the spatial arm.
geo = ["query", "dep:eg-geo", "eg-types/geo"]
# Array / tensor modality (CONCEPT:EG-085): the `Op::TensorScan` SOURCE op (seed the
# RowSet with a `layer`'s tensor-bearing nodes) + the `Op::TensorOp { kind }` TRANSFORM
# op (apply eg-tensor's slice/reduce/elementwise to each row's stored tensor). Pulls the
# pure-Rust eg-tensor leaf crate (only serde — NO BLAS/LAPACK/C dep) and turns on the
# `tensor` wire variants in eg-types. IMPLIES `query` (the ops live inside the
# `query`-gated `Op` enum, beside the DataFusion FILTER leg). OFF by default; the facade
# folds it into node/full but NEVER `pi`. A default/Pi build (neither feature) links no
# eg-tensor and drops the tensor arms.
tensor = ["query", "dep:eg-tensor", "eg-types/tensor"]
# GPU tensor-op dispatch seam (CONCEPT:EG-326) / real CUDA backend (CONCEPT:EG-327) for
# eg-tensor. `tensor-gpu` opts into the seam; `tensor-gpu-cuda` pulls the real cudarc
# backend (dynamic-loading — no CUDA toolkit to build). OUT of pi/full.
tensor-gpu = ["tensor", "eg-tensor/gpu"]
tensor-gpu-cuda = ["tensor-gpu", "eg-tensor/gpu-cuda"]
# Event-stream + complex-event-processing (CEP) modality (CONCEPT:EG-088): the
# `Op::Cep { pattern }` TRANSFORM op — interpret the input RowSet's rows as a
# time-ordered event stream (each row's node blob carries `ts`/`key`/`attrs`), run the
# eg-stream bounded NFA (Sequence/Within/Absence over sliding/tumbling windows), and keep
# the rows that participate in a match. Pulls the eg-stream leaf crate with its OWN
# `stream` feature ON — which additionally builds the LIVE standing-query engine
# (`eg_stream::live`, tokio broadcast fan-out) so node/full serve push CEP subscriptions,
# not just the batch op. The batch executor here uses only eg-stream's always-on batch API;
# tokio arrives solely via `eg-stream/stream`, and node/full already link tokio (server).
# Turns on the `stream` wire variant in eg-types. IMPLIES `query` (the op lives inside the
# `query`-gated `Op` enum, beside the DataFusion FILTER leg). OFF by default; the facade
# folds it into node/full but NEVER `pi` — a default/Pi build (neither feature) links no
# eg-stream and drops the CEP arm. EG-067 `Op::Window` is the plan-side windowing
# primitive; wiring the EG-064 CDC bus + a subscription surface into the server is the
# documented follow-up.
stream = ["query", "eg-stream/stream", "eg-types/stream"]
# Probabilistic / uncertainty query op (CONCEPT:EG-086): the `Op::Probabilistic { query }`
# TRANSFORM op — score each row by a closed-form probabilistic query over its stored
# `Distribution` value (expectation / marginal / conditional posterior mean / seeded
# sample) and re-order by that score. Pulls eg-compute's `reasoning` domain for the
# conjugate `bayesian_update`; the `Distribution` VALUE + its moment/pdf/quantile/sample
# methods live in eg-types (always compiled). Turns on the `probabilistic` wire variant in
# eg-types. IMPLIES `query` (the op lives inside the `query`-gated `Op` enum, beside the
# DataFusion FILTER leg). eg-compute depends only on eg-core/eg-types — no dependency
# cycle. OFF by default; a default/Pi build links no eg-compute reasoning here and drops
# the arm.
# FOLD: opt-in; deliberately NOT added to any facade tier aggregate (node/full/pi).
probabilistic = [
    "query",
    "eg-types/probabilistic",
    "dep:eg-compute",
    "eg-compute/reasoning",
]
# Engine-native epistemic query surface (CONCEPT:EG-KG.epistemic.epistemic-substrate, E2): the
# `Op::{EvidenceFor,Contradicts,SupportedBy,BeliefAsOf,SourceReliability,ConfidenceOp,
# ExplainBelief}` ops — belief propagation + justification IN-PLAN, composing with the
# graph/vector/relational legs in ONE plan. Pulls the eg-epistemic leaf crate (pure Rust:
# eg-types + eg-core + eg-compute/reasoning — no heavy dep, no cycle: eg-epistemic does NOT
# depend on eg-plan) and turns on the `epistemic` wire variants in eg-types (the SAME feature
# name eg-types already uses for the E6 `as_claim` mining gate — this just adds MORE variants
# under it). IMPLIES `query` (the ops live inside the `query`-gated `Op` enum, beside the
# probabilistic/tensor/geo legs). OFF by default; the facade folds it in alongside `mining`
# (mirroring the eg-kvcache/eg-lake tier-wiring convention) — never forced into `pi`.
#
# ALSO (X1, CONCEPT:E3/E4): enables governed per-row evidence resolution in
# `KnowledgeSet::from_rowset`. Query execution accepts only a complete, validated
# `evidence_locus` committed by ingestion; it never invents identity, policy, lineage,
# or a location from a raw modality value. `eg-modality` is an unconditional,
# dependency-light type dependency below, so `KnowledgeRow::evidence_refs` has the
# same `Vec<EvidenceLocus>` shape in every build. Without `epistemic`, the vector is
# empty; with it, malformed or incomplete loci are rejected rather than downgraded.
epistemic = [
    "query",
    "eg-types/epistemic",
    "dep:eg-epistemic",
]
# Natural-language → query planning seam (CONCEPT:EG-078) + the concrete standalone
# `UreqNlPlanner` (CONCEPT:EG-080). The `NlPlanner` trait + `plan_and_execute*` helpers
# only touch the existing `uql::parse` + `execute`, so this IMPLIES `query`. The concrete
# planner POSTs to an OpenAI-compatible endpoint over the SAME pure-Rust rustls client
# `ureq` the `federation` sources already pull — NO new HTTP client, NO openssl. It also
# pulls `rustls` DIRECTLY (pinned to the `ring` provider ureq already uses, for the
# per-endpoint custom-CA / insecure TLS policy) plus the pure-Rust leaf crates
# Rustls' maintained PKI types/webpki roots (CA parsing/roots) and `base64` (HTTP-Basic token
# exchange) — still NO openssl / NO aws-lc / NO C toolchain. OFF by default; the facade
# folds it into node/full but NEVER `pi` (the Pi contract: a `pi` build links no
# ureq/rustls/ring).
nl-query = [
    "query",
    "dep:ureq",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:base64",
]
# Lane B physical PARALLEL runtime (CONCEPT:EG-KG.query.parallel-runtime): the rayon-morsel,
# memory-accounted, spilling `ParallelDriver` behind the Lane-0 `Driver` seam. Pulls the
# pure-Rust `rayon` work-stealing pool (no C dep, same pin as eg-ann/eg-compute). IMPLIES
# `query` (the runtime schedules the `query`-gated physical fns). OFF by default — a
# default/Pi build links no rayon and `execute_ops` dispatches to the serial `SerialDriver`,
# byte-for-byte the prior fold. Tuned via `EPISTEMIC_GRAPH_EXEC_THREADS` (pool width / morsel
# fan-out) and `EPISTEMIC_GRAPH_EXEC_SPILL_MB` (per-intermediate spill budget). NEVER folded
# into `pi`.
par-runtime = ["query", "dep:rayon"]
# Arrow-columnar `KnowledgeBatch` (CONCEPT:EG-P1-2, Codex P1 feedback): a
# RecordBatch-backed columnar projection of `KnowledgeSet` — entity/artifact id,
# N named `Float32` score columns, calibrated confidence, typed evidence-ref
# columns (an `evidence_kind` tag + a real Arrow `List<Utf8>` of per-locus JSON,
# covering every `EvidenceAddress` granularity: text span, table cell, image pixel
# region, audio/video interval/frame, code symbol, trace span), bitemporal
# valid/tx-time columns, provenance (`source_refs`)/policy-label `List<Utf8>`
# columns (plus transformation/proof/alternative/contradiction id lists), lazy
# blob-handle columns (an opaque handle, never raw bytes), and native bounded streams
# for graph, SQL, RDF, vector, time-series, jobs, and cross-modal results. IMPLIES `query`
# (it builds FROM `KnowledgeSet`, itself `query`-gated). Pulls `arrow`, pinned to
# the SAME version (`53`) eg-lake's `lake` feature already carries, so this shares
# the lockfile footprint rather than adding a second Arrow version. OFF by
# default at this crate layer; facade `full` enables it. A default/Pi build links NO
# Arrow (verify with `cargo tree -p eg-plan`) — the small-footprint contract stays intact.
knowledge-batch = ["query", "dep:arrow"]

[dependencies]
# The plan AST (Op/Pred/Plan) is the wire DTO, defined in eg-types behind its
# `query` feature — but it is pure serde (NO DataFusion), so eg-plan ALWAYS enables
# it: the algebra + cost model + IR compile dep-free in a default/Pi build. Only the
# DataFusion FILTER leg (eg-query, below) is gated behind eg-plan's own `query`.
eg-types = { path = "../eg-types", features = ["query"] }
eg-core = { path = "../eg-core" }
# The `ModalityContract` trait + the `EvidenceLocus` shape (CONCEPT:E4/X1). Sits at
# the SAME DAG level as `eg-types` (its own deps = `eg-types` only, per its crate
# docs), so an UNCONDITIONAL dep here adds no new transitive weight and lets
# `KnowledgeRow::evidence_refs` be `Vec<eg_modality::EvidenceLocus>` regardless of
# feature — only the `epistemic` feature (below) populates it; a default/Pi build's
# `evidence_refs` stays the empty `Vec` it always was.
eg-modality = { path = "../eg-modality" }
# The relational FILTER leg is real DataFusion via eg-query's schema-on-read
# `nodes` provider — gated behind `query` so a default build links none of it.
eg-query = { path = "../eg-query", optional = true }
# The WASM UDF runtime backing the `Udf` op (feature `wasm-udf`, CONCEPT:KG-2.228).
# Optional + only referenced under #[cfg(feature = "wasm-udf")]; a default/Pi build
# links no wasmtime/cranelift.
eg-wasm = { path = "../eg-wasm", optional = true }
# The lexical BM25 index + RRF fusion (feature `text`, CONCEPT:KG-2.215). Optional +
# only referenced under #[cfg(feature = "text")], so a default/Pi build links no
# eg-text and therefore no Tantivy/zstd-sys (verified by `cargo tree`).
eg-text = { path = "../eg-text", optional = true }
# The native OWL 2 EL⁺ reasoner + SPARQL evaluator backing the `Reason`/`SparqlBgp`
# SOURCE ops (feature `owl`, CONCEPT:KG-2.220). Optional + only referenced under
# #[cfg(feature = "owl")]; pure-Rust (oxrdf/oxttl/spargebra), so it adds NO native dep
# (a default/Pi build links none of it).
eg-rdf = { path = "../eg-rdf", optional = true }
# The pure-Rust spatial modality (geometry + WKT + planar predicates + packed Hilbert
# R-tree) backing the `SpatialScan` op + spatial `Pred`s (feature `geo`, CONCEPT:EG-083).
# Optional + only referenced under #[cfg(feature = "geo")]; only-serde leaf crate (NO
# GEOS/PROJ/C dep), so a default/Pi build links none of it.
eg-geo = { path = "../eg-geo", optional = true }
# The pure-Rust array / tensor modality (dense N-D array + slice/reduce/elementwise/
# reshape + byte-blob codec) backing the `TensorScan` / `TensorOp` ops (feature
# `tensor`, CONCEPT:EG-085). Optional + only referenced under #[cfg(feature = "tensor")];
# only-serde leaf crate (NO BLAS/LAPACK/C dep), so a default/Pi build links none of it.
eg-tensor = { path = "../eg-tensor", optional = true }
# The conjugate Bayesian-update / marginal / fusion helpers (eg-compute's pure-Rust
# `reasoning` domain) backing the `Op::Probabilistic` op (feature `probabilistic`,
# CONCEPT:EG-086). Optional + only referenced under #[cfg(feature = "probabilistic")];
# eg-compute depends only on eg-core/eg-types (no heavy dep, no eg-plan back-edge → no
# cycle), so a default/Pi build links none of it.
eg-compute = { path = "../eg-compute", optional = true }
# The engine-native epistemic layer (claims/evidence/belief-state, confidence propagation,
# justification) backing the `Op::{EvidenceFor,Contradicts,SupportedBy,BeliefAsOf,
# SourceReliability,ConfidenceOp,ExplainBelief}` ops (feature `epistemic`, CONCEPT:EG-KG.epistemic.epistemic-substrate,
# E2). Optional + only referenced under #[cfg(feature = "epistemic")]; depends only on
# eg-types/eg-core/eg-compute (no eg-plan back-edge → no cycle), so a default/Pi build
# links none of it.
eg-epistemic = { path = "../eg-epistemic", optional = true }
# The pure-Rust event-stream + CEP modality (bounded NFA over sliding/tumbling windows —
# Sequence/Within/Absence + per-event attribute predicates) backing the `Cep` op (feature
# `stream`, CONCEPT:EG-088). Optional + only referenced under #[cfg(feature = "stream")];
# serde + serde_json only (NO tokio/async/C dep), so a default/Pi build links none of it.
eg-stream = { path = "../eg-stream", optional = true }
# The native time-series windowed-aggregate primitives (`time_bucket`/`aggregate`)
# backing `Op::Window`/`Op::SensorFuse` + the durable `SeriesStore` backing `Op::TsScan`
# (feature `timeseries`, CONCEPT:EG-067/EG-363). Optional + only referenced under
# #[cfg(feature = "timeseries")], which turns on eg-tsdb's `redb-store` feature so the
# `SeriesStore` read type is available. The query primitives are eg-core/eg-compute only
# (no DataFusion); `redb-store` adds pure-Rust redb (no C dep, no pyo3). A default/Pi build
# links none of it. eg-tsdb does NOT depend on eg-plan — no dependency cycle.
eg-tsdb = { path = "../eg-tsdb", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
# ── federation (CONCEPT:KG-2.232) — all optional + only referenced under
# #[cfg(feature = "federation")], so a default/Pi build links NONE of them. ──
# Pure-Rust HTTP client with the rustls TLS backend (NOT openssl). `ureq` 2.x bundles
# rustls + webpki-roots behind its default `tls` feature; we DON'T disable defaults so
# https works out of the box, but it is rustls/ring — no openssl in the tree.
ureq = { version = "2.10", optional = true }
# Per-endpoint TLS control for the `nl-query` planner (CONCEPT:EG-KG.query.nl-tls-insecure):
# a custom PEM CA bundle or an insecure no-verify verifier for a trusted internal LLM.
# Pinned to the SAME `ring` provider ureq already links (NO aws-lc / NO C toolchain — the
# Pi-tier pure-Rust contract). Rustls' PKI parser and `webpki-roots` are pure Rust.
# `base64` encodes the HTTP-Basic token-exchange credentials. All OFF by default (only
# referenced under #[cfg(feature = "nl-query")]).
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
], optional = true }
webpki-roots = { version = "0.26", optional = true }
base64 = { version = "0.22", optional = true }
# HMAC-SHA256 auth token for the remote-engine source — the SAME scheme src/server/auth.rs
# computes. Same pins as the facade.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
# ── external-SQL federation (CONCEPT:KG-2.239, feature `federation-sql`) — optional +
# only referenced under #[cfg(feature = "federation-sql")], so a default/Pi/`federation`
# build links NEITHER, and a `pi` tree carries no sqlx/postgres/mysql. ──
# `sqlx` with the rustls ring backend and native trust roots — NEVER OpenSSL. SQLx
# 0.9 separates runtime and TLS selection, so both features are explicit.
# `postgres` + `mysql` give two dialects through one async API; `macros`/`migrate` are
# off (no compile-time DB / no proc-macro). default-features = false drops the native-tls
# default so the only TLS in the tree is rustls.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
    "postgres",
    "mysql",
], optional = true }
# A small current-thread tokio runtime to drive sqlx's async API from the SYNC `fetch()`
# (which the executor already runs on the blocking pool). Minimal feature set — NOT
# "full".
tokio = { version = "1.38", features = ["rt", "net", "time"], optional = true }
# Stream rows through a hard cardinality bound instead of `fetch_all`-allocating an
# attacker-controlled result. `sink`/`io` are unnecessary for this read-only source.
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
# Parse the complete external statement before SQLx's explicit `AssertSqlSafe` seam.
# The parser is already present in full/query builds through DataFusion; naming it here
# makes the security contract direct rather than relying on a transitive dependency.
sqlparser = { version = "0.62", features = ["visitor"], optional = true }
# Variable-length-hop TRAVERSE BFS over GraphView's StableDiGraph (EdgeRef). Already
# linked transitively via eg-core; pin the same minor. NOT a new heavy dep, and the
# graph leg is dep-free (ships in a default/Pi build).
petgraph = { version = "0.6.4", features = ["serde-1"] }
# The work-stealing data-parallel pool backing the `par-runtime` `ParallelDriver` (Lane B,
# CONCEPT:EG-KG.query.parallel-runtime). Optional + only referenced under
# #[cfg(feature = "par-runtime")]; pure-Rust (no C dep), same pin as eg-ann/eg-compute. A
# default/Pi build links no rayon.
rayon = { version = "1.10", optional = true }
# Arrow columnar backing for `KnowledgeBatch` (feature `knowledge-batch`,
# CONCEPT:EG-P1-2). Same Arrow 58.3 pin as the query/TSDB surface, so this does
# not introduce a second Apache Arrow version into the workspace lock. Optional + only
# referenced under #[cfg(feature = "knowledge-batch")]; a default/Pi build links
# none of it.
arrow = { version = "58.3", optional = true }

[dev-dependencies]
# The oracle/algebra tests build a fixture GraphCore + SemanticStore and run the
# DataFusion FILTER leg, so the test target needs the `query` feature on.
eg-query = { path = "../eg-query", features = ["sql"] }
# The query-surface INTEGRATION test harness (`tests/*.rs`, CONCEPT:EG-400..405) is an
# EXTERNAL crate against eg-plan's public API, so it must name the fixture/currency
# crates directly (integration tests see only the crate-under-test + its dev-deps, NOT
# its regular deps). eg-core builds the GraphCore/SemanticStore fixtures; eg-types names
# the `TimeAxis` the `AsOf` builder needs; serde_json/rmp-serde encode node blobs.
eg-core = { path = "../eg-core" }
eg-types = { path = "../eg-types", features = ["query"] }
serde_json = "1.0"
rmp-serde = "1.3"
# Property-based generation of VALID UQL pipelines (CONCEPT:EG-402): random valid op
# sequences → determinism / snapshot-isolation / algebraic-law proofs.
proptest = "1"
# Plan-snapshot regression (CONCEPT:EG-403): the logical plan + the cost-reorder output
# are snapshotted so a lowering OR optimizer-quality regression trips the snapshot.
insta = "1"
# The owl compose-oracle test loads an OWL ontology + individuals via the eg-rdf
# mapping and reasons over it, so the test target names eg-rdf directly with its
# owl/sparql surfaces. (Only compiled with `--features owl`.)
eg-rdf = { path = "../eg-rdf", features = ["owl", "sparql"] }
# The `Udf` op test compiles a tiny `.wat` fixture to wasm in-test (only with
# `--features wasm-udf`). The sandbox itself never needs a text parser — only the test.
wat = "1"
# Criterion drives the hybrid-query latency + vector-recall benches (CONCEPT:EG-KG.query.hybrid-latency-benches + EG-KG.query.recall-oracle-bench).
# It is a `harness = false` bench target gated on `required-features = ["query"]`, so a
# default `cargo bench -p eg-plan` skips it (no execute leg) and the CI perf gate runs it
# with the full feature set. `default-features = false` drops criterion's optional
# `rayon`/HTML plotting deps the gate does not need.
criterion = { version = "0.5", default-features = false }

# ── Perf / recall CI benchmark (CONCEPT:EG-KG.query.hybrid-latency-benches/recall-oracle-bench/synthetic-bench-dataset) ──────────────────────────
# Representative hybrid pipelines (MATCH→TRAVERSE→RANK, REASON→RANK→TRAVERSE,
# TsScan→WINDOW, FUSE) measured for latency (criterion p50/mean) + the vector leg's
# recall@k vs a brute-force cosine oracle over a fixed deterministic synthetic dataset.
# `required-features = ["query"]` so a default `cargo bench -p eg-plan` cleanly SKIPS it
# (the `execute` leg is `query`-gated); the CI perf job builds it with the full feature
# set. The optional-feature benches (owl / text / timeseries) are `#[cfg]`-gated inside.
[[bench]]
name = "hybrid_queries"
path = "benches/hybrid_queries.rs"
harness = false
required-features = ["query"]
