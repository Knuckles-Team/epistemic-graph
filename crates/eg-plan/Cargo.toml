[package]
name = "eg-plan"
version = "0.33.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Unified cross-modal query planner (CONCEPT:KG-2.208/209) — a RowSet closed algebra sequencing the existing SQL (DataFusion), graph (petgraph BFS) and vector (SemanticStore) legs into ONE plan, with a cost-based filter-vs-vector reorder"
license = "MIT"

[lib]
name = "eg_plan"

[features]
# `query` pulls the DataFusion-backed FILTER leg (via eg-query/sql). A default
# build links NO DataFusion: the algebra, the cost model, the graph/vector legs
# and the plan IR all compile dep-free (the Pi contract). The DataFusion `Filter`
# leg — and the `UnifiedPlan::execute` that needs it — are gated behind this
# feature, exactly as the facade gates `query`.
default = []
query = ["dep:eg-query", "eg-query/sql"]
# Lexical BM25 `RankText` op + the RRF `FuseRrf` hybrid (CONCEPT:KG-2.215). Pulls
# eg-text's Tantivy index (the `tantivy` backend) and turns on the `text` wire
# variants in eg-types. It IMPLIES `query` because the new ops live inside the
# `query`-gated `Op` enum and the text executor branch sits beside the DataFusion
# FILTER leg. A default/Pi build sets neither feature → no eg-text/Tantivy linked.
text = ["query", "dep:eg-text", "eg-text/tantivy", "eg-types/text"]
# OWL/SPARQL SOURCE ops (CONCEPT:KG-2.220): `Reason` (OWL-inferred class members) +
# `SparqlBgp` (SPARQL-selected ids) as RowSet sources, so ONE UnifiedQuery plan can do
# OWL/SPARQL candidate-set → graph Traverse / vector Rank / SQL Filter / Limit. Pulls
# eg-rdf's pure-Rust `owl` (EL⁺ reasoner) + `sparql` evaluator. IMPLIES `query` (the
# ops live inside the `query`-gated `Op` enum, beside the DataFusion FILTER leg). A
# default/Pi build sets neither feature → no eg-rdf reasoner/evaluator linked here.
owl = ["query", "dep:eg-rdf", "eg-rdf/owl", "eg-rdf/sparql", "eg-types/owl-plan"]
# The WASM `Udf` TRANSFORM op (CONCEPT:KG-2.228): run a registered, sandboxed
# WebAssembly UDF over the current RowSet inside a UnifiedQuery plan. Pulls eg-wasm's
# wasmtime runtime + turns on the `wasm-udf` wire variant in eg-types. IMPLIES `query`
# (the op lives in the `query`-gated `Op` enum). A default/Pi build links no wasmtime.
wasm-udf = ["query", "dep:eg-wasm", "eg-wasm/wasm-udf", "eg-types/wasm-udf"]

[dependencies]
# The plan AST (Op/Pred/Plan) is the wire DTO, defined in eg-types behind its
# `query` feature — but it is pure serde (NO DataFusion), so eg-plan ALWAYS enables
# it: the algebra + cost model + IR compile dep-free in a default/Pi build. Only the
# DataFusion FILTER leg (eg-query, below) is gated behind eg-plan's own `query`.
eg-types = { path = "../eg-types", features = ["query"] }
eg-core = { path = "../eg-core" }
# The relational FILTER leg is real DataFusion via eg-query's schema-on-read
# `nodes` provider — gated behind `query` so a default build links none of it.
eg-query = { path = "../eg-query", optional = true }
# The WASM UDF runtime backing the `Udf` op (feature `wasm-udf`, CONCEPT:KG-2.228).
# Optional + only referenced under #[cfg(feature = "wasm-udf")]; a default/Pi build
# links no wasmtime/cranelift.
eg-wasm = { path = "../eg-wasm", optional = true }
# The lexical BM25 index + RRF fusion (feature `text`, CONCEPT:KG-2.215). Optional +
# only referenced under #[cfg(feature = "text")], so a default/Pi build links no
# eg-text and therefore no Tantivy/zstd-sys (verified by `cargo tree`).
eg-text = { path = "../eg-text", optional = true }
# The native OWL 2 EL⁺ reasoner + SPARQL evaluator backing the `Reason`/`SparqlBgp`
# SOURCE ops (feature `owl`, CONCEPT:KG-2.220). Optional + only referenced under
# #[cfg(feature = "owl")]; pure-Rust (oxrdf/oxttl/spargebra), so it adds NO native dep
# (a default/Pi build links none of it).
eg-rdf = { path = "../eg-rdf", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
# Variable-length-hop TRAVERSE BFS over GraphView's StableDiGraph (EdgeRef). Already
# linked transitively via eg-core; pin the same minor. NOT a new heavy dep, and the
# graph leg is dep-free (ships in a default/Pi build).
petgraph = { version = "0.6.4", features = ["serde-1"] }

[dev-dependencies]
# The oracle/algebra tests build a fixture GraphCore + SemanticStore and run the
# DataFusion FILTER leg, so the test target needs the `query` feature on.
eg-query = { path = "../eg-query", features = ["sql"] }
# The owl compose-oracle test loads an OWL ontology + individuals via the eg-rdf
# mapping and reasons over it, so the test target names eg-rdf directly with its
# owl/sparql surfaces. (Only compiled with `--features owl`.)
eg-rdf = { path = "../eg-rdf", features = ["owl", "sparql"] }
# The `Udf` op test compiles a tiny `.wat` fixture to wasm in-test (only with
# `--features wasm-udf`). The sandbox itself never needs a text parser — only the test.
wat = "1"
