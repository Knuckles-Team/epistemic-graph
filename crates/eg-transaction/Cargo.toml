[package]
name = "eg-transaction"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Sole mutation authority: admission, ordering, fencing, commit, replay identity, outbox, and consensus-transaction intent records"
license = "MIT"

[lib]
name = "eg_transaction"

[dependencies]
eg-storage = { path = "../eg-storage" }
eg-types = { path = "../eg-types" }
hex = "0.4"
redb = "4.1"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
