# medulla-graphql — native GraphQL READ surface over the property-graph (CONCEPT:KG-2.235).
#
# Sits in the DAG ABOVE medulla-core (parallel to medulla-rdf/medulla-query): it derives a GraphQL
# schema FROM the live graph (node `type` labels → GraphQL object types, typed edges →
# fields) and compiles a GraphQL query to scans + BFS over the SAME `GraphView` the
# Cypher/unified executor reads. So a GraphQL query is "more scans over the one
# substrate" — proven to return the SAME nodes/fields as the equivalent Cypher query.
#
# Pi discipline: the WHOLE surface is a hand-written parser + resolver — PURE RUST, NO
# async-graphql (evaluated: ~80+ transitive crates + a proc-macro schema-derive, too
# heavy for the Pi tier). The facade gates it behind `graphql`, folded into node/
# cluster/full but OUT of `pi`/`default`, so a Pi build links nothing here.
[package]
name = "medulla-graphql"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Native GraphQL read surface for the medulla-engine engine: schema-from-graph + a resolver that compiles a GraphQL query to GraphView scans/traversals (pure-Rust, no async-graphql)"
license = "MIT"

[lib]
name = "medulla_graphql"

[features]
# The whole crate is gated by the facade `graphql` feature; the READ/WRITE/subscription
# surface has no inner optionality (it always builds dep-free over medulla-core). A default
# build of the crate IS that surface — the facade simply doesn't depend on it unless
# `graphql` is on, which is what keeps it out of the Pi tree.
#
# MEDULLA-295: fold federation into graphql/node/full — the Apollo Federation v2 subgraph
# support (CONCEPT:MEDULLA-295) is behind the `federation` sub-feature, default-ON here so it
# rides into the facade's `graphql`/`node`/`full` tiers automatically (the facade pulls
# `medulla-graphql` with its default features; no tier-aggregate-list edit needed). Build a
# federation-free GraphQL surface with `--no-default-features`.
#
# MEDULLA-296: fold GraphQL enterprise hardening into graphql/node/full the SAME way — the
# depth/complexity/APQ/introspection controls (CONCEPT:MEDULLA-296) live behind the `hardening`
# sub-feature, default-ON so they ride into the facade's `graphql`/`node`/`full` tiers with
# NO tier-aggregate-list edit (the facade pulls `medulla-graphql` with default features; `pi`
# excludes `graphql` entirely, so `sha2` never enters the Pi tree). `hardening` pulls
# `sha2` for the APQ sha256 digest. Build a hardening-free surface with `--no-default-features`.
default = ["federation", "hardening", "crossmodal"]
federation = []
hardening = ["dep:sha2"]
# MEDULLA-379/380/381 — the GraphQL CROSS-MODAL transaction seam. Default-ON so it rides into
# the facade's `graphql`/`node`/`full` tiers via the facade's default-features pull
# (federation/hardening precedent). Pulls `medulla-plan/query` (uql parse + `execute` +
# `PlanCtx` — the SAME `UnifiedPlan::execute` `run_unified` wraps; `query` is where the
# unified executor lives) and `medulla-rdf/sparql` (the CONSTRUCT eval + `INSERT DATA`
# lowering). All of these are already in the facade's graphql tiers (node/cluster/full).
# Build a cross-modal-free surface with `--no-default-features`. The facade enables
# `crossmodal-tsdb` from its tsdb-bearing GraphQL tier and owns the sole authoritative
# `commitTransaction` path (see crossmodal.rs module docs).
crossmodal = ["dep:medulla-plan", "medulla-plan/query", "dep:medulla-rdf", "medulla-rdf/sparql"]
# MEDULLA-381 — the tsdb leg of the cross-modal seam: `addMeasurement` staging + the in-txn
# `medulla_plan::StagedSeries` read-your-own-writes overlay (CONCEPT:MEDULLA-374 parity). Pulls
# `medulla-plan/timeseries` (→ medulla-tsdb). Default-OFF (parity with the facade's `tsdb`-gated
# measurement staging); enabled by the facade's tsdb tier.
crossmodal-tsdb = ["crossmodal", "medulla-plan/timeseries"]

[dependencies]
medulla-types = { path = "../medulla-types" }
medulla-core = { path = "../medulla-core" }
# MEDULLA-379: the unified-query plan front-end + executor (uql parse, `Plan`/`Op`, `execute`,
# `PlanCtx`, `StagedSeries`) — the SAME machinery `run_unified` wraps. Optional + gated by
# `crossmodal` (which enables `medulla-plan/query`, where the unified executor lives);
# `crossmodal-tsdb` adds `medulla-plan/timeseries` for the in-txn `StagedSeries` overlay.
medulla-plan = { path = "../medulla-plan", optional = true }
# MEDULLA-379: SPARQL CONSTRUCT evaluation (`execute`) + `INSERT DATA` lowering
# (`insert_data_triples`) + the RDF term model (`oxrdf`, `mapping::literal_to_cell`).
# Optional + gated by `crossmodal` (pulls `medulla-rdf/sparql`).
medulla-rdf = { path = "../medulla-rdf", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
uuid = { version = "1.28", features = ["v4"] }
# Variable-hop / single-hop edge traversal over GraphView's StableDiGraph. Already
# linked transitively via medulla-core; pin the same minor. NOT a new heavy dep.
petgraph = { version = "0.8.3", features = ["serde-1"] }
# MEDULLA-296: sha256 digest for Automatic Persisted Queries (APQ). RustCrypto `sha2` is
# already a workspace dep elsewhere; optional + gated by `hardening`, so it links only
# into the GraphQL-bearing tiers (never Pi, which excludes `graphql`).
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
# The equivalence test runs the SAME query through the engine's real Cypher executor
# (medulla-query/cypher — dep-free, no DataFusion) and asserts GraphQL == Cypher.
medulla-query = { path = "../medulla-query", features = ["cypher"] }
