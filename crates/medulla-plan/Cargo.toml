[[test]]
name = "federation_rollup_backends"
path = "tests/federation_rollup_backends.rs"
required-features = ["federation"]

[[test]]
name = "fuzz_pipelines"
path = "tests/fuzz_pipelines.rs"
required-features = ["federation"]

[[test]]
name = "incremental_execute_oracle"
path = "tests/incremental_execute_oracle.rs"
required-features = ["query"]

[[test]]
name = "incremental_o_delta"
path = "tests/incremental_o_delta.rs"
required-features = ["query"]

[[test]]
name = "incremental_oracle"
path = "tests/incremental_oracle.rs"
required-features = ["query"]

# Names `learned_cost_artifacts`/`CostCorrectionArtifact`/`LearnedCostStore`,
# gated on `learned-cost` in `src/lib.rs` (which itself implies `query`).
[[test]]
name = "learned_cost_ab"
path = "tests/learned_cost_ab.rs"
required-features = ["learned-cost"]

[[test]]
name = "plan_proptest"
path = "tests/plan_proptest.rs"
required-features = ["query"]

[[test]]
name = "plan_snapshots"
path = "tests/plan_snapshots.rs"
required-features = ["query"]

# EH-450 — epistemic + FUSE + AS OF through UQL text (with `WITH KNOWLEDGE`), the
# structured plan, and the separate single-modality surfaces fused by the caller.
[[test]]
name = "knowledge_oracle"
path = "tests/knowledge_oracle.rs"
