[package]
name = "eg-geo"
version = "0.1.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Pure-Rust spatial / geospatial modality for the epistemic-graph engine (CONCEPT:EG-083) — geometry (point/line/polygon), WKT parse/serialize, planar spatial predicates, and an in-house packed Hilbert R-tree bbox index. NO GEOS/PROJ/C deps (the Pi contract)."
license = "MIT"

[lib]
name = "eg_geo"

# Pure-Rust, Pi-lean by design — a leaf crate like eg-ann. The core dependency is
# serde (so a `Geometry` persists as a typed value in the redb per-graph store, per
# CONCEPT:EG-083). NO GEOS/PROJ/C deps, NO geo/geo-types crate: the geometry model,
# WKT codec, planar predicates, the packed Hilbert R-tree AND the durable STR R-tree
# (CONCEPT:EG-263), the CRS registry + affine/Helmert transforms (CONCEPT:EG-262) and
# the WKB/GPX codecs (CONCEPT:EG-264) are all hand-written, so the crate stays truly
# minimal and folds cleanly into the `geo` serving tiers. serde_json (already linked
# workspace-wide) backs ONLY the GeoJSON reader/writer, behind the `geo-io` feature.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
# GeoJSON (CONCEPT:EG-264) reuses serde_json — a dep already compiled everywhere in the
# workspace, NOT a new heavy dep, and eg-geo is already OUT of `pi` so this never touches
# the Raspberry-Pi build. Optional so a serde_json-free consumer can still get geometry +
# WKT + WKB + GPX + CRS + R-trees.
serde_json = { version = "1.0", optional = true }

[features]
# `geo-io` (CONCEPT:EG-264) turns on the GeoJSON codec (serde_json). It is a DEFAULT
# feature so eg-geo's own tests + the node/full serving tiers (which pull eg-geo via
# `eg-plan/geo` WITHOUT default-features=false) get GeoJSON with no change to the tier
# aggregate lists. WKB + GPX need no serde_json and are always compiled. FOLD NOTE: do
# NOT add `eg-geo/geo-io` to any tier aggregate — it rides in on default features.
default = ["geo-io"]
geo-io = ["dep:serde_json"]

[dev-dependencies]
# The R-tree correctness tests cross-check query results against a brute-force scan over
# pseudo-random boxes; a tiny deterministic LCG in-test avoids even a rand dep. The STR
# R-tree durability test (CONCEPT:EG-263) round-trips through serde_json.
serde_json = { version = "1.0" }
