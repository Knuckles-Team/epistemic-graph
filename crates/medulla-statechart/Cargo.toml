[package]
name = "medulla-statechart"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Native finite-state-machine / statechart engine (CONCEPT:INT-P2-2): a formal M=(S, Σ, δ, s₀, F) with extended state (context), guards + actions, a pure deterministic transition function, definition-time completeness/reachability checks, and a durable redb-backed machine-instance store — the disciplined sibling of medulla-jobs' AnalyticsJob state primitive"
license = "MIT"

[lib]
name = "medulla_statechart"

# A leaf crate ALONG the DAG (mirrors medulla-jobs' placement): the in-memory typed
# definition model + the pure transition function need nothing above `medulla-types`
# (whose `msgpack::decode_bounded` we reuse for the SAME bounded-decode robustness
# medulla-jobs' store relies on). The durable store additionally routes every instance
# mutation through `medulla-transaction` — the exact universal MutationBatch /
# durable-commit gateway `medulla-jobs` uses — so instance transitions carry atomic
# status/version/fence/idempotency/outbox evidence and are Raft-orderable and
# crash-consistent across nodes. Durability is the store's reason to exist, so
# `redb` is UNCONDITIONAL here exactly as it is in `medulla-jobs` — there is no "durable
# machine-instance plane without a durable store" configuration worth shipping.
[dependencies]
medulla-types = { path = "../medulla-types" }
# RF-RULING-004: `medulla-storage` is the sole physical owner of `statecharts.redb`
# (declared `OwnerLayout::Statechart`) and `medulla-transaction` the sole writer.
# Unconditional for the same reason `redb` is: durability is this crate's reason
# to exist, so there is no configuration that ships without them.
medulla-storage = { path = "../medulla-storage" }
medulla-transaction = { path = "../medulla-transaction" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
redb = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Already a dev-dependency of medulla-jobs/medulla-plan (workspace-wide, not a NEW crates.io
# dependency) -- reused here for DE7's replay-determinism property test, the same
# way medulla-jobs' own sibling test does.
proptest = "1"
# The integration test must supply the composition root's scope-grant verifier,
# which is `medulla-storage`'s trait; it is already a normal dependency of this crate.
medulla-storage = { path = "../medulla-storage" }

[features]
default = []
