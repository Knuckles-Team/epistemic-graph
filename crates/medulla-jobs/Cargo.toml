[package]
name = "medulla-jobs"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Durable analytics-job plane (CONCEPT:INT-P2-1): async submit/status/progress/cancel/resume over a redb-backed AnalyticsJob state machine, committing results as provenance'd epistemic claims"
license = "MIT"

[lib]
name = "medulla_jobs"

# A leaf crate ALONG the DAG (CONCEPT:INT-P2-1): deps = medulla-types (wire-shaped value
# types) + medulla-core (the `GraphCore` write primitive the claim-commit step needs — the
# SAME `add_node`/`add_edge`/`has_node`/`version()` surface `medulla-epistemic` reads and
# `src/server/handlers/mining.rs`'s `materialize_claim` writes through). The facade's
# self-contained `full` contract includes the `jobs` feature; lean custom builds may
# still omit it explicitly.
#
# Durability is the crate's whole reason to exist, so `redb` is an UNCONDITIONAL
# dependency here (unlike medulla-tsdb/medulla-kvcache's optional `redb-store`/`durable`
# features, which exist to keep THEIR lean/no-store path buildable) — there is no
# "durable job plane without a durable store" configuration worth shipping.
[dependencies]
medulla-types = { path = "../medulla-types" }
medulla-core = { path = "../medulla-core" }
# RF-RULING-004: `medulla-storage` is the sole physical owner of `jobs.redb` (declared
# `OwnerLayout::Jobs`) and `medulla-transaction` the sole writer. Unconditional for the
# same reason `redb` is: durability is this crate's whole reason to exist, so no
# configuration ships without them.
medulla-storage = { path = "../medulla-storage" }
medulla-transaction = { path = "../medulla-transaction" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
redb = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
# Already a dev-dependency of medulla-plan (crates/medulla-plan/Cargo.toml) — reused here for
# DE7's replay-determinism property test, not a new crates.io dependency.
proptest = "1"
# `tests/replay_determinism.rs` opens its stores through `medulla_jobs::dev_scope_grant`,
# which is gated on `cfg(any(test, feature = "dev-scope-grant"))`. `cfg(test)` is set
# only while compiling this crate's OWN unit tests -- an integration test links the
# library WITHOUT it -- so the test compiled only when some other workspace member
# (`medulla-quantum-jobs`) happened to unify the feature on, i.e. under `--workspace` but
# never under the release step's `cargo test -p medulla-jobs --test replay_determinism`.
# A self dev-dependency turns the feature on for test/bench builds of this package
# only; normal builds (and every dependent's build) keep it off, so a production
# build still cannot link the development verifier.
medulla-jobs = { path = ".", features = ["dev-scope-grant"] }

[features]
# The development/test composition root for the store's scope grant
# (`dev_scope_grant`). OFF by default and folded into NO tier aggregate: this
# crate's own tests, its replay-determinism property test and `medulla-quantum-jobs`'
# fixtures need a `ScopeGrantVerifier` and have no real root, while a production
# build must not be able to link one.
dev-scope-grant = []
default = []
