[package]
name = "eg-storage"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Sole physical-state authority: durable opens, owner-table registry, scoped capabilities, snapshots, backup/restore/adoption, recovery validation"
license = "MIT"

[lib]
name = "eg_storage"

[dependencies]
eg-types = { path = "../eg-types" }
redb = "4.1"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.38", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
