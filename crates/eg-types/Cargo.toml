[package]
name = "eg-types"
version = "0.27.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Wire protocol + graph data model for the epistemic-graph engine (bottom of the crate DAG)"
license = "MIT"

[lib]
name = "eg_types"

[features]
# Mirror the facade's feature names so cross-crate passthrough is 1:1. `metrics`
# adds the strum static-str derive on `Method` (per-op gauge labels). `finance` /
# `datascience` gate the wire DTOs + the Method variants that embed them — a slim
# build that omits a compute domain also drops its wire types from the enum.
metrics = ["dep:strum"]
finance = []
datascience = []
# Unified cross-modal query plan AST (CONCEPT:KG-2.208) — the wire DTO embedded in
# `Method::UnifiedQuery`. Gated so a build without the query surface drops the AST
# (and the Method variant) from the enum, exactly like finance/datascience.
query = []
# Lexical BM25 full-text rank + RRF hybrid fusion (CONCEPT:KG-2.215). Gates the
# `Op::RankText` / `Op::FuseRrf` variants of the cross-modal plan AST. Implies
# `query` because those variants live inside the `query`-gated `Op` enum (the AST
# only exists when the query surface is compiled); a build with `text` therefore
# also carries the SQL/graph/vector ops. Pure serde — NO Tantivy here (the heavy
# index lives in eg-text behind its own gate); this only adds two enum variants.
text = ["query"]
# Streamed content-addressed BLOB substrate (CONCEPT:KG-2.206): gates the `// ──
# Blob ──` Method variants so a build without `blob` drops them from the enum (they
# then fall to the dispatch "not available in this build" catch-all).
blob = []
# Streaming / CDC / subscriptions (CONCEPT:KG-2.229/230): gates the `// ── Streaming
# ──` Method variants + the CDC/continuous-query/watch/trigger wire DTOs. PURE serde
# — no heavy dep — so it folds into pi/node/cluster/full; a build without it drops
# the variants (→ the dispatch "not available in this build" catch-all).
streaming = []
# Native RDF surface (CONCEPT:KG-2.217): gates the `AddTriples`/`GetTriples` Method
# variants so a build without `rdf` drops them from the enum.
rdf = []
# Native SPARQL surface (CONCEPT:KG-2.218): gates the `Sparql` Method variant +
# `SparqlResult` wire DTO. Implies `rdf`.
sparql = ["rdf"]
# Native OWL 2 reasoner surface (CONCEPT:KG-2.219): gates the `OwlReason` Method +
# `OwlReasonResult` wire DTO. PURE-RUST + Pi-safe — implies only `sparql` (→`rdf`),
# NOT `query`, so the OWL reasoner ships on the Pi tier with NO DataFusion.
owl = ["sparql"]
# The OWL/SPARQL cross-modal plan SOURCE ops `Op::Reason` / `Op::SparqlBgp`
# (CONCEPT:KG-2.220). They live INSIDE the `query`-gated `Op` enum (the unified plan
# AST), so they need `query`; and they select from the OWL/SPARQL surfaces, so `owl`.
# SPLIT from `owl` because the unified-plan executor needs DataFusion (`query`) which
# the Pi tier omits — the bare OWL reasoner (`owl`) stays Pi-safe.
owl-plan = ["owl", "query"]
# WASM-sandboxed UDF surface (CONCEPT:KG-2.228): gates the `RegisterUdf`/`RunUdf`
# Method variants AND the `Op::Udf { id }` variant of the cross-modal plan AST. The
# `Udf` op lives inside the `query`-gated `Op` enum, so this implies `query`. Pure
# serde — NO wasmtime here (the runtime lives in eg-wasm behind its own gate); this
# only adds enum variants to the wire protocol.
wasm-udf = ["query"]
# Distributed graph compute surface (CONCEPT:KG-2.227): gates the
# `DistributedCompute`/`*MatView` Method variants + the `DistAlgo` wire enum. Pure
# serde — the cross-shard Pregel coordinator lives in the facade behind `compute-dist`
# (which needs raft); this only adds the wire variants.
compute-dist = []
# Query federation / foreign sources (CONCEPT:KG-2.232, Lane P): gates the
# `ForeignSourceSpec`/`HttpFieldMap` wire DTOs + the `Op::ForeignScan` variant of the
# cross-modal plan AST + the `RegisterForeignSource` Method. The `ForeignScan` op lives
# inside the `query`-gated `Op` enum, so this implies `query`. PURE serde — the actual
# transport (the remote-engine client + the rustls HTTP client) lives in eg-plan behind
# its own gate; this only adds wire variants.
federation = ["query"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_bytes = "0.11.19"
rmp-serde = "1.3"
strum = { version = "0.27", features = ["derive"], optional = true }
