[package]
name = "eg-types"
version = "0.27.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Wire protocol + graph data model for the epistemic-graph engine (bottom of the crate DAG)"
license = "MIT"

[lib]
name = "eg_types"

[features]
# Mirror the facade's feature names so cross-crate passthrough is 1:1. `metrics`
# adds the strum static-str derive on `Method` (per-op gauge labels). `finance` /
# `datascience` gate the wire DTOs + the Method variants that embed them — a slim
# build that omits a compute domain also drops its wire types from the enum.
metrics = ["dep:strum"]
finance = []
datascience = []
# Data-mining domain (CONCEPT:EG-KG.mining.frequent-itemset-mining): gates the
# `Method::MineAssociate` variant + its `TransactionSource`/`MineAlgorithm` wire
# types. PURE serde — no heavy dep — so it folds into the serving tiers; a build
# without it drops the variant (→ the dispatch "not available in this build"
# catch-all), exactly like finance/datascience.
mining = []
# Graph-learning / neuro-symbolic domain (CONCEPT:EG-KG.graphlearn.link-predictor):
# gates the `Method::GraphLearnFit`/`GraphLearnPredict` variants + their
# `GraphSource`/`GraphLearnParams` wire types. PURE serde (the model blob rides an
# opaque `serde_json::Value`, so no KAN type leaks into the wire) — folds into the
# serving tiers exactly like mining; a build without it drops the variants.
graphlearn = []
# ML pipeline (CONCEPT:EG-KG.mining.ml-pipeline): gates the composable
# `Method::MiningPipeline*` variants + their `PipelineSpec`/`FeatureStep`/`ModelSpec`/
# `SplitSpec` wire DTOs. It embeds `GraphSource` (the node source), so it implies
# `graphlearn`; the fitted-model blob rides an opaque `serde_json::Value`, so no
# per-family type leaks into the wire. Folds into the serving tiers; a build without it
# drops every variant (→ the dispatch "not available in this build" catch-all).
ml-pipeline = ["graphlearn"]
# Engine-native epistemic layer (CONCEPT:EG-KG.epistemic.epistemic-substrate, E6):
# gates the additive epistemic fields and citation DTOs. Citations reuse the governed
# `EvidenceLocusWire` query DTO, so `epistemic` must imply `query`; keeping the
# dependency here makes every direct crate feature combination compile instead of
# relying on the facade's full feature union to mask a missing type.
epistemic = ["query"]
# Unified cross-modal query plan AST (CONCEPT:KG-2.208) — the wire DTO embedded in
# `Method::UnifiedQuery`. Gated so a build without the query surface drops the AST
# (and the Method variant) from the enum, exactly like finance/datascience.
query = []
# GraphQL read surface (CONCEPT:KG-2.235): gates the `Method::GraphQl` variant. The
# result is GraphQL JSON over the existing `ResultPayload::raw`, so NO wire DTO is
# added — only the Method variant. The resolver/parser live in the eg-graphql crate
# behind the facade `graphql` feature; a build without it drops the variant (→ the
# dispatch "not available in this build" catch-all).
graphql = []
# Message broker (CONCEPT:EG-275): gates the broker admin/data `Method` variants
# (`DeclareExchange`/`DeleteExchange`/`BindQueue`/`UnbindQueue`/`Publish`). PURE serde
# — no heavy dep — so it folds into the serving tiers; a build without it drops the
# variants (→ the dispatch "not available in this build" catch-all).
broker = []
# Lexical BM25 full-text rank + RRF hybrid fusion (CONCEPT:KG-2.215). Gates the
# `Op::RankText` / `Op::FuseRrf` variants of the cross-modal plan AST. Implies
# `query` because those variants live inside the `query`-gated `Op` enum (the AST
# only exists when the query surface is compiled); a build with `text` therefore
# also carries the SQL/graph/vector ops. Pure serde — NO Tantivy here (the heavy
# index lives in eg-text behind its own gate); this only adds two enum variants.
text = ["query"]
# Streamed content-addressed BLOB substrate (CONCEPT:KG-2.206): gates the `// ──
# Blob ──` Method variants so a build without `blob` drops them from the enum (they
# then fall to the dispatch "not available in this build" catch-all).
blob = []
# Generic namespaced Key→Value surface (CONCEPT:EG-022): gates the `// ── Key→Value
# ──` Method variants (`KvGet`/`KvPut`/`KvDelete`/`KvScan`/`KvCas`). PURE serde — no
# heavy dep — so it folds into node/full; a build without it drops the variants (→
# the dispatch "not available in this build" catch-all).
kv = []
# SQLite `.db` FILE import/export (CONCEPT:EG-331/EG-332): gates the two `// ── SQLite
# .db file ──` Method variants (`ImportSqliteFile`/`ExportSqliteFile`). PURE serde — no
# dep here (the pure-Rust `eg-sqlite-format` reader/writer lives in the facade behind its
# own `sqlite-file` gate); this only adds the two wire variants. A build without it drops them.
sqlite-file = []
# Streaming / CDC / subscriptions (CONCEPT:KG-2.229/230): gates the `// ── Streaming
# ──` Method variants + the CDC/continuous-query/watch/trigger wire DTOs. PURE serde
# — no heavy dep — so it folds into pi/node/cluster/full; a build without it drops
# the variants (→ the dispatch "not available in this build" catch-all).
streaming = []
# Per-tenant memory budget + autoscale signals (CONCEPT:KG-2.234, Lane V): gates the
# `ResourceStats` Method variant. PURE serde — no heavy dep — so it folds into
# pi/node/cluster/full; a build without it drops the variant (→ the dispatch "not
# available in this build" catch-all).
cost = []
# Native RDF surface (CONCEPT:KG-2.217): gates the `AddTriples`/`GetRdf` Method
# variants so a build without `rdf` drops them from the enum.
rdf = []
# Native SPARQL surface (CONCEPT:KG-2.218): gates the `Sparql` Method variant +
# `SparqlResult` wire DTO. Implies `rdf`.
sparql = ["rdf"]
# Native OWL 2 reasoner surface (CONCEPT:KG-2.219): gates the `OwlReason` Method +
# `OwlReasonResult` wire DTO. PURE-RUST + Pi-safe — implies only `sparql` (→`rdf`),
# NOT `query`, so the OWL reasoner ships on the Pi tier with NO DataFusion.
owl = ["sparql"]
# The OWL/SPARQL cross-modal plan SOURCE ops `Op::Reason` / `Op::SparqlBgp`
# (CONCEPT:KG-2.220). They live INSIDE the `query`-gated `Op` enum (the unified plan
# AST), so they need `query`; and they select from the OWL/SPARQL surfaces, so `owl`.
# SPLIT from `owl` because the unified-plan executor needs DataFusion (`query`) which
# the Pi tier omits — the bare OWL reasoner (`owl`) stays Pi-safe.
owl-plan = ["owl", "query"]
# OBDA / R2RML virtual graphs (CONCEPT:EG-KG.query.r2rml-virtual-graph): gates the
# `SparqlVirtual` Method variant. The OBDA engine (`eg_rdf::obda`) lives behind
# `sparql`; the foreign-source seam this Method wires it to is the engine's OWN SQL
# user-table store (`eg_query::TableStore`, behind `query`) — so this implies BOTH,
# same split rationale as `owl-plan` (the bare `sparql`/`owl` surfaces stay Pi-safe;
# OBDA over user tables needs DataFusion via `query`).
obda = ["sparql", "query"]
# WASM-sandboxed UDF surface (CONCEPT:KG-2.228): gates the `RegisterUdf`/`RunUdf`
# Method variants AND the `Op::Udf { id }` variant of the cross-modal plan AST. The
# `Udf` op lives inside the `query`-gated `Op` enum, so this implies `query`. Pure
# serde — NO wasmtime here (the runtime lives in eg-wasm behind its own gate); this
# only adds enum variants to the wire protocol.
wasm-udf = ["query"]
# Distributed graph compute surface (CONCEPT:KG-2.227): gates the
# `DistributedCompute`/`*MatView` Method variants + the `DistAlgo` wire enum. Pure
# serde — the cross-shard Pregel coordinator lives in the facade behind `compute-dist`
# (which needs raft); this only adds the wire variants.
compute-dist = []
# Plan-backed materialized views (CONCEPT:EG-KG.storage.plan-backed-matview): gates the
# `PlanMatView*` Method variants (Define/Get/Refresh/Drop) whose `plan` field is the
# `query`-gated `wire::Plan` AST, so `matview` IMPLIES `query`. Pure serde — the manager
# + durable rows + CDC invalidation live in the facade behind the `matview` feature.
matview = ["query"]
# Engine-level security (CONCEPT:KG-2.231): gates the `AuditVerify` Method variant +
# the `AuditReport` wire DTO. Pure serde — no dep.
security = []
# Query federation / foreign sources (CONCEPT:KG-2.232, Lane P): gates the
# `ForeignSourceSpec`/`HttpFieldMap` wire DTOs + the `Op::ForeignScan` variant of the
# cross-modal plan AST + the `RegisterForeignSource` Method. The `ForeignScan` op lives
# inside the `query`-gated `Op` enum, so this implies `query`. PURE serde — the actual
# transport (the remote-engine client + the rustls HTTP client) lives in eg-plan behind
# its own gate; this only adds wire variants.
federation = ["query"]
# Spatial / geospatial modality (CONCEPT:EG-083): gates the `Op::SpatialScan` SOURCE op
# + the `Pred::SpatialWithin`/`SpatialDWithin` predicates of the cross-modal plan AST.
# They live inside the `query`-gated `Op`/`Pred` enums, so this implies `query`. PURE
# serde — the geometry model + planar predicates + the packed Hilbert R-tree live in the
# eg-geo crate, and the executor in eg-plan, both behind their own `geo` gates; this only
# adds three enum variants (Pi-safe wire data, no dep).
geo = ["query"]
# Array / tensor modality (CONCEPT:EG-085): gates the `Op::TensorScan` SOURCE op + the
# `Op::TensorOp { kind }` TRANSFORM op (Slice/Reduce/Elementwise) of the cross-modal
# plan AST, plus the pure-serde `TensorOpKind`/`TensorReduceKind`/`TensorElementwiseOp`
# DTOs they embed. They live inside the `query`-gated `Op` enum, so this implies
# `query`. PURE serde — the dense N-D array model + the slice/reduce/elementwise/reshape
# ops + the byte-blob codec live in the eg-tensor crate, and the executor in eg-plan,
# both behind their own `tensor` gates; this only adds enum variants (Pi-safe wire data,
# no dep).
tensor = ["query"]
# Event-stream + complex-event-processing (CEP) modality (CONCEPT:EG-088): gates the
# `Op::Cep { pattern }` TRANSFORM op of the cross-modal plan AST plus the pure-serde
# `CepPatternSpec`/`CepNodeSpec`/`CepMatcherSpec`/`CepAttrPredSpec`/`CepWindowSpec` DTOs
# it embeds. The op lives inside the `query`-gated `Op` enum, so this implies `query`.
# PURE serde — the bounded NFA CEP engine (Sequence/Within/Absence over sliding/tumbling
# windows) lives in the eg-stream crate, and the executor in eg-plan, both behind their
# own `stream` gates; this only adds enum variants (Pi-safe wire data, no dep).
stream = ["query"]
# Multimodal sensor fusion (CONCEPT:EG-098): gates the `Op::SensorFuse { streams,
# tolerance_ns }` TRANSFORM/SOURCE op of the cross-modal plan AST. The op lives inside the
# `query`-gated `Op` enum, so this implies `query`. PURE serde — the time-alignment
# (successive eg-tsdb ASOF backward-joins over heterogeneous sensor streams) lives in
# eg-tsdb, and the executor in eg-plan, both behind eg-plan's own `timeseries` gate; this
# only adds one enum variant (Pi-safe wire data, no dep). Mirrors `tensor`/`stream`.
timeseries = ["query"]
# Probabilistic / uncertainty query op (CONCEPT:EG-086): gates the `Op::Probabilistic
# { query }` TRANSFORM op of the cross-modal plan AST plus the pure-serde `ProbQuery` /
# `ProbEvidenceSpec` DTOs it embeds. The op lives inside the `query`-gated `Op` enum, so
# this implies `query`. PURE serde — the `Distribution` VALUE (always compiled) + the
# conjugate `bayesian_update` compute live in eg-types/eg-compute, and the executor in
# eg-plan, all behind eg-plan's own `probabilistic` gate; this only adds enum variants
# (Pi-safe wire data, no dep). Mirrors `tensor`/`stream`.
# FOLD: opt-in; deliberately NOT added to any facade tier aggregate (node/full/pi).
probabilistic = ["query"]
# CONCEPT:INT-P2-1 — the durable analytics-job plane: gates the `jobs` wire module
# (`JobOp`/`SubmitJobSpec`/`JobKind`) + the `Method::AnalyticsJob` variant. PURE
# serde — no dep (mirrors `acl`, which is unconditional; this is feature-gated only
# because the Method variant itself is opt-in, unlike `RbacAdmin`). The actual
# durable state machine + redb store + claim-commit live in `eg-jobs` (ABOVE this
# crate in the DAG); the facade wires it through `jobs`, included in the main
# `full` deployment while remaining absent from small leaf builds unless selected.
jobs = []
# CONCEPT:INT-P2-2 — the native statechart engine: gates the `statechart` wire module
# (`StatechartOp`) + the `Method::Statechart` variant. Pure serde/enum-variant gate,
# same shape as `jobs`; the durable engine (typed model + redb store + pure transition
# function) lives in `eg-statechart` (ABOVE this crate in the DAG) and the facade wires
# it through `statechart`, included in the main `full` build.
statechart = []
# Graph-native program optimization extends the jobs wire contract with its one
# typed job kind. A jobs-only build does not expose a non-executable variant.
program-optimization = ["jobs"]
# Pure-serde request/cursor/response DTOs for the shared governed KnowledgeBatch
# pull protocol. The Arrow runtime remains in eg-plan/facade.
knowledge-batch = []
# Governed document/image/audio/video serving. This adds only pure-serde wire
# operations; concrete runtimes and persistence remain above `eg-types`.
modality-serving = []
# CONCEPT:EG-KG.compute.quantum-agent-api (Q8, quantum-native.md / quantum-external-
# providers.md §1.5): gates the `Method::Quantum { op: QuantumOp }` variant + its
# `QuantumOp`/`QuantumRankCandidate`/`QuantumQaoaEdge` wire DTOs -- the ONE wire op
# that makes the quantum surface (`eg-quantum-core`/`eg-quantum-gates`/
# `eg-quantum-sim`, all Rust-internal until this feature) callable through the
# engine's own wire protocol. PURE serde: `QuantumOp::Expectation.program` rides an
# opaque `serde_json::Value` (the same shape `eg_quantum_core::ir::QuantumProgram`
# round-trips as JSON), so this crate does NOT depend on `eg-quantum-core` -- no new
# crate in the dependency tree, exactly like every other Method-gating feature here.
# A build without it drops the variant (-> the dispatch "not available in this
# build" catch-all). Mirrors `jobs`/`statechart`: NEVER forced on unconditionally by
# `eg-capabilities` (see that crate's own Cargo.toml doc) -- it carries its own
# mirrored `quantum` feature turned on in lockstep by the root package's
# `quantum-agent-api` facade feature.
quantum = []
# CONCEPT:EG-KG.compute.native-asr-whisper-provider (GOC-33, `OWNER-VOICE-ASR`): gates the
# `Method::Asr` variant + its `AsrOp` wire enum (`asr_wire.rs`). PURE serde -- no
# heavy dep here (whisper-rs/whisper.cpp live in the separate `eg-asr-whisper`
# crate, linked only by the facade's own `asr-whisper` feature); a build without
# this feature drops the variant (-> the dispatch "not available in this build"
# catch-all), exactly like `quantum`.
asr-native = []
# D-VZ-1 (lanes V4/V6): the native-visualization engine's wire op (`VizOp`) +
# `Method::Viz`, gated `viz`. Pure serde/enum-variant gate, same shape as
# `jobs`/`statechart`; the real ColumnStore/LOD/render engine (`eg-viz-core`/
# `eg-viz-columnstore`/`eg-viz-export`, a SEPARATE leaf DAG above this crate) is
# wired by the facade through its own `viz`/`viz-columnstore`/`viz-static-export`
# features, deliberately EXCLUDED from `full` (see root `Cargo.toml`) since it is
# not yet an operator-facing default.
viz = []

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_bytes = "0.11.19"
rmp-serde = "1.3"
strum = { version = "0.27", features = ["derive"], optional = true }
