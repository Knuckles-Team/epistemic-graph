[package]
name = "eg-query"
version = "0.31.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "SQL/Cypher query surface (CONCEPT:KG-2.178) over the epistemic-graph engine — DataFusion behind the `sql` feature"
license = "MIT"

[lib]
name = "eg_query"

[features]
# `sql` pulls DataFusion + Arrow (heavy). A default build links NONE of them so
# the engine stays lean for a Raspberry Pi.
default = []
# `eg-types/query` surfaces the `Pred`/`JsonPathOp` wire enums the SQL classifier lowers
# the Postgres/Mongo JSON operators onto (CONCEPT:EG-084) — additive, always on with `sql`.
sql = ["dep:datafusion", "dep:arrow", "dep:arrow-schema", "dep:tokio", "dep:petgraph", "dep:tracing", "dep:async-trait", "dep:redb", "dep:eg-text", "dep:eg-ann", "dep:futures-util", "dep:md-5", "dep:sha1", "dep:sha2", "dep:hex", "dep:base64", "dep:ipnet", "eg-types/query"]
# Dep-free Cypher subset (CONCEPT:KG-2.179): a hand-written parser compiled to the
# engine's own primitives (label index, VF2, BFS). Pulls only `petgraph` for the
# variable-length-path BFS — already in the tree via eg-core, NOT a new heavy dep —
# and NO DataFusion/Arrow, so it ships in the lean Pi build.
cypher = ["dep:petgraph"]
# CONCEPT:EG-KG.query.gds-procedure-routing — the two `CALL gds.*` procedures that
# route to a heavier-than-graph_algos eg-compute domain instead of always-on
# kernels, kept OUT of the base `cypher` feature so a lean Pi/`cypher`-only build
# doesn't pay for them unless asked (same posture as `finance`/`numeric` below).
# `cypher-mining` backs `gds.dbscan` (`eg-compute::mining::cluster::dbscan` — no
# heavy dep, `eg-types/mining` only). `cypher-graphlearn` backs
# `gds.linkPrediction` (`eg-compute::graphlearn::link_predict` — implies
# `datascience`, pulling `rand_chacha`; still no BLAS/GPU dep).
cypher-mining = ["cypher", "eg-compute/mining"]
cypher-graphlearn = ["cypher", "eg-compute/graphlearn"]
# Finance aggregate UDFs (`var`, `cvar`) — forward to eg-compute's finance kernels.
# Gated (and implies `sql`) so a no-finance build skips them AND keeps nalgebra out
# of the default tree (CONCEPT:KG-2.184).
finance = ["sql", "eg-compute/finance"]
# CONCEPT:EG-329 — Analytics-Program Surface-B numeric SQL operators. Registers the
# eg-numeric-backed DataFusion UDFs/UDAFs (`cosine_sim`, `l2_normalize`, `zscore`,
# `covariance`) so analytics run in-engine over resident columns (compute-near-data,
# no fetch-to-Python). Implies `sql` (the only place UDFs compile) and pulls the pure
# nalgebra/ndarray kernel rlib — NO pyo3 (eg-numeric's `python` feature stays off), so the
# Pi-contract holds (numeric is out of `pi`; `cargo tree --features pi` links neither
# eg-numeric nor nalgebra).
numeric = ["sql", "dep:eg-numeric", "dep:ndarray"]

[dependencies]
eg-types = { path = "../eg-types" }
eg-core = { path = "../eg-core" }
eg-compute = { path = "../eg-compute" }
# CONCEPT:EG-311 — the real (dep-free) BM25 scorer/snippeter behind the `bm25_score`/
# `bm25_snippet` UDFs. OPTIONAL, only under `sql` (the sole place the UDFs compile);
# eg-text's DEFAULT build is Tantivy-free, so this adds nothing heavy to the tree and
# stays out of a Pi/`cypher`-only eg-query build.
eg-text = { path = "../eg-text", optional = true }
# CONCEPT:EG-313 — the real HNSW/IVF-PQ + exact-rerank ANN indices behind the
# pgvector `ORDER BY col <-> $1 LIMIT k` pushdown. OPTIONAL, only under `sql` (the
# sole place the exec pushdown compiles). eg-ann's DEFAULT build links no heavy/GPU
# deps (pure-Rust, Pi-lean), so this stays out of a `cypher`-only eg-query build.
eg-ann = { path = "../eg-ann", optional = true }
# CONCEPT:EG-329 — the pure BLAS/LAPACK-free numeric kernel (nalgebra + ndarray) behind the
# Surface-B SQL UDFs. OPTIONAL, only under `numeric`; the engine links it WITHOUT pyo3
# (eg-numeric's `python` feature stays off), preserving the Pi-contract (out of `pi`).
eg-numeric = { path = "../eg-numeric", optional = true }
# CONCEPT:EG-329 — marshal Arrow columns into `ndarray` views the kernel consumes.
# Only under `numeric`; already in the tree via eg-numeric, so no new heavy dep.
ndarray = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"

# Heavy SQL deps — optional, gated behind `sql`. DataFusion re-exports its SQL
# parser (datafusion::sql), so NO standalone sqlparser-rs dep.
# CONCEPT:EG-104 — `nested_expressions` turns on DataFusion's native array/`List`
# function package (`datafusion-functions-nested`): `make_array`/`array[...]` literals,
# `unnest`, `array_length`, `array_has`/`array_has_all`/`array_has_any`, `array_append`,
# the `||` array concat, and `= ANY`/`ALL (array)`. Without it a `default-features =
# false` DataFusion links NONE of these (the crate is off), so ORMs/BI array SQL fails to
# plan. Additive: only affects builds that already compile DataFusion (the `sql` feature).
datafusion = { version = "54", default-features = false, optional = true, features = [
    "nested_expressions",
    "sql",
] }
arrow = { version = "58.3", optional = true }
arrow-schema = { version = "58.3", optional = true }
# Durable embedded KV for the user-defined table store (CONCEPT:EG-018). Same pin as
# the engine's server-side durable tier so a `query`/`full` build links one redb.
redb = { version = "4.1", optional = true }
# Shared by `sql` (EdgeRef/IntoEdgeReferences edge-table topology iteration over
# GraphView's StableDiGraph) and `cypher` (variable-length-path BFS). Already
# linked transitively via eg-core; pin the same minor. `serde-1` is the superset
# both features tolerate — not in a default build (CONCEPT:KG-2.184).
petgraph = { version = "0.6.4", features = ["serde-1"], optional = true }
# Current-thread runtime to drive DataFusion's async `collect()` inside the
# blocking pool (the `compute_off_lock` idiom). Only the `rt` feature is needed —
# the caller already runs us under `spawn_blocking`.
tokio = { version = "1.38", features = ["rt"], optional = true }
# Debug-log the never-error result-cell decoder fallback (CONCEPT:KG-2.196). Gated
# with `sql` — the only place it is used — so a default Pi build links no tracing.
tracing = { version = "0.1", optional = true }
# `#[async_trait]` for the custom `nodes` TableProvider (CONCEPT:KG-2.199 predicate
# pushdown). DataFusion's `TableProvider` trait is itself `#[async_trait]`; pulled
# only under `sql`, so it stays out of the lean Pi build.
async-trait = { version = "0.1", optional = true }
# CONCEPT:EG-KG.query.streaming-spillable-collect (EG-P1-4) — `StreamExt::next()` to drive
# DataFusion's `SendableRecordBatchStream` batch-at-a-time instead of `DataFrame::collect()`'s
# eager whole-result buffering. Already resolved transitively (DataFusion itself depends on
# it) at the SAME version, so this adds NO new crate to the tree — only a direct `use` path
# for the trait. `default-features = false` + `std` only: no need for `futures-util`'s
# executor/io/sink/alloc extras just to call `.next()` on an already-Send stream.
futures-util = { version = "0.3", optional = true, default-features = false, features = [
    "std",
] }

# CONCEPT:EG-KG.query.sqlite-compat-scalar-udfs (turso-assimilation rank 14) — the
# `md5`/`sha1`/`sha256`/`base64_encode`/`base64_decode`/`ip*` scalar UDFs. All four
# are already resolved transitively (sha2 via other crates, md-5/sha1/base64/ipnet
# via DataFusion/Arrow's own tree), so this adds no new dependency FAMILY to the
# tree — only a direct `use` path, gated behind `sql` (the only place these UDFs
# register) so a lean Pi/`cypher`-only build stays untouched.
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
ipnet = { version = "2.12", optional = true }

[dev-dependencies]
# The spike's OUTER reactor mimics the server's multi-thread runtime; the inner
# DataFusion driver uses only the current-thread runtime from the `sql` dep.
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros"] }
