[package]
name = "eg-method-codec"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "The eg2. canonical method-body codec (eg-types' own request decoder + canonical encoder) as a dependency-free WebAssembly module for the Go and JavaScript clients."
license = "MIT"

# `cdylib` is the WebAssembly module the Go and JavaScript clients embed
# (`scripts/build_method_codec_wasm.py` builds it for wasm32-unknown-unknown and
# copies it into `clients/go` and `clients/js`); `rlib` lets `cargo test` exercise
# the same exports natively. Nothing in the engine links this crate.
[lib]
name = "eg_method_codec"
crate-type = ["cdylib", "rlib"]

# `wire-complete` decodes every Method variant, exactly like the Python wheel's
# codec (`eg-numeric` feature `python`). eg-types' dependencies are pure Rust
# (serde, rmp-serde, sha2, hex, libm soft-float), so the crate builds for
# wasm32-unknown-unknown with no imports.
[dependencies]
eg-types = { path = "../eg-types", features = ["wire-complete"] }

[dev-dependencies]
rmp-serde = "1.3"
serde_json = "1.0"
