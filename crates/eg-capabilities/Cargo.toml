[package]
name = "eg-capabilities"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Machine-checked MethodPolicy capability ledger for the epistemic-graph wire protocol (CONCEPT:EG-P0-1)"
license = "MIT"

[lib]
name = "eg_capabilities"

# A leaf crate BELOW eg-core/eg-plan in the DAG (deps = eg-types ONLY, mirroring the
# eg-modality precedent) so it can be built + tested in isolation without pulling in
# the server, redb, raft, or any compute domain. It is NOT added as a normal
# As of CONCEPT:EG-P0-2 the root `epistemic-graph` package DOES depend on this crate
# (optional, behind its `server` feature) so the mutation gateway can consume
# `policy()`; see the root Cargo.toml. Default (non-`server`) builds still link none
# of it.
#
# Every eg-types optional feature that gates a `Method` VARIANT is enabled
# unconditionally below. That is deliberate, not an oversight: `policy()` is an
# EXHAUSTIVE match over `Method` with NO wildcard arm (the whole point of this crate
# -- see `lib.rs`), so it must see every variant that can ever exist, regardless of
# which serving tier a given build of the main engine happens to compile. All of
# these features are PURE serde / enum-variant gates on eg-types' side (no heavy
# transitive dependency), so turning them all on here does not pull in
# redb/tokio/raft/rayon/etc.
#
# EG-P0-2: `timeseries` and `probabilistic` are DELIBERATELY OMITTED. They gate ONLY
# wire `Op`/DTO items on eg-types' side -- ZERO `Method` variants (the `Ts*` Method
# variants are ungated; there is no probabilistic `Method`), so `policy()`'s Method
# match neither needs nor references them. Crucially, they are the ONLY two eg-types
# features that the main engine's `full` build does NOT already enable, so force-
# enabling them here (now that `epistemic-graph` links this crate) would, via Cargo
# feature unification, turn on `eg-types/{timeseries,probabilistic}` across the WHOLE
# engine build and expose latent non-exhaustive `Op` matches (e.g. eg-plan's
# `exec.rs` `Op::Probabilistic`) that a shipped `full` build never compiles. Omitting
# them keeps this crate's Method coverage 1:1 (still 337 variants) while leaving the
# engine's feature set byte-for-byte what it was pre-EG-P0-2.
#
# CONCEPT:INT-P2-1: `jobs` (the `Method::AnalyticsJob` durable-job-plane variant) is
# ALSO deliberately omitted from the forced-on list above, for the SAME reason as
# `timeseries`/`probabilistic` -- but this time it DOES gate a real `Method` variant,
# so simply omitting it would leave `policy()` non-exhaustive whenever a build
# elsewhere in the graph turns `eg-types/jobs` on. Instead this crate carries its OWN
# mirrored `jobs` feature (below) that both turns on `eg-types/jobs` AND cfg-gates
# `policy()`'s one `Method::AnalyticsJob` arm together, so the two can never drift
# out of sync -- the root `epistemic-graph` package's `jobs` facade feature enables
# BOTH `eg-types/jobs` and `eg-capabilities/jobs` in lockstep (see root Cargo.toml).
[dependencies.eg-types]
path = "../eg-types"
features = [
    "metrics", "finance", "datascience", "mining", "graphlearn", "ml-pipeline",
    "epistemic",
    "query", "graphql", "broker", "text", "blob", "kv", "sqlite-file",
    "streaming", "cost", "rdf", "sparql", "owl", "owl-plan", "obda",
    "wasm-udf", "compute-dist", "matview", "security", "federation",
    "geo", "tensor", "stream",
]

# Only ever pulled in by the `contract-schema` feature: the generator needs JSON
# Schema derivation, a JSON serializer, and a digest. A default build of this crate
# (the one the root `epistemic-graph` package links behind `server`) links none of them.
[dependencies.schemars]
version = "1.2.2"
optional = true

[dependencies.serde_json]
version = "1.0.151"
optional = true

[dependencies.sha2]
version = "0.10.9"
optional = true

[dependencies.hex]
version = "0.4.3"
optional = true

# The format-identity pass parses Rust items instead of scanning lines, so a site is
# identified by file + enclosing item path and a value by its tokens -- never by a
# line number that `cargo fmt` or a blank line would move.
[dependencies.syn]
version = "2.0.119"
optional = true
default-features = false
features = ["full", "parsing", "printing", "visit"]

[dependencies.quote]
version = "1.0.47"
optional = true
default-features = false

[dependencies.proc-macro2]
version = "1.0.107"
optional = true
default-features = false

# The generator can never run under a partial feature profile: the registry it
# serializes must be the complete supported wire inventory.
[[bin]]
name = "gen_contract"
required-features = ["contract", "canonical-ledger", "contract-schema"]

[features]
default = []
# RF-RULING-003 — the exact profile `gen_contract` regenerates and `--check` verifies.
contract = ["canonical-ledger", "contract-schema"]
# JSON Schema derivation for the wire request/result bodies. Default OFF on both this
# crate and `eg-types`, exactly like the ~90 other pure-serde Method-gating features.
contract-schema = [
    "dep:schemars",
    "dep:serde_json",
    "dep:sha2",
    "dep:hex",
    "dep:syn",
    "dep:quote",
    "dep:proc-macro2",
    "eg-types/contract-schema",
]
# The checked-in ledger is the complete supported wire inventory, not a
# projection of whichever optional surfaces happened to be enabled for one build.
# Use this named profile for regeneration and its exact drift test; ordinary
# feature-selected builds retain their smaller runtime policy registry.
canonical-ledger = [
    "jobs",
    "statechart",
    "knowledge-batch",
    "modality-serving",
    "quantum",
    "asr-native",
    "viz",
    # `timeseries`, `probabilistic` and `program-optimization` gate wire `Op`/DTO
    # items on eg-types' side and NO `Method` variant, so `policy()`'s exhaustive
    # Method match neither needs nor references them -- which is why they are (and
    # stay) absent from the unconditional `[dependencies.eg-types] features` list
    # above: forcing them on THERE would, through feature unification, turn on
    # `eg-types/{timeseries,probabilistic}` across the whole engine build, because
    # the root package links this crate behind `server`.
    #
    # They belong HERE, though, and their absence was a real gate defect
    # (eg-f3 burndown, 2026-09-11). `method.request.json` is a JSON Schema of the
    # request BODIES, and those bodies embed `Op`/DTO types -- so these three
    # features change the schema even though they change no Method. The committed
    # artifact was generated under `--features contract` (without them) while
    # `committed_contract_artifacts_match_the_registry` runs under
    # `cargo test --workspace --all-features` (with them, via unification), so the
    # gate compared two DIFFERENT wire universes and reported the committed
    # contract STALE by 10,352 bytes with nothing actually stale. Measured: the
    # canonical profile plus exactly these three reproduces the all-features
    # generation byte-for-byte (855,270 bytes).
    #
    # `canonical-ledger` is the right home because nothing in the engine's build
    # graph enables it -- only `contract` (the generator) and an explicit
    # `--all-features` do -- so this restores "the complete supported wire
    # inventory, not a projection of whichever optional surfaces happened to be
    # enabled for one build" without changing one byte of the shipped build's
    # feature set.
    "eg-types/timeseries",
    "eg-types/probabilistic",
    "eg-types/program-optimization",
]
# CONCEPT:INT-P2-1 -- see the module doc above. Mirrors `eg-types/jobs` 1:1: NEVER
# enable one without the other (this feature enables `eg-types/jobs` itself, so a
# caller only ever needs to request THIS one).
jobs = ["eg-types/jobs"]
# CONCEPT:INT-P2-2 -- see the module doc above. Mirrors `eg-types/statechart` 1:1 (same
# lockstep contract as `jobs`): this feature enables `eg-types/statechart` AND cfg-gates
# `policy()`'s one `Method::Statechart` arm together, so the two can never drift.
statechart = ["eg-types/statechart"]
# Mirrors the facade/eg-types native governed KnowledgeBatch wire contract.
knowledge-batch = ["eg-types/knowledge-batch"]
# Mirrors the facade/eg-types governed modality feature so the exhaustive policy
# match sees `Method::ServedModality` exactly when that wire surface exists.
modality-serving = ["eg-types/modality-serving"]
# CONCEPT:EG-KG.compute.quantum-agent-api (Q8) -- see the module doc above for why
# `jobs`/`statechart`-shaped Method-gating features are never forced on
# unconditionally by this crate. Mirrors `eg-types/quantum` 1:1 (same lockstep
# contract as `jobs`): this feature enables `eg-types/quantum` AND cfg-gates
# `policy()`'s one `Method::Quantum` arm together, so the two can never drift. The
# root `epistemic-graph` package's `quantum-agent-api` facade feature enables BOTH
# `eg-types/quantum` and `eg-capabilities/quantum` in lockstep.
quantum = ["eg-types/quantum"]
# GOC-33 (`OWNER-VOICE-ASR`) -- see the module doc above. Mirrors `eg-types/asr-native`
# 1:1 (same lockstep contract as `jobs`/`quantum`): this feature enables
# `eg-types/asr-native` AND cfg-gates `policy()`'s one `Method::Asr` arm together, so
# the two can never drift. The root `epistemic-graph` package's `asr-whisper` facade
# feature enables both `eg-types/asr-native` and `eg-capabilities/asr-native` in
# lockstep.
asr-native = ["eg-types/asr-native"]
# D-VZ-1 (lanes V4/V6) -- see the module doc above. Mirrors `eg-types/viz` 1:1 (same
# lockstep contract as `jobs`/`statechart`): `viz` is deliberately EXCLUDED from
# `full` (unlike most eg-types features this crate force-enables above), so this
# crate carries its OWN mirrored `viz` feature that both turns on `eg-types/viz` AND
# cfg-gates `policy()`'s one `Method::Viz` arm together, so the two can never drift
# out of sync. The root `epistemic-graph` package's `viz` facade feature enables
# `eg-capabilities?/viz` (weak-dep syntax: only takes effect if `eg-capabilities` is
# ALSO linked via `server` from elsewhere) in lockstep -- see root Cargo.toml.
viz = ["eg-types/viz"]
