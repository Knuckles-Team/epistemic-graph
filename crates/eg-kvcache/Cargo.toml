[package]
name = "eg-kvcache"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Tiered (hot/warm/cold) KV-cache store (CONCEPT:EG-185) + a content-addressed shared multi-instance KV-cache backend (CONCEPT:EG-186) for the epistemic-graph engine — the vLLM/LMCache shared-KV / OOM-offload substrate. Pure-Rust, Pi-lean; the durable cold tier is behind the optional `durable` feature (redb)."
license = "MIT"

[lib]
name = "eg_kvcache"

# Pure-Rust, Pi-lean by design — a leaf crate like eg-ann / eg-tensor. The RAM-only
# build (hot + compressed-warm + in-memory-cold) links NO dependency at all: the
# content hash (FNV-1a-128), the RLE compressor and the tiered LRU are all
# hand-written. Two optional features each pull ONE dependency: the DURABLE cold tier
# (`durable` → redb) and a REAL warm-tier codec (CONCEPT:EG-315, `compression` → zstd;
# optional `lz4` → lz4_flex). All OFF by default — mirroring how eg-ann/eg-tsdb gate
# their redb tier — so a `pi`/default build of this crate carries no redb and no zstd,
# and the durable tier reuses the engine's existing KG-2.195 redb durability tier.
[dependencies]
redb = { version = "4.1", optional = true }
# CONCEPT:EG-315 — the real WARM-tier codec. `zstd` gives production-grade compression
# ratios on KV pages (far above the built-in RLE) at the cost of one dependency, so it
# is OFF by default (`compression` feature) to keep the base/pi build dependency-free.
zstd = { version = "0.13", optional = true }
# CONCEPT:EG-315 — an OPTIONAL faster/lighter pure-Rust codec alternative to zstd.
lz4_flex = { version = "0.13", optional = true }
# ModalityContract retrofit (CONCEPT:E4). Optional (the base Pi-lean build must stay
# dependency-free) — only `contract` pulls serde in, so `StoredBlock`/`Codec` carry no
# derive at all outside that feature. See `src/compress.rs` / `src/contract.rs`.
serde = { version = "1.0", features = ["derive"], optional = true }
eg-modality = { path = "../eg-modality", optional = true }
# Graph-guided paging (CONCEPT:EG-KG.memory.graph-guided-paging): the ONLY dependency the
# optional `graph` feature pulls, for the `graph_importance` adapter that computes
# PageRank/centrality over an `eg-compute::GraphView`. OFF by default — the base/pi build
# and the core `TieredCache::set_importance` mechanism it feeds stay dependency-free.
eg-compute = { path = "../eg-compute", optional = true }

[features]
default = []
# Durable COLD tier (CONCEPT:EG-185): a crash-safe, single-writer redb-backed blob
# store the cache demotes cold bytes into, so the KV cache SURVIVES an OOM / process
# restart. OFF by default (the RAM-only build needs no redb).
durable = ["dep:redb"]
# Real WARM-tier compression codec (CONCEPT:EG-315): enables `Codec::Zstd`, selectable
# via `TieredCache::with_warm_codec`. Pulls `zstd`. OFF by default so the base/pi build
# stays dependency-free (the hand-rolled RLE remains the default codec either way).
compression = ["dep:zstd"]
# OPTIONAL alternative WARM codec (CONCEPT:EG-315): enables `Codec::Lz4` (pure-Rust
# `lz4_flex`) — faster/lighter than zstd. OFF by default.
lz4 = ["dep:lz4_flex"]
# ModalityContract retrofit (CONCEPT:E4): `impl ModalityContract for StoredBlock` +
# the `modality_conformance_tests!` battery. OFF by default, deliberately NOT folded
# into any tier aggregate (pi/durable/compression/lz4) — a base/pi build must stay
# dependency-free (no serde). `cargo test -p eg-kvcache --features contract` runs the
# suite; only this feature pulls serde in.
contract = ["dep:eg-modality", "dep:serde"]
# Graph-guided KV/context paging (CONCEPT:EG-KG.memory.graph-guided-paging): the
# `graph_importance` adapter module, computing PageRank/centrality importance over an
# `eg-compute::GraphView` for `TieredCache::apply_importance_scores`. OFF by default so
# the base/pi build stays dependency-free (`TieredCache::set_importance` itself needs no
# feature — it takes a caller-supplied `f64` either way). Pulls `eg-compute`.
graph = ["dep:eg-compute"]

[dev-dependencies]
# Only the `durable` redb cold-tier test touches the filesystem.
tempfile = "3.10"
