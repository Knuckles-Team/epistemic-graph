# eg-rdf — native RDF/SPARQL surface over the property-graph (CONCEPT:KG-2.217/218).
#
# Lane W increment 1 (W1 RDF + W2 SPARQL), productionizing the green spike. Sits in
# the DAG ABOVE eg-core (parallel to eg-query): it maps an RDF dataset onto a live
# `GraphCore` and compiles spargebra's SPARQL algebra to scans over a `GraphView`.
#
# Pi-gating discipline: every semantic-web dep is behind a feature, OFF by default,
# so a default/pi build links NONE of oxrdf/oxttl/spargebra (all pure-Rust — proven
# by `cargo tree`). The `rdf-redb` opt-in lossless quad table rides the engine redb.
[package]
name = "eg-rdf"
version = "0.1.0"
edition = "2021"
authors = ["Audel Rouhi <knucklessg1@gmail.com>"]
description = "Native RDF/SPARQL surface for the epistemic-graph engine: RDF<->property-graph mapping (oxrdf/oxttl) + SPARQL 1.1 compiled to GraphView scans (spargebra)"
license = "MIT"

[lib]
name = "eg_rdf"

[features]
default = []
# W1 — RDF term model + Turtle/N-Triples parse+serialize (oxrdf + oxttl). Pure Rust.
rdf = ["dep:oxrdf", "dep:oxttl"]
# W2 — SPARQL 1.1 algebra (spargebra). Parser + algebra ONLY; we provide the
# evaluator (compile, not embed). Pure Rust (peg is a build-time PEG generator).
sparql = ["rdf", "dep:spargebra", "dep:regex"]
# Opt-in lossless redb `quads` table for multi-valued-literal predicates that the
# key-unique property-graph blob would collapse. Rides the engine's redb tier.
rdf-redb = ["rdf", "dep:redb"]
# W3 — native OWL 2 (EL⁺ completion + RL property rules) reasoner (CONCEPT:KG-2.219).
# Parses OWL axioms from the SAME oxttl-parsed RDF as `rdf`, so it adds NO dep beyond
# the RDF stack: implies `rdf`, links ZERO native/C crate (pure Rust — no horned-owl,
# no whelk-rs). Safe to fold into pi/node/full alongside rdf/sparql.
owl = ["rdf"]
# W5 — OWL-DL tableau reasoner (CONCEPT:EG-059): a description-logic tableau
# (ALCQO + role hierarchy) that DECIDES the constructs the EL⁺/RL `owl` path cannot —
# full cardinality (≥n/≤n, qualified), complementOf/negation (NNF), oneOf/hasValue
# nominals, and reasoning-by-cases over a unionOf SUPERCLASS. Implies `owl` (it reuses
# owl.rs's triple index + node-id convention). Pure Rust — adds NO dep beyond the RDF
# stack. Pi contract: deliberately OUT of `pi` (a Pi node runs the tractable EL⁺/RL
# fast path only); folded into node/full via the facade.
owl-dl = ["owl"]
# W6c — SPARQL 1.1 hash builtins (CONCEPT:EG-127): MD5/SHA1/SHA256/SHA384/SHA512 via
# pure-Rust RustCrypto (`md-5`/`sha1`/`sha2`). Implies `sparql`. Pi contract: OUT of
# `pi` — a minimal Pi node ships the dep-free builtins (constructors/date-time/numeric/
# string, all under `sparql`); the crypto crates fold into node/full via the facade.
# Gated separately so `cargo tree --features pi` links NONE of md-5/sha1 (all pure Rust).
sparql-hash = ["sparql", "dep:md-5", "dep:sha1", "dep:sha2"]
# W6c — RDF-star / SPARQL-star, RDF 1.2 (CONCEPT:EG-130): quoted-triple terms
# `<< s p o >>` in the value model + star parse/eval. Flips on the oxrdf-family
# `rdf-12` / spargebra `sparql-12` feature (pure Rust — NO new crate). Widens the
# `oxrdf::Term` enum with `Triple(Box<Triple>)`; the mapping/eval match arms cfg-in
# first-class handling only when this is on. OUT of `pi` (a Pi node stays RDF-1.1).
# Weak `oxrdfxml?`/`oxjsonld?` propagation keeps rdf-12 CONSISTENT across the oxrdf
# family when RDF/XML or JSON-LD is ALSO enabled (feature unification would otherwise
# give oxrdfxml a rdf-12 `oxrdf::Term` its own match can't cover) — without pulling
# those crates in when they are off.
sparql-star = [
    "sparql",
    "oxrdf/rdf-12",
    "oxttl/rdf-12",
    "spargebra/sparql-12",
    "oxrdfxml?/rdf-12",
    "oxjsonld?/rdf-12",
]
# W6c — RDF/XML reader+writer (CONCEPT:EG-131) via pure-Rust `oxrdfxml`. Implies `rdf`.
# OUT of `pi` (RDF/XML is a heavier serialization; N-Quads/TriG ride the in-`rdf` oxttl).
rdf-xml = ["rdf", "dep:oxrdfxml"]
# W6c — JSON-LD 1.1 reader+writer (CONCEPT:EG-131) via pure-Rust `oxjsonld`. Implies
# `rdf`. OUT of `pi`. Expansion/compaction only; framing is a documented follow-up.
json-ld = ["rdf", "dep:oxjsonld"]

[dependencies]
eg-core = { path = "../eg-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"

# RDF term model + parsers/serializers (feature `rdf`). Pure Rust, no native deps.
oxrdf = { version = "0.3", optional = true }
oxttl = { version = "0.2", optional = true }
# SPARQL 1.1 parser + algebra (feature `sparql`). Pure Rust; oxigraph's front-end
# factored out (no store, no async, no DataFusion).
spargebra = { version = "0.4", optional = true }
# SPARQL 1.1 REGEX built-in (feature `sparql`, CONCEPT:EG-053). Pure Rust, no native deps.
regex = { version = "1", optional = true }
# Durable lossless quad table (feature `rdf-redb`). Same pin as the engine.
redb = { version = "4.1", optional = true }
# SPARQL 1.1 hash builtins (feature `sparql-hash`, CONCEPT:EG-127). Pure-Rust RustCrypto,
# no native deps. Kept OUT of `pi` via the dedicated feature (see [features]).
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
# RDF/XML + JSON-LD 1.1 serializations (features `rdf-xml` / `json-ld`, CONCEPT:EG-131).
# Pure-Rust oxrdf-family crates pinned to the same oxrdf 0.3.3; OUT of `pi`.
oxrdfxml = { version = "0.2", optional = true }
oxjsonld = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
