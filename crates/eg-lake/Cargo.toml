[package]
name = "eg-lake"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "LTAP lakehouse-interop tier for the epistemic-graph engine (CONCEPT:EG-317). Transcodes engine table/columnar data into Parquet-on-object-store with Delta Lake + Iceberg transaction logs, an Iceberg-REST catalog and LSN-style as-of snapshots, so external lakehouse engines (Spark/Trino/DuckDB) read our tables with zero ETL. The Parquet/Avro codec deps sit behind this crate's own `lake` feature; the crate is a leaf (no workspace edges). As of W4.8 the facade folds it into the one main `full` build (Polars native-Parquet + pure-Rust apache-avro, both default-features off — not the heavier upstream arrow/parquet crates), sized within the Pi-4 release-binary budget."
license = "MIT"

[lib]
name = "eg_lake"

# CONCEPT:EG-317 — eg-lake is a pure LEAF crate (like eg-geo / eg-ann): it depends on
# NOTHING inside the workspace. The engine-side wiring (converting a real
# `eg-tsdb::ColumnarSegment` / a user-table row batch into a `LakeBatch`, and hooking
# the async materialization tier onto the WAL) is a documented SEAM, kept out of this
# leaf so the heavy arrow/parquet stack never leaks into the core / Pi build.
#
# The table-log surface (Delta `_delta_log`, Iceberg `metadata.json`, the LSN as-of
# snapshot and the Iceberg-REST catalog) is PURE serde_json — it carries NO arrow /
# parquet dep and so compiles with the `lake` feature OFF. Only the actual Parquet
# transcode (`parquet_io`) needs arrow + parquet, and that is the ONLY thing the
# `lake` feature gates. So a `--no-default-features` build gives you the interop
# metadata (catalog/log/snapshot) with a tiny footprint; `--features lake` adds the
# columnar materialization.
[features]
default = []
# Real Parquet materialization + read-back via the maintained Polars codec, PLUS the
# real Iceberg Avro manifest / manifest-list writer via `apache-avro`
# (CONCEPT:EG-333/EG-334). Heavy (columnar + Parquet codec), but isolated behind
# the lake feature.
# `apache-avro` is pure-Rust (default-features off → no snappy/zstd/bzip/xz C codecs),
# so it stays in the Pi-contract spirit. OUT of pi (eg-lake is not a pi member) — the
# same `lake` gate the Parquet transcode already lives behind.
#
# GOC-76-W01 / CA-18: the official `iceberg` + `iceberg-storage-opendal` crates
# (0.10.x, apache/iceberg-rust) are added under this SAME `lake` gate rather than a
# new sub-feature — GOC-76's design note allows a new sub-feature "if isolation from
# the legacy path proves necessary"; it is not: `iceberg`/`iceberg-storage-opendal`
# resolve to the identical workspace `arrow = "58.3"` line already pulled by
# `eg-query`/`eg-tsdb`'s `datafusion = "54"` (`cargo tree -d` below shows a single
# resolved `arrow`), so there is no ABI-isolation reason to gate them separately.
# The legacy hand-written `iceberg.rs`/`iceberg_avro.rs` metadata/manifest writers
# (GOC-76-W03/W07 scope) are UNCHANGED by this — this crate only becomes buildable
# against the official crate family; nothing yet calls it (GOC-76-W02..W07, off this
# lane's scope per the CA-18 lane contract).
lake = ["dep:polars-core", "dep:polars-io", "dep:apache-avro", "dep:iceberg", "dep:iceberg-storage-opendal"]
# ModalityContract retrofit (CONCEPT:E4): `impl ModalityContract for LakeBatch` +
# the `modality_conformance_tests!` battery. OFF by default, deliberately NOT folded
# into any tier aggregate (default/lake) — it is a capability-discovery/testing seam,
# not a serving feature. `cargo test -p eg-lake --features contract` runs the suite.
contract = ["dep:eg-modality"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# ModalityContract retrofit (CONCEPT:E4). Optional, only under `contract` (default
# OFF) — a default/lake build links none of it and `LakeBatch` carries no new
# required trait. See `src/contract.rs`.
eg-modality = { path = "../eg-modality", optional = true }

# Maintained native Parquet codec. Apache `parquet` is intentionally absent because
# its format layer retains the unmaintained `thrift` and `paste` crates. Polars uses
# a safe hand-written format codec and remains interoperable with Spark/Trino/DuckDB.
# The implementation always selects uncompressed pages.
polars-core = { version = "0.54.4", optional = true, default-features = false, features = ["dtype-datetime"] }
polars-io = { version = "0.54.4", optional = true, default-features = false, features = ["parquet", "dtype-datetime"] }
# Pure-Rust Avro codec for the spec-compliant Iceberg v2 manifest + manifest-list
# files (CONCEPT:EG-333/EG-334). `default-features = false` drops the optional
# snappy / zstandard / bzip / xz codecs (all C `*-sys`) — we write the Avro container
# with the always-available NULL codec, which every Iceberg reader (Spark/Trino/DuckDB)
# opens. Only referenced under `#[cfg(feature = "lake")]`; OUT of pi.
apache-avro = { version = "0.21", default-features = false, optional = true }

# GOC-76-W01 (Ref, CA-18): the official Apache `iceberg-rust` crate family, added
# under `lake` alongside the existing hand-written metadata/manifest writer. This
# lane's deliverable is the dependency landing with a single resolved `arrow`
# version workspace-wide (proven by `cargo tree -d`, attached in the lane log) — it
# does NOT wire a caller (GOC-76-W02..W07 own the Transaction-API rewrite,
# partitioning, schema evolution, and legacy-writer retirement decision).
# `default-features = false` on `iceberg-storage-opendal` drops its default
# `opendal-memory`/`opendal-fs` object-store backends we don't need in-tree yet
# (the S3-compatible SeaweedFS backend `iceberg` reaches today goes through
# Lakekeeper/Trino, not this crate); `opendal-s3` is kept explicit since W02+ will
# need it once a real writer lands.
iceberg = { version = "0.10", optional = true }
iceberg-storage-opendal = { version = "0.10", optional = true, default-features = false, features = ["opendal-s3"] }

[dev-dependencies]
tempfile = "3"
