[package]
name = "medulla-quantum-workloads"
version = "0.1.0"
edition = "2021"
authors = ["Repository Maintainers <maintainers@example.invalid>"]
description = "Q7 (epistemic hooks) + Q11 (domain workloads), plans/au-medulla-program/program/quantum-native.md and its quantum-external-providers.md addendum: QAOA Max-Cut over a subgraph pulled from medulla-engine via UQL, run on medulla-quantum-sim, and written back as a TYPED PROPOSAL — never a hard constraint — through the SAME :Claim/:Evidence/SUPPORTS convention medulla-jobs (crates/medulla-jobs/src/claim.rs) already established, so medulla-epistemic's TMS/confidence/Ebbinghaus machinery governs belief instead of a raw confidence value written onto an edge."
license = "MIT"

[lib]
name = "medulla_quantum_workloads"

# A leaf crate ALONG the DAG, mirroring medulla-jobs' own dependency shape (CONCEPT:INT-P2-1):
# medulla-types (wire Method shapes) + medulla-core (GraphCore, the SAME write primitive
# medulla-jobs's `commit_result_claim` uses) + medulla-plan with `query` (UQL parse + execute,
# to pull the candidate node set) + the three Q0/Q1 quantum crates already on `main`
# (medulla-quantum-core's IR/trait/exactness-typed result, medulla-quantum-gates' matrix
# catalog, medulla-quantum-sim's StateVectorSimulator) + medulla-numeric's `complex` feature
# (the SAME Complex64 surface medulla-quantum-sim itself uses, needed here only to read
# `evolve()`'s returned amplitudes for the classical expectation-value evaluation
# inside the QAOA parameter search — no new numeric stack).
#
# This crate is a WORKSPACE MEMBER ONLY (see the one-line addition to the root
# Cargo.toml's `[workspace] members`) — it is NOT wired into the root `medulla-engine`
# package's `[dependencies]`/features. That is the deliberate "zero core change" Q7
# staging step the addendum's §1.2 charter names ("a tool pulls a subgraph, runs the
# algorithm, writes results back as proposals. Works today.") — `src/server/` is
# untouched, so the sibling `w6-quantum-q5q6-jobplane` lane's `Op::SubmitQuantum`/
# `Op::JoinQuantumResults` durable job-plane work has a clean surface to later host
# this tool's `run_qaoa_maxcut`/`plan_maxcut_proposal` logic behind, without this
# lane having raced ahead into that job plane itself.
[dependencies]
medulla-types = { path = "../medulla-types" }
medulla-core = { path = "../medulla-core" }
medulla-plan = { path = "../medulla-plan", features = ["query"] }
medulla-quantum-core = { path = "../medulla-quantum-core" }
medulla-quantum-gates = { path = "../medulla-quantum-gates" }
medulla-quantum-sim = { path = "../medulla-quantum-sim" }
medulla-numeric = { path = "../medulla-numeric", features = ["complex"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "2.0"

[dev-dependencies]
# Only for tests/end_to_end.rs's step 6 -- proving the committed :Claim is
# queryable/reasonable alongside classical graph data via the SAME BeliefGraph/
# propagate_confidence surface every other claim in this engine uses. Not a runtime
# dependency of this crate's write path itself (see propose.rs's own doc: this crate
# writes the SAME convention medulla-epistemic reads, exactly as medulla-jobs::claim does,
# without depending on medulla-epistemic at build time either -- it is a dev-only proof).
medulla-epistemic = { path = "../medulla-epistemic" }

[features]
default = []
