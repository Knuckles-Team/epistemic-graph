- {id: EG-KG.query.overlay-leg-rls-filter, namespace: EG-4, session: 'close-advanced-specs', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'RLS on the STAGED-OVERLAY leg of an in-txn fused read (closes EG-391). run_unified_overlaid (src/server/handlers/query.rs) already filter_view-d the COMMITTED base snapshot before overlaying the txns staged write-set, so a staged owned+private node (_owner/_visibility blob) leaked through an in-txn Reason->Rank. Fix: a second rls.filter_view(caller,&mut view) AFTER overlay_write_set so BOTH the committed and staged legs honor per-agent row visibility. No-op when no RLS rules registered (has_rules()==false short-circuits) so single-tenant RYOW is byte-for-byte unchanged. Proven by tests/advanced_crossmodal_roundtrip.rs rls_per_agent_fused_reason_rank_overlay_eg391 (RLS fixture: identities + owner/visibility node blobs + caller-threaded agent_id via req_as).'}
- {id: EG-KG.query.tri-surface-snapshot-harness, namespace: EG-4, session: 'close-advanced-specs', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'Tri-surface consistent-snapshot harness (closes EG-393). A pgwire listener (+ real tokio-postgres client), a /sparql HTTP listener, and the native dispatch path bound to ONE in-process ServerState. After a single mixed cross-modal BEGIN..COMMIT (graph node + embedding + a second node + a subClassOf graph edge + an OWL axiom) all three surfaces observe the SAME committed snapshot, and before commit none of the three sees any of it. tests/advanced_crossmodal_roundtrip.rs pgwire_sparql_native_consistent_snapshot_eg393, gated pgwire+sparql-http.'}
- {id: EG-KG.storage.encryption-reopen-roundtrip, namespace: EG-4, session: 'close-advanced-specs', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'Encryption-at-rest keyed open/reopen cross-modal roundtrip (closes EG-394). EPISTEMIC_GRAPH_ENCRYPTION_KEY=K1 opens a keyed RedbBackend, commit_crossmodal (node+edge+vector embedding) seals value blobs with ChaCha20-Poly1305; reopen K1 -> fused read_graph_dump (nodes+edges+semantic) DECRYPTS; reopen WRONG key K2 -> read_node ERRORS (unseal wrong-key) not silent plaintext. Raw .redb bytes never contain the plaintext secret. Serialized env toggle via a tokio Mutex so the process-global key never races. tests/advanced_crossmodal_roundtrip.rs encryption_at_rest_wrong_key_fails_eg394, gated security+redb.'}
- {id: EG-KG.query.cdc-live-view-rebuild, namespace: EG-4, session: 'close-advanced-specs', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'Streaming/CDC -> live materialized cross-modal view rebuild (closes EG-395). A CdcHub continuous query (streaming-native live view available in full) subscribed to state.cdc is maintained INCREMENTALLY off the CDC change stream a cross-modal write (graph nodes + vector embedding + graph edge) emits, and a subsequent native cross-modal read reflects the same new state. The MatViewStore variant needs the cluster-tier compute-dist/raft layer (NOT in full), so the continuous-query IS the live materialized view under full. tests/advanced_crossmodal_roundtrip.rs streaming_cdc_matview_rebuild_eg395, gated streaming.'}
- {id: EG-KG.query.crossshard-2pc-open-reason, namespace: EG-4, session: 'close-advanced-specs', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: done, design_doc: 'RESOLVED by EG-KG.txn.crossshard-2pc-modality-harness — EG-396 is now GREEN under --features cluster via the in-crate raft::xshard_modality_harness (a live in-process TWO-group cluster + mid-2PC coordinator-kill proof spanning the property-graph + RDF modalities). The advanced-roundtrip spec is now cfg(feature="cluster")-gated (compiles out of --features full, runs under --features cluster) rather than #[ignore]d. Real-hardware remainder documented on the new concept.'}
- {id: EG-KG.txn.crossshard-2pc-modality-harness, namespace: EG-4, session: 'cluster-fuzz-tests', reserved_at: '2026-07-04T13:00:00.000000+00:00', expires_at: '2027-07-04T13:00:00.000000+00:00', status: done, design_doc: 'GREEN (closes EG-396, supersedes the open reason EG-KG.query.crossshard-2pc-open-reason). In-crate module src/raft/xshard_modality_harness.rs (cfg feature=compute-dist, which cluster implies) stands up a live in-process node running TWO openraft groups on one redb-authoritative store and runs a cross-shard transaction spanning property-graph (group A, Method::AddNode) and RDF/triple (group B, Method::AddTriples projected via mutation_apply::apply -> eg_rdf::mapping::load_triples). Four scenarios prove a single all-or-nothing decision: happy commit, participant loss during prepare, coordinator loss after commit, and coordinator loss before any decision. The phase-granular prepare/decide entry points plus recover_in_doubt drive the crash cases. Exposed as prove_crossshard_modality_2pc_single_decision and exercised by tests/advanced_crossmodal_roundtrip.rs under the cluster feature.'}
- {id: EG-KG.query.warmfork-fanout-open-reason, namespace: EG-4, session: 'close-advanced-specs', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'Refined OPEN reason for EG-397 (KV-cache warm-fork fan-out). CROSS-REPO gap: the warm-FORK sandbox primitive (ForkableSandbox/WarmParentRegistry/forkserver, ORCH-1.86..93) lives in agent-utilities, not this engine. Reachable engine-side seams are the KV page store (eg-kvcache EG-364) + the cross-modal read surface, but NEITHER is a fork primitive (no in-engine os.fork/forkserver/CoW child sharing a warm parents read context while isolating divergent writes). The fan-out test belongs to the agent-utilities warm-fork surface CONSUMING this engines cross-modal context. Kept #[ignore]d with this refined reason.'}
- {id: EG-KG.query.advanced-specs-green-umbrella, namespace: EG-4, session: 'close-advanced-specs', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'Handoff-1 track F umbrella — achievable #[ignore]d advanced cross-modal roundtrip specs (EG-391/393/394/395) turned GREEN by building the missing test-surface fixtures/harnesses (EG-KG.query.overlay-leg-rls-filter..EG-KG.query.cdc-live-view-rebuild); the two genuinely-hard rows (EG-396/EG-397) kept #[ignore]d with refined precise reasons (EG-KG.query.crossshard-2pc-open-reason/EG-KG.query.warmfork-fanout-open-reason). One src seam (EG-KG.query.overlay-leg-rls-filter post-overlay RLS filter in run_unified_overlaid); the rest is fixture/harness + test-side. tests/advanced_crossmodal_roundtrip.rs + docs/north_star.md + docs/concepts.md.'}
- {id: EG-KG.query.usecase-agent-memory, namespace: EG-4, session: 'usecase-suites', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'High-value use-case validation suite #1 — AGENT-MEMORY RETRIEVAL (tests/usecase_agent_memory.rs). Ingest episodes/events as graph nodes + embeddings + a small OWL ontology (Episode subClassOf Memory), then run ONE fused unified-query plan through the real eg_plan::execute engine that honors semantic (Op::Rank vector), lexical (Op::RankText BM25 over a live eg_text::TextIndex), graph expansion (Op::Traverse / Op::RankNodeDistance), OWL inference (Op::Reason), bi-temporal AS OF (Op::AsOf{Valid}), and RRF fusion (Op::FuseRrf). Asserts the fused rank surfaces the memory relevant across ALL signals, beating any single modality. Confidence-decay is proven deterministically via eg_rdf::owl::fact_confidence (fresher memory outranks a stale one) and its non-foldability into the single plan is EG-KG.query.decay-not-foldable-finding.'}
- {id: EG-KG.query.usecase-codebase-intel, namespace: EG-4, session: 'usecase-suites', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'High-value use-case validation suite #2 — CODEBASE / REPOSITORY INTELLIGENCE (tests/usecase_codebase_intel.rs). Ingest code structure (File/Function nodes, CALLS/IMPORTS edges) as a graph + embeddings of function signatures + a small language/framework ontology (RustFn subClassOf Function) + per-node metadata (changed_at valid-time), then one hybrid plan: functions similar to X (Op::Rank), related via call-graph to Y (Op::Traverse CALLS), changed recently (Op::AsOf{Valid}), matching ontology concept Z (Op::Reason). Asserts the fused answer honors vector + call-graph + temporal + OWL simultaneously.'}
- {id: EG-KG.query.usecase-hybrid-rag-analytics, namespace: EG-4, session: 'usecase-suites', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'High-value use-case validation suite #3 — HYBRID RAG + IN-ENGINE ANALYTICS (tests/usecase_hybrid_rag_analytics.rs). Retrieve candidates via a graph+vector+text fused plan (Op::FuseRrf over Op::Rank/Op::RankText, seeded by Op::Scan) through eg_plan::execute, hydrate the joined embeddings from the in-engine SemanticStore, then run in-engine PCA + kmeans (Method::DsPca/DsKMeans through the real server dispatch, compute-near-data — no data leaves the engine process). Asserts the Rank->analytics seam: the analytics run over exactly the fused-retrieval result set, cluster labels separate the two semantic groups, and PCA explained-variance concentrates on the dominant axis.'}
- {id: EG-KG.query.usecase-observability-rca, namespace: EG-4, session: 'usecase-suites', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'High-value use-case validation suite #4 — OBSERVABILITY / ROOT-CAUSE (tests/usecase_observability_rca.rs). Logs/traces as Document nodes + error-log embeddings + a Service dependency graph (DEPENDS_ON edges) + native metrics in an eg_tsdb::store::SeriesStore, then a fused plan that traverses the dependency graph while ranking by vector similarity on error logs (Op::Traverse + Op::Rank/Op::RankNodeDistance fused via Op::FuseRrf) to surface the culprit service, plus a native tsdb Op::TsScan -> Op::WindowAgg temporal window over the incident that flags the metric anomaly. Asserts graph traversal + vector similarity + temporal windowing all contribute to the root-cause answer.'}
- {id: EG-KG.query.usecase-kg-lifecycle, namespace: EG-4, session: 'usecase-suites', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'High-value use-case validation suite #5 — KG LIFECYCLE WITH VALIDATION & INFERENCE (tests/usecase_kg_lifecycle.rs). SHACL validation (Method::ShaclValidate — a bad shape is REJECTED, a conformant one passes) + OWL reasoning + graph mutations + vector-index maintenance staged in ONE ACID txn (BeginTxn -> TxnAddNode/TxnAddEdge/TxnAddEmbedding/TxnAxiom -> Commit) over the real dispatch server, then asserts inference closure (Op::Reason infers the new instance a member of the committed super-class) AND vector re-indexing (the new embedding is kNN-retrievable) hold off-txn after commit, all under a CONCURRENT hybrid read that sees a consistent snapshot (no torn/partial state).'}
- {id: EG-KG.query.decay-not-foldable-finding, namespace: EG-4, session: 'usecase-suites', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'FINDING (open, north_star) surfaced by use-case suite #1 (EG-KG.query.usecase-agent-memory): confidence time-DECAY cannot be folded into a single fused unified-query plan. The plan executor s Op::Reason passes now=0 to the confidence reasoner (exec.rs reason_source, decay-neutral by design so a bare Reason is a stable leaf), so bi-temporal AS OF liveness re-selection AND Ebbinghaus confidence-decay re-weighting cannot BOTH be expressed in one Op chain — decay must be applied via the separate OwlReason Method / eg_rdf::owl::instances_of_weighted surface that threads a wall-clock now. Fix option: a plan op (or Reason field) carrying an explicit now/half_life so time-decayed confidence composes in-plan alongside AsOf. Open row in docs/north_star.md.'}
- {id: EG-KG.query.served-text-index-unbound-finding, namespace: EG-4, session: 'usecase-suites', reserved_at: '2026-07-04T02:00:00.000000+00:00', expires_at: '2027-07-04T02:00:00.000000+00:00', status: active, design_doc: 'FINDING (open, north_star) surfaced by use-case suites #1/#3 (EG-KG.query.usecase-agent-memory/EG-KG.query.usecase-hybrid-rag-analytics): the SERVED run_unified (src/server/handlers/query.rs) binds NO BM25 eg_text::TextIndex onto the PlanCtx, so a served UnifiedQueryText/UnifiedQuery whose plan contains Op::RankText or an Op::FuseRrf text branch degrades to ZERO lexical hits (documented at query.rs:705 as the KG-2.215 increment-2 follow-up). Consequence: the lexical leg of the agent-memory/hybrid-RAG fused query is fully wired at the eg_plan::execute engine surface but is a no-op through the served RPC surface until ServerState owns a live index-on-write TextIndex + an AddText/IndexText Method + a persist dir beside the authoritative graph shards. Fix: thread a TextIndex into ServerState and bind it in run_unified. Open row in docs/north_star.md.'}
- {id: EG-KG.query.reason-decay-in-plan, namespace: EG-KG, session: 'served-query-completeness', reserved_at: '2026-07-04T14:00:00.000000+00:00', expires_at: '2027-07-04T14:00:00.000000+00:00', status: active, design_doc: 'Item 1 (resolves EG-KG.query.decay-not-foldable-finding / was EG-439). Fold confidence time-decay INTO one fused plan: PlanCtx gains an owl-gated decay: Option<(now, half_life)> bound via PlanCtx::with_decay; exec.rs reason_op/reason_source thread it into eg_rdf::owl::asserted_types_with_confidence_from_view/instances_of_weighted so Op::Reason computes Ebbinghaus-decayed OWL confidence in-plan alongside Op::AsOf. None (default) = decay-neutral now=0/half_life=0 (byte-for-byte prior leaf-stable Reason). Proven: same plan at two now values yields different decayed scores (eg-plan reason_confidence_decays_in_plan_at_two_now_values) + usecase_agent_memory confidence_decay_folds_into_reason_plan (in-plan). SEMANTIC id hand-formed. crates/eg-plan/src/exec.rs.'}
- {id: EG-KG.query.served-text-index-binding, namespace: EG-KG, session: 'served-query-completeness', reserved_at: '2026-07-04T14:00:00.000000+00:00', expires_at: '2027-07-04T14:00:00.000000+00:00', status: active, design_doc: 'Item 2 (resolves EG-KG.query.served-text-index-unbound-finding / was EG-440). Bind the graph text index into the served plan ctx: run_unified builds a snapshot-derived eg_text::TextIndex from the off-lock GraphView node blobs (all string leaves) and binds via PlanCtx::with_text, only when the plan references a text op (plan_needs_text/build_text_index_from_view), so a served Op::RankText/Op::FuseRrf text branch returns REAL BM25 lexical hits (was ZERO). Snapshot-consistent + deterministic BM25 = byte-identical ranking to a persistent index; persistent index-on-write beside the authoritative graph shards is a pure-perf follow-up. Proven via served dispatch roundtrips tests/served_query_completeness.rs. SEMANTIC id hand-formed. src/server/handlers/query.rs.'}
- {id: EG-KG.query.served-plan-optimize-routing, namespace: EG-KG, session: 'served-query-completeness', reserved_at: '2026-07-04T14:00:00.000000+00:00', expires_at: '2027-07-04T14:00:00.000000+00:00', status: active, design_doc: 'The served path hands plan.ops directly to eg_plan::execute; plan_optimize runs the full cross-modal optimizer (filter/AsOf-before-Rank + Reason-Rank + FuseRrf branch reorder). Selectivity is derived natively from plan statistics, with no caller-carried ordering hint. src/server/handlers/query.rs.'}
- {id: EG-KG.query.empty-set-commutativity, namespace: EG-KG, session: 'served-query-completeness', reserved_at: '2026-07-04T14:00:00.000000+00:00', expires_at: '2027-07-04T14:00:00.000000+00:00', status: active, design_doc: 'Item 4 (resolves EG-405 / EG-KG.compute.eg-190). DETERMINATION: INTENTIONAL semantics, NOT a bug. The executor empty-RowSet-flips-downstream-op-into-SOURCE-mode convention is what lets a BARE Filter/AsOf/Reason/Rank be a leaf source; commute law holds only in the non-emptying regime; the cost optimizer already guards it (adjacent narrower-vs-Rank only, input from a source, both intermediates >=1 row, never narrower-vs-narrower = the exact witness). Documented in docs/uql.md (Composition & commutativity); witnesses plan_proptest::empty_intermediate_reseeds_source_breaks_commute + filter_and_asof_commute_in_nonempty_regime kept AS THE SPEC; north_star row flipped open->intentional-semantics-documented. No code change. SEMANTIC id hand-formed. crates/eg-plan/src/optimizer.rs + tests/plan_proptest.rs.'}
