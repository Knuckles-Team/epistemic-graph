- {id: EG-359, namespace: EG-3, session: 'txn-seam-lane0', reserved_at: '2026-07-03T15:00:00.000000+00:00', expires_at: '2026-07-05T15:00:00.000000+00:00', status: active, design_doc: In-txn cross-modal RYOW unified query — Method::TxnUnifiedQuery{txn_id,plan,reorder_filter_selectivity} + Method::TxnUnifiedQueryText{txn_id,text,reorder_filter_selectivity} (query-gated); run the SAME wire::Plan/UQL over a committed-store snapshot OVERLAID with the txn's staged write-set so staged nodes/edges/embeddings are visible to THIS txn pre-commit, invisible off-txn until commit (Gap 1). Lane 0 = types only; handler/overlay owned by Lane A}
