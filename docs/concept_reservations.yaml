- {id: EG-KG.storage.write-changeset, namespace: EG-KG, session: 'write-index-coherence', reserved_at: '2026-07-04T08:00:00.000000+00:00', expires_at: '2027-07-04T08:00:00.000000+00:00', status: active, design_doc: 'Per-batch ChangeSet plumbing — the write coalescer collects successful per-WriteOp deltas into an eg-core index::ChangeSet inside the topology lock, then routes it to GraphCore::maintain_indexes so secondary indexes are maintained incrementally under the same lock with never-torn hybrid reads.'}
