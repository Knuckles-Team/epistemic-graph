- {id: EG-396, namespace: EG-3, session: 'advanced-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'Advanced cross-modal roundtrip #4 (OPEN, #[ignore]) — cross-shard txn spanning modalities under Raft, kill coordinator mid-2PC → single decision. GENUINE GAP: no in-process multi-node openraft cluster + 2PC coordinator-kill test harness exists in tests/ (raft/multi_raft live behind the cluster feature in src/server/state.rs). A cluster test scaffold is required before this is green.'}
- {id: EG-397, namespace: EG-3, session: 'advanced-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'Advanced cross-modal roundtrip #11 (OPEN, #[ignore]) — KV-cache warm-fork fan-out reusing cross-modal context, isolated on divergent writes. CROSS-REPO GAP: the warm-fork sandbox primitive (ForkableSandbox/WarmParentRegistry, ORCH-1.86..93) lives in agent-utilities, NOT epistemic-graph; eg-kvcache here provides the KV page store (EG-364) but no fork primitive. The fan-out test belongs to the agent-utilities warm-fork surface consuming this engines cross-modal context.'}
- {id: EG-398, namespace: EG-3, session: 'advanced-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'Native-RPC routing for the extended cross-modal STAGING methods — surfaced by the EG-390 capstone test: TxnAddMeasurement/TxnAxiom/TxnConstruct handlers exist in handlers/txn.rs (EG-360/361/362) but dispatch.rs never routed them (they fell through to the graph-op not-available catch-all), so an in-txn measurement/axiom/CONSTRUCT staged fine over pgwire (EG-372, which calls the stage fns directly) but ERRORED over the native RPC surface — a Seamless leak. Fix: three cfg-gated (tsdb/owl/sparql) dispatch arms routing each to handlers::txn::try_handle (they carry their own graph, so no BeginTxn graph-default rewrite). Closes EG-360/361/362 at the RPC surface.'}
- {id: EG-400, namespace: EG-4, session: 'query-test-harness', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Differential multi-surface oracle — curated hybrid queries run via UQL text + Rust builder + separate-surfaces oracle asserting identical plan AST + byte-identical RowSet (MATCH→WHERE→TRAVERSE→RANK→AS OF→LIMIT and REASON→RANK→TRAVERSE). crates/eg-plan/tests/differential_oracle.rs'}
- {id: EG-401, namespace: EG-4, session: 'query-test-harness', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Cross-modal composition matrix — source-op × transform-op combos + 3-5-op mixed chains + edge cases (empty/single/high-card/low-selectivity RANK/deep TRAVERSE/REASON feeding TRAVERSE-RANK) asserting no panic + sane RowSet shape. crates/eg-plan/tests/composition_matrix.rs'}
- {id: EG-402, namespace: EG-4, session: 'query-test-harness', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Property-based query proofs — proptest generator of valid UQL pipelines asserting no-panic/determinism/snapshot-isolation/LIMIT-after-RANK-stable/safe-FILTER-AsOf-commute. crates/eg-plan/tests/plan_proptest.rs (proptest dev-dep)'}
- {id: EG-403, namespace: EG-4, session: 'query-test-harness', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Plan-snapshot regression — insta snapshots of the logical plan for ~8 curated hybrid queries + cost-reordered plans (UQL-vs-builder stable) catching lowering AND optimizer-quality regressions. crates/eg-plan/tests/plan_snapshots.rs (insta dev-dep)'}
- {id: EG-404, namespace: EG-4, session: 'query-test-harness', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'FINDING (open) — UQL RANK vector-literal parser rejects negative components (no unary-minus path) while the builder/wire accept them; a surface expressiveness asymmetry. Tracked in docs/north_star.md'}
- {id: EG-405, namespace: EG-4, session: 'query-test-harness', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'FINDING (open) — op composition not freely commutative — an empty intermediate RowSet flips a downstream Filter/AsOf/Reason into SOURCE mode so [Filter,AsOf] != [AsOf,Filter] when the first empties the set; commute law holds only in the non-emptying regime. Tracked in docs/north_star.md'}
- {id: EG-406, namespace: EG-4, session: 'query-test-harness', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Differential wire-surface oracle (pgwire leg) — reuses the live pgwire listener to prove SQL-wire and UQL-wire surfaces agree on the same filter + UQL wire determinism. tests/pgwire_roundtrip.rs'}
- {id: EG-411, namespace: EG-3, session: 'xmodal-foldins', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Server-side embedder seam for UQL RANK BY ~ "text" — a quoted rank ref lowers to wire::Op::RankEmbed{text}, resolved at exec time by a TextEmbedder (embed(text)->Vec<f32>) bound on PlanCtx via with_embedder; the executor turns the text into a query vector kNN-ranked over the SemanticStore exactly like a literal-vector Op::Rank. No embedder bound => a clean typed error (never a panic). Dep-free trait; deterministic HashEmbedder fallback for tests/offline. A bare-ident handle (~handle) stays a reserved forward seam (no by-name embedding registry). Parser splits VectorRef into Inline/Text/Handle. eg-plan exec.rs + uql/parser.rs + eg-types/wire.rs.'}
- {id: EG-412, namespace: EG-3, session: 'xmodal-foldins', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Facade injection point for the UQL embedder seam — run_unified (src/server/handlers/query.rs) binds the process-wide server-side TextEmbedder onto the PlanCtx (with_embedder) so a served RANK BY ~ "text" (Op::RankEmbed) resolves its vector. Engine stores embeddings but produces them client-side today, so no in-process model ships by default (unbound => clean typed error); a real embedding model is wired HERE. Deterministic HashEmbedder fallback opt-in via EG_UQL_TEXT_EMBEDDER=hash. uql_text_embedder() OnceLock helper.'}
- {id: EG-413, namespace: EG-3, session: 'xmodal-foldins', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Real WINDOW tumbling time-series aggregate — Op::Window{secs} no longer passes rows through: it CONSUMES a RowSet of (ts,value) rows (a graph-node row valid_from+score/value, OR a time-series SOURCE row from Op::TsScan/prior Op::Window where id=ts, score=value; TsScan ns ts normalized to seconds) and PRODUCES one row per non-empty tumbling bucket (id=aligned bucket start, score=aggregate) via eg-tsdb time_bucket, composing into Rank/Limit. Closes the TsScan->Window gap (a TsScan numeric id was not a node, so Window dropped every row and yielded empty). Wired under timeseries; non-timeseries build passes through. eg-plan exec.rs window_aggregate.'}
- {id: EG-414, namespace: EG-3, session: 'xmodal-foldins', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Selectable WINDOW aggregate — wire::Op::WindowAgg{secs,agg} (UQL WINDOW <dur> <agg>) runs the SAME tumbling windower as Op::Window with a chosen eg-tsdb Agg (mean/avg,sum,min,max,count,first,last; unknown=>mean). Unit matched before the aggregate (WINDOW 30 min = 30 minutes; WINDOW 30 s min = 30s min-agg). Base query wire variant; aggregate wired under timeseries (passthrough otherwise). eg-plan exec.rs parse_window_agg + uql/parser.rs.'}
- {id: EG-417, namespace: EG-3, session: 'xmodal-foldins', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'Negative vector components in UQL RANK BY ~[...] — parse_vector_ref accepts a leading - (Tok::Dash) before a numeric component, so RANK BY ~[-0.1, 0.2, -0.3] parses to the SAME Op::Rank{query} the Rust builder/wire DTO always accepted; closes a lexer/parser asymmetry. UQL-vs-builder equality test. eg-plan uql/parser.rs.'}
- {id: EG-418, namespace: EG-3, session: 'xmodal-foldins', reserved_at: '2026-07-04T00:00:00.000000+00:00', expires_at: '2027-07-04T00:00:00.000000+00:00', status: active, design_doc: 'UQL FUSE stage dispatch — parse_stage now dispatches FUSE, and parse_fuse lowers FUSE [branch] [branch] ... (each bracketed sub-pipeline a Vec<Op> branch) to the SAME Op::FuseRrf{branches,k:0.0} the builder/wire construct (k=0.0 => canonical eg_text::RRF_K). RRF was builder/wire-only though the grammar listed it — closes a surface asymmetry. Feature-gated to text (mirrors TEXT); non-text build errors clearly. UQL-vs-builder equality test. eg-plan uql/parser.rs.'}
- {id: EG-419, namespace: EG-4, session: 'crossmodal-reconcile', reserved_at: '2026-07-04T01:00:00.000000+00:00', expires_at: '2027-07-04T01:00:00.000000+00:00', status: active, design_doc: 'GraphQL durable boundary: the lower crate cannot commit and its registry keys staged buffers by verified owner scope. The facade accepts only a sole-root commit, validates graph/tenant/principal on execution and replay, commits one authoritative MutationBatch, then installs the committed snapshot. Mixed-root and caller-mismatched handles fail closed.'}
