- {id: EG-387, namespace: EG-3, session: 'advanced-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'Advanced cross-modal test #12 — tensor×graph×vector + CAS dedup TensorScan→TensorOp(Reduce,CAS write-back)→Traverse<DERIVES>→Rank: derived frames traverse into docs (vector-ranked) while three identical reductions content-address to ONE dedup CAS blob (EG-304). gated eg-plan/tensor.'}
- {id: EG-388, namespace: EG-3, session: 'advanced-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'Advanced cross-modal test #13 — CEP×graph×tsdb Scan(Event)→Cep(login→logout sequence, sliding window)→Traverse<TRIGGERS>→Window: the matched session traverses to its sensor Readings, then a native eg-tsdb Window aggregates them (MEAN); a dangling non-matching events reading is excluded. gated eg-plan/stream+timeseries.'}
- {id: EG-389, namespace: EG-3, session: 'advanced-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'Advanced cross-modal test #14 — probabilistic×OWL×vector + MMR Reason<iri>→Rank→Probabilistic(Expectation)→RankMmr: reranks an OWL-reasoned, vector-filtered set by each rows stored distribution mean, then MMR promotes an orthogonal member above a near-duplicate. gated eg-plan/owl+probabilistic.'}
