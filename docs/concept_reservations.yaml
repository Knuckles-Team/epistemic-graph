- {id: EG-KG.query.parallel-runtime, namespace: EG-KG, session: 'physical-runtime', reserved_at: '2026-07-04T03:00:00.000000+00:00', expires_at: '2027-07-04T03:00:00.000000+00:00', status: active, design_doc: 'Lane B physical runtime — new crates/eg-plan/src/runtime.rs hung off the Lane-0 Driver seam. execute_ops(ops,ctx) is the ONE dispatch execute() routes through: default SerialDriver (Pi contract), else the opt-in (par-runtime feature) rayon-morsel ParallelDriver. The driver OWNS scheduling/morsel-batching, parallelism (rayon pool sized by EPISTEMIC_GRAPH_EXEC_THREADS), memory accounting + spill-to-disk of oversized intermediates (EPISTEMIC_GRAPH_EXEC_SPILL_MB), result materialization; per-op physical fns stay modality-specific + unchanged. Linear plan = data-dependent ops, so parallelism is intra-op: morsel-split the input of a row-parallel op (conservatively only AsOf, non-empty input => per-row-independent order-preserving filter), run morsels on the pool, concat in morsel order => byte-for-byte the serial fold. PURE refactor: serial_and_parallel_drivers_agree proptest (threads:4 + spill_bytes:1 forces morsel+spill legs) + differential oracle + plan_proptest determinism prove byte-identity; ZERO plan-snapshot churn (AST + plan_optimize identity unchanged). Feature par-runtime=[query,dep:rayon]; rayon 1.10 pin (eg-ann/eg-compute). SEMANTIC id hand-formed (CLI unavailable) — reconcile.'}
