# NOTE (reconcile): seam-tests' two FEATURE-GAP ignored specs (formerly EG-364/365) are now BUILT by Lanes A/B/C and un-ignored; they re-point to Lane A's EG-359 (in-txn RYOW) and Lane B's EG-360 (5-modality staging) — no separate reservation.
- {id: EG-371, namespace: EG-3, session: 'collapse-tiers', reserved_at: '2026-07-03T15:00:00.000000+00:00', expires_at: '2026-07-05T15:00:00.000000+00:00', status: active, design_doc: 'Collapse the compiled deployment TIERS (pi/pi-max/node) into ONE main full-featured published build. `default` now equals the former `full` feature set — all MAIN features that build without an external toolchain/GPU (compute + server + query/DataFusion + cypher + graphql + redb + ann + security + the wire family pgwire/mysql/mssql/sqlite/bolt/redis/amqp/mqtt/stomp + sparql-http + obs/otel + otel-export + kvcache-compression + ann-redb). Opt-in build layers stay ON TOP, NOT published as separate wheels: `cluster` (openraft raft/compute-dist/nonblocking — HA multi-node) and `full-extras` (gpu-cuda/ros2-bridge/ros2-dds — need CUDA/robotics toolchains). Removes the pi/pi-max/node tier distinction and the shared-wheel-filename collision (one tier -> one wheel). release-build.yml wheel matrix collapsed to ONE wheel/platform (linux x86_64 + aarch64). Pi-contract invariant RETIRED for DataFusion (query is now default); PRESERVED: no pyo3 in any build (bindings=bin), no openraft in default (cluster-only), no cudarc/rustdds in default (full-extras-only). Targets Raspberry Pi 4+, not Pi 3. (renumbered from EG-359 on reconcile — Lane 0 owns EG-359..363)'}
- {id: EG-372, namespace: EG-3, session: 'pgwire-crossmodal-seam', reserved_at: '2026-07-03T16:00:00.000000+00:00', expires_at: '2027-07-03T16:00:00.000000+00:00', status: active, design_doc: 'pgwire cross-modal txn seam — the PGWIRE TEXT entrypoint for the EG-359..363 in-txn cross-modal seam. Recognizes UQL <text>, SET EMBEDDING FOR <id> = <vec>, INSERT INTO series (id,ts,value) VALUES …, SPARQL UPDATE …, SPARQL CONSTRUCT … inside a BEGIN…COMMIT on the shared WireSession core (so the whole multi-wire family EG-074 lights up), staging via src/server/txn.rs GraphTxnState (stage_vector/stage_measurement + lowered axioms/constructs) and reading in-txn via the extracted run_unified overlay (read-your-own-writes across graph+vector+OWL). COMMIT lands all modalities atomically via the extracted commit_cross_modal_txn (now persistence-None tolerant → in-memory cross-modal commit). Off-txn cross-modal writes auto-commit as one atomic statement. No plan/txn logic duplicated — the wire is a thin parser/router onto the committed RPC seam.'}
- {id: EG-373, namespace: EG-3, session: 'pgwire-crossmodal-seam', reserved_at: '2026-07-03T16:00:00.000000+00:00', expires_at: '2027-07-03T16:00:00.000000+00:00', status: active, design_doc: 'North Star: Seamless — every discovered cross-modal seam is fully implemented at EVERY surface (RPC/native, all SQL wires, SPARQL, GraphQL), never merely flagged. docs/north_star.md tracks the seam backlog (done: RPC cross-modal txn EG-359..363; this PR: pgwire cross-modal txn EG-372; open: mysql/mssql-wire parity, the 14 advanced cross-modal tests, GraphQL cross-modal, in-txn tsdb-RYOW overlay).'}
- {id: EG-374, namespace: EG-3, session: 'crossmodal-subseams', reserved_at: '2026-07-03T17:00:00.000000+00:00', expires_at: '2027-07-03T17:00:00.000000+00:00', status: active, design_doc: 'In-txn tsdb read-your-own-writes staged-series overlay — a new in-memory eg_plan::StagedSeries (series_id -> staged (ts_ns, field_values) points, feature timeseries) attached to PlanCtx via with_staged_series. Op::TsScan (exec.rs tsdb_scan_op) now MERGES the staged overlay (RYOW precedence on a ts collision) with the committed eg_tsdb SeriesStore before emitting rows, so an in-txn UQL reading a series via TsScan sees the txn''s own uncommitted GraphTxnState.measurements while an off-txn read sees committed only. run_unified_overlaid builds the StagedSeries from the resolved txn''s staged measurements and threads it through run_unified. Closes the north_star open row EG-360/363 (in-txn tsdb-RYOW overlay).'}
- {id: EG-375, namespace: EG-3, session: 'crossmodal-subseams', reserved_at: '2026-07-03T17:00:00.000000+00:00', expires_at: '2027-07-03T17:00:00.000000+00:00', status: active, design_doc: 'REASON <iri> mid-plan — the UQL front-end now lexes an angle-bracketed IRI (<scheme:...>, whitespace-free, contains a colon) as a single Tok::Iri and parse_reason accepts it, so REASON <http://…/Class> is expressible at the UQL/pgwire surface (previously only a bare ident/label). Composes mid-pipeline via the existing reason_op FILTER branch: a plan MATCH … |> RANK … |> REASON <http://…/Class> |> TRAVERSE intersects the ranked candidate set with the reasoned members of that explicit IRI class. Part of the advanced-cross-modal-correctness set (was folded in EG-365..370).'}
- {id: EG-376, namespace: EG-3, session: 'crossmodal-subseams', reserved_at: '2026-07-03T17:00:00.000000+00:00', expires_at: '2027-07-03T17:00:00.000000+00:00', status: active, design_doc: 'String-type ↔ IRI-class bridge for REASON — the OWL reasoner''s membership resolution now bridges a node''s bare string type property (e.g. {"type":"Widget"}) to the OWL class IRI used by the reasoner. Rule: the bridge base is the NAMESPACE of the REASON target IRI (everything up to the last / or #); a bare local-name type t maps to <base + t>. Applied in eg-rdf asserted_types_with_confidence_from_view / asserted_types_from_view (via an optional class_base) and in exec.rs reason_source (derives the base from the normalized target IRI), so REASON <http://ex/Device> includes a {"type":"Sensor"} node when the ontology declares <http://ex/Sensor> ⊑ <http://ex/Device>. Base None ⇒ byte-for-byte the prior bare-string behavior. Part of the advanced-cross-modal-correctness set (was folded in EG-365..370).'}
- {id: EG-377, namespace: EG-3, session: 'wire-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'mysql-wire cross-modal txn roundtrip TEST — per-surface parity proof (north-star EG-373) that the MySQL/MariaDB wire inherits the shared-WireSession cross-modal seam (EG-074/EG-372). New tests/mysql_roundtrip.rs hand-rolls the MySQL Handshake-v10 / Handshake-Response-41 + COM_QUERY text-protocol client over a raw TcpStream (no mysql client crate — the Pi-contract idiom, like the sibling TDS test) and drives the REAL mysql_wire::serve_with_auth listener. Mirrors the pgwire cross-modal cases: (1) mysql_wire_txn_update_then_cross_modal_read — an in-txn graph UPDATE + vector SET EMBEDDING are BOTH read back by an in-txn UQL cross-modal read (RYOW across graph+vector before COMMIT); (2) mysql_wire_txn_crossmodal_ryow_isolated_until_commit — BEGIN; INSERT node; SET EMBEDDING; INSERT INTO series; <UQL join>; COMMIT reads its own writes while a SECOND connection sees NONE until COMMIT, then the committed cross-modal state after. No src changes — the seam is proven, not built.'}
- {id: EG-378, namespace: EG-3, session: 'wire-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'mssql-wire (TDS) cross-modal txn roundtrip TEST — per-surface parity proof (north-star EG-373) that the MSSQL TDS wire inherits the shared-WireSession cross-modal seam (EG-074/EG-372). Extends tests/mssql_roundtrip.rs with a reusable connect (PRELOGIN+LOGIN7 trust) + batch (SQLBatch → walk COLMETADATA/ROW/DONE, loud panic on an ERROR token) helper over the existing hand-rolled raw-TcpStream TDS client, then mirrors the pgwire cross-modal cases: (1) tds_txn_update_then_cross_modal_read — in-txn graph UPDATE + vector SET EMBEDDING read back by an in-txn UQL cross-modal read (RYOW); (2) tds_txn_crossmodal_ryow_isolated_until_commit — BEGIN; INSERT node; SET EMBEDDING; INSERT INTO series; <UQL join>; COMMIT reads its own writes while a SECOND TDS connection sees NONE until COMMIT, then the committed state after. No src changes — the seam is proven, not built.'}
- {id: EG-379, namespace: EG-3, session: 'graphql-crossmodal', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'GraphQL cross-modal txn seam — eg_graphql::crossmodal gives the GraphQL surface the EG-359..363 in-txn cross-modal verbs (stageEmbedding/addMeasurement/sparqlUpdate/sparqlConstruct staging + in-txn unifiedQuery read + commitTransaction). eg-graphql sits BELOW the facade in the crate DAG, so it routes onto the SAME LOWER primitives the facade GraphTxnState/run_unified_overlaid are built on — GraphView::overlay_* + eg_core semantic_overlay + eg_plan::execute over an eg_plan::uql plan + eg_rdf CONSTRUCT/UPDATE lowering — not the facade wrappers (ABOVE it, unreachable). No plan/lowering logic duplicated. Gated by the crossmodal sub-feature (default-on; rides into graphql/node/full via the facade default-features pull).'}
- {id: EG-380, namespace: EG-3, session: 'graphql-crossmodal', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'GraphQL cross-modal multi-request txnId handle — GraphQL over HTTP has no session, so beginTransaction mints a txnId into an eg_graphql::CrossModalTxnRegistry (Mutex<HashMap>, same idiom as ApqRegistry) held by a server carrier across a connection; later stage*/unifiedQuery/commitTransaction/rollbackTransaction carry the id. In-txn reads see the txn own staged writes (RYOW); off-txn/other-txn reads see committed only (isolation). Achievable multi-request form — the crate PROVIDES the session via the registry, so no batched single-op fallback needed.'}
- {id: EG-381, namespace: EG-3, session: 'graphql-crossmodal', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'GraphQL cross-modal tsdb leg — addMeasurement stages a time-series point and the in-txn unifiedQuery threads an eg_plan::StagedSeries overlay (EG-374 parity) so an Op::TsScan reads the txn own uncommitted points. Gated by crossmodal-tsdb (default-OFF, parity with facade tsdb-gated TxnAddMeasurement); without it addMeasurement returns a clear not-built error. Enabled from the facade tsdb graphql tier at reconcile.'}
- {id: EG-382, namespace: EG-3, session: 'graphql-crossmodal', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'GraphQL cross-modal roundtrip proof — eg-graphql/src/crossmodal.rs tests drive a full multi-request txn: begin -> stageEmbedding + sparqlUpdate -> in-txn unifiedQuery returns RYOW (staged embedding scores ~1.0 under MATCH (:Person) |> RANK BY ~[..]) -> a second empty txn + the committed store are ISOLATED -> commitTransaction makes both vector and graph modalities visible. A crossmodal-tsdb-gated test proves the addMeasurement StagedSeries overlay is read by a TsScan (RYOW). Rollback discards.'}
- {id: EG-383, namespace: EG-3, session: 'graphql-crossmodal', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'GraphQL cross-modal facade reconcile hooks (engine 2.10.0) — (1) durable atomic commit: the GraphQL HTTP carrier commitTransaction converts the staged CrossModalTxn into a facade GraphTxnState and calls commit_cross_modal_txn (one redb WriteTransaction across ALL modalities incl tsdb SERIES), like pgwire commit_txn_state; until then in-crate commit is the in-memory tier (graph+vector to GraphCore). (2) facade enables eg-graphql/crossmodal-tsdb from its tsdb graphql tier so addMeasurement rides full. (3) hoist facade pub(crate) handlers::txn::triples_to_methods into eg-rdf as pub so eg-graphql and handlers::txn share ONE triples->property-graph lowering instead of the mirror in crossmodal::lower_triples.'}
