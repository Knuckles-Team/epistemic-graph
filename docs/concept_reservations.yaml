- {id: EG-KG.query.reason-rank-reorder-rule, namespace: EG-KG, session: 'xmodal-cost-optimizer', reserved_at: '2026-07-04T09:00:00.000000+00:00', expires_at: '2027-07-04T09:00:00.000000+00:00', status: active, design_doc: 'Lane A optimizer rule ReorderReasonRank (owl-gated) — order an adjacent mid-pipeline OWL Reason (confidence-preserving FILTER) vs a vector Rank by which shrinks the candidate set more, so the second leg runs over fewer rows. Mid-pipeline Reason only (index>=1); a leading Reason is a SOURCE, never reordered. Same adjacency + EG-405 non-empty guard as the filter-pushdown rule. crates/eg-plan/src/optimizer.rs. SEMANTIC id hand-formed — reconcile.'}
- {id: EG-KG.query.fuse-rrf-branch-reorder-rule, namespace: EG-KG, session: 'xmodal-cost-optimizer', reserved_at: '2026-07-04T09:00:00.000000+00:00', expires_at: '2027-07-04T09:00:00.000000+00:00', status: active, design_doc: 'Lane A optimizer rule ReorderFuseBranches (text-gated) — reorder a FuseRrf op branches by ascending branch cost (sum of CostEstimate.weight over the sub-plan). RRF accumulates into a map + sorts by (score,id) so the fused result is INDEPENDENT of branch order: byte-for-byte answer-preserving, only runs the cheaper branch first. Recurses into nested FuseRrf. crates/eg-plan/src/optimizer.rs. SEMANTIC id hand-formed — reconcile.'}
