- {id: EG-392, namespace: EG-3, session: 'advanced-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'Advanced cross-modal roundtrip #9 — concurrent SERIALIZABLE across modalities: a serializable txn (BeginTxn isolation serializable:label=Sensor) captures a predicate read-set, a concurrent txn commits a phantom Sensor, and the serializable txns commit re-evaluates the predicate, detects the phantom, and rolls back (Commit→false); its staged cross-modal write (node+embedding) never lands. tests/advanced_crossmodal_roundtrip.rs.'}
- {id: EG-393, namespace: EG-3, session: 'advanced-crossmodal-tests', reserved_at: '2026-07-03T18:00:00.000000+00:00', expires_at: '2027-07-03T18:00:00.000000+00:00', status: active, design_doc: 'Advanced cross-modal roundtrip #10 (OPEN, #[ignore]) — pgwire + /sparql + native consistent snapshot after a mixed cross-modal commit; deferred lift is the multi-listener harness (pgwire listener + tokio-postgres client per tests/pgwire_roundtrip.rs, plus sparql-http bound in the same ServerState). Committed machinery exists (EG-372).'}
