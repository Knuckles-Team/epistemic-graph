- {id: EG-364, namespace: EG-3, session: 'kvcache-invalidation', reserved_at: '2026-07-03T15:00:00.000000+00:00', expires_at: '2026-07-05T15:00:00.000000+00:00', status: active, design_doc: KV-cache data-version invalidation (eg-kvcache) — new DataVersion{Agnostic,At(u64)} type stamps each SharedKvIndex/TieredCache entry with the GraphCore::version() epoch it was derived at (mirrors eg-core ResultCache KG-2.233); set_data_version retires now-stale entries so no stale agent/LLM context is served after a graph write, while Agnostic pure content-addressed KV pages are never invalidated (EG-186 dedup + EG-185 LRU/pinning untouched, opt-in/zero-cost). put_block gains derived_at; TieredCache adds put_versioned + a per-key version side-map; EG-187 HTTP surface wires X-EG-Data-Version header + PUT|GET /kv/version/<n>. Simple version-epoch chosen over per-dependency-set (correct-by-construction, ResultCache-proven). Extends EG-185/186/187 (renumbered from EG-359 on reconcile — Lane 0 owns EG-359..363)}
- {id: EG-365, namespace: EG-3, session: 'seam-tests', reserved_at: '2026-07-03T15:00:00.000000+00:00', expires_at: '2027-07-03T15:00:00.000000+00:00', status: active, design_doc: Cross-modal SEAM regression — planner mid-pipeline composition proofs (Reason→Traverse→Rank == reasoner∘BFS∘kNN oracle; SensorFuse→Rank + TensorScan→Rank downstream composition; reason-seeded cost reorder plan-shape) in crates/eg-plan/src/cross_modal_seam_tests.rs (renumbered from EG-359 on reconcile — Lane 0 owns EG-359..363)}
- {id: EG-366, namespace: EG-3, session: 'seam-tests', reserved_at: '2026-07-03T15:00:00.000000+00:00', expires_at: '2027-07-03T15:00:00.000000+00:00', status: active, design_doc: Bitemporal SEAM — decay-sweep (Ebbinghaus, KG-2.211) re-weights confidence while AsOf{Valid} (KG-2.250) re-selects liveness and an in-between UPDATE flips a validity window; asserts confidence VALUES + liveness at two instants (eg-plan tests.rs as_of_after_decay_and_update) (renumbered from EG-360)}
- {id: EG-367, namespace: EG-3, session: 'seam-tests', reserved_at: '2026-07-03T15:00:00.000000+00:00', expires_at: '2027-07-03T15:00:00.000000+00:00', status: active, design_doc: Vector⇄reasoning cross-txn write→read consistency — a freshly written node (embedding + reasoner-subsumed type) is BOTH ANN-ranked AND reasoner-included by the next [Reason|>Rank] plan (EG-070 candidate-allowlist); embedding UPDATE reflected by next ANN pass (eg-plan vector_reasoning_tests.rs) (renumbered from EG-361)}
