- {id: EG-KG.storage.incremental-ann, namespace: EG-KG, session: 'write-index-coherence', reserved_at: '2026-07-04T08:00:00.000000+00:00', expires_at: '2027-07-04T08:00:00.000000+00:00', status: active, design_doc: 'Track-D2 incremental vector-store maintenance — SemanticStore::remove_embedding on BOTH backends (semantic_hnsw default: drop from map + tombstone internal id + deferred compaction; semantic_store_ann under `ann`/full: EmbeddingArena swap-remove O(dim) keeping the arena dense + AnnIndex::remove tombstones the IVF-PQ row via IvfPq::delete). VectorIndexDescriptor::apply_delta tombstones removed nodes embeddings so kNN never returns a dead node; adds/updates still flow through the already-incremental TxnAddEmbedding path. Proven incremental==full-rebuild-baseline + concurrency-coherent (never-torn) tests.'}
- {id: EG-KG.storage.incremental-text, namespace: EG-KG, session: 'write-index-coherence', reserved_at: '2026-07-04T08:00:00.000000+00:00', expires_at: '2027-07-04T08:00:00.000000+00:00', status: active, design_doc: 'Track-D3 (remainder) DONE — incremental tantivy TextIndex maintenance wired via the SecondaryIndex.apply_delta seam. GraphTextIndex (src/server/secondary_indexes.rs) wraps eg-text TextIndex as a SecondaryIndex, registered per-graph into the IndexManager by ServerIndexFactory (GraphCore::register_index + GraphRegistry::set_secondary_index_factory, mirroring the read-through factory). needs_content() flips the coalescer wants_change_content flag so apply_batch captures node property blobs into ChangeSet.NodeChange (zero-clone otherwise). apply_delta upserts/deletes+commits from the captured blob only (never core — deadlock); full_rebuild is out-of-lock. incremental == rebuild proven on the ranked id list + concurrency-coherent (tests/incremental_server_indexes.rs, crates/eg-text/src/index.rs).'}
- {id: EG-KG.storage.incremental-temporal, namespace: EG-KG, session: 'write-index-coherence', reserved_at: '2026-07-04T08:00:00.000000+00:00', expires_at: '2027-07-04T08:00:00.000000+00:00', status: active, design_doc: 'Track-D3 (remainder) DONE — incremental tsdb/temporal index maintenance wired via the SecondaryIndex.apply_delta seam. GraphTemporalIndex (src/server/secondary_indexes.rs) wraps the shared eg-tsdb SeriesStore, registered per-graph by ServerIndexFactory. apply_delta extracts a node measurements array from the captured blob and idempotently REPLACES the node per-node series (new SeriesStore::delete_series primitive + append_batch); a node removal drops the series. incremental == rebuild proven (crates/eg-tsdb/src/store.rs delete_series_tests + tests/incremental_server_indexes.rs); full_rebuild is out-of-lock from live nodes.'}
- {id: EG-KG.storage.incremental-derived-owl, namespace: EG-KG, session: 'write-index-coherence', reserved_at: '2026-07-04T08:00:00.000000+00:00', expires_at: '2027-07-04T08:00:00.000000+00:00', status: active, design_doc: 'Track-D3 (remainder) DONE — derived-OWL wired as a SecondaryIndex that NO-OPS, deferring to the reasoner. The eg-rdf OWL Reasoner.add_axioms (CONCEPT:EG-KG.ontology.incremental-materialization) already differentially materializes on-demand at query time, so DerivedOwlIndex (src/server/secondary_indexes.rs) registers into the seam (discoverable, counted in the batch tally) but its apply_delta/full_rebuild are documented no-ops — re-running would duplicate the reasoner pass. The materializer incremental == rebuild equivalence is proven directly against Reasoner in eg-rdf owl::tests::incremental_add_axiom_only_adds.'}
