<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Epistemic Graph engine architecture</title>
  <desc id="description">Authenticated interfaces feed a unified planner. The planner composes connected data, semantic reasoning, analytics, temporal signals, and multimodal evidence over one authoritative durable store.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#111936"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="planner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#93c5fd"/></marker>
    <style>.eyebrow{font:600 14px ui-sans-serif,system-ui,sans-serif;letter-spacing:2.4px;fill:#93c5fd}.title{font:700 34px ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.subtitle{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#cbd5e1}.box-title{font:700 18px ui-sans-serif,system-ui,sans-serif;fill:#f8fafc}.copy{font:400 13px ui-sans-serif,system-ui,sans-serif;fill:#cbd5e1}.chip{font:600 12px ui-sans-serif,system-ui,sans-serif;fill:#dbeafe}</style>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#background)"/><circle cx="1090" cy="60" r="190" fill="#2563eb" opacity=".08"/><circle cx="95" cy="590" r="190" fill="#7c3aed" opacity=".08"/>
  <text x="64" y="62" class="eyebrow">ONE ENGINE · ONE TRANSACTION BOUNDARY</text><text x="64" y="105" class="title">Connected knowledge, computed where it lives</text><text x="64" y="136" class="subtitle">Every interface reaches the same planner, policies, evidence, and durable state.</text>
  <g filter="url(#shadow)"><rect x="64" y="172" width="1072" height="68" rx="18" fill="#172033" stroke="#334155"/><text x="88" y="198" class="eyebrow">AUTHENTICATED INTERFACES</text><g transform="translate(88 208)"><rect width="105" height="23" rx="12" fill="#1e3a5f"/><text x="52" y="16" text-anchor="middle" class="chip">Python</text><rect x="117" width="105" height="23" rx="12" fill="#1e3a5f"/><text x="169" y="16" text-anchor="middle" class="chip">UQL</text><rect x="234" width="105" height="23" rx="12" fill="#1e3a5f"/><text x="286" y="16" text-anchor="middle" class="chip">SQL</text><rect x="351" width="105" height="23" rx="12" fill="#1e3a5f"/><text x="403" y="16" text-anchor="middle" class="chip">SPARQL</text><rect x="468" width="105" height="23" rx="12" fill="#1e3a5f"/><text x="520" y="16" text-anchor="middle" class="chip">Cypher</text><rect x="585" width="105" height="23" rx="12" fill="#1e3a5f"/><text x="637" y="16" text-anchor="middle" class="chip">GraphQL</text><rect x="702" width="105" height="23" rx="12" fill="#1e3a5f"/><text x="754" y="16" text-anchor="middle" class="chip">Bolt</text><rect x="819" width="105" height="23" rx="12" fill="#1e3a5f"/><text x="871" y="16" text-anchor="middle" class="chip">Streams</text></g></g>
  <path d="M600 240v24" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="215" y="272" width="770" height="75" rx="20" fill="url(#planner)"/><text x="600" y="303" text-anchor="middle" class="box-title">Unified planner + governed mutation pipeline</text><text x="600" y="327" text-anchor="middle" class="copy">Plan across modalities · validate policy and schema · commit related changes atomically</text></g>
  <path d="M600 347v24" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><g transform="translate(64 380)"><rect width="196" height="91" rx="18" fill="#18243e" stroke="#334e75"/><text x="18" y="31" class="box-title">Connected data</text><text x="18" y="56" class="copy">Graph · RDF · relational</text><text x="18" y="76" class="copy">Vector · text</text></g><g transform="translate(280 380)"><rect width="196" height="91" rx="18" fill="#211b40" stroke="#51458f"/><text x="18" y="31" class="box-title">Reasoning</text><text x="18" y="56" class="copy">OWL · SHACL · ShEx</text><text x="18" y="76" class="copy">Claims · belief · provenance</text></g><g transform="translate(496 380)"><rect width="196" height="91" rx="18" fill="#172c3c" stroke="#276276"/><text x="18" y="31" class="box-title">Analytics</text><text x="18" y="56" class="copy">SQL · graph · vector</text><text x="18" y="76" class="copy">Numeric · programs</text></g><g transform="translate(712 380)"><rect width="196" height="91" rx="18" fill="#2b2337" stroke="#6b4f7f"/><text x="18" y="31" class="box-title">Signals + time</text><text x="18" y="56" class="copy">Events · streams · metrics</text><text x="18" y="76" class="copy">Bitemporal state · CDC</text></g><g transform="translate(928 380)"><rect width="208" height="91" rx="18" fill="#252a3c" stroke="#566179"/><text x="18" y="31" class="box-title">Multimodal</text><text x="18" y="56" class="copy">Document · image · audio</text><text x="18" y="76" class="copy">Video · blobs · evidence</text></g></g>
  <g stroke="#64748b" stroke-width="2"><path d="M162 471v25M378 471v25M594 471v25M810 471v25M1032 471v25M162 496h870"/></g><path d="M600 496v21" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="150" y="526" width="900" height="64" rx="20" fill="url(#store)"/><text x="600" y="553" text-anchor="middle" class="box-title">Authoritative durable store</text><text x="600" y="575" text-anchor="middle" class="copy">Commit-before-ack · audit · tenant isolation · read-through recovery · optional Raft replication</text></g>
</svg>
