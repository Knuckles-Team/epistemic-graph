[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "medulla-stem"
version = "2.27.10"
description = "The native medulla-server executable, built from the medulla source at the same version"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/Knuckles-Team/medulla"
Documentation = "https://knuckles-team.github.io/medulla/"

# The package wraps the root manifest's `medulla-server` bin. The release
# workflow builds it with `maturin build --profile release-server` (maturin does not
# read the profile from this table in every release); `full,ast-extended` is the same
# feature set as the main build.
[tool.maturin]
bindings = "bin"
manifest-path = "../../Cargo.toml"
python-source = "."
module-name = "medulla_server"
features = ["full", "ast-extended"]
strip = true
include = [
# Cargo loads every path crate manifest (also those only unselected optional features
# reach), so the sdist carries each crate tree through the `crates` symlink (maturin
# rejects `..` in patterns). Checked against Cargo by tests/test_server_package.py.
    { path = "crates/medulla-alignment/**/*", format = "sdist" },
    { path = "crates/medulla-ann/**/*", format = "sdist" },
    { path = "crates/medulla-asr-whisper/**/*", format = "sdist" },
    { path = "crates/medulla-audio/**/*", format = "sdist" },
    { path = "crates/medulla-capabilities/**/*", format = "sdist" },
    { path = "crates/medulla-compute/**/*", format = "sdist" },
    { path = "crates/medulla-core/**/*", format = "sdist" },
    { path = "crates/medulla-document/**/*", format = "sdist" },
    { path = "crates/medulla-durable/**/*", format = "sdist" },
    { path = "crates/medulla-enrich/**/*", format = "sdist" },
    { path = "crates/medulla-epistemic/**/*", format = "sdist" },
    { path = "crates/medulla-geo/**/*", format = "sdist" },
    { path = "crates/medulla-graphql/**/*", format = "sdist" },
    { path = "crates/medulla-image/**/*", format = "sdist" },
    { path = "crates/medulla-jobs/**/*", format = "sdist" },
    { path = "crates/medulla-kvcache/**/*", format = "sdist" },
    { path = "crates/medulla-lake/**/*", format = "sdist" },
    { path = "crates/medulla-method-codec/**/*", format = "sdist" },
    { path = "crates/medulla-modality/**/*", format = "sdist" },
    { path = "crates/medulla-numeric/**/*", format = "sdist" },
    { path = "crates/medulla-plan/**/*", format = "sdist" },
    { path = "crates/medulla-program/**/*", format = "sdist" },
    { path = "crates/medulla-pyengine/**/*", format = "sdist" },
    { path = "crates/medulla-quantum-core/**/*", format = "sdist" },
    { path = "crates/medulla-quantum-gates/**/*", format = "sdist" },
    { path = "crates/medulla-quantum-hardware/**/*", format = "sdist" },
    { path = "crates/medulla-quantum-jobs/**/*", format = "sdist" },
    { path = "crates/medulla-quantum-sim/**/*", format = "sdist" },
    { path = "crates/medulla-quantum-workloads/**/*", format = "sdist" },
    { path = "crates/medulla-query/**/*", format = "sdist" },
    { path = "crates/medulla-rdf/**/*", format = "sdist" },
    { path = "crates/medulla-resource/**/*", format = "sdist" },
    { path = "crates/medulla-shacl/**/*", format = "sdist" },
    { path = "crates/medulla-shex/**/*", format = "sdist" },
    { path = "crates/medulla-sqlite-format/**/*", format = "sdist" },
    { path = "crates/medulla-statechart/**/*", format = "sdist" },
    { path = "crates/medulla-storage/**/*", format = "sdist" },
    { path = "crates/medulla-stream/**/*", format = "sdist" },
    { path = "crates/medulla-tensor/**/*", format = "sdist" },
    { path = "crates/medulla-text/**/*", format = "sdist" },
    { path = "crates/medulla-transaction/**/*", format = "sdist" },
    { path = "crates/medulla-tsdb/**/*", format = "sdist" },
    { path = "crates/medulla-tts-piper/**/*", format = "sdist" },
    { path = "crates/medulla-types/**/*", format = "sdist" },
    { path = "crates/medulla-video/**/*", format = "sdist" },
    { path = "crates/medulla-viz-columnstore/**/*", format = "sdist" },
    { path = "crates/medulla-viz-core/**/*", format = "sdist" },
    { path = "crates/medulla-viz-export/**/*", format = "sdist" },
    { path = "crates/medulla-viz-graph-tiles/**/*", format = "sdist" },
    { path = "crates/medulla-viz-kernels/**/*", format = "sdist" },
    { path = "crates/medulla-wasm/**/*", format = "sdist" },
    # The root manifest patches crates.io with these vendored RustSec repairs.
    # Cargo loads every patched manifest during the isolated sdist rebuild, even
    # when the selected feature set does not compile every patched crate.
    { path = "vendor/zstd-parent-patches/**/*", format = "sdist" },
    { path = "vendor/security-patches/**/*", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
