[build-system]
# Pure Python, no compiler: this distribution carries no code, so a plain
# setuptools backend builds it anywhere (see docs/development/pypi-tombstones.md).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
# A TOMBSTONE, not the server. `epistemic-graph-server` was renamed to
# `medulla-stem`; this distribution exists only so
# `pip install epistemic-graph-server` resolves to the current server package and
# says so. It ships no modules, no executable and no native code. The version is
# a fixed floor, deliberately NOT wired to `Cargo.toml`: it has to sort above the
# frozen 2.27.7 that still owns the name on PyPI, and nothing in the release
# pipeline bumps it.
name = "epistemic-graph-server"
version = "2.28.0"
description = "Renamed to medulla-stem — this is a tombstone. Install `medulla-stem`."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["medulla-stem>=2.27.9"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

# PEP 639 SPDX string. The server package's own manifest still uses the older
# `[project.license] text = "MIT"` table, which setuptools>=77 deprecates; a new
# package starts on the form that is not being removed.
license = "MIT"

[project.urls]
Homepage = "https://github.com/Knuckles-Team/medulla"
Documentation = "https://knuckles-team.github.io/medulla/"

[tool.setuptools]
# MUST stay empty. Any entry here would put code back in the tombstone and make
# a stale server package importable under the retired name, which is the bug
# this package exists to close.
packages = []
