[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "epistemic-graph-server"
version = "2.27.7"
description = "The native epistemic-graph-server executable, built from the epistemic-graph source at the same version"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/Knuckles-Team/epistemic-graph"
Documentation = "https://knuckles-team.github.io/epistemic-graph/"

# The package wraps the root manifest's `epistemic-graph-server` bin. The release
# workflow builds it with `maturin build --profile release-server` (maturin does not
# read the profile from this table in every release); `full,ast-extended` is the same
# feature set as the main build.
[tool.maturin]
bindings = "bin"
manifest-path = "../../Cargo.toml"
python-source = "."
module-name = "epistemic_graph_server"
features = ["full", "ast-extended"]
strip = true
include = [
# Cargo loads every path crate manifest (also those only unselected optional features
# reach), so the sdist carries each crate tree through the `crates` symlink (maturin
# rejects `..` in patterns). Checked against Cargo by tests/test_server_package.py.
    { path = "crates/eg-alignment/**/*", format = "sdist" },
    { path = "crates/eg-ann/**/*", format = "sdist" },
    { path = "crates/eg-asr-whisper/**/*", format = "sdist" },
    { path = "crates/eg-audio/**/*", format = "sdist" },
    { path = "crates/eg-capabilities/**/*", format = "sdist" },
    { path = "crates/eg-compute/**/*", format = "sdist" },
    { path = "crates/eg-core/**/*", format = "sdist" },
    { path = "crates/eg-document/**/*", format = "sdist" },
    { path = "crates/eg-durable/**/*", format = "sdist" },
    { path = "crates/eg-epistemic/**/*", format = "sdist" },
    { path = "crates/eg-geo/**/*", format = "sdist" },
    { path = "crates/eg-graphql/**/*", format = "sdist" },
    { path = "crates/eg-image/**/*", format = "sdist" },
    { path = "crates/eg-jobs/**/*", format = "sdist" },
    { path = "crates/eg-kvcache/**/*", format = "sdist" },
    { path = "crates/eg-lake/**/*", format = "sdist" },
    { path = "crates/eg-method-codec/**/*", format = "sdist" },
    { path = "crates/eg-modality/**/*", format = "sdist" },
    { path = "crates/eg-numeric/**/*", format = "sdist" },
    { path = "crates/eg-plan/**/*", format = "sdist" },
    { path = "crates/eg-program/**/*", format = "sdist" },
    { path = "crates/eg-pyengine/**/*", format = "sdist" },
    { path = "crates/eg-quantum-core/**/*", format = "sdist" },
    { path = "crates/eg-quantum-gates/**/*", format = "sdist" },
    { path = "crates/eg-quantum-hardware/**/*", format = "sdist" },
    { path = "crates/eg-quantum-jobs/**/*", format = "sdist" },
    { path = "crates/eg-quantum-sim/**/*", format = "sdist" },
    { path = "crates/eg-quantum-workloads/**/*", format = "sdist" },
    { path = "crates/eg-query/**/*", format = "sdist" },
    { path = "crates/eg-rdf/**/*", format = "sdist" },
    { path = "crates/eg-resource/**/*", format = "sdist" },
    { path = "crates/eg-shacl/**/*", format = "sdist" },
    { path = "crates/eg-shex/**/*", format = "sdist" },
    { path = "crates/eg-sqlite-format/**/*", format = "sdist" },
    { path = "crates/eg-statechart/**/*", format = "sdist" },
    { path = "crates/eg-storage/**/*", format = "sdist" },
    { path = "crates/eg-stream/**/*", format = "sdist" },
    { path = "crates/eg-tensor/**/*", format = "sdist" },
    { path = "crates/eg-text/**/*", format = "sdist" },
    { path = "crates/eg-transaction/**/*", format = "sdist" },
    { path = "crates/eg-tsdb/**/*", format = "sdist" },
    { path = "crates/eg-tts-piper/**/*", format = "sdist" },
    { path = "crates/eg-types/**/*", format = "sdist" },
    { path = "crates/eg-video/**/*", format = "sdist" },
    { path = "crates/eg-viz-columnstore/**/*", format = "sdist" },
    { path = "crates/eg-viz-core/**/*", format = "sdist" },
    { path = "crates/eg-viz-export/**/*", format = "sdist" },
    { path = "crates/eg-viz-graph-tiles/**/*", format = "sdist" },
    { path = "crates/eg-viz-kernels/**/*", format = "sdist" },
    { path = "crates/eg-wasm/**/*", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
