      policy: >-
        Raw scanner objects and severities are retained without mutation in the receipt. A direct,
        qualified std::fs call blocks only when it is inside an async function/block/closure and
        outside test and proven off-executor context. Only an absolute
        ::tokio::task::spawn_blocking path or correctly scoped import from that absolute path is
        trusted; a shadowable tokio:: path is not. Test cfg expressions are evaluated
        with test=false, so cfg(any(test, feature = "harness")) remains production-reachable;
        an arbitrary function named spawn_blocking never establishes off-executor execution. A
        method-name match never proves its receiver type and is reported receiver_unresolved.
        Scoped std::fs module/function/File aliases apply the same context rule, including legal
