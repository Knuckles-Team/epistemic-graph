  - decision_id: D-MEDULLA-007
    title: "RLS view-cache serves rows a revoked grant forbids"
    owning_component: medulla.graph-core
    affected_components: [medulla.server-dispatch, medulla.rdf-semantics, medulla.query-plan]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run
    severity: security

    verified_facts:
      - "crates/medulla-core/src/rls_view_cache.rs:66-70 -- `struct Inner { entries: HashMap<String,
         (u64, Arc<GraphView>)>, order: VecDeque<..>, generation: u64 }`. The key is the ACTOR
         STRING. The value carries a graph-content version. No policy, role, grant or identity
         digest appears anywhere in the key or the value."
      - "rls_view_cache.rs:110 `get(&self, actor: &str, current_version: u64)` returns a hit when
         `*version == current_version`. On a hit `rls.filter_view` is never called."
      - "rls_view_cache.rs:151 `invalidate_all()` bumps `generation` and clears. It is the only
         invalidation path."
      - "`GraphCore::invalidate_filtered_view_cache` is defined at crates/medulla-core/src/graph.rs:3610
         and called from exactly TWO sites, graph.rs:6183 and graph.rs:6253 -- both whole-image
         graph transitions."
      - "`grep -c invalidate_filtered_view_cache crates/medulla-core/src/isolation.rs` = 0. CONFIRMED
         on the current tree."
      - "Six live read sites, all confirmed at the cited lines: src/server/access.rs:301;
         src/server/handlers/rdf.rs:131, :162, :462; src/server/handlers/query.rs:5627, :5684."
    finding_understated_the_problem: >-
      The finding names three uninvalidating mutators (try_add_grant, try_remove_grant,
      try_register_agent). There are at least THIRTEEN, all in crates/medulla-core/src/isolation.rs
      and all with zero invalidation: try_add_role:1151, try_remove_role:1171, add_grant:1186,
      try_add_grant:1191, remove_grant:1299, try_remove_grant:1304,
      try_bootstrap_system_identity:1346 and :1373, register_agent:1392, try_register_agent:1400,
      try_register_agent_from_request:1437, unregister_agent:1456, try_unregister_agent:1460.
      This is the strongest possible argument against the "add invalidation calls" fix.

    decision: >-
      Key the cache on a policy epoch, exactly as the finding proposes. Do NOT fix it by adding
      invalidation calls to the mutators.
    rationale: >-
      An invalidation list is an ENUMERATION of call sites, and it goes stale the moment someone
      adds a fourteenth mutator -- silently, with no gate observing it, producing a security
      regression that looks like a performance optimisation. That is documented failure pattern
      5.3 in the medulla-development skill, and thirteen uninvalidating mutators is that
      pattern already realised. A key makes the staleness UNREPRESENTABLE: a permission change
      bumps the epoch, every prior entry becomes unreachable by construction, and a new mutator
      cannot forget because it does not have to remember. The cache's own doc already concedes
      the cost is acceptable -- a miss "costs exactly what every call cost before this cache
      existed."
    concrete_change:
      - "crates/medulla-core/src/isolation.rs: add a `policy_epoch: AtomicU64` to `IsolationLayer` and a
         `pub fn policy_epoch(&self) -> u64`. Bump it in EVERY mutator of the grant, role or
         agent-identity tables -- all thirteen listed above -- by routing them through one private
         `fn mutate_policy<R>(&mut self, f: impl FnOnce(&mut Self) -> R) -> R` that bumps on exit,
         so a fourteenth mutator cannot be written without it."
      - "crates/medulla-core/src/rls_view_cache.rs: change `entries` to
         `HashMap<(String, u64), (u64, Arc<GraphView>)>` keyed on (actor, policy_epoch); take
         `policy_epoch` in `get` and `put`; leave `generation` as-is (it closes the
         build-race, a different property)."
      - "crates/medulla-core/src/graph.rs: thread the epoch through `cached_filtered_view` /
         `put_cached_filtered_view` (used at graph.rs around :3610)."
      - "Update the six read sites (access.rs:301; rdf.rs:131/162/462; query.rs:5627/5684) to pass
         the epoch. They already fetch `filtered_view_cache_generation()` at the adjacent line, so
         the call shape is unchanged in structure."
      - "Add a test that a cached actor served a row, then a `try_remove_grant` for that row's
         scope, then a re-read, does NOT return the row. No such test exists today -- which is why
         this has stayed open."
    would_have_been_caught_by: >-
      No existing gate or test. `universal-read-rls-architecture` checks that a served read does
      not BYPASS row/carrier ownership isolation; a cache HIT is not structurally a bypass, so the
      gate is green while the property is violated. That is the coverage hole to close.
    acceptance_evidence: []

  - decision_id: D-MEDULLA-008
    title: "verify_replay_identity compares the whole batch, forcing callers to reconstruct request stamps"
    owning_component: medulla.mutation-store
    affected_components: [medulla.contracts, medulla.server-dispatch, medulla.persistence]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run

    verified_facts:
      - "crates/medulla-mutation-store/src/store/ledger.rs:177-190 --
         `verify_replay_identity(proposed: &MutationBatch, stored: &MutationBatch)` validates both
         write budgets then compares `encode_bounded(proposed) == encode_bounded(stored)`, i.e.
         WHOLE-STRUCT byte equality, and otherwise returns
         `IDEMPOTENCY_CONFLICT: key was already used by a different mutation`."
      - "Four call sites inside the crate: apply.rs:12, apply.rs:51, saga.rs:49, saga.rs:110.
         Re-exported at lib.rs:120."
      - "Compensation 1 (production): src/server/handlers/admin.rs:607-635. `admin_saga_request_stamp`
         reuses the ORIGINAL attempt's expected_graph_version / request_id / created_at_ms when a
         record already exists, and only a genuine first attempt reads live state. Its own doc
         says re-deriving them live 'makes a legitimate replay's freshly-compiled batch
         byte-diverge from the one already on record purely on this incidental metadata,
         spuriously failing closed with IDEMPOTENCY_CONFLICT even though the intended operation
         (domain/event/payload) is identical.'"
      - "Compensation 2 (independent): src/redb_store/development_lane.rs:6553-6570. Same fix,
         reached independently, and its comment says so verbatim: 'This mirrors the production fix
         in `handlers/admin.rs`. That the same correction is needed independently here is the
         evidence that the underlying validator is comparing more than identity.'"

    decision: >-
      The contract is wrong and moves. Idempotency identity is the caller's INTENDED OPERATION --
      scope identity, domain, the operation list and their payloads -- and excludes the request
      envelope (version_expectation, request_id, created_at_ms). Both compensations are then
      deleted, not generalised into a shared helper.
    rationale: >-
      Two independent call sites needing the same compensation is the definition of a contract
      pushing work onto its callers. And the compensation is not free: it makes every replay path
      read the stored record BEFORE it can build the batch it is about to compare, which inverts
      the natural order and is exactly the kind of subtlety a third caller will get wrong.
      Extracting a shared `request_stamp` helper would be the WRONG fix here -- per failure
      pattern 5.3 an extraction changes the set of call sites a control runs on, and this
      particular control (reuse the stored stamp) must run on replay paths and must NOT run on
      first attempts. Moving the comparison instead removes the need for the control entirely.
      The stored `version_expectation` must still be REUSED on replay (it is the OCC value the
      first attempt actually committed against) -- that is a separate assertion, not part of the
      identity comparison.
    concrete_change:
      - "crates/medulla-types/src/mutation_batch/: add
         `MutationBatch::operation_identity_digest(&self) -> [u8; 32]` covering scope identity,
         domain, and the ordered operation list with payloads; explicitly EXCLUDING
         version_expectation, request_id and created_at_ms. It belongs in medulla-types because both
         the store (crate A) and every producer (crate B) must agree on the set -- the
         crate-both-can-see rule from failure pattern 5.2."
      - "crates/medulla-mutation-store/src/store/ledger.rs:183-185: compare
         `proposed.operation_identity_digest() == stored.operation_identity_digest()`."
      - "Same function: add a SEPARATE, explicit check that the proposed batch's
         version_expectation equals the stored one, with its own distinct error message, so a
         caller that re-derived the OCC value gets told exactly that instead of a generic
         IDEMPOTENCY_CONFLICT."
      - "Delete src/server/handlers/admin.rs's `admin_saga_request_stamp` (:628+) and its callers'
         use of it; delete the equivalent block at src/redb_store/development_lane.rs:6553-6570."
      - "Add a store-level test: prepare a saga, then replay it with a DIFFERENT req_id and a
         later created_at_ms, and assert it REPLAYS rather than conflicting. No such test exists
         -- both compensations exist precisely because nothing at the store level covers this."
    acceptance_evidence: []
    path_currency_note: >-
      UPDATED 2026-09-13: `crates/medulla-mutation-store` no longer exists (see
      medulla.mutation-store.migration_lineage). `store/ledger.rs` ->
      `crates/medulla-transaction/src/ledger.rs` (verified rename), `store/apply.rs` ->
      `crates/medulla-transaction/src/commit.rs`, `store/saga.rs` ->
      `crates/medulla-transaction/src/saga.rs` (unchanged name). BUT `verify_replay_identity`
      itself is not merely relocated: it was DELETED
      before the crate rename even happened, by commit 064f2d04 ('make StorageKernelV1 the
      sole physical authority', 2026-09-06, confirmed an ancestor of this lane's HEAD via
      `git merge-base --is-ancestor`, and confirmed via `git show 064f2d04 -- '*ledger*'`
      showing the function's body cut from 91 lines to 9). `grep -rn
      verify_replay_identity` across the whole tree today finds it ONLY inside a comment
      in `src/redb_store/development_lane/test_fixture.rs:137` -- zero live call sites.
      SUBSTANTIVELY, this decision's finding and fix APPEAR ALREADY LANDED, verified by
      direct reading, not inference: `src/server/handlers/admin.rs:1301` now reads
      literally `// `admin_saga_request_stamp` is DELETED, not moved.`, with a comment
      explaining the replacement is `OperationReplayIdentity`, which 'structurally
      excludes' timestamp/request-id/OCC-expectation -- the exact shape this decision's
      `concrete_change` asked for (a differently-named type, not the literal
      `MutationBatch::operation_identity_digest()` method proposed, but the same
      contract). `src/redb_store/development_lane.rs` is now 181 lines (was 6553+ at the
      time of this finding) and no longer contains the second compensation site by that
      description -- it appears to have been removed in the same restructuring, not
      independently re-verified line-by-line. THIS PASS DOES NOT CHANGE `status`
      (`proposed`) or `evidence_status` (`not_run`) below: matching the SHAPE of the fix by
      reading source is not the same as running the store-level replay test this decision
      itself calls for and confirming no regression, which was not done here. Recorded so
      the next reader does not re-derive the same finding from scratch, not as a claim of
      acceptance.

  - decision_id: D-MEDULLA-009
    title: "The `security` feature is a second, unauthenticated architecture"
    owning_component: medulla.binary-composition
    co_owning_component: medulla.graph-core
    status: proposed
    decision_authority: operator
    decision_authority_reason: >-
      De-gating deletes the `--no-default-features` build shape as an authenticated-optional
      target. Whether that lean/Pi profile must survive as a supported artifact is a product
      decision about what this engine ships, not an architecture call I can make. I can say the
      negative arms are a security liability and that de-gating is the right shape; I cannot
      decide that the lean build stops being offered.
    evidence_status: measured_not_remediated

    verified_facts:
      - "`grep -rn 'cfg(feature = \"security\")' src/ crates/ --include=*.rs | wc -l` = 636."
      - "`grep -rn 'cfg(not(feature = \"security\"))' src/ crates/ --include=*.rs | wc -l` = 64.
         Both figures reproduce the earlier census exactly."
      - "Root Cargo.toml: `default = ['graph', 'algorithms', 'metrics', 'full']` and `full`
         contains 'security'. So the 64 negative arms are reachable ONLY via
         --no-default-features, and no shipped default build compiles them."
      - "crates/medulla-core/src/isolation.rs:1542-1545 -- under `#[cfg(not(feature = \"security\"))]`,
         `check_access` (declared :1508) matches graph_type and returns
         `GraphType::Commons => true` under the comment 'Bus: all authenticated agents have full
         access', with no identity resolution on that arm."
      - "`DurableCrypto::none()` appears at 224 sites across src/ and crates/."
      - "`security = ['redb', 'oidc', 'dep:chacha20poly1305', 'medulla-types/security',
         'medulla-core/security']` -- so de-gating also makes redb, oidc and chacha20poly1305
         unconditional, which is the part with real dependency-footprint consequences."

    decision: >-
      De-gate. `security` stops being a feature and becomes unconditional; the 64 negative arms
      are DELETED, not preserved behind a renamed flag. Sequenced LAST in the EG queue.
    rationale: >-
      636 positive arms is not a feature flag, it is a second implementation of the engine that
      nobody runs, nobody tests in CI, and that returns `true` from an access check. Its only
      justification is a lean build, and the lean build's savings are redb + oidc +
      chacha20poly1305 -- a footprint question that can be answered on its own terms without
      carrying an unauthenticated authorization path in the tree. Renaming the flag or inverting
      it (`insecure` opt-in) is worse than deleting: it keeps 700 conditional arms alive to
      preserve a build nobody ships.
    sequencing:
      position: last_in_the_eg_queue
      blocked_behind: [D-MEDULLA-001, D-MEDULLA-007, D-MEDULLA-008]
      reason: >-
        De-gating rewrites the same isolation.rs, mutation-store and server-dispatch call sites
        that D-MEDULLA-001, D-MEDULLA-007 and D-MEDULLA-008 each modify. Running it first would put a 700-arm
        mechanical rewrite underneath three semantic changes and make every merge conflict
        unreviewable -- the mechanical-merge failure mode this program has already paid for.
      also: >-
        Composing a 700-site change into a repository whose gate suite is already red hides the
        regressions the composition itself causes. Land the three semantic fixes and re-establish
        a per-hook baseline first.
    concrete_change:
      - "Prerequisite: measure the actual size/dependency delta of --no-default-features vs
         default, and get an operator ruling on whether that build shape is still shipped. If it
         is, this decision does not proceed as written."
      - "Delete all 64 `#[cfg(not(feature = \"security\"))]` arms, starting with
         crates/medulla-core/src/isolation.rs:1542-1545."
      - "Delete all 636 `#[cfg(feature = \"security\")]` attributes, making the guarded code
         unconditional."
      - "Remove `security` from root Cargo.toml `full`, from `medulla-types` and `medulla-core` feature
         lists, and make redb/oidc/chacha20poly1305 unconditional dependencies."
      - "Audit each of the 224 `DurableCrypto::none()` sites separately -- `None` on a security
         seam needs a named reason at the construction site (failure pattern 5.4's companion
         rule), and de-gating does not by itself fix them."
      - "Existing proposal: plans/refactor/evidence/proposals/MEDULLA-SECURITY-DEGATING-SLICE.md."
    acceptance_evidence: []

  - decision_id: D-MEDULLA-010
    title: "src/server/blob/store.rs still hand-rolls the four-constructor identity form"
    owning_component: medulla.server-dispatch
    co_owning_component: medulla.contracts
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run

    verified_facts:
      - "src/server/blob/store.rs:454 -- `fn ledger_bootstrap_identity()` calls
         `MutationScopeIdentity::native(TenantId::system(), MutationDomain::BlobStore,
         LogicalName::new(\"blob-ledger-root\")?, IncarnationId::new(COMPILED_BATCH_INCARNATION)?)`.
         The line number in the finding is EXACT."
      - "The collapsed helpers are used at exactly four sites, matching the A-1 record:
         crates/medulla-core/src/rbac_persist.rs:64 (fixed_native),
         crates/medulla-jobs/src/store.rs:2382 (fixed_native),
         crates/medulla-statechart/src/store.rs:738 (fixed_native),
         src/server/persistence/redb_backend.rs:1347 (fixed_graph)."
      - "crates/medulla-types/src/mutation_batch/model/identity.rs:228-240 --
         `fixed_native(tenant: &str, domain: MutationDomain, resource: &str, incarnation_id: &str)`
         forwards to `native(TenantId::new(tenant)?, domain, LogicalName::new(resource)?,
         IncarnationId::new(incarnation_id)?)`."

    decision: >-
      Migrate it. It is residue of the A-1 collapse, not a deliberate exception, and it is the
      last one.
    rationale: >-
      Failure pattern 5.6: a named reference implementation is a copy instruction, and eight
      near-identical scope-identity builders appeared because the pattern had no shared home.
      `fixed_native`/`fixed_graph` gave it one and collapsed seven of the eight. Leaving the
      eighth is how the pattern restarts -- the next lane greps for the shape, finds a hand-rolled
      one, and copies it.
    verified_caveat_for_the_migration: >-
      The migration is NOT purely mechanical and this must be checked before it is made.
      `TenantId::system()` (identity.rs:27) constructs `Self(RESERVED_SYSTEM_TENANT)` DIRECTLY,
      bypassing `validate_identifier`, whereas `fixed_native` routes its `&str` through
      `TenantId::new` which validates. VERIFIED that this is safe here:
      `RESERVED_SYSTEM_TENANT = "__eg_system__"` (identity.rs:13) contains no `.`, `..`, `/`,
      `\\` or `@`, so it passes `validate_identifier` (identity.rs:319-339) and the resulting
      TenantId is byte-identical. If the reserved literal ever changes to something with path or
      address shape, this migration silently starts failing closed at construction.
    concrete_change:
      - "src/server/blob/store.rs:454-464: replace the body of `ledger_bootstrap_identity` with
         `MutationScopeIdentity::fixed_native(
            medulla_types::mutation_batch::RESERVED_SYSTEM_TENANT,
            MutationDomain::BlobStore,
            \"blob-ledger-root\",
            crate::server::mutation_batch::COMPILED_BATCH_INCARNATION)`."
      - "Keep the existing 15-line doc comment above it verbatim -- it records WHY the incarnation
         reuses COMPILED_BATCH_INCARNATION rather than a store-local constant, and that reasoning
         is the thing most likely to be lost in a mechanical migration."
      - "Inspect the sibling `scope_identity` in the same file (immediately below :480) for the
         same shape before declaring the collapse complete."
      - "Consider adding `MutationScopeIdentity::fixed_system_native(domain, resource,
         incarnation)` so the reserved-tenant literal is not spelled at call sites at all -- but
         only if a SECOND system-tenant call site exists; one call site does not justify a helper."
    acceptance_evidence: []

