# ---------------------------------------------------------------------------
# NOTE ON SEPARATION (requested during this pass): a dev-time LAYER INVERSION and a
# dev-dependency CYCLE are different findings and are recorded in different lists.
#   * `declared_layer_violations` holds edges that point at a higher layer, cyclic or not.
#     LV-04 (eg-viz-core -(dev)-> eg-jobs) lives here: it is a Layer-0 leaf reaching a
#     storage-layer crate, and it is NOT a cycle.
#   * `dev_dependency_cycles` holds edges that close a loop. DC-01 (eg-modality against its
#     six modality crates) and DC-02 (eg-rdf <-> eg-shacl) live here.
# Conflating them was the original finding's error and it is not reproduced.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Declared layer violations. Every entry is an EDGE, so it belongs to a PAIR of
# components and is recorded here rather than under either one. This list is a
# reviewed, reasoned allowlist that must SHRINK -- it is not a ratchet and not a
# baseline: it hides no finding, grows only by a reviewed human edit with a stated
# reason, and D-EG-004's proposed gate fails when an entry stops matching reality.
# ---------------------------------------------------------------------------
declared_layer_violations:
  - edge_id: LV-01
    edge: "crates/eg-tsdb -> crates/eg-compute"
    from_component: eg.timeseries
    to_component: eg.compute
    kind: mandatory_normal_dependency
    verified_at: "crates/eg-tsdb/Cargo.toml:59"
    verified_text: 'eg-compute = { path = "../eg-compute", features = ["finance"] }'
    in_default_and_full_closure: true
    disposition: layer_assignment_is_wrong_not_the_edge
    decision_ref: D-EG-002

  - edge_id: LV-02
    edge: "crates/eg-kvcache -> crates/eg-compute"
    from_component: eg.kv-cache
    to_component: eg.compute
    kind: optional_feature_gated_dependency
    verified_at: "crates/eg-kvcache/Cargo.toml:37 (declaration), :63 (gate)"
    verified_text: 'eg-compute = { path = "../eg-compute", optional = true }   /   graph = ["dep:eg-compute"]'
    in_default_and_full_closure: false
    in_default_and_full_closure_evidence: >-
      The root package declares eg-kvcache optional (Cargo.toml:1646) and reaches it only
      through `kvcache-server = ["server", "oidc", "dep:eg-kvcache"]` (:1026) and
      `kvcache-compression = ["kvcache-server", "eg-kvcache/compression"]` (:1031). Neither
      enables `eg-kvcache/graph`. `full` lists kvcache-server and kvcache-compression but
      not the graph feature, so this edge is absent from every default and `full` build.
    disposition: not_a_violation_of_the_restated_rule
    decision_ref: D-EG-002

  - edge_id: LV-03
    edge: "crates/eg-tensor -> crates/eg-tsdb"
    from_component: eg.modality
    to_component: eg.timeseries
    kind: mandatory_normal_dependency
    verified_at: "crates/eg-tensor/Cargo.toml:24"
    verified_text: 'eg-tsdb = { path = "../eg-tsdb", default-features = false }'
    in_default_and_full_closure: true
    aggravating_fact: >-
      eg-tensor's edge to eg-modality is OPTIONAL (crates/eg-tensor/Cargo.toml:31, behind
      the `contract` feature) while its edge to eg-tsdb is MANDATORY. eg-tensor is
      therefore not a modality leaf that happens to reach upward; in a default build it is
      a crate whose only workspace dependency is a storage-layer crate.
    disposition: real_violation_invert_the_edge
    decision_ref: D-EG-002

  - edge_id: LV-04
    edge: "crates/eg-viz-core -(dev)-> crates/eg-jobs"
    from_component: eg.viz
    to_component: eg.job-plane
    kind: dev_dependency_only
    verified_at: "crates/eg-viz-core/Cargo.toml:58"
    is_a_cycle: false
    correction: >-
      The source finding calls this a dev-dependency CYCLE. It is not. eg-jobs does not
      depend on eg-viz-core -- eg-jobs' path dependencies are exactly eg-core,
      eg-mutation-store and eg-types. This edge is a one-way dev-time LAYER INVERSION (a
      zero-normal-dependency contract leaf reaching a storage-layer crate for a test), and
      the crate's own Cargo.toml documents it as deliberate: the edge is dev-only
      "precisely so the crate itself (and any default/normal build of it) never links
      eg-jobs, eg-types, eg-core, eg-mutation-store, or redb".
    disposition: permitted_by_the_restated_rule
    decision_ref: D-EG-003

dev_dependency_cycles:
  - cycle_id: DC-01
    crate: crates/eg-modality
    dev_depends_on: [eg-tensor, eg-geo, eg-document, eg-image, eg-audio, eg-video]
    is_a_cycle: true
    evidence: >-
      All six depend on eg-modality -- five directly, and eg-tensor through its optional
      `contract` feature which eg-modality's own dev-dependency turns on
      (`eg-tensor = { path = "../eg-tensor", features = ["contract"] }`). So each of the
      six edges closes a cycle. eg-modality's Cargo.toml states the intent verbatim:
      the crate "EXPLICITLY permits cycles through dev-dependencies".
    components: [eg.modality]
    decision_ref: D-EG-003

  - cycle_id: DC-02
    crate: crates/eg-rdf
    dev_depends_on: [eg-shacl]
    is_a_cycle: true
    evidence: >-
      eg-shacl's normal dependency is eg-rdf (crates/eg-shacl/Cargo.toml:31,
      `features = ["rdf"]`), and eg-rdf dev-depends on eg-shacl for the ICV integration
      test (CONCEPT:EG-146). NOT NAMED in the source finding, and NOT in the corrected list that
      reached this lane during the pass (which states eg-modality's is "the only genuine dev-dep
      cycle"). It is genuine: crates/eg-shacl/Cargo.toml:31 declares
      `eg-rdf = { path = "../eg-rdf", features = ["rdf"] }` as a NORMAL dependency, and
      crates/eg-rdf/Cargo.toml's [dev-dependencies] declares `eg-shacl = { path = "../eg-shacl" }`.
      eg-rdf's own comment concedes it: "using it as a DEV-dependency here is a dev-dep cycle,
      which Cargo permits". Found by enumerating the dev path deps of all 48 crates rather than
      checking the two that were named. Retained over the correction, with the evidence above.
    components: [eg.rdf-semantics]
    decision_ref: D-EG-003

  - cycle_id: DC-03
    crate: crates/eg-quantum-hardware
    dev_depends_on: [eg-quantum-core]
    is_a_cycle: false
    evidence: >-
      eg-quantum-core is already a NORMAL dependency of eg-quantum-hardware, so the dev
      entry is redundant rather than cyclic. Recorded only so the census is complete.
    components: [eg.quantum]
    decision_ref: D-EG-003

# ---------------------------------------------------------------------------
# Wiring decisions. One per open architectural finding.
#
# `decision_authority` says who the call belongs to:
#   component_owner -- the owning component can decide and implement it.
#   operator        -- it changes a product-visible contract, a supported build shape,
#                      or the release queue, and I should not decide it.
# Every decision is `status: proposed` regardless; no operator has signed off.
# ---------------------------------------------------------------------------
wiring_decisions:

  - decision_id: D-EG-001
    title: "MutationStore::database() is public and the write() revalidation is bypassed"
    owning_component: eg.mutation-store
    affected_components: [eg.server-dispatch, eg.job-plane, eg.timeseries, eg.graph-core, eg.persistence]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run

    verified_facts:
      - "`pub fn database(&self) -> &Database` is at crates/eg-mutation-store/src/store/identity.rs:142.
         The finding says :144. STALE BY TWO LINES."
      - "`pub fn write(&self) -> Result<MutationWrite, String>` is at identity.rs:150 and its FIRST
         statement is `self.validate_physical_root()?`. A raw `database().begin_write()` skips that
         and the handle revalidation. The security delta is real and is exactly as described."
      - "A second, already-narrow accessor exists: `pub(crate) fn database(&self) -> &ReadOnlyDatabase`
         at identity.rs:220. The read side is therefore already solved; only the write side is open."
      - "`.database()` appears at 71 sites across src/ and crates/ (including doc comments and tests)."
    corrected_census:
      method: >-
        Every line containing `.database()` whose next three lines contain `begin_write`, over
        src/ and crates/, at HEAD 1d83cf4b.
      production_begin_write_bypasses_outside_the_owning_crate: 17
      finding_originally_claimed: 12
      note_on_the_18th: >-
        A single further production `.database().begin_write()` exists at
        crates/eg-mutation-store/src/store/recovery.rs:131. It is INSIDE the owning crate and is
        therefore not a bypass of the store's own API; it is excluded from the 17. Counted
        together the figure is 18, which is why both numbers appear in earlier notes.
      breakdown:
        - "src/server/kv.rs:193, :218, :328 (3) -- owner eg.server-dispatch"
        - "src/server/blob/store.rs:570, :643, :699, :1315 (4) -- owner eg.server-dispatch"
        - "crates/eg-jobs/src/store.rs:1241, :1297, :1362 (3) -- owner eg.job-plane"
        - "crates/eg-statechart/src/store.rs:267 (1) -- owner eg.job-plane"
        - "crates/eg-tsdb/src/store.rs:562, :582, :774, :812, :934, :977 (6) -- owner eg.timeseries"
      re_measurement_finding: >-
        THE CHOKEPOINT BYPASS GOT WIDER WHEN RE-MEASURED, and by whom matters. eg-tsdb (6) and
        eg-statechart (1) account for 7 of the 17 and were absent from the original finding.
        Those are precisely the stores that were RESTRUCTURED to own a `MutationStore` rather
        than a bare `Database` -- they should be the best-behaved consumers of the contract, and
        instead they are its largest single bypasser. That is the strongest argument for closing
        the accessor: a migration whose stated purpose was "every consumer holds a store + an
        identity, never a bare Database" reproduced the bare-Database call shape through a public
        accessor, and nothing observed it. Leaving `database()` public means the next store to be
        migrated will do the same.
      test_only_sites_excluded:
        - "crates/eg-core/src/rbac_persist.rs:763"
        - "crates/eg-tsdb/src/store.rs:1390"
        - "crates/eg-mutation-store/src/store/tests.rs:196"
      corrections_to_the_finding:
        - "eg-tsdb was MISSED entirely and is the single largest bypasser (6 of the 17 external sites)."
        - "eg-statechart was MISSED (1 site)."
        - "`crates/eg-jobs/src/store.rs:416` is correctly EXCLUDED from the 17 -- it is
           `initialize_scheduler_indexes(mutation_store.database())`, which is a call, not a
           transaction mint. PARTIAL DISAGREEMENT with the correction that reached this lane,
           which describes :416 as 'a read': it is not. VERIFIED at
           crates/eg-jobs/src/store.rs:1485-1486 --
           `fn initialize_scheduler_indexes(db: &Database) -> Result<u64> { let wtx =
           db.begin_write().map_err(redb_err)?; ... }`. So the raw `&Database` handed out at :416
           is used to mint a WRITE transaction one frame away at :1486. It is not a 17th
           direct-mint site, but it IS a transitive bypass and the accessor narrowing in
           `concrete_change` must cover it (the parameter type becomes the revalidating
           accessor's output, not `&Database`). Recorded rather than silently dropped, because
           dropping it would leave a live bypass with no owner."
        - "src/server/blob/store.rs has TWELVE `.database()` sites (570, 612, 643, 662, 685, 699, 713,
           724, 968, 1243, 1294, 1315), not 14. Four of the twelve reach begin_write; the other eight
           are begin_read."
        - "src/server/kv.rs:1071 and :164, :258 are begin_READ, correctly excluded from the write census."

    decision: >-
      `database()` becomes `pub(crate)`, AND the bypass sites are NOT migrated to `write()`.
      Both halves of the finding's either/or are wrong on their own; the answer is a third
      option, a narrow write accessor that keeps the revalidation.
    rationale: >-
      Migrating the 17 external sites to `MutationStore::write()` would be incorrect. Every one
      of eg-jobs, eg-statechart, eg-tsdb, eg-core::rbac_persist and src/server/blob/store.rs
      documents in its own source that its AUTHORITATIVE table lives beside the ledger in the
      SAME physical redb file and is deliberately opened off the raw `Database`
      (e.g. crates/eg-jobs/src/store.rs:368-372, crates/eg-core/src/rbac_persist.rs:130,
      crates/eg-statechart/src/store.rs:206). `write()` returns a `MutationWrite` bound to a
      ledger batch; these writes are not ledger batches. What the bypass sites actually skip is
      only the two revalidations -- so the fix is an accessor that keeps the revalidation and
      drops the batch requirement, not a call-shape migration. Leaving `database()` public and
      "just being careful" is the option this repository has already disproved: a public raw
      handle is a second construction route to the same authority, which is the exact
      anti-pattern the `mint-lease-call-sites` gate exists to prevent for leases.
    concrete_change:
      - "crates/eg-mutation-store/src/store/identity.rs: change `pub fn database` (:142) to
         `pub(crate) fn database`."
      - "crates/eg-mutation-store/src/store/identity.rs: add
         `pub fn owner_write(&self) -> Result<redb::WriteTransaction, String>` which runs the
         SAME `validate_physical_root()` + handle revalidation as `write()` (:150) and then
         returns a bare `WriteTransaction` for the store owner's own non-ledger tables."
      - "crates/eg-mutation-store/src/store/identity.rs: add the matching
         `pub fn owner_read(&self) -> Result<redb::ReadTransaction, String>` so the 40-odd
         `.database().begin_read()` sites get the same treatment rather than a second exception."
      - "Migrate the 17 external write sites listed in `corrected_census.breakdown` to
         `owner_write()`, and the external read sites to `owner_read()`."
      - "src/server/kv.rs:193, :218, :328 are the only three sites with NO separate-table reason --
         they are plain KV mutations. Migrate those to `MutationStore::write()` proper, not to
         `owner_write()`."
      - "Cover the TRANSITIVE site too: `initialize_scheduler_indexes` takes `db: &Database`
         (crates/eg-jobs/src/store.rs:1485) and mints a write at :1486 from the handle passed at
         :416. Change its parameter to the revalidating accessor's output rather than
         `&Database`, so narrowing `database()` to pub(crate) does not simply push the raw handle
         one frame down. Grep for other `fn f(db: &Database)` signatures in the same pass."
      - "Add a pre-commit check (owner: eg.binary-composition) that `\\.database()` does not appear
         outside crates/eg-mutation-store, so the narrowing cannot silently regress. Make it also
         reject `&redb::Database` in a function signature outside that crate -- otherwise the
         accessor is narrowed and the raw handle keeps travelling by parameter."
    acceptance_evidence: []
    would_have_been_caught_by: >-
      NOTHING in the current gate suite. `persisted-mutation-contract` checks the method/projection
      persistence inventory, not the transaction-minting route. This is a coverage hole, not a
      failing gate.

  - decision_id: D-EG-002
    title: "Crate-DAG layer violations: eg-tsdb -> eg-compute, eg-kvcache -> eg-compute, eg-tensor -> eg-tsdb"
    owning_component: eg.binary-composition
    affected_components: [eg.timeseries, eg.compute, eg.kv-cache, eg.modality]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run
    edges_ref: [LV-01, LV-02, LV-03]

    decision: >-
      Split verdict, one per edge, plus a mandatory restatement of the rule itself.
      (a) LV-01 eg-tsdb -> eg-compute: the LAYER ASSIGNMENT is wrong, not the edge. eg-tsdb is not
          a layer-4 storage crate; it is a query/reasoning-layer store. Reassign it.
      (b) LV-02 eg-kvcache -> eg-compute: not a violation of the rule as it must be restated. The
          edge is optional, off by default, and outside the default+`full` feature closure.
          Qualify the rule to bind on a FEATURE CLOSURE, not on the union of all declarations.
      (c) LV-03 eg-tensor -> eg-tsdb: a real violation. Invert it.
      (d) The rule as written ("only crates to its left") is itself wrong and must be restated to
          permit same-layer acyclic edges.
    rationale:
      a: >-
        crates/eg-tsdb/Cargo.toml:56-57 states the position outright: "Depending on both puts
        eg-tsdb ABOVE eg-compute in the DAG -- parallel to where eg-query sits." The edge is
        mandatory, carries `features = ["finance"]`, and exists to REUSE the ewma_signal /
        rolling_zscore kernels rather than copy them -- which is precisely the anti-sprawl
        behaviour this repository wants. Duplicating those kernels into eg-tsdb to satisfy a
        layer label would be strictly worse. In this manifest eg.timeseries stays under the
        `storage-transaction` target layer because that is what it IS to a consumer, and the
        violation is DECLARED (LV-01) rather than papered over; the crate-DAG tier and the
        target-layer matrix are two different models and this is where they disagree.
      b: >-
        A rule that binds on every declared dependency regardless of feature gating cannot
        distinguish "this ships" from "this exists behind an off-by-default flag". Since the
        repository ships exactly one main build (`default == full`), the enforceable statement is
        about that closure. Recording LV-02 keeps the edge visible without making a
        never-shipped code path block the gate.
      c: >-
        This one has no defence. eg-tensor's eg-modality edge is OPTIONAL and its eg-tsdb edge is
        MANDATORY, so in a default build eg-tensor is a crate whose only workspace dependency is
        a storage crate -- it is not a modality leaf at all. The eg-tsdb Cargo comment claims
        "eg-tsdb does NOT depend on eg-tensor, so there is no cycle", which is true and beside the
        point: acyclicity is not layer conformance.
      d: >-
        The rule as written forbids at least ten legitimate same-layer edges (see
        `layer_model.rule_as_it_must_be_restated`). A rule that the tree violates a dozen times
        for good reasons is not a rule anyone can gate on.
    concrete_change:
      - "(a) Move eg-tsdb's crate-DAG tier from the storage tier to the query/reasoning tier in
         plans/refactor/DESIGN.md's 'EG target crate graph' and in the
         epistemic-graph-development skill's Layer 4 table. No code change. LV-01 is then closed
         by correcting the model, and D-EG-004's gate must read the corrected model."
      - "(b) State the rule as binding over the `default`+`full` feature closure. LV-02 stays
         declared with `in_default_and_full_closure: false`; D-EG-004's gate resolves features
         before evaluating edges and does not fail on it."
      - "(c) Extract the shared time-grid primitive eg-tensor consumes -- the common grid and the
         EG-067 tumbling windows named at crates/eg-tensor/Cargo.toml:20-23 -- out of eg-tsdb into
         a crate BELOW both (eg-types is the crate both can already see; a new
         `eg-time-grid` leaf is the alternative if the primitive is too heavy for eg-types).
         Then delete `eg-tsdb = { path = \"../eg-tsdb\" }` from crates/eg-tensor/Cargo.toml:24 and
         make eg-tensor's eg-modality dependency NON-optional, restoring it to an actual modality
         leaf. This is the only one of the three that costs real work."
      - "(d) Replace the rule text in plans/refactor/DESIGN.md and in the skill with:
         'A crate's [dependencies] and [build-dependencies] may name only crates in a strictly
         lower layer, or in the same layer provided the graph stays acyclic. [dev-dependencies]
         are out of scope (see D-EG-003). Evaluation is over the default+full feature closure.'"
    acceptance_evidence: []

  - decision_id: D-EG-003
    title: "[dev-dependencies] cycles exist and build fine"
    owning_component: eg.binary-composition
    affected_components: [eg.modality, eg.rdf-semantics, eg.viz, eg.quantum]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run
    cycles_ref: [DC-01, DC-02, DC-03]
    edges_ref: [LV-04]

    decision: >-
      Dev edges are EXPLICITLY OUT of the DAG rule, and are permitted upward. They are not
      inverted. The rule text must say so rather than leaving it implied.
    rationale: >-
      Why it is safe, mechanically rather than by assertion:
        1. `[dev-dependencies]` are compiled ONLY for the owning crate's own test, bench and
           example targets. They are not in the dependency graph of `cargo build`,
           `cargo check`, or the crate's `lib` target, so no consumer of eg-modality ever links
           eg-audio through it, and no shipped binary contains a dev edge.
        2. They therefore cannot create a link-time or runtime cycle. The cycle exists only in
           the metadata of a test build, which Cargo resolves by building the crate's lib once
           without dev-deps and then building the test target against it.
        3. Under edition 2021 (root Cargo.toml:90), the v2 feature resolver is in effect, so
           dev-dependency features do NOT unify into the normal build graph. This is the one
           mechanism that could have made a dev edge change a shipped artifact, and it is off.
           If this workspace ever moves to a resolver where dev features unify, this decision
           must be re-taken.
      Inverting them would cost real architecture for no safety: the eg-modality cycle exists so
      the ModalityContract TCK (`tests/fleet_tck.rs`) can run the CONTRACT against its six real
      implementations. Inverting it means either duplicating six pilot implementations inside
      eg-modality, or moving the TCK up into a seventh crate that depends on all seven -- both
      strictly worse than a dev edge that never ships.
    boundary_condition: >-
      The permission is not unlimited. A dev edge must not (i) enable a feature on the
      dev-depended crate that the normal build also enables differently, nor (ii) be the only
      thing keeping a crate in the workspace. Both are checkable; neither is checked today.
    concrete_change:
      - "Restate the rule (same edit as D-EG-002(d)): '[dev-dependencies] are out of scope. A dev
         edge may point upward or close a cycle.' with the three-point mechanical justification
         above recorded alongside it, not just the conclusion."
      - "D-EG-004's gate parses `[dependencies]` and `[build-dependencies]` only, and must SAY so
         in its own failure message so a future reader does not assume dev edges were checked."
      - "Add to that gate a check that no dev edge enables a feature on its target that the
         normal build graph does not also enable -- the one mechanical hazard the exemption
         leaves open."
      - "Fix the source finding's record: eg-viz-core -> eg-jobs (LV-04) is NOT a cycle, and
         eg-rdf -> eg-shacl (DC-02) IS one and was missing."
    acceptance_evidence: []

  - decision_id: D-EG-004
    title: "Nothing enforces the crate DAG"
    owning_component: eg.binary-composition
    affected_components: [eg.embedded-bindings]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run

    verified_facts:
      - "`arch-lint list-rules` (arch-lint 0.5.0) reports EIGHT rules: AL001 no-unwrap-expect,
         AL002 no-sync-io, AL003 no-error-swallowing, AL013 no-silent-result-drop,
         AL004 handler-complexity, AL005 require-thiserror, AL006 require-tracing,
         AL007 tracing-env-init. NONE is a dependency-direction rule. The finding is correct."
      - "arch-lint.toml's own comment says 'Keep arch-lint focused on dependency direction until
         that debt is deliberately reduced'. That comment is FACTUALLY WRONG -- arch-lint has no
         dependency-direction rule to be focused on. It should be corrected in the same change."
      - "The dependency-cruiser hook's entry is
         `depcruise --validate --config clients/js/.dependency-cruiser.cjs clients/js/index.mjs`
         (.pre-commit-config.yaml:277). It validates the JS client only, and it CANNOT PASS in a
         clean checkout: node_modules is uncommitted and the hook runs no `npm ci`."
      - "Cargo's guarantee is real but narrow: VERIFIED that no crates/*/Cargo.toml declares
         `epistemic-graph`, so no crate depends back on the root facade. That is acyclicity, not
         direction -- LV-01 and LV-03 are acyclic upward edges that build fine."

    decision: >-
      A gate IS required, owned by eg.binary-composition, and it must read its layer model from
      THIS manifest rather than from a second hand-maintained table.
    rationale: >-
      The property the program believes is held is 'no storage or query crate imports server
      dispatch'. Cargo does hold exactly that one, for free, and no gate can hold it better. But
      the property anyone actually reasons with is the six-layer direction, and Cargo holds none
      of it -- proven by LV-01 and LV-03 building green. Adding a gate that re-derives its own
      layer table would create a second ownership authority, which the registry's consolidation
      rule forbids; reading `owned_crates` + `parent_layer` out of this file keeps one authority
      and makes the manifest load-bearing instead of decorative.
    concrete_change:
      - "Add scripts/check_crate_layer_direction.py: load architecture/component-registry.yml;
         build crate -> component -> parent_layer from `owned_crates`; parse every
         crates/*/Cargo.toml `[dependencies]` and `[build-dependencies]` path dep; resolve the
         default+full feature closure; fail on any edge to a strictly-higher layer that is not
         listed in `declared_layer_violations` with a live `decision_ref`. Ignore
         `[dev-dependencies]` and say so in the failure message (D-EG-003)."
      - "Also fail when a `declared_layer_violations` entry no longer matches the tree -- a
         declared entry that stops being true is a failure, exactly as .repo-layout.toml treats a
         declared root that stops being tracked. This is what keeps the list from becoming a
         ratchet."
      - "Also fail when a crate in Cargo.toml [workspace] members is owned by no component, or by
         more than one -- the exclusive-root property the layout contract requires."
      - "Add the `crate-layer-direction` hook to .pre-commit-config.yaml, language: system,
         pass_filenames: false, always_run: true."
      - "Correct the misleading comment in arch-lint.toml."
      - "Separately: the dependency-cruiser hook is a gate that cannot pass. Either add an
         `npm ci --prefix clients/js` step or remove the hook. A hook that always errors is
         indistinguishable from one that is enforcing nothing (owner: eg.embedded-bindings)."
    acceptance_evidence: []

  - decision_id: D-EG-005
    title: "AL002 no-sync-io: 690 raw candidates, provisional 12 async blockers"
    owning_component: eg.binary-composition
    affected_components: all_with_owned_errors_above_zero
    status: proposed
    decision_authority: operator
    decision_authority_reason: >-
      The 690 raw findings must remain visible, but arch-lint 0.5.0 does not prove async
      reachability or method receiver types. The release gate therefore needs a reviewed,
      fail-closed context policy rather than either treating all candidates as defects or
      lowering their severity.
    evidence_status: raw_measured_classifier_provisional_until_post_land_receipt

    measurement:
      command: "arch-lint check --format json"
      tool_version: "arch-lint 0.5.0"
      head: 5523859a32ee7320cee49503359e31a725a471d0
      measured_on: '2026-09-04'
      files_checked: 942
      total_violations: 3499
      by_rule:
        AL013_no_silent_result_drop_warning: 2699
        AL002_no_sync_io_error: 690
        AL003_no_error_swallowing_warning: 58
        AL005_require_thiserror_warning: 52
      note: >-
        This is the exact clean-source census from the named head and report identity. It used
        the pre-change policy's broad fixtures exclusion, hence 942 files; the truthful tracked
        Rust universe is 943 files. Therefore 690 is an exact pre-policy raw census, while every
        classifier count below is provisional until the landed wrapper produces and freezes a
        new 943-file receipt with source, policy, and tool identities. This registry does not
        present a replay of the stale 942-file report as post-change gate evidence. AL001
        contributes zero because it is explicitly disabled; the other seven were selected by
        arch-lint's recommended default, not by `preset = "minimal"` (the CLI ignores preset for
        rule selection).

    context_classification:
      classifier: scripts/check_rust_arch_lint.py
      status: provisional_replay_not_a_post_change_receipt
      required_receipt_files: 943
      raw_candidates_retained: 690
      async_direct_blocking: 12
      async_alias_blocking: 0
      receiver_unresolved_not_proven: 76
      synchronous_context: 150
      test_bench_example_or_cfg_test_context: 452
      spawn_blocking_context: 0
      supplemental_std_fs_alias_candidates: 31
      supplemental_aliases_blocking: 0
      policy: >-
        Raw scanner objects and severities are retained without mutation in the receipt. A direct,
        qualified std::fs call blocks only when it is inside an async function/block/closure and
        outside test and proven off-executor context. Only an absolute
        ::tokio::task::spawn_blocking path or correctly scoped import from that absolute path is
        trusted; a shadowable tokio:: path is not. Test cfg expressions are evaluated
        with test=false, so cfg(any(test, feature = "harness")) remains production-reachable;
        an arbitrary function named spawn_blocking never establishes off-executor execution. A
        method-name match never proves its receiver type and is reported receiver_unresolved.
        Scoped std::fs module/function/File aliases apply the same context rule, including legal
        use-declaration scope before textual declaration. Source/report count or path mismatch,
        code/rule/severity mismatch, or post-scan tool/source/policy drift is a cannot-run error,
        not green.

    ownership_assignment:
      total: 690
      unassigned: 0
      by_component:
        eg.persistence: 285
        eg.server-dispatch: 120
        eg.cluster-replication: 90
        eg.binary-composition: 41
        eg.observability: 25
        eg.graph-core: 23
        eg.epistemic: 21
        eg.query-plan: 17
        eg.speech-providers: 16
        eg.contracts: 13
        eg.embedded-bindings: 11
        eg.timeseries: 5
        eg.mutation-store: 4
        eg.viz: 6
        eg.job-plane: 2
        eg.numeric-ann: 2
        eg.rdf-semantics: 2
        eg.lake-interop: 2
        eg.compute: 4
        eg.modality: 1
      heaviest_files:
        - "src/server/persistence/redb_backend.rs (97) -- eg.persistence"
        - "src/redb_store.rs (49) -- eg.persistence"
        - "src/server/persistence/shard_migrate.rs (40) -- eg.persistence"
        - "src/server/persistence/backup.rs (37) -- eg.persistence"
        - "src/raft/tests.rs (37) -- eg.cluster-replication"
        - "src/raft/xshard_harness.rs (21) -- eg.cluster-replication"
        - "src/server/reasoning_projection.rs (21) -- eg.epistemic (counted under its owner)"
        - "src/server/handlers/admin.rs (19) -- eg.server-dispatch"
        - "src/server/handlers/sqlite_file.rs (18) -- eg.server-dispatch"
      note_on_eg_binary_composition: >-
        41 = 37 in tests/, benches/ and examples/ plus 4 in src/lib.rs, src/main.rs,
        src/test_support.rs and src/bin/. The 37 in test and bench harnesses are the cheapest
        to clear and are NOT production defects; they should be separated from the production
        set before anyone quotes a burndown number.

    decision: >-
      Preserve 690 as the pre-policy raw candidate census; do not mass-rewrite it. A provisional
      replay identifies async lexical context for 12 direct calls. The landed 943-file receipt
      must confirm that set before it becomes the first product-code refactor batch, grouped by
      owning component and followed by any alias calls that become proven blockers. The correct
      fix per proven site is one of exactly two, decided per call site rather than blanket-applied:
        (i)   the path IS reachable from the async runtime -> use the tokio::fs equivalent;
        (ii)  the path is genuinely blocking and belongs off the reactor ->
              tokio::task::spawn_blocking, with the blocking call moved inside;
      Synchronous, test, and already-offloaded contexts remain reported candidates rather than
      being rewritten. Unresolved receivers require semantic proof before remediation.
    rationale: >-
      arch-lint's AL002 is a syntactic rule: its 0.5.0 implementation never tracks async
      context, matches method names without resolving their receivers, and misses std::fs
      aliases. Treating 690 as blocking is therefore factually wrong; suppressing or lowering
      AL002 would also be wrong. The wrapper makes that uncertainty visible and supplies the
      missing conservative evidence boundary without a baseline, severity downgrade, or source
      exclusion.
    concrete_change:
      - "Land the explicit rule policy, wrapper, and known-good/known-bad scanner fixtures after
         independent adversarial review."
      - "Publish the post-land receipt outside the repository. It must retain all raw findings,
         bind the scanner binary/policy/source-universe identities, and fail on the proven set."
      - "Use scripts/check_rust_arch_lint.py in both the local hook and blocking scanner-quality
         workflow. The release workflow is also changed by the accepted capabilities/toolchain
         composition, so integration must preserve those disjoint hunks and re-review the
         combined workflow bytes."
      - "After the post-land receipt confirms the blocker set, refactor it as the smallest
         owner-scoped vertical slices; re-run this classifier after each slice and never decrement
         counts by hand."
      - "Each component's `al002_no_sync_io.owned_errors` in this manifest is the per-owner
         RAW denominator. It must be re-measured, not decremented by hand, after each slice."
    acceptance_evidence:
      - "python3 -m pytest tests/test_arch_lint_policy.py -q: 36 passed on 2026-09-04"
      - "The four isolated overlapping-file composition assertions in
         tests/test_scanner_distribution.py passed on 2026-09-04; the complete file requires the
         accepted toolchain lane's co-landed .python-version, scanner contract, advisory wrapper,
         root-hygiene, and CI-replica bytes."
      - "Known-good and known-bad fixtures execute the installed arch-lint 0.5.0 binary and cover
         direct and aliased async calls, Rust 1.96 async closures, async unsafe functions, nested
         grouped imports, shadowable tokio paths, delimiter-rich async signatures, and raw strings
         with more than sixteen hashes."

  - decision_id: D-EG-006
    title: "arch-lint.toml excludes **/target/** but the build writes to target-isolated/"
    owning_component: eg.binary-composition
    status: proposed
    decision_authority: component_owner
    evidence_status: implemented_focused_tests_passed_not_landed

    verified_facts:
      - "At base 5523859a arch-lint.toml `exclude` was:
         [\"**/target/**\", \"**/generated/**\", \"**/vendor/**\", \"**/third_party/**\",
          \"**/fixtures/**\"]. `target-isolated` matches none of them."
      - ".cargo/config.toml sets `[build] target-dir = \"target-isolated\"` as this repository's
         committed default (a RELATIVE path, so every worktree gets its own)."
      - "Both target-isolated/ and target-*/ ARE listed in .gitignore (lines 79-81 and 122-123),
         and arch-lint.toml sets `respect_gitignore = true`. The gitignore route therefore
         SHOULD have covered this and does not. Either arch-lint 0.5.0's respect_gitignore does
         not apply to the excluded-path walk, or `exclude` is evaluated as the whole filter.
         Observed behaviour is what counts: build artifacts are being linted."
      - "Measured impact at HEAD: 1,144 of 4,642 violations are in build artifacts --
         target-isolated/ (858) and target-wd9recon/ (286). That confirms the ~1,144 figure."

    correction_to_the_finding: >-
      IMPORTANT AND NEW. All 1,144 build-artifact findings are AL013 WARNINGS. ZERO of them are
      AL002 errors. Fixing the exclude removes 25% of the total finding COUNT and 0% of the
      BLOCKING set -- the gate stays red at exactly 687 errors afterwards. The 2026-09-03 report
      says "Fixing the exclude is the first move; it is a quarter of the backlog and none of it
      is real debt", which is true about the count and misleading about the blocker. The
      historical source-tree total after that fix was 3,498 findings, still 687 raw AL002
      errors. At head 5523859a the exact clean-source census is now 3,499 / 690.
    decision: >-
      The current slice keeps exactly `**/target/**` and `**/target-*/**`. It also removes the
      broad generated/vendor/third_party/fixtures source exclusions: tracked Rust is source and
      remains in the truthful denominator. This changes the expected post-land file universe
      from 942 to 943 but does not lower or baseline the 690 raw AL002 candidates.
    concrete_change:
      - "arch-lint.toml: extend `exclude` with \"**/target-*/**\" (which covers target-isolated,
         target-wd9recon and every future per-worktree dir named by the .gitignore convention)."
      - "Do NOT rely on `respect_gitignore = true`; it demonstrably did not exclude these paths.
         File that upstream against arch-lint 0.5.0 with this reproduction."
      - "Re-measure after landing and publish the source-universe digest, raw counts, and
         context dispositions. No baseline."
    acceptance_evidence:
      - "tests/test_arch_lint_policy.py asserts the exact two build-output exclusions and rejects
         implicit presets or broad source exclusions."

  - decision_id: D-EG-007
    title: "RLS view-cache serves rows a revoked grant forbids"
    owning_component: eg.graph-core
    affected_components: [eg.server-dispatch, eg.rdf-semantics, eg.query-plan]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run
    severity: security

    verified_facts:
      - "crates/eg-core/src/rls_view_cache.rs:66-70 -- `struct Inner { entries: HashMap<String,
         (u64, Arc<GraphView>)>, order: VecDeque<..>, generation: u64 }`. The key is the ACTOR
         STRING. The value carries a graph-content version. No policy, role, grant or identity
         digest appears anywhere in the key or the value."
      - "rls_view_cache.rs:110 `get(&self, actor: &str, current_version: u64)` returns a hit when
         `*version == current_version`. On a hit `rls.filter_view` is never called."
      - "rls_view_cache.rs:151 `invalidate_all()` bumps `generation` and clears. It is the only
         invalidation path."
      - "`GraphCore::invalidate_filtered_view_cache` is defined at crates/eg-core/src/graph.rs:3610
         and called from exactly TWO sites, graph.rs:6183 and graph.rs:6253 -- both whole-image
         graph transitions."
      - "`grep -c invalidate_filtered_view_cache crates/eg-core/src/isolation.rs` = 0. CONFIRMED
         on the current tree."
      - "Six live read sites, all confirmed at the cited lines: src/server/access.rs:301;
         src/server/handlers/rdf.rs:131, :162, :462; src/server/handlers/query.rs:5627, :5684."
    finding_understated_the_problem: >-
      The finding names three uninvalidating mutators (try_add_grant, try_remove_grant,
      try_register_agent). There are at least THIRTEEN, all in crates/eg-core/src/isolation.rs
      and all with zero invalidation: try_add_role:1151, try_remove_role:1171, add_grant:1186,
      try_add_grant:1191, remove_grant:1299, try_remove_grant:1304,
      try_bootstrap_system_identity:1346 and :1373, register_agent:1392, try_register_agent:1400,
      try_register_agent_from_request:1437, unregister_agent:1456, try_unregister_agent:1460.
      This is the strongest possible argument against the "add invalidation calls" fix.

    decision: >-
      Key the cache on a policy epoch, exactly as the finding proposes. Do NOT fix it by adding
      invalidation calls to the mutators.
    rationale: >-
      An invalidation list is an ENUMERATION of call sites, and it goes stale the moment someone
      adds a fourteenth mutator -- silently, with no gate observing it, producing a security
      regression that looks like a performance optimisation. That is documented failure pattern
      5.3 in the epistemic-graph-development skill, and thirteen uninvalidating mutators is that
      pattern already realised. A key makes the staleness UNREPRESENTABLE: a permission change
      bumps the epoch, every prior entry becomes unreachable by construction, and a new mutator
      cannot forget because it does not have to remember. The cache's own doc already concedes
      the cost is acceptable -- a miss "costs exactly what every call cost before this cache
      existed."
    concrete_change:
      - "crates/eg-core/src/isolation.rs: add a `policy_epoch: AtomicU64` to `IsolationLayer` and a
         `pub fn policy_epoch(&self) -> u64`. Bump it in EVERY mutator of the grant, role or
         agent-identity tables -- all thirteen listed above -- by routing them through one private
         `fn mutate_policy<R>(&mut self, f: impl FnOnce(&mut Self) -> R) -> R` that bumps on exit,
         so a fourteenth mutator cannot be written without it."
      - "crates/eg-core/src/rls_view_cache.rs: change `entries` to
         `HashMap<(String, u64), (u64, Arc<GraphView>)>` keyed on (actor, policy_epoch); take
         `policy_epoch` in `get` and `put`; leave `generation` as-is (it closes the
         build-race, a different property)."
      - "crates/eg-core/src/graph.rs: thread the epoch through `cached_filtered_view` /
         `put_cached_filtered_view` (used at graph.rs around :3610)."
      - "Update the six read sites (access.rs:301; rdf.rs:131/162/462; query.rs:5627/5684) to pass
         the epoch. They already fetch `filtered_view_cache_generation()` at the adjacent line, so
         the call shape is unchanged in structure."
      - "Add a test that a cached actor served a row, then a `try_remove_grant` for that row's
         scope, then a re-read, does NOT return the row. No such test exists today -- which is why
         this has stayed open."
    would_have_been_caught_by: >-
      No existing gate or test. `universal-read-rls-architecture` checks that a served read does
      not BYPASS row/carrier ownership isolation; a cache HIT is not structurally a bypass, so the
      gate is green while the property is violated. That is the coverage hole to close.
    acceptance_evidence: []

  - decision_id: D-EG-008
    title: "verify_replay_identity compares the whole batch, forcing callers to reconstruct request stamps"
    owning_component: eg.mutation-store
    affected_components: [eg.contracts, eg.server-dispatch, eg.persistence]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run

    verified_facts:
      - "crates/eg-mutation-store/src/store/ledger.rs:177-190 --
         `verify_replay_identity(proposed: &MutationBatch, stored: &MutationBatch)` validates both
         write budgets then compares `encode_bounded(proposed) == encode_bounded(stored)`, i.e.
         WHOLE-STRUCT byte equality, and otherwise returns
         `IDEMPOTENCY_CONFLICT: key was already used by a different mutation`."
      - "Four call sites inside the crate: apply.rs:12, apply.rs:51, saga.rs:49, saga.rs:110.
         Re-exported at lib.rs:120."
      - "Compensation 1 (production): src/server/handlers/admin.rs:607-635. `admin_saga_request_stamp`
         reuses the ORIGINAL attempt's expected_graph_version / request_id / created_at_ms when a
         record already exists, and only a genuine first attempt reads live state. Its own doc
         says re-deriving them live 'makes a legitimate replay's freshly-compiled batch
         byte-diverge from the one already on record purely on this incidental metadata,
         spuriously failing closed with IDEMPOTENCY_CONFLICT even though the intended operation
         (domain/event/payload) is identical.'"
      - "Compensation 2 (independent): src/redb_store/development_lane.rs:6553-6570. Same fix,
         reached independently, and its comment says so verbatim: 'This mirrors the production fix
         in `handlers/admin.rs`. That the same correction is needed independently here is the
         evidence that the underlying validator is comparing more than identity.'"

    decision: >-
      The contract is wrong and moves. Idempotency identity is the caller's INTENDED OPERATION --
      scope identity, domain, the operation list and their payloads -- and excludes the request
      envelope (version_expectation, request_id, created_at_ms). Both compensations are then
      deleted, not generalised into a shared helper.
    rationale: >-
      Two independent call sites needing the same compensation is the definition of a contract
      pushing work onto its callers. And the compensation is not free: it makes every replay path
      read the stored record BEFORE it can build the batch it is about to compare, which inverts
      the natural order and is exactly the kind of subtlety a third caller will get wrong.
      Extracting a shared `request_stamp` helper would be the WRONG fix here -- per failure
      pattern 5.3 an extraction changes the set of call sites a control runs on, and this
      particular control (reuse the stored stamp) must run on replay paths and must NOT run on
      first attempts. Moving the comparison instead removes the need for the control entirely.
      The stored `version_expectation` must still be REUSED on replay (it is the OCC value the
      first attempt actually committed against) -- that is a separate assertion, not part of the
      identity comparison.
    concrete_change:
      - "crates/eg-types/src/mutation_batch/: add
         `MutationBatch::operation_identity_digest(&self) -> [u8; 32]` covering scope identity,
         domain, and the ordered operation list with payloads; explicitly EXCLUDING
         version_expectation, request_id and created_at_ms. It belongs in eg-types because both
         the store (crate A) and every producer (crate B) must agree on the set -- the
         crate-both-can-see rule from failure pattern 5.2."
      - "crates/eg-mutation-store/src/store/ledger.rs:183-185: compare
         `proposed.operation_identity_digest() == stored.operation_identity_digest()`."
      - "Same function: add a SEPARATE, explicit check that the proposed batch's
         version_expectation equals the stored one, with its own distinct error message, so a
         caller that re-derived the OCC value gets told exactly that instead of a generic
         IDEMPOTENCY_CONFLICT."
      - "Delete src/server/handlers/admin.rs's `admin_saga_request_stamp` (:628+) and its callers'
         use of it; delete the equivalent block at src/redb_store/development_lane.rs:6553-6570."
      - "Add a store-level test: prepare a saga, then replay it with a DIFFERENT req_id and a
         later created_at_ms, and assert it REPLAYS rather than conflicting. No such test exists
         -- both compensations exist precisely because nothing at the store level covers this."
    acceptance_evidence: []

  - decision_id: D-EG-009
    title: "The `security` feature is a second, unauthenticated architecture"
    owning_component: eg.binary-composition
    co_owning_component: eg.graph-core
    status: proposed
    decision_authority: operator
    decision_authority_reason: >-
      De-gating deletes the `--no-default-features` build shape as an authenticated-optional
      target. Whether that lean/Pi profile must survive as a supported artifact is a product
      decision about what this engine ships, not an architecture call I can make. I can say the
      negative arms are a security liability and that de-gating is the right shape; I cannot
      decide that the lean build stops being offered.
    evidence_status: measured_not_remediated

    verified_facts:
      - "`grep -rn 'cfg(feature = \"security\")' src/ crates/ --include=*.rs | wc -l` = 636."
      - "`grep -rn 'cfg(not(feature = \"security\"))' src/ crates/ --include=*.rs | wc -l` = 64.
         Both figures reproduce the earlier census exactly."
      - "Root Cargo.toml: `default = ['graph', 'algorithms', 'metrics', 'full']` and `full`
         contains 'security'. So the 64 negative arms are reachable ONLY via
         --no-default-features, and no shipped default build compiles them."
      - "crates/eg-core/src/isolation.rs:1542-1545 -- under `#[cfg(not(feature = \"security\"))]`,
         `check_access` (declared :1508) matches graph_type and returns
         `GraphType::Commons => true` under the comment 'Bus: all authenticated agents have full
         access', with no identity resolution on that arm."
      - "`DurableCrypto::none()` appears at 224 sites across src/ and crates/."
      - "`security = ['redb', 'oidc', 'dep:chacha20poly1305', 'eg-types/security',
         'eg-core/security']` -- so de-gating also makes redb, oidc and chacha20poly1305
         unconditional, which is the part with real dependency-footprint consequences."

    decision: >-
      De-gate. `security` stops being a feature and becomes unconditional; the 64 negative arms
      are DELETED, not preserved behind a renamed flag. Sequenced LAST in the EG queue.
    rationale: >-
      636 positive arms is not a feature flag, it is a second implementation of the engine that
      nobody runs, nobody tests in CI, and that returns `true` from an access check. Its only
      justification is a lean build, and the lean build's savings are redb + oidc +
      chacha20poly1305 -- a footprint question that can be answered on its own terms without
      carrying an unauthenticated authorization path in the tree. Renaming the flag or inverting
      it (`insecure` opt-in) is worse than deleting: it keeps 700 conditional arms alive to
      preserve a build nobody ships.
    sequencing:
      position: last_in_the_eg_queue
      blocked_behind: [D-EG-001, D-EG-007, D-EG-008]
      reason: >-
        De-gating rewrites the same isolation.rs, mutation-store and server-dispatch call sites
        that D-EG-001, D-EG-007 and D-EG-008 each modify. Running it first would put a 700-arm
        mechanical rewrite underneath three semantic changes and make every merge conflict
        unreviewable -- the mechanical-merge failure mode this program has already paid for.
      also: >-
        Composing a 700-site change into a repository whose gate suite is already red hides the
        regressions the composition itself causes. Land the three semantic fixes and re-establish
        a per-hook baseline first.
    concrete_change:
      - "Prerequisite: measure the actual size/dependency delta of --no-default-features vs
         default, and get an operator ruling on whether that build shape is still shipped. If it
         is, this decision does not proceed as written."
      - "Delete all 64 `#[cfg(not(feature = \"security\"))]` arms, starting with
         crates/eg-core/src/isolation.rs:1542-1545."
      - "Delete all 636 `#[cfg(feature = \"security\")]` attributes, making the guarded code
         unconditional."
      - "Remove `security` from root Cargo.toml `full`, from `eg-types` and `eg-core` feature
         lists, and make redb/oidc/chacha20poly1305 unconditional dependencies."
      - "Audit each of the 224 `DurableCrypto::none()` sites separately -- `None` on a security
         seam needs a named reason at the construction site (failure pattern 5.4's companion
         rule), and de-gating does not by itself fix them."
      - "Existing proposal: plans/refactor/evidence/proposals/EG-SECURITY-DEGATING-SLICE.md."
    acceptance_evidence: []

  - decision_id: D-EG-010
    title: "src/server/blob/store.rs still hand-rolls the four-constructor identity form"
    owning_component: eg.server-dispatch
    co_owning_component: eg.contracts
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run

    verified_facts:
      - "src/server/blob/store.rs:454 -- `fn ledger_bootstrap_identity()` calls
         `MutationScopeIdentity::native(TenantId::system(), MutationDomain::BlobStore,
         LogicalName::new(\"blob-ledger-root\")?, IncarnationId::new(COMPILED_BATCH_INCARNATION)?)`.
         The line number in the finding is EXACT."
      - "The collapsed helpers are used at exactly four sites, matching the A-1 record:
         crates/eg-core/src/rbac_persist.rs:64 (fixed_native),
         crates/eg-jobs/src/store.rs:2382 (fixed_native),
         crates/eg-statechart/src/store.rs:738 (fixed_native),
         src/server/persistence/redb_backend.rs:1347 (fixed_graph)."
      - "crates/eg-types/src/mutation_batch/model/identity.rs:228-240 --
         `fixed_native(tenant: &str, domain: MutationDomain, resource: &str, incarnation_id: &str)`
         forwards to `native(TenantId::new(tenant)?, domain, LogicalName::new(resource)?,
         IncarnationId::new(incarnation_id)?)`."

    decision: >-
      Migrate it. It is residue of the A-1 collapse, not a deliberate exception, and it is the
      last one.
    rationale: >-
      Failure pattern 5.6: a named reference implementation is a copy instruction, and eight
      near-identical scope-identity builders appeared because the pattern had no shared home.
      `fixed_native`/`fixed_graph` gave it one and collapsed seven of the eight. Leaving the
      eighth is how the pattern restarts -- the next lane greps for the shape, finds a hand-rolled
      one, and copies it.
    verified_caveat_for_the_migration: >-
      The migration is NOT purely mechanical and this must be checked before it is made.
      `TenantId::system()` (identity.rs:27) constructs `Self(RESERVED_SYSTEM_TENANT)` DIRECTLY,
      bypassing `validate_identifier`, whereas `fixed_native` routes its `&str` through
      `TenantId::new` which validates. VERIFIED that this is safe here:
      `RESERVED_SYSTEM_TENANT = "__eg_system__"` (identity.rs:13) contains no `.`, `..`, `/`,
      `\\` or `@`, so it passes `validate_identifier` (identity.rs:319-339) and the resulting
      TenantId is byte-identical. If the reserved literal ever changes to something with path or
      address shape, this migration silently starts failing closed at construction.
    concrete_change:
      - "src/server/blob/store.rs:454-464: replace the body of `ledger_bootstrap_identity` with
         `MutationScopeIdentity::fixed_native(
            eg_types::mutation_batch::RESERVED_SYSTEM_TENANT,
            MutationDomain::BlobStore,
            \"blob-ledger-root\",
            crate::server::mutation_batch::COMPILED_BATCH_INCARNATION)`."
      - "Keep the existing 15-line doc comment above it verbatim -- it records WHY the incarnation
         reuses COMPILED_BATCH_INCARNATION rather than a store-local constant, and that reasoning
         is the thing most likely to be lost in a mechanical migration."
      - "Inspect the sibling `scope_identity` in the same file (immediately below :480) for the
         same shape before declaring the collapse complete."
      - "Consider adding `MutationScopeIdentity::fixed_system_native(domain, resource,
         incarnation)` so the reserved-tenant literal is not spelled at call sites at all -- but
         only if a SECOND system-tenant call site exists; one call site does not justify a helper."
    acceptance_evidence: []

