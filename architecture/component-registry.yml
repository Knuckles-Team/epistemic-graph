# ---------------------------------------------------------------------------
# Wiring decisions. One per open architectural finding.
#
# `decision_authority` says who the call belongs to:
#   component_owner -- the owning component can decide and implement it.
#   operator        -- it changes a product-visible contract, a supported build shape,
#                      or the release queue, and I should not decide it.
# Every decision is `status: proposed` regardless; no operator has signed off.
# ---------------------------------------------------------------------------
wiring_decisions:

  - decision_id: D-MEDULLA-001
    title: "MutationStore::database() is public and the write() revalidation is bypassed"
    owning_component: medulla.mutation-store
    affected_components: [medulla.server-dispatch, medulla.job-plane, medulla.timeseries, medulla.graph-core, medulla.persistence]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run

    verified_facts:
      - "`pub fn database(&self) -> &Database` is at crates/medulla-mutation-store/src/store/identity.rs:142.
         The finding says :144. STALE BY TWO LINES."
      - "`pub fn write(&self) -> Result<MutationWrite, String>` is at identity.rs:150 and its FIRST
         statement is `self.validate_physical_root()?`. A raw `database().begin_write()` skips that
         and the handle revalidation. The security delta is real and is exactly as described."
      - "A second, already-narrow accessor exists: `pub(crate) fn database(&self) -> &ReadOnlyDatabase`
         at identity.rs:220. The read side is therefore already solved; only the write side is open."
      - "`.database()` appears at 71 sites across src/ and crates/ (including doc comments and tests)."
    corrected_census:
      method: >-
        Every line containing `.database()` whose next three lines contain `begin_write`, over
        src/ and crates/, at HEAD 1d83cf4b.
      production_begin_write_bypasses_outside_the_owning_crate: 17
      finding_originally_claimed: 12
      note_on_the_18th: >-
        A single further production `.database().begin_write()` exists at
        crates/medulla-mutation-store/src/store/recovery.rs:131. It is INSIDE the owning crate and is
        therefore not a bypass of the store's own API; it is excluded from the 17. Counted
        together the figure is 18, which is why both numbers appear in earlier notes.
      breakdown:
        - "src/server/kv.rs:193, :218, :328 (3) -- owner medulla.server-dispatch"
        - "src/server/blob/store.rs:570, :643, :699, :1315 (4) -- owner medulla.server-dispatch"
        - "crates/medulla-jobs/src/store.rs:1241, :1297, :1362 (3) -- owner medulla.job-plane"
        - "crates/medulla-statechart/src/store.rs:267 (1) -- owner medulla.job-plane"
        - "crates/medulla-tsdb/src/store.rs:562, :582, :774, :812, :934, :977 (6) -- owner medulla.timeseries"
      re_measurement_finding: >-
        THE CHOKEPOINT BYPASS GOT WIDER WHEN RE-MEASURED, and by whom matters. medulla-tsdb (6) and
        medulla-statechart (1) account for 7 of the 17 and were absent from the original finding.
        Those are precisely the stores that were RESTRUCTURED to own a `MutationStore` rather
        than a bare `Database` -- they should be the best-behaved consumers of the contract, and
        instead they are its largest single bypasser. That is the strongest argument for closing
        the accessor: a migration whose stated purpose was "every consumer holds a store + an
        identity, never a bare Database" reproduced the bare-Database call shape through a public
        accessor, and nothing observed it. Leaving `database()` public means the next store to be
        migrated will do the same.
      test_only_sites_excluded:
        - "crates/medulla-core/src/rbac_persist.rs:763"
        - "crates/medulla-tsdb/src/store.rs:1390"
        - "crates/medulla-mutation-store/src/store/tests.rs:196"
      corrections_to_the_finding:
        - "medulla-tsdb was MISSED entirely and is the single largest bypasser (6 of the 17 external sites)."
        - "medulla-statechart was MISSED (1 site)."
        - "`crates/medulla-jobs/src/store.rs:416` is correctly EXCLUDED from the 17 -- it is
           `initialize_scheduler_indexes(mutation_store.database())`, which is a call, not a
           transaction mint. PARTIAL DISAGREEMENT with the correction that reached this lane,
           which describes :416 as 'a read': it is not. VERIFIED at
           crates/medulla-jobs/src/store.rs:1485-1486 --
           `fn initialize_scheduler_indexes(db: &Database) -> Result<u64> { let wtx =
           db.begin_write().map_err(redb_err)?; ... }`. So the raw `&Database` handed out at :416
           is used to mint a WRITE transaction one frame away at :1486. It is not a 17th
           direct-mint site, but it IS a transitive bypass and the accessor narrowing in
           `concrete_change` must cover it (the parameter type becomes the revalidating
           accessor's output, not `&Database`). Recorded rather than silently dropped, because
           dropping it would leave a live bypass with no owner."
        - "src/server/blob/store.rs has TWELVE `.database()` sites (570, 612, 643, 662, 685, 699, 713,
           724, 968, 1243, 1294, 1315), not 14. Four of the twelve reach begin_write; the other eight
           are begin_read."
        - "src/server/kv.rs:1071 and :164, :258 are begin_READ, correctly excluded from the write census."

    decision: >-
      `database()` becomes `pub(crate)`, AND the bypass sites are NOT migrated to `write()`.
      Both halves of the finding's either/or are wrong on their own; the answer is a third
      option, a narrow write accessor that keeps the revalidation.
    rationale: >-
      Migrating the 17 external sites to `MutationStore::write()` would be incorrect. Every one
      of medulla-jobs, medulla-statechart, medulla-tsdb, medulla-core::rbac_persist and src/server/blob/store.rs
      documents in its own source that its AUTHORITATIVE table lives beside the ledger in the
      SAME physical redb file and is deliberately opened off the raw `Database`
      (e.g. crates/medulla-jobs/src/store.rs:368-372, crates/medulla-core/src/rbac_persist.rs:130,
      crates/medulla-statechart/src/store.rs:206). `write()` returns a `MutationWrite` bound to a
      ledger batch; these writes are not ledger batches. What the bypass sites actually skip is
      only the two revalidations -- so the fix is an accessor that keeps the revalidation and
      drops the batch requirement, not a call-shape migration. Leaving `database()` public and
      "just being careful" is the option this repository has already disproved: a public raw
      handle is a second construction route to the same authority, which is the exact
      anti-pattern the `mint-lease-call-sites` gate exists to prevent for leases.
    concrete_change:
      - "crates/medulla-mutation-store/src/store/identity.rs: change `pub fn database` (:142) to
         `pub(crate) fn database`."
      - "crates/medulla-mutation-store/src/store/identity.rs: add
         `pub fn owner_write(&self) -> Result<redb::WriteTransaction, String>` which runs the
         SAME `validate_physical_root()` + handle revalidation as `write()` (:150) and then
         returns a bare `WriteTransaction` for the store owner's own non-ledger tables."
      - "crates/medulla-mutation-store/src/store/identity.rs: add the matching
         `pub fn owner_read(&self) -> Result<redb::ReadTransaction, String>` so the 40-odd
         `.database().begin_read()` sites get the same treatment rather than a second exception."
      - "Migrate the 17 external write sites listed in `corrected_census.breakdown` to
         `owner_write()`, and the external read sites to `owner_read()`."
      - "src/server/kv.rs:193, :218, :328 are the only three sites with NO separate-table reason --
         they are plain KV mutations. Migrate those to `MutationStore::write()` proper, not to
         `owner_write()`."
      - "Cover the TRANSITIVE site too: `initialize_scheduler_indexes` takes `db: &Database`
         (crates/medulla-jobs/src/store.rs:1485) and mints a write at :1486 from the handle passed at
         :416. Change its parameter to the revalidating accessor's output rather than
         `&Database`, so narrowing `database()` to pub(crate) does not simply push the raw handle
         one frame down. Grep for other `fn f(db: &Database)` signatures in the same pass."
      - "Add a pre-commit check (owner: medulla.binary-composition) that `\\.database()` does not appear
         outside crates/medulla-mutation-store, so the narrowing cannot silently regress. Make it also
         reject `&redb::Database` in a function signature outside that crate -- otherwise the
         accessor is narrowed and the raw handle keeps travelling by parameter."
    acceptance_evidence: []
    would_have_been_caught_by: >-
      NOTHING in the current gate suite. `persisted-mutation-contract` checks the method/projection
      persistence inventory, not the transaction-minting route. This is a coverage hole, not a
      failing gate.
    path_currency_note: >-
      UPDATED 2026-09-13: `crates/medulla-mutation-store` no longer exists (see
      medulla.mutation-store.migration_lineage for the verified rename table). Current locations,
      re-checked directly against source (not inferred from the rename table alone):
      `identity.rs:142`'s `pub fn database` -> `crates/medulla-storage/src/physical/root.rs:89`,
      now ALREADY `pub(crate) fn database` -- the exact narrowing this decision's `decision`
      field calls for has already landed, independent of this decision's `status` (still
      `proposed` below; narrowing the visibility is not the same as auditing that every
      external call site was migrated, which this pass did not redo). `identity.rs:150`'s
      `write()` (first statement `validate_physical_root()?`) -> root.rs's `begin_write()` at
      root.rs:103, which calls `validate_physical_root()` at root.rs:111 as its first
      substantive statement (after the read-only guard) -- same revalidate-before-write shape,
      different method name. `validate_physical_root()` itself is at root.rs:136.
      `identity.rs:220`'s `pub(crate) fn database(&self) -> &ReadOnlyDatabase` accessor was
      NOT found at the same location -- `ReadOnlyDatabase` usage in medulla-storage is now split
      across `crates/medulla-storage/src/physical/read_only.rs` (a dedicated file) and
      `crates/medulla-storage/src/recovery/adopt.rs`; which one is the direct successor of the old
      accessor was not traced with certainty and is left unverified rather than guessed.
      `recovery.rs:131` (the one in-crate `.database().begin_write()` site) ->
      `crates/medulla-storage/src/recovery/backup.rs`, which still calls `.begin_write()` (now at
      backup.rs:65) inside `backup_recovery_store_of`. `store/tests.rs:196` (the test-only
      exclusion) is AMBIGUOUS post-split: `git show --name-status -M` shows TWO different
      `store/tests.rs` renames at two different commits (a4faec53 ->
      `crates/medulla-storage/src/physical/tests.rs`; b90e42a7, a later file at the same path ->
      `crates/medulla-transaction/src/tests/ledger.rs`) -- which one held line 196 at the
      historical HEAD this census was run
      against (1d83cf4b, well before either rename) was not re-derived; both files are named
      here as the candidate current locations rather than asserting one with false certainty.
      The five EXTERNAL bypass sites this decision's `corrected_census.breakdown` lists
      (src/server/kv.rs, src/server/blob/store.rs, crates/medulla-jobs/src/store.rs,
      crates/medulla-statechart/src/store.rs, crates/medulla-tsdb/src/store.rs) are unaffected by the
      medulla-mutation-store retirement -- none of those paths changed -- so they are NOT
      re-verified here beyond confirming their paths still exist (see the whole-file
      path-existence sweep this same commit records).

  - decision_id: D-MEDULLA-002
    title: "Crate-DAG layer violations: medulla-tsdb -> medulla-compute, medulla-kvcache -> medulla-compute, medulla-tensor -> medulla-tsdb"
    owning_component: medulla.binary-composition
    affected_components: [medulla.timeseries, medulla.compute, medulla.kv-cache, medulla.modality]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run
    edges_ref: [LV-01, LV-02, LV-03]

    decision: >-
      Split verdict, one per edge, plus a mandatory restatement of the rule itself.
      (a) LV-01 medulla-tsdb -> medulla-compute: the LAYER ASSIGNMENT is wrong, not the edge. medulla-tsdb is not
          a layer-4 storage crate; it is a query/reasoning-layer store. Reassign it.
      (b) LV-02 medulla-kvcache -> medulla-compute: not a violation of the rule as it must be restated. The
          edge is optional, off by default, and outside the default+`full` feature closure.
          Qualify the rule to bind on a FEATURE CLOSURE, not on the union of all declarations.
      (c) LV-03 medulla-tensor -> medulla-tsdb: a real violation. Invert it.
      (d) The rule as written ("only crates to its left") is itself wrong and must be restated to
          permit same-layer acyclic edges.
    rationale:
      a: >-
        crates/medulla-tsdb/Cargo.toml:56-57 states the position outright: "Depending on both puts
        medulla-tsdb ABOVE medulla-compute in the DAG -- parallel to where medulla-query sits." The edge is
        mandatory, carries `features = ["finance"]`, and exists to REUSE the ewma_signal /
        rolling_zscore kernels rather than copy them -- which is precisely the anti-sprawl
        behaviour this repository wants. Duplicating those kernels into medulla-tsdb to satisfy a
        layer label would be strictly worse. In this manifest medulla.timeseries stays under the
        `storage-transaction` target layer because that is what it IS to a consumer, and the
        violation is DECLARED (LV-01) rather than papered over; the crate-DAG tier and the
        target-layer matrix are two different models and this is where they disagree.
      b: >-
        A rule that binds on every declared dependency regardless of feature gating cannot
        distinguish "this ships" from "this exists behind an off-by-default flag". Since the
        repository ships exactly one main build (`default == full`), the enforceable statement is
        about that closure. Recording LV-02 keeps the edge visible without making a
        never-shipped code path block the gate.
      c: >-
        This one has no defence. medulla-tensor's medulla-modality edge is OPTIONAL and its medulla-tsdb edge is
        MANDATORY, so in a default build medulla-tensor is a crate whose only workspace dependency is
        a storage crate -- it is not a modality leaf at all. The medulla-tsdb Cargo comment claims
        "medulla-tsdb does NOT depend on medulla-tensor, so there is no cycle", which is true and beside the
        point: acyclicity is not layer conformance.
      d: >-
        The rule as written forbids at least ten legitimate same-layer edges (see
        `layer_model.rule_as_it_must_be_restated`). A rule that the tree violates a dozen times
        for good reasons is not a rule anyone can gate on.
    concrete_change:
      - "(a) Move medulla-tsdb's crate-DAG tier from the storage tier to the query/reasoning tier in
         plans/refactor/DESIGN.md's 'EG target crate graph' and in the
         medulla-development skill's Layer 4 table. No code change. LV-01 is then closed
         by correcting the model, and D-MEDULLA-004's gate must read the corrected model."
      - "(b) State the rule as binding over the `default`+`full` feature closure. LV-02 stays
         declared with `in_default_and_full_closure: false`; D-MEDULLA-004's gate resolves features
         before evaluating edges and does not fail on it."
      - "(c) Extract the shared time-grid primitive medulla-tensor consumes -- the common grid and the
         MEDULLA-067 tumbling windows named at crates/medulla-tensor/Cargo.toml:20-23 -- out of medulla-tsdb into
         a crate BELOW both (medulla-types is the crate both can already see; a new
         `medulla-time-grid` leaf is the alternative if the primitive is too heavy for medulla-types).
         Then delete `medulla-tsdb = { path = \"../medulla-tsdb\" }` from crates/medulla-tensor/Cargo.toml:24 and
         make medulla-tensor's medulla-modality dependency NON-optional, restoring it to an actual modality
         leaf. This is the only one of the three that costs real work."
      - "(d) Replace the rule text in plans/refactor/DESIGN.md and in the skill with:
         'A crate's [dependencies] and [build-dependencies] may name only crates in a strictly
         lower layer, or in the same layer provided the graph stays acyclic. [dev-dependencies]
         are out of scope (see D-MEDULLA-003). Evaluation is over the default+full feature closure.'"
    acceptance_evidence: []

  - decision_id: D-MEDULLA-003
    title: "[dev-dependencies] cycles exist and build fine"
    owning_component: medulla.binary-composition
    affected_components: [medulla.modality, medulla.rdf-semantics, medulla.viz, medulla.quantum]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run
    cycles_ref: [DC-01, DC-02, DC-03]
    edges_ref: [LV-04]

    decision: >-
      Dev edges are EXPLICITLY OUT of the DAG rule, and are permitted upward. They are not
      inverted. The rule text must say so rather than leaving it implied.
    rationale: >-
      Why it is safe, mechanically rather than by assertion:
        1. `[dev-dependencies]` are compiled ONLY for the owning crate's own test, bench and
           example targets. They are not in the dependency graph of `cargo build`,
           `cargo check`, or the crate's `lib` target, so no consumer of medulla-modality ever links
           medulla-audio through it, and no shipped binary contains a dev edge.
        2. They therefore cannot create a link-time or runtime cycle. The cycle exists only in
           the metadata of a test build, which Cargo resolves by building the crate's lib once
           without dev-deps and then building the test target against it.
        3. Under edition 2021 (root Cargo.toml:90), the v2 feature resolver is in effect, so
           dev-dependency features do NOT unify into the normal build graph. This is the one
           mechanism that could have made a dev edge change a shipped artifact, and it is off.
           If this workspace ever moves to a resolver where dev features unify, this decision
           must be re-taken.
      Inverting them would cost real architecture for no safety: the medulla-modality cycle exists so
      the ModalityContract TCK (`crates/medulla-modality/tests/fleet_tck.rs`) can run the CONTRACT against its six real
      implementations. Inverting it means either duplicating six pilot implementations inside
      medulla-modality, or moving the TCK up into a seventh crate that depends on all seven -- both
      strictly worse than a dev edge that never ships.
    boundary_condition: >-
      The permission is not unlimited. A dev edge must not (i) enable a feature on the
      dev-depended crate that the normal build also enables differently, nor (ii) be the only
      thing keeping a crate in the workspace. Both are checkable; neither is checked today.
    concrete_change:
      - "Restate the rule (same edit as D-MEDULLA-002(d)): '[dev-dependencies] are out of scope. A dev
         edge may point upward or close a cycle.' with the three-point mechanical justification
         above recorded alongside it, not just the conclusion."
      - "D-MEDULLA-004's gate parses `[dependencies]` and `[build-dependencies]` only, and must SAY so
         in its own failure message so a future reader does not assume dev edges were checked."
      - "Add to that gate a check that no dev edge enables a feature on its target that the
         normal build graph does not also enable -- the one mechanical hazard the exemption
         leaves open."
      - "Fix the source finding's record: medulla-viz-core -> medulla-jobs (LV-04) is NOT a cycle, and
         medulla-rdf -> medulla-shacl (DC-02) IS one and was missing."
    acceptance_evidence: []

  - decision_id: D-MEDULLA-004
    title: "Nothing enforces the crate DAG"
    owning_component: medulla.binary-composition
    affected_components: [medulla.embedded-bindings]
    status: proposed
    decision_authority: component_owner
    evidence_status: not_run

    verified_facts:
      - "`arch-lint list-rules` (arch-lint 0.5.0) reports EIGHT rules: AL001 no-unwrap-expect,
         AL002 no-sync-io, AL003 no-error-swallowing, AL013 no-silent-result-drop,
         AL004 handler-complexity, AL005 require-thiserror, AL006 require-tracing,
         AL007 tracing-env-init. NONE is a dependency-direction rule. The finding is correct."
      - "arch-lint.toml's own comment says 'Keep arch-lint focused on dependency direction until
         that debt is deliberately reduced'. That comment is FACTUALLY WRONG -- arch-lint has no
         dependency-direction rule to be focused on. It should be corrected in the same change."
      - "The dependency-cruiser hook's entry is
         `depcruise --validate --config clients/js/.dependency-cruiser.cjs clients/js/index.mjs`
         (.config/pre-commit.yaml:304). It validates the JS client only, and it CANNOT PASS in a
         clean checkout: node_modules is uncommitted and the hook runs no `npm ci`."
      - "Cargo's guarantee is real but narrow: VERIFIED that no crates/*/Cargo.toml declares
         `medulla`, so no crate depends back on the root facade. That is acyclicity, not
         direction -- LV-01 and LV-03 are acyclic upward edges that build fine."

    decision: >-
      A gate IS required, owned by medulla.binary-composition, and it must read its layer model from
      THIS manifest rather than from a second hand-maintained table.
    rationale: >-
      The property the program believes is held is 'no storage or query crate imports server
      dispatch'. Cargo does hold exactly that one, for free, and no gate can hold it better. But
      the property anyone actually reasons with is the six-layer direction, and Cargo holds none
      of it -- proven by LV-01 and LV-03 building green. Adding a gate that re-derives its own
      layer table would create a second ownership authority, which the registry's consolidation
      rule forbids; reading `owned_crates` + `parent_layer` out of this file keeps one authority
      and makes the manifest load-bearing instead of decorative.
    concrete_change:
      - "Add scripts/check_crate_layer_direction.py: load architecture/component-registry.yml;
         build crate -> component -> parent_layer from `owned_crates`; parse every
         crates/*/Cargo.toml `[dependencies]` and `[build-dependencies]` path dep; resolve the
         default+full feature closure; fail on any edge to a strictly-higher layer that is not
         listed in `declared_layer_violations` with a live `decision_ref`. Ignore
         `[dev-dependencies]` and say so in the failure message (D-MEDULLA-003)."
      - "Also fail when a `declared_layer_violations` entry no longer matches the tree -- a
         declared entry that stops being true is a failure, exactly as .repo-layout.toml treats a
         declared root that stops being tracked. This is what keeps the list from becoming a
         ratchet."
      - "Also fail when a crate in Cargo.toml [workspace] members is owned by no component, or by
         more than one -- the exclusive-root property the layout contract requires."
      - "Add the `crate-layer-direction` hook to .config/pre-commit.yaml, language: system,
         pass_filenames: false, always_run: true."
      - "Correct the misleading comment in arch-lint.toml."
      - "Separately: the dependency-cruiser hook is a gate that cannot pass. Either add an
         `npm ci --prefix clients/js` step or remove the hook. A hook that always errors is
         indistinguishable from one that is enforcing nothing (owner: medulla.embedded-bindings)."
    acceptance_evidence: []

