      admission.rs, commit.rs, saga.rs, replay.rs, the participant/ consensus-transaction
      intent codec, and its own src/tests/ integration suite. medulla-storage ("Sole
      physical-state authority: durable opens, owner-table registry, scoped capabilities,
      snapshots, backup/restore/adoption, recovery validation") is StorageKernelV1: the
      owner/ registry, physical/ manifest+incarnation, recovery/ adopt+backup+validate, and
      direct_state/ journal. medulla-transaction depends on medulla-storage (StorageKernelV1 hands
      MutationKernelV1 write authority via a move-once MutationOwnerAuthority); medulla-storage
      names no medulla-transaction edge, so the physical-state kernel can never depend inward on
      its mutation-authority consumer. Kept as ONE registry component (see
      migration_lineage) because both crates implement exactly the five capability_ids this
      component already owned before the split -- no capability moved, gained, or was lost.
      Still placed under target layer `types`, NOT `storage-transaction`, for the same
      cyclicity reason as before the split: medulla-core (layer `core`) depends on both crates.
