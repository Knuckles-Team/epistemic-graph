# EG owner-repository architecture component registry.
#
# This is the canonical owner manifest RF-ADR-005 / RF-022 specifies at the fixed path
# `architecture/component-registry.yml` inside this repository. Until it is reviewed and
# adopted, the authoritative inputs to
# `plans/refactor/scripts/architecture_component_registry.py` remain the non-authoritative
# proposal fixtures in `plans/refactor/architecture/components/`. This file is written to
# REPLACE the `epistemic-graph.yml` fixture, and preserves every `component_id`,
# `capability_id` and `target_item_ref` that fixture declared so the transition is a
# refinement, not a re-identification.
#
# NOTHING here is accepted. Every component and every wiring decision is `status: proposed`
# with `evidence_status: not_run`. No operator has signed off on any of it.
#
# Verification posture: every crate name, path, line number, dependency edge, feature and
# count below was re-verified against this working tree at the commit recorded in
# `verified_against` on 2026-09-04. Where a claim in the source finding or in the
# `epistemic-graph-development` skill did not survive verification, the corrected value is
# recorded and the stale claim is named explicitly in `corrections_to_upstream_claims`.

schema: eg-architecture-component-registry/v1
supersedes_fragment_schema: au-eg-architecture-component-fragment/v1
projects_into_registry_schema: au-eg-architecture-component-registry/v1
schema_authority_ref: plans/refactor/architecture/component-registry.schema.yml
schema_shape_note: >-
  The proposal schema at `component-registry.schema.yml` closes two vocabularies: the
  fragment vocabulary (`component_required_fields`, `unknown_fields: reject`) and the
  future owner-manifest vocabulary (`implementation_layout_contract.required_fields`).
  This file follows BOTH -- every component carries the fragment's required identity
  fields AND the layout contract's required fields (lane_kind, ownership_kind,
  parent_component_id, parent_layer, owner, owned_source_roots, public_contract_roots,
  test_roots, generated_roots, shared_roots, shared_files, review_policy,
  dependency_edge_refs, replaces, migration_lineage, test_mirrors_component_id,
  acceptance_gates, status) with `acceptance_gates` using exactly the seven declared
  `acceptance_gate_fields`. Ambiguities resolved, and the choice made in each case:
    1. The layout contract has no field for the crates a component owns. Added
       `owned_crates` -- the crate is this repository's real ownership unit and
       `owned_source_roots` alone cannot express "this component owns crates/eg-tsdb"
       distinctly from "it owns some files under it".
    2. The registry doc forbids owner records from declaring dependency endpoints
       ("Owner layout records never declare dependency endpoints. They carry only exact
       `dependency_edge_refs` into `inventory.yml:fleet_graph`"). `inventory.yml:fleet_graph`
       is `status: not_started` / `observed_state: unknown` and contains no edge to
       reference, so every `dependency_edge_refs` is `[]`. Intra-repository Cargo edges are
       recorded separately under `observed_crate_edges` / `observed_consumers`, explicitly
       marked as a VERIFIED OBSERVATION and not a second graph authority. The task asked
       for consumers; this is the only way to supply them without inventing edge authority.
    3. The schema has no vocabulary for architectural decisions. Added the top-level
       `wiring_decisions` list plus a per-component `wiring_decision_refs`. Components and
       decisions cross-reference by id in both directions.
    4. Added `declared_layer_violations` at the top level (not per component) because every
       violation is an EDGE between two components and belongs to neither alone.
    5. `component_kind` uses `layer_boundary_root_seam` for the six RF-022 seams and
       `implementation_component` for the 23 records beneath them. The registry doc states
       the proposal checker "intentionally refuses implementation-component rows until that
       owner-manifest schema and externally anchored transition are reviewed" -- so this
       file is expected to be REJECTED by the current checker until that review happens.
       That is the intended state, not a defect in this file.

