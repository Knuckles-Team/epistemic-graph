layer_model:
  authority: plans/refactor/inventory.yml -> inventory.repositories.epistemic-graph.target_layers
  target_layers: [types, core, storage-transaction, query-reasoning, server-protocol, composition]
  rule_as_written: >-
    "A crate may only `use` crates to its left. No storage or query crate imports server
    dispatch." (plans/refactor/DESIGN.md -> EG target crate graph, restated in the
    epistemic-graph-development skill.)
  rule_as_it_must_be_restated: >-
    See wiring decision D-EG-002. As written the rule is violated by roughly a dozen
    legitimate same-layer edges (eg-ann -> eg-numeric; eg-shacl/eg-shex/eg-graphql ->
    eg-rdf; eg-plan -> eg-query and -> eg-epistemic; eg-query -> eg-compute; eg-epistemic
    -> eg-compute), so "to its left" cannot mean "strictly lower layer". It must mean
    "strictly-lower layer, OR same layer provided the [dependencies] graph stays acyclic".
  enforcement_today: >-
    Cargo acyclicity over [dependencies] only, and nothing else. VERIFIED: no
    crates/*/Cargo.toml declares `epistemic-graph` as a dependency, so a crate cannot
    depend back on the root facade. That property is real but it is NOT layer enforcement:
    eg-tsdb -> eg-compute and eg-tensor -> eg-tsdb are both upward edges that build fine.
    See D-EG-004.

capability_authority_model:
  rule: >-
    "A capability and target item have exactly one implementation-authority component"
    (plans/refactor/ARCHITECTURE-COMPONENT-REGISTRY.md, Consolidation and history rules).
  how_this_file_satisfies_it: >-
    The six layer_boundary_root_seam records own NO source path and therefore implement nothing.
    Each carries the capability_ids the RF-022 fixture bound to it (so identities are preserved
    across the transition) together with an explicit `capability_delegation` map naming the ONE
    child implementation component that is the actual authority. Every capability is declared by
    at most one implementation component -- verified: zero duplicates across the 23
    implementation records.
  inherited_name_reuse: >-
    Three capability ids are spelled the same as the seam that carries them (eg.query-reasoning,
    eg.server-protocol, eg.composition). That collision comes from the RF-022 fixture, not from
    this file, and is preserved deliberately rather than renamed -- renaming would break the
    identity continuity the transition depends on. The capability and the component are distinct
    objects in distinct namespaces; the delegation map disambiguates which is meant.
  unclaimed_capabilities:
    - capability: eg.agent-library-entry
      seam: eg.types
      target_record: contract:rf-020/agent-library-entry/v1
      state: no_implementation_component_declares_it
      reason: >-
        RF-020 created the target record; no source implements a typed AgentLibraryEntry today.
        Claiming it for a component would be inventing coverage. Left UNCLAIMED on purpose.
    - capability: eg.agent-library-table
      seam: eg.storage-transaction
      target_record: data:rf-020/agent-library-entry-table/v1
      state: no_implementation_component_declares_it
      reason: >-
        Same. The durable Agent Library table, its revisions, outbox, tombstones, replay and
        reconciliation do not exist in this repository yet.

