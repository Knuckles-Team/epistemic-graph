skill_gaps_found:
  - gap: >-
      The skill's layer model covers the 48 crates and `src/server/`, and NOTHING ELSE in the
      root facade. Two large subsystems have no place in it at all: `src/raft/` (23 modules --
      consensus, replication, sharding, placement, cross-shard transactions, Pregel) and the
      persistence layer (`src/redb_store.rs` at 20,818 lines plus src/redb_store/,
      src/server/persistence/, persist.rs, durability.rs, mutation_apply.rs, write_coalescer.rs,
      crypto.rs). Together they own 375 of the 687 AL002 blocking errors -- 55% of the burndown
      lives in code the skill's inventory does not mention. This manifest models them as
      medulla.cluster-replication and medulla.persistence.
    impact: high
  - gap: >-
      "Layer 7 -- binary composition" is described as "[[bin]] targets ... feature selection and
      process lifecycle only", which omits that the same seam owns arch-lint.toml,
      .cargo/config.toml, .config/pre-commit.yaml, .config/repo-layout.toml and scripts/ -- i.e. every
      gate. Four of the ten wiring decisions here are owned by that seam, and the skill gives no
      hint that it is a decision-bearing owner.
    impact: medium
  - gap: >-
      The skill's §2 gate table lists what each hook FORBIDS but not what it CANNOT SEE. Three of
      the ten findings (D-MEDULLA-001, D-MEDULLA-004, D-MEDULLA-007) are coverage holes where a gate is green
      while the property is violated. A "what this gate does not observe" column would have
      surfaced all three.
    impact: medium
  - gap: >-
      §1 gives crate OWNERSHIP but no consumer direction, so "who breaks if I change this" is not
      answerable from the skill. The `observed_consumers` block per component in this manifest is
      the missing half; it was cheap to compute (one pass over 48 Cargo.toml files) and should be
      generated into the skill rather than re-derived by every reader.
    impact: medium
  - gap: >-
      §6 says CARGO_TARGET_DIR must live off /home, but does not mention that
      .cargo/config.toml COMMITS `target-dir = "target-isolated"` as the repo default -- which
      is on /home, is 41 GiB in the canonical checkout, and is the direct cause of D-MEDULLA-006.
      The two facts contradict each other and the skill states only one.
    impact: medium
  - gap: >-
      §3's MutationBatch contract documents `MutationStore::write()` as the only way to mint a
      WriteTransaction ("a WriteTransaction is only mintable through MutationStore::write()").
      That is FALSE on the current tree -- `pub fn database()` (identity.rs:142) mints one at 18
      production sites. The skill states the intended invariant as if it were the observed one,
      which is the specific error mode it warns about elsewhere.
    impact: high

unverifiable:
  - item: >-
      Whether the six heavy pre-commit hooks (cargo-clippy, cargo-clippy-all-features,
      cargo-deny-advisories, wheel-smoke, pytest, constrained-parallelism) pass. They require
      cargo, which was out of scope for this pass. They remain UNMEASURED, as the skill records.
  - item: >-
      Whether the AL002 findings in test/bench/harness files are true positives. arch-lint's
      AL002 is syntactic and cannot prove async reachability; separating true from false
      positives needs a call-graph pass, not a grep. The 687 figure is therefore an upper bound
      on production defects and is reported as measured, not as triaged.
  - item: >-
      Whether `respect_gitignore = true` is honoured by arch-lint 0.5.0 at all, or is overridden
      by `exclude`. Only the observable outcome was established: build artifacts under
      target-isolated/ and target-wd9recon/ ARE linted despite both being gitignored.
  - item: >-
      Every `target_item_refs` for the 23 implementation components is `[]` and every
      `contract_state` is `unknown_not_inventory_complete`. RF-00 has not created target records
      below the layer-seam level, so there is nothing to bind to. Binding them to the seams'
      existing single slots would be inventing coverage.
  - item: >-
      `dependency_edge_refs` is `[]` everywhere. inventory.yml:fleet_graph is
      `status: not_started` / `observed_state: unknown` and contains no edges. The observed Cargo
      edges recorded per component are evidence, not fleet-graph references.
  - item: >-
      No `acceptance_evidence`, `live_caller_evidence` or `deletion_proof` exists for any
      component. All are NOT RUN, consistent with the RF-022 authority model.
