           AgentLibraryLifecycle, AGENT_LIBRARY_ENTRY_SCHEMA_VERSION (currently 5),
           AGENT_LIBRARY_DEFINITION_DIGEST_DOMAIN / AGENT_LIBRARY_TOOL_SURFACE_DIGEST_DOMAIN"
