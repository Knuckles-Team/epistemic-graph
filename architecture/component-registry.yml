  - decision_id: D-MEDULLA-006
    title: "arch-lint.toml excludes **/target/** but the build writes to target-isolated/"
    owning_component: medulla.binary-composition
    status: proposed
    decision_authority: component_owner
    evidence_status: implemented_focused_tests_passed_not_landed

    verified_facts:
      - "At base 5523859a arch-lint.toml `exclude` was:
         [\"**/target/**\", \"**/generated/**\", \"**/vendor/**\", \"**/third_party/**\",
          \"**/fixtures/**\"]. `target-isolated` matches none of them."
      - ".cargo/config.toml sets `[build] target-dir = \"target-isolated\"` as this repository's
         committed default (a RELATIVE path, so every worktree gets its own)."
      - "Both target-isolated/ and target-*/ ARE listed in .gitignore (lines 79-81 and 122-123),
         and arch-lint.toml sets `respect_gitignore = true`. The gitignore route therefore
         SHOULD have covered this and does not. Either arch-lint 0.5.0's respect_gitignore does
         not apply to the excluded-path walk, or `exclude` is evaluated as the whole filter.
         Observed behaviour is what counts: build artifacts are being linted."
      - "Measured impact at HEAD: 1,144 of 4,642 violations are in build artifacts --
         target-isolated/ (858) and target-wd9recon/ (286). That confirms the ~1,144 figure."

    correction_to_the_finding: >-
      IMPORTANT AND NEW. All 1,144 build-artifact findings are AL013 WARNINGS. ZERO of them are
      AL002 errors. Fixing the exclude removes 25% of the total finding COUNT and 0% of the
      BLOCKING set -- the gate stays red at exactly 687 errors afterwards. The 2026-09-03 report
      says "Fixing the exclude is the first move; it is a quarter of the backlog and none of it
      is real debt", which is true about the count and misleading about the blocker. The
      historical source-tree total after that fix was 3,498 findings, still 687 raw AL002
      errors. At head 5523859a the exact clean-source census is now 3,499 / 690.
    decision: >-
      The current slice keeps exactly `**/target/**` and `**/target-*/**`. It also removes the
      broad generated/vendor/third_party/fixtures source exclusions: tracked Rust is source and
      remains in the truthful denominator. This changes the expected post-land file universe
      from 942 to 943 but does not lower or baseline the 690 raw AL002 candidates.
    concrete_change:
      - "arch-lint.toml: extend `exclude` with \"**/target-*/**\" (which covers target-isolated,
         target-wd9recon and every future per-worktree dir named by the .gitignore convention)."
      - "Do NOT rely on `respect_gitignore = true`; it demonstrably did not exclude these paths.
         File that upstream against arch-lint 0.5.0 with this reproduction."
      - "Re-measure after landing and publish the source-universe digest, raw counts, and
         context dispositions. No baseline."
    acceptance_evidence:
