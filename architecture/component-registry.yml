      owning component and followed by any alias calls that become proven blockers. The correct
      fix per proven site is one of exactly two, decided per call site rather than blanket-applied:
        (i)   the path IS reachable from the async runtime -> use the tokio::fs equivalent;
        (ii)  the path is genuinely blocking and belongs off the reactor ->
              tokio::task::spawn_blocking, with the blocking call moved inside;
      Synchronous, test, and already-offloaded contexts remain reported candidates rather than
