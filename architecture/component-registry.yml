# ---------------------------------------------------------------------------
# NOTE ON SEPARATION (requested during this pass): a dev-time LAYER INVERSION and a
# dev-dependency CYCLE are different findings and are recorded in different lists.
#   * `declared_layer_violations` holds edges that point at a higher layer, cyclic or not.
#     LV-04 (medulla-viz-core -(dev)-> medulla-jobs) lives here: it is a Layer-0 leaf reaching a
#     storage-layer crate, and it is NOT a cycle.
#   * `dev_dependency_cycles` holds edges that close a loop. DC-01 (medulla-modality against its
#     six modality crates) and DC-02 (medulla-rdf <-> medulla-shacl) live here.
# Conflating them was the original finding's error and it is not reproduced.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Declared layer violations. Every entry is an EDGE, so it belongs to a PAIR of
# components and is recorded here rather than under either one. This list is a
# reviewed, reasoned allowlist that must SHRINK -- it is not a ratchet and not a
# baseline: it hides no finding, grows only by a reviewed human edit with a stated
# reason, and D-MEDULLA-004's proposed gate fails when an entry stops matching reality.
# ---------------------------------------------------------------------------
declared_layer_violations:
  - edge_id: LV-01
    edge: "crates/medulla-tsdb -> crates/medulla-compute"
    from_component: medulla.timeseries
    to_component: medulla.compute
    kind: mandatory_normal_dependency
    verified_at: "crates/medulla-tsdb/Cargo.toml:59"
    verified_text: 'medulla-compute = { path = "../medulla-compute", features = ["finance"] }'
    in_default_and_full_closure: true
    disposition: layer_assignment_is_wrong_not_the_edge
    decision_ref: D-MEDULLA-002

  - edge_id: LV-02
    edge: "crates/medulla-kvcache -> crates/medulla-compute"
    from_component: medulla.kv-cache
    to_component: medulla.compute
    kind: optional_feature_gated_dependency
    verified_at: "crates/medulla-kvcache/Cargo.toml:37 (declaration), :63 (gate)"
    verified_text: 'medulla-compute = { path = "../medulla-compute", optional = true }   /   graph = ["dep:medulla-compute"]'
    in_default_and_full_closure: false
    in_default_and_full_closure_evidence: >-
      The root package declares medulla-kvcache optional (Cargo.toml:1646) and reaches it only
      through `kvcache-server = ["server", "oidc", "dep:medulla-kvcache"]` (:1026) and
      `kvcache-compression = ["kvcache-server", "medulla-kvcache/compression"]` (:1031). Neither
      enables `medulla-kvcache/graph`. `full` lists kvcache-server and kvcache-compression but
      not the graph feature, so this edge is absent from every default and `full` build.
    disposition: not_a_violation_of_the_restated_rule
    decision_ref: D-MEDULLA-002

  - edge_id: LV-03
    edge: "crates/medulla-tensor -> crates/medulla-tsdb"
    from_component: medulla.modality
    to_component: medulla.timeseries
    kind: mandatory_normal_dependency
    verified_at: "crates/medulla-tensor/Cargo.toml:24"
    verified_text: 'medulla-tsdb = { path = "../medulla-tsdb", default-features = false }'
    in_default_and_full_closure: true
    aggravating_fact: >-
      medulla-tensor's edge to medulla-modality is OPTIONAL (crates/medulla-tensor/Cargo.toml:31, behind
      the `contract` feature) while its edge to medulla-tsdb is MANDATORY. medulla-tensor is
      therefore not a modality leaf that happens to reach upward; in a default build it is
      a crate whose only workspace dependency is a storage-layer crate.
    disposition: real_violation_invert_the_edge
    decision_ref: D-MEDULLA-002

  - edge_id: LV-04
    edge: "crates/medulla-viz-core -(dev)-> crates/medulla-jobs"
    from_component: medulla.viz
    to_component: medulla.job-plane
    kind: dev_dependency_only
    verified_at: "crates/medulla-viz-core/Cargo.toml:58"
    is_a_cycle: false
    correction: >-
      The source finding calls this a dev-dependency CYCLE. It is not. medulla-jobs does not
      depend on medulla-viz-core -- medulla-jobs' path dependencies are exactly medulla-core,
      medulla-mutation-store and medulla-types. This edge is a one-way dev-time LAYER INVERSION (a
      zero-normal-dependency contract leaf reaching a storage-layer crate for a test), and
      the crate's own Cargo.toml documents it as deliberate: the edge is dev-only
      "precisely so the crate itself (and any default/normal build of it) never links
      medulla-jobs, medulla-types, medulla-core, medulla-mutation-store, or redb".
    path_currency_note: >-
      UPDATED 2026-09-13: `crates/medulla-mutation-store` no longer exists (see
      medulla.mutation-store.migration_lineage). Re-checked crates/medulla-jobs/Cargo.toml directly:
      its `[dependencies]` are now `medulla-types`, `medulla-core`, `medulla-storage`, `medulla-transaction` --
      the same relationship this correction describes (a normal, non-dev dependency on the
      storage-authority layer), just through the two successor crates instead of one. The
      correction's SUBSTANCE (this is a one-way layer inversion permitted by the restated
      rule, not a cycle) is unaffected. Text above left as originally written, since it was
      accurate against its own cited HEAD.
    disposition: permitted_by_the_restated_rule
    decision_ref: D-MEDULLA-003

dev_dependency_cycles:
  - cycle_id: DC-01
    crate: crates/medulla-modality
    dev_depends_on: [medulla-tensor, medulla-geo, medulla-document, medulla-image, medulla-audio, medulla-video]
    is_a_cycle: true
    evidence: >-
      All six depend on medulla-modality -- five directly, and medulla-tensor through its optional
      `contract` feature which medulla-modality's own dev-dependency turns on
      (`medulla-tensor = { path = "../medulla-tensor", features = ["contract"] }`). So each of the
      six edges closes a cycle. medulla-modality's Cargo.toml states the intent verbatim:
      the crate "EXPLICITLY permits cycles through dev-dependencies".
    components: [medulla.modality]
    decision_ref: D-MEDULLA-003

  - cycle_id: DC-02
    crate: crates/medulla-rdf
    dev_depends_on: [medulla-shacl]
    is_a_cycle: true
    evidence: >-
      medulla-shacl's normal dependency is medulla-rdf (crates/medulla-shacl/Cargo.toml:31,
      `features = ["rdf"]`), and medulla-rdf dev-depends on medulla-shacl for the ICV integration
      test (CONCEPT:MEDULLA-146). NOT NAMED in the source finding, and NOT in the corrected list that
      reached this lane during the pass (which states medulla-modality's is "the only genuine dev-dep
      cycle"). It is genuine: crates/medulla-shacl/Cargo.toml:31 declares
      `medulla-rdf = { path = "../medulla-rdf", features = ["rdf"] }` as a NORMAL dependency, and
      crates/medulla-rdf/Cargo.toml's [dev-dependencies] declares `medulla-shacl = { path = "../medulla-shacl" }`.
      medulla-rdf's own comment concedes it: "using it as a DEV-dependency here is a dev-dep cycle,
      which Cargo permits". Found by enumerating the dev path deps of all 48 crates rather than
      checking the two that were named. Retained over the correction, with the evidence above.
    components: [medulla.rdf-semantics]
    decision_ref: D-MEDULLA-003

