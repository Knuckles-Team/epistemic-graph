layer_model:
  authority: plans/refactor/inventory.yml -> inventory.repositories.medulla.target_layers
  target_layers: [types, core, storage-transaction, query-reasoning, server-protocol, composition]
  rule_as_written: >-
    "A crate may only `use` crates to its left. No storage or query crate imports server
    dispatch." (plans/refactor/DESIGN.md -> EG target crate graph, restated in the
    medulla-development skill.)
  rule_as_it_must_be_restated: >-
    See wiring decision D-MEDULLA-002. As written the rule is violated by roughly a dozen
    legitimate same-layer edges (medulla-ann -> medulla-numeric; medulla-shacl/medulla-shex/medulla-graphql ->
    medulla-rdf; medulla-plan -> medulla-query and -> medulla-epistemic; medulla-query -> medulla-compute; medulla-epistemic
    -> medulla-compute), so "to its left" cannot mean "strictly lower layer". It must mean
    "strictly-lower layer, OR same layer provided the [dependencies] graph stays acyclic".
  enforcement_today: >-
    Cargo acyclicity over [dependencies] only, and nothing else. VERIFIED: no
    crates/*/Cargo.toml declares `medulla` as a dependency, so a crate cannot
    depend back on the root facade. That property is real but it is NOT layer enforcement:
    medulla-tsdb -> medulla-compute and medulla-tensor -> medulla-tsdb are both upward edges that build fine.
    See D-MEDULLA-004.

