# Reviewed register of scripts/security/check_secret_history.py hits that are
# confirmed NOT live secrets, for a commit that already landed on `main`
# before this repo's first-ever push -- so the underlying patch cannot be
# rewritten without invalidating every SHA recorded in the refactor-program
# checkpoint/ledger and forcing every live lane to rebase (operator ruling,
# EH-313, 2026-09-19).
#
# This is NOT a blanket suppression. Modeled directly on
# .config/dupehound-distinct.toml's precedent (EH-264/EH-268):
#
# - Each entry is scoped to ONE exact (commit, file, pattern, content-digest)
#   tuple -- never the file, never the pattern globally, and never the gate.
#   All four fields must match a specific `credentialHits` finding exactly,
#   including `context_digest` (sha256 of the finding's own `context` text,
#   computed the same way `check_secret_history._context_digest` computes it
#   from a live scan) -- pinned the same way dupehound pins a function's
#   normalized-text digest: change the underlying content at all and the
#   digest stops matching, the entry goes stale, and the finding returns.
# - Recording an entry here does NOT license any future match of the same
#   pattern -- not in the same file, not in any other file, not in the next
#   commit to touch this same file. Every other hit is still a hard failure.
#   Proven mechanically, not just asserted: `check_secret_history.py
#   --self-check` plants a second, differently-shaped hit of the very same
#   pattern in a later commit and confirms it is still caught even with an
#   exception entry present.
# - Nothing here is written or updated by a tool.

