# Crate-split boundary manifest (MEDULLA-CONTRACT-R056).
# Source of truth for scripts/crate_split/edges.py and scripts/check_crate_graph.py.
#
# Path rule: an entry without ".rs" names a module: it covers `<entry>.rs` and everything
# under `<entry>/`. An entry ending in ".rs" names that single file. When several entries
# match a file the longest wins; two entries of the same length in different crates is an
# error. Every .rs file under src/ must resolve to exactly one crate.
#
# `# unplanned` marks an assignment the plan's "Target layout" does not name (best fit).
# `kind = "handler"` crates may not depend on each other (compile in parallel).
# allowed_deps lists manifest crates only; every medulla-* crate not in this file is a leaf
# crate and may always be depended on.
#
# Layering deviation from the plan text (reviewable): store is allowed for persistence,
# handlers and wire (they read redb snapshots directly); raft is allowed only for server.

[delete]
# Contract machinery (plan step 0). `enforce = true` once the removal landed makes
# check_crate_graph.py fail while any listed path still exists.
enforce = false


[crates.medulla-kernel]
kind = "existing"
# already extracted (PR #1039); remaining small top-level modules join it
exists = true
allowed_deps = []
paths = [
    "src/persist",
    "src/store_authority",
    "src/mutation_apply",
    "src/channels",  # unplanned
]

[crates.medulla-store]
kind = "store"
# redb store, layout, sidecar
exists = false
allowed_deps = ["medulla-kernel"]
paths = [
    "src/redb_store",
    "src/redb_layout",
    "src/sidecar_store",
]

[crates.medulla-raft]
kind = "raft"
# raft consensus
