# CONCEPT:EG-015/EG-016 — AVX2 build flag for the semantic store's SIMD kernels.
#
# EG-014's 8-lane chunked `dot_product`/`l2_norm` are written to vectorize, but the
# default `x86-64` baseline only guarantees SSE2 (128-bit / 4-wide f32). Raising the
# target to `x86-64-v3` enables AVX2 + FMA (256-bit / 8-wide f32), so the kernel emits
# one packed multiply-add per 8 lanes — the win the 8-lane accumulator was designed
# for, and the lever EG-014 left on the table on the brute-force/ANN-build path.
#
# This flag is OPT-IN, NOT a repo-wide default, on purpose:
#   * `target-cpu=x86-64-v3` bakes AVX2 instructions into the binary. On a host that
#     lacks AVX2 the process SIGILLs (illegal instruction). The fleet is heterogeneous
#     — some build/CI hosts are only x86-64-v2 (SSE4.2, no AVX) — so forcing v3 for
#     every `cargo build`/`cargo test`/`cargo run` would crash on those hosts.
#   * aarch64 targets keep their native NEON codegen regardless (the cfg below is
#     x86_64-Linux scoped), so this never touches non-x86 arches.
#
# Enable it ONLY for an x86 release/deploy build whose target profile requires
# AVX2, either by exporting RUSTFLAGS for that build:
#
#     RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release --features full
#
# or by uncommenting the target block below in the deploy checkout:
#
# [target.'cfg(all(target_arch = "x86_64", target_os = "linux"))']
# rustflags = ["-C", "target-cpu=x86-64-v3"]
#
# (Use `target-cpu=native` instead for a single-host build; `x86-64-v3` is the safe
# portable AVX2 baseline across compatible x86 hosts.)

# CONCEPT:AU-OS.governance.lane-partitioned-resources — generated by `agent-utilities lane bind-cargo`.
# Structural PARTITION binding (D-CP-4): a RELATIVE target-dir resolves
# relative to this file's parent directory (the worktree root), so the
# SAME committed file gives every worktree of this repo its own isolated
# cargo target dir for free — no per-lane content, no env var, no action
# needed after checkout. An exported CARGO_TARGET_DIR still overrides this
# (cargo's own precedence) — lane-guard's cargo-target-override check
# detects that case loudly; see docs/architecture/lane-concurrency.md.
#
# `rustc-wrapper = "sccache"` (D-PERF-1, test-suite acceleration program):
# caches every rustc invocation's object-code output keyed on the exact
# source+flags, so a cold clone on a second/third host (we build the same
# workspace from scratch on multiple build hosts routinely) or a re-run after
# `git clean` reuses compiled artifacts instead of recompiling all 65 crates.
# sccache defaults its cache dir to `~/.cache/sccache`; on hosts where $HOME is
# NFS-mounted, export `SCCACHE_DIR=/var/tmp/l9/sccache` (or another local-disk
# path) before building — sccache over NFS is exactly the kind of pathological
# I/O pattern that caused the 60-minute link hang this program exists to fix.
# NOTE: cargo hard-errors ("could not execute process `sccache`") if the
# binary is not on PATH — this is not a soft fallback. Every build host in
# the fleet installs it (`apt-get install sccache` / see AGENTS.md); a
# personal checkout without it installed should override with
# `CARGO_BUILD_RUSTC_WRAPPER=` (empty) rather than editing this file.
[build]
target-dir = "target-isolated"

# mold (D-PERF-1): linking 65 crates x 25 integration-test binaries is
# link-bound, not compile-bound, and mold is materially faster than the
# default bfd/gold linker on a many-core host (parallel section resolution).
# `-fuse-ld=mold` is understood natively by gcc>=12/clang>=12 (both present on
# our build hosts) with no `-B`/linker-path plumbing needed. Scoped to the
# x86_64 Linux target only (the fleet's build hosts); does not touch the
# aarch64 cross-build path used for wheel releases (maturin/zig), which has
# its own toolchain and where mold is not installed. Verify it actually
# engaged with `readelf -p .comment <binary> | grep mold` — a silently-ignored
# flag (e.g. mold not on PATH) falls back to the default linker with no error,
# so don't just trust the flag is set.
