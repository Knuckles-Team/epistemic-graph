[bumpversion]
current_version = 2.14.0
commit = True
tag = True

# pyproject.toml is intentionally NOT a bumpversion target: [project] version is
# `dynamic = ["version"]`, sourced from Cargo.toml by maturin at build time, so the
# file never contains a literal `version = "..."` string for bump2version to find
# (registering it here throws VersionNotFoundException on every bump/dry-run).

[bumpversion:file:Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = version-{current_version}-blue
replace = version-{new_version}-blue

[bumpversion:file:docker/Dockerfile]
search = ARG EG_VERSION={current_version}
replace = ARG EG_VERSION={new_version}
