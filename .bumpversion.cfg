[bumpversion]
current_version = 2.26.2
commit = True
tag = True

[bumpversion:file:Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

# Cargo.lock records THIS crate's own version too, and nothing was moving it.
# The bump therefore left the lock stale, `cargo` regenerated it inside the
# pre-commit hooks, and pre-commit failed the commit with "files were modified
# by this hook" -- so `bump2version` wrote every file, staged them, and then
# could not commit. The release simply stopped here, with a half-applied bump
# in the index.
#
# Matched on the two-line crate header rather than a bare `version = "..."`:
# that string appears once per crate in the lock, and pinning it to this
# package's own stanza is what keeps the rewrite from touching a dependency
# that happens to share our version number.
[bumpversion:file:Cargo.lock]
search = name = "epistemic-graph"
	version = "{current_version}"
replace = name = "epistemic-graph"
	version = "{new_version}"

[bumpversion:file:README.md]
search = version-{current_version}-blue
replace = version-{new_version}-blue

[bumpversion:file:docker/Dockerfile]
search = ARG EG_VERSION={current_version}
replace = ARG EG_VERSION={new_version}
